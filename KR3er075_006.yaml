body:
  text: 卷之六雜證一論頭痛有外感風寒氣虛血虛風熱濕熱寒濕痰厥腎厥真痛偏痛十種附發落及小兒禿瘡凡頭痛有久暫表裡之異以脈驗症以症合脈得其源而治之定奏速效而不難矣暫病者必因外感此風寒外襲於經也治宜發表最忌清涼久病者必看元氣此三陽之火熾於內也治宜清降最忌升散此治邪之法也夫病何以久也或表虛者微感則發或陽旺者微熱則發或水虧者虛火乘之則發或陽虛於上而陰寒勝之則發此等病症當重元氣而治本之藥十之六七治標之品亦帶一二自必手到病除不得少誤然亦有暫病而虛久病而實者虛者痛處必冷而喜熱實者痛處必熱而不寒其症顯然並驗平日之體以及平日所服之藥而細辨之自可得其源矣脈候寸口緊急或短或弦或浮皆頭痛浮滑為風痰易治短澀為血虛難治浮弦為風浮洪為火細與緩為濕凡頭痛自必多因必佐用風藥高顛之上惟風可到在風寒濕固為正用即虛與熱亦藉以引經一定之法也凡真頭痛腦為髓海受邪則死手足青至節也用艾灸百會穴穴在頭之正中二三壯猛進大劑間有生者須用參附之類方可祛邪立效散新治外感風寒頭痛暴甚畏風惡寒脈緊而數陳皮半夏茯苓甘草白芷川芎荊子各一錢羌活防風桂枝各八分北細辛三分蘇葉四分生薑五分熱服取汗如寒甚者冬季加麻黃去節五分夏天加麻黃去節三四分須佐以當歸一錢白芍七分不致大發先有汗者不用麻黃並去羌活此治太陽一切感冒發表之方也然各經皆有引經之藥條列於下如陽明頭痛脈浮緩而洪長自汗寒熱以升麻葛根白芷石膏為主少陽頭痛脈弦細往來寒熱以柴胡川芎為主太陰頭痛脈沉緩身休沉重或腹痛必有痰也以蒼朮半夏南星為主少陰頭痛脈沉細必寒厥以麻黃附子細辛為主厥陰頭痛脈浮緩項痛吐痰以吳茱萸川芎為主血虛頭痛當歸川芎為主氣虛頭痛人參黃耆為主氣血俱虛調中益氣湯或八珍湯少加蔓荊子細辛痰厥頭痛半夏白朮天麻湯風濕兼熱頭痛清空膏痛屬風熱如黃芩荊芥薄荷菊花之類可揀而用之痛屬熱厥者大黃酒炒可加或獨為末用茶調服陽明頭痛如裂壯熱如火屬風熱用石膏竹葉屬風寒用石膏蔥白茶煎屬風痰用石膏甘草川芎水虧火動者脈細數必有內熱治宜壯水如六味地黃湯加麥冬五味之類如水虧甚者相火必旺是無陽而陰無以生須用八味地黃之類補中益氣湯治氣虛頭痛或畏寒倦怠遇陰寒更甚治宜扶陽人參無者以淮山藥炙黃五錢代之黃耆蜜炙二錢白朮一錢八分炙甘草一錢當歸錢半陳皮八分升麻蜜炒三分柴胡酒炒三分薑五分棗二枚加川芎八分蔓荊子一錢北細辛三分溫服加味二陳湯新治痰厥頭痛非必痛因痰也而兼痰者有之或嘔惡咳嗽寸關脈滑者陳皮去白錢半半夏二錢茯苓二錢甘草一錢川芎八分蔓荊子一錢北細辛三分薑汁引如兼虛者加白朮錢半山藥炒黃三錢如兼火者加黃芩花粉各一錢半石膏二錢凡偏頭風左屬血虛右屬氣虛此大概言不可拘執有痛無定所此屬氣也頭風多害目者經謂東風生於春病在肝目者肝之竅肝風動則邪害肝竅也治以養血平肝去風加味四物湯新治偏頭風血虛暴痛將來害目當歸二錢血虛有寒者可多用血虛有熱者宜少用川芎一錢三分熟地二錢有熱症者加生地三錢白芍錢半白芷一錢羌活八分川獨活一錢蔓荊子一錢川烏制八分荊芥穗菊花各七分北細辛三分甘草八分速進一二三服外用生蘿蔔搗汁仰臥注鼻不用枕頭睡一刻三次即愈又用萆麻子仁乳香各二三錢搗為餅左右貼太陽穴婦人解發出氣否則害目無蘿蔔之時用旱蓮草汁即俗名墨斗菜代之亦可天香散治年久頭風不得愈者屬風痰大效南星半夏川烏去皮白芷各錢半薑汁半盞同煎服葛根蔥白湯治傷寒已汗未汗頭痛葛根白芍川芎知母生薑各二錢蔥白連根五莖溫服即單用蔥白二兩生薑二錢半治頭痛如破清空膏治偏正頭痛屬風濕熱及腦痛不愈者若血虛頭痛忌服川芎一錢柴胡一錢二分黃連酒炒防風各二錢羌活二錢甘草錢半子黃芩二錢一半炒一半生共為細末茶調下二錢加北細辛五分更效如系火邪其脈必洪口渴舌黃大便燥小便赤加白芍天花粉芩連知柏龍膽梔子之類可酌用之但治火之法不宜升散蓋外邪之火可散而去內郁之火得升而愈熾矣加味十全大補湯新治頭上冷而畏風或痛或不痛屬後天氣血之不足也經曰頭上諸病求之於真陰真陽而不得者其病在脾肺肝三經寒者如是諸症可以類推人參無者山藥三錢代之白朮錢半茯苓炙草當歸白芍川芎各一錢二分熟地黃耆蜜炙各二錢肉桂一錢升麻鹽炒柴胡酒炒各三分天麻錢半白附子如竹節者真八分溫服余病頭頂冷者多年得經言而制此方一服而愈錦囊祕方治偏頭痛有神荊子土茯苓金銀花菊花元參川芎天麻芽茶荊芥烏梅各等分黑豆加倍清震膏治雷頭風突起核塊及頭中如雷鳴升麻二錢蒼朮三錢青荷葉一大個全用乾者用二個水煎食後服有因痰火者耳如雷鳴脈洪而實用半夏五錢大黃煨一兩天麻三錢黃芩三錢薄荷葉一錢五分甘草二錢共研末水和為丸臨臥茶吞二錢以痰利為度普濟消毒飲治天行時疫邪客上焦頭痛莫當腫大如斗黃連黃芩各一錢二分人參有一方不用橘紅元參鼠黏子甘草連翹桔梗各錢半板藍根馬屁勃各九分白薑蠶八分升麻五分柴胡一錢薄荷葉八分食後服如大便祕加酒煨大黃一二錢輕者名發頤腫在兩耳前後用甘草桔梗各錢半薄荷荊芥連翹鼠黏子黃芩各一錢水煎服又方用貫衆三錢葛根二錢甘草錢五分薑蠶一錢黑豆二錢煎服其效如神黃芩羌活湯治眉稜骨痛外挾風寒內成鬱熱有兼痰濕者防風羌活各錢半黃芩甘草各一錢二分煎服又方用黃芩酒炒同白芷等分為末茶下生熟地黃湯治眼眶痛由肝虛見火更痛甚者生地熟地各錢半甘菊枳殼各一錢杏仁去皮八分淮牛膝二錢石斛二錢黑豆炒二十粒煎服或加分量蜜丸用黑豆炒淬酒送丸三錢調中益氣湯治氣血兩虛頭痛黃耆蜜炙錢半人參甘草蒼朮各八分橘紅六分木香柴胡酒炒升麻蜜炒各三分加川芎蔓荊各八分北細辛三分空心服備揀古來治頭上諸病至簡至穩神方於後以便取用偏正頭風天麻二兩半川芎一兩研末蜜丸食後或茶或酒送下又方白附子白芷牙皂去皮等分為末食後淡茶調下又方白芷炒二兩半川芎炒甘草炒川烏半生半熟各一兩共為末每服錢半淡茶調下或薄荷湯下又方用蘿蔔搗汁仰臥滴於鼻內睡一刻余屢用神效若無蘿蔔時以旱蓮草汁代之又方虎頭骨酒炙黃研末酒調服又方白芷川芎各二錢研末以黃牛腦子擦藥末於上瓷器內加酒頓熟乘熱食之儘量一醉醒則其病如失又方雄黃北細辛等分為末左痛吹右鼻右痛吹左鼻又方口含溫水以蓽茇研末右痛吹右鼻左痛吹左鼻凡頭痛俱用川芎屬風寒者宜用之若三陽火壅於上而痛者得升反甚不得概用凡頭髮不長用芝麻葉桑葉煮米泔沐之七次可長數尺又桑椹浸水洗頭長髮桑白皮柏葉煎水沐之發不脫女人發易落而不潤者用棐子三個胡桃二個去殼側柏葉一兩搗爛浸冬雪水梳頭發不落而潤凡眉毛屢落用生半夏搗途即生凡發白用旱蓮草煎膏內服燒研末外揩牙堅齒益腎烏髭凡腦崩鼻流臭黃水而痛名控腦砂內有蟲也用絲瓜藤近根三五尺焙乾燒存性每溫酒下一錢凡禿瘡用麻油之蠟燭油頻塗忌日曬久則發生頭瘡用菖蒲研末麻油調敷瘡內生蛆以刀切破擠出蛆用絲瓜葉搗汁塗之絶根又方以青礬末摻之蛆化為水凡無病人忽然脫髮頭皆見肉是心虛有火也用何首烏一兩當歸三錢天冬麥冬各二錢服之神效凡小兒頭瘡胡桃去殼和皮燈上燒熟入輕粉一分搗為末麻油調塗二三次愈頭面癢瘡流血水用蛇床子一錢輕粉三分為末麻油調敷禿瘡用蜈蚣一條鹽一分麻油浸七日取油塗之禿瘡用冷泔洗浸以蔥和蜜搗塗白禿燥痛用香薷二兩水煎取汁半盞入胡粉一兩豬脂五錢和勻塗之二論面病赤是血熱腫是風熱酒皶是血熱疱是風熱皯𪒟是風邪客於皮膚雀斑是痰飲潰於腑臟女人名粉滓斑靈樞曰十二經脈三百六十五絡其血氣皆上於面是面為手足六陽之匯皮厚肉堅故天熱甚寒不能勝也然其部屬之陽明其或飲食不節則胃病氣弱神少火鬱而生熱又或外挾風熱而火上燎面熱乃胃火也亦有因飲食之熱毒聚於中發於外則為痛更有過勞與飢則痛者此中氣不足也總之暴痛多由火實久痛多因血虛且有胃寒則面寒若面白而鼻冷者乃陽氣大弱也醫者切脈察症病源昭然自手到而病除矣升麻加黃連湯治火鬱面熱升麻葛根各一錢白芷七分白芍犀角甘草炙各五分川芎荊芥穗薄荷各五分黃連酒炒四分水煎溫服升麻加附子湯治胃虛面冷升麻葛根白芷黃耆蜜炙附子制各七分益智仁五分人參甘草炙草豆蔻各五分連根蔥頭二莖水煎溫服柏連散治面上惡毒熱瘡胡粉黃連黃柏等分為末豬脂調敷參耆附子湯治面白鼻冷陽氣大虛人參黃耆蜜炙二錢附子制錢半甘草炙一錢白朮一錢五分水煎服凡人面腫有虛有實實者或熱或痛乃因風火上炎及感冒風寒瘴疫之邪脈必緊數症必寒熱風則散之火則清之壅滯祕結者通之利之邪去而腫自消也防風通聖散治內外邪熱俱甚便結脈實頭面腫痛防風川芎當歸白芍連翹薄荷石膏各一錢麻黃七分黃芩一錢桔梗八分滑石四錢大黃一錢祕若甚者二錢甘草白朮梔子各一錢荊芥七分生薑三片煎服再不下加芒硝二三錢凡虛浮者無痛無熱面目浮腫或脾肺陽虛輸化失常此氣虛也宜補中益氣湯或肝腎陰虛泛溢上行此水虧也宜六味八味地黃湯並於腫脹門參而閲之更得調治之道若酒過濕熱上腫宜用葛花解酲湯人參無則改用威參四錢白朮一錢茯苓砂仁白豆蔻肉微炒研葛花各一錢神麯五分青皮陳皮豬苓渾瀉各七分廣木香三分水煎服白虎湯治陽明實熱胃火上炎煩熱乾渴脈實面腫石膏一兩知母二錢甘草一錢糯米一撮水煎服備採古來治面諸病至簡至穩神方於後以便取用麵皮爪破用輕粉生薑汁調敷無痕洗面去黑用天門冬蜜搗為丸日日洗用面黑皯𪒟如蒺藜白芨苦參零陵香各研末俱可洗之面上諸風百病用白附子煎服如有疵皯酒和貼之自落風刺粉滓用白牽牛酒浸為末塗之皯𪒟不白用冬瓜子仁搗丸服面白如玉雀斑用桃花冬瓜子仁研蜜塗頭面諸風皶疱用杏仁末雞子白調塗面有瘢痕用焉齒莧洗之酒皶赤鼻用黃丹雄黃末桐油調塗面黑用白薑蠶白牽牛蜜和摻之面瘡用牙皂絲瓜燒灰擦之又方柳葉煎湯洗之面生皯𪒟皶疱黧黑狀醜以雞蛋酒浸七日每夜用白塗之病去面白如玉又方用羖羊脛骨為末雞子白和敷旦以白米泔洗之面白神效又方用雞子白和硃砂末仍入雞子殼內封固令白雌雞同抱至雛出取塗面不四五度其白如雪面上斑點用陀僧末人乳調夜塗旦洗三論眼目有赤目傳變內障昏盲外障翳膜物傷眯目眼目者五臟六腑之精華如日月之不可掩者也大眥屬心白睛屬肺烏珠屬肝上下瞼胞屬脾瞳人屬腎然所重則在乎瞳人而其竅則出於肝也腎屬水肝屬木水能生木子母豈能相離乎故肝腎之氣充則精彩光明肝腎之氣衰則昏蒙眩暈是固然矣然心者神之舍又所以為肝腎之副焉何則心主血肝藏血凡血熱沖發於目者皆當清心涼肝又不可執水生木之説也至於目之有時而失明者四氣七情之所害也凡在腑為表當除風散熱在臟為里當養血安神如暴赤腫痛昏澀翳膜眵淚斑瘡皆表也風熱也宜表散以去之如昏弱不欲視物內障見黑花瞳人散大皆里也由血少神勞腎虛也宜養血補水安腎以調之久則有瘀當以破血生新之味兼用以上所論表裡即虛實之大概也然而實中亦有兼虛者此於腫痛中亦當察其不足虛中亦有兼實者又於衰弱內辨其有餘雖虛實殊途自有形氣脈色可診可辨知斯二者目症無餘義矣凡治目當辨色黃赤者多熱氣宜清肝瀉火青白者少熱氣宜壯水扶陽然目黃亦有虛實之異實熱之黃以濕熱內蓄鬱蒸而成清其熱而黃自退若虛寒之黃以元陽日剝津液消索而然既無煩熱脈症惟有乾涸枯黃此則其衰已甚須大加溫補始可救治若再清利鮮不誤矣凡眼赤腫是火邪上炎內用苦寒之藥以治其本然火邪既客於目從內出外若外用寒涼以阻之則火內郁不得散矣故點藥用辛熱洗眼用熱水是火鬱則發之從治法也世人不知冰片為辛熱藉以引出火邪而誤認為涼常用點目遂致積熱莫散且香竄泄精則昏暗障翳故云眼不點不瞎者此也目者肝之外候膽者目之精華也膽汁減則目暗故諸膽皆治目疾病有內外治各不同內病須湯藥外病須點藥必內外夾攻方盡其妙但白珠屬陽故晝痛點涼藥則效黑珠屬陰故夜痛點涼藥則反甚是點藥亦宜分陰陽也倒睫拳毛者由伏熱內攻陰氣外行目緊皮縮之故也治者用參耆補氣為君則眼皮自上又須佐以辛味疏散之品切忌芍藥五味之酸收也靈樞曰精脫者耳聾氣脫者目不明何則眼居諸陽交會之所而陰反閉之陽亡已極陰邪內滿所以不明故目病而有火者則為浮翳外障雖腫痛難忍無害於目也若目病而無火者便為冰翳內障雖無所苦必至於喪明矣治目者豈可專以去火為事耶目病有本有標標者邪火為患清之利之火息而病自愈本則在於陰陽陰陽合德而為精明非氣血獨能充其力也蓋氣血為陰陽之標而陰陽實為氣血之本陰虧熱邪火乘之赤腫暴痛而視物則見是陰病而陽未病也治者補其真陰以濟火六味湯主之陽虛則寒曰翳遮睛珠不甚痛仍能開目但視而不見乃陽氣自病是為無火治者補其真陽以配陰八味湯主之如是則陰陽合德而為精明之用矣凡翳起於肺經受熱而如碎米者易散如梅花片者難消然翳自熱生治法宜先退翳而後退熱去之乃易若先去赤熱則血為之寒而翳不能去此先後之道所宜知也清熱瀉火湯新治目暴痛赤腫羞明等症生地錢半赤芍一錢二分白芷一錢川芎八分荊芥七分大黃酒炒錢半薄荷七分羌活七分防風連翹各八分甘草八分黃芩一錢山梔炒黑一錢獨活八分水煎食後服如夜痛甚加細辛三分夏枯草一錢加減五積散治外感風寒濕熱目痛赤腫太陽疼痛等症當歸白芍蒼朮各一錢麻黃桔梗羌活荊芥甘草各六分陳皮防風各七分厚朴枳殼半夏川芎白芷各八分蔥三莖水煎服加減一陰煎治陰虛火盛目赤澀痛熟地三五錢生地白芍麥冬各二錢甘草七分知母地骨皮黃芩各一錢梔子炒黑八分水煎服濟陰地黃丸治水虧血少本無火症目昏倦怠不能視物熟地四兩山藥二兩山茱萸當歸各二兩枸杞巴戟肉各二兩麥冬兩半去心肉蓯蓉二兩半酒洗去甲五味子一兩甘菊花一兩五錢煉蜜為丸空心白湯下人參養榮湯治陰中陽虛目皆莫視身倦口渴心悸自汗等症人參黃耆蜜炒當歸白朮甘草炙桂心茯苓白芍酒炒各一錢陳皮八分熟地錢半志肉五分五味子四分薑棗水煎服蟬花散治肝經風熱毒氣上攻目赤痛澀及一切內外翳障蟬蛻菊花羌活甘草炙穀精草木賊川芎白蒺藜草決明梔子炒防風蜜蒙花荊芥穗蔓荊子黃芩各等分上為末每服二錢食後茶清調下還睛散治翳膜遮閉昏澀淚出瘀血胬肉攀睛川芎膽草草決明石決明荊芥穗各一兩川椒皮炒出汗一錢甘菊花茺蔚子楮實子茯苓各一兩白蒺藜炒七錢木賊甘草各七錢上為細末每服二錢茶清調下日三服雞魚蕎麥麵一切熱物悉忌丹砂散點治一切目病系李時珍之方爐甘石上好者煅童便淬七次海螵蛸硼砂各一兩硃砂二錢冰片四分上研極細末瓷瓶收貯日用點之又方用爐甘石二兩黃連一兩入瓦器內水煮二伏時去黃連以爐甘石為末入冰片三分收貯頻點取效光明丹點治風熱目赤腫痛爛弦風眼及內外翳障爐甘石制一兩硃砂一錢硼砂二錢輕粉五分乳香制五分沒藥制五分膽礬三分銅緑五分冰片三分麝香一分黃丹五分上研極細末瓷瓶收用除障復明湯治內障失明者一料復元屢試屢驗羯羊肝一具瓦上焙乾熟地二兩菟絲子蕤仁麥冬各一兩車前子地膚子五味子防風黃芩茯苓各一兩杏仁炒枸杞子茺蔚子苦葶藶青葙子各一兩細辛四錢上為末煉蜜丸日三服加肉桂四錢更妙萬金膏治爛弦風眼赤眼如神作以施人價廉功大五倍子黃連防風荊芥穗各五錢苦參四錢銅緑五分上為極細末以薄荷煎湯和丸彈子大臨用時以熟水化開乘熱洗眼日三次立愈神效夢治目障神方治男女內外障翳或用藥三五月不效者用好焰硝一兩銅器內燒溶入飛過黃丹一分拌勻取起加冰片二分細研入壇收之每點少許其效如神此夢神救目之方也備揀古來治目諸病至簡至穩神方於後以便取用翳障遮睛用鹽研細末以燈草點患上目赤癢痛用黃連少加明礬人乳浸蒸點角目痛夜甚用涼藥不效者以夏枯草五錢煎服夏枯草夏至陰生稟純陽之氣以勝濁陰補養厥陰血脈故治厥陰鬱火目痛如神或用夏枯草二兩香附兩半甘草四錢為末每用茶清調下錢半下咽即愈病後青盲用淫羊藿一兩淡豆豉一百粒煎服睛出泡起名曰肝脹用羌活五錢煎服風眼爛弦用五味子蔓荊子煎洗目生赤翳用枸杞子搗汁日點三五次風眼爛弦用麻油浸晚蠶砂三夜細研塗之石菖蒲洗淨根上泥土安盆中以石壓其很漬以水可數年不枯夜置几上則收燈煙不害目後置星露下至旦取葉尖露水點目其明可日見星斗頭風射目必瞎用蕎麥末水調作餅如錢大安眼四角各以豆大一炷之艾灸之即效飛絲入目用茶葉搗汁點之即墨點之亦出赤翳攀睛用海螵蛸為末蜜和點之凡牛目障翳亦用海螵蛸末點之內障不明用夜明砂淨淘一兩二錢蟬蛻當歸木賊去節各一兩黑羊肝四兩水煮熟搗和為丸食後服其明如初目翳重者用豬膽皮燒灰點目病十年青盲者取白犬生子目未開時之乳頻點之狗子目開即瘥凡目疾用羯羊膽入蜂蜜於內蒸熟候乾研膏點之即愈名二百草花膏失明多年用蔓荊子醋蒸三遍為末服十得九愈胬肉瘀突硼砂少入冰片點之眼生偷針用布針一個對井睨視已而折斷投井中勿令人見風眼赤爛皮硝以水煎化露一夜澄清日洗三次雖年久亦愈凡物入目用食鹽泡水洗之目不如先之明用夜合樹根皮煮豬肝食之眉毛脫落用雄黃末醋和塗之眼目打傷青腫以生半夏為末水調塗之恐暴赤目疾傳染於洗面時開目於水照二三轉欲茶湯時亦照之自不染凡目疾用羊肝一具蒸熟搗化加黃連末一兩丸服自愈每年九月二十三日桑葉煎湯洗目一次永絶昏暗老能細書暴赤眼痛用黃連一分研細末入雞子白碗中久攪自白沫上浮連點之而愈羊肝丸治內障多年夜明砂淘淨當歸蟬蛻木賊去節各一兩為末黑羊肝四兩水煮搗和丸食後水下五十丸夢神授方最效四論鼻證流濁涕為鼻淵是腦受風熱流清涕為鼻鼽是腦受風寒包熱在內腦崩臭水為腦漏是下虛上熱亦腦內有蟲鼻塞無聞是陽明風熱鼻生瘜肉是陽明濕熱鼻痛是陽明風熱肺開竅於鼻陽明胃脈亦挾鼻上行以竅言之肺也而以用言之心也然總之鼻症不一非風寒外感即陰虛火炎治外感者宜辛散治內熱者宜滋陰以降火治法大綱盡乎是矣川芎散治外冒風寒經絡壅塞或頭痛或鼻塞宜解表也川芎藁本白芷羌活甘草炙各一錢細辛四分蒼朮錢半薑三片蔥白三寸熱服如麻黃紫蘇荊芥之類皆可神愈散治風熱在肺鼻流濁涕窒塞不通細辛四五分白芷防風羌活半夏川芎桔梗陳皮茯苓各一錢當歸錢半薄荷四分薑引黃芩知母湯治心肺火邪上炎鼻塞流涕而熱者黃芩知母桑白皮杏仁山梔花粉川貝母枯梗甘草各一錢食遠服如大便燥加大黃竹葉蒼耳散治鼻淵常流濁涕由太陽督促之火甚也蒼耳炒二錢半白芷一兩辛荑仁薄荷葉各五錢上研細末每服二錢或蔥湯或茶清食後調下清化飲治濕熱上蒸津汁溶溢而下離經腐散致涕臭者白芍麥冬各二錢丹皮茯苓黃芩生地各二三錢白蒺藜三五錢石斛一錢蒼耳二三錢炒如熱甚而渴加石膏腦漏祕方治鼻中時流臭水俗名控腦砂有蟲食腦中用絲瓜藤近根三尺曬乾燒存性為細末酒調服之即愈黃白散治鼻生瘜肉阻塞氣道謂之鼻齆雄黃白礬細辛瓜蒂炒等分共為末以雄犬膽汁和為丸如棗核大塞鼻即細辛為末吹鼻亦效輕黃散治鼻中瘜肉輕粉二分雄黃一錢麝香一釐杏仁去皮二分先研杏仁次將余藥合研於臥時用箸頭蘸米粒許點瘜肉上半月見效白礬散治肺經風熱鼻生酒皶白礬硫黃乳香等分用茄汁調敷又方用硫黃輕粉各一錢杏仁五分共為末以津唾調搽又方以銅緑為末晚時切生薑蘸擦之備棟古來治鼻諸病至簡至穩神方於後以便取用鼻中生肉贅極臭極痛以白礬加硇砂少許吹上化水而消內服清濕熱之藥鼻塞久不聞香臭者用生蔥分作三段早用蔥白午用中段晚用末段搗塞鼻中氣透自效鼻赤用大黃朴硝等分為末津調塗之疳蟲食鼻用五倍子燒存性研末摻之風刺赤鼻用大風子仁木鱉子仁輕粉硫黃為末夜唾津塗之鼻中生瘡用黃柏檳榔研末豬脂調敷鼻中瘜肉用冰片點之或細辛末時時吹之鼻中生瘡以桃葉搗爛塞之無葉用枝鼻瘜鼻痔用狗頭骨燒灰加硇砂日吹之化為水又方用雄黃一塊塞鼻十日自落鼻中生毛挺出數寸痛不可忍用硇砂乳香為丸服十粒自脫鼻瘡用杏仁大黃研末吹之又方用陀僧白芷研末點之鼻衄即鼻血也不止用白芨研末水調服二錢外塗山根即鼻上起處上又方血三五日不止者人中白新瓦焙乾入麝香少許溫酒調服又方服生葛根汁三次又方用山梔四錢炒黑煎服又方用蔥搗汁入酒少許滴鼻中即覺血從腦上散下又方搗蒜貼足心又方以發燒灰塞鼻中又方以墨磨茶服又方以冷水濕後頸窩鼻竅閉不聞香臭用白薇貝母款冬花百部等分研末米湯調下鼻淵用細辛四分辛荑白芷各錢半水煎服鼻塞不聞香臭每日用桑白皮七八錢煎服一七自通鼻皶赤皰用陀僧為末人乳調敷日夜常洗鼻準赤色用雄黃硫黃各五錢水粉二錢以初生乳汁調敷二三次愈衄血不止以硼砂一錢水服立止鼻生紅點癢則搔爛出風水用穿山甲炒一錢全斑蝥二個糯米十八粒拌炒黃去米同甲研末麻油調塗神妙五論耳病耳聾耳鳴有腎虛氣虛火鬱風熱四種耳痛屬風熱停耳屬濕熱凡耳痛耳鳴耳閉耳聾當辨虛實而後症可治也暴病者多實久病者多虛少壯熱盛者多實中衰無火者多虛飲酒味厚素有痰火者多實質清脈細素行勞苦者多虛且耳為腎竅腎氣充足則耳目聰明經曰人年四十而陰氣自半半即衰之謂也陰衰腎虧每多耳鳴聾之漸也聾者氣陰也此外又有火閉者因諸經之火壅塞清道其症或煩熱或頭面赤腫者皆是宜清之氣閉者因肝膽氣逆必憂鬱恚怒而然宜順氣舒心邪閉者因風寒外感邪傳少陽而然宜和解之竅閉者必因損傷或取耳或雷炮震之或停耳潰膿而壞宜用法以通之以外止有腎虧虛聾非大培根本不可故謂暴聾者易治久聾者難愈也清熱湯新治一切實火上炎耳痛目疼口渴咽燥等症黃芩黃柏麥冬白芍梔子甘草各等分熱甚者冷服如痰熱者加膽星渴甚者加花粉熱在上焦頭面紅赤者加生石膏熱在肝經脅痛者加膽草胃熱而大便燥結者加大黃不應加芒硝血虛者加生地青蒿五心熱者加元參熱在心經而舌黃者加黃連熱結膀胱小便不利者加車前澤瀉舒氣釋郁湯新治肝膽恚怒氣逆耳閉香附枳殼川芎陳皮各一錢木香三四分當歸錢半蘇梗五分柴胡酒炒八分薄荷四分薑五分引小柴胡湯治寒邪傳至少陽耳聾者此屬半表半裡之症以此和解之柴胡二錢半夏半錢人參甘草各八分黃芩錢半薑棗引加味益氣湯新治勞苦太過氣虛耳聾或耳鳴眩運倦怠等症人參當歸甘草炙各一錢白朮錢半陳皮八分川芎六分黃耆蜜炙二錢升麻蜜炒柴胡酒炒各三分石菖蒲六分薑棗引無參者以淮山藥三錢代之或以時下生條參三錢代之十全大補湯治氣血兩虛耳鳴耳閉人參或以淮山藥炒黃三錢代之白朮錢半茯苓炙甘草各一錢當歸一二錢撫芎一錢白芍酒炒一錢熟地二錢黃耆蜜炒二錢肉桂錢半石菖蒲炒六分薑棗引肉蓯蓉丸治腎虛耳聾肉蓯蓉揀大鮮紅者酒洗去甲四兩菟絲子淘淨泥砂酒蒸四兩棗皮酒蒸四兩茯苓三兩熟地八兩肉桂附子各二三兩人參隨便白芍酒炒二三兩黃耆蜜炒四兩羌活防風各兩半澤瀉一兩二錢羊腎一對去筋膜同肉蓯蓉棗皮地黃搗成膏合各藥末加煉蜜為丸每早或用酒或鹽水下七八錢即改用八味地黃丸亦可備揀古來治耳至簡至效諸方於後以便取用耳聾用芥菜子搗碎以人乳調和綿裹塞耳數易之即聞又方用巴豆一粒去皮膜慢火炮極熟次以蒜一瓣剜孔入巴豆綿包塞耳三次效又方用骨碎補削作條火炮乘熱塞耳中又方用巴豆一粒去心斑蝥一枚去翅足合搗膏綿裹塞耳再易甚驗又方以酒浸針砂一日去砂將酒含口中用活瓷石一塊綿裹塞耳此導氣通閉法也腎虛耳聾真瓷石一豆大穿山甲二片燒存性研末棉包塞耳口含生鐵一塊覺耳中有風水聲即通又方以活瓷石五分入聾耳生鐵搗碎綿包入不病耳自然通透耳猝閉用甘遂半寸綿裹塞耳中口嚼甘草少許耳忽聾用蚯蚓安蔥內入鹽少許化為水點之立效耳鳴屬腎虛者以椒目巴豆菖蒲研末用松脂黃蠟溶和為挺插耳中一日一易神效腎虛耳鳴用豬腎切片以骨碎補研末摻上煨熟食之又方以胡桃煨熟乘熱入耳並早晚煨熟食之即通以上治耳聾耳閉耳鳴方耳外膿瘡用五倍子研末摻之耳泔出汗用青黛黃柏研末吹之停耳有膿先以紙條繳淨用菖蒲汁滴之或為末吹之即病後耳聾亦效又方用柑樹嫩尖七個入水數點搗汁滴之極妙又方用海螵蛸入麝少許研末吹之又方用爐甘石煅研末白礬同黃丹末輕粉末皆可吹之以上治耳膿汁耳內痛用鐵磨水滴之耳內大痛如蟲在內走或流血水或干痛用蛇蛻燒灰吹之立止凡蟲入耳以川椒研醋調灌之立出又方以紙塞耳鼻蟲入之耳勿塞勿言立出又方如蔥汁韭汁桃葉汁薑汁皆可滴之耳內結核痛不可動用火酒滴之側臥半時即潤起可取六論口病口苦是肝膽熱干是脾熱酸是濕熱澀是風熱辛是燥熱淡是胃熱麻是血熱生苔是脾熱閉咸是脾濕熱兼腎虛口糜爛是膀胱移熱於小腸口者五臟六腑所貫通也臟腑有偏勝之疾則口有偏勝之症病原以口苦屬心火然亦有思慮勞怠色欲過度者多有苦燥無味之症此心脾虛則肝膽邪溢而為苦肝腎虛則真陰不足而為燥又以口淡屬胃火不知大病大勞大瀉大汗之後皆口淡無味豈胃火耶總之無火症火脈則不宜以勞傷作內熱而妄用寒涼也凡口渴喜冷水脈實便結者是火盛於上宜清肺胃也若有口雖渴喜熱湯而便溏且有不欲飲茶湯者是干而非渴系陰虛宜補脾腎並有陽虛而陰無以生者又當水火併濟如八味地黃湯之類是也凡口臭有胃火亦有脾弱不能化食而作餿腐之氣者宜調補心脾若專用涼藥反生他病口唇屬胃足陽明之脈挾口環唇故脾胃受邪則唇病風則動寒則緊燥則干熱則裂氣鬱則生瘡血少則無色上唇生瘡蟲食其臟下唇生瘡蟲食其肛若人中平滿者為唇反肉先死也附論舌病腫脹是心脾火毒瘡裂是上焦熱木強是風痰濕熱短縮是風熱舌出數寸有傷寒産後中毒大驚數種經曰舌乃心之苗又曰心脈系舌本脾脈絡舌旁系舌下故發為病者皆二經之所致也然肝脈亦絡舌本故風寒所中則捲縮而不言七情所郁及心經壅熱則舌腫心熱則裂而瘡肝熱則木而硬脾熱則澀而苔肺熱則強熱甚則乾燥如鋸無故白痹者由心血不足虛火爍耳用四物合理中治之若舌卷囊縮者不治厥陰絶也元參散治三焦火甚口舌生瘡元參黃芩黃柏大黃前胡獨活犀角屑炙甘草麥冬升麻梔子等分水煎服甘露飲治胃熱口瘡火之微者大有神效熟地生地天冬麥冬黃芩石斛枇杷葉去毛枳殼甘草犀角屑等分水煎食後服竹葉石膏湯治胃火口舌生瘡口渴便結石膏煅三錢淡竹葉薄荷葉桔梗木通甘草各錢三分水煎服龍膽瀉肝湯治心肝火邪上攻口舌瘡痛及舌木而硬膽草酒炒天冬麥冬甘草黃連炒山梔子知母各七分黃芩柴胡各一錢五味三分內有人參五分少之亦可二陰煎治勞傷心脾火發上炎口舌生瘡生地三錢麥冬棗仁各二錢甘草一錢元參錢半木通茯苓各錢半黃連一錢淡竹葉二錢水煎服理中湯治口瘡脈虛用涼藥不效者必系無根虛火人參一錢無者用淮山藥四錢炒黃代之白朮二錢乾薑炒一錢甘草炙一錢煎出冰冷服或加熟地四錢當歸二錢以治陰陽兩虛再用涼劑則危外用蜜炙附子含而咽之或用肉桂亦可細辛黃柏散治一切口舌瘡痛黃柏細辛等分為末敷之涎吐再敷加黃連亦妙陰陽散治一切口瘡黃連一兩乾薑炒黑三錢為末敷之涎出即愈金光煎治舌上出血名為舌衄此心火上溢也先用黃連三五錢濃煎徐徐服之不效速用此方黃柏二兩黃連二錢五分梔子十五枚水煎頓服應手散治舌出不收用上冰片五分或一錢為末搽舌即愈緑雲散治口瘡爛臭黃柏蜜炙青黛等分臥時摻舌上咽津妙黃蓮朴硝散治口瘡黃連朴硝白礬各五錢薄荷葉一兩共研細末臘月將末入黃牛膽內風前挂兩月取下遇口瘡再研敷之去其熱涎即愈口臭用香薷濃煎含漱咽之又方用北細辛煎汁熱漱冷即吐之備揀古來治口舌諸病至簡至穩神方於後以便取用口瘡用五倍子為末摻之又方用黃柏蜜炒為末敷之又方用蚯蚓吳茱萸研末加面醋調塗足心口角喎斜用萆麻子仁七粒搗膏左斜貼右右斜貼左又方用鱔魚血加麝香少許左斜塗右右斜塗左口腥肺熱也用桔梗知母黃芩桑白皮煎服口臭用大黃略燒研末揩牙又方用北細辛白豆蔻煎水含之舌腫及重舌用蒲黃末頻摻之以能涼血活血立效加乾薑亦妙舌出血海螵蛸蒲黃為末敷之傷寒舌出用紙包巴豆一粒納鼻中重舌用皂角刺煎汁漱之又方用五靈脂醋煎含之小兒重舌用鹿角磨水塗之凡重舌用針於舌下紅絡青絡開叉處刺出血即愈中風舌強用雄黃荊芥為末酒服口咸用知母烏賊骨煎服凡口瘡用細辛或生附子或吳茱萸為末並以醋調敷足心婦人産後舌出用硃砂末敷之仍於耳後乘其不覺而大喊驚之則收再用五倍末摻之舌忽腫滿或硬於木石但看舌下或如臥蠶者急於腫處重刺出血用釜底煤細研以水調厚敷脫去再敷若遲則閉悶而死須內服清胃降火之劑口瘡用薔微花根濃煎先漱後服神效
