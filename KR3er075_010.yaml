body:
  text: 卷之十雜證二十七論痢疾有積滯濕熱暑毒虛滑冷積蠱毒六種痢疾即內經之所謂腸澼也病多在夏秋之交炎暑惟盛酷熱之毒蓄積為痢然亦有因熱貪涼過食生冷積聚於中逮夫秋涼伏陰內動變而為痢此其病在寒邪又不屬暑熱也治者當辨虛實寒熱四者明而收功易矣實者脈滑身強脹滿堅痛行之瀉之宜從標治虛者脈雖緊數而無力或弦而中空者體弱色白證屬脾弱宜溫補脾土但使脾溫則寒自去即所以逐邪也熱者脈滑有力畏熱喜冷口渴尿赤或下鮮血涼之利之邪去而愈若無熱證而痢不止必是虛寒非溫補脾腎不可然相似之際尤當審察實熱者口渴多喜冷水虛熱者瀉痢則液亡於下自津涸於上但渴而不喜冷也實熱者必腹痛脹而拒按虛熱者痢出膿血刮臟剝膚但痛而不脹並喜按也實熱者小便短赤澀痛虛熱者水從痢去液以陰亡溺亦短而赤但不熱不痛耳實熱者裡急後重虛熱者圊後不減以解後愈虛也及裡急頻見汙衣者皆虛寒也並以脈之虛實體之強弱年之老少病之新舊參而詳之寒熱虛實自昭然矣至有因濕熱者去之因積滯者消之因氣者調之因血者養之新病而實者可以通因通用久病而虛者可以塞因塞用是皆常法無待言矣獨怪世之病痢者十有九虛而醫之治痢者百無一補不知脈弱者體虛者氣下陷者疾後而痢者因攻而甚者俱皆當補凡四君歸脾十全補中以補脾虛在所宜然若病火衰土虛無母須用桂附大補命門以復腎中之陽以救脾家之母則真元復而百病自愈矣論脈沉小微弱者吉洪大數者死沉弦者重大者為末止微弱者欲自止死證如屋漏水者大孔如竹筒者唇若塗朱者發熱不休者皆死下純血者色如魚腦或如豬肝者皆半生半死脈空皮寒氣少泄利前後飲食不進是謂五虛者死能重用參附十可救一捷驗湯新治痢初起腹痛尿短下痢膿血或紅或白或紅白齊下日夜無數裡急後重等證俱效蒼朮一錢八分當歸錢半生白芍一錢三分白扁豆炒去皮三錢陳皮建澤瀉甘草淮木通各一錢滑石二錢川萆薢四錢黃連一錢三分大腹皮錢半洗淨宣木瓜一錢二分廣木香五七分熟大黃錢半或二錢藥揀上料分量稱足多水煎服五得湯新治證同前味數少而功同當歸二錢白芍生用一錢五分大黃一錢三分黃連一錢廣木香五分水煎服以上二方如感寒者加桂枝一服冒暑者加香茹六分胃關煎治脾腎虛寒痢冷腹痛脈弱體倦熟地三五錢白扁豆二錢山藥炒二錢甘草炙一二錢乾薑炒一錢吳茱萸泡五七分白朮一二錢溫服如腹痛者加廣木香七分厚朴一錢滯痛不通者加當歸錢半生白芍一錢三分滑脫直下者加烏梅二個肝邪侮脾者加肉桂一錢陽虛下脫者加附子一二錢元氣虛者加人參如瀉甚者加肉豆蔻一二錢或補固脂亦可膚寒安脾湯瀑新治裴食生命致成瀉痢腹痛尿短或脹滿咂惡去寒濕安脾胃之劑也蒼朮錢半陳皮一錢茯苓錢半扁豆炒二錢甘草七分蓽薢三錢木通錢半澤瀉錢半吳茱萸制五分厚朴一錢木香四錢生白芍一錢肉桂錢半水煎服若夾食者加神麯炒一錢五分如外感頭痛者加北細辛三分咽吐冷水者加半夏錢半生薑一錢中寒喜熱湯者加炮乾薑一踐加味四君子湯新治痢疾嘔惡或惡聞食氣此胃虛寒也人參隨宜白朮二錢茯苓一錢五分甘草炙一錢陳皮一錢扁豆炒三錢乾薑炮錢半山藥炒一錢五分水煎服若服之平安而不大效者加附子一二錢但須冷服朮附浸治六脈無力右尺更弱或大而數外熱煩躁腹痛脹悶下瀉而兼膿血是命門火衰中真寒而外假熱也人參白朮三錢附子錢半乾薑一錢水煎冷服聖朮煎治寒濕瀉痢嘔吐此脾胃虛寒也白朮三四錢乾薑炒二錢或一錢肉桂二錢陳皮一錢水煎服芍藥湯治濕熱邪盛煩躁下痢鮮血腹痛喜冷脈實等證白芍錢半當歸黃連黃芩各一錢大黃二錢肉桂五分甘草檳榔各六分木香五分水煎服香連丸治裡急後重以氣滯而熱伏也脈未大虛者宜之黃連一兩吳茱萸泡湯炒乾研廣木香四錢共為末蜜丸或漿丸空心米湯下若中氣衰墜或病久痢止而下部脹急用補中益氣湯大劑下香連丸即愈然亦不得盡以為熱也有熱邪下迫者有寒邪下迫者有氣虛下陷而迫者察其所因如熱者涼之寒者溫之虛者補之陷者舉之此調氣而後重除也若但以木香檳榔腹皮枳殼散氣則氣愈虛而病益劇矣參苓白朮散治胃氣虛滯禁口不食用此方加石菖蒲一錢五分微炒以開胃口待其能食然後因證而治之如胃口有熱加黃連一錢人參白扁豆炒研蓮肉微炒各二錢白朮三錢砂仁八分炒研桔梗一錢薏苡仁二錢炒研茯苓錢半炙甘草一錢菖蒲一錢五分共為末米飲調服一服即食或煎服亦可禁口不食有因火伏胃中脈見洪數內外俱有熱證宜用芩連梔柏之類若無熱證而食不入或惡聞食氣或飢不能食或嘔惡吞酸此脾氣之弱也當用四君子加乾薑若命門不暖則脾無火生宜用熟地一兩附子三錢吳茱萸開水泡過焙乾錢半肉桂二錢大劑與服自然思食此必脈虛而右尺更微也參朮香蓮湯新治休息痢屢止屢發久不愈者因兜澀太早積未清也廣木香五分黃連一錢人參八分白朮錢半甘草一錢茯苓二錢枳實一錢水煎服有調理失宜者隨證加減治之十全大補湯治痢後氣血兩虛氣虛則發寒血虛則發熱或早或晚似瘧非瘧切勿作瘧治須大補氣血多劑乃瘥人參一錢白朮錢半茯苓一錢三分甘草炙一錢當歸二錢撫芎一錢白芍酒炒一錢熟地二錢黃耆蜜炒二錢肉桂二錢生薑一錢紅棗三枚水煎服或加附子一錢凡痢病宜瀉宜補因脈因證原無一定若執痛無補法不知因虛寒而痛者愈攻則愈痛元氣自脫悔之晚矣丹溪先生用參術調補胃氣一二劑而後下者亦妙法也虛者宜之凡痢後腳漸細而軟痛者將成鶴膝風治宜溫補肝脾腎不可仍用燥脾之藥也凡痢後身痛系腸胃濕熱惡血未淨復還經絡所以痛也宜四物湯加桃仁牛膝紅花陳皮之類亦有屬氣血虛者不可不審凡痢病最忌兜澀使下無所宣泄則脹滿不食諸症見矣凡痢傷精血必陰虛水虧乃致燥熱勿作火治宜壯水補陰如脈猶有力虛中之火也宜生地熟地麥冬女貞子龜膠之屬如脈本無力全屬虛火宜六味八味等丸若陰盛格陽而外大熱者宜前胃關煎之類切忌涼藥備揀古來治痢至簡至穩神方於後以便取用痢病腹痛下膿血用大黃酒煮為丸白水服三四錢神效凡痢用生薑陳茶等分煎服白痢用艾一兩乾薑七錢炮為末醋煮米為丸米湯下血痢用三七三七末摻於豬血化為水乃真六錢為末米泔調服三錢血痢腹痛用元胡索為末米飲調服三錢噤口痢用蜜蠟四錢雞子黃一個蜂蜜苦酒發灰黃連研末各四錢同熬為丸二日服盡此華他方也赤白痢腹痛後重或面目手足俱變用黃蠟三錢阿膠三錢同溶化入黃連末五錢攪勻為丸日三次服盡此仲景方也毒痢噤口用大田雞並腸搗爛焙熱入麝三分作餅封臍上氣通即食噤口痢用大蒜搗貼兩足心及臍上血痢用烏梅胡黃連灶心土等分為末茶調服即愈赤痢用六一散加紅曲白痢加乾薑方載淋證二十八論瘧疾有風暑濕熱食瘴邪六種又有五臟六腑瘧勞瘧疸瘧牝瘧溫瘧母瘧夫瘧者因夏傷暑熱氣藏於皮膚之內舍於榮氣之中及遇秋風新涼束之表邪不得因汗而出此瘧之所由來也夫暑熱者陽也蓄之久則欲出秋寒者陰也束之固則莫出由是陽為陰遏則陽並於陰陰實則陽虛陽虛則外寒陰實則內寒內外皆寒湯火不能勝也及陰氣逆極同並於陽陽實則陰虛陽盛則外熱陰虛則內熱內外皆熱口渴欲飲冷也然淺者病在三陽隨衛氣以為出入而一日一作深者病在三陰邪氣不能與衛氣並出或間日一作或三四日而作作愈遲者病愈深也經之論瘧備矣然仁齊丹溪又分痰食等瘧此不過瘧之兼證耳非因之而成瘧也故治者宜察其邪之澆深證之陰陽有汗者以養正為主無汗者以散邪為急又熱盛者涼藥為君寒多者溫藥為重至於痰食血疸瘴牝鬼等證各隨其甚者而兼理之總之脈實證實者攻邪以治標脈虛證虛者補正以治本倘不明虛實輒用涼藥恐表邪未解而邪益固驟用截藥恐正氣已虛而症必變非徒無益而又害之醫之咎也凡瘧多熱而久不解者此必陰虛宜益陰除熱非生鱉甲牛膝不能除也多寒而久不解者此必陽虛非耆朮桂附不能除也久瘧者屬元氣虛寒蓋氣虛則寒血虛則熱胃虛則惡寒脾虛則發熱此時若用截藥多致危殆惟用人參煨姜各一兩煎湯於發前二時服之無力服參者氣虛用白朮代之血虛用當歸代之此輔正而邪自除也凡瘧以得汗而解然病有淺深不同即如病瘟者雖有大汗而熱仍不退瘧亦有之宜察其脈之緊與不緊及頭與身之痛與不痛仍漸次再汗之方得邪解不得謂汗後必無邪也又有已汗而邪將解或因食因寒因觸而發此舊邪未盡而新邪又至亦宜仍從汗解但須斟酌虛實可也溫瘧者內經謂冬中風寒至春夏陽氣大發而為病此即傷寒之證也與夏傷暑秋為瘧者不同當於傷寒門酌而治之疸瘧者內經謂肺素有熱發則陽氣盛故致消爍脫肉治此者有三法如內熱而兼表邪宜散以苦涼如表解而火盛宜清以苦寒此皆治其有餘也若火盛而真陰耗者宜壯水濟火切忌苦寒瘴瘧者惟嶺南煙瘴之地有之人居瘴地不知調攝而外受風寒為病或迷困喑啞與常瘧稍異治者亦不外寒熱虛實及有邪無邪如前治瘧諸法而已牝瘧者陽氣素虛當盛暑時乘涼飲冶陰盛生寒而不熱治以柴胡薑桂之類勞瘧者素有弱證因瘧成勞宜十全大補湯有熱者去肉桂瘧母者治之失宜氣血虛損邪伏肝經脅下有塊當以補虛為主若急於攻塊多致不救宜六君子湯加木香肉桂鱉甲蓬朮鬼瘧者時行不正之氣傳染而成宜平胃散加雄黃桃仁俗以夜發者為鬼瘧非也邪入陰分發於三陰宜四物湯加知母紅花升麻柴胡提入陽分方可以截凡瘧初起先寒後熱宜羌活紫蘇生薑之類散其太陽之邪次用柴胡湯或加截藥可也若不論何經即用柴胡即用截藥不可脈候瘧脈自弦弦數者多熱弦遲者多寒微者為虛代散則死截瘧立驗湯新陳皮一錢半夏錢半茯苓一錢甘草一錢青皮七分白豆蔻去殼微炒研一錢二分柴胡一錢五分桂枝一錢二分蘇葉一錢生薑二錢知母一錢二分黃芩一錢五分稱足分量水煎首一次輕煎於瘧未發前三時服次煎加常山酒炒一錢四分草果仁或面或飯包煨搗碎八分檳榔八分多水久煎服但要於瘧未發前一時服若早則藥力過遲則瘧已來矣能如法服則瘧立止此豫屢用屢驗凡男女大小及孕婦俱宜要在於三發之後方可用此藥先和而次截之瘧若寒重桂枝蘇葉生薑三味各加五分若熱重知母黃芩二味各加五分又方治一切瘧疾肉桂一錢丁香六分當歸錢半烏梅三個檳榔八分甘草一錢知母一錢二分黃芩錢半常山酒炒一錢三分生薑一錢三分密封煎至一小碗待冷瀉出再將渣煎至一小碗待冷瀉出合作一大碗露一宿次日晨興面東早服凡截藥要露者以暑熱至露而退也柴胡飲治感四時不正之氣內外俱有火證而瘧邪不散柴胡二三錢黃芩一二錢白芍二錢生地錢半陳皮一錢甘草八分如內熱口渴者加葛根一二錢甚者加知母石膏如外邪甚者加防風一錢如寒甚者加桂枝生薑各一錢麻桂飲治寒重熱輕脈遲嘔泄陰暑瘧疾肉桂一二錢當歸三四錢甘草炙一錢陳皮一錢麻黃七八分如夏季及有汗者加白芍一錢佐之生薑一錢水煎服若陰虛者加熟地三五錢若三陽並病者加柴胡錢半如汗甚者去麻黃加蜜炙黃耆二錢加味地黃湯治瘧發時其寒如冰轉熱如烙而面赤口渴熱退即不渴者以六味地黃湯加柴胡白芍肉桂大劑一服立愈休瘧飲治元氣虛老衰積弱者輔正則邪自退瘧立止矣人參一二錢無力辦參者白朮一兩代之白朮當歸各三四錢何首烏制五錢甘草炙八分陰陽水煎二次露一宿次早溫服一半飯後服完如陽虛多寒者加乾薑肉桂或加附子溫中散寒如陰虛多熱煩渴喜冶加麥冬生地白芍甚者加知母黃芩如腎虛水不制火腰痠腳軟加熟地枸杞山藥杜仲之類如邪有未淨而久不愈者加柴胡麻黃細辛紫蘇之屬如氣血滯者加酒溫胃飲治寒濕傷脾而瘧痢並作或嘔惡惡食等證白朮三錢扁豆炒二錢陳皮一錢乾薑炒一二錢甘草炙一錢茯苓錢半當歸一二錢滑泄者勿用柴胡一二錢水煎服如痢有微熱者加黃連佐之如大嘔大吐者加砂仁胡椒如氣滯胸腹痛者加藿香白豆蔻白芥子之屬如裡急後重者加木香或加腹皮柴芩煎治濕熱傷脾下及肝腎熱渴下血表邪未解柴胡二錢半黃芩梔子澤瀉木通各二錢枳殼錢半煎服如瘧痢並行鮮血脈滑者加白芍甘草或加黃速或加大黃備採古來治瘧至簡至穩諸方於後以備取用截瘧用小柴胡湯加常山酒炒二錢又方用常山酒炒二錢為末烏梅肉三個研爛酒調臨發日早服又方用蒜一個黃丹一錢搗為丸溫水面東吞下瘴瘧肉豆蔻一枚草豆蔻一枚厚朴二錢半甘草二錢生薑二錢共五味俱一半生一半炒煎服凡截瘧用生鱉甲不見湯煮者以醋炙黃為末烏梅肉搗為丸每服三錢又方用常山一錢五分酒炒檳榔一錢丁香四分烏梅一個共酒浸五更煎服寒甚者加肉桂一錢熱甚者加黃芩錢半久瘧或二三日一發及無定者用五靈脂中有溏心者乃真頭垢各二錢城牆上老石灰四錢搗飯糊丸皂角子大五更時以無根水下一二丸孕婦瘧疾用常山酒炒錢半烏梅二個甘草一錢石膏三錢酒煎服瘴瘧用草豆蔻仁飯包煨一錢附子一錢二分煎服凡瘧體虛用黃丹一兩常山酒炒三兩研末蜜丸當未發之早晨及將發時各服五十丸小兒疸瘧壯熱不寒用黃丹二錢蜜水調服若冷者酒調服名鬼哭丹勞瘧用烏梅十四枚豆豉二合甘草三寸生薑三錢童便煎服凡瘧用鱉甲醋炙研末酒調二三錢在隔夜與清早及臨時各一服無不斷者入雄黃末少許更佳以上所載俱是截方須於清理之後久而不愈者用之俱有神效二十九論真中風似中風夫中風之證有真似二者真中風者外感之表證也似中風者內傷之裡證也二者不明未免誤人其外感者經曰風為百病之長靜則肉腠閉拒雖有大風苛毒勿之能害否則天有八風乘虛感襲自有表證可以疏散但有中經中臟寒熱虛實之分中經者邪在三陽其病尚淺中臟者邪入三陰其病則深在經不治則漸入臟由淺而深也因寒者則拘急攣痛而脈浮緊因熱者則弛緩不收而脈浮洪又若正勝邪者乃可直攻其邪正不勝邪者則必先顧其本或攻補交施此虛實之謂也其內傷者不由外感而亦謂之風如病機篇所云諸暴強直皆屬於風諸風掉眩皆屬於肝是皆屬風而非外中之風也夫肝為東方之木其臟血其主風肝血病而筋失所養筋病則掉弦強直以及神魂昏憒口眼歪斜牙緊語澀吐沫遺尿痰壅癱瘓之類無所不至此皆屬於肝皆屬於風即木邪也正內經所謂厥逆內奪之屬何得概以為風設以風藥而散厥逆所散者非元氣乎真陰愈傷真氣愈失是速其死矣治此者以補氣血為主元氣復則諸證自愈但須分寒熱氣血陰陽孰輕孰重權變用藥方得中綮若拘方書以某經用某方恐膠柱鼓瑟未必適中也經曰寒則反折筋急熱則筋弛不收然不可拘寒盛則血凝而滯塞故多拘急熱亦拘急者以火盛則血燥血燥則筋枯也熱盛則筋軟而不收故多弛縱寒亦弛縱者以塞盛則氣虛氣虛則不攝也且寒熱有證有脈可驗當因而治之若無寒熱則宜專治氣血無疑矣至於偏枯痿弱之類本由血虛然氣血不相離補血者當知血以氣而行補氣者當知氣非血不化二者各有所重但不得偏廢耳夫人生於陽而根於陰根本衰敗而人危矣所謂根本者即真陰也然陰虛有二有陰中之水虛者則多熱而燥宜六味地黃丸主之彼參朮薑桂辛溫之類不宜輕用有陰中之火虛者則多寒而滯宜八味地黃丸古方桂附各一兩宜各加二三兩不等主之彼生地麥冬石斛清涼之類皆非所宜若氣虛猝倒或汗出尿遺口開涎流癱軟不言此氣脫危候也倘無痰火等證必須大劑參附耆術或可挽回元氣隨以歸地枸杞補真陰以培其本蓋精即氣之根也經曰精化為氣即此之謂而或者妄言中風投以剪風化痰之藥以散其氣何能救乎余因此證不明久矣庸醫固莫知即河間用汗下亦以實證治也東垣丹溪所論間有所得而觀其用方則以小續命湯此治外感則可又以大秦艽湯為養血而寒散之藥居其大半若羌活愈風湯更覺不可後之醫者勿域古方則得矣脈候中風之脈每見沉伏亦以脈隨氣奔指下有洪盛者浮遲者吉堅大急疾者凶浮大為風浮遲為寒浮數為熱亦為風大為火滑為痰寸關空大真氣已散沉弦有力為氣滯尺弦洪數腎陰大虧以下治真中風外感風寒宜疏散之麻桂湯治風寒中經頭痛惡寒拘急身痛脈浮緊者桂枝一二錢當歸三四錢甘草炙一錢陳皮八分麻黃一二錢生薑一二錢水煎熱服取微汗夏月亦可用若三陽並病者加柴胡二錢或邪未入少陽肝經柴胡忌用或加防風一二錢金匱續命湯治風寒直中三陰肢弛語澀拘急不知痛處麻黃去節一二錢人參一錢無者以威參一兩代之或以淮山藥代之當歸三錢桂枝錢半川芎一錢乾薑炒一錢甘草一錢杏仁去皮尖十五枚水煎熱服取汗桂枝湯治頭痛身痛有汗惡風惡寒者桂枝白芍生薑各三錢甘草二錢熱服或用五積散亦妙大秦艽湯治風邪在經熱多寒少而為偏枯疼痛發熱者當歸芍藥白朮生地熟地川芎甘草茯苓防風白芷獨活羌活黃芩秦艽石膏各一錢細辛五分水煎服熱盛加知母如天寒加生薑胸痞加枳實輔正驅邪湯新治氣血兩虛外受風寒難以疏散須攻補交用當歸三錢熟地四錢人參隨便白朮三錢茯苓二錢半山藥三錢甘草一錢乾薑炒一錢或用煨生薑錢半麻黃一二錢桂枝一二錢如陽虛寒甚加附子頭痛加川芎白芷細辛骨痛加防風無力辦參用沙參三錢或威參一兩代之三生飲治猝中昏冒口眼歪斜半身不途痰氣上壅六脈或沉伏或浮盛者並宜服之生南星一兩生川烏去皮生附子去皮臍各五錢木香二錢共研每服五錢生薑八分水煎服滌痰湯治中風痰迷心竅舌強不能言南星薑製半夏各二錢枳實炒八分橘紅一錢石菖蒲人參竹茹各八分甘草四分茯苓一錢生薑八分水煎服小續命湯通治風痹痿厥外感等證麻黃去節人參黃芩白芍煨甘草炙川芎杏仁去皮尖炒防己桂枝各一錢防風三錢附子一錢生薑六分如有汗麻黃只用五七分如身熱不寒加知母梗米石膏去附子如無汗身涼加附子錢半無參者以沙參三錢代之以下治似中風內傷昏憒宜調補之大補元湯新治氣血虛甚元氣將脫一時昏沉掉搖等證人參二錢淮山藥炒二錢黃耆蜜炒二錢白朮二錢熟地二三錢或多加當歸二三錢山茱萸一錢枸杞二三錢甘草一二錢五味蜜炒七分杜仲姜炒二錢生薑八分紅棗三枚水煎服如元陽不足多寒者加附子肉桂炮姜之類如無力用人參者再加黃耆三四錢如氣滯減黃耆二分加去白陳皮一錢如血滯去山茱萸加川芎一錢如泄者去當歸加補骨脂錢半肉豆蔻一錢麵炒如腹痛喜按者加吳茱萸湯泡二次用一錢左歸飲治腎中之水虛不能養肝以致木動風搖昏倒等證熟地二三錢或重加山藥二錢枸杞二錢甘草炙一錢茯苓錢半棗皮一二錢如熱甚者加麥冬二錢五心熱者加元參錢半血熱妄行者加青蒿二錢腎熱骨蒸多汗者加地骨皮二錢上實下虛者加牛膝二錢血虛而燥滯加當歸二錢改用六味地黃丸亦為正治右歸飲治腎中之火虛元陽衰敗以致昏倒等證熟地用如前山藥炒二錢棗皮一錢枸杞二錢甘草炙一錢杜仲姜炒二錢肉桂一二錢附子二三錢如氣脫昏厥或汗或亂重加人參白朮如火衰不能生土為嘔噦吐痰加炮姜一二錢如泄瀉加肉豆蔻麵炒一二錢如小腹痛加湯泡吳茱萸五七分如淋帶不止加補骨脂一錢血少腰膝痛加當歸二三錢改用八味地黃丸亦為正治凡此等證有火盛者即陽證也生地麥冬白芍龜膠知母地骨皮黃芩之類俱可揀用但使火去六七分即調治其本又有寒盛者即陰證也宜四逆湯理中湯之類主之四逆湯治陰證脈沉或中寒外熱身痛而厥自利等證甘草炙一兩乾薑炮兩半附子生用半枚水煎服如假熱外拒者用水冰冷服如腹痛加白芍一兩嘔者加生薑一兩咽痛者加桔梗五錢脈猶不現加人參凡麻木不仁者以氣虛則麻血虛則木所以不知痛癢久則為偏枯痿廢最宜培養氣血勿誤認為痰凡夏月抽搐昏倒熱傷氣也宜用清暑益氣湯重加參耆若伏陰在內而陽虛氣脫者用附子理中湯勿謂夏忌溫熱也凡肥人猝香屬氣虛也或濕滯痰壅宜於痰門用清吐之法隨以四君六君及十全大補湯之類主之凡一時昏倒歪斜抽搐等證而痰氣不甚者不可指為痰而妄用痰藥蓋恐燥血則肝失所養反至傷脾而痰愈盛也縱有痰者亦當察所從來又宜分其虛實若結胸阻滯以及昏迷不知暫用痰門吐法或用淡薑湯灌入以鵝翎探入喉中徐引其吐如是數次得吐氣通必漸蘇矣然後酌宜進藥因火為痰者宜清膈飲加竹瀝童便陰虛水泛為痰者六味丸陰虛屬火者八味丸脾胃虛寒不能運化而為痰者理中湯或溫胃飲及參朮二陳歸脾湯加煨姜之類主之然言有盡而病無定要在人之因證因脈而詳辨之耳清膈飲治痰因火動氣壅喘滿內熱煩渴等證陳皮去白錢半貝母二三錢杵碎膽星一二錢海石二錢木通二錢白芥子五七分研水煎服如火盛而痰不降加竹瀝童便各半杯渴者加花粉一錢小水不利加梔子一錢如面赤喜冷加生石膏二三錢如大便閉結加大黃數錢以下治風癱古方録以便用易老天麻丸治一切風癱手足痿弱骨痛筋拘天麻祛風牛膝強筋萆薢祛風濕強筋骨元參壯水制火各六兩當歸和血十兩杜仲鹽水炒七兩使筋骨相著生地一斤益真陰或用熟地羌活去骨節風八兩或五六兩附子制四兩行經絡蜜丸或加川獨活五兩地黃飲子治腎虛氣弱語澀足痿熟地巴戟去心棗皮肉蓯蓉酒洗去甲各二錢附子制一錢麥冬去心一錢五味子六分石斛茯苓遠志去心肉桂各一錢石菖蒲八分薄荷三分薑棗引水煎服腎之脈循內踝上踹及股故虛則足痿不能行其直者挾舌本故虛則舌謇不能言地黃巴戟棗皮蓯蓉腎精不足者補之以味也附子肉桂陽不足者溫之以氣也遠志菖蒲使心氣下交也五味麥冬壯水之上源也茯苓石斛走水穀之府化榮衛而潤宗筋者也不及肝者以肝腎同源也諸臟各得其職則筋骨強而機關利矣蹇澀痿廢夫復何虞附子理中湯治脾胃虛冷嘔泄手足厥逆一切寒證人參無者以山藥三五錢炒黃代之附子制乾薑炒甘草炙白朮各二錢水煎服若內寒而外假熱以水冰冷服之中有妙用星香散治中風痰盛或熱或涼之藥俱不便用者宜用此方南星生用四錢木香五分生薑八分水煎服備揀古採治中風至簡至穩神方於後以便取用中風口噤荊芥穗為末服二錢又方黎蘆一兩煎防風湯浸透焙乾炒黃為末溫水調灌以吐風涎為效又方皂角去皮豬脂塗炙黃為末酒調服涎出即愈中風偏廢生附子一個去皮羌活烏藥各一兩為末每服四錢薑湯調下麻木癱瘓通身疼痛生川烏連皮五靈脂有溏心者真各二兩威靈仙二兩半為末酒糊丸每服先七丸後十丸鹽湯下忌茶中風昏迷形體不收此風涎上潮皂角二個去皮明礬五錢為末每用五分水調灌吐痰即效風邪癇病皂角四兩蒼耳草根莖葉曬乾二兩蜜陀僧一兩為末水糊為丸硃砂細研水飛三錢為衣棗湯下三四十丸病退只服二十丸名抵柱丸中風口眼歪斜新石灰醋炒調如泥左喎塗右右喎塗左又方巴豆七粒去皮研右喎塗左手心左喎塗右手心正即洗之又方皂角去皮為末醋和右喎塗左左喎塗右凡中風昏迷口噤用皂角末吹入鼻中有嚏者生無嚏者死為肺氣已絶六經絶症口開為心絶手撒為脾絶眼合為肝絶遺尿為腎絶吐沫鼻鼾為肺絶皆不治凡厥逆痰壅口噤脈伏身溫為中風身冷為中氣又有痰為中風無痰為中氣古用烏藥順氣散治中氣此由喜怒憂愁所傷不可作中風治三十論怔忡驚悸恐懼健忘附煩躁及宗氣動怔忡者心中跳動不安如擊鼓然凡事不能用心一思更甚此由思索過勞心血虛損而然治者宜生血養心稍加涼血之味驚悸者肝膽怯也凡有危險觸之或自汗或戰栗或眠多異夢或口中有聲經曰東方青色入通於肝發為驚駭由是子令母虛而心血不足又或遇事冗繁心陰耗損治宜安養心神滋培肝膽為主雖有客邪亦當知先本後標之義恐懼者如人將捕之狀不能獨臥自知而自畏也經曰在臟為腎在志為恐雖與驚悸同類而實不同驚從外起恐由內生驚出於暫而暫者即可復恐積於漸而漸者不易解治宜以養心滋腎為主健忘者心腎之不交也為事有始無終言談不知首尾治者宜補腎而使之上交養心而使之下降則水火交濟何健忘之有煩躁者心中擾亂不寧也或病後勞後津液乾涸榮血不足或腎水下竭心火上炎故虛熱為煩甚則或至於躁治宜補後天之血以養心滋先天之水以壯腎則得矣宗氣動者上或見於胸臆下或見於臍旁無時振撼不能安也經曰胃之大絡名曰虛里出於左乳下其動應衣宗氣泄也此惟陰虛於下則宗氣無根故氣不歸源患此者速宜節勞苦戎酒色養氣養精以培根本猶可及也若誤為痰火治之則危矣以上諸證雖有心脾肝腎之分然陽統乎陰心本乎腎上不寧者未有不由乎下心氣虛者未有不因乎精以精氣原有互根之用也又須知人之所主者心心之所藏者神神之所養者血心血一虛神無所依而諸證自生治者或先養心或先補腎或早夜補腎中時補心或有兼熱者清之兼寒者溫之或又有兼痰者化之但痰有由生察其源乃可治也前輩多有謂屬痰者卻不數見後之人不必泥執古書因病情而揣摩之則隨機應變萬無一失矣脈侯寸口脈或微細或浮大而空皆心虛也或細數虛而有熱也動為驚止而復來亦為驚寸澀尺弱心腎兩虛也寸洪數尺虛微水不能利火也天王補心丹治心血虧虛跳動不安由用心太過而無血以養心也人參無者以時下之北條參二兩代之熟地四兩當歸酒蒸二兩麥冬去心天冬去心俱酒蒸各一兩柏子仁微炒去油八錢棗仁炒茯神各一兩二錢丹參身兩半遠志去心八錢元參七錢桔梗五味微炒石菖蒲炒各一錢先將熟地當歸二冬搗如膏然後入各藥合研細末搗勻若干則加沸水不用蜂蜜恐引藥下墜也每丸一顆約三錢重用硃砂如小豆成粒者五錢細研水飛過候乾再研為衣每日飯後用沸水半杯磨化服即睡一刻或用一丸二丸亦隨其宜忌鐵並忌三白此方治一切心虛不寧讀書人常服此丹養心安神雖思索稍過亦覺無虞豫四旬得是病服是丹至今七旬可如少壯時之用心無異若慮難制改為水藥不效柏子養心丸治勞心太過怔忡驚恐等證柏子仁用鮮白者以布包槌去油茯神生地酒浸若火衰者改用熟地當歸棗仁各二兩五味犀角鎊甘草各五錢上研極細末為丸用辰砂三四錢細研水飛過候乾加金箔二十張再研為衣午後臨臥津嚼一丸每丸約二錢重即用歸脾湯亦宜方見不寐心腎丸治心腎俱虛怔忡健忘驚恐等證淮牛膝酒蒸蓯蓉用極大而色鮮紅者酒洗熟地各二兩菟絲子酒蒸三兩人參有者更妙黃耆蜜炙當歸酒浸山藥炒鹿茸酥炙附子制茯神五味子龍骨煅遠志去心薑汁炒各一兩先將牛膝蓯蓉熟地當歸搗成膏後入各藥合研細末加酒煮麵糊為丸棗湯或清湯下七八錢即改用心腎交補丸亦可方見不寐門溫膽湯治心虛膽怯怔忡驚悸夢寐不寧半夏枳實竹茹各二錢陳皮茯苓各錢半甘草炙一錢生薑八分棗一枚食遠服或加遠志七分棗仁蓮肉金銀煎服七福飲治大恐大懼損傷心脾腎氣而神消精竭飲食減少人參隨宜熟地五七錢當歸二三錢白朮錢半甘草炙一錢棗仁錢半遠志五七分或加姜引如虛熱煩躁加麥冬二錢如腎經虛甚腰膝軟痛加杜仲枸杞此方平和任照證加入平補鎮心丹治心血不足時或怔忡夜多亂夢安心腎益榮衛人參隨宜龍齒火煅水飛酒煮曝乾各二兩茯苓茯神麥冬酒蒸五味天冬酒蒸棗仁炒遠志制山藥薑汁炒各一兩當歸酒蒸二兩車前子柏子仁去油各八錢石菖蒲炒長五錢熟地三兩先將二冬歸地搗化後入各藥合研細末加沸水和為丸約二錢多一顆用辰砂五錢細研水飛候乾加金箔三十張再研為衣每日飯後沸水磨服一二顆即睡一刻忌鐵茯苓飲子治水停心下跳動有聲不能自安赤茯苓去皮白茯神去木半夏麥冬去心橘紅各二錢檳榔甘草沉香忌火宜磨水合服各一錢姜三片食遠服一味鹿角膠治肝傷失血不能養魂睡即異夢驚怖真鹿膠每用三錢以酒蒸溶空心服日三次五日自安凡草木之藥力薄惟鹿角大補精血血旺而魂藏於肝矣茯神散治膽與胃不足心神恐怯茯神錢半遠志防風白朮前胡人參隨便桂心熟地枳殼各一錢菊花七分細辛四分姜三片溫服硃砂安神丸治心血不足肝火不清血熱多驚生地一兩當歸一兩甘草五錢黃連五六錢水泛為丸硃砂另研水飛為衣有熱者必有脈與證可憑方用黃連否則去黃連加梔仁青蒿之類七味地黃丸治宗氣動能應衣補陰以舒氣也熟地八兩棗皮四兩山藥四兩茯苓三兩澤瀉兩半丹皮二兩肉桂三兩當歸三兩白芍二兩煉蜜為丸每早淡鹽水送下滋陰靜鎮湯新治宗氣不歸源由精氣虧虛不能斂攝也熟地三錢棗皮淮藥枸杞各錢半五味七分肉桂錢半巴戟天一錢煎服或為丸亦可三十一論泄瀉有脾虛風寒濕熱傷暑積滯下陷數種內經之論泄瀉有風寒濕熱之異又有清氣在下則生飧泄統而論之脾胃為主胃司納受脾司運化脾氣一強自能勝濕無濕則不泄故經曰濕多成五泄若土虛不能制濕則風寒與熱皆得干之而為病人亦知補脾以止泄而不知胃陽主氣脾陰主血概用辛溫燥熱之劑這致胃火益旺脾陰愈傷由是胃干而腸澀脾臟漸絶而死蓋以土雖惡濕亦必賴潤乃得生物安可徒用辛熱乎要之治法不一不可泥執一曰淡滲當利小便而泄自止然亦有不可利者條析於後一曰升提氣不上升而下陷惟升柴羌葛之屬能鼓胃氣上騰且風藥能燥濕也一曰清涼熱淫所至暴注下迫宜用苦寒以清之也一曰疏利痰凝氣滯食積水停皆令人泄隨證祛逐勿使存留所謂通因通用也一曰甘緩泄而趨下甘為土味可以緩中善禁急速也一曰酸收瀉下者必氣散而不能收惟酸可以助收肅之權也一曰燥脾瀉由脾濕濕由脾虛倉廩得職水穀自分也一曰平肝木旺侮土土虧不能止水其病在肝宜平肝乃可以補土也一曰溫腎腎主二便封藏之本雖屬水位真陽寓焉脾虛者補腎之陽火以生土也一曰固澀泄久道滑雖補無功須行澀劑庶撥度合節也凡是十者治瀉之法已無遺蘊然先後重輕之權豈能預設須於臨證之頃圓機靈變可也至於難經所謂脾胃大腸小腸俱有泄者宜照上因證因脈治之又言大瘕泄者即腎泄也每在五更天明之時腎屬水旺於子腎之陽虛命門火衰不能鍵閉故將交陽分而陽無以長止有陰寒則瀉治宜補火尤要於補氣若大便欲出而痛者是精已竭而復耗之則大小便牽痛是宜補腎方法列後列若誤用利藥再損元氣則肢體腫脹而斃矣可不慎哉凡泄瀉之病多小水不利水穀分則瀉自止故曰治瀉不利小水非其治也然亦有可利者有不可利者如暴注新病形氣脈氣壯旺者酒濕過度口腹不慎者實熱閉澀者小腹脹滿水道痛急者皆宜利之然利之而仍不利者是濕熱閉塞膀胱入水之路故用利藥不應豫有獨得之祕一刻即效方載於下若病久者陰不足者脈證多寒者形虛氣弱者口乾非渴而不多飲又不喜冷者皆不可利蓋虛寒之瀉本非水有餘實因火不足本非水不利實因氣不行夫病不因水利則亡陰瀉由火虛利復傷氣倘不察其致病之本則未有不愈利愈虛而速其危者矣凡瀉水而腹不痛是濕宜燥滲之飲食入胃不住或完穀不化是氣虛宜溫補之腹痛腸鳴瀉水痛一陳瀉一陳是濕而有熱宜清利之時瀉時止或多或少是痰積宜豁之腹痛而瀉瀉後痛減者是食積宜消之實者宜下之如久瀉不禁者宜補而兼澀脾氣下陷者補而兼升淡滲湯新治新病水泄小便短少而黃或口渴腹痛不拘男婦大小服之立效蒼朮一錢五分厚朴姜水炒一錢生白芍一錢三分甘草一錢二分扁豆三錢赤茯苓建澤瀉淮木通豬苓宣木瓜各一錢陳皮八分川萆薢四錢足車前子八分廣木香三分煨熟同煎不用引每味揀道地上料稱足分量多水煎服一刻即愈此方得力在多用萆薢以能清膀胱入水之路庶不入大便而泄止矣如受寒邪身痛發熱加桂枝一錢如頭痛加白芷川芎各一錢北細辛二三分如虛寒腹痛喜按者加砂仁真藿香各八分如夾食者加神麯麥芽各炒八分如舌黃口渴喜冷者加黃芩一二錢生石膏三錢或加黑山梔八分升陽除濕湯治春傷於風夏生飧泄謂完穀也所謂下者舉之是也蒼朮一錢三分柴胡防風羌活神麯炒澤瀉豬苓各八分陳皮麥芽甘草炙各四分升麻七分姜三片溫服如脈虛體弱者加人參更妙清涼湯新治濕熱瀉痢或發熱喜冷或腹痛手不可按或所瀉者臭惡而熱或小水痛而赤是暴病脈實者可用白芍一錢三分甘草梔子茯苓澤瀉黃芩枳殼木通黃連各一錢溫服如大便帶血加熟大黃一錢當歸一錢如內熱甚者或加黃柏膽草疏利湯新治食積水停痰凝氣滯肚腹脹痛或生冷寒濕傷臟邪實霍亂泄利初起者宜察虛實用之陳皮一錢法半夏錢半茯苓二錢甘草炙一錢厚朴姜水炒烏藥豬苓澤瀉神麯炒各錢半吳茱萸開水泡焙乾五七分食遠溫服如氣痛甚者加木香五分砂仁七八分如寒濕甚者小便短赤加蒼朮錢半如腹痛喜熱喜按者加炮乾薑一錢如小便短大便多水者加萆薢四錢木香四分煨用甘緩湯新治泄瀉急而趨下不能少停此脾氣虛而下墜也人參少者用山藥四錢炒黃代之白朮茯苓甘草炙各錢半升麻五分陳皮七分苡仁炒芡實炒各二錢木瓜白豆蔻肉炒研各一錢紅棗四枚溫服此小便清而大便泄也或加肉豆蔻麵包煨一錢煨木香四分燥脾湯新治脾胃虛寒濕淫轉甚泄瀉不止白朮二錢茯苓錢半甘草炙乾薑炮砂仁炒研藿香肉桂各一錢肉豆蔻飯或麵包煨一錢紅棗生薑引如泄而水多者加蒼朮錢半如寒甚肚痛者加附子一二錢如氣滯作痛者加木香五分或丁香四五分吳茱萸制七八分漿水飲治暴泄如水身冷汗出脈弱氣少口不能言此為急病半夏薑製三錢良薑八分乾薑炮肉桂甘草炙附子各錢半水煎頻服或加人參更妙茱萸斷下丸治臟腑虛寒腹痛泄瀉吳茱萸湯泡焙乾二兩赤石脂乾薑炮各一兩五錢艾葉炒縮砂仁肉豆蔻麵包煨附子各一兩共為末麵糊丸每服三錢米湯送下酸收丸新瀉久者必氣散不收無能統攝用酸以固之人參山藥炒白朮甘草炙各三兩高良薑兩半訶子肉二兩石榴皮醋炒二兩白石脂二兩五味子一兩共為末醋糊丸米湯下如下焦作脹用枳殼腹皮木香陳皮煎湯送丸平肝補脾湯新治木旺侮土脾虛發泄當歸土炒錢半白芍酒炒一錢沙參三錢白朮茯苓各二錢白豆蔻肉炒研八分木瓜一錢二分肉桂錢半甘草炙一錢水煎服一友逢交春日發泄一早十餘次至立夏便止二十多年凡補脾止瀉之藥遍投不效及診其脈系左關強右關弱余制此方用歸芍養肝肉桂平肝四君子補脾一服立愈後不再發溫腎湯新治五更及天明發泄多年不愈者乃命門火衰也熟地八兩山藥炒棗皮醋蒸各四錢澤瀉一兩二錢鹽水浸茯苓三兩補骨脂酒炒三兩菟絲子淘去泥沙酒蒸四兩五味子微炒二兩肉桂四兩附子四五兩先將地黃棗皮搗成膏後將各藥研末加山藥打糊為丸此八味去丹皮蜂蜜或不用澤瀉亦可蓋補真陰真陽則腎中之水火既濟而開闔之權得矣又何泄之不止乎五味子散治腎泄不進飲食五味子炒二兩吳茱萸炒三五錢為末每服二錢白湯調服或以山藥打糊為丸服更效四神丸治脾腎虛寒五更溏泄補骨脂炒四兩肉豆蔻二兩五味子兩半吳茱萸湯泡炒一兩共為末姜煮棗肉為丸米飲下固澀丸新治泄久道滑補之無益須用此澀劑庶可止泄白朮牡蠣煅附子乾薑肉蔻麵包煨赤石脂各一兩訶子肉石榴皮醋炒各兩半枯礬三錢五倍子四錢為末醋糊丸米飲下三錢並治直腸泄食入即出或加龍骨一兩補中益氣湯方見傷寒表證治腎傷虧損大小便牽痛而泄或莖中痛此湯加升麻送四神丸又方以八味地黃丸料加五味子補骨脂多服乃痊不得以下滯有餘之證治之凡腎泄忌用參朮補脾以土勝而水愈虧泄自盛也凡脾胃虛寒下陷者用補中益氣湯加薑桂肉果補骨脂脾氣虛寒不禁者用六君子湯加薑桂脾腎氣血俱虛者用十全送四神丸大便滑利小便短澀肢體漸腫喘嗽唾痰用金匱腎氣丸若大瀉如傾元氣漸脫者用大劑四君子湯加乾薑附子烏梅五味子若稍緩則無及矣大抵諸泄證必先分利後實脾土益元氣無不全愈若不論虛實而早兜澀遺害不小胃脈虛則泄脈虛按之滑者必下痢腎脈小甚為洞泄肺脈小甚為泄泄脈洪大者逆下痢日十餘次脈反實者死腹鳴而滿四肢清削泄甚十五日死下則泄瀉上則吐痰為上下俱脫死食入即下為直腸泄難治六腑氣絶於外者手足寒五臟氣絶於內者利不禁甚者手足不仁為難治備揀古來治泄瀉至簡至穩神方於後以便取用脾虛冷泄用補骨脂炒四兩肉豆蔻生用二兩為末以姜煮棗肉搗糊為丸鹽湯下鶩泄澄徹清冷中有糟粕小便清白中寒也用附子理中湯洞瀉盡水用胃苓湯泄而腹脹諸藥不效用益智仁二兩煎服老弱虛泄用附子赤石脂各一兩醋糊丸米湯下多年脾泄吳茱萸開水泡焙乾每用三錢水煎入鹽少許服之立止以茱萸能暖膀胱通水道故大腸自固能分清濁也泄不止用白龍骨白石脂等分為丸紫蘇木瓜湯下久泄用酸石榴皮研末米湯下寒泄並小便精出用赤石脂乾薑各一兩胡椒五錢為末醋糊丸米湯下火泄者食入即出以火性急速無容克化經謂邪熱不殺穀也用黃芩白芍各二錢甘草一錢如腹痛加桂二分如泄有膿血加黃連此脈證俱實不似直腸泄宜溫宜澀也酒濕泄用葛花解酲湯此因酒之濕熱也而亦有因酒生寒濕者以酒性去而水性留為寒也惟峻補命門則可有治法在酒證門宜細閲之三十二論嘔吐嘔吐之證有虛有實實者邪氣實也或因寒滯者必多疼痛或因食滯者必多脹滿或因氣逆者必脹痛連於脅肋或因火鬱者必煩熱燥渴脈洪而滑或因外感者必頭痛身熱脈數而緊或邪傳少陽者必乾嘔耳聾脅痛潮熱或邪在陽明者必大嘔大吐此宜去邪而嘔自愈也虛者胃氣虛也以上所言諸證皆無而忽為嘔吐無常時作時止食無所停而見食則嘔氣無所逆而偶觸則嘔或身背或飲食微寒則嘔或吞酸或噯腐或時苦噁心而嘔或因病誤用寒涼本無嘔而致嘔者或食入上焦而即吐者或食入下焦積久不化而嘔者凡此皆屬虛證補固然矣然胃本屬土非火不生非暖不化此際或用溫熱之藥以暖胃或補君相之火以生土故曰脾愛溫而惡寒土惡濕而喜燥所以東垣脾胃論特著溫補之法庸可忽哉而河間言嘔因胃火上炎而然此特一端不過十之一耳不如孫真人曰嘔家聖藥是生薑此的確之見也使其中或虛或實辨之不真不可施治凡嘔家皆以胃氣為言使果胃強脾健則所食皆化何至嘔吐而茲略有所觸便不能勝倘非胃氣虛弱何以至此但或有停滯不已者是又虛中有實不得不暫從清理然後可以培補至於中氣虛困之甚者是又所急在虛宜先顧元氣而略加清理此中本末先後貴有權宜吐傷津液必口渴不可誤認為火投以涼藥為害不小嘔家用生薑以氣逆者散之若胃虛穀氣不行當以參術補胃推揚穀氣為妙宜白朮人參茯苓半夏甘草橘皮陳朮苡仁谷糵煮就時時呷之若徒用辛溫愈增燥熱而莫止也乾嘔屬氣逆噁心屬胃傷嘔苦邪在膽經吐酸者責之肝臟嘔清水者多氣虛吐蟲者皆胃冷嘔吐病宜從治不宜寒涼在東垣則全用溫藥在丹溪雖用黃連亦兼蒼朮茱萸之類蓋得熱則行火旺而脾健運矣嘔而脈弱小便復利身熱見厥者死嘔吐大痛色如青菜葉者死加味二陳和中湯新治一切嘔吐照後加入陳皮去白八分半夏二錢茯苓三錢甘草一錢蒼朮一錢三分氣不宜者勿用厚朴姜炒一錢砂仁炒研七分竹茹一錢生薑三錢水煎服如喜熱惡寒肢冷脈遲此傷於寒也如丁香一錢去竹茹甚則加附子或用理中湯加附子並宜冷服蓋冷遇冶相須而入自不吐出如熱嘔喜冷惡熱煩躁引飲脈數而洪加黃連姜水炒一錢梔子炒黑八分枇杷葉乾葛各錢半入蘆根汁合服其聞食氣而嘔藥下亦嘔關脈洪者並用蘆根汁以治其熱加味小柴胡湯治少陽證耳聾脅痛乾咽潮熱用小柴胡湯方見傷寒表證加竹茹二錢生薑重用三錢煎服丁香安胃湯治脾胃虛寒不時嘔吐丁香五分黃耆炙二錢人參甘草當歸蒼朮吳茱萸炮焙草豆蔻各一錢陳皮八分柴胡酒炒升麻蜜炒黃柏各三分水煎服或加生薑引藿香平胃散治內傷飲食填塞太陰嘔吐不已真藿香厚朴姜水炒陳皮各一錢蒼朮錢半砂仁甘草炙各五分神麯炒八分姜一錢棗二枚水煎服加味異功散治胃虛而嘔不喜飲食人參或用山藥炒黃四錢代之白朮茯苓各錢半甘草炙陳皮砂仁炒研藿香各五分神麯炒七分陳米一合順取流水煎沸泡伏龍肝擂細攪渾放冷澄清入前藥加薑棗煎服四君子湯治胃口有痰心中欲吐不吐欲嘔不嘔雖曰噁心實非心病人參白朮茯苓各錢半甘草炙一錢生薑二三錢或二陳湯加生薑甚者理中湯家祕理中湯治中寒嘔吐陰盛格陽不納藥者人參白朮三錢乾薑炮錢半甘草炙附子各一錢煎就去渣入童便獖豬膽汁各半杯再煎一二沸服之神效蘇葛二陳湯治酒傷作嘔面赤口渴煩躁噁心連日不寧陳皮甘草各一錢半夏茯苓各錢半黃連姜水炒梔子炒各八分蘇葉六分乾葛二錢水煎熱服乃效吐酸水或緑水肺弦急出寸口屬火上逆以二陳湯加吳茱萸一錢開水泡一次用黃連柴胡各八分或平胃散氣逆者加香附丹溪茱連丸治嘔酸吞酸黃連土炒兩半吳茱萸泡焙一兩陳皮蒼朮米泔浸黃芩土炒桔梗茯苓各一兩二錢共為末神麯糊丸緑豆大每服二三十丸少用開水送下即睡一刻小半夏湯治停水嘔吐半夏二錢茯苓錢半生薑汁合服備揀古來治嘔吐至簡至穩諸方於後以便取用脾胃氣虛胸膈不利者用六君子湯壯脾土生元氣若過服辛熱之劑而嘔吐噎膈者用四君子加芎歸益脾土以抑陰火胃火內格而飲食不入者用六君子加芩連清熱養胃食入嘔出用六君子加木香炮姜溫中補脾若服耗氣之劑血無所生而大便燥結者用四君子加芎歸補脾生血若火逆衝上食不得入者用四君子加山梔黃連清熱降火若痰飲阻滯而食不入者用六君子加木香山梔補脾化痰若脾胃虛寒飲食不入或入而不化者用六君子加木香炮姜溫補脾胃更非除房勞調飲食節厚味者不治年高無血者亦不治嘔逆不得下者用五靈脂狗膽汁丸服痰飲吐水因冷飲傷脾用赤石脂一斤研末酒下服盡後則終身不吐痰水又不下利補五臟令人肥健治痰熱用葛根麥冬黃連梔子滑石石膏之類細辛同丁香治寒咽蒼朮暖胃白朮補胃艾葉治吐清水半夏治寒痰藿香治吐逆白豆蔻散冷氣寒痰用附子半夏生薑煎服宿食嘔水用良薑其餘益智仁乾薑生薑蜀椒胡椒吳茱萸丁香俱暖胃止嘔之品如栝蔞杏仁桃仁蘿蔔子山梔皆能作嘔忌用凡蟲作嘔治法在諸蟲門
