body:
  text: 卷之五瘟疫一論瘟疫與傷寒不同治法亦異傷寒者感冒寒氣初起發熱惡寒頭痛身疼其脈浮緊無汗者為傷寒浮緩有汗者為傷風瘟疫初起原無感冒之因忽覺凜凜以後但熱而不惡寒傷寒投劑一汗而解瘟疫發散汗不易出即強逼出汗亦不能解傷寒之邪自毫竅而入不傳染於人瘟疫之邪自口鼻而入能傳染於人傍人用明雄黃時嚼口中少搽鼻孔可以闢之傷寒汗解在前瘟疫汗解在後傷寒解以發汗瘟疫俟邪內潰汗自然出不可以期且汗出多戰方得解也傷寒發斑則病篤瘟疫發斑則病衰傷寒感邪在經以經傳經瘟邪感邪在內內溢於經經不自傳傷寒感發甚暴瘟疫多有淹纏一二日或漸加重或淹纏五六日忽然加重醫人問此可知消息傷寒初起以發表為先瘟疫初起以疏利為主其所同者邪皆傳胃悉用承氣湯類導邪而出也傷寒下後脫然而愈以其傳法始終有進而無退也瘟疫下後多有未能頓解者何也蓋疫邪有表裡分傳者一半向外傳則邪留肌肉一半向內傳則邪留胃家邪留於胃故里氣結滯裡氣結滯表氣因而不通於是肌肉之邪不能即達於肌表下後裡氣一通表氣亦解則肌肉之邪發於肌表或汗或斑然後脫然而愈傷寒下後無有此症所謂病不同而治法亦異者此也二論瘟疫治法瘟疫之病不與傷寒同也傷寒感天地之常氣疫者感天地之厲氣勿論老少強弱觸者即病邪自口鼻而入內不在臟腑外不在經絡舍於伏脊之同去表不遠附近於胃乃表裡之分界是為半表半裡即針經所謂橫連膜原是也其病初起先寒後熱日後但熱而無寒脈則不浮不沉而數此邪不在經若用麻桂強發其汗徒傷表氣熱亦不減此邪又不在裡若用硝黃早為之下徒傷胃氣其渴愈甚宜用達原飲治疫病初起先寒後熱及頭痛身疼此邪熱之浮越也檳榔二錢厚朴錢半草果仁一錢知母一錢白芍一錢黃芩一錢甘草五分溫服宜速投二三劑以檳榔能消能磨除伏邪為疏利之藥又除嶺南瘴氣厚朴破戾氣所結草果仁辛烈氣雄除伏邪盤踞三味協力直達巢穴使邪氣潰敗速離膜原是以為達原也熱傷津液加知母熱傷榮血加白芍黃芩清燥甘草和中俱有妙用凡疫邪遊溢諸經當隨經引用以助升泄如脅痛耳聾寒熱嘔而口苦此邪熱溢於少陽經也加柴胡如腰背項痛此邪熱溢於太陽經也加羌活如目痛眉稜骨痛鼻乾不眠此邪熱溢於陽明經也加乾葛其分量重輕在臨症時權之三論汗宜緩凡疫病傳變或出表或入里或表裡分傳不得執傷寒論先解其表後攻其里此大謬也蓋裡氣結滯陽氣不得敷布於外務宜承氣先通其里不待發散多有自能汗解以伏邪中潰也如未得汗以柴胡湯和之復不得汗者從漸解也不可苛求其汗疫病多有作戰汗解者或有戰而無汗次日當期復戰戰者必厥戰而厥回無汗者真陽尚在表氣枯涸可以漸愈若厥不回汗不出者危矣但戰不可動擾動擾則止汗不出矣但可溫復而已柴胡湯治下後內無邪熱宜出戰汗而解如猶未汗服此方和解柴胡二三錢黃芩錢半陳皮甘草生薑各一錢大棗二枚古方用人參半夏今表裡實故不用人參無嘔吐不加半夏四論下宜急傷寒下宜遲要待邪傳裡方可議下疫病下宜早以邪伏中下之而邪乃潰但見舌黃心腹痞滿便於達原飲加大黃下之設邪在膜原者已有行動之機得大黃促之而下實為開門卻賊之法即使未愈邪亦不能久留二三日後餘邪入胃用小承氣湯徹其餘毒大凡客邪貴乎早治乘人血氣未亂不至危殆投劑不至掣肘愈後亦易平復以病根之早拔也倘謂下無結糞似乎太早殊不知因邪熱而致燥結非燥結而致邪熱也下其邪熱又何燥結之有小承氣湯治邪在上焦胸脅痞滿自得消散大黃三五錢厚朴錢半枳實一錢姜三片溫服大承氣湯治中焦堅結自得潤化而下大黃三五錢厚朴錢半枳實一錢芒硝二三錢水姜煎服調胃承氣湯治中焦宿結兼有瘀熱大黃三五錢芒硝二三錢甘草一錢水姜煎服邪熱傳裡在上焦痞滿者宜小承氣湯中有堅結者加芒硝軟堅而潤燥設無痞滿惟存宿結而有瘀熱者宜謂胃承氣湯雖無結糞但下黏膩極臭惡物其邪熱散矣若待燥結熱極變症不可揣摩為害不小凡瘟疫舌有白苔者邪在膜原也舌色黃至中央乃熱邪入胃用達原飲加大黃若兼三陽症現照前加藥名三消飲消內消外消不內不外也此治內外有邪為疫症全劑三消飲治毒邪表裡分傳膜原尚有餘結用此兼解檳榔二錢厚朴錢半甘草八分大黃二三錢草果仁一錢白芍知母黃芩葛根羌活柴胡各一錢薑棗水煎服五論下法權變凡瘟疫初起身熱或一日二日舌上白苔如粉早服達原飲一劑午前舌變黃色隨見胸膈滿痛大渴煩躁此伏邪潰而傳胃也前方加大黃下之熾減熱退午後復加煩熱舌黑生刺鼻如煙煤此邪毒最重復瘀到胃急投大承氣湯傍晚大下至夜半熱退次早鼻黑苔刺如失因其毒甚傳變亦速用藥不得不緊設不及時重劑二三日必死但其中有應一日下二三次者有連下三四日者有下一日間一日者其中寬緩之間有應用柴胡清燥湯者有應用犀角地黃湯者至於承氣有三方固宜酌用又宜某日應多與某時應少與稍不得法便至誤事此貴臨時斟酌柴胡清澡湯治疫病下後餘熱未除以此清之柴胡二錢黃芩三錢陳皮錢半知母二錢天花粉錢半甘草一錢薑棗煎服犀角地黃湯治症同前而此方滋陰退火地黃一兩白芍三錢丹皮二錢犀角三錢研碎先將地黃溫水潤濕摘碎入石臼內搗爛再加水如糊絞汁聽用其滓入藥同煎煎成去滓入地黃汁合服濟陰承氣湯新治疫熱宜攻而下之或體弱血虛須瀉補並用大黃或煨為生二三錢枳實麵炒一錢當歸錢半厚朴一錢生地白芍各一錢丹參二錢陳皮甘草各五七分水煎服此方平和凡老年與産後及體弱內傷人遇此瘟疫用之無虞而且有效六論應下諸症舌苔黃白苔邪在膜原也未可下苔黑有一種舌俱黑滑而無苔者此陰症也宜四逆理中八味之類舌芒刺舌裂舌短舌硬舌卷唇裂焦燥口臭唇口起泡起皮鼻孔如煙煤口燥渴若大汗脈長洪而渴未可下宜白虎湯汗更出身涼渴止目赤咽乾氣噴如火脈沉而數小便赤里涓滴作痛小便極臭揚手擲足潮熱在日晡時者為胃實心下痞滿心下高起如塊心下痛腹腸滿腹痛按之愈痛心下脹痛頭脹痛初起頭痛別無下症不可下小便閉屬氣結若大便行小便立解矣大便閉有血液枯竭者無表裡症為虛燥宜蜜煎導及豬膽導屎極臭大便黏膠協即挾熱下利熱結傍流四厥脈厥體厥厥者陽氣內郁不能外泄胃家實也宜下之若下後復厥為虛脫宜補發狂外有虛煩作狂有因欲汗作狂忌下以上三十六症諸屬實熱下之乃解但有實熱必見實證雖證不一必有數端宜下之症顯然於外須及時攻治庶不致遺害七論下後脈證變幻凡里證脈沉而數宜下下後脈浮者當得汗解若無汗而微熱神昏口渴此邪熱浮於外而里無壅滯也宜白虎湯設數下後脈浮數而空當加人參白虎辛溫除肌表之邪熱加人參助一身之血液於是經絡潤澤元氣充周自得汗而解倘不得汗二三日後脈復沉而大熱因膜原餘邪復瘀到胃宜再下之下後脈再浮者仍當汗解宜白虎湯下後脈浮大汗而熱者此內邪散正氣通佳兆也不得再下以上二症俱言下後之熱一以脈沉為邪復一以脈浮為邪散惟以憑脈為斷又有當下失下口舌燥渴身反熱減四肢厥逆此陽氣伏也既下厥回身上不寒脈大而反數津生不渴此里邪去郁陽暴伸也宜用柴胡清燥湯方見上去花粉知母加乾葛隨其性而升泄之此症似宜用白虎湯但熱渴既除又非白虎所宜也白虎湯治瘟疫下後脈長洪而數大渴復大汗通身發熱石膏一兩知母四錢甘草三錢炒米一撮加姜煎服服達原飲後毒邪分離膜原內外之氣已通故脈長洪而數白虎辛涼解散服之或戰汗或自汗而解若邪已入胃不用承氣而用白虎反抑邪毒致脈不行人見陽症而得陰脈愈不敢下投以寒涼愈投愈危惟用承氣緩緩下之六脈自出以下論疫病雜症與傷寒治法不同不得混用八論瘟疫痞滿凡下後痞滿有實有虛脈實者餘邪猶留胸脅按之而痛食後更甚宜再下之若脈不數不潮熱不口渴下後痞更甚者為虛宜補養之化滯湯新治下後餘邪作痞心胸飽脹脈實而數宜導滯除邪陳皮去白一錢青皮六分茯苓錢半厚朴一錢白芥子炒研六分大黃煨二錢水煎服不效加枳實一錢參附養榮湯治下後虛痞不熱不渴脈平而弱當歸二錢白芍酒炒錢半生地酒浸錢半乾薑炒一錢附子制七分人參一錢無人參即以條參或沙參三五錢代之亦可水煎服九論瘟疫嘔吐凡嘔吐有寒有熱邪留胃口熱甚作咽下之減半宜再下之猶有餘熱體弱而不可下者清之至於下後邪盡毫無熱症熱脈而復嘔者以胃口續得寒也宜溫之竹葉石膏湯治瘟疫下後胃口猶有餘熱時作嘔吐用此清之石膏生研三錢半夏錢半甘草一錢麥冬錢半淡竹葉十三片米一撮人參隨其有無生薑三片引若口微渴大便微燥加酒炒大黃一錢半夏藿香湯治下後脈靜身涼不渴不躁胃寒嘔逆半夏錢半真藿香乾薑炒茯苓陳皮白朮各一錢甘草五分生薑八分熱服十論瘟疫蓄血蓄血之病原因失下或下之未盡熱移下焦血分小腹硬痛小便清長小便屬氣清則氣分無病知其在血分也其有喜忘如狂者此胃熱波及於血分血乃心之屬血中留火延蔓心家宜有是症仍從胃治桃仁承氣湯治熱移下焦血分小腹或硬或痛其人如狂大黃三錢芒硝二錢當歸白芍各一錢桃仁去皮尖一錢半丹皮一錢煎服熱除為愈或熱少減宜再服但有餘焰者宜犀角地黃湯調之方見第五不得再用前方恐亡血過多也十一論瘟疫發黃疫邪傳裡胃氣熏蒸則成濕熱透於肌腠遂成黃病由小便不利邪無輸泄也茵陳湯治邪熱鬱滯變為黃疸身目如金口渴尿赤茵除錢半山梔二錢大黃三四錢姜水煎服胃熱移於下焦故用大黃為君熱無以泄臣以山梔利小便而瘀熱自除至於茵陳為治疸退黃之專藥也若用茵陳而兼五苓不惟不能退黃小便間亦難利十二論瘟疫自汗自汗者伏邪中潰氣通故也若脈長洪而數身熱大渴宜白虎湯得戰汗而解有里症下後三五日間汗出不止熱甚則汗甚熱微汗亦微此屬實症乃表有留邪也宜柴胡湯以佐之表解則汗自止設有三陽經症當用前三陽隨經加法加法見達原飲後不得誤認為表虛用黃耆及止汗之劑又有里症不拘天時多作自汗宜下之至於表裡無實症喜熱畏冷面青唇白脈微欲絶忽得自汗為虛脫急當峻補有大病愈後數日每飲食及驚動即汗出此表裡虛怯宜養榮湯倍黃耆十三論瘟疫盜汗里症下後續得盜汗者表有微邪也亦用柴胡湯以佐之瘟疫愈後數日脈靜身涼及得盜汗與自汗者俱屬表虛宜黃耆湯柴胡湯治表有微邪自汗盜汗二症柴胡錢半黃芩陳皮甘草生薑各一錢大棗二枚黃耆湯治瘟疫愈後數日自汗盜汗屬表虛者黃耆蜜炙三錢五味子一錢當歸錢半白朮錢半甘草炙五分照前煎服如汗未止加麻黃淨根一錢五分無不止者但屬實者多邪氣盛也屬虛者少正氣奪也虛實之分在乎有熱無熱有熱為實無熱為虛再參脈息庶幾無誤十四論瘟疫發斑凡疫邪留於氣分解以戰汗留於血分解以發斑以毒氣之疏通也若未下而先發斑者下後而斑漸出者再見下症少與承氣緩緩下之內外兩解湯新治瘟疫發斑猶有微邪內解外托毒自消散當歸錢半白芍一錢陳皮八分大黃酒炒一錢白芷一錢升麻五分甘草七分姜水煎服如大便不潤重加生大黃如下後氣虛斑白而不大見加生黃耆二三錢托裡舉斑湯治因斑誤為大下中氣不振斑毒內陷白芍當歸各錢半升麻柴胡各五分白芷一錢穿山甲炙黃一錢姜水煎服或毒重氣虛脈漸微者加人參一錢可救十五論瘟疫解後調理夫疫熱病也下後暴解余焰未盡大忌參耆白朮恐餘邪壅滯若下後陰虛咽乾舌燥津液枯涸宜以養榮為主清燥養榮湯治邪解後陰枯血燥口苦舌乾目澀咽燥等症知母白芍天花粉各一錢當歸生地各錢半陳皮甘草各八分加燈心水煎服柴胡養榮湯治邪熱下後表有餘焰尚未清涼柴胡一二錢黃芩當歸各錢半白芍生地知母花粉各一錢陳皮甘草各八分薑棗煎服承氣養榮湯治血虛體弱里症未盡須下中帶補當歸白芍生地各錢半知母一錢枳實八分厚朴一錢大黃錢半二錢姜引清痰養榮湯治疫邪解後痰涎湧甚胸膈不清知母花粉貝母炒研栝蔞仁去油橘紅白芍各一錢當歸二錢紫蘇子炒研七分姜引十六論瘟疫下格上嘔瘟疫愈後脈症俱平大便二三旬不行飲食少進即嘔此為下格宜調胃承氣湯熱服頓下宿結不返於上嘔吐立止若誤作胃寒用丁香二陳之類病必加進嘔止慎勿驟補若少與參耆則下焦復閉而嘔仍作矣十七論瘟疫大便泄瀉閉結二證邪氣乘胃不能羈留至午後潮熱便作泄瀉子後熱退泄瀉亦減次日依然為協熱下利宜小承氣湯邪盡利自止二三日後忽潮熱下泄此伏邪未盡治法同前有熱結旁流者胃家實先時閉結續得下利純臭水全然無糞日數度宜大承氣湯得結糞而利自止又有進湯藥而即下者因大腸邪勝失其傳送之職知邪猶在也病必不減宜再下之有大腸膠閉者疫邪傳裡蒸作極臭黏膠及至愈蒸愈結疫毒無路而出下之即愈有大便閉結者邪熱壅滯漸至便硬下之諸症悉去又有愈後不行別無他症此大腸虛燥不可攻也飲食調和自能潤下若覺穀道緊塞夯悶宜作蜜煎導甚則宜六成湯疫病愈後數日忽腹痛裡急者此下焦別有伏邪欲作滯下也芍藥湯治疫病愈後忽腹痛裡急無論已見積未見積俱效白芍錢半當歸厚朴各一錢檳榔二錢甘草七分姜引裡急後重加大黃二三錢紅積倍白芍白積倍檳榔白屬氣病紅屬血病紅白相兼氣血俱病邪盡利止未止者宜此方病愈後脈遲細而弱或黎明或夜半便作泄瀉此命門火虧宜七成湯或有雜症屬實者宜大黃丸下之立愈六成湯治疫病愈後血枯津干大便燥結宜滋陰養血當歸錢半白芍天冬麥冬各一錢威參七錢熟地或用生地三錢肉蓯蓉三錢煎服二三劑仍燥宜六味少減澤瀉七成湯治疫病愈後右尺脈弱夜半或黎明泄瀉真陽虛也破固脂炒錘碎三錢熟附子茯苓人參無者山藥三錢代之五味八分甘草炙一錢肉豆蔻煨去油八分煎服不效宜八味倍附子蜜導煎法治疫病愈後無有別症但穀道乾涸難下以此導之蜂蜜三兩入鐵器內用火熬干捻成挺子寸半長從穀道插入十八論疫病小便雜症熱移膀胱小便赤色邪到膀胱干於氣分小便膠濁干於血分溺血畜血留邪欲出小便急數膀胱不約小便自遺膀胱熱結小便閉塞詳明病源以便調治熱移膀胱或僅熱或有邪小便赤澀或膠濁或閉塞其治在胃輕則小承氣湯重則大承氣湯一下之病自愈矣方見第四內祛邪導滯湯新治邪到膀胱從胃來治胃兼治膀胱若純治膀胱胃熱乘勢擁入膀胱非其治也枳實豬苓木通澤瀉陳皮車前各一錢大黃二三錢燈心煎如澀痛加滑石三錢如短赤加山梔一錢如溺血蓄血加桃仁二錢紅花七分或加漆滓炒令煙盡一二錢豬苓湯治膀胱濕滯小便急數或白膏如馬溲者此不關於胃也豬苓二錢澤瀉木通滑石各一錢車前錢半燈心引十九論瘟疫蛔厥雜病吐蛔多因胃寒用薑附椒梅辛熱之品是也至於疫症始終皆熱但下胃邪蛔厥自愈二十論瘟疫厄逆雜病及傷寒厄逆多為胃寒用丁香柿蒂散不若四逆湯功效更捷而疫病厄逆寒熱皆有治法宜從本症而消息之如見白虎症則投白虎見承氣症則投承氣膈間邪閉則宜導痰如果胃寒則用四逆但治本症而厄自止其他可以類推四逆湯治胃寒厄逆甘草炙二錢乾薑炮三錢附子三錢溫服或涼服二十一論瘟疫飲水煩渴思飲涼水正宜與之但須陸續與飲不得太過太過自水停心下宜四苓散如不欲飲冷易以百滾湯與之四苓湯治水停心下飽悶痞脹胸脅滯塞茯苓二錢澤瀉錢半豬苓錢半陳皮一錢順取流水煎服二十二論瘟疫陽證似陰疫病無陰證似陽者故不附載凡陽極而厥手足厥冷或冷過肘膝甚至手足甲皆青黑劇則遍身冰冷血凝青紫或六脈無力或脈微欲絶以上脈症悉見純陰猶以為陽何也及審內症氣噴如火煩渴譫語口燥咽乾舌苔黃黑或生芒刺心腹痞滿小便赤澀而痛大便燥結協熱下利以上悉陽症所謂陽厥也皆屬下症或投溫劑誤矣要之陽證似陰者外寒而內熱必舌黃而小便赤澀陰證似陽者格陽之症也外熱而內寒必舌淡白亦有黑而滑無芒刺者屬陰寒而小便清白但以舌色小便為據以此推之萬無一失二十三論瘟疫投涼藥之害疫邪結於膜原與衛氣並固而日夜發熱日晡益甚五更稍減此時胃本無病以舌不黃小便清白故也不得誤用承氣使裡氣先虛邪氣乘虛而入為害不小及邪傳胃煩渴口燥舌黃芒刺午後潮熱等症此宜下也而人不知熱由於邪去其邪而熱自止乃用芩連知柏或解毒或瀉心蓋本素問熱淫所勝治以寒涼謂熱病用寒藥可以無疑故每遇熱甚反指大黃能泄而損元氣黃連清熱且不傷元氣更無下泄之患醫家病傢俱以為然由是大劑與之其熱轉甚耽誤至死猶言重用黃連而熱不清非藥之不力病者之數也殊不知黃連苦而性滯寒而氣燥雖與大黃均為寒藥而大黃走而不守黃連守而不走一燥一潤一通一塞相去甚遠且疫病首尾以通行為治若用黃連反招閉塞之害邪毒何由以泄病根何由以拔既不知病原焉能以治疾耶備揀古來治疫闢疫至簡至穩神方於後以便取用共一十四方疫病狂躁用苦參研末薄荷湯下二錢半日宜三服天行熱病結胸脹痛用苦參一兩煎服醋引疫病垂死者用竹去皮浸於大糞缸中以內水服之可救不染疫病用黑豆一杯天將亮時勿令人見置於井中雖共井用水不染或入水缸內共屋居住不染又方於五月五日午時採蒼耳葉陰乾臨時研末冷水調服二錢或水煎閣家皆服能闢疫邪又方用松毛細切七日酒調服三次能闢五年瘟疫又方用馬骨以絳袋盛之男佩左女佩右能闢瘟疫又方用上品硃砂研細末煉蜜為丸緑豆大平旦向東方各吞七粒少用溫水送下勿令近齒永絶瘟疫天行疫病取初病人裡衣小衣於甑上蒸過勿開甑移於遠處一家不染又方凡人欲近前者或用明雄黃或用蒼朮口中細嚼塗擦鼻內常有藥氣自然不染又方用明雄黃一兩丹參衛茅別名鬼箭羽其兜上有毛似箭即天麻之苗也赤小豆各二兩為末煉蜜為丸空心溫水下五錢即與病人共被睡不能傳染名辟邪丸又方用皂角蒼朮焚香可闢疫邪又方用赤小豆以新布囊盛放井中浸二日取出舉家各吞二十一粒不染又方人入疫家以雄黃未調燒酒飲一二盞既出以紙拈探鼻令噴嚏不染
