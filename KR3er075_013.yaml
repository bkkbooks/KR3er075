body:
  text: 卷十三雜證五十論疝㿉腹病曰疝丸病曰㿉有寒氣濕熱虛冷男子為奔豚女人曰育腹小兒有本腎經以任脈為病男子內結七疝女子帶下瘕聚經脈起於中極之下以上毛際循腹裡上關元總諸陰之會瘕者即方書所云狀如黃水者是也總言病之原也所云沖狐㿗厥瘕㿉㿉癃分言疝之狀也丹溪以為疝症皆始於濕熱蓋五臟各有所傷則皆生火火鬱之久濕氣便盛濁液凝聚併入血脈流於厥陰肝性急連為寒所束宜其痛甚是疝為筋病皆挾肝邪若言止在肝經不與內經合也治此者當分寒熱虛實若如張子和一概用下則誤矣察其形氣病氣若果有熱症熱脈顯然外見者治以寒涼則可如無可據而但云疝由濕熱則不可至於濕則腫墜虛者亦腫墜在血分者不移在氣分者多動是故諸寒收引則血注而歸肝下注於左丸諸氣憤郁則濕聚而歸肺下注於右丸且睪丸所絡之地非盡由厥陰而太陰陽明之筋亦入絡也故患左丸者痛多腫少患右丸者痛少腫多但治初受之邪必當以溫經散寒行氣除濕為主切不可早用寒涼致留邪氣以遺其害及其久也則有始終為寒者有因寒鬱而為熱者有元陽受傷而虛陷日甚者當用調補之劑因病制方不得泥執一治疝必先治氣故病名亦曰疝氣非無謂也蓋有寒氣熱氣濕氣逆氣氣在陽分則為氣中之氣氣在陰分則為血中之氣凡氣實者破之氣虛者補之故治疝者必於諸證之中俱當用氣藥脈候弦急搏皆疝診在何部自知其臟尺部滑為寒疝滑脈寸上見為大熱陽與陽並也兩尺見滑者丙丁不勝壬癸從寒水之化也脾脈大而虛木旺剋土厥逆上升寸口脈沉而弱疝氣少腹痛疝屬肝病脈必弦急肝脈弦急常也牢急者生疝系陰寒牢主裡寒常也弱急者死五積散治疝氣初起或愈後復發必有外因痛不可忍最效當歸蒼朮陳皮茯苓各一錢厚朴薑炒八分乾薑炒五分白芍八分麻黃冬天去節六分夏天留節四分枳殼八分半夏一錢桔梗八分甘草炙六分肉桂六分川芎七分加吳茱萸湯泡焙乾七分小茴鹽炒七分生薑六分蔥白五寸同煎熱服治平湯新治一切疝氣痛上衝心小便赤寒熱虛實俱效當歸一錢三分白芍一錢茯苓一錢澤瀉七分豬苓八分山梔七分木香五分蒼朮一錢川楝子一錢小茴六分橘核七分炒研肉桂八分陳皮七分荔枝核一錢三分燒焦研水煎服寒甚加吳茱萸五分脅痛加柴胡七分暖肝煎治肝腎陰寒小腹疼痛疝氣等證當歸三錢枸杞三錢茯苓三錢小茴錢半肉桂一二錢烏藥二錢杏仁一錢薑引如寒甚加吳茱萸不應加附子疝方分類治沖疝氣上衝心二便不通小腹與陰相引痛甚此肝邪上厥也木香散木香陳皮良薑炒乾薑炒各六分訶子枳實各錢半草豆蔻一錢黑牽牛六分半川芎一錢水煎服治狐疝臥則入腹立則出腹與狐相似蜘蛛散蜘蛛十四枚勿用五色者身有毛刺者薄小者須用屋西南有網身小尻大腹內有蒼黃膿者佳去頭微炒研肉桂五分上為末每服一錢此仲景方也治㿗疝陰囊腫大不一痛不可忍荔枝散荔枝核十四枚燒存性用新者大茴炒沉香木香青鹽食鹽各七分川楝肉小茴香炒各二錢為末酒調三錢服治木腎不痛南星半夏黃柏蒼朮枳實白芷神麯滑石吳茱萸昆布山楂等分為末酒糊丸鹽湯下外用馬鞭草搗塗效治厥疝脾受肝邪厥逆心痛吐食當歸四逆湯當歸尾一錢四分附子制肉桂小茴炒各六分柴胡七分白芍八分元胡六分川楝子一錢茯苓一錢二分澤瀉六分水煎服治瘕疝脾經濕熱傳於腎陰腫痛或挺縱不收或漬膿血白自流出烏頭湯治內熱外為寒束川烏頭炮梔子仁炒各三錢煎服治㿉疝陽明經病小腹旁壯如黃瓜血漬脬囊結成癰腫腫少血多用桃仁元胡甘草茯苓白朮枳殼山楂橘核荔枝核等分水煎服治㿉癃疝內有膿血小便不通加味通心散瞿麥穗木通去皮梔子仁黃芩連翹甘草枳殼川楝子去核歸尾桃仁去皮尖炒山楂上等分為末燈心車前子煎湯調服三錢或用五苓散加桃仁山楂亦妙木香楝子散治疝氣久不愈者服此神效石菖蒲一兩炒青木香一兩炒蓽薢五錢荔枝核二十枚捶碎炒川楝子二十枚巴豆二十枚同炒黃赤色去巴豆不用共研末水調服龍膽瀉肝湯治腎本不虛而肝經濕熱火旺筋縮莖中或痛或癢或挺縱不收白物如精隨溺而下者此筋疝也龍膽草酒炒天冬麥冬甘草黃連炒山梔知母各一錢黃芩一錢二分柴胡錢半五味三分水煎服神應散治寒疝諸疝心腹大痛散氣開鬱元胡胡椒小茴等分為末每服二錢酒調下守效丸治久墜而不痛者是即㿗疝之類單宜治濕理氣蒼朮南星白芷川芎山楂半夏枳殼或改橘核等分為末薑汁糊丸鹽湯下有寒加吳茱萸有熱加山梔子又或加青皮荔枝核此方治㿗疝之妙藥桃仁膏治小腹硬而有形大便祕結而黑小水利是血疝也桃仁去皮尖炒大茴炒等分為末每用二錢蔥白二寸煨熟蘸藥細嚼空心酒下不應用四物湯加桃仁紅花朴硝大黃甘草凡少年暴病或為邪熱所閉或腫痛之極者是邪盛勢急非行氣利水之劑不可故下之之法亦不可廢導水丸大黃黃芩各一兩滑石黑醜頭末各二兩甘遂五錢共為末水丸桐子大每服七八十丸水下禹功散瀉水之劑黑醜頭末二兩茴香炒五錢或加木香三錢為末以生薑湯調一二錢臨臥服凡治疝當用五苓散加茴香金鈴子橘核檳榔木通多效凡治陰囊潰爛睪丸脫露名為脫囊用真紫蘇莖葉為細末干敷如未破用香油調塗將青荷葉包上內服芩連甘草木通當歸之類多得保全患者勿慮備採古來治疝至簡至穩神方於後以便取用卒得疝氣小腹及陰中切痛汗出欲死者沙參研末酒服三錢陰疝腫墜木別子仁醋磨調芙蓉葉末敷之疝氣偏腫甘遂茴香等分為末酒服二錢疝氣荔枝核二十四枚陳皮五錢硫黃燒溶入水出毒三錢為末鹽水調面為丸緑豆大空心酒服九丸日三服偏墜掣痛臍下撮痛吳茱萸一斤酒醋開水童便各浸四兩一夜焙乾澤瀉二兩為末酒丸鹽湯下狐疝地膚子五錢白朮二錢半桂心五分為末酒服三錢忌蔥疝氣偏墜大茴小茴俱炒各一兩為末用豬尿胞一具連尿入藥於內扎定入罐內以好酒煮爛連胞搗為丸白湯送下小兒陰腫木香五分甘草枳殼各一錢煎服一切冷氣及小腹痛艾葉香附醋煮丸小腸疝氣莖縮囊腫浮水石為末每服二錢用木通赤茯苓麥冬煎湯調下疝氣或連小腹痛極荔枝核炮微焦一兩大茴香炒六錢研末酒調服凡疝受病於肝見證於腎以厥陰肝脈絡陰器也多因寒濕所致亦有挾虛者當加參朮於溫散藥中又方用橘核炒去皮研末酒調服五錢愈五十一論遺精有心虛腎虛兼肝脾者濕熱脫精遺精之病雖多所因而總由於心心為君火腎為相火心有所動腎必應之則腎不能藏精隨以泄初不為意由是而再而三隨觸而泄斯時精竭陰虛為勞為損去死不遠可不畏哉然亦有無夢而遺者謂之滑精心腎之傷居多治宜固腎夢而後遺者謂之夢遺相火之強為害治宜清心亦有值勞倦而遺者此筋力不勝肝脾之氣弱也有因用心思索過度而遺者此中氣不足心脾之虛陷也有因濕熱蘊藏而遺者此脾腎之火不清也有無故滑而不禁者此下元之虛肺腎之不固也有素稟不足而精易滑者此先天無氣之薄弱也有久服寒涼以致元陽失守而泄者此藥誤之所致也有壯年精滿而溢者此不足慮也故治此之法亦當兼求所因乃善以下治無夢而遺者固精丸治下元虛損精滑將脫者牡蠣煅四兩菟絲子淘淨酒蒸六兩韭子炒二兩龍骨煅四兩北五味微炒二兩白茯苓四兩桑螵蛸酒炙三兩白石脂煅四兩山茱萸四兩杜仲鹽炒三兩上為細末山藥研糊為丸空心鹽湯下直指固精丸治腎虛有火精滑心神不安熟地四兩棗皮三兩黃柏酒炒知母酒炒各八錢牡蠣煅龍骨煅蓮蕊芡實炒各三兩志肉甘草水制二兩茯苓三兩上研細末山藥四兩糊為丸空心鹽湯送下士才倍苓散治腎虛不固者服之神效凡用祕澀藥能通而後能祕此方茯苓倍於五倍能瀉能收是以能盡其妙也茯苓四兩五倍子二兩山藥糊為丸空心開水送下金鎖丹此治嗜欲太過精滑不固澀以救脫之劑蓮蕊六兩芡實炒十兩石蓮子四兩或二兩金櫻膏二斤上為末以金櫻膏和為丸空心淡鹽湯送下人能久服固精益壽但平時服食忌葵菜車前子以下治有夢而遺者茯神湯此治欲火太熾相火甚而夢遺心悸石菖蒲炒八分山藥一錢二分茯神一錢五分遠志去心八分棗仁一錢茯苓一錢黃連八分生地一錢當歸一錢二分甘草四分蓮子七粒捶碎去心水煎食前服柏子養心丸此治勞心有火閣眼夢遺柏子仁微炒去油要盡茯神棗仁生地當歸各二兩五味犀角甘草各五錢上研末煉蜜丸如彈子大辰砂二錢細研水飛金箔五十張為衣午後臥時含化咽汁一丸心火一淨服前固精之方或中時服清火之劑夜間服固精之丸亦可以下治各經兼病而致遺精者經驗豬肚丸此治肝腎多熱易於疏泄者但先察其火之當清者服上茯神湯後服此方白朮麵炒五兩苦參白者三兩牡蠣煅研四兩上為末用雄豬肚一具洗淨以瓷罐煮極爛搗如泥和藥加肚汁搗為丸日進三服米飲送下久服自覺身肥而夢遺永止九龍丸此治腎虛精滑不熱不涼中和之方凡病遺者宜服金櫻子去外刺內子枸杞棗皮去核蓮蕊蓮肉去心當歸酒洗熟地芡實微炒白伏苓去皮各四兩上為末酒糊丸空心鹽湯送下祕元湯此治思慮勞倦而遺者培補心脾自愈志肉八分炒山藥二錢炒芡實二錢炒棗仁炒搗碎一錢半白朮土炒茯苓各錢半甘草炙一錢五味子十四粒微炒搗水煎食遠服久遺無火不痛而遺滑者乃可服之如尚有火覺熱者加苦參一二錢如氣大虛者加黃耆蜜炙一二三錢即服歸脾湯去木香亦妙有脾虛下陷者服補中益氣湯加山藥棗皮有飲酒厚味痰火濕熱擾動精腑而滑者宜服蒼朮白朮半夏橘紅茯苓甘草升麻柴胡升清降濁脾胃健運遺滑自止若有火者加苦參右歸丸治先天不足元陽不固神疲精滑當以補益命門元氣為主大懷地酒蒸八兩山藥炒四兩棗皮微炒三兩枸杞微炒四兩鹿角膠蛤粉炒成珠四兩菟絲子淘去泥沙酒蒸四兩杜仲薑炒三兩當歸三兩大便溏者勿用肉桂二兩可漸加之製附子自二兩可漸加至四五兩上以蜜丸開水送下如陽虛精流加補骨脂酒炒三兩即八味地黃丸亦可酌用一服寒涼等藥以致元陽虛而精滑者亦服右歸丸八味丸可也千金固腎丸此治凡有心腎不交夢遺精滑者熟地八兩棗皮四兩茯苓三兩志肉二兩龍骨煅二兩巴戟三兩去心蓯蓉三兩酒浸蓮蕊二兩牡蠣煅三兩胡桃三兩韭子微炒兩半石連子兩半菟絲子五兩肉桂二兩補骨脂酒炒三兩杜仲鹽炒三兩上為末用山藥研末六兩開水泡糊為丸空心服五六錢加至七八錢淡鹽湯送下此方不涼不熱平康之劑服久而精固體健無不妙也辰砂妙香散治心氣不足小便後精出或不小便而自出或莖中出而癢痛常如欲小便者黃耆蜜炒山藥薑汁炒茯苓茯神志肉甘草湯制各一兩甘草炙桔梗各五錢木香一錢麝香二分硃砂三錢另研水飛上為末溫酒調下每服二錢蘇合香丸治夢與鬼交脈息乍大乍小乍有乍無或綿綿不知度數時常悲笑其狀不欲見人乃其候也白朮青木香犀角香附炒去毛訶黎勒煨取皮檀香蓽撥各一兩熏陸香別研蘇合香各五錢沉香丁香各三錢麝香一錢龍腦一錢硃砂三錢研水飛上為細末用安息香二兩酒熬膏並蘇合香油加蜂蜜和為丸水服二錢治鬼魅相感神效又將此料作丸彈子大以緋絹包裹當心佩之一切邪神疫氣不敢近備採古來治遺精諸病至簡至穩神方於後以便取用思慮傷心夢泄或自流者菟絲子五兩茯苓四兩石蓮子肉一兩半山藥糊丸服夜夢鬼交重用巴戟余用清心寧神之品髓敗精流用補骨脂一兩青鹽一錢末服腎傷精流小便赤大便燥或自利用胡桃四兩茯苓四兩附子兩半丸服小便泄精用龍骨志肉等分丸服或加韭子脫精夢遺鹿角磨水酒引服玉莖不痿精流不已時如針刺名為強中乃腎滯漏痰也用韭子炒補骨脂鹽炒各一兩研末日三服每服三錢水煎勞心泄精龍骨志肉等分為末蜜丸硃砂水飛為衣蓮子湯下腎虛遺精自汗夢與鬼交用豬腰子一枚切開去膜入附子末一錢濕紙包煨熟空心以酒食之五服全愈腎虛泄精用熟地牡蠣煅等分為丸服才睡即遺韭子一合炒白龍骨一兩煅為末每服二錢酒調下此能固真氣暖下元遺精用荷葉研末酒服三錢極驗五十二論痿證有濕熱有虛證有風寒外襲內經列五臟痿證皆言為熱又獨重肺與胃者何也以肺熱葉焦金燥水虧腎絶化源則精氣不能流通而成痿矣取陽明者以谷入胃能溉五臟主潤宗筋束骨而利機關也宗筋謂陰毛中橫骨上下臍兩傍之豎筋也凡人身上下前後無處不達且四肢皆稟於胃必因於脾脾為太陰其脈貫胃若脾病經曰土太過則敦阜敦者厚也阜者高也既厚又高其病則瀉土平而愈此膏粱之疾也若脾虛則不化經曰土不及則卑濫也其治宜以培本為主則不能為胃行其津液以達四肢四肢不得稟水穀之氣乃痿也然吾觀痿躄之人飲食日盛形體日肥何以不能運化精微以強筋骨乎此乃火邪伏於胃中但能殺穀而不能長養氣血經謂壯火食氣胃熱消穀善飢是也治者使陽明火邪毋使干於氣血之中則濕熱清而筋骨自強此經不言補而言取者取去陽明之熱邪耳然細察經文又曰悲哀太甚則胞絡絶傳為脈痿思想無窮所願不得發為筋痿有漸於濕以水為事發為肉痿之類則又非盡為火證故此因生於火者有之而敗傷元氣者亦有之若概從火治則恐真陽虧敗水衰土涸者必不能堪是當因脈因證酌寒熱之淺深審虛實虛者元氣虛也實者邪氣實也之緩急以施治療庶得治痿之法矣凡痿證不一有兼痰積者有濕多熱多者有濕熱相半者有挾氣者臨病制方不拘古方可也而東垣取黃柏為君用黃耆等補藥以輔佐之亦可觸類而會其意矣二妙散治濕熱痿證脈息洪滑煩渴身熱當先去火黃柏炒二錢蒼朮三錢水煎夜服或加甘草羌活各錢半陳皮白芍各一錢威靈仙酒炒八分服之亦佳如氣滯加行氣藥如血虛加補血藥如痛甚者加薑汁熱服加味四物湯治陰虛血熱諸痿軟弱當歸一錢血虛有寒者宜多用血虛有熱者宜少用熟地三錢麥冬黃柏炒蒼朮白芍各一錢川芎七分五味子九粒人參隨便黃連各五分杜仲八分牛膝一錢足不軟者不用知母五分空心服若陰虛無濕或多汗者俱不宜用蒼朮蓋痿證最忌散表亦恐傷陰也此證即知柏地黃湯可用但當適病而止鹿角膠丸治水虧於腎血虧於肝兩足痿弱不宜用涼藥者鹿角膠一斤熟地八兩鹿角霜當歸酒蒸各四兩人參隨便牛膝酒蒸菟絲子淘淨酒蒸茯苓各三兩白朮杜仲鹽炒各二兩虎脛骨酥炙龜版酥炙酒炙亦可各一兩先將熟地當歸牛膝搗成膏後以酒二鍾蒸化鹿角膠加煉蜜為丸每早用淡鹽水下七八十丸金剛丸治腎損骨痿宜此益精蓽薢杜仲薑汁炒各八兩肉蓯蓉揀頂大中紅者酒洗去甲菟絲子淘淨酒蒸各六兩用豬腰子二三對酒煮與蓯蓉先搗為膏後入各藥末干則加煉蜜為丸空心溫酒送下還少丹治脾腎不足而足痿者及一切虧損體弱之證熟地八兩山藥棗皮杜仲薑水炒枸杞各四兩淮牛膝酒蒸下部滑遺者不用遠志去心薑汁浸炒肉蓯蓉酒洗菟絲子淘淨酒蒸焙巴戟肉各三兩北五味川續斷楮實子舶茴香各二兩煉蜜為丸空心淡鹽湯送下六七錢凡痿證與腳氣相類腳氣外因風寒濕正氣與邪氣相搏故作腫痛系邪實也痿由內臟不足所致但不任用亦無痛楚此氣血之虛也宜十全大補湯此外又有實而有積六脈有力飲食若常此實熱內蒸心陽獨亢名為脈痿宜承氣湯下數十遍而愈此不過百之一二耳備載之以廣見聞備揀古來治痿至簡至穩諸方於後以便取用黃柏蒼朮治痿要藥肝腎虛弱而足無力用六味地黃丸不應急用八味地黃丸或加牛膝杜仲虎脛骨龜版黃柏更佳氣虛足痿用四君加蒼朮黃柏黃芩血虛足痿用四物加蒼朮黃柏或下六味丸濕痰足痿用二陳加蒼朮白朮黃芩黃柏之類入竹瀝薑汁經曰肺熱葉焦發為痿躄陽明濕熱上蒸於肺故焦用苡仁多服乃愈五十三論諸蟲附小兒疳蟲諸瘡蟲病有蛔蟲白蟯蟲尸蟲勞蟲瘕蟲凡蟲之為病其類不一而其為害則為腹痛作止往來無定或不時嘔蟲或嘔青黃緑水坐臥不安或面色青白而唇則紅但痛定則能食便是蟲也而其所以生者由濕熱由飲食停積固有之矣此必臟氣之虛弱不能隨食隨化以致淹留而生非獨濕熱已也治之者雖當去蟲而尤宜以溫養脾胃為主但使臟氣陽強非惟蟲不能留亦自不能生也乃無後虞凡下蟲之法按丹溪云上旬蟲頭向上易治若證急又安能待乎凡欲下者先日勿食次早五更用香油煎肉嚼之良久勿吞蟲聞肉香頭皆向上乃以雞蛋煎餅和藥嚼而食之須臾服蔥腸或白水少少以助藥勢下行不一時蟲盡下然後以白粥補之隨服補劑調理脾胃而病可愈若蟲下未盡者再照前法治之凡上唇有瘡曰惑蟲食其臟下唇有瘡曰狐蟲食其肛仲景曰狐惑之證似傷寒而非傷寒也後世何得以傷寒治乎凡小兒蟲積攻心啼哭悶亂噁心吐沫狀似癇病但目不斜腹有青筋耳甚有蛔蟲團聚痛極而厥多似慢驚惟唇口獨紫為異凡蟲有丸種心蟲曰蛔又曰蛔長一尺生髮最多小兒多有之肝蟲曰肉蟲狀如爛杏腎蟲曰蟯蟲至細微如刀截絲縷肺蟲如蠶居肺葉內蝕肺系令人聲啞故成勞瘵殺人惟甚藥所不到治之為難脾蟲曰寸白子孫相接長至數尺胃蟲狀如蝦蟆有曰弱蟲又曰膈蟲狀如瓜瓣有曰赤蟲狀如生肉凡人偏嗜一物必能生蟲即以所好之物加入下蟲殺蟲藥如化蟲散之類無不應手取效凡腹中痛其脈當沉弦若反洪大必有蟲積蓋熱則生蟲故洪大也凡小兒疳蟲名曰疳𧈟由食過傷而成身熱腹大面黃昏睡鼻爛齒齦生瘡或下黑血皆蟲候也治宜去蟲後補氣血治應聲蟲法略化蟲丸治一切蟲病大者即下小者即化為治蟲之總司也鶴蝨胡粉炒苦楝根皮東引不出土者佳檳榔各五錢蕪荑使君子肉各二錢半枯白礬一錢研末或用肉汁調服或水糊丸上旬五更時須照上下蟲大法服之即效化蟲散新治大小蛔厥腹痛多似慢驚但唇口紫者是也使君子去殼十個雷丸鶴蝨甘草炙大黃體虛者不用花椒檳榔各二錢共研細末人大二錢人小一錢用豬肉煮湯調照上下蟲大法服之甘草瀉心湯治蟲證不食面目乍赤乍白此蝕上部曰惑者半夏三錢黃連錢半乾薑黃芩甘草炙人參隨便大棗五枚水煎服此仲景方也不應用化蟲丸照上下蟲大法服之蝕下部者曰狐用苦參湯洗之用雄黃煙燻之妙應丸治諸蟲巢穴堅固難下者用此悉除大黃牽牛頭末檳榔各一兩雷丸去殼錫灰炒不見星鶴蝨各錢半大戟一錢使君子肉煨二錢茴香八分貫衆二錢輕粉三分苦楝根皮五錢上研細末用皂角五皮煎膏為丸強者五十丸弱者減之五更初茶請下少頃再吃溫茶助之即效溫臟丸治諸蟲積用藥下之既下復生由臟氣虛寒宜溫補脾胃以杜其源此方攻補兼用人參隨便白朮當歸各四兩大便泄者不用白芍酒炒使君子煨取肉茯苓川椒去合口者炒出汗細棐肉檳榔各二兩乾薑炮吳茱萸湯泡一宿炒各一兩上為末神麯糊為丸白湯下七八十丸如臟寒加附子一二兩如臟熱加黃連一二兩調補中州散新治一切脾胃虛寒飲食少思腹脹倦怠泄瀉噯氣及蟲積下後宜此調補多服久服功效最大人參無者以時下生北條參二三兩代之腿白朮制三兩茯苓二兩苡仁炒山藥炒白扁豆炒芡實炒各二兩半陳皮八錢桔梗一兩元砂仁去殼炒七錢乾薑炮六錢甘草炙八錢神麯炒七錢白蓮肉炒一兩陳米炒黃少淬水再炒兩半共研細末開水調服五六錢大小悉宜如猶有蟲者用川椒皮苦楝根皮煎水調服五更時再細嚼使君子肉四枚如腹大而脹是有積者加谷蟲七錢共研末服如口無味者薑棗煎湯調服如大便泄者加肉豆蔻麵包煨一兩同研末服如胃寒氣滯作痛者用真藿香煎水調服如歸脾四君參苓白朮散之類可揀而用之備揀古來治諸蟲病至簡至穩神方於後以便取用下蟲用苦楝根皮檳榔鶴蝨煎服三五次蛔蟲用火煨使君子肉五更食以殼煎湯送下寸白蟲用細棐子四十九枚去殼每月上旬以砂糖水砂鍋煮熟空心食七枚七日服盡蟲化為水並治三蟲長蟲赤蟲蟯蟲也神效寸白蟲用檳榔五錢南木香二錢研末米湯調下下諸蟲錫灰蕪荑檳榔為末用石榴根皮煎湯五更送下三錢治小兒蟲痛用皂礬細末六七分以酒調服即苦楝根皮煎濃湯服二三次效小兒蛔蟲用新石灰一撮下水以上清水蒸雞蛋天曉食之腹中蟲病用馬齒莧水煮一碗加鹽醋空腹食之腹有蟲用酢石榴東引根一握洗銼濃煎五更服盡蟲即下斷根四味肥兒丸治小兒瘡積目翳口瘡發熱落髮肚大瘡疥蕪荑炒神麯炒麥芽炒黃連各一兩豬膽汁為丸黍米大每服二三十丸木通煎湯送下或者人小不知服丸化服大蘆薈丸治小兒肝脾疳積發熱體瘦口渴大便不調或瘰癧結核耳瘡目翳牙腮蝕爛胡黃連黃連蘆薈白蕪荑炒白雷丸破開赤者不用膽草鶴蝨各一兩廣木香四錢為末蒸餅為丸白湯下一錢凡疳之為患乃肝脾虛熱津液乾涸之患前方乃專於清熱治疳之劑若脾胃虛弱者當佐以六君子湯每日間服調補脾胃使邪氣退庶可收全功也神授散治傳尸勞瘵此藥早服則蟲自除不能為患川椒二升揀去合口者略炒出汗為細末米湯調服二錢或以酒煮米粉糊為丸每服三十丸以漸增至五六十丸或用米酒送下雄黃兌散治𧈟蟲內蝕肛門生瘡雄黃桃仁去皮各一錢青葙子黃連苦參各二錢為細末綿裹如棗核大納肛內一宿少留綿在外以便取換又方用棗肉入水銀搗不見星捻長二寸綿裹納大孔中一夜次日蟲出癢止凡項同及身上生瘤而癢不可忍者內有蟲宜剖之蟲淨而愈凡陰中生蝨癢不可忍肉內挑出八足而匾紅白不一以銀杏擦之或用銀硃鋪於厚紙上轉筒燒煙燻之皆妙上瘤病亦熏之又方以檳榔煎水洗之凡古方殺蟲如雷丸貫衆乾漆百部錫灰苦楝根皮蕪荑之類皆所常用者也有加附子乾薑者壯正氣也加苦參黃連者蟲得苦而伏也加烏梅訶子者蟲得酸而軟也加藜蘆瓜蒂者以蟲在胸膈欲其吐出也加芫花黑醜者欲其帶蟲瀉下也用雄黃硫黃花椒治瘡疥之蟲也用川槿皮海桐皮治風癬之蟲也用敗鼓心桃符板故尸枕驅勞瘵之蟲也備載之俾人取用凡服治蟲藥總以每月初旬為妙以蟲頭向上故也此緩則待之若急用上下蟲大法濕熱生蟲腹脹而痛以石榴椿樹東引根皮檳榔各五錢空心服腹或痛蟲自下誤食馬蟥蜞腹內生子為患飲地漿下之五十四諸毒附蟲毒中惡凡飲食諸毒如風俗通曰禽獸自死者俱有毒不可食魚無腮者及腮大者俱有毒鱉肚下有紅紋者有毒蟹腹下有毛者有毒煮酒初出火者有毒飲之則生痔溢血夏月飲食但過宿者即有毒夏月酒在銅錫器中過宿即有毒銅器蓋熱食氣上蒸成汗滴下食中即有毒炊湯過宿飲之有毒盥洗生疥桃杏仁有雙者毒能殺人果未成核者俱有毒令人發瘡癤果熟落地者蟲緣有毒屋漏水有毒食之有脹死者用之洗手生疥澤中死水有毒溫泉水不可食以自硫黃中出故溫也患疥者食之浴之自愈體虛者忌之解飲食毒惟真麻油最佳中毒者飲一二杯無不愈者凡中飲食毒覺煩熱脹滿者用水煮苦參三兩飲之得吐即痊中酒毒者經日不醒用黑豆煮浪汁服之不過三盞全愈中河豚魚毒者五倍子白礬各三錢為末水調服之中鱔魚龜鱉蝦蟆及自死禽獸等毒者用豆豉水煎頓服自解中食牛馬毒甘草擂酒服或只用甘草作湯代茶服若口渴飲茶及水者死中諸菜毒食後腹脹者是也以醋解之中巴豆毒口渴下利不止服冷水數口或煮緑豆汁冶飲自愈中砒霜毒煩躁腹痛面青肢冷食中得者易愈酒醋服者難救解法以實地掘坑清水灌注攪成混水飲之謂之地漿可解又方用生緑豆擂粉入水取汁服之中附子毒頭腫唇裂血流瘡疽用緑豆黑豆擂汁或煎湯服中斑蝥毒以豬脂油和緑豆汁飲之中雄黃毒或用搽瘡熏瘡受毒者以漢防己煎湯內飲外洗中服丹毒服地漿水解之中藥箭毒內飲糞清水外塗患處中漆毒紅斑爛瘡以蟹搗黃塗之或用杉樹煎水或以樳雞水洗之被虎傷毒內飲麻油外以葛根煎湯洗之拭乾麻油塗之再以青布作條燃火熏之口渴者沙糖調水飲之被蛇傷處以繩扎縛兩頭勿使毒氣內攻流布經絡急用熱溺久洗傷處拭乾隨以大蒜切片安患處用艾於蒜上灸之每三壯換蒜至痛不可忍去艾候涼又灸總以數十壯至百餘壯為妙少頃再燒不必致肉燒傷起泡即惡毒亦解再以三七嚼爛罨之內用雄黃五靈脂有溏心者真等分為末每用二錢酒調服急則搗蒜汁服亦可被風犬傷急於無風處擠出傷口惡血古有用人吮血者恐人亦受其毒不如擠者為穩如或無血則以針刺出血用小便洗淨即如上被蛇傷者貼蒜艾灸治法以多灸久灸連日灸為妙蓋蒜療瘡毒有回生之功夫病在腸胃尚為難療況四肢受傷經絡遠絶藥不易及者乎故古有淋洗刺灸等法正為通經逐邪設也世有用斑蝥而解其毒者是矣但於一二日間而即用者恐毒未入腹而人先受蝥毒不如五六日用者為佳至二七三七陸續用之則可用斑蝥法列下斑蝥二十一個揀新而大者去頭足用糯米一撮下斑蝥七個慢火炒勿令焦去蝥又下七個炒令米色黃又去之再下七個炒米至赤煙為度去蝥將米研末分三分冷水入香油少許空心調下一分少頃又進以二便利下惡物為度若腹痛急以青靛調涼水解之或以黃連甘草煎湯待冷服之或以涼水調益元散解之甚妙但終身忌食犬肉夫斑蝥毒之尤者雖曰以毒攻毒不如用米以奪其氣尤宜預備解毒藥料況單服斑蝥者乎又方用刺椿樹根皮楊梅子樹根皮半春子根皮等分研末酒調服將死者可救仙方也被蜈蚣傷以鹽擦咬處鹽湯洗患處或用雞公幹開口含之或用生半夏搗末以醋和敷之或取井底泥敷之惟半夏方最妙被蠍螫傷用生半夏白礬等分為末醋和敷之又方用膽礬末擦之立消北方人家宜備膽礬以防蠍而蛇則怕雄黃也被蜂螫傷拔去針用生菜葉擦之或芥菜蘿蔔菜葉一切瓜藤葉俱妙或以童便洗淨用香油擦之或以雄黃末擦之中蚯蚓毒小兒則陰莖及囊俱腫用鴨血塗之或以鴨口含之或以石灰泡熱水洗之久浸之或以鹽湯溫洗之被蜘蛛咬傷腹大如孕外以薑汁調胡粉敷之內飲羊乳論蠱毒蠱之為毒中土無之世傳廣粵深山中人有之欲害人者置於飲食中人中其毒腹痛吐瀉所食之物皆變為蟲侵食臟腑而死死則毒氣流注復染他人所謂蠱疰蠱脈緊數弦直而吐甚者脈洪大者生微細者死驗蠱之法唾津在淨水中沉則是浮則非又法口含生豆中蠱者豆脹而皮脫否則不脹不脫凡中蠱者嚼生黑豆不腥噙白礬而味反甘者是也治法毒在上焦胸膈脹痛以膽礬末五分熱水調服用指探喉吐出自愈毒在下焦肚腹脹痛以鬱金末二錢米湯調服瀉盡為妙盤毒吐血用小麥面一合冷水調服半日三服下毒即瘥自幼食貓肉者則毒不能為害備揀古來解諸惡毒至簡至穩神方於後以便取用凡受毒者用雄黃青黛等分為末新汲水調服又方揀淨土掘坑用清水傾入攪起澄清多飲又方黃連甘草節水煎冷服又方白扁豆生為末水調服三錢又方用灶心土為末涼水調服中蠱毒用明礬芽茶等分為末涼水調服三錢又方石榴皮煎服當吐出活蠱而愈又方用青藍汁頻服凡蠱毒及一切蛇蟲惡獸所傷重者毒氣入腹則眼黑口噤手足強直用明礬甘草各一兩為末每用二錢冷水調下亦可敷患處此方平易不傷元氣大有神效不可以易而忽之也硃砂丸治一切中惡將死者硃砂細研附子生泡去皮臍雄黃各二錢麝香二釐巴豆去油四粒為末蜜丸麻子大每服三丸米湯下不利加三丸以利為度外臺走馬湯治一時中惡心腹脹痛大便不通及飛尸鬼擊巴豆二枚杏仁三枚搗碎熱湯二合捻取白汁飲之自下若下不止飲冷水三口自止五十五論腳病有風濕寒濕濕熱暑熱陰陽附鶴膝瘡疽等症經曰諸濕腫滿皆屬脾土又曰傷於濕者下先受之以足居下而多受濕濕鬱成熱濕熱相搏其痛作矣凡腫者名濕腳氣筋脈弛長而軟或浮腫或生臁瘡之類是也治宜利濕疏風如不腫者名乾腳氣干即熱也筋脈蜷縮而痛或左右枯細者是也治宜潤血清燥然其證有從外感者以陰寒水濕雨霧或坐臥濕地致令濕邪襲入足膝而為病也有從內傷者以肥甘酒醴過度或多食乳酪致令濕熱壅注足脛而為患也夫腳氣之説古所無也其腫痛麻頑即經之所謂痹也其縱緩不收即經之所謂痿也其甚而上衝即經之所謂厥逆也逮夫晉蘇敬始有是名而後則又有類傷寒四證而以腳氣居其一不知腳氣本水濕下壅之病而實非陽邪外感證也如頭痛發熱口渴便閉諸證之兼見者則或有之此時若舍濕邪而作傷寒治者不惟不效其遺患亦已甚矣大抵此證有緩有急緩者或二三月而日甚急者或一二日而即起治之若緩氣上衝心亦能殺人凡腳氣不專在一經須尋經絡之陰陽再察脈息之虛實以為治也如自汗走注者為風勝無汗攣痛者為寒勝腫滿重著者為濕勝前痹證門所當參閲大抵俱宜用川牛膝為引煩渴燥熱者為暑勝若四氣兼中者但察其多者為勝麻者為風痛者為寒腫者為濕寒勝則皮膚中如有蟲行之狀熱勝則縱其藥如黃柏蒼朮治濕熱也防己獨活治腰至足濕熱腫盛也木瓜取入肝走筋也赤苓木通利其濕也桂附散寒濕也木香檳榔香附烏藥宣氣滯也牛膝杜仲蓽薢虎骨壯筋骨也合宜而用皆可奏功凡腳氣患處不一或腿或膝或踝或腳趾或左或右用全張穿山甲鋪於桌上取後腳正在患處之甲不拘多少削去根上皮肉以土拌炒成珠存性數片為引若腳指病取腳爪為引炒亦如之凡治風寒暑濕寒熱之藥在人酌量俱以此為引一刻即效此豫心得之祕也脈理浮弦者風濡弱者濕洪數者熱遲者寒微者虛牢固者實結則因氣散則因憂緊則因怒細則因悲除濕湯治中濕身重腳痛不問久近乾溼並效半夏蒼朮厚朴茯苓各錢半陳皮七分藿香甘草炙各五分薑七片棗二枚食遠服如小便短大便泄加澤瀉豬苓各一錢取穿山甲於患處者每用五六片土炒成珠為引雞鳴散治寒濕流注腳痛浮腫男女皆可服其效如神檳榔三枚橘紅木瓜各五錢吳茱萸蘇葉各一錢桔梗生薑各三錢頭煎二煎兩汁相和次日五更時冷服冬月略溫亦可至天明下黑糞水即腎家所感寒濕之毒也辰巳時必痛住腫消否則再服但飲食宜遲此藥並無所忌茱萸木瓜湯治寒邪入腹喘急疼痛或氣上衝心危急欲絶者吳茱萸一錢三分乾木瓜二錢半檳榔五錢薑引溫服立效散治寒濕壅腫腳腿冷痛或氣上攻心此方消腫甚效檳榔三枚生薑一兩陳皮吳茱萸紫蘇木瓜各五錢溫服三妙散治腰膝濕痛仙方蒼朮三錢黃柏炒錢八分川牛膝二錢揀用淨膝者更妙夜服此方人人可服若房屋陰濕及走水受濕者不時各服一二劑至老無腰膝濕痛之病不可忽過麻黃左金湯治風寒暑濕四氣流注足太陽經腰足攣痹關節重痛寒熱無汗麻黃去節乾葛蒼朮防己防風茯苓各一錢二細辛四分羌活七分甘草八分桂心不見火研末一錢藥調服薑棗引當歸拈痛湯治濕熱遍身疼痛或肩背沉重或肢節紅腫等證羌活黃芩甘草茵陳各錢半人參隨便苦參乾葛蒼朮防風歸身白朮知母豬苓澤瀉各一錢升麻七分空心服檳榔湯治腳氣上衝心腹喘急此能疏壅散氣檳榔香附陳皮蘇葉木瓜五加皮甘草各一錢生薑三片溫服如腳痛甚者加木香婦人加當歸室女加赤芍中滿不食加枳實痰厥加半夏大便不通加大黃小便不利加木通轉筋者加吳茱萸腳腫加腹皮腳痛而熱加地骨皮除濕散風湯新治冒風受濕致為腳氣痿弱筋骨疼痛蒼朮二錢黃柏炒錢半川牛膝二錢羌活獨活防己防風甘草木瓜陳皮各一錢取痛處之穿山甲土炒成珠五六片為引活絡丹治中風手足疼痛經絡中有濕痰非此藥不能通達草烏川烏各泡去皮臍膽星各六錢地龍去皮焙乾乳香去油沒藥各二錢二分蜜丸彈子大溫酒磨化服一二丸八味地黃丸治腎經虛寒水上剋火腳氣入腹切痛喘促少緩則死宜急改作湯藥服之熟地一兩山藥棗皮茯苓各三錢半丹皮澤瀉各錢半肉桂三錢附子二三錢空心服如寒甚倍附子必須大劑小續命湯治腳氣暴痛脈大而緩通治五風八痹痿厥等證麻黃去節八分人參隨便黃芩白芍甘草炙川芎防己杏仁去皮尖炒肉桂各錢半防風一錢附子一錢三分薑棗引如精神恍惚加茯神遠志心煩多驚加犀角如骨節痛而熱者去附子倍白芍骨間冷痛加桂枝腳痛而冷加生薑汁半杯合服燥悶小便澀去附子加竹瀝一合腳弱加牛膝石斛身痛加秦艽自汗去麻黃杏仁加白朮腰痛加杜仲凡腳氣由寒濕外侵者十居八九古人多用熱藥經曰濕淫於內治以苦熱用烏附麻黃行經絡也用乾薑肉桂助陽氣也寒濕既除病無不愈然亦有陰陽之分陰腳氣脛處腫而不紅陽腳氣腫而紅者是也凡膝腫痛不消足脛枯細名鶴膝風脈多弦緊乃足三陰經虛寒濕為患如環跳穴在胯眼及腳根切痛不已外皮如故脈沉數或滑者防生附骨疽以腎經陽氣不足陰血得以凝滯寒化為熱所以為潰為膿或堅硬如石為石疽或皮肉俱腐為緩疽昔人每用八味丸以下部道遠非桂附不能下達補虛散寒滯也若誤用攻毒清熱之藥必成痼疾備揀古來治腳諸病至簡至穩神方於後以便取用凡治腳病藥中俱宜以穿山甲為引如右膝病取後右腳二節之甲去淨根之皮土炒成珠每服加四五片藥性一時即到腳踝病取三節之甲腳指病取爪左腳病取左甲亦如之若手病取前腳患處之甲為引以性能捷達病所也腳氣衝心昏悶垂絶用杉木節四兩橘葉三兩大腹皮四個水煎加童便一杯合服腳氣腫痛用桃花陰乾為末溫酒調服寒濕腳氣用牛皮膠一兩細切麵炒成珠研末每用一錢酒調服風濕腳氣用蘇子高良薑橘皮共研末丸服寒濕腳氣用胡蘆巴故紙木瓜等分為末同蒸蜜丸服風濕腳氣衝心不省人事用檳榔研末童便調服凡風寒濕腳氣如大腹皮吳茱萸烏藥防己川牛膝黃柏五加皮檳榔蒼朮之類皆可揀用以下治腳雜病腳轉筋並一切筋病用松節二兩乳香去油三錢研末每服二錢木瓜煎湯調送臁瘡潰爛以鹽湯洗淨用左草鞋洗淨燒為末加輕粉五分敷之又臁瘡方用黃柏一兩輕粉三錢豬膽汁調搽腳指丫濕癢用陀僧一兩鉛粉一錢熟石膏二錢枯礬一錢濕則擦之干則用桐油調搽腳上雞眼肉刺用枯礬黃丹朴硝為末桐油調搽次日浴二三次自落凡腳疽初時用蒜搗爛攤患處安艾灸之痛甚則易要灸數日每日以五七十壯為度內服大防風湯如體虛者早用十全加附子二錢午用防風湯間服勿緩大防風湯治足三陰虧損寒濕外邪乘虛內侵患鶴膝附骨等證不問已潰未潰宜用此方及治痢後腳疾名曰痢後風此藥祛風順氣活血壯筋骨多服最效人參無者或以淮藥三五錢炒黃代之或以時下洋參條參代之白朮防風熟地杜仲黃耆各二錢羌活川芎各錢半肉桂白芍煨附子牛膝各一錢甘草炙五分薑引或加當歸凡足傷寒濕為腳氣寒濕鬱而為熱濕則腫熱則痛以漢防己為主藥濕加苡仁蒼朮木瓜木通熱加黃芩黃柏風加羌活蓽薢痰加竹瀝南星痛加香附木香活血加四物大便祕加桃仁紅花小便祕加牛膝澤瀉痛連臂加桂枝威靈仙痛連脅加膽草又有足跟痛者屬腎虛不與腳氣同論腳氣疼痛用羊角一副燒過為末熱酒調塗以帛裹之取汁永不再發
