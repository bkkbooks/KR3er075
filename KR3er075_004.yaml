body:
  text: 卷之四傷寒下二十二傷寒變證引言凡傷寒變證不一然內有是病外方有是證非病自病證自證也治者能於表裡寒熱虛實六者精以辨之而因證制方不但證愈而病亦愈矣若淺近者不能會此六者而第拘方書恐其人其脈未必盡合是治病而反以加病烏乎可且方書雖多未盡周全有言其病而不垂其方者有録其方而未明其理者俾人不能應用余故將各證條析於前各方分列於後高明者可由此而妙心裁遲鈍者亦用是而不失其準繩也二十三論傷寒目證凡治傷寒須觀兩目或赤或黃是為陽證若六脈洪大有力或兼躁渴其熱必甚輕則三黃石膏湯重則大承氣湯目白者非熱症不用寒涼眵者即眼糞也火也液干而結當用清涼至於目睛上視謂之戴眼此由腎虧血少其筋脈燥急牽引而上治以培陰養血為主若誤以為風而用風藥則陰益虛而血益燥其危也必矣三黃石膏湯治目赤目黃屬熱者並治瘟疫躁渴等症黃芩三錢黃柏三錢黃建二錢生石膏三四錢研梔子五枚麻黃無表症者不用水煎熱服清涼湯新治目熱多眵羞光而澀赤芍一錢生地半錢白芷川芎各八分荊芥薄荷各六分羌活五分黃芩一錢梔仁炒六分甘草七分蔓荊子八分搗碎水煎服如血虛加當歸白芍歸芍地黃湯新治戴眼當歸三錢白芍酒炒二錢熟地四五錢棗皮錢半丹皮一錢茯苓錢半澤瀉七分山藥錢半秦艽一錢肉桂一錢水煎速速多服二十四論傷寒舌證舌為心之苗本紅而澤若邪熱傳裡則津液乾燥而舌苔生矣苔白者邪未入腑半表半裡宜和解之如小柴胡湯之屬方載第八內黃苔者熱入漸深則燥而澀胃府有邪熱也宜下之但不得遽用峻劑至於黑苔所屬有二黑燥有芒刺脈數有力者此火極似水為熱已極宜大承氣湯之類方載十四內下之若黑而滑潤脈遲無力者此水極似火為虛寒已盛宜附子理中湯及八味地黃湯重加桂附可也方載十六內倘誤認為火稍用寒涼無生理矣二十五論傷寒衄血雜病衄血責熱在裡傷寒衄血責熱在表以寒入於皮毛皮毛通於肺肺氣受傷不能衛血故衄血也脈浮緊無汗者宜汗之自解古用麻桂似屬太剛宜易以柴葛之類若衄後而熱退是邪從衄解矣至於陰虛火動者不宜汗以亡陰也又有傷寒至三四日間邪熱乘肝肝不藏血也太陰脈布胃中胃氣攻衝脾不能統血也然則鼻衄豈盡由於肺乎治者當因內外詳察治之柴葛解肌湯治太陽陽明合病衄血脈浮洪而緊者宜外發表內清熱柴胡錢半乾葛二錢甘草一錢黃芩生石膏各二錢白芍梔子炒黑各二錢羌活八分白芷桔梗各一錢水煎服加減小柴胡湯新治邪熱乘肝鼻衄柴胡錢半半夏人參弱者用之甘草白芍各一錢當歸黃芩各錢半水煎百草霜松柴燒者不用血餘即頭髮燒灰存性蒲黃炒黑各三分上三味再研細末藥調服以紅見黑即止或加阿膠平胃斂陰湯新治胃氣上衝脾不統血致鼻衄而血多者扁豆炒研三錢甘草一錢麥冬一錢牛膝一錢白朮八分山藥錢半葛根一錢三七七分白芍一錢五味子微炒搗碎三四分當歸一錢加百草霜發余蒲黃炒黑各三分藥調服如胃熱加石膏三五錢二十六論傷寒發渴渴者邪熱入臟在五六日之間舌黃便結酌宜清之或下之如竹葉石膏湯或加酒炒大黃一二錢舌黑芒刺面赤便祕用調胃承氣湯以熱甚也陰虛口渴得水而不咽或咽而不多是精竭而滋水潤之宜滋陰如六味之類細察命門火衰用八味冷服以乾者為渴不得誤認為熱傷寒思水為欲愈不可不與不可過與過則水停為變不一若陰盛格陽之症非所宜也至若素不渴者藥後變渴是陽復里溫陰陽均平病將愈矣以上諸方俱載在上二十七論傷寒口瘡喉腫口瘡者心脾鬱熱治宜清涼更有脾氣不足不能按納下焦陰火治宜附子理中湯方載十六內之屬冷服至於喉腫有陰毒陽毒陽毒者是火上衝面赤脈洪或有濃血治宜清肺化毒陰毒者四肢冷而脈沉細以寒積於肺極而生熱宜引火歸源清心理脾湯新治實火上炎口舌糜爛便燥尿赤脈洪有力黃連一錢黃芩錢半黃柏甘草乾葛各一錢梔子八分連翹一錢生地錢半大黃酒炒二錢水煎服或加升麻八分清肺化毒湯新治陽毒喉腫或瘡癰膿血便結脈實甘草錢半桔梗苦參大黃各二錢黃連錢半黃柏一錢連翹去心知母各錢半麥冬錢二分牛蒡子一錢荊芥八分白芷一錢山豆根一錢水煎服如大便實者加芒硝一二錢或加升麻八分附子理中湯治陰毒喉腫四肢冷六脈細寒極生熱但便溏尿清知非熱也速宜救陽用此方冷服方載十六內即八味亦可二十八論傷寒咳嗽咳嗽有三初受寒而即咳嗽者治宜發散至表症除而咳嗽者是寒變熱治宜清涼若口乾古燥火氣上升六脈洪大而咳嗽者是火乘肺也始以清涼不效繼以苦寒降火則肺寧而咳嗽止矣散寒清金湯新治傷寒發熱畏寒脈浮緊而咳嗽者麻黃去節七分桂枝一錢甘草八分白芍一錢杏仁去皮八分陳皮一錢茯苓一錢半夏一錢二分生薑五分蔥白三莖水煎熱服覆取微汗即夏月亦可用以內有白芍斂陰但麻黃留節止用四五分若此際用一味清熱涼藥則肺邪愈蔽咳久莫止清熱寧肺湯新治寒鬱變熱肺燥喉癢咳嗽不寧桔梗錢半麥冬黃芩甘草半夏陳皮去白各一錢麻黃留節四分連翹去心八分栝蔞仁去油八分桑白皮蜜炙一錢枳殼一錢水煎服肺為清靜之腑不容外邪用清涼者須加麻黃庶不致陰藥寒肺也即夏月可用可加馬兜鈴三分降火安金湯新治實火上炎肺受火爍咳嗽煩甚脈洪大者知母二錢麥冬生地各錢半桔梗牛膝甘草各一錢桑皮陳皮各一錢水煎服有痰易來加半夏二錢如咳甚而痰難來者加只母錢半如大便祕結加酒炒大黃錢半逍遙散治乾咳連聲而痰不來或全無痰者此火鬱於中也茯苓柴胡當歸酒拌白芍酒炒白朮各一錢甘草五分薄荷葉三分煨薑六分水煎服愈後宜用六味加歸芍以養肝則不發二十九論傷寒厄逆即噦症也嘔為火氣上衝厄為寒氣阻塞而然亦有伏陰在內或誤用寒涼遂至冷極於下迫火上衝自臍下直衝於胸嗌間者此陰症也故外雖煩躁自覺發熱他人以手按之則冷屬陰症似陽無根之火散亂於外若誤用涼藥下咽則死不得僅用柿蒂湯也丁香柿蒂湯治厄逆因於寒者丁香柿蒂各錢半生薑一錢水煎服加甘草良薑更妙羌活附子湯治陰症厄逆回真陽以降陰火而厄自止羌活八分附子錢半陳皮半夏各一分砂仁炒研一錢木香三錢肉桂二錢加參更妙水煎服加味理中湯新治胃寒厄逆人參少者用山藥三錢炒黃代之白朮錢半乾薑炒一錢甘草炙一錢附子五分丁香三分木香三分半夏一錢草豆蔻煨八分生薑一錢水煎服厄在中焦穀氣不運其聲短小得食乃發厄在下焦真氣不足其聲長大不食亦然臨症者不可不辨也安胃飲治胃火上衝厄逆脈實胸滯便結口渴等症陳皮山楂麥芽木通澤瀉各一錢黃芩錢半石斛二錢水煎服如胃火熱甚脈滑實者加生石膏三五錢三十論傷寒嘔吐嘔者有聲有物吐者無聲有物若有聲無物謂之乾嘔邪在表不嘔邪將傳入則欲嘔屬半表半裡宜和以小柴胡湯方載第八內加陳皮倍生薑過此入里而嘔者有熱有寒熱者清之寒者溫之吐則因胃寒也至於飲水即嘔者水停心下也吐蛔者胃中虛冷也總之診脈察症自得適中加味黃芩湯新治胃熱作嘔煩躁不寧脈洪實者黃芩二錢半白芍錢半甘草一錢半夏錢半生薑二錢水煎服如熱甚加石膏或加黃連大便燥結加酒炒大黃羊夏生薑湯治一切嘔逆半夏四錢生薑一兩水煎服理中加半夏湯治脾胃虛寒吞酸冷咽涎沫嘔吐人參少者以山藥三錢炒黃代之白朮二錢乾薑炒一錢甘草炙一錢生薑半夏各錢半水煎服如虛熱拒格冷服如寒氣內格食入即吐加黃芩七分以引之凡嘔吐惟生薑為聖藥若寒甚者加附子如嘔而胸滿及食谷欲嘔者加吳茱萸一錢湯泡一次用茯苓甘草湯治水停心下眩悸嘔吐半夏二錢生薑三錢茯苓三錢甘草一錢陳皮一錢白朮錢半水煎服如渴而小水不利加澤瀉八分肉桂五分椒梅理中湯治吐蛔人參白朮二錢乾薑一錢烏梅二個川椒一錢微炒水煎服一二劑後蛔安即服補脾藥加使君子肉七個或每早單服使君子肉五六個但須每月初旬蟲頭向上服之即蛔下通脈四逆湯治裡寒外熱脈虛嘔吐一切陰症甘草炙二錢乾薑炮三錢附子二錢嘔吐者加生薑二錢水煎服若假熱拒阻者冰冷與服三十一論傷寒發黃熱邪傳裡胃氣熏蒸則成濕熱透於肌腠遂成黃病由小便不利邪無輸泄也茵陳湯治邪熱鬱滯變為黃病身目如金口渴尿赤茵陳錢半山梔二錢大黃三四錢薑水煎服胃熱移於下焦故用大黃為君熱無以泄臣以山梔利小便而瘀熱自除至於茵陳為治疽退黃之專藥也若用茵陳五苓散不惟不能退黃小便間亦難利三十二論傷寒腹痛腹痛有陰陽虛實之異陽邪痛者其痛不常陰邪痛者痛無休歇陽即熱陰即寒按而痛甚為實按而痛減為虛如煩渴氣粗便結其痛暴甚右關脈實是屬熱而實也若腸鳴泄利時痛不已口唾冷涎重按則減脈緊而弱是屬寒而虛也又有裡寒表熱而腹痛者內喜熱湯肚喜熱尉不得誤以為熱宜細辨治之清熱止痛湯新治陽邪肚痛煩渴喜冷便結拒按症候黃連一錢黃芩二錢梔仁一錢扁豆二三錢炒白芍錢半甘草一錢大黃酒炒錢半陳皮一錢牛膝一錢水煎熱服如繞臍硬痛便結煩渴者有燥屎也加芒硝三錢化服下之因食積者治亦同其症雖昏迷肢冷脈若沉實按腹痛甚者是也溫中湯新治裡寒便溏腹痛喜按口唾冷涎脈虛弱者白朮一錢山藥炒錢半扁豆炒研二錢陳皮八分厚朴薑炒一錢砂仁八分藿香一錢乾薑炒八分甘草炙一錢白芍一錢水煎服如宿食加神麯炒麥芽炒各一錢如嘔逆加生薑錢半如氣滯者加木香四五分暖胃和中湯新治腹痛脹脹喜熱惡食脈沉緊者山藥炒錢半茯苓錢三分扁豆炒研二錢烏藥一錢二分吳茱萸開水炮一次用七分陳皮八分草豆蔻煨研八分木香三分甘草炙八分水煎服加味理中湯新治陰寒腹痛脈緊而微者白朮二錢乾薑炒錢半甘草炙一錢丁香五分白豆蔻去殼炒研一錢水煎服如寒甚而手足厥逆上吐冷涎下泄清水加附子二三錢如假熱在上不納者冰冷與服如表熱裡寒者亦治經謂甘溫能退大熱是也三十三論傷寒蓄血蓄血者熱蓄血分留結下焦小腹硬滿而痛大便或瀉或黑其人如狂喜忘小便自利蓋水由氣化病在血而不在氣故小水利也血瘀於下去血自愈下後宜補脾和肝調和氣血為主海藏曰凡氣症則飲水若蓄血發燥而內不渴雖漱水而不咽也加味玉燭散新治血分有滯小腹脹痛熱蓄下焦當歸錢三分川芎一錢白芍一錢生地黃錢半大黃一二錢桃仁去皮一錢紅花一錢甘草一錢牛膝一錢水煎服血不下加芒硝三錢化溶服並重加大黃老弱婦人血虛者皆可服以代仲景抵當湯三十四論傷寒熱入血室血室者即衝任血海也亦血分也兼男女而言之凡血分之病有蓄血者以血因熱結而留蓄不行故小腹硬痛去之即愈若熱入血室者以邪入血分而血亂不調故下血譫語調之則安調之之法析下治法調陰湯治熱入血室下血譫語煩躁不寧當歸錢半川芎一錢白芍酒炒一錢生地二三錢阿膠炒一錢丹參三錢陳皮八分續斷錢半青蒿錢半水煎服如血熱而下加赤芍錢半青蒿加重如血虛躁熱加熟地三五錢如瘀血作梗血帶紫色加酒炒元胡二錢紅花六七分如邪未散而寒熱時有者加柴胡錢半當知病在下焦無犯胃氣及上中二焦斯為善治三十五論傷寒下利要略曰六腑氣絶於外者手足寒五臟氣絶於內者利下不禁治之稍誤其害不小夫下利有寒有熱寒者多而熱者少因症診脈庶無遺憾溫胃湯新治腹冷痛下泄手足厥逆脈微欲絶及下利清穀山藥炒三錢扁豆炒研三錢甘草炙錢半茯苓錢半白朮二錢乾薑炒一二錢吳茱萸八分開水泡用補骨脂炒錢半肉豆蔻去油一錢三分水煎服如陽虛寒甚者加附子一二錢如腹痛者加木香三四分如滑脫不禁者加烏梅二個木香煨用三分如肝邪侮脾者加肉桂一二錢如外有表症溫中可以散寒下利中虛者亦宜用此加味四逆湯新治陰寒自利外熱而不惡熱口渴而不喜冷四肢厥冷脈雖數而無力此陽脫凶候不得誤認為熱附子二三錢甘草炙錢半乾薑炒錢半木香三四分煨用白朮二三錢烏梅二個肉豆蔻麵煨錢半水煎服如上焦熱格者冰冷服之柴芩煎治傷寒表邪未解內外俱熱煩渴喜冷下利脈實者柴胡梔子黃芩澤瀉木通各二錢甘草一錢白芍錢半枳殼錢半水煎服如小便短而大便多水加萆薢四錢凡治有通因通用如傷寒下利譫語者內有燥屎也如少陰下利心下有痛有硬者必有所積也當下之如小承氣湯及六一順氣湯去芒硝柴胡可以酌用二方載十四內三十六論傷寒協熱下利凡傷寒表症未除而誤下之因熱未退內復作利故云協熱下利此熱字言表熱非內熱也屬表裡俱病故仲景止有桂枝人參湯其義顯然若不明此義認為內熱復誤下之枉人命矣且有不必誤下而妄用芩連治表熱者表症得寒愈熱乃致下利或脾胃素弱逢寒即泄既見下利益云協熱謬誤甚焉桂枝人參湯治傷寒表裡不解協熱下利者桂枝二錢甘草炙二錢白朮錢半乾薑炒錢半人參無者又山藥炒三錢代之水煎服三十七論傷寒二便不通二便屬二腸系腎之竅也其不通者有因過汗亡陰有因熱結二腸由此而譫妄發狂發黃等症隨焉然二症最急先開小便用鹽炒紅淬水服之以指探喉取吐上竅開下竅自通大便祕用豬膽一枚取汁入醋少許用竹管灌入肛中頃當大便待二便通方可用藥血燥者潤之熱結者清之潤燥湯新治血虛而燥二便艱澀當歸二三錢熟地三五錢生地二錢威參八錢肉蓯蓉三錢枸杞錢半牛膝錢半小茴鹽炒三分麥冬一錢水煎空心服清熱湯新治二便熱結扁豆炒研三錢麥冬錢半石膏生用三錢生地二錢車前子錢半知母一錢黃柏一錢威參八錢牛膝二錢水煎空心服或加酒蒸大黃閲卷內有治小便不通者當參閲用之三十八論傷寒發狂狂有實狂如狂二症當分析之不得概視實狂者因傷寒熱邪傳於胃府當下失下以致熱結而發狂不臥不飢妄言棄衣潮熱咽痛便結腹滿或遍體發黃其脈洪實此陽證之順者也下之乃安輕則黃連解毒湯重則六一順氣湯若汗吐下後虛者人參白虎湯可也至於下利太過致亡津液精奪志失變而發狂小便自遺瞳人不轉脈息虛脫者此難治也如狂者由本體虛弱及七情內傷而寒邪復感於外病隨邪起此虛狂也其症外無黃赤之色內無胸腹之結脈不滑實雖或躁擾妄言而禁之則止口不焦渴便不硬結是皆精氣受傷神魂失守之症不能察此便謂陽狂妄行攻瀉必至殺人治者須分陰陽乃得如陽虛者宜補中益氣湯之類陰虛者宜四物六味之類又有陰虛挾火陽虛挾寒者須分治之此外又有蓄血發狂者詳上傷寒蓄血條以上治法是其大略而變症不一宜自酌量黃蓮解毒湯治大熱妄言亂走脈實發狂黃連二錢黃芩黃柏梔子各一錢水煎熱服六一順氣湯方載上十四內治症同前但較甚者實熱作狂也白虎加參湯治汗吐下後微虛發狂者人參無者以山藥三錢代之或以今時北條參三錢代之知母三錢生石膏五錢搗碎甘草一錢粳米一撮加神砂五分細研同煎水煎溫服補中益氣湯治右手脈弱舉動無力聲息短微氣虛躁擾如狂者人參或以山藥三錢代之白朮歸身各一錢黃耆蜜炙錢半陳皮七分甘草炙五分升麻鹽炒柴胡酒炒各三分水煎服四物湯治左手脈弱面白唇淡口乾舌燥血虛躁擾如狂者歸身二錢白芍酒炒錢半川芎一錢熟地三錢水煎服六味地黃湯治左尺脈弱腎水枯竭津液乾涸水虧躁擾如狂者熟地三五錢茯苓錢半棗皮丹皮各一錢淮山藥二錢澤瀉八分水煎服滋陰退火湯新治水虧挾火脈浮大無力躁擾如狂者熟地三五錢生地白芍麥冬各二錢女貞子錢半甘草七分知母地骨皮各一錢黃芩生石膏各二錢水煎服八味地黃湯治陽虛挾寒右尺脈弱假熱躁擾如狂者即前六味地黃湯加肉桂附子各錢半此即陰症似陽即用附子理中湯冰冷與服亦妙凡發狂難制以炭燒紅淬入醋中使氣入鼻即定方可察症診脈凡發狂者或下利或反目直視或汗後復熱不食者即死三十九論傷寒發斑發疹斑隱於皮膚之間視之則得疹纍於肌肉之上手摹亦知二者實無大別總由寒毒不解而然凡傷寒之邪自外而入深入不解又自內而出所以發斑原有虛實之異實者以寒邪傳於胃府變而為熱陽毒外見由誤治使然或陽症誤用溫藥或當汗當下而未致者或下早下遲以及汗下未透者治宜清熱解毒虛者或汗吐下後中氣虛乏或過服涼藥遂成陰症寒伏於下逼其無根失守之火熏蒸脾胃而發斑點其色淡紅隱隱見於肌表與陽症發斑色紫赤者不同此胃極虛治宜溫補又有內傷發斑者因氣血兩虛脈雖浮大按之無力或手足逆冷者先用理中湯以復其陽次隨症治不應加附子以上三症總以脈之有力無力及大便之燥潤為辨犀角地黃湯治傷寒陽毒發斑犀角用鎊磨水入藥無者以升麻錢半代之生地四錢白芍丹皮各錢半水煎入犀角汁服加味升葛湯新治症同前升麻錢半葛根白芍甘草黃芩梔子各一錢水煎加犀角汁更妙如咽痛加元參錢半大建中湯治中氣不足脈息虛大一切虛斑並治積勞虛損人參白朮茯苓甘草川芎當歸肉蓯蓉酒浸白芍熟地麥冬半夏肉桂附子炮黃耆蜜炒各等分生薑三片棗二枚水煎服無參者以淮山藥代之或用補中益氣湯方載上條加葛根白芍亦妙理中湯方載十六內治陰寒厥冷脈緊發斑王瓜即土瓜根搗汁和伏龍肝即灶心土未服甚效四十論傷寒陽厥陰厥此證即前所論陽證似陰陰證似陽也凡傷寒逆者四肢不溫邪傳少陰也厥者手足冰冷邪傳厥陰也然亦有陰厥陽厥之異陽厥者熱厥也寒邪自三陽傳入陰分鬱而為熱便結煩躁譫語發渴脈沉有力或失汗失下所致輕則四逆散重則六一順氣湯之類陰厥者寒厥也初無三陽傳經實熱等症而真寒直入三陰則畏寒厥冷腹痛吐瀉脈沉無力此獨陰無陽也輕則理中湯重則四逆回陽等湯主之四逆散治陽氣亢極四肢厥逆在臂脛之下若是陰證則上過於肘下過於膝以此為辨乃不當用此也柴胡白芍甘草枳殼各等分共研細末米飲調下每服二錢六一順氣湯即用調胃承氣湯亦可二方見十二內治陽厥便結煩躁譫語惡熱口渴四肢雖冷而脈沉實有力理中湯治陰厥腹痛吐瀉不渴畏寒肢冷脈弱等症方見十六內回陽返本湯治症同前此陰盛格陽故陰極發躁而厥人參一錢附子二三錢炮薑一二錢甘草炙一錢麥冬錢半五味子二十一粒陳皮一錢陳茶一錢水煎冷服如面赤者下虛也加蔥五莖黃連四五分用澄清泥漿水煎臨服入蜜五匙如脈全欲絶服後脈微出者生頓出者死即四逆湯亦可救脫陽方用蔥白一大握微搗碎炒熱用布包尉臍下以二包更替尉之內服上陰厥方如假熱拒格冰冷服之四十一論傷寒囊縮此症有陽有陰陽症囊縮者因熱極筋枯而燥縮也用大承氣湯下之陰症囊縮者因寒極筋徑而收縮也用四逆湯溫之若婦人觀其乳頭縮者是也至於陰縮者肝筋寒也陰挺者陰筋熱也大承氣湯方載十二內治陽症脈實躁狂囊縮四逆茱萸湯新治陰症厥逆脈弱囊縮甘草炙二錢乾薑炮二錢附子三錢或生用吳茱萸二錢開水泡一次用生薑錢半大棗四枚水煎冷服加人參更妙如腹痛加白芍二錢溫肝湯治肝腎陰寒陰縮當歸枸杞各二錢茯苓肉桂烏藥各錢半木香五分小茴五七分炒吳茱萸錢半開水泡一次用生薑七分水煎溫服或加附子龍膽瀉肝湯治肝經濕熱陰挺龍膽草酒炒天冬麥冬甘草黃連各一錢黃芩錢半柴胡錢半山梔知母各一錢五味三分水煎熱服或加人參四十二論傷寒撮空證即循衣摸床也此症直視譫語脈弦者生澀者死小便利者可治以其膀胱化氣腎水猶未涸也原由肝熱乘肺元氣衰微極虛之症不論何病但以參耆大劑或八珍之屬補之間有活者若大便祕結譫語脈實者此為實熱宜承氣等湯下之方見十四內四十三論傷寒發喘喘之為症因肺氣上逆而然如未汗而喘是邪在表宜療以解肌痰壅腹滿而喘療以蕩滌停飲而喘療以散水至若直視煩滿氣粗身汗如油此壞症也麻桂各半湯治寒邪在表發熱惡寒氣喘以及一切感冒麻黃七八分桂枝一錢白芍甘草各一錢杏仁十一粒去皮尖薑引或加蘇子陳皮各八分枳桔二陳湯治痰壅氣喘枳殼錢半桔梗二錢半夏二錢茯苓錢半甘草一錢陳皮去白錢半杏仁十五粒蘇子炒研八分生薑六分如咳加麻黃五六分半夏茯苓湯治傷寒飲水過多停滯胸隔心下痞滿氣喘半夏三錢茯苓四錢生薑二錢水煎服即用下方亦可五苓散治症同前或小水不利白朮一錢豬苓錢半茯苓二錢澤瀉一錢肉桂五分車前子一錢水煎服或加蘇子八分不效加甘遂五分勿加甘草以相反也四十四論傷寒腹滿客邪入胃即生脹滿但有虛實寒熱之辨若是陽證必咽乾煩熱脈實有力宜清宜攻若是陰邪必吐食畏寒自利肢冷脈虛無力宜溫宜補清泉湯新治陽證實熱脈洪腹滿生石膏三五錢研知母錢半陳皮去白厚朴薑炒枳殼各錢半大腹皮二錢洗淨黃芩錢半水煎服如便結加大黃二錢以攻之暖胃湯新治陰寒虛滿脈弱便瀉白芍錢二分乾薑炮二三錢丹參三錢厚朴薑炒一錢木香三分香附醋炒六分吳茱萸制錢半生薑一錢水煎服如寒甚者加附子一二錢如食因寒滯加神麯一錢麥芽一錢俱炒用如大便不流動加當歸二三錢四十五論傷寒變溫病暑病冬時寒毒內藏至春發為溫病至夏發為暑病仲景曰發熱不惡寒而渴者溫病也暑病則尤甚矣即熱病也此與夏月中暑者不同義詳暑症門二病宜從清涼固其然也然必表裡俱有熱症方可治用清涼若值四時寒邪感冒未解雖外熱如火而內無熱病可據者不得執以為熱而概用涼藥須察症察脈則見理精矣四十六論傷寒勞復食復勞力感寒一症外則辛苦勞力內則七情勞神外勞則輕若內外俱勞則形神悉困斯為甚矣今人傷寒率多類此輕者和解重者培本治法詳前倘但知攻邪未有不誤人者矣食復者由新瘥胃虛食稍多則復腹滿脈實煩熱便結輕則二陳湯加山楂麥芽砂仁神麯重則大柴胡湯方見十四內四十七論傷寒虛證陽微則惡寒陰弱則發熱是寒熱之有虛也其人本虛故發汗而戰耳聾者陽氣虛也面赤戴陽者陰不足也無陽不能作汗必身冷而脈遲也脈數為熱當消食如食而吐者胃中虛冷也虛則鄭聲言語亂而氣息微也身倦惡寒而利冷極而為厥逆也頭痛嘔吐宜溫以頭痛之有屬陰也自利發熱汗出者有陰無陽也便溏者以裡虛而寒在下也陽明病不能食攻其熱必噦以胃中虛冷也自利不渴者以臟之無火也邪中於陰者必生內栗也汗多而心下悸者亡其陽也發汗病不解而反惡寒者虛也脈陰陽俱緊反汗出者亡其陽也四十八傷寒論治摘要凡傷寒汗吐下之後宜用小柴胡湯加減和之不得便用補藥以餘邪得補而熱復盛惟挾虛傷寒脈弱無力及勞傷者不在禁補之例凡汗藥宜早下藥宜遲此緊要法也宜早者謂風寒自表而入即當速為解表邪從表解免使人里而變生別症宜遲者謂邪傳入陽明之府俟邪熱壅盛於裡下之去其邪熱而愈若未盛而早下之則正氣受傷陰寒之氣乘虛而入恐成痞氣結胸等症凡寒症脈伏或吐瀉脫陽無脈以薑汁好酒各半盞與病者服脈出者生不出者死凡吐血不止韭汁磨墨呷之如無韭汁雞子清亦可凡陰毒昏不知人肢冷唇青藥不得入將蔥切去根葉留白搗餅先將麝香半分填於臍內後加蔥餅於上以火尉之爛即易約三餅稍醒先灌薑汁後服薑附湯用炮乾薑五錢附子一兩或用生附子煎服凡服藥即吐者將生薑汁半盞熱飲吐即止凡頭痛病屬太陽其脈當浮而反沉者固正氣衰弱裡虛而然宜用四逆湯生附子乾薑炮甘草炙此裡虛不得不救也頭不痛病在少陰症當無熱而反熱者因寒邪在表猶未傳裡宜用麻黃附子細辛湯方見十八內此表邪不得不散也凡脈數為熱浮數為表熱沉數為裡熱數而有力為實熱無力為虛熱況細數乎雀啄連來四五啄屋漏半日一點落彈石硬來尋即散搭指散亂如解索魚翔似有亦似無蝦遊靜中跳一躍寄語醫家仔細看六脈一見休下藥凡傷寒神昏而小便仍通者陰氣未絶尚可治之凡傷寒不思欲食不可用溫脾健胃之藥以致反增熱毒為害不淺但因邪去病症一和自能思食凡傷寒虛熱內熾胃中津液乾枯必仗甘寒之藥方可和之但須頻頻浸灌則邪熱得以漸解元氣得以漸復若小其劑復時其日亦無及矣凡傷寒自利當分陰陽二症切不可概投補藥暖藥止瀉藥以致殺人惟自利而身不熱手足溫者屬太陰身冷四肢厥者屬少陰厥陰可用熱藥其餘身熱下利者皆陽症也凡冒露冒雨濕氣內攻而胸前凝滯者此但可燥濕和中若誤下之則濕氣下行損傷脾胃變利變瀉肢冷昏沉男子謂之亡陽小兒謂之慢脾四十九論傷寒誤藥傷人陰盛陽虛則邪客於腠理而未入汗之即愈下之則內虛邪氣乘虛而入引賊破家而死陽盛陰虛邪已入里下之則愈汗之則竭其津液而死邪在半表半裡不知用小柴胡湯和解誤用承氣湯致身熱發黃而死春溫夏暑不寒而熱是伏氣溫熱之症宜用辛涼而誤用麻桂辛溫則內熱愈甚而斑黃狂亂之症生矣陽證似陰而誤用熱藥陰證似陽而誤用涼藥皆死其治載上陰厥陽厥條內傷寒汗多復利小便內外悉竭者死陽明病汗多日晡潮熱小便短少若利之加喘渴者死五十論傷寒用藥須得佐使表汗用麻黃無蔥白不發吐痰用瓜蒂無豆豉不湧去實熱用大黃無枳殼不通溫經用附子無干薑不熱竹瀝得薑汁則行經絡蜜導得皂角能通祕結半夏薑汁可止嘔吐人參竹葉能止虛煩非柴胡不能和解表裡非五苓散不能利小便花粉乾葛消渴解肌人參麥冬五味生脈補元犀角地黃止上焦吐衄桃仁承氣破下焦瘀血黃耆桂枝實表虛出汗茯苓白朮去濕助脾茵陳去疸承氣制狂枳實能除痞滿羌活可治感冒人參敗毒能治春溫四逆療陰厥人參白虎能化赤斑理中烏梅能治蛔厥桂枝麻黃治冬月之惡寒薑附湯止陰寒之泄瀉大柴胡去實熱之妄言太陰脾土惡寒濕惟乾薑白朮以燥濕少陰腎水惡寒燥得附子以溫潤厥陰肝木藏血榮筋須白芍甘草以滋養此經常用藥之大法惟機變者乃用之無窮也五十一論傷寒用藥須配合得宜麻黃得桂枝則能發汗白芍得桂枝則能止汗黃耆得白朮則止虛汗防風得羌活則治諸風蒼朮得羌活則止身痛柴胡得黃芩治熱附子得乾薑治寒羌活得川芎則止頭痛川芎得天麻則止頭眩乾葛得天花粉則止消渴石膏得知母則止渴香茹得扁豆則消暑黃芩得連翹則解毒桑皮得蘇子則止喘杏仁得五味則止嗽丁香得柿蒂乾薑則止厄乾薑得半夏則止嘔半夏得薑汁則回痰貝母得栝蔞則開結痰桔梗得升麻則開提血氣枳實得黃連則消心下痞枳殼得桔梗能使胸中寬知母黃柏得山梔則降火豆豉得山梔治懊憹辰砂得棗仁則安神白朮得黃芩則安胎陳皮得白朮則補脾人參得五味麥冬則生腎水蒼朮得香附開鬱結厚朴得腹皮開膨脹草蔻得山楂消肉積烏梅得乾葛則消酒砂仁得枳殼則寬中木香得薑汁則散氣烏藥得香附則順氣白芍得甘草治腹痛因虛吳茱萸得良薑止腹痛因寒乳香得沒藥大止諸痛芥子得青皮治脅痛黃耆得附子則補陽知母黃柏得當歸則補陰當歸得生地則生血藕汁磨京墨則止血紅花得當歸則活血歸尾得桃仁則破血大黃得芒硝下實結皂角得麝香通諸竅訶子得肉果則止瀉木香得檳榔治後重澤瀉得豬苓能利水澤瀉得白朮能收濕以上所言配合不過荃蹄耳亦貴在人之神其用也五十二論傷寒有宜從證不從脈脈浮為表治宜汗之此其常也而亦有宜下者焉仲景云若脈浮大心下硬有熱屬臟者攻之不令發汗是也脈沉為里治宜下之此其常也而亦有宜汗者焉少陰病始得之反發熱而脈沉者麻黃附子細辛湯微汗之是也脈促為陽常用葛根芩連清之矣若脈促厥冷為虛脫非炙非溫不可此又非促為陽盛之脈也脈遲為寒常用乾薑附子溫之矣若陽明脈遲不惡寒身體濺濺汗出則用大承氣此又非遲為陰寒之脈矣四者從症不從脈也世有切脈而不問症其誤可勝言哉五十三論傷寒有宜從脈不從證表症汗之此其常也仲景曰病發熱頭痛脈反沉身體疼痛當救其里用四逆湯此從脈之沉也里症下之此其常也目脹發熱者屬陽明脈浮大者用桂枝湯此從脈之浮也結胸症具常以大小陷胸湯下之矣脈浮大者不可下下之則死是宜從脈而治其表也身疼痛者常以麻黃桂枝湯解之矣然尺中遲者不可汗以榮血不足故也是宜從脈而調其榮矣此皆從脈不從證也若問證而忽脈者仲景之罪人也五十四傷寒脈證凶候病熱有火者生心脈洪是也無火者死沉細是也沉細或數者死浮而澀澀而身熱者死熱而脈靜者難治脈盛汗出熱不退者凶脈虛熱不止者凶三消失血蓐勞久痢諸虛復發熱者皆逆
