body:
  text: 卷十二雜證四十一論痔漏初起為痔久則成漏痔屬酒色鬱氣血熱或有蟲痔漏屬虛與濕熱痔漏有五曰牝牡氣血酒之異又有腸風痔脈痔雌雄痔皆五痔之別名此方書多立名色以炫人而內經只云因而飽食筋脈橫解腸澼為痔其始也肛邊狀如鼠乳久而不治則傍穿數穴腐潰膿血即成漏矣夫痔輕而漏重痔實而漏虛蓋以痔止出血始終是熱治宜涼血清熱漏流膿水初宜涼血清熱兼用燥濕久宜溫散以始是濕熱終屬濕寒不用溫藥何以去濕而散寒乎非止痔漏百病多有始熱而終寒者其脈其證顯然可驗丹溪下血條云下血久而不愈者後用溫劑正此義也凡痔屬肝脾腎三經之證若肺與大腸二經風熱濕熱熱退自愈不守禁忌亦成漏證此因酒色過度或炙煿過食或勞傷元氣陰虛火熾皆成斯疾其瘡潰爛不一治頗相似其腸頭成塊者濕熱也痛者風熱也大便燥結者火也潰而為膿者熱勝血也當各推所因而治之凡痔漏下血服涼藥不應者必因中氣虛不能攝血用補中升陽之藥而愈至如兼疝兼下疳者皆肝腎不足之變證也用地黃丸益氣湯以滋化源為善若專用涼藥治火者無不致禍且血氣出於穀氣當以胃藥收功胃氣一回血自循經絡矣脈弦絶澀者難治滑大柔和者易治氣虛者脈遲血虧者脈澀敗毒散治痔瘡初起先以此解散脾胃風邪證屬熱者人參隨便茯苓枳殼甘草川芎羌活獨活前胡柴胡桔梗各等分薑引宜多服不換金正氣散治證同前但此屬寒者厚朴薑炒藿香半夏蒼朮陳皮各一錢甘草五分薑棗引加當歸錢半川芎一錢更妙秦艽防風湯治痔漏作痛大便結燥秦艽防風當歸白朮黃柏陳皮柴胡大黃煨澤瀉各一錢桃仁去皮尖紅花升麻甘草各五分空心服如火甚腫痛加芩連荊芥如大便溏而氣血虧去大黃加黃耆川芎白芍後服補中益氣湯為主亦須隨證加入六君子湯治痔漏日久脈數而澀飲食日減肢體愈倦一切不足之證先當服補中交服此方收功人參白朮茯苓甘草炙陳皮半夏各一錢薑棗引如中寒上嘔下瀉加炮薑如氣虛加黃耆扁豆如體弱兼臟毒下血加芎歸枳殼槐花地榆芎歸湯治氣血不調致痔漏日下膿血等證當歸六錢川芎三錢熱加赤苓槐花冷加白苓木香熱則血清而色鮮冷則血濁而色黯或再照命熱加入痔漏腸紅方治痔漏下血十日全愈其效無比黃連一兩好米酒浸一夜撈起陰乾余酒後用百草霜用茅柴燒者不用松柴燒者一兩二味共研末烏梅蒸軟取肉一兩用前浸黃連酒蒸爛三味同搗為丸干加前酒每空心酒下四五十丸三日見效下品錠子治五漏瘰癧及翻花瘤氣核腦疽發背諸惡毒瘡白礬二錢白砒錢半乳香沒藥各二分半真牛黃三釐上將砒末入紫泥罐內次用礬末蓋之以炭火煅煙盡取出研末並各藥俱研極細末用糯米粥糊為小繞香樣陰乾每用二三釐紝瘡內三四次年深者五六次其根自腐如瘡露在外以蜜水調搽嘗有一媼治瘰癧以錠子紝瘡內上用膏藥貼之其根自腐未盡再用去盡更搽生肌藥數日即愈人多異之若氣血虛者內服補藥如十全補中歸脾之類枯痔水澄膏治痔護肉鬱金白芨各一兩共研細末如患內痔候登廁時翻出在外側臥於床洗淨以蜜水調藥敷穀道四邊好肉留痔在外以紙蓋藥良久然後用後枯藥搽痔上仍用溫水於紙上潤之勿令藥干白礬四兩生信石二錢半硃砂一錢研極細末先將信末入紫泥罐底次將礬末蓋之用火煅令煙盡將礬研末置於掌中乃入硃砂末少詳以唾調之搽痔上周遍一日三上看痔頭有焦色為效有黃水出盡為妙中夜上藥一遍來夜又上藥小痛不妨換藥時以溫水洗去舊藥或用荊芥湯洗淨藥照前法上之二三日黃水將盡可於藥中增硃砂減白礬其厚薄看瘡色用之方是活法今人言能取痔者皆此方也如神千金方治痔皆效好信石三錢打碎白礬一兩為末黃丹飛過五錢蠍梢七個焙乾為末草烏光實者去皮生研五錢用明礬入罐內燒令沸次下信拌勻火煅令罐紅煙起為度取為末方入後三味同研以瓷罐收貯如欲敷藥煎甘草湯洗淨然後用麻油調藥塗患處每日上藥三次必出黃水則痔頭漸消黃水出盡搽生肌之藥十日全愈水銀棗子膏治蟲痔癢不止水銀二錢棗肉四錢和研水銀不見星捻如棗核狀少用綿裹納肛門中明日蟲盡出備揀古來治痔漏至簡至穩神方於後以便取用酒痔便血用青蒿葉為末糞前血冷水調服糞後血酒調服以青蒿涼血而不壞胃也痔痛用木鱉仁雌雄各五個研作七丸碗覆濕處勿令乾每夜一丸開貼痔上自消蟲痔用槐白皮煎洗良久欲如大便當有蟲出三次愈痔漏腫痛用椒目研末酒服二錢熏痔神方用白芷黃柏夏枯草紫花地丁各五錢明礬皂礬甘草各一錢煎水先熏後洗二次立愈後用便桶刮垢焙乾每一錢加冰片二分研末攤紙上按痔上二次斷根痔漏作痛先以木鱉仁一兩煎洗次搗蔥葉汁和蜜塗之三時即安翻花痔用木瓜研末鱔魚涎調貼翻花痔用荊芥防風朴硝各五錢煎湯洗之次用木鱉子仁鬱金研末入冰片少許水調敷之丹溪云漏瘡須先服補藥外以附子為末唾津和為餅如三錢厚安瘡上以艾炷灸之但灸令微痛不可令大痛成泡或數十壯以多灸為貴附子餅乾易之來日再灸直至肉平為效如是者或灸至七日十日未成者即消已成者即潰而易收功切勿以潰而不灸也此法最妙百治百愈遠年痔漏用木賊蓮蕊牽牛當歸等分研末水調服外痔寸長用槐花日服並洗之凡雞鴨鵝牛膽俱搽痔有效四十二論癲狂附論邪祟經曰重陽者狂重陰者癲又曰陽虛陰實則癲陰虛陽實則狂而其證亦異癲病之來忽然僵仆或歌或泣如醉如癡常昏多倦多屬不足此心血之虧也狂病之來一發猖暴或詈罵或憤怒登高逾垣不知畏忌多屬有餘此痰火之盛也由此觀之其陰陽寒熱迥然不同不得概謂癲狂悉屬熱也至於癇病即癲病也觀內經所言癲證甚詳而癇則無言即此可知而後世有風癇牛癇豬癇之多種者此不過因其聲之相似遂立此名徒滋惑亂無足憑也痰氣俱安湯新治癲因氣逆痰滯塞心竅壅經絡僵仆搐搦強直香迷至於火之有無宜察其脈證而加減之陳皮去白二三錢半夏二錢膽星一二錢海石二錢白芥子炒研七分澤瀉木通各一錢三分水煎溫服如大便閉結而火不下者加大黃不應加芒硝如痰盛火不降者加童便如舌黃小水不利者加梔子如口渴喜冷者加生石膏如胸脹痛者加青皮如痰因風鼓加鉤藤鉤薑蠶如經絡痰滯不活加竹油薑汁但所加者分量宜重凡昏迷或一時或半日乃蘇者由氣之倏逆修順不必驚惶也滾痰丸治痰迷心竅昏不知事癲風百出礞石煅金色一兩大黃酒蒸黃芩各半斤沉香五錢共研細末滴水為丸臨臥時用熱水一口許送三五十丸過喉即仰臥令藥徐徐而下大半日勿飲食起坐必使藥氣逐上焦滯痰過膈入腹然後動作方能中病或病甚者須連進二三次或多至百丸亦覺無妨吐痰方治胸膈痰滯時發癲病用白礬一兩水煮一時入蜜一合更煮一刻溫服即吐如未吐再飲熱水一盞吐痰為效服蠻煎治水不制火心腎微虛而癲者生地麥冬白芍菖蒲石斛丹皮茯神各二錢陳皮一錢木通知母各錢半水煎服如痰盛多郁者加貝母二錢如痰盛兼火者加膽星錢半如陽明火盛狂躁者加生石膏二三錢或加大黃二錢硃砂安神丸治心虛有火癲癇香迷硃砂三錢細研水飛為衣生地二兩當歸兩半甘草五錢黃連一二兩共研細末湯浸蒸餅為丸硃砂為衣用溫水送下二三十丸抱膽丸治男婦一切癲癇風狂或因驚恐所致悉效水銀二兩黑鉛兩半硃砂細研乳香細研各一兩上將黑鉛入銚子內溶化下水銀結成砂子次下硃砂乳香乘熱研勻為丸雞豆大每服一丸空心井花水吞下病者得睡切莫驚動覺來即安再一丸可除根靈苑辰砂散治風痰諸癇狂言妄走一發仆地吐沫戴眼等證辰砂佳者一兩棗仁微炒乳香明者各五錢上研細末先令病人飲醉但勿令吐居靜室中將前藥作一服用溫酒一鐘調勻令頓飲之便令安臥或一二日或三四日切勿驚覺待自醒即愈若驚寤則難治矣龍腦安神丸治男婦小兒癲癇不論遠近服之悉愈龍腦麝香牛黃各三分細研犀角屑人參茯神麥冬硃砂水飛各二錢桑白皮地骨皮甘草炙各一錢馬牙硝二分金箔十片共研細末煉蜜丸彈子大金箔為衣寒用熱水熱用涼水不拘時化下一丸小兒半丸病久者日進三服但牛黃必須真者方得奏效凡癲癇無火者多若無火證火脈不可妄用涼藥損傷脾胃致有氣血暴脫凶證宜用八珍十全大補等湯或乾薑桂附之類皆所必用不得謂概屬實邪而禁用補劑也三補丸治三焦火熱邪乘心胃二經狂暴不寧宜治火為主而或痰或氣察其甚者而兼治之黃連黃柏黃芩等分為丸淡鹽湯送下如痰甚者加膽星如氣滯者加香附白芥子陳皮之屬如大便燥結屬陽明胃火者加大黃不應加芒硝如口渴加生石膏如小便短澀加澤瀉如舌燥而黃加山梔子清心湯治心受熱邪狂言叫罵動履失常脈實便結者黃連黃芩梔子連翹薄荷甘草芒硝大黃竹葉二十片溫服如系陽明火盛者宜白虎湯亦可方載下三消生鐵落飲治因火致痰甚者狂怒橫暴病出於肝屬木鐵落金也以金制木之意能墜痰鎮心鐵落系鐵砧下錘鐵落下者收十餘斤煮水以煎藥石膏五錢元參秦艽各四錢半龍齒茯苓防風各七錢上研末每用一兩入鐵汁中煎好加竹瀝半杯合服每日三次甚者宜滾痰丸如水不制火而兼心腎微虛者用上服蠻煎或硃砂安神丸亦可大承氣湯治三焦熱甚狂暴非常因據內經奪食即已之義食入於陰長氣於陽故陽旺而狂也故用此湯下之或者火極似水六脈隱伏身表如冰而發則叫呼聲高詈罵逾垣者亦用此湯數下之身溫脈生方得愈也然亦有心血不足神無所依而變亂不常者此屬癲證宜補不宜瀉二者誤認頃刻凶危方見傷寒下證附論邪祟內經十八卷未嘗論及邪祟其言邪氣盛則實者指六淫之邪耳非世俗所謂神鬼妖怪也丹溪云虛病痰病有似邪祟蓋氣血兩虧痰客中焦以致視聽言動皆為虛妄以邪治之其人必死由是觀之何邪之有然必因虛而入蓋正氣虛則陽明之氣不足以勝其幽潛更必因心而客蓋邪心起則淫亂之怪適足以招其類聚乃致面黃肌瘦或奇夢驚心或昏倦嗜臥或飲食久絶而神色不變或妄言禍福而明徵不謬或脈乍疏乍數乍大乍小凡遇此證以補虛安神為主有痰者吐之消之有積者下之攻之用灸法以治其外正言以醒其心未有不愈者若張皇無主純用攻擊不惟病不去而命亦危矣備揀古來治癲狂邪祟至簡至穩神方於後以便取用丹溪曰治癲狂大法以行痰為主如黃連南星栝蔞半夏尋火尋痰分多少而治若痰盛者必用吐法吐後用硃砂安神丸及平肝之藥青黛柴胡川芎之類邪狂橫暴用苦參為末蜜丸茶清下上方也又法將兩手兩足大拇指以二指並縛一處用艾灸爪甲旁七壯須於甲肉之半令四處著火此名鬼俞穴邪附而癲燒蠶蛻紙灰酒調服或於手拇指甲下針之血出即止心虛癲風用鬱金七兩須四川蟬肚者為真生明礬三兩共研末為丸湯水任下六十丸治痰裹心竅者最妙陽狂橫暴用大黃五錢芒硝三錢去胃中實熱當歸五錢補血和陰甘草二錢緩中瀉火加薑棗者引入胃也以大利邪去為度經謂微者逆之甚者從之此之謂也癲風邪祟用硃砂一兩細研水飛青靛淨花二錢以豬心血糊為丸每用茶下二十丸甚者不過三服猝癇用鉤藤甘草煎服風癲用南星九蒸九曬薑汁糊丸服鬼附啼泣或中惡腹痛用升麻煎服中五尸鬼祟用忍冬藤即俗名金銀藤煮汁服或煎膏酒化服邪祟用大蒜搗溶同香墨磨汁醬汁合服又方同雄黃杏仁研末服又方用安息香燒之能去鬼祟並治婦人夜夢鬼交如丹參白鮮皮白蒺藜俱可治邪四十三論三消上消中消下消上消者渴證也隨飲隨渴上焦之津液枯涸其病在肺而心脾陽明之火皆能熏蒸而然故又謂之膈消中消者中焦脾胃病也多食善飢而身日瘦又謂之消中下消者下焦腎經病也小便黃赤或為淋濁或如膏脂面黑體瘦又謂之腎消此三消者屬火證也然有實火者以邪熱之有餘也有虛火者以真陰之不足也若不辨虛實治之則未有不誤者矣白虎湯治上焦中焦實熱脈證悉實身熱舌黃溺赤口渴生石膏二兩知母三錢甘草錢半糯米一撮溫服如渴多飢少汗甚右寸脈虛者加人參一錢中焦火證善飢者亦用白虎湯玉女煎治水虧火甚六脈浮洪滑大煩熱乾渴若溏泄者忌用生石膏三五錢熟地五錢或七八錢麥冬二錢知母牛膝各錢半溫服或冷服如火盛者加梔子地骨皮之屬如多汗者加北五味十四粒如小水不利或火不能降者加澤瀉錢半茯苓一錢六一甘霹散治陽明內熱口渴班黃及熱痰喘嗽二便閉結石膏六兩生用甘草一兩研細末用涼水或用溫水每調服三錢凡中消善飢古以調胃承氣湯下之既已善飢自無停積何堪攻擊如有閉結或可暫用否則用上三方清火可也或各加升麻四五分引清氣上升而渴自止亦妙法也大補陰丸治腎水虧敗小便淋濁如膏陰火上炎左尺空虛黃柏知母各用鹽酒炒俱四兩熟地龜板酥炙或酒炙各六兩上為細末地黃搗膏用豬脊髓同蒸熟加煉蜜為丸鹽湯遂下五六錢即滋腎丸亦可六味地黃丸加黃柏知母更妙滋腎丸治證同前黃柏知母鹽炒各二兩肉桂二錢蜜丸方中用肉桂為引者借辛熱引入腎中之虛熱處俾知柏以成功也以上諸方悉屬陰寒中病即止或於病減一半時宜中時間服補脾之藥如四君歸脾之屬或加麥冬五味補土生金消金生水庶無後患八味地黃丸治火衰不能化氣氣虛不能生液而水涸消渴者真懷慶大地八兩用砂仁四錢微炒研末同米酒蒸曬淮山藥四兩棗皮四兩酒蒸白茯苓四兩人乳拌蒸更妙粉丹皮酒浸曬乾二兩建澤瀉一兩五錢淡鹽水浸曬乾樳桂面揀肉厚甜多辣少者三兩忌火附子四兩製法載本草除地黃棗皮先搗成膏外余藥研細末加煉蜜為丸每早用淡鹽水送七八錢凡三焦之火多有病本於腎而無不由乎命門夫命門為水火之腑水虧者固能為消為渴此腎中之陰虛也宜用六味火甚加黃柏知母或再加麥冬五味壯水清金以制火人固有知之者謂陽虛無火亦能為消為渴則人不信不知水不得火是無陽不化有降無升所以飲水直入膀胱而飲一溲二以致泉源不滋而枯涸為病者是皆真陽不足火虧於下之消證也知用桂附於滋陰藥中則水得火而溫如釜底加薪而氤氳上頂矣此生殺之微權若不詳明再用苦寒以伐生氣則消者日甚不能止矣凡內傷勞病有火虧不能歸源泛遊於外而為假熱證者亦宜知此而用之乃妙閲者宜深思之不得忽過保元湯新治腎虛無火而下焦滑遺者以補陰固澀為主熟地三五錢棗皮二錢山藥錢半菟絲子炒香搗碎二三錢五味三分益智仁酒炒一錢附子錢半肉桂一二錢水煎空心服如虛滑遺甚者加金櫻子淨肉二錢或加烏梅二個如兼大便溏泄加骨脂吳茱萸之屬凡消渴能食病久而小便數者津液必竭則經絡澀而榮衛不行氣血凝滯定成疽瘡又有不能食而陰虛水泛反來剋土土虛不能滲濕而生熱濕熱相搏不能傳化發於皮膚身必腫脹法載腫脹門所當參用渴家不可發汗雖有外邪當從輕治以津液之源竭也凡下消小便濁而有脂液治宜養陰以分清濁切勿用滲濕之藥腎消小便甜者為重是生氣泄脾氣下陷於腎中為土剋水也治宜脾腎兩補或中時用歸脾湯加升麻早夜服六味八味之類全真一氣湯治脾腎兩虛補土以生金養金以滋陰一氣相生故中下二消同治凡脾腎兩經虛證皆可用也熟地三五錢陰虛甚者加重麥冬去心拌米炒黃二錢肺虛者用半白朮炒黃不用土三錢淮牛膝酒炒一錢北五味五分或多用附子由一錢加至二錢水煎服備揀古來治三消至簡至穩神方於後以便取用天花粉治消渴神藥也消渴宜養肺降火生血為主三消者多屬津液枯涸補後天以四物湯為主上消者加五味人參麥冬花粉煎成入生藕汁生地黃汁酒病加生葛汁中消者本方加知母石膏滑石以降胃火下消者本方加黃柏知母熟地五味之類以滋腎水三消忌半夏能食而渴者白虎加人參湯不能食而渴者用四君子加花粉或加乾葛上中既平不傳下消兼泄者用白朮白芍之類病後燥渴者餘熱在肺也用參苓甘草末少許生薑汁調冷服消渴亦有因蟲者用苦楝根皮煎就入麝少許空心服雖危亦救止渴生津用烏梅豆豉煎服又方用五倍子研末水調二錢每日服三次消渴變水腫用真蘇子蘿蔔子等分微炒研末桑白皮煎湯調末三錢每日服三次水從小便出渴止腫消消渴用晚蠶砂焙研冷水調二錢頻服傷寒變證有百合病欲臥不臥欲食不食口苦便赤得藥則吐病名百合變成消渴用牡蠣煅二兩天花粉二兩共研末米湯調三錢每日服三次消渴單用黃連煎服消渴喜水用泥鰍十尾焙乾去頭尾燒灰乾荷葉等分為末每用二錢水調下日二服妙又方浮石蛤粉蟬脫等分為末鯽魚膽七個調服三錢神效大約此病系膏粱肥甘之變酒色勞傷之過富貴者多有之而貧賤者鮮也有此病者宜減嗜欲薄滋味卻思慮治或可瘳若徒恃藥餌則難愈矣四十四論汗證汗有自汗盜汗二證自汗者屬陽虛衛氣不固則腠理松而津液為之發泄也時常出汗而動作益甚治宜實表補陽盜汗者屬陰虛陰虛者陽蒸陰分則血熱血熱則液泄寐則出醒則收治宜清火補陰然陰陽有交互之義不得以陽虛僅補陽而忘乎陰也不得以陰虛僅補陰而忘乎陽也何以言之如病後産後吐瀉失血之後必多出汗是陰虛而陽無所依氣將脫矣必用參耆而滋陰之品須兼用之如黃耆補氣湯用當歸一兩而黃耆止用三錢是補血以生氣也如當歸補血湯用黃耆一兩而當歸止用三錢補氣以生血也因證因脈隨時變化不膠一定彼火盛而汗出者以火爍陰陰虛可知也無火而汗出者以表氣不固陽虛可知也知斯二者而治法可得綱領矣凡人但知熱能致汗汗必熱不知陰亦能致汗汗必冷所謂寒者非曰外寒正以陰中無陽則陰無所主而汗隨氣泄也經曰陰勝則身寒汗出寒則厥仲景曰極寒反汗出身必冷是皆陰汗之謂也治者連救元氣如參耆固所當用即薑桂附子亦不可緩庶冷汗轉熱而病可愈矣玉屏風散治氣虛自汗及傷寒誤治多汗表疏易感風寒者黃耆蜜炙白朮土炒各一兩防風三錢薑引清火固表湯新治內熱有火口渴便結煩躁不寧表虛自汗日夜不止宜清火以固表也黃芩生地白芍各錢半或二錢麥冬石斛女貞子各錢半知母青蒿甘草各一錢淡竹葉十片水煎服如火退而汗不收者加淨麻黃根蜜炒二錢或加牡蠣粉二錢如心虛不寐多汗者加棗仁當歸各錢半如口渴甚者加生石膏三錢如小便赤澀加山梔錢半此方適病而止後宜因人補養大補黃耆湯治虛弱自汗人參隨便茯苓黃耆蜜炙各二錢熟地白朮當歸棗皮各錢半防風甘草炙肉桂各一錢五味子三分肉蓯蓉一錢八分棗引或加麻黃根二錢耆附湯治氣虛中寒自汗如冰肢體倦怠黃耆蜜炙五錢附子制三錢水煎服加人參更妙白朮散治虛風多汗少氣痿弱食則汗甚不治必成消渴白朮炒二兩牡蠣煅防風各一兩研末溫水調服或減半煎服黃耆六一湯治陰陽俱虛盜汗黃耆蜜炙六兩炙草一兩煎服當歸六黃湯治人夜睡寐則汗出如洗醒則汗收此名盜汗由心虛有火陰陽兩虧也用此治之一服全愈真聖方也當歸錢半黃耆蜜炙二錢熟地生地各一錢八分黃柏炒黃芩各一錢二分黃連六分水煎夜服加味知柏地黃湯新治陰虛火動煎熬汗出如干竹以火燃之亦有油也但補其陰火退而汗自止不得概用參耆桂枝斂之如陽虛之自汗也其左尺脈必細數無力或浮大而空熟地四五錢棗皮山藥茯苓當歸白芍酒炒各錢半丹皮麥冬知母黃柏各一錢澤瀉八分五味三分水煎空心服但分量要足水三碗煎二碗頓服則藥下而有效金鎖正元丹治真陰不足遺精盜汗一切虛損補骨脂酒炒四兩肉蓯蓉須大而色鮮紅者酒洗葫蘆巴巴戟去心各八兩五倍子二兩茯苓三兩龍骨酒煮焙乾研末水飛過兩半硃砂細研水飛過八錢上為末先將蓯蓉搗化次入藥末米酒糊丸鹽水送下治汗備要凡自汗盜汗忌用生薑以其松腠理也凡自汗屬氣虛用參耆少佐桂枝以實表也若陽衰身冷加附子凡止汗麻黃根甚捷性走周身引諸藥至衛分而固腠理也凡汗者心之液也人言為心血誤矣但血液同類須當養心而腎主五液入心為汗故汗證未有不由心腎虛而得者治者早夜補腎中時補心二者互用乃妙凡盜汗屬陰虛有火而真元猶未大虧所以歷久無害若自汗則真元耗散肺失統氣之權不治勢必陽亡陰竭而危治自汗以溫熱補益治盜汗以清涼滋補凡自汗服斂藥而不效者當理心血心無所養故溢而為汗宜大補黃耆湯方在上加棗仁二錢有微熱者加石斛二錢凡內傷虛損出汗者用補中益氣湯方見傷寒表條加麻黃根二錢附子五分為佐助但升麻少用須蜜重炒又不可少欲引參耆至表也凡食滯中宮熱氣聚胃而上炎則頭汗出然在病後産後悉屬陰陽兩虛治法不同凡當心汗出名心汗乃思慮傷脾以生脈散或補心丹治之凡兩腿挾中行走勞動汗出腥穢此下焦濕熱也以滲濕熱治之凡飲食時鼻多汗者此肺虛乘熱也治宜補肺涼血凡兩脅下動轍有汗此肝虛乘熱也宜養血補肝凡飲食汗出如洗日久心虛液耗令人消渴偏風宜早治之凡脾經濕熱淫於四肢使手足心常有汗宜抑陽滲濕凡肺脈散當自汗肺脈緩甚為多汗尺脈澀陰傷也多汗論汗出凶證凡身一邊出汗者氣血不周也或吐血衄血頭汗而身無汗者為陽亡陰竭汗出如雨揩拭不逮者名洗尸汗三陽絶也脈不為汗衰者汗出喘甚者汗出脈脫者汗出身痛甚者汗出發潤如油之黏如珠之緩而不流者皆死證也不治備揀古來治汗至簡至穩神方於後以便取用止汗如麻黃根浮小麥烏梅五味子小黑豆龍骨牡蠣之屬可隨宜擇用黃耆得防風而固表止汗之力愈大肉桂最能實表止汗盜汗用桑葉焙乾研末米飲調服盜汗用五倍子為末津調填滿臍以綢帛縛定一夜即效次日換之或少加枯研末凡汗遺精用鹿角霜二兩龍骨炒牡蠣煅各一兩為末酒調服或米酒糊丸鹽湯下虛勞出汗用牡蠣粉麻黃根蜜黃耆等分為末每用五錢煎服或為丸服凡汗用艾葉茯神烏梅煎服四十五論痙證附勞風風搐各經兼證古言痙今言痓傳寫之誤也仲景曰太陽病發熱無汗反惡寒者名曰剛痙發熱汗出而不惡寒者名曰柔痙又曰太陽病發熱太多因致痙風病下之則成痙瘡家不可發汗汗之亦成痙蓋誤汗者必傷血液誤下者必傷真陰陰血受傷則血燥血燥則筋失所滋由是為拘為攀反張強直頭搖口噤戴眼面赤或身熱足寒之類皆是也況內經之經脈篇曰止言足少陰腎經足太陽膀胱以膀胱為津液之腑腎為藏精之臟病在二經水虧可知故治此者當以真陰為主何今人但見此證多門分類而悉作風治不知外感之風寒邪證也治宜解散內生之風血燥證也止宜滋補矧風藥多燥當此精敗血枯之候而再用燥劑吾未見有能回生者矣其論已詳於中風門所當參閲凡痙證多由誤治而致或者正氣虛而外邪間有襲者因風則有汗脈必浮緩因寒則無汗脈必浮緊因濕則身痛脈必沉細更有陽緩陰急則久久拘攀陰緩陽急則反張強直二證宜分別之十全大補湯方見傷寒補條治氣血兩虛內起風火發痙少加附子五六分行參耆之性以補衛引歸地之性以補榮則痙不治而自愈矣氣血兩補湯新治痙因汗因瀉氣血兩虛六脈虛弱或浮大無力不得誤為實證治之人參少者以山藥四五錢炒黃代之白朮錢半甘草炙一錢棗仁炒二錢當歸瀉者土炒二錢熟地砂仁煎汁炒乾三錢白芍酒炒錢半水煎服如嘔惡加生薑二錢如汗多加五味子十四粒如氣虛加蜜炒黃耆一二錢如兼外感風寒而拘攣者加鉤藤鉤荊芥之類耆附湯治陽虛汗多亡陽而痙者黃耆蜜炒附子等分薑引若汗多兼火而燥熱者宜當歸六黃湯方見汗證門溫胃湯治痙因誤下而瀉不止者白朮二三錢山藥炒扁豆炒茯苓各錢半蓽薢四錢車前子去殼微炒甘草炙乾薑炮各一錢薑棗引溫服如瀉甚者加肉豆蔻麵炒用二錢或補骨脂亦可如陽虛下脫不固者加附子二錢或加烏梅二個煨木香三分如四肢拘攣口眼歪斜者屬木動風搖兼侮脾土而泄者加肉桂一二錢凡有泄者宜參此用清化飲治痙因有火脈見洪滑證多煩熱宜滋陰以救血燥白芍麥冬生地茯苓各二錢丹皮黃芩各錢半石斛錢半溫服如熱甚而渴加石膏二三錢如小便澀者加木通錢半或加黃柏梔子如兼外邪發熱加柴胡錢半如陰虛血虧者加熟地三錢山藥二錢當歸二錢若熱甚煩躁加黃連黃柏知母青蒿地骨皮之類可隨證加用大和中飲治痙因汗下太過陽虛陰盛復感邪而畏寒莫解者熟地白朮當歸各二三錢人參隨便山藥錢半甘草炙一錢柴胡麻黃肉桂各一二錢白芍酒炒一錢生薑錢半溫服如汗甚去麻黃加黃耆二錢如寒甚加附子一二錢降火化痰湯新治痰因火炎而致痙者不得不暫為清理但得痰氣稍開便宜調補氣血以此證候多屬虛火虛痰也陳皮半夏茯苓甘草貝母膽星海石木通各錢半白芥子六分溫服如火盛痰不降者加童便一小鐘神術湯治無汗之剛痙兼有濕者蒼朮防風甘草各三錢加羌活或獨活麻黃用蔥白為引白朮湯治有汗之柔痙兼有濕者白朮防風甘草各二錢加桂心黃耆用生薑為引附勞風風搐各經兼證凡勞風證者因勞後汗出遇風其證共治與痙同法但須審其勞損何臟如因腎虛捐者即為腎勞風也宜隨證施治又風搐證者本與痙證不同經曰諸風掉眩曲直搖動皆風木之用陽主動陰主靜由火盛制金金衰不能平木木旺而自病或平肝或吐下因證治理是雖不可與痙同論亦可引以證痙之風熱由內作者傷寒發汗太過多成痙證此際尚身熱足寒項強惡寒頭搖口噤背反脹者痙兼太陽也若頭低視下手足牽引肘膝相構者痙兼陽明也或一目左右斜視並一手足搐搦者痙兼少陽也治法因證再察脈息在表無汗汗之有汗止之陽明痙屬裡實者下之少陽痙半表半裡和之所謂各隨其經也按此證間或有之施治時須顧氣血四十六論暑證此正熱時暑病也與冬傷於寒至春發為溫病至夏發為暑病者不同暑本夏月之陽邪其為病也有冒有傷有中並有因暑而致者名雖不一而總不外虛實二字其證其脈辨而治之庶無差也經曰脈盛身熱謂之中熱乃有餘之證其候頭痛壯熱大渴引飲治宜清涼脈虛身熱謂之中暑乃不足之證其候頭痛惡寒身倦自汗治宜溫補其有陰寒之極者須用薑附此內經舍時從證之法也彼因暑而致者畏暑貪涼寒邪襲於肌表發熱惡寒頭痛身疼等證當以傷寒法治之至於不慎生冷寒涼傷臟而為嘔吐腹痛等證此寒邪在內治以溫中為主不得概以暑熱論也參蘇飲治傷寒惡寒發熱頭痛無汗夏月感冒等證人參蘇葉乾葛前胡陳皮枳殼半夏茯苓各八分木香三分桔梗七分甘草五分薑六分棗一枚熱服黃連香薷飲治陽暑中熱口乾舌燥小便赤短身熱目赤脈洪體壯一切實證若中陰暑而誤用之則陽散陰泄為害不小黃連二錢香薷錢半厚朴薑炒錢半扁豆炒三錢研茯苓錢半甘草一錢熱服如大便泄而小便短加蒼朮澤瀉萆薢此味要重或加木瓜腹痛加白芍香薷之性香竄而沉寒惟胃實而陽盛之人宜之若氣虛體弱者服之損傷胃氣反致吐泄腹痛陰寒危敗等證何今人不知至熱時老少時常服之云以防暑正適以致疾也補中益氣湯方載傷寒表條治脈微體虛不可發汗補元氣即以解寒邪也如伏陰在內而寒不易散嘔泄畏寒內無熱證不拘夏月即用理中加白芍之類不可疑也前傷寒條內所宜參閲和胃飲治夏熱多食生命寒濕傷脾腹痛吐瀉等證陳皮厚朴各錢半乾薑炮甘草各一錢此方凡藿香砂仁扁豆木香澤瀉茯苓之類可隨證加用如兼外感可加柴胡桂苓甘露飲治炎熱多汗煩渴少氣多火小便不利屬陽暑也滑石二兩石膏寒水石白朮各一兩茯苓澤瀉各五錢肉桂錢半豬苓三錢上為末溫水調下或煎服亦可清暑悉安湯新治冒暑身熱便泄口渴汗出腹痛尿赤等證蒼朮白朮各錢半扁豆三錢炒搗宣木瓜二錢渾瀉木通車前子各一錢陳皮八分茯苓錢半生白芍錢半甘草一錢滑石三錢香薷五分水煎服此方不拘老幼男婦皆可服清暑益氣湯治暑熱傷氣倦怠胸滿汗出身痛煩熱小便黃大便溏昏沉不食口渴脈息虛弱等證人參無者以山藥炒黃三錢代之黃耆蜜炒二錢白朮錢半當歸身錢半蒼朮一錢三分陳皮神麯麥冬甘草炙各八分黃柏炒六分乾葛八分澤瀉七分升麻蜜炒六分青皮五分五味三分水煎服大順散治中陰暑食少體倦發熱作渴腹痛吐瀉脈沉微者乾薑炮肉桂杏仁炒各二錢甘草錢半共為末每用三錢水煎服如煩躁者井花水調服不效加附子錢半録古來救傷暑死者簡易諸方於後以便取用凡暑病不可發汗汗多亡陽中暑死者不可飲冷水臥濕地閉絶三焦流通之氣不可救也移於陰處即挖路上熱土堆臍上作窩多令人溺滿暖氣透入即醒隨搗蒜用泥攪水調服又方用熱童便灌之外以布蘸熱水尉臍一蘇服清暑益氣湯少下黃柏澤瀉青皮或服補中益氣湯之類無蒜服地漿水亦可暑毒瘧痢用雄黃研細蒸餅和丸甘草湯下神方也四十七論濕證濕之為病有因於外感者如天雨襲虛地氣上蒸或汗衣久沾或重霧寒露未避是也有因於內傷者如嗜瓜果飲乳酪啜酒漿喜生冷是也其為證也濕在肌表為寒熱自汗在經絡為痹為重筋骨疼痛手足痿弱在肌肉為麻木胕腫黃疸在臟腑為尿赤便泄腹痛後重在上則為痰在下則為痢然濕證雖多不出濕熱寒濕二者而已熱者宜清宜利寒者宜溫宜燥經曰諸濕腫滿皆屬脾土東垣曰治濕不利小便非其治也觀此宜以補脾利水為主而濕自治但當分其表裡虛實庶無差謬蓋濕從表入者汗以散之在上者宜微汗之在中下二焦者宜疏利二便或單用淡滲以利小便然又有説濕熱之證及微虛微熱老利之可也至於大虛大寒最忌下利即有濕熱而體虛寒精血已虧而復利之害必甚矣宜用升陽風藥兼實脾土乃為精工論曰濕淫所勝風以平之又曰下者舉之得陽氣升騰而愈是也利水滲濕湯新治濕熱煩渴溺赤身痛脈息洪滑實數者蒼朮厚朴薑炒茯苓黃芩各錢半澤瀉豬苓木通車前陳皮梔子炒食遠服如大便燥結加酒煨大黃錢半枳殼一錢如黃疸加茵陳二錢如兼外感加羌活一錢二妙散治遍身濕痛蒼朮三錢黃柏炒二錢水煎夜服三妙散治腰膝以下濕痛即前方加川牛膝二錢夜服加味五苓散治外中寒濕身痛溺澀口渴寒熱白朮豬苓茯苓各錢半澤瀉肉桂羌活各一錢水煎服此太陽經解表之劑風濕寒濕俱治聖朮煎治寒濕之甚者瀉痢嘔吐身痛倦怠脈弱無力白朮五錢乾薑炮肉桂各一二錢陳皮七分甘草炙一錢食遠服甘草附子湯治風濕相搏骨節疼痛小便不利大便反快甘草白朮各二錢附子錢半桂枝一錢溫服升陽除濕湯新治一切陽衰濕證白朮錢半白芍酒炒一錢扁豆炒研錢半蒼朮一錢羌活八分防風甘草炙獨活各一錢升麻鹽炒六分柴胡酒炒五分溫服凡濕病不一或黃疸腫脹泄瀉痰飲痹痛淋祕之類當於各門參之四十八論燥證燥病由火而至又甚於火者也治之當察端委不得就肺一經而言夫肺與大腸相表裡大腸為庚金肺為辛金其體本燥而義能生水者賴坤陰上輸得以水精四布雖燥而不至於燥也逮至脾榮不足不能生金則金虧而腎水之化源竭矣由是子母不能相生濡潤之機關絶滅一有所傷火乃踵起或因風火或因炎熱或因病後陰虛火動皆能致燥其為病也在外則皮毛枯稿在上則咽乾口燥在中則煩渴便焦經曰諸澀枯涸幹徑皺竭皆屬於燥是也治之者當知補土以生金而肺之母旺滋腎以涵金而肺之子亦旺生生不絶津液充足何燥之有倘寸強尺弱由乎釜下無火而鍋蓋乾燥者用八味丸為水中補火之法古方有半硫丸之設意深遠矣麥門冬湯治土虛不能生金津液涸竭虛火逆上咽喉乾燥等證麥門冬去心三錢半夏錢半人參無者以威參一兩代之甘草錢半大棗四枚粳米四錢水煎服半夏味辛能潤不得疑為燥也當歸阿膠湯新治一切乾燥口渴便焦津涸血枯等證當歸二錢白芍錢半熟地三錢茯苓二錢阿膠三錢制麥冬錢半栝蔞仁去油一錢甘草一錢大棗三枚食遠服如渴甚加花粉二錢如大便乾焦加肉蓯蓉二三錢威參七錢或再加火麻仁郁李仁各二錢血燥加桃仁搗膏調服紅花五分如大便風祕加秦艽三錢防風錢半凡欲潤者如牛羊乳藕汁蜂蜜之類是也加味地黃丸新治水虧乾燥咽痛便結皮枯筋急等證熟地三錢棗皮錢半茯苓錢半山藥二錢丹皮一錢澤瀉七分五味三分炒麥冬錢半阿膠蛤粉炒二錢空心服八味地黃湯治腎中無陽以致元氣不能上蒸而精血枯涸者熟地三五錢棗皮茯苓山藥各錢半丹皮一錢澤瀉七八分肉桂錢半附子錢半空心服凡燥病本火以爍金以致金不能生水故乾枯之證見矣但脾宜溫補以生肺不得燥補以傷腎證似有餘實為不足補陰之功得力則虛火退而證自瘥萬勿輕用寒涼脾胃受傷則化源之機絶矣故治火證尚有當用寒涼至於燥證惟宜潤劑治風燥莫如養血清熱燥莫如壯水大腸血燥便澀用桃仁去皮尖炒研麻仁當歸各三錢其效如神桃仁杏仁潤大腸功同但杏仁治氣祕桃仁治血祕晝便難屬氣脈浮夜便難屬血脈沉俱宜用陳皮佐之四十九論火證經曰君火以明相火以位心為君火為神明之主故謂之明腎為相火為發生之根故謂之位天非此火則不生物人非此火則不能有生此真火之不可稍有衰也火得其正即為陽氣倘真火衰而元陽敗則邪火自熾由此而有實火虛火濕火風火鬱火陰火五臟火六腑火遊行不歸經火其為病也外則見於皮肉筋骨內則見於臟腑九竅形質之間本有熱證亦惟暫抑亢炎以治標因所因而調之以救本則火各歸經依然清涼切不可過投寒劑以傷脾胃耳夫君火者心火也可以水滅可以直折相火者龍雷之火也不可以水滅直折從其性而降伏之且如天陰雨龍雷之火愈盛惟太陽一照而火潛藏此陰虛之火由腎中之陽不足則寒從中生而火無源可歸所以浮散於外此非參耆桂附之溫熱則無以引火歸源而外假熱之證生矣至於腎中之陰不足則水虧火焰又當滋水以制陽光宜用甘涼不宜溫熱第溫熱之效速只須二三服便可奏功而甘涼之力緩非多服不能見效但服甘涼者必須甘溫之藥每日中時間服以救脾胃庶無遺害此論已詳失血門所當參閲凡五臟之火肺熱則鼻乾甚則鼻涕出肝熱則目眵濃心熱則言笑多脾熱則善飢善渴腎熱則小水熱癰此類宜從清解凡火證必察虛實其人元氣本虛或便祕善飢神清聲朗而脈猶有力此虛中有實可隨證清解此易治也若內外俱熱而反見溏泄或食少聲微諸虛皆見而反不利溫補者此其胃氣已敗生意已窮非吉兆也黃芩清熱湯新治一切煩熱口瘡咽痛衄血吐血脈洪數者黃芩二錢白芍錢半梔子生地麥冬各一錢甘草八分澤瀉木通各七分薄荷五分溫服如胃熱加生石膏三錢如熱盛加黃連錢半如大便燥結加酒炒大黃一二錢涼膈散治三焦六經諸火脹滿結祕脈洪數滑實者大黃朴硝或不用甘草各一錢連翹錢半梔子黃芩各八分薄荷五分淡竹葉七片服時加蜜一匙升陽散火湯治寒邪郁遏陽氣以致肌表懼熱此火鬱發之也升麻葛根羌活獨活白芍各八分防風五分柴胡八分生甘草五分炙甘草六分有人參更效生薑四分煎服逍遙散治鬱火脅痛身熱骨蒸口渴便澀柴胡酒炒八分當歸錢半白芍酒炒一錢白朮茯苓各一錢三分甘草六分薄荷葉三分煨薑六分煎服如火盛加丹皮梔子左歸飲此壯水以濟火也治陰衰陽勝身熱煩渴脈虛氣弱熟地三五錢山藥二錢枸杞錢半甘草炙一錢茯苓一錢棗皮錢半食遠服如肺熱而煩加麥冬錢半心熱而躁加元參一錢脾熱易飢者加白芍錢半腎熱骨蒸者加地骨皮二錢血熱妄動者加生地二三錢陰虛不寧者加女貞子二錢上實下虛者加牛膝錢半血虛而燥者加當歸二錢改用六味地黃丸亦可右歸飲此益火以救陽也治內真寒而外假熱右尺脈虛熟地五七錢山藥炒二錢棗皮一錢枸杞二錢甘草炙一錢杜仲二錢肉桂一二錢附子一二錢食遠服如外熱既甚多見口瘡舌裂煩渴喜冷等證用此湯冷服如陰盛格陽加澤瀉錢半如昏厥短氣加白朮二三錢有人參更妙如火衰不能生土嘔吐吞酸加炮乾薑二三錢如泄瀉腹痛加肉豆蔻錢半如小腹痛加吳茱萸五七分如血少血滯腰膝軟痛加當歸二錢改用八味地黃湯亦妙服後熱退而虛寒悉見乃進溫補無不愈者上有濕火未言當於濕證門取方用之備録瀉火諸藥以便酌用然亦不過言其藥之性耳人當變而通之可也黃連梔子瀉心肝大腸之火山梔仁降火從小便出石膏瀉腸胃實火黃芩瀉脾肺大腸之火黃柏瀉肝腎諸經之火知母清肺胃肝腎之火地骨皮退陰中之火善除骨蒸夜熱生地麥冬清肝肺涼血中之火天冬瀉肺與大腸之火桑白皮川貝母解上焦肺胃之火柴胡乾葛解肝脾諸經之鬱火龍膽草瀉肝腎膀胱之火槐花清肝腎大腸之火白芍石斛清脾胃之火滑石瀉小腸膀胱之火天花粉清痰止渴解上焦之火連翹瀉諸經之浮火元參清上焦及無根浮遊之火山豆根解咽喉之火膽星開心脾胃脘之痰火青黛蘆薈胡黃連瀉五臟之疳熱鬱火苦參瀉疳蝕之火木通瀉小腸之火澤瀉車前子退窿閉之火人中白清肝脾腎之陰火童便降陰中血分之浮火大黃朴硝瀉諸經實火人參黃耆白朮甘草除氣虛氣脫陽分散失之火熟地當歸枸杞棗皮滋心腎不交陰分無根之火附子乾薑肉桂救元陽失位陰盛格陽之火青蒿清血虛發熱之火
