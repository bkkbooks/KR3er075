body:
  text: 卷二十痘科痘科夫痘瘡者天瘡也其胎毒內藏一因時氣觸動其毒傳染相似故謂之天瘡調治得法百無一失矣此證關係甚重不可不明晰也古來治法有各執一見不如因人之虛實隨症施治為妙經曰瘡瘍屬心火宜以寒涼治也若痘瘡則不然毒伏五臟全賴氣血送毒外出氣血足運化而成膿收結而成痂始終無虞若氣血不足當隨時調補不得少疏少緩若稍失治則不及矣古用犀角地黃湯瀉心火以解毒不知痘瘡正借火以運用陰血而成功耳若無火則血凝滯不行何以成膿而結癡乎倘血氣與毒氣俱盛者脈必洪數痘初出即帶紫黑或既出而稠密紅紫內症則煩悶燥渴小便赤大便秘此屬實熱宜用清涼以解毒量入酒炒大黃微利之可也若毒氣盛而血氣衰者於解毒藥中加歸耆參朮以活血養氣乃為顧本良工痘疹發熱大抵初時與傷寒相似然傷寒之邪由表而入治宜發散痘疹之毒由果而出治宜宣托疑似之間觀心窩有紅色耳後有紅筋目中含淚或身熱乎指皆熱惟中指獨冷男左女右知是痘也凡初看痘以油紙拈照其顆粒次以手摸其面頰如紅色隨手轉白隨白輕紅更看耳後筋紅而無紫色者謂之血活其痘必順復察脈息握小兒之手而單以拇指診之發熱之脈必滑數但微見滑數有神而不失和緩之氣者其痘必輕而少若滑數加倍而不弦不燥者其痘必多而重尚亦無害若滑數之甚又兼弦燥無神而全無和緩之氣者其痘必甚而危此可以預知吉凶之真諦也再看形色其證更明形屬氣之充色屬血之華故形貴尖圓起發若痘皮厚硬而平塌者凶色貴光明潤澤根窠紅活而慘黯昏黑者凶然形有起發而或致變者由血不紅活故耳然血以紅活為貴而猶有圈紅噀紅鋪紅之別圈紅者一線淡紅緊附於根下而無散漫之勢吉之兆也噀紅者血雖以附而色不聚險之兆也鋪紅者痘色與肉不分界限平鋪散漫凶之兆也蓋根窠者血之基膿者血之成故六日以前專看根窠若無極窠必不成膿六日以後專看膿色若膿少色枯必不結痂其變幻有不可測者矣醫者宜詳察之庶無遺患以後治痘初熱數日內方論加味升葛湯治小兒體熱壯旺者用此升發即外感亦效乾葛一錢升麻八分赤芍六分甘草桔梗防風各四分蘇葉小川芎各五分山楂肉八分牛蒡子炒研四分生薑五分水煎熱服覆取微汗汗後切忌風寒鹽葷加味參蘇飲治小兒體熱怯弱者用此升托即外感無妨人參三分少者或以山藥三錢炒黃代之川芎桔梗前胡陳皮甘草茯苓各五分乾葛八分半夏四分牛蒡子炒研四分山楂肉六分生薑五分水煎熱服覆取微汗汗後切忌風寒鹽葷如汗後熱不退姑少待之切不可用黃芩柴胡等清解之劑此時若誤用一服解虛其表後即補助漿亦不行凶患莫測若既見紅點再用升葛則痘必枯焦而癢塌矣蓋痘瘡以里為根以表為基根基穩固庶中後無虞敗毒和中散治小兒痘瘡服前方微汗後熱甚煩躁口渴妄語等症連翹牛蒡子黃連酒炒各七分枳殼八分防風前胡木通各五分荊芥紫草茸酒浸蟬蛻去頭足升麻小川芎甘草各四分麥冬八分水煎服人大加倍如大便秘澀者加大黃酒炒一錢微利之不秘者勿用如腹痛腰痛者此毒氣誠重痘毒出外其痛自止切不可用純涼以阻遏其毒出之勢而使之內攻也亦用此湯治之自愈腹痛升消平胃散治痘發熱之時有偶感風寒飲食停滯以致腹痛吐瀉川芎香附炒蒼朮紫蘇厚朴姜炒各七分藿香梗連葉而香者真研砂仁白芷陳皮去白各五分麥芽六分山楂八分甘草三分水煎熱服要知停食腹痛與毒氣腹痛不同停食痛者多急疾在臍上面白唇淡手足冷毒氣痛者稍延緩有作有止在臍下或連腰痛面紅唇紫手足不冷須辨明方可用藥吐瀉參砂和胃散治胃虛寒不食或食即吐面白唇淡精神倦怠等症人參砂仁半夏各六分白朮茯苓各一錢藿香陳皮甘草炙各五分煨姜去皮一錢同煎術苓調脾散治脾氣虛弱飲食不化而泄瀉者白朮茯苓各一錢三分白扁豆薑汁浸去皮炒八分白芍酒炒八分甘草炙神麯炒各五分砂仁香附厚朴姜炒各四分煨薑紅棗引有毒氣從吐瀉而發泄者吐則有聲泄則色黃甚臭胸腹不痛神氣不倦或四五次即止者此為順候不必治若虛寒者則異是驚搐清解散治痘發熱二三日毒氣壅盛於內不得驟發於外面赤唇紫口氣粗手足熱脈浮數而驚搐狂躁者防風荊芥蟬蛻桔梗小川芎各六分前胡乾葛升麻各七分黃芩黃連俱酒炒各八分紫草牛蒡子木通各六分連翹山楂肉各八分甘草四分生薑五分同煎溫服蘇解散治痘毒本盛外為風寒所束鼻塞聲重脈浮數而驚搐狂躁者即前方去芩連加紫蘇白芷羌活各五分生薑六分引然此症多在寒冷之月或不謹避風寒者然後有之溫中益氣湯治痘前虛弱三四日內送毒氣不出驚搐狂躁或痘影淡白者用此托之人參白朮各五分生黃耆一錢當歸身茯苓各八分甘草炙川芎白芷防風各五分南木香肉桂各三分山楂肉七分生薑五分大棗二枚去核同煎一服中病即止凡痘發熱二三日內全無痘影而發驚搐此毒盛未曾宣發所致勿作驚治若用寒涼阻遏毒氣不得外出逼之內攻須臾告變宜用前照證宣發痘出而驚自止矣凡發熱三四日和緩神爽食常出痘必少若已見痘尖圓紅活漸漸長大此為毒輕痘少無疑矣若熱輕而嗜臥不思飲食或痘影淡白點粒不明勿謂痘輕亦是血氣虛弱送毒不出也急用溫中益氣湯托之甚者速服二三劑痘始出齊而自多若因安靜而不急托延至五六日毒氣內攻而不可救矣溫中益氣湯方在上凡治痘於五六日之內急於逐毒不可解毒實熱者宣發其毒以出外虛寒者補助氣血以逐毒出外調元化毒湯治痘出稠密或乾枯而紫黑者或成片而不分顆粒者屬氣血凝滯急宜活血養氣以送毒出外也生黃耆八分人參白芍酒炒紫草茸當歸各六分牛蒡子連翹各七分黃芩黃連酒炒各八分防風桔梗荊芥前胡木通各五分紅花酒炒三分生地酒浸甘草各四分蟬蛻四分山楂肉八分生薑三分水煎溫服如腹痛去參耆加枳殼炒八分如大便久秘加大黃一錢五分酒炒微利之去參耆如血氣與毒氣俱旺而脈洪數者歸芍減一分去參耆如身熱大便燥而出不快者去參耆加小川芎一錢平和湯治邪穢所觸伏陷而出不快者其痘必癢人參當歸桔梗白芍紫蘇黃耆各六分防風白芷甘草各五分肉桂沉香檀香乳香藿香各三分生薑一片水煎服外以蒼朮紅棗沉檀等燒煙以闢其穢姜附湯治痘正出時為風邪所襲忽然傳風眼目直視牙關緊者勿用驅風峻藥白附子老生薑搗碎各二錢濃煎湯灌下一二酒杯出微汗即愈凡腳心有痘則知出齊若稀少者不必拘此以身不熱為出齊凡痘出齊而身不熱方可食豬肉若熱未退而食肉以助邪火必成大患怯弱者當起脹時可食雞以助行漿壯旺者忌之至於諸魚牛羊痘家最忌以後治痘成膿數日內方論凡痘見三日後身和神爽顆粒圓潤根腳紅活胸背稀疏飲食如常二便不澀此順候也不必服藥但節飲食避風寒防穢氣而已凡痘出齊後總要膿漿滿頂方保無虞蓋痘之生死判於膿之有無有膿則毒從外散而生無膿則毒留內攻而死此際稍忽後不及矣凡人之氣血流暢則毒化為膿膿之不成其病有二毒氣熾盛則血燥而凝故不能運化而成膿元氣虛弱則血寒而縮亦不能運化而成膿二者當分別治之毫不可混清毒活血湯治毒盛血燥不能成膿及數日不大便或紫黑焦枯而頂陷等證紫草茸當歸前胡牛蒡子木通各六分黃芩酒炒生地白芍連翹桔梗黃連酒炒各七分甘草人參各四分山楂肉生耆各八分生薑三分引如煩躁者去參耆加麥冬花粉酒炒各八分如稠密紅紫而頂陷者服之立起若甚而黑陷受毒最深雖用之無益參歸鹿茸湯治氣血兩虛膿不充滿白陷灰陷等證鹿茸酒塗炙三錢蜜耆錢半當歸人參各一錢三分炙草六分生薑五分龍眼肉三枚煎濃入好酒合服如手足冷加木香三分丁香肉桂各五分如寒戰咬牙者肉桂加倍附子八分如泄瀉者加白朮白芍酒炒各一錢木香煨丁香各三分參歸補益湯新治症同上人參無者或以山藥三錢炒黃代之蜜耆二三錢當歸身二錢白芍酒炒錢半大川芎八分肉桂七分山楂肉六分熟地二三錢或加糯米人乳泄者不用好酒合服如氣虛癢塌不起如穿山甲土炒六分或加白芷如血熱紅紫不起加紫草錢半如胃氣虛寒多嘔者加乾薑炒用一錢或加丁香四分如元氣大虛寒戰咬牙去白芍加附子錢半乾薑炒用一錢如泄瀉加白朮錢半肉豆蔻一錢但凡漿不足不膿者宜如此補之若不補足後難收結黃耆宜生用不必加減有痘密色白根無紅暈而頂陷者名白陷甚則轉而為灰陷此氣血虛寒亦宜用此二湯參耆湯治痘氣虛不能統血故血泛溢而上僣氣位變成血疱而不成膿若失治則氣愈虛而為血陷皆宜用此人參蜜耆錢半炙草肉桂各八分生薑五分溫服血陷與紫陷相類但血陷雖紅而不紫紫陷屬熱氣粗身熱宜作實治血陷屬虛氣少身涼宜用溫補參麥清補湯治痘密毒重又氣血虛弱津液枯竭不能制火以致煩渴咽痛鼻血難用大補者人參麥冬酒炒一錢二分花粉酒蒸生耆各一錢前胡牛蒡子炒各五分生甘草炙甘草紅花酒洗桔梗各三分白芍酒炒白芍生用生地各四分當歸一錢大川芎山楂肉各五分生薑一片龍眼肉三枚溫服遇此症此藥頻服此症原因氣血不能勝毒氣而然若見其多熱之候率用犀角地黃湯之類涼血清火愈損氣血決無生理吐瀉各有二端兼大便秘塞身涼出汗梔蓮二陳湯治吐酸苦而有聲吐後反快者此毒火上騰也黃連薑汁炒梔子薑汁炮各五分茯苓半夏姜水炒各五分陳皮甘草炙各三分生薑四分同煎緩服吐止即勿服參砂和胃散方見上治吐有物無聲不酸不苦吐訖困倦不思飲食此胃氣虛也宜用溫補以痘色淡白而不紅者加味四苓散治痘色紅紫大便熱泄而燥黃小便赤澀此毒氣奔越也豬苓木通各八分澤瀉赤苓各七分黃連黃芩炒車前子去殼略炒牛蒡子各五分燈心八分同煎食前服參朮散治痘色淡白脾胃虛寒大便泄而青白滑利不止者白朮一兩人參少者用山藥炒黃五錢代之茯苓砂仁炒甘草去炙薏苡仁炒白蓮子去心炒神麯炒山楂肉各五錢肉豆蔻麵包煨捶去油訶子煨取肉廣陳皮各四錢南木香三錢共研末每用二錢米湯調服兒有不肯服者入稀粥內和服亦可七味豆蔻丸治痘虛泄不止服參朮散併兼服此丸為妙白豆蔻去殼微炒訶子煨取肉砂仁南木香白龍骨煅各五錢赤石脂煅七錢枯白礬四錢共研細末麵糊為丸綠豆大每用米湯下三十丸兒有不肯服者將丸研碎入粥內服之亦可加減清毒活血湯治痘起脹灌膿時或六七日不大便而塞悶作亂者此毒盛而秘也紫草當歸各二錢前胡牛蒡子各六分生地白芍連翹桔梗各五分黃芩黃連各酒炒七分甘草四分山楂肉八分懷牛膝二錢煎就入生蜜半酒杯服之如不通加酒炒大黃三錢微利之如仍不通用豬膽汁灌入穀道中即通終不可用芒硝生大黃大下之恐下後生變也歸耆湯治身涼自汗屬氣虛也當歸身五錢黃耆蜜炒三錢棗仁炒研二錢水煎服甘桔化毒湯治痘灌膿之時喉腫生瘡甘草桔梗射干黃連酒炒牛蒡子炒各錢半水煎入竹瀝服益元散治痘潰爛滑石二兩甘草五錢共為末蜜水調敷四聖化毒湯治痘膿成而忽然癢者此熱則生風其人必氣血俱實木通歸尾赤芍防風各二錢肉桂五分水煎服參耆實表湯治元氣素弱而痘癢者此危症也宜補劑加去風藥黃耆蜜炒一錢五分人參甘草肉桂防風白芷各八分當歸一二錢川芎桔梗厚朴各六分南木香三分或加荊芥姜蠶各五分生薑四分同煎服如有觸犯穢氣而癢者悉用紅棗或蒼朮或茶葉燒煙燻之外用絹袋裹小兒之手免至搔破或先有破者若復膿成結痂可保無虞外以荊芥扎一大指大點燃於癢處點之患者自以為妙寧神湯新治痘成漿之時氣血外出自心舍空虛神無所依或昏睡不醒口中喃喃狂言如祟等證此亦常病勿作慢驚施治人參當歸熟地各二錢茯神石菖蒲各一錢棗仁炒研八分遠志六分炙草五分共為末豬心血和為丸辰砂水飛為衣燈心湯下以後治痘收靨數日內方論凡痘出八九日膿漿充滿顏色蒼蠟者上也若無他症不必服藥養胃開痰湯治痘膿少至收結時或身倦食少痰液壅塞等證人參或以山藥炒黃三錢代之白朮錢半甘草炙一錢茯苓半夏各錢三分白蓮肉去心炒山楂肉各八分陳皮去白桔梗各五分生薑七分同煎溫服如口渴去半夏加麥冬八分北五味研九粒吐逆者加藿香砂仁各四分灌膿時忌用朮苓半夏恐其燥也至此際可用建中湯治痘收時寒戰咬牙者此真氣外發而內虛寒也人參黃耆蜜炙三錢白朮錢半當歸身八錢大川芎八分附子乾薑炒微黑肉桂炙草各一錢丁香五分生薑七分溫服有謂此證屬熱者必有實證實脈方可用涼此不輕見不得誤用溫表調中湯治痘當收結時身涼肢冷不能蒸熱回漿當靨不靨此虛寒也宜補氣血而助之收結即前方加茯苓一錢白芷防風各八分清表解毒湯治痘發熱熏蒸而當靨不靨者毒未解也地骨皮麥冬花粉酒炒各八分牛蒡子連翹當歸各六分豬苓澤瀉黃芩酒炒木通甘草各五分水煎溫服有用砂糖半酒杯開水調服能令熱退痘收亦好但毒盛者不效消毒散血湯治靨時腹痛著在中脘此熱毒凝滯瘀血作痛也牛蒡白芍生用桃仁炒去尖研爛大黃酒炒各一錢紅花三分酒洗乳香沒藥研末各五分藥煎就將此二味投入溫服若宿食腹痛須用消導大連翹飲治痘結痂後遍身大熱二便秘赤餘毒盛也或身上有一處更熱甚者即發癰也速服多服待熱退身涼方為內消連翹牛蒡子柴胡當歸赤芍防風各八分木通車前子荊芥黃芩山梔俱酒炒滑石甘草蟬蛻各六分生薑五分引如大便秘者加大黃酒炒錢半如此時忽頭項痛者是餘毒上攻也必注於目亦用前方去木通車前滑石加升麻桔梗川芎薄荷各五分服數劑以解上攻之毒庶免目患補中益氣湯治痘後頭熱五心熱精神困倦不思飲食瘢白便利津液少而煩渴等證皆屬虧虛不可稍用一毫寒涼人參黃耆蜜炒白朮當歸各一錢升麻鹽水炒柴胡酒炒各三分川芎陳皮甘草各四分薑棗引如渴者加麥冬一錢北五味九粒以後統治痘症方論凡痘瘡有重出者於原無痘處復出一層如初出之狀亦漸起發灌膿此餘毒未盡賴裡氣充實毒不得入故猶出於表得其人能食而大便堅亦不足慮如虛弱者宜用十全大補湯之類溫補之不得再解毒也十全大補湯即四君四物加蜜耆肉桂凡痘顆粒不明彼此相串皮腫肉浮或於本痘四旁旋出小痘攢聚長大漸成一塊此候最險宜用快斑湯合六味消毒飲以解其毒快斑湯治痘起發遲緩人參五分當歸防風木通各一錢甘草三分木香紫草蟬蛻各二分六味消毒飲解痘毒牛蒡子連翹甘草升麻紫草山豆根各一錢凡賊痘於齊出之後其中有獨紅獨大摸之皮軟而不礙手者此賊痘也過三日之外必變水泡或甚而變紫黑泡危症也急用六氣煎加紫草紅花蟬蛻解之或用燈草木通煎湯調益元散利去心經之熱而紅自退如已成水泡用保元湯倍加四苓散利之此秘法也不然則通身擦破臭爛而死六氣煎治痘瘡氣虛倒陷癢塌合下方治賊痘黃耆蜜炙肉桂人參白朮當歸炙草各錢半加紫草紅花蟬蛻益元散利小水滑石六兩甘草一兩共研細末上藥調服三錢保元湯治痘前後一切虛症人參黃耆蜜炙一二三錢炙草一錢四苓散治一切濕症從小便出豬苓茯苓澤瀉木通元參升麻湯治痘瘡遊火變斑疹紅點而無頭粒者或變紅赤成片如雲頭突起而為丹者元參升麻各二錢甘草八分防風荊芥牛蒡子各六分水煎服凡痘有夾麻疹而出者用前方加桔梗黃芩酒炒各六分令麻疹先退而痘自起發復元大補湯治痘瘡二三日細小四五日漸大六七日腳闊頂陷色白如豆殼者名曰倒陷此氣血大虛而漿不行也人參黃耆蜜炙錢半當歸一錢三分炙草八分肉桂白朮川芎各八分南木香四分大便溏泄者兼用參朮散方見前頻服可療凡痘有痛者其症屬實此為吉兆用生白芍為細末酒調下一錢五分立止甚者不過二服參歸大補湯治痘出齊後頭面腫脹而痘不脹者此氣血虛弱不能收攝毒氣以成膿故其毒散漫妄行肉分也人參當歸黃耆蜜炙各一錢二分川芎桔梗山楂肉炙草各八分防風白芷厚朴姜炒紫草茸各六分南木香三分姜引四聖膏治痘出齊後其間有紫黑脹硬獨大而無根暈者痘疔也珍珠碗豆亂髮三者各燒灰存性等分冰片少許用油胭脂調成膏先將銀簪撥開疔口將藥填於瘡內即轉紅活或用雄黃研細末以胭脂濃浸水調點疔上亦化而為痘敗毒生肌散治痘收結後仍作熱臭爛出膿水者地骨皮黃連炒黃柏炒五倍子生甘草等分為末乾摻之其不愈者因毒未淨仍服大連翹飲方見上解之或有毒水流處而隨爛者用出蠶蛾綿繭以生明礬末填在內燒令汁盡為末摻之清肺湯治鼻出血乃毒氣上衝於肺以外泄也清之自止花粉酒炒麥冬天冬俱酒炒甘草桔梗當歸各八分白芍浸炒又生白芍酒浸丹皮酒浸知母蜜炒各六分生薑一片煎就調發灰一錢服或用發灰二錢童便七分酒三分調服立止輕者只用發灰吹鼻亦止此證及咽喉口舌等病切不可峻用寒涼如犀角生地生三黃之類冰伏其血為害不小凡痘有水泡無膿者此屬氣血兩虛宜用十全大補湯或用參歸補益湯方俱見上如膿泡與水泡相半者即十分中有三分膿泡者猶有生意若遍身水泡全無膿漿則危矣倘胃氣好飲食如常亦可望生但恐毒氣未散須防發癰凡痘有失音者或痘稠密氣喉有痘礙道而音啞也外痘靨內痘亦收自聲亮而不必治也若痘色虛陷灰白而音啞者乃氣血不足送毒不出毒留於肺肺氣受傷以致失音宜參麥清補湯方見上兼服下方方可救全千金內托散治一切氣血不足以致毒留於中變證不一人參歸身黃耆蜜炙各錢半白芍酒炒大川芎各六分肉桂炙草山楂肉各五分南木香防風白芷厚朴姜炒各三分生薑引龍眼肉三個同煎入好酒和服清毒撥翳湯治痘後目赤腫痛不能開者或翳膜遮蔽不能視者此宜從容調治不可用寒涼以傷元氣也當歸花粉酒蒸牛蒡子草決明桔梗甘草刺蒺藜各五分菊花密蒙花穀精草川木賊乾葛川芎羌活柴胡防風薄荷生地山梔酒炒各三分生薑一片引如目赤甚者加黃連酒炒四分如大便秘燥加大黃酒炒錢半得大便通仍去之此治毒輕者不得十劑而愈毒重者必須多劑乃獲全效若峻攻其里而疏利其下勢求連效自必喪明並忌涼藥點洗十神解毒湯治痘二三日間已出未出煩躁不安口渴尿赤等證歸尾生地紅花俱酒浸丹皮桔梗赤芍伏毛洗淨薑汁拌曬木通連翹去心小川芎各七分水煎服此方以涼血行血為主初服穩協荊防解毒湯治痘夾斑夾麻夾丹者俱可通用防風荊芥穗升麻各四分黃芩酒炒黃柏酒炒元參牛蒡子炒研各六分水煎服牛蒡子湯治痘密身熱連日不退牛蒡子炒研歸身炙草柴胡連翹黃芩酒炒黃耆生用地骨皮各八分水煎服凡孕婦出痘總以安胎為主其初發熱則用參蘇飲以發之痘既出後則多服安胎之藥詳載婦科胎孕門可以參閱泄者用黃芩湯合四君子湯內加訶子血虛者用四物湯加托藥色灰白而起發遲者用十全大補湯去肉桂凡條芩白朮艾葉砂仁之類與候相宜者採而用之切不可用丁桂燥熱之品更有出痘時而正產者勢必氣血兩虛亦以十全大補湯為主虛寒者少加附子若寒戰咬牙腹脹不渴而身熱足冷者此乃脾胃內虛外作假熱也宜參耆歸附木香之類禁用寒涼亦有口渴飲水大便燥小便赤而短脈息洪滑者此內熱也宜用五苓散加黃芩白芍之類至於崩漏血氣痛血暈等證俱載婦科生產門可以參用不必復贅凡痘以觀形察色為主然不診脈何以決臟腑虛實寒熱之真情而治療之無誤也蓋以左手脈之大小以分血之盛衰右手脈之大小以分氣之盛衰七歲以上五至為平七歲以下六至為平過則為數邪氣實也不及為遲正氣虛也人迎緊外感也氣口數內傷也浮而數表熱也浮而遲陽氣衰也沉而緊裡熱也沉而細元氣脫也然痘疹為陽病故脈浮沉俱宜略帶洪實若弱而無力則為陽病而見陰脈必凶之兆至於浮而無根細而欲散遲而欲絕沉而時一至者皆死脈也夫痘瘡自發熱以至起脹毒從內出陽之候也其脈尤宜浮大而數不宜沉細而遲既靨之後毒從外解陰之候也脈宜和緩不宜洪數但要和平有神切忌虛大無力六日以前宜動六日以後宜靜也脈靜身涼而神寧者生脈燥身熱而心煩者死所必然也然六部之外又有衝陽脈者胃脈也脈在足大指次指之間陷上三寸動脈者是也太谿脈者腎脈也脈在足內踝下動脈者是也胃為主腎為根此二脈關係最重倘至六部無脈生死難辨宜於此診之若悠悠條理不斷不急元氣尚在猶有生意可救而活也若此二脈先絕縱六脈猶存亦為凶候復以二脈較之則太谿尤重於衝陽耳其中脈理所當熟晰備揀古來治痘雜症至簡至穩單方於後以便取用硃砂一錢研細真麝香五釐蓖麻子三十六粒去殼紙裹壓去油共研成糊於端午日午時塗兒頂囟前後心手足心兩手彎兩腿彎如錢大任其月落不可洗去此方塗一年者止出二分塗二年者止出一分塗三年者不復出矣傳方之家已十六世不出痘矣又方用梅花蕊七朵研硃砂細研水飛一錢於除夕砂糖調服出痘必稀再用一服者痘可不出又方用蚯蚓一條細小白頸者佳烏雞卵一個於卵開一小孔入蚯蚓在內紙封其孔飯上蒸熟每歲立春日或春分日與兒食一枚永不出痘凡值痘證時行即食二三枚亦妙又方用蟬蛻鳳凰殼即抱出雞子殼神仙脫即父母爪甲等分研末於除夕用蜜湯調服一錢三年後永不出痘又方用七星烏魚頭上有七星夜朝北斗大者一尾小者不拘此魚用水可以久蓄於除夕煮湯將兒遍洗耳鼻等處俱要水到若天寒於火邊塗之不可因魚腥而用清水洗去不信或留一手一足不洗日後出痘此處獨多又方用本兒脫下臍帶燒灰存性為末敷於乳頭令兒吮之稀麻痘並解瘡毒又方於痘未見點時用絲瓜近蒂三寸連皮子燒灰存性為末沙糖水調下或用燈心湯調服多老少少者無又方用雞卵七個以童便次第浸七日每日換童便先浸者先取水煮令兒食一個痘出最稀亦有不出者防痘入目於發熱時常以胭脂浸水點之或以白芥子研末水調敷足心熱歸下可免咽喉痘瘡用牛蒡子二錢桔梗一錢甘草節七分煎服外以屋上老瓦細研末吹之痘出不快熱甚便秘用牛蒡子炒一錢二分荊芥穗二分甘草四分煎服即已出者亦可服大便利者忌用痘瘡煩渴甘草炙花粉等分煎服痘毒入心始有白泡忽搐入腹紫黑無膿用大鬱金一枚甘草二錢半水一碗煮乾去甘草焙研為末入冰片一分每用一錢以生豬血五七滴開水調下不過二服甚者毒氣從手足心出如癰狀乃瘥痘疹失表發熱時腹痛此毒氣相搏欲出不得出也用商陸根和蔥白搗敷臍上痘出無患痘已出外受風寒竅閉血凝痘不長或變黑色用霜後貼水紫背荷葉炙姜蠶炒等分為末酒調五分服奇效痘瘡口禁用吳茱萸二粒細嚼咽之即開取辛以散之也痘瘡變黑用穿山甲蛤粉炒為末加麝少許溫酒調服五分即紅活如神痘瘡黑陷用豬心血即尾血亦可加冰片少許研勻酒調服一刻紅活痘甚血熱變紫赤而二便閉者用紫草紅花蟬蛻等分煎服即解痘不起發用雄雞冠血和酒服痘初發托之用穿山甲取頭上及前足者土拌炒黃一兩紅曲一錢略焙共研末以雄雞冠血和酒調服大人一錢小兒六七分較前方更佳痘瘡黑陷欲死者用小兒糞將砂罐貯之鹽泥固封火煅通紅取出為末蜜水調服一錢痘收時有咳逆者取真黃土研細將童便調軟貼鼻下兩邊聞氣立止痘漿滿時或感寒一時變黑紫色用好肉桂煎服立見如前痘爛不幹用多年屋上茅焙研摻之或用末鋪床上加一層布於上睡之即愈痘癢及痂不落以蜜時刷之痂易落且無瘢痕痘爛用枇杷葉煎湯洗之次用海螵蛸末或綠豆末敷之又方用干黃牛糞燒過取中間白者研末敷之痘瘡瘢痕用陀僧末人乳調塗夜上旦洗痘癰用黑大豆赤小豆綠豆研末醋調塗之立消痘灰白吐瀉肢冷用丁香九粒乾薑炒一錢水煎熱服痘焦狂妄用滑石硃砂水飛各一錢冰片三釐共研末冷水調服一二分得睡自安神方也凡出痘疹時有當避者有當禁者謹之則重可變輕不謹則輕必變重避腋下狐臭氣行遠勞汗氣溝糞濁惡氣婦人經候氣房中淫液氣諸瘡腥臭氣砒硫蚊煙氣誤燒頭髮氣吹滅燈燭氣柴煙牛羊氣蔥蒜韭薤氣煎炒油煙氣醉酒葷腥氣麝香燥烈氣禁生人往來詈罵呼怒對梳頭對瘙癢勿掃地勿對謊言勿使僧道孝服人入房勿對飲食歌樂麻者即疹也與痘不同痘屬少陽三焦火也陽道常饒故大而腫麻屬少陰心火也陰道常乏故小而密痘毒出於臟臟屬陰陰主血故痘有形而有汁麻毒出於腑腑屬陽陽主氣故麻有形而無漿痘有寒有熱麻則有熱而無寒痘宜充實可用補劑麻忌內實只宜解散雖皆胎毒而發既殊治亦不同其初出之際痘防表虛不可過表麻貴盡出過表無妨既出之後麻宜補陰以制陽痘則補氣以生血蓋麻熱甚則陰分煎熬自陰虛火動故宜滋陰清火最忌酸斂溫補燥悍之品初發熱時如桂枝羌活蒼朮丁香肉桂砂仁之類其性辛熱能使毒壅蔽而不得出又忌驟用寒涼使毒冰伏而不得宣俱致內攻之患治宜升麻葛根湯雖寒勿用桂枝雖虛勿用參朮雖嘔而有痰勿用半夏南星並忌誤作傷寒而用汗下之法乃為穩協麻出六腑其毒淺而易散然其熱毒上蒸於肺故肺家見證獨多咳嗽流涕眼腫含淚面腫腮赤者是也然有輕重之分如身體微汗上下潮潤神清食常不燥不迷一日現幾陳爪數鮮紅者輕也不必服藥但禁風寒葷腥而已若氣喘鼻乾驚狂作嘔熱甚昏迷者重也或初見如芥而色紅倏而變紫色者險變黑色者逆此際不可用藥失序不可過為攻表以傷胃氣反令停毒攻肺務宜辨寒熱虛實而治之其法惟宣其毒以盡出之於外雖紅腫殊甚亦不足慮以其既發於外可免內攻不若痘家之必顧其收靨也夫痘屬陰故頭面先見而稀少者為佳麻屬陽故頭面宜多見成粒而色紅者為吉痘瘡貴三四次陸續出者為妙麻疹貴一齊湧出而便解者為上凡以火照之遍身如塗朱者將出之兆也痘色最厭繁紅麻色偏喜通紅蓋麻發於心紅者火之正色也若色淡白者是心血不足也宜養血托毒湯主之如色太紅焰或微紫者是血熱也宜大青湯主之方見下若色黑者是血熱而枯乃凶兆也善於涼血生血或者可救昔人謂天氣暄熱宜用辛涼發之如黃連解毒湯之類又謂天氣嚴寒宜用辛熱發之如桂枝湯之類不知天時炎熱豈寒涼之藥所能解今驟用寒涼恐不能以解外熱而適足以阻內熱使不得出而內攻也天氣大寒只宜置之燠室謹避風寒可也且天氣雖寒而人身之熱毒未必減也若再辛熱以助毒其變幻有不可測者矣至於麻疹初起有四肢逆冷者乃火極似水之故不可妄投熱藥待麻現自然平和也若在大病後吐瀉後體虧而適出麻有是證者須當別論又有麻發而自利者其毒亦因利而散此殊無妨忌用參朮訶蔻補澀之藥以圖速止致生喘滿脹滯等證不可推測或大泄不止以及糞黃而色紅者須當調治不可忽也升麻葛根湯治陽明火毒表實邪盛用此解散麻疹易現升麻葛根甘草各一錢白芍酒浸錢半水煎熱服柴歸飲治麻疹無實邪者用此托之散之不助邪不損氣易於出現當歸二錢白芍錢半柴胡一錢乾葛錢二甘草八分荊防敗毒散治麻疹發熱二一三日間發散通用柴胡荊芥穗防風羌活獨活前胡川芎枳殼人參甘草桔梗茯苓等分薄荷葉減半水煎服或加牛蒡子連翹以解毒淡竹葉以清熱更妙如天氣大熱加黃芩炒八分大寒加麻黃蜜炒八分水煎熱服解毒快斑湯治麻已現形一二日之間解毒通用連翹牛蒡子研荊芥防風各七分蟬蛻五個山楂肉生地各錢半歸尾桔梗黃芩各八分川芎五分乾葛紫草水煎服化毒清表湯治麻疹已出而紅腫壯熱大便秘小便赤舌黃氣粗等證牛蒡子連翹花粉地骨皮山梔炒黃連黃芩乾葛元參各八分桔梗前胡木通甘草薄荷防風各五分如口渴加花粉一錢石膏煅研三錢大便澀加大黃酒炒錢半養血托毒湯治麻現色白心血不足體虛神倦者當歸二錢白芍酒炒錢半熟地二錢茯神一錢淮山藥炒錢半沙參一錢二分甘草生地酒浸丹參各一錢柏子仁炒去油八分牛蒡子炒研六分白蓮肉去心炒研一錢水煎頻服以轉紅為吉大青湯治麻色紅而紫屬血熱大毒用此解之生地二錢石膏生研三錢元參地骨皮知母各錢半木通甘草青黛荊芥穗各一錢淡竹葉十二片水煎服若紫色退止服恐寒涼傷胃也麥門冬湯治表邪內熱咳嗽甚者麥門冬葛根各錢半升麻六分赤芍酒炒茯苓八分甘草炙六分石膏煅研二錢水煎服如肺火甚加貝母知母各七分門冬清肺湯治麻後咳嗽不上天門冬去心麥冬去心款冬花知母貝母桔梗牛蒡子地骨皮杏仁去皮尖各錢半馬兜鈴甘草各七分水煎溫服清肺飲治麻症五六日之間尚有餘毒留於肺胃咳嗽氣粗身熱不退石膏三錢生地麥冬元參各一錢桔梗黃芩歸尾各八分姜蠶五條甘草陳皮各六分知母七分柴胡六分竹葉四片水煎熱服清熱活血湯治麻色焦黑凶症多服速服黑色退乃吉生地丹皮各二錢黃柏黃連黃芩各酒炒錢半側柏葉赤芍牛蒡子炒研各一錢連翹去心甘草各一錢二分薄荷葉八分水煎熱服如口渴加花粉一錢生石膏二錢淡竹葉十片童便半杯如大便秘燥加大黃酒炒三錢如小便赤短加滑石末二錢藥調服中病即止加味四苓散治麻泄利過甚糞色黃或紅而臭屬實症大毒豬苓木通澤瀉赤茯苓各一錢車前子去殼略炒黃連黃芩牛蒡子各七分燈心五分水煎熱服凡參朮可蔻止泄之品切忌勿加若只泄而無實熱等證減黃連黃芩加白扁豆三錢萆薢四錢煨木香二分白朮錢半和中湯治麻疹大吐大泄而後現者宜和中安胃為主白朮一錢白芍酒炒茯苓乾葛當歸身土炒各八分甘草炙防風丹皮桔梗各六分柴胡五分半夏七分生薑六分紅棗二枚引柴胡四物湯治麻後餘熱宜補血涼血以退之柴胡五分當歸身大生地各二錢川芎七分白芍酒炒錢半麥冬地骨皮黃芩各一錢知母酒浸人參或以山藥三錢代之淡竹葉八片水煎服如不嗜飲食去知母加白朮錢半中病即止羚羊角散治麻疹後餘毒不解上攻眼目羞明雲翳眵淚俱多紅赤腫閉羚羊角鎊黃耆黃芩草決明升麻車前子防風大黃等分水煎熱服如大便燥秘加芒硝二錢下之全真一氣湯治麻疹頭面不起壯熱不食喘促昏沉上熱下寒之候由久熱以傷陰也勿作實熱施治熟地三五錢白朮二錢麥冬錢半淮牛膝一錢北五味十五粒附子五七分水煎涼服昔人謂疹要清涼痘耍溫執為定論寒涼並進以致陽虛不能升發頭面不起陰虛不能退陽所以餘熱日盛陰氣未全之弱質何堪久熱之傷陰故昏沉不食喘促煩躁中氣日虛如以疏表透托風藥則愈耗其陰如以清肺解毒涼藥則徒傷其胃泄瀉一來上熱下寒喘促益甚復謂疹毒歸肺肆進苦寒危亡立至殊不知氣血不和偏陰偏陽之謂毒能使氣血和陰陽平而毒化矣今此方滋陰降火一氣相生於氣血兩虛之輩有起死回生之功人勿謂其峻猛而致疑也加味地黃湯治熱盛陰虧麻疹隱伏其脈寸強尺弱不宜表者熟地三五錢棗皮山藥各錢半茯苓丹皮各一錢澤瀉七分肉桂錢半北五味三分水煎溫服凡麻疹須按脈用藥總以救陰救陽為主此為法外之治故不必以疹多實熱為定論而因時因人以權衡也清熱導滯湯治毒熱留伏成痢黃連黃芩白芍枳殼炒山楂肉各一錢厚朴姜炒青皮檳榔當歸甘草牛蒡子連翹各六分如紅多者加紅花三分地榆五分滯澀者加酒炒大黃一錢二分香連丸治裡急後重黃連一兩廣香三錢共研末蜜丸開水下三錢如病久體虛者用補中益氣湯送丸三五錢清胃敗毒湯治麻後餘毒口瘡牙疳等證姜蠶丹皮甘草連翹心生地桑根皮沙參茯苓金銀花黃柏蜜水炒各等分如體虛加白朮水煎服救苦散麻後口瘡牙疳搽藥人中白火煅五分青黛水飛五分冰片一分姜蠶錢半寒水石水飛三錢共為細末先以濃茶漱淨隨搽患處如加牛黃二分更效加味甘桔湯治麻後餘毒喉病連翹甘草桔梗射干牛蒡子黃連酒炒黃芩酒炒各一錢水煎服外用苦參三錢姜蠶二錢為末吹之健脾丸治麻後失調體瘦氣虛或成疳疾或生泄瀉等證人參少者以山藥二兩炒黃代之黃耆蜜炒白朮當歸茯苓各一兩神麯炒山楂肉白芍酒炒地骨皮各五錢白扁豆炒去皮一兩橘紅陳皮各五錢川黃連炒四錢百合八錢如肚硬有積加谷蟲三錢共為細末每用二錢少加白糖開水調服犀角解毒化痰湯治麻證咳嗽氣喘唇紅便燥內熱煩渴或口鼻出血不拘前後皆可服生犀角一兩歸尾八錢連翹心丹皮紫草甘草梢川貝母花粉薄荷各一兩赤芍六錢牛蒡子黃連各三錢生地二兩共為細末煉蜜為丸如彈子大每服一丸淡竹葉湯下或十分用一煎服亦可但犀角須磨汁合服凡孕婦出麻古人徒知清熱以安胎不思麻未見而止以清熱為事則麻因冰伏難出而內熱愈甚是欲保胎反足以傷胎也宜用輕揚之劑照前法表托則麻出而熱自清繼以滋陰清解則於麻於胎兩得無礙不安胎而胎自安又有用艾葉砂仁燥熱之藥以安胎者而不知適足以損胎也托毒清熱安胎湯治孕婦麻痘初熱表托安胎當歸川芎白芍桔梗甘草柴胡前胡防風荊芥白芷乾葛紫草白朮條黃芩各一錢水煎服麻疹禁忌與痘證同詳載痘科後條參閱謹用治麻疹雜症單方麻後嗽甚用貝母去心童便浸知母各一兩老生薑一錢共研末每用五七分開水調服麻毒口瘡黃連一兩乾薑炒黑三錢為末摻之又方用黃柏蜜炒青黛等分為末頻摻口瘡咽津妙麻疹黑紫將死用小兒大糞煅用方見痘雜症內可以通用麻痘解穢用茵陳研末取棗肉搗為丸焙乾常常燒煙燻房熏被薰衣即凶者可轉為吉凡古來治麻痘藥書至多但覺有泛處令初學者不便取用惟明聶久可所著方論簡而確不誤後人今多采用內有缺者補之偏者正之集為全書於二科不無小補云
