body:
  text: 卷之三傷寒上一傷寒總論冬氣嚴寒保身不密殺厲之氣乘於肌體若伏而不發至春變溫至夏變熱溫熱病另有調治即時發者名正傷寒以寒傷表發熱憎寒邪閉皮毛病在衛也衛者氣也由淺而深遍身疼痛邪入經絡病在榮也榮者血也夫人之衛行脈外榮行脈中今以寒邪居之則氣血混亂經絡壅滯故外症若此自此而漸至嘔吐不食脹滿等症則由經入腑病益深矣自仲景以來名賢代起有言其病而不言其陰陽者有立其方而未詳其增減者支離繁碎令人難用惟約以汗吐下溫清補六法六法詳後更以虛實二字為提綱憑症察脈變化治之易於拾芥雖傷寒變症不一有循序傳經者有不循序傳經者有始終止在一經者有不由表入直中陰經者有三陽同病三陰俱病陰陽齊病者有二經並病前後合病者及雜症互見陰症似陽陽症似陰者能明虛實則宜表宜里宜攻宜補而立方用藥無不曲中又何慮乎若執方書以某方治某病因某病用某藥恐病合而人之虛實不合以及孰宜急宜緩宜重宜輕不能神明變通亦非上工余雖詳言調治逐條分注於後亦要在人之善用耳惟觀其某條治法即不恰中亦不甚遠不致誤枉或壽世之一端也二傷寒脈論觀此可知症之表裡虛實經脈十二六陽屬腑為表六陰屬臟為里經脈分手足者以足經之脈長而且遠自上及下遍絡四體按之可知周身之病手經之脈短而且近皆出入足經之同故凡診傷寒外感者但言足經而不言手經也然足之六經又以三陽為表而太陽一經為陽中之表以脈行於背背為陽也且包復周身故凡風寒傷人自太陽經始陽明經為陽中之裡以脈行於腹腹為陰也少陽經為半表半裡以脈行於側也至於足之三陰主裡其脈自足上腹雖亦在肌表之間而其風寒未有不由陽經而入陰分也若不由陽經入者即為直中陰經必連臟矣故陰經無表症凡浮脈固屬表也然有感寒邪之甚者拘束衛氣脈不能達亦沉而兼緊但以發熱頭痛等表症參合自可辨也切不可概以浮為表論如血虛動血者陰虛水虧者內火熾盛者關陰格陽者脈俱浮大宜知之也至於脈浮而緊者邪氣有餘也按之無力者元氣不足也元氣不足何以逐邪必使元氣漸充自虛而實自數而緩則陽氣漸達胃氣漸至即為將解之兆若日見緊數無力則凶矣雜病以弦為陽以緩為弱傷寒以弦為陰以緩為和寸為陽或沉細而無力者為陽中伏陰尺為陰或見沉數者為陰中伏陽寸口數大有力為重陽尺部沉細無力為重陰寸脈浮而有力主寒邪表實宜汗浮而無力主風邪表虛宜實尺脈沉而有力主陽邪在裡為實宜下無力主陰邪在裡為虛宜溫寸弱無力忌吐尺弱無力忌汗忌下汗下後脈靜者生正氣復也躁熱者死邪氣勝也溫之後脈來歇至者正氣脫也純弦者名曰負按之如解索者名曰陰陽離皆死陰病見陽脈者生正氣在也陽病見陰脈者死正氣絶也其餘雜症脈理俱載雜症條下三傷寒六經循序傳變心為手少陰與手太陽小腸經相表裡肝為足厥陰與足少陽膽經相表裡腎為足太陰與足太陽膀胱經相表裡脾為足大陰與足陽明胃經相表裡肺為手太陰與手陽明大腸經相表裡心包絡為手厥陰與三焦手少陽相表裡凡感冒傷寒初入在足太陽膀胱經次傳足陽明胃經三傳足少陽膽經四傳足太陰脾經五傳足少陰腎經六傳足厥陰肝經以上所言六經傳變是其理之常也亦有越經傳者有不拘日數傳者有二經三經同病者宜見病治病不可拘泥其脈其症俱於謂治各經方下明之四論治傷寒勿拘古方凡治傷寒歷祖仲景但仲景所制之麻桂硝黃等劑峻猛已極原因當時人氣稟強壯且為冬月感冒重邪而設自然適中第流傳既久天氣人氣日薄一日不必盡同凡寒熱感冒及傷食房勞等候皆有頭病發熱口渴等症若即謂太陽陽明之症泥執古方通治今人弱質必被夭枉者多矣故存古人傳經之論者俾人知傷寒局方之原立法之所以自始也遵列古方次第汗下者俾人知立方用藥之體而易於仿也集諸賢之說者俾人知古今變化之理而慎於用也後之治此症者當因時因人而權衡之勿以生死大關輕徇舊方庶幾人登壽域乃為司命上工幸勿以余言為妄也五論證分表裡凡陽邪在表則表熱陰邪在表則表寒陽邪在裡則裡熱陰邪在裡則裡寒邪在半表半裡無有定處則往來寒熱邪在表則腹不滿邪在裡則腹脹滿邪在表則呻吟不安不煩不嘔邪在裡則煩躁悶亂並作嘔逆邪在表則能食邪在裡則不能食若在表裡之間縱不欲食未至於不能食也有胸痞悶而初見心煩喜嘔者表邪方入里不可攻下凡表症悉具而脈沉微者以元氣不足不能外達也但當救里以助陽散寒為主若不知溫中以固根本而再用發散之劑則危亡立至六論表裡之虛實凡表實者無汗惡寒或發熱惡熱走注紅腫知榮衛有熱身痛拘急知經絡有寒凡表虛者有汗惡寒或多麻木難舉動或毛槁肉削顏色憔焠凡裡實者或脹痛痞堅或閉結喘滿或懊憹不寧煩躁不眠或氣血積聚腹中不散或寒邪熱毒深留臟腑之間凡裡虛者為心神怯跳津液不足或飢不能食渴不喜冷上虛則食不化嘔惡中滿下虛則二便不禁肛門脫出泄瀉遺精七論汗證凡太陽陽明少陽或三陽合病或並病但頭痛身痛發熱惡寒及喘而胸滿等候雖為日已久內有一症即表邪猶在脈浮緊而數無汗者用麻黃湯或羌活湯汗之若脈浮緩而弱自汗者用桂枝湯微汗之總之表邪散便不傳經入里否則為變不一矣凡各經邪症汗之不徹猶未汗也共人仍身熱煩躁坐臥不安脈緊無汗乾燥錯語者是表邪未散也其故有三邪在經絡筋骨而汗僅出皮毛此邪深汗淺衛解而榮不解一也或以十分之邪而出五分之汗此邪重汗輕二也或汗後遽起露風而因腠疏復感者三也凡遇此者當辨微甚以再汗之如汗透而身熱愈甚此陰陽交而魂魄離大凶之兆也又有邪本不甚而年衰體弱發散太重或屢散被害者或邪去而胃傷不能飲食而羸憊者此過汗之患也倘汗過亡陽氣脫昏沉等候以四味回陽飲救之若得煎參三五錢飲之更妙八論忌汗凡脈微弱弦沉及尺遲無力者以上六脈俱忌汗再有下利清穀者小便失禁者咽喉乾燥身重心悸者及陽虛衄血吐血淋家瘡家腹中上下左右動氣者悉不可發汗九感冒傷寒新舊發表諸方古方分量最重今酌而減之麻黃湯治太陽經病頭項痛腰脊強發熱惡寒身痛無汗脈浮緊者以太陽經脈由脊背連風府故也亦治太陽陽明合病麻黃去節一錢或多用桂枝錢半甘草八分杏仁去皮尖十五粒水煎熱服復取微汗汗出勿再服總要有汗方止若汗已出漸次解所復者勿得頓減貪涼以防表疏復感也桂枝湯治太陽中風發熱惡寒頭痛乾嘔自汗脈浮緩者桂枝白芍生薑各二三錢甘草一錢大棗五枚去核水煎熱服復取微汗不得太過以汗者血之液也汗多則衛氣疏不能內以護榮故用桂枝和榮散邪用白芍護榮固理姜能散寒止嘔棗以甘溫能和此不專於發散而兼和榮衛者也邪出而衛自密汗亦止矣豈桂枝能塞汗乎以上二方皆治寒邪初感溫散之妙法也至於桂枝湯則凡四時陰勝之邪皆所宜用但浮脈而緊發熱無汗者總之以脈緊為傷寒服之則表益實而汗愈難出故也升麻葛根湯太陽病次傳陽明胃經身熱目痛鼻乾不寐脈洪而長以陽明主肌肉其脈挾鼻絡於目故也升麻葛根白芍各二錢甘草炙一錢加姜煎服如頭痛加白芷川芎如身痛加羌活防風如熱不退加黃芩或加石膏胃虛不食加白尤腹痛倍白芍若傷寒未入陽明者勿服恐引表邪入陽明也此經多氣多血寒邪入則血氣壅滯辛能達表輕可去實故用升葛辛輕之品發散陽明表邪邪盛則陰虛故用白芍也小柴胡湯陽明病又傳少陽膽經胸脅痛耳聾寒熱往來嘔而口苦咽乾目眩脈弦而數以少陽之脈循脅絡耳故也柴胡二錢半夏錢半人參甘草黃芩生薑各一錢棗三枚水煎服如嘔逆加陳皮倍生薑煩者去半夏加栝蔞渴者去半夏加花粉若不渴外有熱去人參加桂枝覆取微汗咳嗽去參棗加乾薑五味咳為肺寒乾薑散寒少加五味以斂肺肺脈不虛者不用少陽症有嗽無喘陽明症有喘無嗽虛煩加竹葉粳米腹痛去黃芩加白芍脅下痞硬去大棗加牡蠣脅痛加青皮白芍心下悸小便不利去黃芩加茯苓太陽病或飲水多停心下故悸水蓄不行故小便不利茯苓能利水本經頭痛加川芎發黃加茵陳加減羌活五積散新治四時感冒發熱惡寒頭痛身疼咳嗽聲重脈浮緊無汗者以代發表古方不論大小皆治當歸錢半白芍一錢陳皮八分半夏錢半茯苓一錢三分甘草一錢桔梗枳殼川芎白芷防風各一錢羌活八分桂枝一錢紫蘇葉五分北細辛三分姜三片蔥白五寸水煎熱服取微汗如冬春寒甚加麻黃五六分夏秋加蒼朮錢半加減羌活湯新治傷風寒頭痛身痛憎寒壯熱脈浮緊無汗及四時不正之氣凡男女大小同治以代麻桂青龍等湯也羌活一錢防風一錢二分蒼朮川芎白芷甘草各一錢陳皮八分北細辛二三分生薑一錢蔥白五寸熱服取微汗如自汗者去蒼朮加白朮或加黃耆胸滿加枳殼桔梗嘔逆加半夏喘促加杏仁可隨症加入此方不犯三陽禁忌為解表穩方可以便用補中益氣湯治虛弱不足年衰脈微之人外受風寒難用表劑補中即以除蔻亦可隨症照後加入善用者最效人參無者用淮山藥三四錢炒黃代之黃耆蜜炒白朮各錢半陳皮五分當歸甘草炙各一錢升麻用蜜水炒或用淡鹽水炒柴胡酒炒各三分生薑五分紅棗三枚水煎服病屬太陽無汗寒熱者加羌活防風頭痛加白芷川芎或加北細辛二三分汗不出者再加蒼朮自汗者加桂枝白芍寒甚者加蘇葉熱甚者加黃芩此方惟上焦痰嘔中焦濕熱傷食膈滿者忌服益元散邪湯新治元氣太虛脈大無力外感寒邪憎寒壯熱身痛頭痛或嘔惡泄瀉等症邪氣不能外達惟溫中自可散寒即素稟薄弱之輩或連進二三服自必陽回而解當歸二三錢白芍煨錢半陳皮一錢白朮熟地各三四錢山藥二錢甘草炙一錢黃耆蜜炒錢半麻黃去節八分桂枝一錢生薑煨錢半水煎熱服略蓋以取微汗如頭痛加川芎白芷各一錢北細辛二分如泄瀉者去當歸加蓽薢四錢茯苓一錢木香煨三分若三陽並病者加柴胡二錢仲景治傷寒如麻桂等湯以溫散固為千古妙方至於陽根於陰從補血而散者惟此乃得云騰致雨之妙為今時之所宜勿得疑為驟補無用而徒以散邪為主致為夭枉之失上方補氣以散邪此方補血以散邪十論吐證經曰其高者因而越之又曰在上者湧之謂吐之也邪結中焦胸滿而痞硬氣上衝咽喉不得息者或飢不能食或食入即吐並有欲吐不能吐者手足厥冷脈弦遲或寸脈微浮而緊此為胸中有寒當吐之丹溪曰吐中有發散之義此治傷寒一大關鍵也今何人惟知汗下二法而吐法不用使邪氣結而不散輕病致重其害無窮但胸中之寒亦有虛實之分仲景曰膈上有寒飲乾嘔者不可吐也急溫之宜四逆湯方載三十內前言寒者言寒邪之實後言寒者言胃氣之虛當吐當溫此等要處最宜詳察凡胸中鬱郁而痛不能食欲人按之而反有涎唾下利甚其脈遲而寸脈微滑吐之則利自止凡宿食在上脘者宜吐虛煩在胸中者宜吐下分治之凡寸脈弱而無力者忌吐寒邪在表宜汗在中下宜下不宜吐瓜蒂散治胸中痞硬寒邪滯中寸脈微浮吐之以散中寒甜瓜蒂炒黃赤小豆等分為末即瓜蒂一味亦可熟水調服二三錢以指按喉必吐吐時須令閉目緊束肚皮若吐不止者蔥白湯解之凡亡血及老人産婦血虛脈弱者勿服梔子豆豉湯治傷寒煩躁亦用作吐藥以肺腎之邪在上焦吐以散之也梔子十四枚淡豆豉四合先煎梔子後入豆豉分二服溫進一服得吐止後服煩者氣也出於肺梔子治肺煩躁者血也出於腎豆豉治腎躁以心火旺則金躁而水虧肺腎合而為煩躁上方吐有形之實邪此方吐無形之虛煩若大便溏泄者虛寒在下不可服至於宿食而煩躁者用梔子大黃湯下之外附治結胸法凡傷寒結胸有氣虛不堪攻吐者以蔥白生薑各四兩生蘿蔔半斤此味若無以子三兩代之共搗炒熱以布包安膿處須分兩包冷則易之即時汗出而愈又法以大蒜十餘枚搗攤絹上貼一切脹痛處神妙十一論下證邪在表宜汗邪入里宜下此里者非三陰之裡乃陽明胃府也三陰亦有轉入陽明者須因症因脈酌宜下之然下症不一有痞滿燥實堅五者之異痞者胸悶不食滿者胸腹膨脹燥者大便枯少實者腹滿而痛日久不大便堅者按之鞭硬如五症悉具三焦俱傷宜大承氣湯急下之但見痞燥實三症邪在中焦宜調胃承氣湯不用枳朴恐傷上焦之氣也但見痞實二症邪在上焦宜小承氣湯不用芒硝恐傷下焦之血也夫以人之一身元氣周流一有邪滯則壅塞經絡而為病矣輕則導而去之重則攻而下之使垢瘀去而後正氣可復然攻下之劑須適症為宜若邪盛而藥輕則根株仍留邪輕而藥重則正氣必傷能以症合脈庶得萬全十二論證當下脈沉實尺脈更旺者邪熱入府也宜下之其症腹中鞭硬大便閉譫語腹痛不惡寒反惡熱口渴咽燥腹滿潮熱日晡熱屬實症及五六日不大便繞臍痛煩躁發作有時者此有燥屎也俱宜下之十三論證忌下脈虛弱寸脈浮大右關細澀及遲緩微弦者皆不宜下又有脈久數者非外邪也細數者非實邪也下之則危其症腹鳴自利無熱惡寒唇青舌卷口不渴身痛大便先硬後溏喘而胸滿止心下硬滿不食惡寒小便清利咽中閉塞汗多亡陽而譫語陰虛水虧虛煩虛躁四逆惡水等症俱忌下之十四傷寒攻裡諸方大承氣湯治傷寒陽邪入腑五六日不大便痞滿燥實堅五症全具發熱譫語口乾舌澀三焦大熱脈沉實者大黃五錢芒硝四錢厚朴二錢炒枳實一錢炒或加甘草一錢水兩鍾先煎厚朴枳實至鍾半投大黃煎至一鍾去渣納芒硝一沸熱服大黃瀉熱芒硝潤燥枳朴破痞滿攻內邪之峻劑也然非大實大滿不可輕投恐有寒中之變小承氣湯治邪在上焦痞滿譫語便難而硬或六七日不大便潮熱氣喘脈實者大黃四錢厚朴二錢枳實一錢炒水煎熱服除芒硝者恐傷下焦真陰也謂胃承氣湯治邪在中焦燥實腹脹惡熱口渴便祕譫語及吐後腹脹與未吐未下而心煩脈實者大黃六錢酒浸芒硝四錢甘草錢半水煎去渣入芒硝一沸服除朴實者恐傷上焦之氣也加甘草者不致傷胃也吐後為內煩下後為虛煩不吐不下而心煩者胃有鬱熱也六一順氣湯治傷寒邪熱傳裡便實口燥潮熱斑黃狂走陽厥胸脅滿硬臍腹脹痛及老人産婦血氣兩虛者有下症或下後未解諸病用此以代大小承氣大陷胸等湯之神劑也大黃四五錢枳實錢半黃芩二錢甘草一錢厚朴姜炒一錢半白芍二錢水煎服欲峻者大黃後入如表症未除者加柴胡錢半古方原有芒硝去之以性峻急傷人故也若概用之在死者多矣仲景云蕩滌熱積宜用湯液切禁丸藥大柴胡湯治表症未除里症又急汗下兼行柴胡三錢半夏二錢黃芩白芍各錢半生薑二錢半大黃二三錢枳實一錢大棗三枚水煎服十五論清理凡傷寒吐下後多有餘熱未除脈猶洪數以致口渴咽燥身熱便赤日夜不寧等症此際宜清理之則熱退而諸症瘥矣但清熱必須滋陰或補先天之水或養後天之血庶陰長而陽自消若徒用苦寒之劑不惟熱不能退而且熱從火化損脾傷胃是治病而適以益病可不畏乎業醫者宜知也益陰清熱湯新治傷寒餘熱口渴便赤煩躁便實脈洪等症當歸一錢白芍生地麥冬各錢半黃芩二錢甘草一錢元參一錢澤瀉八分木通八分梔仁炒黑八分陳皮八分石膏生用二錢黃柏炒焦一錢扁豆炒研二錢水煎服如舌黃加黃連一錢目赤加膽草八分大便燥加酒炒大黃錢半如婦人血熱加青蒿二錢如脅痛加青皮八分如口渴加花粉一錢黃蓮解毒湯治傷寒吐下後火盛煩躁喘急口渴脈洪者黃連黃芩黃柏梔子各一錢水煎服白虎湯治傷寒脈浮滑表裡俱熱及便結斑黃狂躁大渴等症石膏五錢知母二錢甘草一錢糯米一撮水煎服如汗渴者加人參竹葉石膏湯治陽明汗多而渴鼻衄喜水而吐及煩躁等症石膏生研三錢淡竹葉十三片半夏甘草各錢二分麥冬錢半人參無者或以蜜耆代之米一撮生薑三片煎服以上所録諸方是折火之標而非退熱之本惟直探其真陰而補之如亢旱而得甘霖土木皆濡頃刻為清涼矣豈不妙哉如左尺脈無力以六味地黃大劑投之自水旺而火退如右尺脈弱上部渴甚燥熱飲冷反吐下部足冷者是火不歸源即以六味湯中加肉桂二錢五味五分甚則加附子二三錢冷飲即愈若先用苦寒之藥而熱不退再用芩連之類安得生乎十六論溫溫者溫其中也氣為陽氣虛則寒臟有寒邪不溫即死經曰陽氣者若天與日失其所則折壽而不彰以寒者陰慘肅殺之氣也陰盛則陽衰所以昔賢皆重救里宜及時而用溫也但溫有大溫次溫之殊大溫者以真陽將脫須回陽以固中元次溫者正氣猶在宜扶陽以顧將來庶轉凶為吉而生機勃然矣又有一種陰虛火盛內熱不宜用溫者凡薑桂附子之類勿用當用溫和之味不犯一毫寒涼則脾腎無傷斯為高明和陰益陽湯新治傷寒吐下後元氣不足以致飲食不思腹滿而嘔口吐冷涎大便溏泄小便不禁六脈虛弱四肢無力等症當歸二三錢白芍酒炒錢半白朮二錢茯苓錢半人參少者以淮山藥炒用三錢甘草炙一錢陳皮一錢半夏錢半砂仁炒研八分藿香一錢生薑煨一錢大棗三枚水煎溫服如四肢寒冷加附子一錢小腹痛喜按者加吳茱萸六分開水泡一次用泄甚者加肉豆蔻五七分但當歸減半須用土炒汗出加蜜炒黃耆錢半甚者加蜜炒麻黃根錢半若氣下陷亦加黃耆錢半升麻三分如小便不禁加鹽炒補骨脂一錢益智仁一錢如心虛不寧加棗仁炒研錢半理中湯治病後中氣虛寒自利不渴腹痛嘔吐脈弱等症人參若無人參屬氣虛者以蜜炒黃耆二錢代之脾虛者以灌山藥三錢代之白朮二三錢甘草炙一錢乾薑炒錢半水煎服如病重者日進二服如四肢厥逆加附子一二錢其有寒甚勢急者附子生用或煨熟用如腹痛而小便不利者加茯苓二錢白芍錢半嘔者加生薑二錢去附子八味回陽飲治脈虛將絶陰陽將脫人參無者以蜜炒黃耆一兩代之附子二三錢乾薑炒二三錢當歸身三錢如泄瀉者或血熱而動者去之熟地數錢或一二兩甘草炙一錢白朮三四錢黃耆蜜炒三錢水煎溫服如泄瀉者加烏梅二個虛火上浮者加茯苓二錢麥冬一錢如肝滯而脅脹痛者加肉桂錢半理陰煎此治真陰不足左尺無神陽浮假熱者熟地五七錢或加倍當歸身三五錢甘草炙一二錢乾薑炒一二錢一或加肉桂一二錢水煎服如陰中無陽加附子若脾腎兩虛水泛為痰或嘔或脹者加茯苓錢半或加白芥子五分若泄者去當歸加山藥扁豆吳茱萸肉豆蔻補骨脂之屬如腰痛加杜仲枸杞如腹脹痛加木香砂仁陳皮之屬十七論補補者濟其虛也古人言之已詳今人畏而不用且曰傷寒無補法謬亦甚矣使患虛者坐以待斃不大可憾乎觀仲景立三百九十七法而治虛寒者一百有奇垂一百一十三方而用人參桂附者八十有奇即東垣丹溪節庵亦有補中益氣回陽返本溫經益元等湯未嘗不補也夫實者不藥可愈虛者非治弗痊能察其虛而補濟之即握傷寒之要矣二補湯新治陰陽兩虛六脈俱弱夜熱肢冷失血便泄等症熟地三五錢當歸土炒二錢泄者或不用亦可黃耆蜜炒二錢枸杞二錢甘草炙錢半杜仲鹽炒二錢棗皮一錢白朮錢半淮山藥二錢肉桂一錢五味子十三粒微炒水煎服如寒甚者加附子錢半腹痛喜按者加補骨脂炒一錢泄者加烏梅二個肉豆蔻八分嘔惡加生薑一二錢小營煎治血少陰虛咽乾舌燥上下失血脈細數者當歸二三錢熟地二三錢白芍酒炒二錢山藥炒二錢川續斷錢半枸杞二錢水煎服如火盛煩躁加真龜膠二錢化服或加麥冬生地骨蒸加地骨皮錢半如身熱加青蒿一錢八味回陽飲治陰陽大虛元氣將脫者非此不治方載十六內十全大補湯治氣血兩虛惡寒發熱眩最自汗諸虛等症人參無者以山藥三五錢代之白朮二錢茯苓錢半甘草炙一錢白芍酒炒二錢熟地當歸各三錢川芎一錢黃耆蜜炒二錢肉桂錢半水煎服八味大建中湯治中氣不足厥冷嘔吐陰縮多汗腹中寒痛脹滿不食唇乾精出寒熱煩冤等症人參甘草炙各一錢黃耆蜜炒當歸白芍酒炒各二錢肉桂二錢半夏錢半附子一錢或二錢紅棗二枚生薑六分水煎服十八論三陰三陽傳入陽明胃府者為里非三陰之裡也三陰亦有轉於陽明者寒鬱為熱亦有虛實之異實熱者脈必沉實有力惡熱譫語大渴便祕是腸胃燥實宜下之若不轉入胃府而尤症實脈實者宜因經因脈調理之不得一概論下也加味平胃散新治太陰脾經病腹滿而吐食不下嗌乾手足自溫或自利腹痛不渴脈沉而細以太陰之脈布胃絡嗌故也蒼朮錢半厚朴姜炒一錢陳皮八分甘草炙八分扁豆炒研二錢白芍錢半半夏錢半大腹皮去黑皮及粗洗淨一錢砂仁一錢炒研生薑一錢三分大棗三枚去核水煎服如泄加肉豆蔻八分白朮錢半或再加煨木香三分如腹痛拒按者去生薑加葛根錢半如嗌乾加元參桔梗八味地黃丸治少陰腎經病舌乾口燥或自利而渴或欲吐心煩引衣倦臥其豚沉以少陰之脈貫腎絡肺系舌本故也熟地八兩山藥棗皮茯苓各四兩丹皮二兩澤瀉兩半肉桂三兩附子三兩共研末煉蜜為丸病急即減兩為錢水煎早服養肝抑邪湯新治厥陰肝經病或氣上撞心心中疼煩熱消渴飢不欲食食即嘔蛔下利不止脈沉而弦以厥陰之脈循陰器而絡於肝故也當歸二錢白芍酒炒錢半柴胡酒炒錢半熟地二錢川椒炒七分麥冬一錢烏梅二三錢木香煨三五分白朮錢半茯苓二錢水煎服如消渴甚者加黃柏知母各錢半肉桂五分陽邪自太陽傳至太陰則嗌乾未成渴也傳至少陰則口渴未成消也傳至厥陰而成消渴者熱甚能消水也若脈症皆實宜用承氣等湯下之然又有說以肝居下部而邪亂之則邪上撞心木邪乘土則脾氣受傷所以飢不欲食脾土既傷而復下之則脾愈傷而利不止此所以宜養肝補土也麻黃附子細辛湯治少陰傷寒以無頭痛也始得之脈沉而反發熱者此陰分表邪也用熟附配麻黃者發中亦有補焉麻黃去節錢半附子錢半細辛七分水煎服或去細辛加甘草真武湯治少陰傷寒腹痛或嘔或利或咳小便不利四肢重痛茯苓白芍生薑各三錢白朮二錢附子錢半水煎服若咳者加五味子三分細辛六分乾薑一錢小便利者去茯苓下利去白芍加乾薑錢半嘔者去附子加生薑二錢十九論傷寒中寒不同凡六腑屬陽一受寒邪先發太陽發熱惡寒治宜疏散五臟屬陰一受寒邪必發太陰惡寒不熱治宜溫托以腠理素虛而陽微最忌發表其外寒所受雖同而里則以有火為傷無火為中之異此猶人所共知至於陽極而症似陰陰極而症似陽治若稍混殺人反掌詳明於下以便取用凡陽症似陰者手足冷大便閉小便赤煩悶昏迷身寒卻不欲衣口渴指甲紅脈必沉滑或四肢厥冶此陽極於內真陰失守也輕則調胃承氣湯重則大承氣湯下之以救一線之陰不至為陽所劫此時不知診脈疑以為寒用一毫溫熱之藥則立斃矣凡陰症似陽者煩躁面赤咽乾大便泄小便清指甲黑或身熱反欲得衣口渴不喜冷水脈必浮微若認為陽證投以寒藥死者多矣總之陰證不分熱與不熱不論脈之浮沉大小但指下無力重按全無便是伏陰急與五積散通解表裡之寒若內有沉寒必須姜附溫之如附子理中湯方載上十六內之屬乃為妙劑五積散治內外陰寒並治感冒食積嘔吐背項拘急等症當歸一錢白芍陳皮各八分川芎白芷桔梗各一錢蒼朮錢半枳殼肉桂各一錢半夏厚朴茯苓各一錢三乾薑一錢麻黃去節五八分人參少者亦服甘草七分生薑一錢蔥白三莖水煎熱服太陽湯新治寒中三陰戰栗厥逆嘔吐昏迷唇青囊縮等症白朮三錢乾薑炒一二錢當歸錢半泄者不用山藥炒二錢附子二三錢勢危者用生附子濕紙包煨熱用甘草炙一錢白芍煨錢半生薑一錢紅棗三枚水煎服或假熱拒格不納冰冷服此方用白芍恐陽藥之僭越也可代理中四逆回陽等湯如冬月寒傷太陽經有表證者加麻黃八分頭痛加北細辛二三分如肉振汗多者加制黃耆二三錢如泄瀉者加烏梅二個去當歸如肝脈緊而鬱滯者加肉桂二錢如小腹痛而喜按者加吳茱萸七分湯泡一次用又須兼下方外治乃妙華他救脫陽法治寒中三陰陽脫無脈昏倒強直等症用蔥白一二斤搗碎炒熱絹綢包尉臍下以二包更替尉之脈漸出手足溫者生內服上方但藥小及少緩者俱不能濟二十論傳經及合病並病凡風寒中人入陰入陽原無定體及已中之後或傳或不傳或初入太陽即入少陰而成真陰症者有之不必盡如經言日傳一經者之說也所以凡治傷寒宜見證治證如在表者疏之在中者和之在裡者攻之不必拘泥此活法也合病者或兩經同病或三經齊病是也治之者必以一經病重為主各經病亦須兼之因證察脈自必適中如方書所載白虎湯治三陽同病之類似難恰合宜變通因心並病者一經先病未盡又過一經者是也但過經不盡循序或越一經越二經者有之治之者宜以後過之經為主治勿使未盡而又過經也能因機察變原始要終乃為高明仲景曰傷寒先在太陽脈靜者不傳若煩躁脈數者為傳也傷寒二三日陽明少陽證不見者為不傳傷寒數日無熱而煩躁者為陽去入陰也若能食不嘔陰受邪也二十一論兩感凡病兩感者內外皆感於寒者有之亦有縱欲勞力七情先傷於內而後寒邪復傷於外者是表裡俱病本危症也然細察之亦有緩急可辨彼三陽之頭痛身熱耳聾脅痛惡寒而嘔者外邪也其三陰之腹滿口渴囊縮譫語者此內邪也若外甚於內當以外為主治而兼調其內內甚於外當以內為主治而兼理其外外甚者疏之解之內甚者和之攻之以言內外傷寒者也若元氣素虛脈息無神而內傷復兼外感者此宜單顧根本不可攻邪一得元氣不敗則強寇自退或可望其生矣此症變態非常不可鑿言方治姑舉古方以治兩感傷寒為臨此症者之法大羌活湯治內外兩感傷寒若內傷不繫外寒傳裡者忌用羌活獨活防風防己黃芩黃連白朮各二錢蒼朮二錢甘草北細辛各一錢知母生地各七錢川芎七分水煎熱服此陰陽兩解也蓋表裡俱病欲汗之則有里症欲下之則有表症潔古制此方者意以傳經為陽邪故以羌獨蒼防芎細祛風發表升散傳經之陽邪芩連知地黃己清熱利濕滋培受傷之陰血又用朮草以回中州而和表裡或可救治沖和靈寶飲治症同前羌活防風各錢半細辛五分川芎白芷生地黃芩各一錢二分甘草柴胡乾葛石膏各一錢二分黑豆一撮加生薑蔥白煎服如自汗加白朮黃耆如胸滿加枳殼桔梗去生地喘加杏仁若要汗下兼行加大黃當隨症加減不可執滯
