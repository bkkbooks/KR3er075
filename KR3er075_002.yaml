body:
  text: 卷之二治法精要一論人元氣宜早培補上古之時氣運渾厚人心醇朴故人之享壽或耄耋或期頤且有百餘歲者而其後則不然氣運不同渾噩之風日遠而人之生也或數月而嬉笑或童稚而靈慧逮十餘歲後知識日開六淫七情無往而非斫喪之事所以壯者日衰少者易老牙落髮禿腰膝疼痛內傷咳嗽喉爛身熱飲食不思由是形容枯槁坐以待斃雖有良醫不可救援而欲以壽終也難矣人皆歸之於數而不知所以自致者不少也譬之燭然將一枝燃於靜室無風之所一枝燃於門外多風之地而外者之易燼不及內者之可以久延也餘年二十以前體弱多病二十以後知看藥書至生病隕身之處至再至三諄諄懇懇讀之痛心不覺毛骨悚然凡一切損身耗神之事毫不敢犯並調養藥餌年常服之所以目今七旬未有老邁光景大約得於保養之力者居多夫人得於氣運之薄及先天之不足者固無可如何若能惜身重命凡一切損身者戒之益身者遵之早為培補後天人功可以挽回造化體旺而壽長也尚其知之培補保元丸新治一切體弱脈虛腎虧神倦及失血咳嗽夢遺火炎小便短赤喉舌乾燥等症人於少年時每年制服一料可免內傷陰虛之病若有是症更宜多服不可忽視延捱至囑本支地八兩揀六七錢重一支者有小直紋而無橫紋其色不純黑內有菊花黃心為佳略洗用元砂仁四錢微炒研末同米酒入砂鍋內以紙濕封數層久蒸取出曬乾加酒再蒸如是者九次切勿用砂鍋煮熟以真汁耗也最忌鐵氣有謂用薑汁蒸者姜入脾經切不可依棗皮四兩下部滑遺者加一兩酒蒸淮山藥炒四兩白雲苓四兩去皮粉丹皮一兩六錢酒浸如血虛熱燥者加五六錢建澤瀉一兩二錢淡鹽水浸如小便短澀加五六錢當歸三兩酒蒸白芍二兩半煨酒炒杜仲三兩鹽水炒甘枸杞三兩酒蒸菟絲子淘淨泥沙四兩酒蒸曬乾研末北五味兩半微炒先將地黃棗皮枸杞當歸共搗成膏然後將余藥研末加煉蜜斤多共杵為丸梧桐子大每早用淡鹽水送百丸立夏便服交秋忌用如血虛發熱者加上阿膠三兩蛤粉炒成珠即失血者亦用或多用如咳嗽有痰者加川只母四兩糯米拌炒麥冬三兩去心酒蒸如下部虛滑加蓮鬚三兩牡蠣煅淨粉醋炒四兩如腎中之陽虛加補骨脂鹽炒三兩如乏嗣者加胡桃肉四兩此方或少加熟附子一兩以助各藥之力少年體弱者宜服如中年右尺脈虛屬命門火衰及腎中之陽不足而乏嗣者俱宜加肉桂三兩製附子製法載本草三四兩補骨脂胡桃肉各四兩更效溫脾湯新此平補脾胃之藥早服上方丸者中時服此方一劑庶脾腎兩補則先天后天俱培自精神健旺無虞也方見失血症平補虛弱湯新治氣血兩虛脾腎悉虧身倦神暈一切不足等症人參少者以時下生條參三五錢代之白朮茯苓炙草各錢半當歸二錢白芍酒炒錢半杜仲黃耆蜜炒各二錢甘枸杞山藥各二三錢五味十五粒附子一錢或多用薑棗引如不思飲食加藿香元砂仁各一錢如氣滯作脹加陳皮八分廣木香三分如脾虛下泄者加炮乾薑八分肉豆蔻一錢如血虛發熱加熟地三五錢或兼用生地亦可男婦俱效備揀古來治虛損百病至穩神方於後以便取用還少丹治脾腎虛寒欲食少思發熱遺精氣虧體瘦等症熟地六兩山藥棗皮杜仲姜水炒甘枸杞各三兩五味牛膝酒浸遠志肉薑汁浸炒肉蓯蓉酒浸菟絲子制川續斷楮實子船茴香巴戟肉各兩半為末蜜丸鹽湯下無比山藥丸治諸虛損傷常服壯筋骨益腎水令人不老山藥四兩菟絲子酒蒸六兩五味二兩半肉蓯蓉酒浸焙五兩杜仲酒炒三兩牛膝酒蒸二兩熟地三四兩澤瀉七八錢巴戟肉棗皮茯苓赤石脂各二兩為末蜜丸溫酒米湯任下十全大補湯治氣血兩虛體倦頭眩神昏自汗一切不足人參少者或山藥或沙參條參多用代之白朮茯苓各二錢炙甘草一錢熟地當歸各二錢白芍酒炒錢半川芎一錢黃耆蜜炒二錢肉桂錢半溫服或虛寒者加附子一二錢人參養榮湯治脾肺俱虛寒熱自汗心悸食少身倦神昏等症人參黃耆當歸白朮炙草桂心熟地白芍茯苓各錢半五味遠志各七分陳皮一錢薑棗引仙傳班龍丸壯精神除百病養氣血補百損常服延年輕身鹿角膠鹿角霜菟絲子制熟地各八兩茯苓柏子仁微炒去油補骨脂鹽水炒各四兩將膠溶化加酒為丸鹽水酒任下打老兒丸治諸虛百損補精生血益氣力健筋骨多服延壽熟地山藥炒肉蓯蓉酒洗各五兩牛膝酒蒸巴戟枸杞湯炒楮實子去浮者枸杞茯苓杜仲鹽水炒棗皮各四兩北五味蜜水蒸遠志肉甘草湯制小茴香鹽水炒各二兩石菖蒲兩半川續斷酒浸三兩先將熟地蓯蓉棗皮搗化後入藥末蜜丸早夜或酒或鹽水服百丸源泉湯新治血虛勞熱骨蒸五心熱大便乾燥小便黃澀等症當歸錢半生地二錢用大本支摘碎酒浸一時熟地三錢白芍錢半酒炒阿膠蛤粉炒成珠錢半枸杞錢二分青蒿七分丹參二錢半乾薑炒黑過心五七分淮藥錢半元參一錢陳皮七分地骨皮一錢水煎日服一劑或多服如尺脈弱血虛有寒者加肉桂一錢如婦人産後加益母草三錢此方更宜婦人若五心不熱減元參如骨不蒸熱去地骨皮如胃寒作嘔者去生地濟陰浚泉丸新治陰虛勞熱骨蒸喉痛尿赤夜燥等症熟地八兩製法詳載本草棗皮四兩去核酒蒸淮藥四兩微炒丹皮二兩五錢茯苓四兩澤瀉兩半枸杞三兩酒蒸上肉桂二三兩真龜板膠三四兩水酒蒸化合煉蜜為丸如精滑白遺者加杜仲鹽炒三兩補骨脂酒炒二兩胡桃肉三兩如火炎肺咳加麥冬三兩款冬花三兩如火爍肺而痰臭者再加白芨三兩多服自效但須遠房室調飲食一切損神耗力之事務宜切戒隨補羊肉羹新治一切體弱神昏不愛飲食倦怠無力大小男女同治須當隨體加藥引導至簡至易神方不可忽視但有毒者忌之以羊食百草能發百毒也羊肉不拘多少或半斤或四兩照常加鹽加醬烹調如命門火衰或腳膝冷或身體冷或腹冷腹痛大便溏泄不思飲食或食而不化等症每兩羊肉用熟附子一錢同煮或食或揀去不食若以附子研末同煮更妙虛弱之症須多用數會其效如神如氣虛者四肢無力神氣短少用蜜制黃耆煎水煮羊肉如血虛者唇白膚枯或失血之後或婦人生産之後或月水瘥後而色淡血少用當歸煎水煮羊肉如脾土虧弱不能多食或泄瀉或削瘦此等症候小兒最多大人亦不少用淮山藥炒黃或少加熟附子共研細末敷羊肉服以上所載方法宜因體活用不得拘泥至於羊肉與人參同為大補之物但人參猶屬草根不及羊肉為氣血之俱盛也且易辦於參味高於參天下人所樂食不得引導之藥雖日食之而於不足之處終無有益養生者宜知之金髓煎用枸杞不拘多少以酒浸之固封兩月取出擂爛同浸酒入砂鍋內熬成膏淨瓶密收每早溫酒調服幾匙夜亦再服百日身輕氣壯積年不輟可以羽化也二論事屬損傷宜自戒懼夫人之受氣於天以成形其生死本有全局奈人自有知識以來恃其少壯凡傷身捐神之事無所不為而得全其生之常度者無幾此非天命皆由自作不得不詳言之以為保身者戒一曰酒蓋酒之味甘其引人嗜也日夜無度而不知害人也有甚於砒霜者矣酣醉日久病變百出或濕邪傷脾痰膈嘔吐或肌肉鼓脹腸風瀉痢或耽湎不知水淹跌傷鬥毆傷生者不知其幾何人矣一曰色因嬌媚可愛不知伐命之說為何倘貪之戀之其傷敗也或致勞瘵或染穢惡或驚嚇喪膽爭奪致殃及至亡身敗家而悔之無及者又不知其幾何人矣一曰財人知財能養命豈知財能殺人貪得者不顧義理爭奪者不惜性命而究之悻入者亦悖出積一生之圖謀一旦化為烏有而明知明味者又不知其幾何人矣一曰氣恃血氣之勇逞好勝之私事無大小每不自平豈虞忿怒最捐肝脾膈食氣蠱脅痛厥逆等症胥由是生也甚至恃強爭競不傷他人必傷自己身受刑罰骨肉分離蕩盡莫救而自愚自斃者又不知其幾何人矣夫人生之自天成之自己乃人不知自成而擾於酒色財氣之中終身昏迷不能出其藩籬而禍患無極者此皆聰明之誤而愚拙者或不至此也廣成子曰毋勞爾形毋搖爾精乃可以長生蓋形言其外精言其內內外俱全斯得我生之常度而可以壽終矣此古聖人垂念蒼生至真至極之良方也可不佩之以為終身之戒乎以下治酒病葛花解酲湯治酒過痰逆嘔吐痞塞心煩食少昏沉尿澀等症人參少者山藥三錢炒黃或時下條參三錢代之白朮茯苓砂仁葛花白豆蔻肉各一錢青皮陳皮豬苓澤瀉各七分神麯木香各五分姜引熱服取微汗酒病去矣節齊化痰湯治酒痰結於肺胃或吐咯難出因火邪炎上凝滯也天冬去心黃芩酒炒海石另研栝蔞仁去油橘紅各一兩連翹香附淡鹽水炒桔梗各五錢青黛另研芒硝另研各三錢共研末煉蜜加薑汁少許搗丸緑豆大淡薑湯下五六十丸酒過腫脹用香附二兩艾葉醋煮焙為末一兩醋糊丸久服敗水從小便出嗣後宜戒酒止嗜酒方用蒼耳子七枚燒灰存性投酒中欲之即不嗜酒又方以酒二碗漬氈襪底一宿平旦飲之勿令彼知得吐即止救火酒醉傷用水豆腐重敷遍身可蘇輕者用冷水塗濕腦後項後醉醒後心中無主用雞蛋三四個煮湯加醋少許食之可以補體定神戒酒良方凡酒之傷人不能自知宜以醒眼觀醉人小則失儀大則傷身令人膽戰心寒何酷好乃爾嗣後貪之者須及早回頭後來者適可而止由是身安行端其樂何如以下治色病拯腎湯新治腎經損傷神昏身倦或遺精白濁玉莖隱痛等症熟地四錢棗皮山藥枸杞杜仲鹽水炒巴戟去心各錢半茯苓一錢五味三分補骨脂鹽水炒一錢空心服服之而效可照分量加二十倍再加菟絲子酒蒸四兩青鹽五錢煉蜜為丸每用淡鹽湯空心下七八錢濟陰丸新治腎經陰陽兩虧兩尺脈空虛無神將成勞瘵等症熟地八兩棗皮四五兩山藥四兩茯苓三兩龜板膠三兩酒蒸肉桂三兩附子三四兩杜仲淡鹽水炒三兩菟絲子淘淨泥沙酒蒸四兩五味二兩先將地黃棗皮搗成膏余藥研末加龜膠煉蜜為丸空心服七八錢淡鹽湯送下至於修制加減與上保元丸可以參用青娥丸治腎虛腰痛膝軟補精益髓諸損悉效補骨脂炒四兩杜仲八兩姜水炒胡桃肉去黑皮十兩加巴戟肉四兩胡蘆巴炒四兩肉蓯蓉酒洗三兩或加大茴香鹽水炒二兩青鹽五錢共研末煉蜜為丸空心溫酒或鹽湯送下五十丸戒色良方凡病多由自致而色傷則不然未病者致病已病者加病一身之精液盡枯雖有妙藥不償所出也治財病文略以下治氣病逍遙散治忿怒損傷肝脾脅痛發熱等症當歸白芍白朮茯苓各二錢甘草一錢柴胡八分姜引或加薄荷葉三分排氣飲治內傷肝膽氣逆脹滿陳皮去白錢半木香七分藿香錢半香附二錢枳殼澤瀉烏藥各錢半厚朴一錢熱服如氣逆之甚者加白芥子沉香青皮檳榔之屬解肝煎治暴怒傷肝陰滯氣脹陳皮半夏厚朴茯苓各錢半蘇葉白芍各一錢砂仁七分姜引如氣脹痛加枳殼香附藿香之屬化肝煎治怒氣傷肝因而氣逆動火致為煩熱脅痛脹滿動血等症青皮陳皮白芍各錢半丹皮梔子各一錢澤瀉一錢如血見下部者以甘草代之土貝母二三錢溫服如大便下血者加地榆小便下血者加木通各錢半如兼寒熱加柴胡一錢如火盛加黃芩一二錢如脅腹脹痛加白芥子一錢如脹滯多者勿用白芍戒氣妙法文略三虛實真假辨虛者宜補實者宜瀉此易知也而不知實中復有虛虛中復有實故每有至虛之病反見盛勢大實之病反見羸狀此不可不辨也如病起七情或飢飽勞倦或酒色所傷或先天不足及其既病則每多身熱便閉戴陽脹滿虛狂假斑等症似為有餘之病而其因突由不足醫不察而瀉之必枉死矣又如外感之邪未除而留伏於經絡飲食之滯不消而積聚於臟腑或鬱結逆氣有不可散或頑痰瘀血有所留藏病久致羸似乎不足不知病根未除還當治本若誤用撲必益其病此所謂無實實無虛虛損不足而益有餘如此死者醫殺之耳余有虛實憑脈辨一條在後十五參閲自明四治宜精一精一者聖道之本而醫道亦須精一以為之本故內經曰治病必求其本蓋以病之變態雖多其本則一或寒或熱或虛或實既得其要但得一味二味便可拔除即或多味亦不過於此而輔佐之而其意則一此余之數數然也若醫之不精者必不能一凡遇一症毫無定見欲用熱而復製之以寒恐熱之為害欲用補而復製之以消恐補之為害若此者其何以撥亂而反正乎即使偶愈亦不知其熱之之功寒之之功也若其不愈亦不知其熱之為害寒之為害也彼病淺者或無大害若安危所繫即用藥雖善而不敢猛用則藥不及病尚恐弗濟矧執兩端而妄投者其害更將何如為醫者先求其精乃知其本而能一之不可以人而試藥也五補瀉有法凡新病而少壯者乃可攻之瀉之此但可用於暫若久病而虛弱者理宜溫之補之此乃可用於常然猶有要凡臨症治病但無實症可據而為病者便當兼補以調榮衛精血之氣亦無熱症可據而為病者便當兼溫以培命門脾胃之氣此治法要領有不可稍忽以貽害者六治法從逆凡治法有從逆以寒熱有真假此內經之旨也經曰逆者正治從者反治夫以熱治寒以寒治熱此正治也正即逆也以熱治熱以寒治寒此反治也反即從也如以熱藥治寒病而寒不退者是無火也當補命門如參地桂附之類此王太朴所謂益火之源以消陰翳是亦正治之法也又有假寒真熱者脈必不緊反用寒涼而愈以寒從治之法也又如以寒藥治熱病而熱不除者是無水也治當在腎用六味丸之類此王太朴所謂壯水之主以鎮陽光是亦正治之法也又有假熱真寒者脈必無力反用桂附參姜而愈以熱從治之法亦所謂甘溫能除大熱也此外治假寒假熱復有權宜之妙如以熱藥治寒而假熱相拒則以熱藥冷服如以寒藥治熱而假寒相拒則以寒藥熱服掣過上焦則本性乃發情既相協而獲效自奇七升陽散火滋陰降火辨凡治火之法有曰升陽散火者有曰滋陰降火者而或升或降不可混用夫火之為用有發於陰者火自內生為五內之火宜清宜降也有發於陽者火自外致為風熱之火宜散宜升也何人一見火症無分表裡輒稱風熱多用升陽散火之法是不知風熱之義其說有二有因風而生熱者有因熱而生風者因風生熱者以風寒外閉而火鬱於中此外感陽分之火風為本而火為標也因熱生風者以熱極傷陰而火達於外此內傷陰分之火火為本而風為標也經曰治病必求其本可見外感之火當先治風風散而火自息宜升散不宜清降以外感之邪得清降而閉固愈甚內生之火當先治火火滅而風自清宜清降不宜升散以內生之火得升散而燔燎難當此其內因外因自有脈症可辨須為分別經曰病生於內者先治其陰後治其陽反者益甚病生於陽者先治其外後治其內反者益甚觀此愈知散火降火毫不可混用也八君火相火論經曰君火以明相火以位此但表其大義原無分屬之條惟刺禁論曰七節之傍中有小心此固隱然有相火所居之意故後世諸家咸為相火寄在命門是固然矣而其為明為位之義未之詳也蓋君道惟神其用在虛相道惟力其用在實故君之能神者以其明也相之能力者以其位也是明即位之神無明則神用無由以著位即明之本無位則光焰何從而生所以君火之變化於無窮總賴此相火之栽根於有地有此君不可無此相也明矣君相之義豈泛言哉何東垣云相火者下焦包絡之火元氣之賊也丹溪亦述而證之此俱誤認火之面目者也或曰彼之指為賊者不為無意蓋謂人之情欲多有妄動動則起火火盛致傷元氣即謂元氣之賊亦何不可不知情欲之火為邪氣君相之火為正氣是命門為元氣之根水火之宅精血之海五臟之陰氣非此不能滋五臟之陽氣非此不能發而脾胃之土非火不能生蓋以春氣始於下則三陽從地起而後萬物得以化生豈非命陰之陽氣在下正為脾土之母而諸臟之源乎夫既以相稱之而竟以賊名之其失聖人之意也遠矣且凡火之賊傷人者非君相之真火無論在外在內皆邪火耳邪火可言賊相火不可言賊也二子有知其以余言為何如九用藥之法經曰塞因塞用通因通用寒因熱用熱因寒用用熱遠熱用寒遠寒不無義理宜明析之脾虛作脹治以參朮脾得補而能運化則脹自消所謂塞因塞用也傷寒挾熱下利中有燥屎用承氣湯下之乃安所謂通因通用也寒因熱用者藥本寒也而反佐之以熱藥一二味或寒藥熱服熱因寒用者藥本熱也而反佐之以寒藥一二味或熱藥冷服俾無拒格之患所謂必先其所主而伏其所因也用熱遠熱用寒遠寒者如寒病宜投熱藥熱病宜投寒藥僅使中病即止勿過用焉過用則反為藥傷矣如前諸法前賢既已指示後人宜為會悟十先天水火論人之兩腎左陰右陽左腎屬水先天之元精也右臂屬火先天之元陽也一水一火同稟生初原無勝負之分奈人自有知覺以來恃其少壯日加斫喪不知精氣之生息有限而人之耗損無窮由是水虧不能配火而虛火上炎其咳嗽喘急骨蒸勞熱咽痛煩渴等症見焉此際宜用甘涼滋陰補水以配火也丸藥水藥如六味之類久服多服或可挽回若徒用知柏苦寒以瀉火此水中之火固不能瀉而脾胃大傷減食發泄之症又生矣斯時脾腎兩虧縱有良醫恐難為力經又曰滋陰之藥多濕脾補脾之藥又燥腎古未有脾腎同補妙方余因經言而悟之早夜補腎中時補脾二方同進或腎虧之甚以補腎為主而補脾之藥亦不可少或脾虧之甚以補脾為主而補腎之藥亦不可間余於失血門有滋陰湯溫脾湯可參閲而酌用之及至中年老年有無病而體弱者宜補陽以生陰經言無陽則陰無以生猶釜底加薪而飲食易化遊溢精氣灌注臟腑則精神自旺而年壽自益如八味丸之類是也但古方只用桂附各一兩今當各用三四兩不等乃為有益若徒知滋陰而抑知春夏陽和草木易榮秋冬肅殺花卉善萎也乎十一相火論命門相火乃先天真一之氣藏於坎中自下而上與後天胃氣相接而化此實生生之本也是以花萼之榮在根柢灶釜之用在柴薪使真陽不發於淵源則總屬無根之火矣火而無根即病氣也故易以雷在地下為復可見火之標在上而火之本則在下且火之就燥性極畏寒若使命門陰勝則元陽畏避而龍火無藏身之地故致遊散不歸而為煩熱格陽等病凡善治此者惟從其性但使陽和之氣直入坎中據其窟宅而招之誘之則相求同氣而虛陽無不歸原矣若太陽一照則雷電潛藏所調甘溫能除大熱如參地桂附之類正此之謂也若夫昧者以虛陽而作實熱不思溫養此火而但知寒涼可以滅火安望其尚留生意而不使之速斃耶倘系客熱邪火皆凡火耳固不得不除而除火何難是本非正氣火候之謂也人能明邪正二字則得治生之旨矣十二標本論經曰治病必求其本又曰先病而後熱者治其本先病而後泄者治其本之類約十餘條由此觀之諸病皆當治本而惟中滿與大小便不利兩症當治標耳蓋中滿則上焦不通小大便不利則下焦不通此不得不治標以開通道路而為升降之所由是則雖曰治標而亦所以治本也蓋以急則治標緩則治本緩急二字誠所當辨不知標本則但見其形不見其情不知緩急則所急在病而不知所急在命故每致認標作本認緩作急而顛倒錯亂全失四者之大義重命君子尚其慎察於此十三論內傷外感不同外感內傷症候相似治法懸絶不可不辨傷於飲食勞役情欲為內傷傷於風寒暑濕為外感內傷發熱時熱時止外感發熱熱甚不休內傷惡寒得暖便解外感惡寒雖厚衣烈火不除內傷惡風不畏甚風反惡隙風外感惡風見風便惡內傷頭痛乍痛乍止外感頭痛連痛不止直待表邪傳裡方休凡外感至十日半月有頭痛表猶未解仍當走表內傷有濕或不作渴或心火乘肺亦作燥渴但飲茶湯不多外感須三四日外表熱傳裡口方作渴飲茶湯由少而多內傷則熱傷氣四肢沉困無力倦怠嗜臥外感則風傷筋寒傷骨一身疼痛內傷則短氣不足以息外感則喘壅氣盛有餘內傷則手心熱外感則手背熱天氣通於肺鼻者肺之外候外感寒則鼻寒傷風則流涕然能飲食口知味腹中和二便如常此表邪未入里也地氣通於脾口者脾之外候內傷則懶言惡食口不知味能食者病雖重胃氣未絶猶為可治小便短黃大便或祕或溏此裡虛當知溫補也左人迎脈在左關之上寸之下主表外感則人迎脈或大或緊甚於氣口右氣口脈在右關之上寸之下主裡內傷則氣口脈或大或數甚於人迎內傷症屬不足或溫或補或和不得誤作外感妄發其表外感症屬有餘或汗或吐或下不得誤作內傷妄用清涼又有內傷兼外感者若內傷重補養為先外感重發散為急但不得偏廢也傷寒門有補中益氣湯隨症加入於後可以參閲至於脈息亦須辨別內傷脈或大或數久按重按即軟而無力數大為虛火無力為氣虛血虛若誤作有餘之火一用寒涼則虛者愈虛不但火之轉甚而脾氣亦絶矣又有以氣口緊盛作食滯者然脈之有力無力已相迥別況食滯者必噁心飽悶神壯不倦內傷者心不痞不飽倦怠無力更可驗也十四論寒熱寒熱之病有外感風寒暑濕之客邪有內傷欲食勞苦情欲之元氣症候不一治各不同外感者自表入里當用發散其論其治已詳傷寒門茲不復贅至於內傷發為寒熱須逐症分析庶不誤治但內傷外感二症相似恐人誤認余有內傷外感辨所當參閲經曰有所勞倦形氣衰少穀氣不勝言胃虛谷少不能勝任其勞倦也上焦不行清氣不升下腕不通濁陰不降胃氣熱濁陰不降故胃氣熱熱氣熏胸中故內熱少火皆成壯火而上炎此則真陽下陷內生虛熱宜用補中益氣甘溫之藥而提其下陷也房勞太過內傷真陰不能配火則火旺而發為勞熱有夜熱骨蒸五心熱咽喉痛等症宜用六味八味之類詳明失血門滋陰以降火也倘氣血兩虛但用甘溫如參耆之類之劑以補氣為先兼補其血蓋氣旺則能生血也若血虛而氣不虛忌甘溫補氣蓋氣旺則血愈消矣虛熱固禁發汗退熱不可過用寒涼以傷脾胃斯為善治經曰陰氣不足則內熱乃真不足也陽氣有餘則外熱乃假有餘也凡元氣傷而一切熱症皆是無根虛火但服十全大補之類或氣虛補氣血虛補血根本固而諸症自息若往來潮熱在外感屬少陽宜小柴胡湯和解之時寒時熱在內傷屬陰陽俱虛陽虛則寒宜補脾以生肺如四君歸脾之屬中時服之陰虛則熱宜補腎以壯水如熟地龜膠之類早夜服之庶陰陽交補而寒熱自退矣十五論寒熱脈證有虛實真假內外之異凡真寒之脈必遲弱無神假寒之脈必浮洪有力真熱之脈必滑實有力假熱之脈必緊數無神其症其治詳傷寒門陰症似陽陽症似陰條內所當參閲身大熱反欲得近衣者熱在皮膚寒在骨髓也身大寒反不欲近衣者寒在皮膚熱在骨髓也人迎脈大於氣口為外感氣口脈大於人迎為內傷浮緊為表寒沉緊為裡寒浮數為外熱沉數為內熱浮大無力為虛沉細有力為實脈緊惡寒謂之傷寒脈緩惡風謂之傷風脈盛壯熱謂之傷熱脈虛身熱謂之傷暑熱而精力不倦者為實倦者為虛初按則熱久按不熱者是里陽浮表也為虛初按則熱久按愈熱者是裡熱徹表也為實壯熱不減遍體如火者為實乍熱乍減頭熱足冷者此無根之火浮越在表在上也為虛口乾飲冷而多者為實口渴飲湯喜熱而少者為虛身壯熱而脈沉細及大極數極按之乍大乍小者為虛身微熱而脈洪數不改者為實身熱無汗二便閉澀者為實身熱有汗二便通調者為虛發熱惡寒者寒傷表也陽也無熱惡寒者寒中里也陰也總之病之熱也求外邪感傷擾動清陽或內滯鬱蒸釀成壯火舍此二實之候非氣虛不能收攝元陽即陰虛不能鎮約雷火氣虛者自寅至申熱在陽分肺氣主之惟參耆熟附所謂甘溫能除大熱也陰虛者自申至寅熱在陰分腎氣主之惟歸芍熟地所謂養陰退陽也能因此而詳求其理則可盡悉其源而治之自無難也
