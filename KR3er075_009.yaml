body:
  text: 卷之九雜證二十三論咳嗽咳者無痰有聲肺病也嗽者有痰無聲脾病也咳嗽者有痰有聲肺脾俱病也經曰肺令人咳又曰五臟六腑皆令人咳不獨肺也丹溪曰咳嗽有風寒火痰虛勞鬱結肺脹之異然總其綱領不過外感內傷而已風寒暑濕傷於外則先中於皮毛皮毛為肺之合肺邪不解他經亦病故自肺而後傳於諸臟此肺為本而臟為標也邪自表而入者病在陽宜辛溫以散之藥不宜靜靜則留連不解變生他病故忌寒涼收斂經所謂肺欲辛是也若形病俱虛又當補中氣而佐以和解倘專於發散恐肺氣益虛腠理益疏邪乘虛入病反增劇矣至於勞欲情志傷於內則臟氣受傷由陰分而生病及上焦故自諸臟而後傳於肺此臟為本而肺為標也息自內而生者病在陰宜甘以壯水潤以養金藥不宜動動則虛火不寧燥癢愈甚故忌辛香燥熱經所謂辛走氣氣病無多食辛是也若命門火衰不能歸元則桂附在所必用否則氣不化水絡無補於陰也或有因於火者宜清因於濕者宜利因痰者消之因氣者理之隨其證而調治至於老人虛人宜以溫養脾肺為主稍稍治標可也若欲速愈而亟攻其邪則危矣凡風寒暑濕有不為嗽者蓋因所感者重不留皮毛徑傷臟腑而成傷寒溫熱諸病也七情亦有不為嗽者蓋病尚淺只在本臟未傳於肺也所以外感以有嗽為輕而七情之嗽必久而後發為重也凡咳嗽其氣從臍下逆奔而上者乃腎虛不能收氣歸元切勿徒事於肺當以骨脂安腎丸主之凡咳而無痰者咳為重主治在肺因痰而致咳者痰為重主治在脾治脾而痰自除不必用肺藥以治咳也但脾有虛實濕熱鬱結多證宜詳察治之凡虛弱之人感外邪而咳嗽不察者見發熱遂認為火見咳嗽遂認為勞不明表裡率用滋陰降火等劑使內外俱寒邪留不解俗云傷風不愈變成勞此治者之誤也凡乾咳嗽暴得者乃火鬱於肺中久病者系內傷虧損肺腎不交津液枯涸而然但看有火無火不得概視無火者止因肺虛補氣自能生精臟寒者非辛不潤補陽自可生陰若兼內熱有火者須保真陰壯水自能制火使徒知消痰開鬱將見氣愈耗水愈虧未免為涸轍之鮒矣凡咳嗽聲啞者以肺屬金金實則不鳴金破亦不鳴金實者以肺中有邪非寒邪即火邪也寒者宜溫宜辛火者宜甘宜清金破者以真陰受損非氣虛即精虛也氣虛者宜補陽精虛者宜補陰與乾咳證參酌用之凡專用寒涼以治咳嗽者固不必齒間有用參耆者不知先壯水以制火而遽投參耆以補陽反使陽火愈旺而金益受傷此不識先後著者也脈候浮風緊寒數熱細濕房勞澀難右關濡者飲食傷脾左關弦短疲極肝傷浮短傷肺病當咳嗽洪滑多痰弦澀少血脈出魚際氣逆喘急浮直而濡者易治上氣喘急面浮腫肩抬鼻扇脈浮大者死脈弱者可治實大堅數者死咳而脫形身熱脈小堅急者死沉緊者死小而伏者死浮軟者生咳而嘔腹滿而泄弦急欲絶者死加味二陳湯新治四時感冒咳嗽寒熱身痛鼻塞即病愈而咳痰久不止者並治陳皮去白錢半半夏二錢茯苓錢半甘草一錢桔梗二錢枳殼錢半桂枝一錢杏仁去皮一錢蒼朮一錢當歸一錢柴蘇葉七分北細辛三分生薑八分水煎熱服如肺寒而邪不散者加麻黃留節六七分若肺有火者加黃芩一錢甚者再加梔仁炒黑七八分如痰盛氣滯胸脅不快者加白芥子七八分如咳嗽遇秋冬即發者此寒包熱也但解其寒其熱自散宜用此方加麻黃去節七八分益陰去邪湯新治陰虛脈弱外感咳嗽或腎氣不足水泛為痰陳皮錢半半夏二錢茯苓錢半甘草一錢當歸二錢沙參二錢女貞子二錢熟地三錢山藥錢半生薑錢半水煎服如便不實者去當歸加白朮錢半如寒甚而嗽不止者加細辛四分如喘急者加麻黃七分但當加白芍一錢以防麻黃之重表也左歸飲治虛勞咳嗽金被火刑以壯水濟火為主庶肺清嗽止熟地三錢或七八錢山藥二錢枸杞錢半甘草炙一錢茯苓錢半棗皮一錢麥冬一二錢當歸二錢白芍錢半丹皮一錢水煎服或加生地一二錢如五心熱加元參錢半如腎熱骨蒸加地骨皮錢半即六味地黃丸亦妙右歸飲治陽虧於下以致脾困於中肺困於上而為喘促泄瀉畏寒脈弱咳嗽不已者但補其陽而嗽自止熟地三錢或七八錢山藥炒二錢棗皮一錢枸杞二錢甘草炙二錢杜仲薑製二錢肉桂一二錢附子制二三錢水煎服如血少腰膝軟痛者加當歸二錢即八味地黃丸亦妙清火寧肺湯新治水虧於下火爍肺金喉癢咳嗽尺脈滑數當歸二錢血虛有熱者用一錢白芍二錢青蒿一錢生地二錢麥冬二錢梔子炒一錢黃芩一錢甘草一錢水煎服如火盛煩躁加真龜膠二錢化服如腎虛精涸加熟地三五錢此清熱以存其水也逍遙散治暴得乾咳火鬱痰滯當歸白芍白朮茯苓甘草柴胡桔梗各錢半薄荷葉三分煨姜五分水煎服貝母丸治肺火乾咳久不愈者川貝母為末二兩蜜和丸細嚼服之用開水少許送下仰臥一刻如火甚者用上清火寧肺湯亦可杏仁丸治久嗽及老人咳嗽喘急不能睡臥服此立愈杏仁去皮尖炒胡桃肉去皮等分研為膏加煉蜜為丸如彈子大每服一丸細嚼薑湯下九仙散治一切咳嗽不已人參難辦者用沙參款冬花桔梗桑白皮阿膠貝母各一錢五味子烏梅肉各五分粟殼蜜炙二錢姜一片棗一枚水煎服若咳嗽未久者忌服罌粟丸治一切勞嗽如神粟殼新者一半去蒂焙陳者一半泡去筋膜炒各二兩為末蜜丸臨臥嚼服二錢即睡四七湯治七情氣鬱上逆為咳半夏二錢茯苓錢半厚朴姜炒一錢紫蘇葉八分生薑一錢紅棗二枚水煎服安腎丸治腎虛咳逆煩冤肉桂附子制各二錢巴戟去心白蒺藜炒去刺山藥茯苓肉蓯蓉酒浸去甲石斛去根萆薢白朮補骨脂各三兩桃仁八錢上為末蜜丸鹽湯下越婢加半夏湯治肺脹喘咳鼻扇肩抬麻黃八分石膏錢半生薑五分甘草五分半夏錢半大棗三枚水煎服紫金散治久嗽日夜不得眠南星去皮臍白礬甘草各一錢烏梅肉二兩上為細末於新瓦上炒紫再研每用二錢臥時以溫水加齏汁調服便仰臥藥入肺即嗽止得睡備採古來治嗽至簡至穩諸方於後以便取用痰咳嗽用蛤粉於瓦上炒紅入青黛少許麻油數點水調服氣實者痰嗽用荊瀝加薑汁氣虛者用竹瀝加薑汁內傷咳嗽用紫菀款冬花各一兩百部五錢為末每用三錢以姜三片烏梅一個煎湯調下痰嗽難臥用胡桃三個姜三片臥時嚼服少用開水吞下即臥濕痰嗽以半夏為主同南星白朮丸服熱痰同南星黃芩丸服肺熱同栝蔞仁丸服老痰浮水石丸服痰火者黃芩桔梗前胡麥冬兜鈴俱清肺除痰咳痰氣臭用射干以散熱貝母知母枇杷葉俱清肺消痰止嗽肺傷咳嗽紫菀煎服陰虛久咳用款冬百部未服或用款冬百合蜜丸服更妙咳甚用款冬花燒煙以筒吸之良痰咳咽喉不利用訶子含之咽津殊效二十四論喘促哮三證三證相似而實不同須清析方可調治喘者氣急聲高張口抬肩搖身擷肚惟呼出一息為快此肺經邪氣實也蓋肺主皮毛而居上焦故風寒犯之則氣道壅滯而為喘治宜散之破之促者即經之所謂短氣者也呼吸雖急而不能接續似喘而無聲亦不抬肩勞動則甚此腎經元氣虛也蓋腎為氣之根主精髓而在下焦若真陰虧損則精不化氣下不上交而為促治宜補之溫之哮者其病似喘但不如喘出氣之多而有呀呷之音呷者口開呀者口閉俱有聲音甚則隔壁亦聞以痰結喉間與氣相擊故出入有聲此由痰火鬱於內風寒束於外斯時用涼劑恐外寒難解用熱劑恐痰火易升推有散寒開痰理氣疏風尤以保扶元氣為主勿忘本根為善治也脈論喘脈宜浮遲不宜急疾右寸沉實而緊為肺感寒邪亦有六部俱伏者宜發散而熱退喘自止上氣喘息脈滑手足溫者生脈澀四肢寒者死上氣面浮腫脈浮大者危喘逆上氣脈數有熱不得臥者凶喘作於大病後者危兼泄瀉者死以下治氣喘加味二陳湯新治肺感風寒痰稠喘急脈浮緊者陳皮去白一錢半夏錢半茯苓二錢甘草一錢桔梗枳殼各錢半麻黃去節八分杏仁二十粒去皮尖桂枝一錢生薑汁合服華蓋散治肺風氣急上衝痰喘抬肩脈浮緩者麻黃去節蘇子杏仁去皮尖炒桑白皮炒赤茯苓去皮橘紅各一錢甘草五分生薑五分熱服大青龍湯治陽明火甚而寒包熱痰濃氣喘宜涼而兼散麻黃桂枝生薑各一錢杏仁十枚甘草五分石膏七八錢生搗碎或加半夏枳殼棗一枚水煎服如內熱微者去石膏加黃芩清金湯治肺熱喘急右寸脈洪者天冬麥冬各錢半杏仁十一粒去皮夾桑白皮蜜炙甘草山梔各一錢桔梗二錢溫服如痰滯加半夏錢半栝蔞仁去油一錢或加葶藶一錢白芥子八分加味白虎湯治實熱痰喘脈洪滑者石膏五錢生研知母二錢甘草一錢糯米一撮栝蔞仁去油一錢枳殼錢半黃芩一二錢越婢加半夏湯治肺脹痰喘眼目脹出鼻息鼓扇右寸脈浮而洪滑者麻黃去節一錢生石膏三五錢生薑五分甘草七分半夏錢半大棗二枚溫服直指神祕方治喘不得臥以腎主水臟水不能化臥則逆行上乘於肺肺得水而浮氣滯不得流通故喘也人參一錢無者以沙參三錢代之陳皮桔梗半夏紫蘇檳榔桑白皮各一錢甘草炙五分五味子十五粒姜三片食遠服此治水因氣滯者可也若水因氣虛者當補水中之火而水乃化須用下方金匱腎氣丸治脾肺陽虛右尺脈弱不能行水小便短澀以致水停心下而喘熟地四五錢再用砂仁末濃煎水於瓷器內炒乾茯苓二錢半淮藥棗皮各錢半丹皮澤瀉牛膝酒蒸車前去殼微炒各一錢附子制錢半肉桂二錢溫服如喘屬水而腹與腳微腫者當於腫脹門尋法治之腫退而喘自止矣以下治氣促大補真陰湯新治左尺脈弱肝腎真陰虧損氣自小腹衝上呼吸似喘而不能接續此宜滋陰救根以接真氣可也或病久之後及體弱腎虧婦人産後亡血過多則榮氣暴竭孤陽無依而為促者此剝極之候若誤用消痰散氣之劑危矣當歸二三錢血虛有寒者宜多用血虛有熱者宜少用熟地四五錢或再重用甘草炙一二錢山藥杜仲枸杞女貞子各二錢牛膝酒炒一錢棗皮錢半空心多服若非大劑不得到腎如虛火上炎宜用純陰之品本方去枸杞加龜板膠用蛤粉炒成珠二錢麥冬錢半如火爍肺金兼咳者加百合二錢如夜熱骨蒸加地骨皮錢半如臟平無火加骨脂鹽炒一錢此方治內傷陰虛火燥者亦效補陰益陽湯新治右尺脈弱命門真陽虧損以致腎不化氣上衝似喘宜於水中補火則火歸源而肺亦寧氣自調矣熟地四錢山藥炒二錢棗皮錢半枸杞二錢肉桂錢半附子制錢半沉香一錢空心服如火衰不能生土嘔噦泄瀉者加炮乾薑一錢或加肉豆蔻一錢六君子湯治脾肺脈虛不能運痰以致氣促似喘人參無者山藥炒黃三四錢代之白朮二錢茯苓錢半甘草炙一錢陳皮去白一錢半夏二錢生薑五分紅棗二枚溫服如肺熱兼咳者加麥冬一錢如痰易來滿口吐者是火不能生土也加炮乾薑一錢或再加附子肉桂以上二證喘實而促虛也喘之實者以邪在肺非風寒則火邪耳治風寒宜溫散治火邪宜清涼而脈必滑數有力以氣盛而有邪也若氣虛無邪之脈必微弱無神或有外見浮洪而稍按即無者此無根之脈也或有往來弦數全無和緩者此胃氣之敗也俱為大虛之候但脈之微弱者其真虛易見而脈之浮空弦搏者其假實難辨然而輕重之分即此可察矣蓋其微弱者猶順而易治浮空者最險而多變若弦強之甚則真臟已見不可為也凡屬脈理於此可悟以下治哮證黃芩半夏湯治寒包熱而發為哮病呼吸有聲日夜不安者黃芩酒炒半夏各二錢桔梗枳殼各錢半紫蘇麻黃去節甘草各一錢杏仁十五粒去皮尖生薑紅棗引如天寒加桂枝定喘湯治肺有風痰而哮者他皆不用白果七粒去殼切碎炒黃麻黃半夏款冬花各一錢桑白皮蜜炙蘇子各七分杏仁去皮尖甘草黃芩各八分徐徐服蘇陳九寶湯治老幼素有哮病遇寒即發日夜不得臥者麻黃紫蘇薄荷桂枝桑白皮大腹皮陳皮杏仁甘草各八分生薑五分烏梅一個煎服抑上補下方新治哮喘痰盛兩尺獨大而軟為上盛下虛用八味地黃丸一兩以桔梗三錢枳殼二錢甘草一錢半夏錢半煎湯送下數服自安若左尺脈弱只用六味地黃丸平治湯新治痰火內郁風寒外束氣急有聲坐臥不寧枳殼錢半桔梗二錢防風茯苓各錢半栝蔞仁去油一錢紫蘇子微炒研八分白者不效甘草一錢杏仁去皮尖七分半夏錢半如冬月加麻黃夏月加石膏挾寒者多用生薑汁加味八味湯治病後痘後忽聲如拽鋸寸脈強兩尺無力者熟地四錢山藥棗皮茯苓各錢半丹皮一錢澤瀉八分附子肉桂各錢半牛膝一錢五味子十五粒早晚各一服凡哮證必有夙根遇寒即發未發時以扶正氣為主既發時以攻邪氣為急扶正氣者須辨陰陽陰虛者補其陰如六味八味之類陽虛者補其陽如六君補中之類或早夜補陰中時補陽須多服為妙攻邪者宜分微甚或散其風或溫其寒或清其痰火治法載上當揀而用之然數發者氣無不虛宜於消散中酌加溫補不得攻之太過必使元氣漸充庶得全愈備採古來治喘促哮證至簡至穩神方於後以便取用積年哮喘體實者用蘿蔔子一合研碎水煎服神效痰喘難臥半夏二錢炙甘草皂角炙黃各錢半生薑一錢水煎服感寒痰喘麻黃留節杏仁連皮生甘草各錢半生薑五分煎服氣喘難臥用皂角炙研蜜丸每服一丸若系風痰同半夏煎服寒痰氣喘用青皮夾巴豆一粒燒研薑汁酒調服即止老人氣喘用萊蔔子蜜丸服若痰盛同皂角燒研蜜丸服腎氣上衝脅痛喘急用小茴香研末酒調服火鬱喘咳用知母杏仁煎服若肺熱喘急用絲茅根煎服虛促氣急用阿膠炒珠三錢五味三分煎服虛寒喘咳用胡桃生薑嚼服老人喘嗽用胡桃杏仁生薑等分蜜丸服風寒喘急用麻黃風濕喘逆用羌活散寒利肺用紫蘇橘皮氣喘痰壅用款冬花蘇子用紫者效消痰定喘葶藶治肺滯氣喘如天冬麥冬黃芩沙參前胡俱治火鬱氣喘水停喘急小便不利用甘遂大戟末服二十五論腫脹有風熱水濕氣血虛積八種腫脹之病皆由中而形於外者有氣與水之分也使見之不確必治之有誤氣脹者其色蒼其內堅或連胸腹而無界限隨按隨起氣速易平如鼓皮焉或倏而浮腫者陽性自速也或自上而始者陽本乎上也或通身盡腫者氣無不至也然有寒熱虛實之辨大都陽證多熱屬實陰證多寒屬虛先脹於內而後及於外者多實先脹於外而後及於內或外脹而內不甚脹者多虛脈滑有力者多實浮弦微細者多虛兼察乎形色老少與夫二便氣力自昭然矣夫氣何以病也其病在肺其源在脾其賊在肝木若安位不至剋土則脾司運化能使心肺之陽下降肝腎之陰上升而成天地之交泰是為平人然又有七情內傷六淫外感飲食失節房勞致虛脾土之陰受傷運化之官失職胃雖受谷不能運化清濁相混鬱而為熱熱留為濕濕熱相生遂成脹滿本無形之氣為病難作有形之症以治醫者宜補其脾又須制火養肺金旺制木使脾無賊邪之害則運化行而水穀消矣又看所挾而兼用藥挾氣則散氣挾血則破血挾寒則溫寒挾熱則清熱挾水則利水挾風則祛風自無不愈水腫者其色明潤其皮光薄其腫不速腫有分界陰本乎下其浸漬自下漸上陰中無陽也按之窅而不起以水在肉中如糟如泥按而散之猝不能聚也其病為脾肺腎三臟相干之症蓋水為至陰其本在腎水化於氣其標在肺水惟畏土其制在脾今肺虛則氣不化精而化水脾虛則土不制水而反克腎腎虛則水無所主而妄行水不歸經則逆而上泛故傳於脾而肌肉浮腫傳於肺則氣息喘急雖三臟備有所幹而其本則在腎內經曰腎為胃關關門不利故聚水而從其類也夫關門何以不利以陰中無火是無陽也故氣不化水道不通溢而為腫治者惟補命門之火使下焦之真氣得行始能傳化滋腎中之水使下焦之真水得位始能分清故惟薛立齊金匿腎氣湯無有出其右者矣腎為先天生氣之源峻補命門則元氣復而後天胃氣生之有本土旺能生金且水安火息肺氣舒矣是方實三經悉顧者也後人用之必須重劑始能注下或湯藥不順為丸服之但桂附須重勿拘古方分量相體而裁之乃為善用脈候大堅以澀邪盛則大邪實則堅澀者血氣虛也大者陰氣必衰堅者胃氣必損兼之澀所以病脹盛而緊遲而滑皆力氣脹浮而遲沉而滑弦而緊皆為水腫二病之脈實大者可治虛微者難治死證腹脹身熱者死腹脹寒熱如瘧者死腹大脹四肢清脫者為逆腹脹便血脈時絶者死以上氣脹唇黑或腫肝傷缺盆平心傷臍突脾傷足心平腎傷背平肺傷五傷者死陰囊及莖腫腐者死瀉後腹脹而有青筋者死大便滑泄水腫不消者死水腫先起於腹而後散於四肢者可治先起於四肢而後歸於腹者死以下治氣脹方廓清飲治氣滯脹滿在年壯氣實者可用枳殼二錢厚朴錢半大腹皮錢半白芥子一錢茯苓連皮二三錢蘿蔔子生搗一錢如中不甚脹能食者不必用澤瀉錢半陳皮一錢水煎服如內熱小便赤者加梔子木通各錢半如身黃小水不利者加梔子茵陳各錢半如小腹脹大便堅實不通者加生大黃三五錢如肝滯脅痛加青皮氣滯胸腹痛加烏藥香附食積者加山楂麥芽身體沉重屬濕者加蒼朮如再不下用大黃枳實芒硝此必脈實年壯素無虛損而暴見脹滿者方可峻攻此下則脹已之一法也否則只宜緩治破氣消滯治氣實於中而表裡俱脹者用大蒜以滾水煮微熟留性少蘸鹽醋以佐食大能消脹亦佳法也四苓散治氣脹小水不利茯苓白朮豬苓各一兩澤瀉一兩四錢共為末以半熟大蒜搗膏為丸服極妙四磨飲治氣脹而喘沉香烏藥枳實檳榔四味用開水磨服或加木香加味理中湯新治脾胃虛寒氣脹便泄惡食惡寒等證人參白朮二錢或五六錢扁豆炒研二錢陳皮一錢乾薑炒一二錢甘草炙一錢當歸一二錢滑泄者土炒木香四分白豆蔻去殼炒一錢茯苓一二錢白芥子炒研八分水煎溫服有鼓脹者外堅內空又或氣血結聚久而生蟲為蠱脹者且肢體無恙脹惟在腹又名單腹脹者此脾虛不能運化正氣不行清濁莫分乃成此證治者察其病由中焦則以脾胃為主參耆白朮乾薑甘草之屬主之或病由下焦則當以命門母氣為主熟地當歸山藥附子肉桂之屬主之如氣滯者少佐辛香如陳皮厚朴砂仁香附丁香白芥子之屬如兼有濕而小水不利者宜佐以豬苓澤瀉之屬以上諸法大略如此惟病成單鼓者終非吉兆凡病氣脹者若察其病系食停氣滯血逆濕熱等證即因證而治之或升降其氣或消導其邪此皆治實之法也但恐實者少而虛者多若在中年之後及素多勞傷或脈弱便泄或身倦色悴是皆虛損之證當以培補為急若脾肺虛者宜四君子湯歸脾湯脾虛兼寒者理中湯脾虛兼痰者六君子湯腎虛而火不足金匱腎氣湯設以虛證而妄行消伐百不活一矣以下治水腫方金匱腎氣丸此治水腫之聖方水虧則浮泛六味以補腎土虛不能治水桂附補火以益脾土金虛自氣不化脾旺足以養肺水足則火息可以保肺水腫原系脾肺腎三經之病此方兼治最妙大懷慶地黃八兩用元砂仁四錢微炒研末同酒九蒸九曬忌鐵白茯苓六兩留皮山茱萸四兩去核酒蒸淮山藥四兩牛膝二兩五錢酒炒車前子二兩去殼微炒粉丹皮二兩酒浸曬建澤瀉二兩淡鹽水浸曬上肉桂三兩去粗皮附子制三兩上為末先將地黃棗皮杵化後加藥末煉蜜搗勻為丸梧桐子大每服七八十丸空心白開水下忌鐵與三白若病急改丸為湯須重劑方可利水滲濕湯新治水腫從腳而上六脈細而遲小便短少腳膝疼痛蒼朮二錢黃柏錢半川牛膝二錢赤茯苓淮木通建澤瀉漢防己各一錢二分車前子去殼一錢豬苓錢半水煎服余友水腫皮破用此一服夜間小便遂多以宿水從小便出也來日腫消一半再服四劑全愈如服此而小便不清不長是濕滯膀胱入水之路加萆薢五錢自效有素稟陽旺三焦多火而水腫者必脈實便燥煩渴喜冷目赤喘嗽等證宜六味地黃湯不宜熟地者改用生地加麥冬牛膝車前之類大劑與之氣滯者佐以陳皮白芥子之類必須多服方可有效凡水腫宜補脾腎有不能受補者大危之候必百計以救根本或溫補於前分消於後或以補為主而佐以分消且溫補所以化氣病愈而不反也大補陰湯新治腎中水火大虧服腎氣丸不效者以藥味雜有非補者不如用此純補之劑可以挽回而腫自消也熟地一兩或五錢附子三錢肉桂三錢白朮二錢半當歸三錢茯苓一錢人參二錢乾薑炒一錢甘草炙一錢大劑與之必須多服方得有效若難辦參者亦照方服但力輕效緩五皮散治身腫煩渴小便赤大便結此屬陽水脈必沉數大腹皮陳皮生薑皮桑白皮赤茯苓皮等分水煎服實脾散治身腫不渴大便溏小便少不赤此屬陰水脈必沉遲大凡水腫之脈多沉在數與遲分陽水陰水也附子制錢半乾薑炮一錢厚朴姜炒一錢木香七分大腹皮二錢草蔻仁木瓜各錢半甘草八分姜三片棗二枚水煎服大凡水腫邪氣有餘證實脈實或者下之若證虛脈虛只宜補土為主看所挾加之若用去水之藥大下之劑則脾氣愈虛去死不遠病者醫者宜知之備揀古來治腫脹至簡至穩神方於後以便取用水腫用鯉魚煮汁或用烏魚亦妙和冬瓜蔥白作羹食之陰囊腫痛用連根蔥白頭二十一根不必水洗川椒一兩麥芽炒一兩地膚子一兩共煎湯淋洗日三度氣虛水腫用大蒜煮半熟入蛤粉搗為丸食前白湯下二十丸小便下數桶而愈隨服補脾藥水氣腫滿用大蒜田螺車前子等分熬膏攤貼臍上水從小便而下二便不利下焦濕腫用漢防己五錢茯苓二錢煎服身腫尿短用葶藶為末棗肉丸服鼓脹喘急用沙參白朮甘草牽牛為末水調服肺濕腫喘馬兜鈴煎服水腫用烏魚同白朮茯苓橘皮姜皮煮食大效蠱脹在上升麻吐之在腹鬱金下之合二物服之不吐則下氣脹氣蠱用蘿蔔子以水研汁浸砂仁一兩炒乾如是者七次為末每米湯下一錢水蠱脹滿用黑白牽牛末各二錢麥面四兩炒熟作餅食水腫用甘遂末二錢以雄豬腰子一枚切作七片入末濕紙包煨令熟每日食二片至五片當覺腹鳴小便利是其效也水腫以甘遂末一兩水調塗腹繞臍內服甘草湯其腫便消二物相反而感應如神水腫腹脹用赤商陸二兩入麝三分搗貼臍水便利則腫消又方蒼朮一斤黃酒面曲三兩青礬八兩醋拌入缶火煅為末醋糊丸酒下名伐木丸陽水暴腫面赤煩躁喘急尿短而澀用甜葶藶炒二兩熬膏漢防己末二兩以緑頭鴨血同頭搗為丸木通煎湯下七十丸日三服或加豬苓一兩其效如神凡腫屬脾脹屬肝腫則陽氣猶行如單脹而不腫者名蠱脹為木橫剋土難治腫脹由心腹而散四肢者吉四肢而入心腹者凶男自下而上女自上而下皆難治二十六論失血有陽乘陰者血熱妄行也陰乘陽者血不歸經也嘔血出於肝吐血出於胃咳血出於肺咯血出於腎失血一證五臟皆致之得其源而治自易若一失治則連綿不已虛損便成勞瘵愈之難矣蓋血即水也腎主水水化為液為痰為唾為血皆屬陰也失血之久則陰虛陰虛自必相火上炎則咳嗽骨蒸咽乾氣喘體瘦聲喑百症出焉醫者施以寒涼雖或暫止而復來血得涼而凝滯不惟血不歸經而且陽氣由是衰矣血者陰也氣者陽也經曰無陽則陰無以生無陰則陽無以化原系交重人知以陽生陰乃為正本之治丹溪有言實火可瀉虛火可補勞證之火虛乎實乎瀉之可乎矯其偏者輒以桂附為主此為火衰者宜之以桂附入於滋陰丸內則可即配水藥亦宜酌量若血虛燥熱之人能無助火為害哉以血本陰精不宜動也血主榮氣不宜損也動者多由於火火盛則逼血妄行損者多由於氣氣傷則血無以存人有以七情而動火傷氣者以勞倦色欲而動火傷陰者然此火宜導之以歸源若只用苦寒則反激逆上且傷胃氣而脾亦壞其何以得脾之職先主生血而後主統血乎治此證者五臟六腑雖有兼及而要必以脾腎二經為主水為萬物之元土為萬物之母二臟安和百病不生以脾安能生肺金金是水源金旺而水亦旺矣腎兼水火腎安則水不上泛而為痰火能生土而健脾而食亦益矣但補腎理脾法難兼致方欲以甘寒補腎其人減食又恐不利於脾方欲以辛溫快脾其人陰傷又恐愈燥其腎此際難以措手余因是而分服之早夜服滋陰之劑以清肺熱中時服補脾之藥以益健運其中當重當輕因脈因證而權衡之腎虧甚者其重在腎而補脾者亦不可少脾虛甚者其重在脾而補腎者照常用之每日交進活人多矣嘗見勞證之死多死於泄瀉泄瀉之因多因於寒涼使不知脾之當補於先時及至脾敗瀉作此際雖有妙劑亦何益哉滋陰湯新治肝腎虛弱不時失血背痛咽乾咳嗽便短倦怠遺精等證早夜服熟地二錢淮藥一錢五分麥冬去心微炒八分當歸酒洗去尾一錢三分白芍酒炒一錢甘草炙六分阿膠蛤粉炒一錢茯苓一錢杜仲淡鹽水炒一錢丹參一錢三分分量稱足水煎服咽乾而五心熱者加元參一錢二分骨蒸多汗者加地骨皮一錢三分血熱妄動者加生地一錢五分青蒿一錢陰虛不寧者加女貞子一錢五分咳嗽有痰者加款冬花一錢川貝母微炒研末一錢血來盛者童便一杯藕節汁或絲茅根汁合服服之而順可以多服但中時必須服下方以佐之溫脾湯新此平補脾胃之藥也與上方每日同用上方早夜服此方中時服服此者一則不畏上方陰藥以滯胃二則脾健而飲食亦加有是病者可無慮也若服之而順可照分量加至十倍八倍研細末中時加白糖開水調服服後須睡一刻淮山藥炒一錢八分白茯苓一錢二分白朮制一錢或再加薏苡仁炒研二錢芡實炒研二錢白扁豆炒研二錢桔梗八分元砂仁去皮炒研五分甘草炙八分神麯炒四分白蓮肉炒研二錢秫米炒研一錢紅棗去核二枚水煎服若氣滿者加陳皮去白一錢或再加真蘇子炒研五分或用廣香磨汁合服若有冷涎及胃口寒者加乾薑炒黃三五分即加肉桂亦妙加味地黃丸新治陰虛失血胸背痛小便赤遺精潮熱咳嗽氣喘等症此平補肝腎養肺清熱之方凡一切虛弱之人每年夏季制服一單可以扶體免陰虛火炎之病但須日中間服上溫脾湯更妙懷慶元支地黃八兩加元砂仁微炒三錢研末與米酒同蒸同曬九次勿少淮山藥四兩棗皮三兩去核酒蒸若精滑者可加至四五兩白茯苓去皮四兩粉丹皮一兩七錢若血虛有熱者可加至二兩四五錢建澤瀉淡鹽水浸曬一兩三四錢小便短者用一兩八錢甘枸杞去梗三兩酒蒸菟絲子淘淨泥砂三兩酒浸蒸曬乾真阿膠蛤粉炒成珠三兩麥冬去心酒蒸二兩杜仲淡鹽水炒斷絲三兩北五味微炒七八錢先將地黃棗皮枸杞麥冬於石臼內搗成膏然後將余藥磨成細末合前膏加煉蜜搗勻為丸每晨用淡鹽水服七八錢忌鐵與三白歸脾湯凡治血症須按三經用藥以心主血脾統血肝藏血此方三經之主也遠志味辛多用亦能走血棗仁補肝以生心火茯神龍眼補心以生脾土參耆朮草補脾以固肺氣土患燥當歸以潤之土患滯廣香以疏之總欲使血歸於脾也彼鬱怒思慮傷脾者尤宜火旺者加山梔丹皮火衰者加丹皮肉桂晨服八味丸以培先天之根治無餘法矣方見痰飲清寧膏潤肺不傷脾補脾不礙肺凡勞嗽吐血常服極效麥冬去心生地酒炒各五兩廣橘紅兩半龍眼肉四兩枯梗甘草各一兩煎成膏加苡仁炒四兩研末川貝母糯米拌炒米熟去米一兩研末再煎退火下真蘇州薄荷淨葉研末三錢於內攪勻時時置口中含化凡虛損咳嗽五臟皆有所病然專主則在肺腎蓋肺之所畏者火也肺之受邪者燥也燥則必癢癢則必咳正以腎水不能制火所以剋金陰精不能化氣所以病燥故為咳嗽喘促咽痛聲啞等症凡治此者只宜甘涼之劑如六味地黃丸料煎服緩則服丸甚者加麥冬元參天冬生地之類滋養金水使肺腎相生則真陰生而咳可漸愈矣凡陰虛於下陽格於上六脈無神而大吐大衄者此火不歸源而真陽失守者宜八味地黃丸料重加桂附大劑煎出冰冷與服或用熟地一兩五錢當歸三錢附子三錢肉桂二錢煎出冷服若六脈細脫手足厥冷危在頃刻用鎮陰煎熟地一二兩淮牛膝二錢炙甘草一錢肉桂錢半附子二錢或三錢如嘔惡者加乾薑炒黃一錢三分如氣脫無神宜速速多加人參水煎冷服此際用一味涼藥即死論脈脈芤者為血虛沉遲而小者為氣脫大而無力者為陽虛數而無力者為陰虛大而芤者為血脫左尺軟為血虛右尺微為火衰右關沉細或鼓燥為胃虛然無論浮沉大小但久按而漸緩者為吉若平者病亦平急進者病益進若弦細而兼緊數者不治凡五勞者五臟之勞皆因用力過度也如憂愁思慮則心傷不眠恍惚血不養心神不能藏也暴怒持重則肝傷筋急痠痛水虧木燥肝失所資也飲食勞倦或意外過慮則脾傷吐痰嘔水此水泛為痰脾虛不能制水也受風飲冷則肺傷喘急咳嗽肺氣不得清肅也宜因脈以驗症若外因而暫病者脈實邪盛宜從標治病去即止脈虛體弱宜從本治不得概視至於酷欲則精血耗損心腎自傷蓋心主血腎主精心本熱虛則寒腎本寒虛則熱故水虧者以重濁補陰勿使火上炎也精虧而元陽亦衰故議補陰以陽為主溫則可以發揚腎氣則陰陽交蒸而精生彼四物知柏秋殺之物其何以舒和而發生乎雖然貴審其陽虛陰虛其輕重若何而濟之以配水配火權其輕重救其偏而使之平則無弊矣但藥能治病補虛不能移情易性而且虛陽火燥常欲交接草木之補不償真精之喪有是病者宜別居一室日無所見夜無所觸房欲絶而元神固且又節飲食戒惱怒遠憂慮而能自為調理庶醫藥有功也若聲啞咽痛泄瀉肉脫多吐痰沫汗出食少一邊難睡脈細而弦數或浮洪而大難為力矣張三錫曰勞傷於肺者難治蓋肺中藥餌難及滋陰清肺在肺難見其功於脾易增其病耳凡精氣久已衰微欲使水中之火溫胃而滋化源惟有緩以圖之不宜於助陽亦不宜於抑陽蓋助陽必至亡陰抑陽必至純陰純陰之劑與胃不相宜而助陽之藥能扶胃氣食加神旺未有不喜但久之陽愈盛而陰愈燥故於陰虛者助陽抑陽酌劑而得其平斯為上工凡相火附於命門男以藏精女以系胞因嗜欲竭之火無所歸厥逆上炎故一切假熱之症悉形於外脈洪大無倫按之微弱者急用八味丸料半斤加肉桂一兩附子七錢水煎五六碗冰冷與飲諸症自退來日必畏寒脫脈真候自現矣宜十全大補湯吞八味丸或照前服亦可若在産後及大失血後必大發熱亦系陰虛此正氣血之虛若以涼藥正治立斃惟速補無形之氣以生有形之血則陽生陰長之妙用也須用參一兩煎湯服之參少無力改用當歸補血湯當歸三錢黃耆一兩重蜜炙黃煎服亦或有效若用四物湯則純陰不可為治也凡氣虛血虛何以辨之蓋陰虛者面必赤口渴而畏冷水左尺脈虛數是無根之火載於上也若是陽虛火入於內面必不赤口即渴而舌必滑脈雖數而尺無力此為辨耳若曾服涼藥脈反有力而數者是火鬱於中逼陽於外假有力也宜升宜補投以寒涼必死毫釐之差枉人性命慎哉凡人但知氣有餘即是火不知火之餘即是氣或為喘滿或為煩悶有餘者病氣也病氣之有餘正氣之不足出凡滋陰即所以降火非滋陰之外又降火也蓋二尺水火互相生化左尺脈虛弱而細數者是左腎真陰不足用六味丸右尺脈遲軟或沉細而數欲絶或浮大而空虛無神者是命門相火不足用八味丸至於兩尺微弱是陰陽俱虛用十補丸此皆滋其先天之本源實萬世無窮之利乃世之補陰者率用四物知柏反收戕脾胃多致不起能無遺憾於世哉固本十補丸治腎元不足脾胃虛弱水火俱衰之證熟地八兩棗皮五兩酒蒸曬乾炒淮山藥五兩炒白茯苓四兩人乳拌曬乾炒淮牛膝三兩酒拌曬乾炒精滑者不用北五味一兩二錢打扁蜜酒拌蒸曬炒附子制一兩五錢或加至二兩上肉桂一兩五錢去粗皮不見火或多用鹿茸一具切小片酥拌炒黃厚杜仲三兩鹽水拌透曬乾炒共為細末用熟地搗爛入藥加煉蜜杵好為丸每早淡鹽水服五六錢凡虛損兩顴赤或唇紅者陰虛於下逼陽於上也虛而多渴者腎水不足引水自救也聲出於喉而根於腎其喑唾而聲不出者此腎虛也喉乾咽痛者水虧而相火上浮也喘急者陰虛肺格氣無所歸也煩躁者陽中無陰也多怒而筋急者水虧木燥肝失所資也飲食不甘肌肉漸消者脾虛而敗也心跳而怔忡者氣不歸精也經曰胃之大格名曰虛里出於左乳下共動應衣宗氣泄也盜汗者有火則陰不能守無火則陽不能固也多痰多沫吐清水者此水泛為痰脾虛不能制火也腎主骨骨痛者真陰竭也腰脅痛者肝腎虛也膝以下冷者命火衰不歸源也小水黃澀淋瀝者真陰虧竭氣不化水也足心熱甚者虛火爍陰湧泉涸也以上諸症勞瘵常有逐一指出以便探本而治弗至誤認凡陰虛者多熱以水不濟火也治宜甘涼大忌辛溫如乾薑桂附故紙白朮半夏之類不可輕用即如參耆枸杞當歸杜仲之屬皆陰中有陽亦當酌宜用之蓋恐陽旺則陰愈消熱增則水益涸耳然又忌寒涼之藥不能資補也彼有火之盛者固不得不從清涼亦當兼壯水之劑相機間用可止則止以防其敗清熱保金湯新治陰虛火炎咳嗽吐衄煩渴多熱脈與症俱有火生地二錢熟地三錢麥冬錢半白芍錢半百合二錢元參二錢桔梗一錢茯苓一錢五分甘草一錢沙參二錢水煎服如盜汗加地骨皮一二錢血來加阿膠二錢童便一杯血虛熱盛加青蒿二錢多汗不寧加棗仁錢半乾咳便燥加天冬二錢如火載血上行者去甘草加炒梔子錢半此方不宜多服適可而止凡血脫之盛者氣亦隨之因而昏憒者速宜益氣以固生機用拯陽湯新黃耆蜜炙一兩白朮三錢附子二三錢乾薑炒黃錢半甘草炙一錢熟地一兩當歸身三錢水煎溫服如瀉泄去當歸加烏梅二枚此方加參更妙切忌涼藥凡人因陰虛火旺過服寒涼致壞脾胃救之者必本於陽氣蓋氣主煦之氣為陽主上升虛則下陷當升而舉補中益氣湯是也但無參則升麻柴胡輕浮而且有害即黃耆加至一兩亦覺平常權宜用之可也凡陰虛火旺子午潮熱咳嗽夜甚咽痛便黃而短久莫得愈用六味地黃丸加阿膠龜版膠各二兩上桂一兩七八錢丸服但藥料要道地龜膠要盡版熬者方效備揀古來治失血至簡至穩神方於後以便取用勞嗽吐血淨款冬花百合蒸熟焙乾各三兩為末蜜丸龍眼大臨臥淡薑湯化服一丸吐血衄血生荷葉生艾葉側柏葉生地黃等分搗為丸雞子大每一丸水煎去滓服吐血不止白芨末三錢米飲下試血法吐於水碗中浮者肺血也沉者肝血也半浮半沉者心血也如系肺血以羊肺煮熟蘸白芨末食之心血用羊心肝血用羊肝為引吐血晚桑葉焙研茶服三錢吐血衄血宜用竹茹以清肺熱涼胃故也吐血藕節煎湯調白芨末服凡衄血亦服上下諸竅出血用發灰二錢水調日三服吐血衄血白紙灰水調服金墨磨汁服百草霜研水服並吹鼻童便少加薑汁服吐血下血用生藕卜搗汁磨墨下咽即止
