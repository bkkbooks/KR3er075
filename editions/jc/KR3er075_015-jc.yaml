body:
  text: 卷十五婦科下胎產門五十四胎產神法文略五十五弄胎試胎胎至八九個月間忽然胎動腹痛三兩日前或痛或止即胎水已下而腰不甚痛脈未離經離經之脈一呼一吸或五六至此非產也名曰弄胎或一月前或半月前忽然腹痛如欲產而不產者名曰試胎亦非產也但當寬心候時不得誤認五十六產聽自然生產本造化自然之理原非難事原非險事試觀草木鳥獸初未有艱難者何獨至於人而異之況人為萬物之靈其玲瓏尋路而出當必有十倍於百物者矣然而世亦有生產而危者其故何也蓋由自己致之而穩婆亦不能無其責也何以言之如婦腹痛兒方破胞而出自無主見而穩婆又催云快著力快逼氣則兒直下而逆生矣兒方轉身又著力又逼氣則兒橫下而手出矣兒之搏身未正又著力又逼氣則兒不偏左即偏右抵住頭而不得下矣若聽其自然或遲至一日二日即三五日無妨安心定氣要坐則坐耍行則行耍睡則睡勉強忍痛進其飲食以保養精神為第一莫聽穩婆逼迫莫聽傍人言諸或速或慢自有時候而自己亦要思生產人之常事勿求速於離身總不著力不逼氣自無有逆生橫生之禍也再看百物生產時不知著力不知逼氣便物物好子母安何反人之不如物乎婦人或不能知前輩一一講明為妙五十七難產源流共九條凡將產最戒曲身側臥腹痛時宜強為站立若稍緩便散步行動或憑几立庶兒得以舒展尋路倘曲腰則身難轉側臥則門遮閉再轉再閉則子必無力自至難產當產時痛如未痛行立坐臥令人莫知痛極轉熱百節松活一刻即產胞衣隨下何嘗有難產者乎凡生產以氣為主以血為輔氣行則血行氣滯則血滯富貴之家惟恐勞動怠惰自安所以氣滯而血亦滯胎不轉移以致難產即如貧家之人勤動勞苦生育甚易非明徵乎凡產育之時氣以行之血以濡之然後子宮滑溜猶之魚必得水而後行也胞漿未下但只候時若胞漿破後一二時辰不生必其胎元無力或體素虛弱或時當中年或生育煩多或遇病後氣血不足愈遲則漿必愈干力必愈之此際惟有大補氣血正是催生妙藥多多益善更須以母雞煮湯加粳米作稀粥與食不得多食肉食由是氣血充暢精力健旺不期下而自下矣倘不知此而妄用行氣重墜之物多致血虧氣陷反為大害生產有遲緩而不下者舉家憂疑使產婦驚恐憂慮蓋驚則神散憂則氣結產亦艱難人當明其時候未至惟寬心以候之不必倉皇以自誤也古者婦人有孕即居側室不共夫寢以淫欲最所當忌蓋情欲一動氣血隨耗火擾於中血氣沸騰三月前犯之則胎動小產三月後犯之不惟胞衣厚而難破而且子夭而多痘毒疾厄試觀物類一受胎後牝牡絕不與交所以胎產俱易而人則不能禁絕以致多有艱難之事胎之肥瘦氣通於母母之所嗜即胎之所養也如恣食厚味不知節減故致胎肥而難產常見糟糠之婦易產可知冬月天冷產婦經血得冷則凝致兒不能下此害最深務令下部衣裙宜厚滿房有火令產婦向火臍下腿膝間暖則血行兒易生也盛夏天熱不可衝風取涼以犯外邪又不宜熱甚致令煩渴血最房中宜灑涼水產婦或可少與涼水暫以解熱自必易產臨產時凡喪服穢濁人莫令入房惟老成解事曾經生長者一二人足矣俗忌多一人入房則多一時遲延五十八穩婆凡產時之用穩婆原欲扶持產婦及兒產接生原非可以催生者而亦有無良之人一進屋時有多少科派一近產婦有多少做作揉之奪之使之努力不知時候未至用力罔然且有逆生橫產之禍又有故為哼訝之聲或輕事重報以顯己能以圖酬謝因致產婦驚疑害尤非小所以凡用穩婆必先擇老成忠厚者預為囑之及至臨盆務令從容鎮靜不得用法催逼更有穩婆害人者私以手指掐破水衣極要關防思欲急完此家恐有他家邀者極誤大事五十九產候夫腎繫於腰胞系於腎所以產時必痛極連腰產婦手中指本節跳動眼中如火穀道迸急胞水或血俱下脈見離經或沉細而滑此是當生時候待兒頭已至產門的的確確可以用力送出否則惟有靜待即遲些亦不妨事如數候未至切不可性急亂事六十進飲食戒喧鬧凡將產時須進飲食戒喧鬧蓋進飲食宜母雞汁煮粳米稀粥則氣充膽壯免至飢渴之力或臨產時大慌小亂閒雜人往來交頭接耳言三語四孕婦恐怖以致難產嗣後但令一二慣熟穩婆囑令在房扶持平素所用催生術法毫不可用又要知不用他法恐防喪心貽害此事亦有不可不知備揀生產良方佛手散亦名芎歸湯治妊婦腹痛將生或先期依方多服自無產厄川芎二錢大而里白亦名真芎此川產也小者名撫芎系江南產者非是當歸用身五錢水煎頻服若難產或三五日不下垂死者加男女生髮一握燒灰存性龜殼一個酒炙黃二味研末前藥煎就下末三錢調服達生散治妊娠臨月服十劑則易產或稍加砂仁枳殼人參白朮當歸各錢半白芍酒炒陳皮紫蘇炙草各一錢大腹皮酒洗曬乾錢半水煎服若無參加蜜耆一兩加減八珍湯治漿水來多胎幹不得下肢體倦怠人參白朮三錢茯苓錢半炙草一錢當歸三錢白芍錢半酒炒熟地三錢黃耆蜜炒五七錢肉桂一錢乾薑炒黃八分牛膝二錢紅花三分益母草一兩薑棗引次煎濃蔥湯令穩婆洗產戶使氣上下通腸更用菜油滑石塗產戶大補榮衛湯治氣血虛弱或胞漿下而不生者乾枯所致人參隨便黃耆蜜炒三兩當歸去尾二兩川芎三四錢益母章用赤花者一兩濃煎湯頻頻服之如無參加附子一錢以助藥力滑胎煎治胎氣臨月宜常服數劑以便易生當歸三五錢川芎七分杜仲鹽水炒二錢熟地三錢枳殼七分山藥二錢白朮益母草各錢半或加連根蔥白為引脫花煎治臨盆不下或產難經日服此催生最佳當歸七錢肉桂八分川芎牛膝各二錢車前子錢半熱服或加紅花三分或加滑石末二錢催生保產萬全湯以補氣血為主而佐以溫中散瘀下降之品則力能健運此不催之催也人參隨便當歸身去尾三錢川芎一錢桃仁十三粒不去皮乾薑炒焦錢半甘草炙六分牛膝梢二錢紅花酒炒三分肉桂去皮七分棗引水煎溫服六十一論生產凶證共七條妊婦生育依前方論自無凶險之證間有氣血不足未曾調補於先臨事無主或者錯誤在後古聖垂法救人須當明析胸中乃能備用而有濟於人也其證之凶因坐草太早或胞漿雖破兒身未轉或轉未正被母努力一逼以致足先來者謂之逆產手先來者謂之橫產或漏其肩與耳與額者謂之側產或被臍帶纏絆不得下者謂之礙產此外又有盤腸生及死胎停衣諸證能一一救之乃為胞與天下之仁者也逆產者兒方破胞而出被母努力一逼所以直下或者氣血不足兒無力轉身亦或有之此際兒直下不少停留宜穩婆即時掄出以救其母若腳出而不即下宜令產母仰臥定心定神不可驚怖卻用慣熟穩婆剪去手甲以香油潤手將兒足輕輕送入又再推上兒必搏身隨服大補榮衛湯身轉頭正然後扶掖起身用力一送兒即生矣母子俱全此在穩婆之良若粗蠢人不可用也古有以針刺足心及鹽塗之法決不可用兒痛上奔母命難存橫產者兒方搏身被母努力一逼所以橫下而手出矣宜令產母仰臥如前法將兒手輕輕送入又再推上摸定兒肩漸漸扶正令頭順產門隨服大補榮衛湯然後扶掖起身用力一送兒即生矣忌用針刺勿泥古法側產者因兒未順生路被母努力一逼所以兒頭偏在一邊雖似露頂實額角也亦照前法以手輕輕撥正仍服前方起身用力兒即生矣礙產者兒身雖順門路雖正但不能下乃因兒轉時臍帶絆肩而然令產母仰臥以手輕推兒上乃用中指按兒兩肩理順臍帶即生盤腸產者臨產母腸先出子產而腸未收故曰盤腸產蓋由平日氣虛不能斂束血熱易於流動下元不固關鍵不牢致於此救治之法於子下衣來之後令產婦仰臥穩婆先將子腸溫水洗淨然後托起輕輕送入推而上之卻令產婦兩足夾緊穀道其腸自安者上也或用蓖麻子四十丸粒去殼搗爛敷在頂心待腸收盡而急去之者次也或用冷水和醋噴面一噴一收漸次取之又其次也嗣後宜於無孕時多服地黃丸加五味子兩半肉桂二兩以固下元之關鍵及有孕之時宜服補氣涼血之劑於八月之時再服八物湯加訶子瞿麥粟殼十餘劑庶可免有後患如滑胎瘦胎之藥毫不可服六十二子死腹中凡子死腹中者或兒當生時被母護痛兩足不開夾其頭而死者或扶掖之人緊抱其腰傷胎而死者或因產難胞漿已干生路漸塞子不得出氣閉而死者或因生路不順若橫側等證穩婆粗率用手莽撞反傷其子而死者但察產婦唇紅舌黑母活子死腹中陰冷重墜或穢氣上衝子死腹中的矣急用加味五苓散奪命丹取去死胎以保其母隨加調補自愈若舌青而唇面俱青則子母皆危之兆也下胎方載後六十三胞衣不出胞衣不出或因產母力乏氣不能傳送者或因血少乾澀而難下者有以惡露流入胞中脹滯而不出者此惟老成穩婆以手循臍帶而上摸覺胞衣穩擒帶下甚不費力若未下可尋路上破草鞋一隻將臍帶仔細系定外加繩線再扎務宜緊固又要知臍帶脆而滑須當斟酌然後斷臍洗兒若先斷倘帶一縮入其害不小囑令產婦任其坐臥胞衣自下有過旬日而爛下者屢試不誤若不斷帶使子氣貫入衣中衣轉浮脹難出倘天寒之時更不便於子也下衣方載後備揀能救生產凶證良方附下死胎下胞衣方大補榮衛湯方載上治逆產橫產等凶證穩婆已經推兒向上而正須補氣血產婦方能送下子母兩全加味地黃丸治盤腸生後無孕時宜服此以固下元地黃八兩用砂仁四錢研末用酒蒸曬九次忌鐵山藥棗皮酒蒸各四兩茯苓三兩丹皮兩半澤瀉一兩二錢鹽水浸曬五味子兩半微炒肉桂二三兩先將地黃棗皮搗化然後加藥末煉蜜為丸每早用淡鹽水送八錢氣血雙補湯新治盤腸生後有孕時宜服此以補氣血黃耆一二兩蜜炒白朮七錢當歸五錢白芍醋炒二錢五味三分杜仲鹽炒二錢川續斷錢半升麻蜜炒四五分如血分有熱加生地酒浸錢半分量稱足須多服為妙或加附子五分加味八物湯治胎至八丸個月服十餘劑免再有盤腸生者人參少者以蜜炒黃耆一兩代之白朮當歸各二錢茯苓炙草川芎各一錢熟地三錢訶子煨瞿麥各錢半粟殼八分白芍酒炒錢半水煎多服加味五苓散治子死腹中用此下之並下胞衣白朮茯苓各三錢澤瀉豬苓肉桂各二錢半酒半水水須順流取之煎就加朴硝四錢再煎二三沸熱服死胎立下並下胞衣或單用朴硝三錢研末以熱酒熱童便調服立下又方用蓖麻子四粒巴豆一粒麝一分研貼臍中並足心死胎即下又方用斑蝥三枚略燒研末水服立下又方用桂心二錢為末童便酒調服神效若加麝三分更快奪命丹下死胎並治胞衣瘀血脹滿難下此方有回生之功用之必效附子炮五錢乾漆研之炒令煙盡丹皮各一兩若下死胎加當歸一兩上為細末用大黃末一兩以醋熬膏和前藥為丸溫酒下三四十丸其丸勿令泄氣牛膝散治胞衣血脹不下腹中痛用此腐化而下緩則不及牛膝梢三錢川芎蒲黃生地各二錢當歸肉桂各錢半朴硝三四錢姜引備揀古來治產難至簡至穩神方以便取用產難用鱉甲燒存性研末酒服三錢立生又方於路上撿破草鞋一隻用前半節洗淨焙乾燒灰存性酒服二錢即產又方十二月兔腦髓去皮膜研如泥母香丁明乳香各研末一錢麝二分共三味以兔腦和為丸作八粒陰乾油紙密包溫湯下一丸即產又方蟬脫燒灰存性水服一錢即下又方桃仁一個劈開吞之即生奇方又方用乳香揀通明者五分為末腰痛甚時以新取順流水勿逆取煎一大盞化下醋引產婦兩手各握石燕一枚須臾遂生神方又方用兔毫敗筆頭一枚燒灰存性生藕汁一盞調服立產又方用兔毫敗筆頭三個燒灰存性金箔二十脹以黃蠟和丸酒服第一方也又方用生附子為末醋調塗右足心即生又方用冬季兔頭燒灰存性蔥白湯調下一錢立生又方於欲產時用黃蜀葵子三錢研末酒調服遂產下死胎用雞子黃一枚薑汁一合和服立下備揀古來下胞衣至簡至穩神方於後以便取用本條上有加味五苓散奪命丹二方下衣最妙又方用報母桐樹根皮其樹三月發葉葉上間有小泡鄉人採葉養豬取流水水下流依水順取煎服或將根皮破至二塊三塊衣亦照塊而破下大奇又方用舊扇燒灰酒調下又方用產婦鞋底炙熱熨腹上下即出又方用皂角刺燒為末每用一錢溫酒調服立下又方以本婦頭髮梢吞入喉中作嘔則衣自落亦能下胎甚效衣不下將來欲死用吐狗一枚煮灌即出又方以草紙繞煙燻鼻即下又方飲熱童便一碗立下六十四論產門不開不閉子宮不收產門不開由交骨緊也綠陰不足則氣不達所以不開產必艱難宜加味佛手散方載上六內補而開之大有奇效加柞木枝五錢妙產門不閉由氣血大虛不能收攝用十全大補湯方載上第三內加五味子一錢或痛而覺熱者宜加味逍遙散當歸白芍白朮茯神甘草柴胡酒炒各錢半加丹皮梔子各七分子宮不收而外墜者乃元氣之下陷也宜補中益氣湯方載上第七內加醋炒白芍斂而舉之外以黃耆煎湯熏洗又方用荊芥藿香臭椿根皮煎湯熏洗神效治產後子腸不收用枳殼訶子五倍子白礬煎湯熏洗若不收灸頭頂中為百會穴數壯又方用蓖麻子仁十四粒研爛塗頂心入即洗去硫黃湯治產門不斂陰戶挺出硫黃三錢菟絲子吳茱萸各二錢蛇床子錢半煎湯頻洗外用硫黃烏賊骨五味子等分研末摻患處日三易又方用石灰炒紅淬水熏洗產後門六十五產後脈論寸口脈洪疾不調者死沉微附骨不絕者生胎前脈當洪數產後脈當細小胎前之病其脈貴實產後之病其脈貴虛產後氣血兩虛脈宜緩滑緩則不因氣奪而急促滑則不因血去而枯澀最忌實大弦牢實為邪實大為邪進弦為陰斂宣布不能牢為堅著近乎無胃皆非吉兆六十六論產後調治丹溪云產後當大補氣血即有雜證以末治之一切病屬氣血虛蓋以產後氣血俱去誠多虛證然有虛者有不虛者有虛中夾實者但當隨人隨證辨其虛實不得執其偏見概行大補以貽害也補虛生榮湯新治產後氣血兩虛無神無力不時昏迷等證黃耆蜜炒三五錢當歸去尾二三錢白朮二錢茯苓一錢熟地三錢益母草二錢甘草炙二錢乾薑炒黑透心三五分白芍煨酒炒錢半荊芥穗炒黑七分水煎少加酒童便和服若不得力黃耆可加至兩餘再加附子七八分以助藥力如有血氣痛名兒枕血加山楂二錢一劑愈即去之余藥不可增入可服數劑氣血易於復元日後自體旺而百病消除矣人能有力加參更妙生化湯善化惡血驟生新血為產後穩協最效之方當歸五錢川芎錢半甘草炙五分乾薑炒黑三五分桃仁十粒去尖皮熟地二錢棗引溫服如胞衣不下加益母草研末調服三四錢如血暈加荊芥穗五六分如產後氣脫無神加人參一二錢黃耆蜜炒一兩或加附子七八分如陽虛厥逆加附子肉桂各一二錢如脈虛煩渴加麥冬錢半五味三分如氣壅有痰加陳皮竹瀝如血燥便結加生威參二兩蓯蓉五錢如汗多不眠加茯神棗仁黃耆上體多汗加麻黃根二錢下體多汗加漢防己錢半或口噤中風反張瘛瘲者加荊芥防風各四五分如惡露未盡腹內有塊脹痛加山楂二錢如傷寒濕加蒼朮白朮如下血不止或色黑或如水此氣血大虛之候不可用寒涼其脈浮脫者可加附子及諸陽分之藥否則無救矣六十七論治產後仍宜因證凡產婦用藥宜因時制宜如有表邪則當清之有火邪則當請之內有停滯則消導之且人有強弱脈有虛實病有真假治有逆從固不可以同日語也觀六元正紀大論曰婦人重身毒之何如曰有故無殞亦無殞也但除邪之中仍以輔正為主則正氣旺而邪氣易逐邪氣除而正氣亦易復也六十八產後當知凡產畢飲熱童便一盞遲二時用酒半杯合童便半杯服約一日服三次產後不得便臥宜背後高安衣被伴以仰坐不宜側坐宜豎膝不宜伸足厚鋪裀褥遮圍孔隙免致賊風燒紅磚石沃之以醋使鼻常聞醋氣自無血暈勿勤梳頭洗足三日內不可食鹽鹽止血恐無乳汁三日後可食新腈肉湯羊肉湯入鹽少許夏天忌貪涼用扇及食生冷切不可當風坐臥產婦血裙不可日曬兒濕衣不可夜露古以一月為小滿兩月為大滿此兩月內勿暴怒少勞苦禁淫欲終身無病而且多子六十九產後忌藥產後當服補藥但須加一二暖血行瘀之味蓋血行其氣乃復特不可行之過峻耳凡產後危證莫如三沖三急三沖者敗血沖肺衝心沖胃也三急者嘔吐泄瀉多汗也其用藥則有三禁禁佛手散以川芎辛散能發汗走泄也禁四物湯以生地寒冷能作瀉而凝血也白芍酸寒伐生氣也酒炒後宜用以斂陰禁小柴胡湯以黃芩性寒能阻惡露也更有三禁不可汗不可下不可利小便並勿犯胃及上下焦雖有雜證於補氣血藥中帶以治之七十產後血暈產後氣血俱去忽而眼黑頭眩神昏無知此際輕輕扶坐宜用有嘴壺入醋一杯燒紅瓦石入於壺內將壺嘴向產婦鼻下熏之即醒然後用大補氣血之藥如補虛生榮湯方在上六六內或用十全大補湯方在上第三內此證多由氣血虧損而然然血逆上衝者亦間有之其證必胸腹脹痛形氣脈氣俱屬有餘用失笑散治產後敗血攻心暈迷不省腹脹刺痛亦消瘀血下衣五靈脂有溏心者真蒲黃等分俱炒共為末每服二三錢用酒煎熱服一方用醋熬成膏再入水煎服按此方用以止痛蒲黃宜減半用以止血宜等分蒲黃炒黑又方救血暈或以漆器或用乾漆燒煙燻之人能於將生之前用醋熏或漆熏免有血暈之病要暈醒方可服藥有益古方每用童便治血暈因敗血則可若元氣欲絕豈能挽回乎有是證者速用醋熏醒之後宜大補氣血庶可無虞回元湯新治血暈醒後可回元氣黃耆蜜炒一兩當歸二錢半益母草三錢黑乾薑五七分煎就沖熱童便服即用補虛生榮湯亦可方在上六六內黑神散治血去少惡露未盡腹中有痛而昏眩者黑豆一合炒熟地當歸各二錢肉桂去皮炙草白芍酒炒蒲黃各一錢乾薑炒八分水酒各一盞煎就入童便一杯服如瘀血作痛加山楂二錢即化而愈七十一惡露不絕產後衝任損傷氣血虛憊舊血未盡新血不斂相併而下日久成勞惟宜大補氣血不可輕用固澀之劑使敗血凝聚變為癥瘕反為後害十全大補湯方載上第三內治氣血兩虛不能收攝以致下血不止如數服不應恐下遺路滑少加發灰棕灰荊芥灰百草霜各等分再研每用一二錢調藥服以上燒灰俱要存性如陰虛內熱熱搏血分加生地丹皮青蒿之類如小腹刺痛加元胡蒲黃炒乾薑炒各等分如元氣下陷加升麻或用補中湯如縱欲以傷衝任血久不止六味地黃湯加阿膠麥冬五味子止血單方用蒲黃炒黑水調服肝經風熱下流者用防風為末白湯調服一錢七十二產後頭痛氣為陽血為陰平勻則無病產後血去陰虧陽氣失守頭為諸陽之會孤陽上湊故為頭痛但補陰血則陽氣得從而頭痛自愈或有身熱惡寒之候不可用羌獨等藥此內起之邪當滋陰以配陽非外入之邪可表而散也歸地滋陰湯新治陰虛陽燥頭痛不止當歸熟地各三五錢白芍酒炒錢半川芎一錢乾薑炒透六七分甘草炙一錢荊芥穗六分水煎服黑神散方載上七內治敗血停留子宮厥陰之位其脈上貫巔頂而痛者七十三產後腹痛產婦氣虛不能行血故或閉而不來或來而不盡致令腹痛乍作乍止其痛如刺手不可近其血成塊時見而痛時隱而止此為兒枕痛俗謂血氣痛者是也山楂益母草湯新治兒枕血痛即化而愈山楂二三錢益母草當歸各二錢川芎陳皮去白各一錢香附酒炒六分乾薑炒黑三分煎就加酒童便各半杯合服補虛生榮湯方在上六六內加山楂三錢治體虛年衰產後兒枕血痛當歸建中湯治產後血虛外受風冷之氣內傷寒冷之物以致腹痛得按略止或熱物熨之即止者是也敗血腹痛與傷風傷食之痛其辨在手不可近與按之即止歸身二錢白芍酒炒肉桂去皮甘草各二錢薑棗引七十四產後脅痛此敗血流入肝經厥陰之脈循行脅肋然亦有虛實之分如脅下脹痛手不可按是瘀血也宜去瘀以平肝芎歸瀉肝湯治肝經瘀血脅肋脹痛歸尾川芎青皮枳殼香附童便炒各錢半紅花桃仁各八分水煎入酒童便各一鍾服適可即止當歸地黃湯治脅下痛喜人按者此去血太多肝臟虛也歸身二錢白芍酒炒人參各錢半熟地二錢陳皮去白甘草肉桂各一錢薑棗引或用四物加肉桂柴胡酒炒各等分此證若不用薑桂辛溫助脾肺以行藥力不惟無以施功反助其脹矣七十五產後腰痛女人之腎胞脈所繫腰屬於腎產後下血過多則胞脈虛必腎氣虛故令腰痛補腎地黃湯治腎經虛損其證腰重隱隱而痛熟地當歸杜仲青鹽水炒去絲各二錢獨活桂心續斷各一錢薑棗引空心服加味復元通氣散治敗血流入腎經帶脈阻塞其腰脹痛如刺時作時止手不可近歸身二錢川芎小茴炒補骨脂炒捶牛膝桂心丹皮各一錢木香三分磨水合服更調乳香沒藥去油各五分為末服七十六產後身痛產時骨節開脹血脈流散遇氣衰弱者則血多凝滯骨節不利筋脈不舒故腰背不能轉側手足不能屈伸而痛也勿作風寒用汗之劑治之趨痛散治氣虛以致敗血凝滯經絡而遍身疼痛當歸桂心白朮牛膝酒炒黃耆蜜炙各錢半獨活生薑各一錢炙草薤白各五分水煎熱服白茯苓散治產後虛損四肢疼痛寒熱自汗名曰褥勞勿作傷寒誤投汗劑茯苓歸身黃耆蜜炙熟地各二錢川芎桂心白芍酒炒人參各一錢獖豬腰子一對去脂膜切片煎湯一碗去腎加薑棗同藥煎服或改用人參養榮湯方在一卷內一加黑姜主之七十七產後氣喘產後氣急喘促者因榮血下多而竭衛氣無主獨聚肺中故令喘也此名孤陽絕陰最為危證若作痰火實證治之即刻斃矣蓋人生於氣氣壯則根本固而藏源者斂納於下運行者強健於中而何有喘脹之虞人參生化湯治產後喘促補氣以生血也人參少者以蜜炒黃耆一二兩略可代之當歸五錢川芎錢半甘草炙八分乾薑炒黑五七分熟地二三錢棗引溫服或加附子一錢以助藥力外以鞋底炙熱於小腹上下熨之若肺感風寒而喘者用下除邪清肺湯七十八產後咳嗽肺主氣氣為衛產後氣虛皮毛不充腠理不密風寒襲之入於肺而為咳嗽其證發熱惡寒鼻塞聲重或流清涕除邪清肺湯新治肺冒風寒寒熱咳嗽等證當歸二錢白芍酒炒錢半前胡錢半半夏陳皮杏仁茯苓甘草各一錢荊芥穗八分麻黃留節四五分有汗者不用加桂枝八分以內有歸芍佐陰不得疑為過表也薑棗引熱服二母湯治產後敗血流於肺經其證胸膈脹滿不時咳嗽知母貝母茯苓桃仁杏仁各錢半沙參二錢水煎食後溫服加味甘桔湯治久咳不止涕唾稠黏宜清肺寬中桔梗茯苓各二錢甘草款冬花貝母麥冬枳殼各一錢五味三分前胡錢半淡竹葉十五水煎服如產後吃鹽太早太多而咳者難治宜知自禁加味地黃丸治產後虛羸久咳雖肺病而實腎病也子令母虛宜滋腎以納氣乃為司命上乘而火不得上炎也熟地三五錢棗皮淮山藥各二錢茯苓錢半丹皮二錢澤瀉八分麥冬錢半五味三分煉蜜為丸早夜用淡鹽水送八錢補土保金湯新治肺病而補脾者以土旺生金而腎水亦源遠而流長也早夜服上方丸藥中時宜服此方水藥人參隨便白朮茯苓各錢半炙草麥冬貝母款冬花各一錢山藥炒扁豆炒苡仁炒各二錢薑棗引七十九產後心湧心者血之主產後血虧心無以養宜歸脾湯主之亦有其人宿寒內伏復因產後虛寒血凝不行上衝心之絡脈故心痛也脈必弦緊須用熱攻寒然必佐以陰藥方能制其僣越也若以為敗血攻之則虛極寒益甚其誤大矣歸脾湯治產後心血虛損心無所主而覺痛也人參當歸身二錢黃耆蜜炒白朮茯神各錢半棗仁炒研一錢遠志六分炙草八分陳皮七分元肉蓮肉引大岩蜜湯治產後因虛寒心痛生地歸身各錢半獨活吳茱萸開水泡一次用白芍酒炒乾薑炒炙草桂心生甘草各八分北細辛三分熱服凡產後寒氣上攻則心痛下攻則腹痛兼血塊者宜服生化湯加桂方在上六六內心痛用鬱金燒存性為末米醋調下即蘇八十產後發熱產後血虛則陰虛生內熱其證心胸煩滿呼吸短氣頭暈悶亂日晡轉甚與大病後虛損相似宜補陰以配陽也滋陰補血湯新治產後陰虛陽無所依浮散於外而為熱也當歸三五錢熟地五七錢或兩餘白芍酒炒二錢乾薑炒黑一二錢蓋炮姜辛熱而兼苦鹹能引血藥入血分有陽生陰長之道本內經以熱治熱之旨也如五心熱加元參一錢如煩渴便燥是內有虛熱也加麥冬淡竹葉生地之類如肌膚髮熱面目俱赤此血脫髮燥宜用當歸補血湯若誤作火證投以涼劑禍在反掌當歸補血湯治血脫髮燥有似乎狂也蜜耆一兩當歸三錢水煎溫服此補氣以生血也八珍十全俱可擇用若熱甚而脈微者宜急加桂附此火不歸源故假火外浮耳八十一產後發狂產後發狂者此陰血暴崩肝虛火炎之極也宜養心生血則得矣濟火養心湯治陰虛火炎似狂非狂不得認為實證也熟地五七錢當歸身二三錢澤蘭葉四五錢懷牛膝酒蒸茯神棗仁炒研各錢三分遠志七分煎就加童便一杯合服或加柏子去油一錢如因惡露未下敗血攻心加蘇木濃煎汁合服或再加桃仁去皮紅花酒炒各五六分於此補劑內亦可若因腎虛陰火上迫而為如狂者宜八味地黃湯要知產後大虛而繼諸病則當以虛為本而病為標也如血虛內熱脈洪滑舌黃便燥少加清火之品如生地白芍丹皮麥冬淡竹葉之類可也芎歸瀉心湯治敗血停積上干於心胸膈脹悶煩燥昏亂狂言妄語如見鬼神若視為邪祟誤矣歸尾川芎元胡蒲黃丹皮各一錢桂心七分水煎調五靈脂另研末一錢食後服八十二產後嘔逆嘔逆之證有二因敗血滯於胃者則脈弦澀不惡食而嘔多血腥者是也消瘀清胃湯新治瘀血犯胃作嘔逆者陳皮去白錢半法半夏二三錢茯苓二錢炙草一錢澤蘭葉二三錢生薑二錢荊芥七分水煎熱服加味平胃散治飲食宿於胃者則脈弦滑而嘔多食臭者是也蒼朮厚朴姜炒各錢半陳皮香附醋炒各一錢炙草一錢生薑錢半神麯炒錢半水煎熱服加味六君子湯治產後傷食嘔吐腹脹照後加入人參白朮茯苓半夏各錢半炙草陳皮枳實曲炒山楂各一錢薑黃六分生薑八分食遠服或加神麯麥芽俱炒各一錢如胃寒者加炮薑煨木香如木旺侮土者加肉桂如命門火衰不能生土者八味丸重用桂附嘔吐泄瀉手足冷肚腹痛者乃陽衰也急用附子理中湯八味地黃丸治命門火衰不能生土以致嘔吐者熟地四錢山藥棗皮茯苓各二錢丹皮澤瀉各一錢肉桂附子各二錢附子理中湯治脾胃虛寒嘔吐泄瀉厥逆腹痛等證人參白朮二三錢乾薑炒一二錢炙草錢半附子二三錢水煎服八十三產後寒熱往來產後半月內外寒熱往來其證有二一由於敗血留滯必小腹刺痛而榮衛不通滯於榮則血凝而寒滯於衛則氣鬱而熱榮衛俱滯寒熱交作宜以去滯為主卷荷散治敗血為病小腹刺痛寒熱往來初出卷荷焙紅花歸尾蒲黃丹皮生地各一錢生薑七分童便一碗水煎熱服即服黑神散亦妙方在上七內一由於陰陽不和產後氣血虧損陰陽俱虛陰虛則陽勝而熱陽虛則陰勝而寒陰陽俱虛則乍寒乍熱宜以補虛為主增損八物湯治陰陽兩虛寒熱往來歸身二錢白芍酒炒錢半川芎乾薑炒黑各一錢人參或以山藥炒黃三錢或以時下條參三錢代之炙草七分生薑五分紅棗二枚水煎服如寒多者加肉桂一錢熱多者加柴胡酒炒八分乾薑減半煩渴者加知母麥冬各一錢食少者加陳皮白朮各一錢虛倦甚者加黃耆蜜炒一錢乍寒乍熱似瘧而實非瘧也似瘧者寒不戰慄熱不躁烈發作無時或日晡更甚亦不甚苦此正氣虛而無邪氣也真瘧者寒則湯火不能御熱則冰水不能解發作有時煩苦困頓此正氣虛而邪氣相搏也八十四產後瘧疾產後氣血兩虛榮衛不固脾胃未復或外感風寒內傷飲食皆能成瘧只以補虛扶正為主正氣勝則邪氣自退不可用截藥重虛正氣為害甚大輔正除邪湯新治產後瘧疾北柴胡陳皮半夏茯苓甘草各錢半川芎八分歸身二錢乾薑炒肉桂黃芩各一錢白豆蔻肉一錢微炒研生薑一錢頭煎要輕失三個時服次煎加鱉甲醋炎二錢先一個時服則藥性發而瘧適來兩相遇而即止矣此治瘧秘傳最效最捷如寒多者重加薑桂如熱多者重加黃芩並加知母如久瘧汗甚者加蜜炒黃耆一二錢若一二劑不應者加酒炒常山一錢八十五產後出汗汗本血液屬陰產後去血過多陰亡陽亦隨之而走故曰亡陽此危證也宜急治之以固元氣加味大補湯新治產後榮血不足衛氣失守不能斂皮毛固腠理汗易泄而出也人參黃耆蜜炒三錢白朮二錢當歸二錢附子一錢防風八分麻黃根蜜炒錢半白芍酒炒一錢以浮麥一合煎就去麥入藥煎之調牡蠣煅研粉三錢頓服即改用十全大補湯亦妙人參白朮二錢黃耆蜜炒三錢熟地當歸各二錢半茯苓川芎炙草白芍酒炒錢半肉桂錢半加防風一錢五味三分薑棗引如不應加附子一二錢如汗不止風邪乘之忽然悶倒口眼喎斜手足攣曲此凶兆也急用桂枝葛根白芍酒炒各錢三分炙草八分蜜耆當歸各二錢熟附一錢斡開口灌之八十六產後中風風證有二有外中者由產後正氣暴虛百節開張調理失宜風邪乘之不省人事口目蠕動手足攣曲此外中之風也又有產後去血過多內則不能養神外則不能養筋以致神昏氣少汗出膚冷眩暈卒倒手足瘛瘲此肝無血養虛則生風此風自內生者也能分內外庶治療可以合宜愈風湯治外中之風以固表為主而治風之藥亦略兼之當歸黃耆蜜炒各二錢白芍酒炒錢半川芎肉桂天麻秦艽防風各一錢羌活七分薑棗引熱服加味當歸建中湯治內生之風肝虛掉眩血海乾也當歸二錢蜜耆錢半桂枝炙草生薑各錢半白芍三錢膠飴兩半人參薑棗引即用十全大補湯加附子亦妙養肝活絡湯新治血虛不能養肝以致木動風搖角弓反張神昏撲倒即痙證也當歸二錢白芍酒炒肉桂各一錢蜜耆錢半熟地二三錢秦艽防風木瓜阿膠炒各一錢白朮錢半以此溫養之如不應加附子人參如血虛有熱者加生地二錢丹皮錢半如風甚不退四肢拘攣加勾藤勾二錢猶未應乃藥力未到宜多用之中風香迷用荊芥穗為末童便加酒調服二錢神效愈後當服上方交加散治產後不省人事口吐痰涎或瘛瘲戰振等證當歸荊芥各二錢水煎加酒少許灌服神效八十七產後傷寒產後氣血俱虛榮衛不固起居失節調養失宜傷於風則衛受之傷於寒則榮受之總以補虛為主隨證加味治之五物湯治產後外感主藥人參當歸身二錢白芍酒炒川芎炙草各一錢生薑五分蔥白三根水煎熱服如有汗為傷風加防風桂枝如無汗為傷寒加麻黃蘇葉頭痛加槁本北細辛身痛加羌活蒼朮但熱而不寒加柴胡葛根發熱而渴加知母麥冬淡竹葉無參宜用補虛生榮湯炒內有荊芥七分不必炒用此方在六六內八十八產後浮腫產後敗血乘虛流入經絡留滯日久腐化為水若作水治用滲利之劑病虛而藥又虛之多致夭枉宜使氣血流行為妙小調經散治產後遍身浮腫血行而病自愈歸身赤芍丹皮桂心赤苓炙草陳皮各一錢乾薑炒細辛各五分生薑引加味五皮湯治產後外受風濕遍身浮腫桑白皮陳皮生薑皮茯苓皮大腹皮漢防己枳殼炒豬苓炙草各錢半生薑引八十九產後不語心氣通於舌產後敗血閉其心竅神志不能明瞭故多昏瞶而舌強亦不能言也舌乃心之苗產後心血虛弱不能上榮於舌萎縮卷短故語之不出而含糊蹇澀也七珍散治敗血閉塞心竅神昏舌強不能言語人參菖蒲生地川芎各一錢細辛二分防風五分辰砂五分另細研煎就調辰砂末服加味參麥散治心血虧損舌短難言人參麥冬歸身生地炙草菖蒲各一錢五味十三粒豬心一個劈開水二碗煮至碗半去心入藥煎至一碗服又治怔忡有效九十產後泄瀉產後脾胃虛怯寒邪易侵或內傷生冷流入大腸洞瀉腸鳴腹內脹痛宜補脾暖胃為正治若用利水取滯之藥誤矣暖胃調中散新治產後脾胃虛寒腹痛泄瀉白朮二錢白芍一錢乾薑炒甘草肉蔻麵裹煨各八分肉桂一錢共為末棗湯調服甚則加附子一錢苓朮健脾散新治脾胃虛寒一切泄瀉男婦大小皆治白朮兩半茯苓扁豆炒苡仁炒山藥炒各一兩白豆蔻去殼炒研五錢肉豆蔻煨炙草各六錢陳皮四錢神麯炒二錢如腹痛喜熱加乾薑炒五錢或加附子六錢共為末薑棗湯調服二三錢或加廣木香濕紙包煨三錢更效或加米四錢炒黃同研小兒少加白糖為引神效參朮散治產後泄瀉及痢疾日久積穢已去滑泄不止人參木香煨各一錢肉蔻煨茯苓扁豆各二錢陳皮三錢罌粟殼去蒂醋炒四錢共為末每用錢七米湯下收澀如神九十一產後痢疾痢屬濕熱赤屬熱白屬濕有謂赤屬熱白屬寒者非也無濕不變熱無熱不變痢其證不一有冒時氣之濕熱者有傷飲食之濕熱者須以清利為主而察證診脈變化用之乃為上工產後雖曰無實證而亦有脈實體實者宜以治病為急而扶本之藥或兼用之或後用之不得偏執專於補也而脈虛證實者以固本為急而治標之藥或重用之或輕用之不得偏執一味瀉也其中又有宿食者有虛寒者有腸滑者有敗血者務宜詳審施治庶不誤人清熱導滯湯新治產後痢疾裡急後重腹痛舌黃脈滑實者當歸二錢下純血而熱者用一錢白芍生用錢半川芎黃連檳榔陳皮去白各一錢廣香三分用煎水煎熱服不應加大黃酒炒錢半內有補藥放心用之中病即止愈後用四君子湯加陳皮和之補中益勻湯下香蓮丸治產後脈虛痢疾裡急後重腹痛或不痛或日久神倦及年衰體弱之人人參一錢或以時下生條參三錢代之白朮錢半黃耆蜜炒二錢當歸錢半陳皮茯苓炙草各一錢升麻鹽水炒柴胡酒炒各三分薑棗引香蓮丸治裡急後重以氣滯而熱伏也黃連一兩吳茱萸炮湯炒乾廣木香五錢共為末蜜丸或漿糊丸用前藥煎就送丸三錢日三服消化湯新治宿食痢疾腹痛腹脹惡聞食氣或食後更痛白朮藿香厚朴薑汁炒神麯炒白芍陳皮砂仁炒枳實炒各一錢木香三分水煎熱服予有化食方在腹痛門可參用加味四君子湯治產後久痢積垢去而不止此脾虛腸滑也人參少者或以山藥三錢炒黃代之白朮二錢茯苓錢半炙草一錢白芍錢半烏梅二個罌粟殼七分水煎溫服此方宜酌量恐用之太早有害化瘀方治產後惡露不下以致敗血滲入大腸而利鮮血者腹中刺痛但里不急後不重者是也枳殼麵炒錢半荊芥穗略炒二錢半水煎服神效九十二產後大便閉澀人身之中大腸為傳導之官其能腐化糟粕者氣也滋潤腸胃者血也產後氣虛而不運故飲食壅滯而不行血虛而不潤故腸胃乾澀而不流大便不通乃虛而燥也不可誤用下劑反虛其虛其閉澀自必甚矣潤燥湯治產後血虛便燥潤以通之非同強下也人參五分少者以生威參一兩代之甘草五分歸身梢生地枳殼各一錢火麻仁去殼捶研二錢桃仁搗如泥二錢檳榔五分磨汁先將上六味煎就後入桃泥檳榔汁調勻服蘇麻粥真蘇子一合火麻子三合共擂爛以水一盞濾汁又擂取汁渣盡為度用汁入米煮粥食之老人尤宜以虛閉也或腹內急脹而不得下用豬膽汁從穀道灌入自潤而下若不脹雖日久不妨不必用也產後不用大黃然大便結秘不通可用酒炒大黃於補血藥中潤之但利後當以耆朮芎歸等大劑補之防元氣下脫也九十三產後小便不通或短少膀胱州都之官津液藏焉氣化則能出矣產後氣虛不能運化故小便不通雖通而亦短少也勿用滲利藥以益其虛也又有惡露不來閉塞水瀆小便不通其證小腹脹痛乍寒乍熱煩悶不安者是也益衛運化湯新治產後氣虛膀胱不能運化小便閉塞人參少者或用沙參蜜耆二錢桂心七分麥冬車前子各一錢小茴鹽炒五分升麻鹽炒四分茯苓錢半懷牛膝八分水煎頓服此證最急上藥服後用手指探喉取嘔譬之注水之器上竅開則下竅自通也恐急時無藥用鹽二三錢炒紅至味苦淬水一杯味微咸服之亦用手指探喉取吐有外治多方詳載八卷小便不通門當參閱用之內有一妙方用蔥數莖搗納陰戶中外用皂角蔥頭王不留行各六七兩煎水一盆令產婦坐浸其中熏洗小腹熱氣內達便即通矣加味五苓散治產婦敗血閉塞水溝小便不通白朮茯苓豬苓澤瀉肉桂各一錢桃仁錢半紅花酒炒八分水煎服二仙丹治證同上瞿麥四錢蒲黃二錢水煎服灸臍法凡產後不通蓋由平日內積冷氣遂致產時尿胞轉動不順用鹽填臍中卻以蔥白剝去粗皮二十根作一縛切一指厚安鹽上用大艾揉熟炷滿蔥餅上以火灸之覺熱氣入腹內即時便通神驗積冷者用此所謂氣化則能出矣九十四產後淋證產後血去陰虛生內熱證也蓋腎為至陰主行水道血虧陰損水不足以配火故內熱小便成淋而澀痛也前言小便不通屬氣虛不通淋屬內熱澀痛以此不同加味導赤散治產後陰虛內熱小便澀痛為淋證也生地赤芍木通去皮甘草梢麥冬黃柏炒知母鹽水浸桂心各一錢燈心三分調益元散滑石六錢甘草一錢共研細末又名六一散二錢服九十五產後尿血小腹痛者乃敗血滲入膀胱小腹不痛但尿時澀痛者乃內熱也小薊湯治上二證無論痛與不痛但尿血悉效小薊根生地赤芍木通蒲黃甘草梢淡竹葉各一錢燈心三分滑石二錢水煎服小腹痛者屬敗血加歸尾二錢紅花一錢酒炒如內熱者加黃芩麥冬各一錢單方治尿血用發洗淨燒灰存性米湯調服一錢又方用滑石發灰共研末生地加水搗汁調服九十六產後遺尿不禁兼損脬漏尿產後有遺尿不自知者有頻來不能禁者此氣血俱虛不能制也宜陰陽兩補而且以腎為主以腎開竅於二陰命門火不足則關鍵不緊不得徒用閉澀之劑也大補陰陽湯新治產後氣血兩虛遺尿莫禁黃耆三錢蜜炒白朮益智仁山藥炒各錢半當歸去尾熟地益母草各二錢牡蠣煅研粉三錢甘草炙白芍酒炒各一錢乾薑炒六分薑棗引速進二三劑或加附子七分以助藥力早服補先天藥補腎益鍵湯新治腎中之陽不足不能關鍵以致小便失常熟地四錢山藥棗皮益智仁補骨脂鹽炒各二錢杜仲鹽炒肉桂附子制各錢半此早服上方中時服得每日同進為妙或補中益氣湯方載第七內加益智仁亦良歷驗單方治產後小便不禁用益智仁微炒研二錢水煎加鹽少許服又方白薇白芍等分為末溫酒調下二錢又方用雄雞䏶胵一具並腸洗淨燒為末溫酒調服二錢又方用雞尾毛燒灰存性酒下一錢七日三服又方真桑螵蛸蒸焙四錢龍骨煅牡蠣煅各六錢為末水調三錢服千金補脬飲治產時被粗率穩婆損傷尿脬小便漏出淋瀝莫何生黃絹一尺煎碎白牡丹根皮肉白者是也白芨各二錢研末同煎至絹爛如餳連滓服之服此不得見人作聲作聲即無效愈後服八珍湯並參閱小便不禁門在八卷可揀而用之九十七產後大便血大便血者其因不一須分微甚源流治之不可概視有腸冒虛弱六君加升麻柴胡若虛寒加乾薑肉蔻如元氣下陷用補中加茯苓半夏若大腸血熱四物加黃芩槐花若血虛四物加升麻若氣血俱虛用八珍加升麻柴胡若因膏粱積熱用加味清胃散若怒動肝火加味小柴胡湯或逍遙散若鬱結傷脾而不能統血歸脾湯若脾氣虛寒加炮姜或加附子如病源已得而或血滑下走凡止血澀血之味亦須揀用如發灰棕灰百草霜及蒲黃炒黑蓮蓬灰與艾葉阿膠之類可用之而無傷損加入隨證藥中自有其效加味清胃散治因膏粱積熱大便下血當歸身二錢生地丹皮各錢半黃連八分升麻四分石膏三錢水煎服其餘六君四物等方隨在常用不必覆載九十八產後二便不通產後血水俱下津液燥竭腸胃痞澀熱氣內結故令大小便不通也治宜補血以潤腸胃補氣以通膀胱則得矣若作實證下之利之則虛者益虛不惟無益而且有害其法在先通小便而大便可徐通焉益衛運化湯方載上九三內治小便閉塞乃氣虛不能運化膀胱故耳須照上小便不通治法或取嘔或熏洗或灸臍不可少緩待小便一通用潤燥湯方載上九二內以通大便外用豬膽汁從穀道灌入之法妙而捷也悉詳九二條內宜照法治之以下並治有方可揀而用之金鑰匙散治產後二便不通腹脹等證用滑石蒲黃等分為細末酒調下二錢又方用陳皮蘇葉枳殼木通等分水煎服又方木香二錢枳殼麻仁炒大黃酒煨各一兩蜜丸溫水下三十丸又方治膀胱氣滯血澀一便閉塞桃仁葵子滑石檳榔等分為細末每服二錢蔥白煎湯調下又方飲人乳牛乳而通仙方九十九產後崩血產後衝任已傷氣血未復或因勞役或因驚恐宜補心脾以統之或因房勞傷動胞脈或食辛熱鼓動相火或惡露未盡固澀太速以致停留一旦復行須要詳審崩非輕病產後更為重也補養心脾湯新治產後崩血屬勞役驚恐致傷心脾而不能統血者人參黃耆蜜炒白朮茯神當歸棗仁炒各錢半柏子仁去油八分白芍酒炒阿膠炒山藥炒炙草各一錢加發灰棕灰百草霜蒲黃炒黑等分研勻前藥煎就每調錢半服四物湯治血虛暴崩用為主治後照其所因而加之當歸三五錢若血虛有熱者只用身錢半熟地五七錢川芎白芍酒炒各錢半如因房勞者加黃耆蜜炒二錢炙草阿膠炒艾葉各一錢如因食辛熱者加白朮錢半甘草黃連各一錢如因澀早者加香附桃仁各八分煎就仍加前發灰等四味為引或俱加三七研末二錢調服一產後霍亂吐瀉脾胃者氣血之本也產後血去氣損脾胃亦虛風冷易乘飲食易傷少失調理即為霍亂但有陰陽之分不可概視加味理中湯治產後心腹絞痛手足逆冷吐瀉並作此霍亂之屬陰者人參白朮炙草乾薑炒陳皮藿香梗圓色白氣香者真厚朴姜炒生薑各一錢水煎溫服如傷食者加神麯麥芽之類如瀉甚者加肉豆蔻一錢煨木香三分或再加白扁豆二錢蓽薢四錢如中寒厥逆之甚者加附子二三錢或再加吳茱萸開水泡焙乾八分清和湯治濕熱霍亂或吐瀉或不吐瀉一切腹痛暴甚等證陳皮半夏茯苓甘草蒼朮白芍厚朴姜炒黃柏炒各一錢水煎熱服或用溫中散滯湯方載霍亂門內照證加入詳載本方不得輕用生薑若急救吐法單方詳載霍亂門所當參閱一一產後積聚瘕塊積者陰氣也五臟所生聚者陽氣也六腑所成陰性沉伏故痛不離其部陽性浮動故痛無常處瘕塊者謂浮假成形無定處也皆由氣血虛弱風冷所乘搏於臟腑與氣血相結而成者也又有產後惡露未盡補澀太甚不用活血去瘀之劑以致敗血停留久而結聚成塊依附子宮為害不小益氣養榮湯新治產後氣血虛弱風冷所乘搏於臟腑積聚為患者也人參當歸四錢香附醋炒二錢乾漆捶碎炒令煙盡錢半乾薑炒肉桂各一錢陳皮去白七分水煎服如無參者加黃耆蜜炒三五錢如堅結不能化者加三稜醋炒錢半莪朮火炮錢半或多服不應須用丸藥漸磨之法丸藥治積塊堅結漸磨自化熟地香附醋炒歸身各二兩棗皮肉桂川芎三稜煨醋炒莪朮醋炒鱉甲醋炙桃仁去皮元胡補骨脂各一兩五靈脂兩半廣木香六錢丹皮兩半共為末蜜丸用去白陳皮湯下五十丸一二產後呃逆經曰呃逆者胃寒所生產後氣血俱損風冷乘虛而入則氣逆上衝又有脾虛胃冷因食熱物相為衝擊而然者又有中氣大虛下焦陰火上衝而致者宜因證診脈以治之若用降氣之藥則危矣香柿理中湯治產後胃虛氣寒呃逆之聲上衝人參白朮炙草乾薑炮陳皮各一錢丁香二分柿蒂二錢水煎溫服如有熱證熱脈去丁香加竹茹二錢如陰火上衝加肉桂附子各一錢引火歸源不致遊移上逆也一三產後驚悸產後臟虛心氣不足陰虛邪熱乘心以致驚不自安悸動不定目睛不轉而不能動診其脈動而弱者驚悸也惟宜養血佐以安神血生則神有所依也養血安神湯新治產後心血不足以致神魂不安而驚悸也當歸身二錢熟地三五錢白芍酒炒錢半茯神棗仁炒生地炙草各一錢遠志六分五味三分乾薑炒黑三四分柏子仁微炒去油七分白蓮五粒去心微炒捶碎水煎溫服或用天王補心丹亦妙方載怔忡門一四產後口渴胃者水穀之海津液之府也產後去血過多津液內耗胃氣暴虛頓生內熱故口燥咽乾而渴也治宜以滋陰清熱為主若作實看誤矣人參麥冬湯治產後陰虛內熱而口渴也人參麥冬生地花粉各二錢炙草一錢先以淡竹葉十枚粳米一合煎湯已就去竹葉與米入前藥加生薑八分棗二枚煎服或少人參以威參五六錢代之若大便溏泄者不用以沙參代之一五產後蓐勞蓐草荐也謂產婦坐草艱難以致過勞心力故曰蓐勞此即產後之勞瘵也其證或寒熱如瘧或午後熱五心熱或自汗喘促飲食不甘體瘦神昏皆其候也當以培補氣血為主若作標治危亡立至清熱養血湯新治產後血虛發熱午後更甚羸瘦無神等症當歸錢半熟地三錢生地二錢白芍酒炒阿膠炒青蒿麥冬各一錢丹皮錢半水煎溫服如五心熱加元參一錢如咳嗽加川貝母錢半款冬花一錢如吐血加紫菀錢半絲茅根搗汁半杯童便半杯合服如骨蒸加地骨皮錢半如熱甚加龜膠二三錢或用六味地黃加麥冬龜膠阿膠各二兩為丸服亦可若作水藥決不可六味地黃方見第二豬腰湯治產後勞熱咳嗽自汗頭痛腹痛俱效豬腰一對當歸白芍酒炒各一兩以藥煎就去滓次將豬腰細切同米一合香鼓一錢煮稀粥加蔥椒鹽空心日服一次神效黃雌雞湯治證同上當歸白朮熟地黃耆桂心各五錢黃雌雞一隻去頭足腸翅細切用水七碗煮至三碗每用汁一碗煎藥四錢日二服羊肉湯治產後氣血虛弱及寒氣入於子門臍下脹痛手不可犯此寒證也並治寒疝腹痛及脅痛裡急者精羯羊肉一斤當歸三兩生薑四兩用水七升入藥煎至三升去滓入羊肉加蔥椒鹽久煮日三服若寒甚者加生薑若痛多而嘔者加橘皮二兩白朮一兩如氣虛者加黃耆三兩母雞湯治產後褥勞虛汗不止人參隨便黃耆蜜炒白朮白茯苓麻黃根牡蠣煅各三錢上用母雞一隻去毛雜水六碗同藥煮至三碗任意服之十全大補湯方載上第二內治產後氣血俱虛一切不足等證補中益氣湯方載上第七內治產後虛弱或兼外感發熱者理陰煎方載上第三內治產後陽虛內寒及外邪皆寒者黃耆四物湯治產後氣血虛弱為補養妙藥黃耆蜜炒三錢當歸二錢熟地三五錢川芎錢半水煎溫服如氣虛加參朮茯苓炙草如發熱加炮乾薑五分如自汗少用川芎重加黃耆如口渴加麥冬一錢五味二分腹痛加白芍酒炒錢半當歸建中湯治產後虛勞腹痛身痛自汗不思飲食等證當歸二錢白芍酒炒錢半肉桂一錢研末調服黃耆蜜炒錢半薑棗引水煎就加飴糖一塊再煎溫服如嘔不加飴糖如崩中衄血加阿膠炒生地各錢半乳病門一六乳少婦人乳汁乃衝任氣血所化故下則為經上則為乳胃中津液之氣入於肺變赤為白稟肺金之色也有乳遲乳少者並有無乳者由氣血之不足也外有肥胖婦人痰氣壅盛乳滯不來者虛者補之如十全大補湯方載上第三內八珍湯方載上十四內之類是也滯者疏之如栝蔞仁天花粉葵子木通漏蘆豬蹄湯之類是也其有乳汁自出者屬胃氣虛宜補胃以斂之若未產而乳自出謂之乳泣生子多不育若產婦勞苦乳汁湧下此陽氣虛而厥也宜以補氣為主用補中益氣湯方載上第七內加附子豬蹄湯治氣血不足乳汁不下用八珍湯料一服加黃耆漏蘆陳皮木通先以豬蹄煮汁二碗煎藥服之或加花粉又方用豬蹄一對通草川芎各一兩甘草一錢穿山甲十四片炒同煎加蔥薑鹽料取汁飲之夏月不可失蓋時用蔥湯洗乳亦佳乳少用黃耆一兩當歸五錢白芷四錢以七孔豬蹄一對煮湯去油煎藥服之覆面睡即效若初生無乳只用水與酒煎服體壯者加紅花三分湧泉散治乳將至而未得通暢者王不留行穿山甲炮瞿麥麥冬龍骨各二錢共為末用豬蹄湯加酒調服二錢以木梳於乳上梳下或用豬蹄煎服亦妙一七乳病乳病不一有吹乳者因兒飲乳為口氣所吹致令乳汁不通而腫痛者不急治之多成乳癰栝蔞散治吹乳腫痛栝蔞仁當歸甘草各三錢乳香沒藥各一錢以水與酒各半煎服外以手揉之更令兒吮之有妒乳者因無兒飲乳或兒未能盡飲余乳蓄結作脹而痛寒熱交至等證用麥芽二兩炒熟水煎服又方用陳皮一兩甘草一錢水煎服又方用豬牙皂炒為末酒服一錢又方用皂角燒灰蛤粉各二錢酒調一錢服之一切乳病用貝母為末每服二錢酒調下有乳癰者屬膽胃二經熱毒壅滯初起腫痛肉色焮赤寒熱頭痛宜急散之否則成膿而不易愈矣人參敗毒散治乳癰初起發熱惡寒用此散之人參茯苓枳殼甘草川芎羌活獨活前胡柴胡桔梗姜引或用栝蔞散方在本條或加味逍遙散方在上第九內有乳岩者屬肝脾二臟鬱怒後氣血虧損初起小核結於乳內肉色如常或三年五年發作其人內熱肢體倦瘦月經不調用加味遺遙散方在上第九內栝蔞散方在本條多自消散若積久漸大巉巖色赤內潰深洞為難療但用歸脾湯等補藥多服可愈若誤用攻伐危殆迫矣是病初起用青皮甘草為末以白湯或少加薑汁調服以消為度外治仙方於初起時急用蔥白寸許生半夏一枚搗為丸以綿裹之患左塞右鼻患右塞左鼻每日更換日久可消乳頭生瘡汁出切痛用鹿角三分甘草一分為末和以雞子黃於銅器中溫熱敷之日再易即愈乳懸奇證產後瘀血上攻忽兩乳伸長如腸痛不可忍用當歸川芎各一斤濃煎湯不時溫服以瘥為度或再二斤三斤可也大凡乳證因恚怒者宜疏肝清熱焮痛寒熱宜發表散邪焮腫痛甚宜清肝消毒並隔蒜艾灸不作膿或膜不潰補氣血為主不收斂或膿稀補脾胃為主膿出反痛或發寒熱補氣血為主或晡熱內熱補血為主飲食少思或作嘔吐補胃為主飲食不化或作泄瀉補脾為主有孕婦患此名曰內吹所致之因則一惟用藥不可犯其胎耳備揀古來治乳病至簡至穩神方於後以便取用吹乳腫痛栝蔞一個乳香二錢酒煎服外用南星為末溫水調敷乳癰貝母二錢研末酒調服令兒吮之又方脂麻炒研燈盞油腳調敷又方𦼔葉燒灰酒服二錢又方用蔥汁酒引頓服以下五方治乳汁不通用貝母知母壯蠣粉等分研末豬蹄湯調服二錢又方姜蠶為末酒調服二錢少頃以脂麻煎茶一盞投之並梳頭數十遍又方用老絲瓜連子燒灰存性研末酒說服二錢被覆取汗又方用穿山甲炒研末酒服又方用牛鼻作羹食之無子飲乳作脹內服麥芽湯方在上外用布勒乳一夜乳頭綻裂用白茄子燒灰敷之一切乳病用真廣陳皮去白麵炒為末每用二錢少加麝酒調服初終皆效凡吹乳乳癰用連根蔥搗餅貼患處以瓦器盛熱水熨蔥上汗出即愈前陰門一八陰挺婦人陰中挺出或數寸或如菌如芝之類此有因鬱熱者有因氣陷者當憑脈之虛實而治之龍膽瀉肝湯方載上十四內治濕鬱而熱以致下墜者或用加味逍遙散固陰煎治陰虛滑脫以致下墜者補肝腎以升提之人參隨便熟地三五錢山藥炒棗皮錢半遠志炒七分炙草一錢五味十四粒菟絲子炒三錢磨末水煎空心服如虛墜而不應者加金櫻子肉二錢炒升麻一錢水楊湯治陰中生物或癢或痛甚而牽引腰腹痛者金毛狗脊五倍子枯礬魚腥草水楊根黃連各一兩共研末分四劑煎湯熏洗內服治挺諸藥一九陰腫婦人陰腫大都即陰挺之類然挺者多虛腫者多熱加味道遙散方載上第九內治肝腎虛熱而腫者補中益氣湯方載上第七內治氣虛陷而腫者或加赤芍生地各二錢一方用枳殼半斤研末炒熱以帛裹熨之又用乘熱裹少許納陰中冷即易之三次愈又方用小麥朴硝五倍子白礬蔥白煎湯浸洗又方用甘菊苗葉搗爛以百沸湯淋汁熏洗又方牛膝煮酒服外用蛇床子煎水熏洗炒鹽帛裹熨之產後腫痛桃仁略燒搗爛敷之然亦不必治腫但調氣血而腫自退一一陰瘡此證多由濕熱下注或七情鬱火或中淫藥熱毒其病或生蟲濕癢或內潰腫痛或體倦發熱或飲食不甘或小腹痞脹凡治此之法以燥濕清熱解毒為主芍藥蒺藜煎治濕熱陰瘡及遍身瘡疹紅腫熱毒或內潰爛者無不神效肌草梔子黃芩木通澤瀉各錢半白芍生地各二錢白蒺藜連刺捶碎五錢甚者一兩水煎服如火不甚者去膽草梔子加當歸茯苓苡仁之屬如濕毒之甚者加土茯苓五錢或一二兩或用四物湯加梔子丹皮膽草荊芥或用加味逍遙散亦可蛇蛻散治婦人陰瘡先用荊芥蛇床子煎湯熏洗挹干敷藥蛇蛻燒存性一條枯礬黃丹扁蓄藁本各二錢硫黃荊芥穗蛇床子各一錢三分共為細末香油調搽濕則乾摻又方海螵蛸人中白煅等分研末摻之干則以麻油調敷或以蜜水調敷若痛甚者加冰片少許若膿水甚者加陀僧等分或煅制爐甘石更佳一一一陰癢陰癢由濕熱生蟲微則癢甚則痛或為膿水淋瀝名之曰䘌龍膽瀉肝湯方載上十四內治肝經濕熱以致陰癢及加味逍遙散亦效方載上第九內外用杏仁用紅灰煨大楓子肉各二錢搗化少加麻油數滴納入陰中二三次即愈仙方也若甚而有蟲用豬肝雞肝以麻油煎熟納陰中引淨其蟲乃愈陰癢突出用臭椿樹皮荊芥穗藿香等分煎水熏洗癢止而突入治疳蟲下觸鶴蝨煎湯熏洗隨用水銀蒲黃研勻納入又方用桃葉搗納陰中日易三次又方用蛇床子一兩白礬五錢煎湯洗又方用花椒吳茱萸蛇床子各一兩藜蘆五錢陳茶一撮炒鹽一兩煎湯乘熱熏洗三次愈陰觸用海螵蛸研末敷之又方用荊芥皂角牆頭上腐草煎湯洗內用各肝煎熟納入一一二陰冷陰冷有真寒證陽虛畏寒小便清長者是也有假寒證小便黃澀大便燥結口舌乾苦者是也真寒者宜補其陽如理陰煎方載上第三內或用十補丸治腎臟虛冶及足寒耳聾膝軟腰痛等證附子制五味微炒各二兩山藥棗皮桂心鹿茸各兩半丹皮茯苓各七錢澤瀉六錢蜜丸鹽湯下假寒者宜清火宜龍膽瀉肝湯方載上十四內及加味逍遙散方載上第九內均治假熱陰冷大營煎治肝腎虛寒陰冷及婦人經遲血少腰膝筋骨疼痛當歸二三錢熟地五七錢枸杞二錢炙甘草杜仲鹽炒牛膝酒蒸各錢半肉桂一二錢寒甚者加附子二三錢水煎服假熱拒格者冰冷服外治如吳茱萸川椒或丁香蛇床子之類皆可炒熱綿裹塞之一一三陰吹陰中有氣從內吹出乃胃氣下泄也用豬膏煎亂髮至化服之病從小便出藥若難服用開水參清可也一一四下胎斷產下胎斷產本非仁者之事然有婦人臨產艱危者或病甚不勝產育者或有欲自下而庶可以得生者則下胎斷產之法有不得已亦不可廢者也古有用水銀斑蟊之屬母亦傷矣決不可依下胎方桂心散治妊娠因病胎不能安者可下之桂心栝蔞牛膝瞿麥各錢半當歸三錢水煎服扶羸小品方治虛弱人慾下胎宜用此人參甘草川芎肉桂乾薑桃仁黃芩蟹爪各一錢二分水煎服未動再服下胎單方桂心二錢麝香三分共為末酒調下死胎亦下又方麥芽四兩擂碎水四碗煮二碗服之立下神效又方用牛膝一兩酒煎服即下又方用牛膝五六根安麝香二三分於中納陰戶一夜自下又方用蓖麻仁二個巴豆一個麝香一分研貼臍中並足心生胎死胎俱下又方用茶湯入沙糖二錢露一宿服胎至三月亦下斷產方四物湯一大劑加芸臺子一撮即油菜子或加紅花四五分水煎經後服則不受胎又方蠶蛻紙約一二尺燒灰存性為末空心酒調服終身不受胎又方白麵曲五兩酒煮濾去滓分作三服經至日晚五更及天明各吃一服可終身無孕矣又方於臍下二寸三分陰動脈處灸三壯清油燈火可以斷產
