body:
  text: 卷之八雜證十六論反胃噎膈經曰三陽結謂之膈三陽者大腸小腸膀胱也結者謂熱結也大腸主津小腸主液大腸熱結則津涸小腸熱結則液燥膀胱為州都之官津液藏焉膀胱熱結則津液竭矣然而三陽何以致熱結皆腎之病也蓋腎主五液與膀胱為一臟一腑腎水既干則陽火偏盛煎熬津液變而為痰初則痰火未結咽膈乾燥飲食不得流通則為噎膈久則痰火已結胃之上脘不開飲食難下停滯膈間須臾便出謂之嘔吐至於飲食雖進停滯胃中而胃之下脘不開良久方出謂之反胃腎又主二便三陽熱結前後亦必閉澀下既不通必反於上所以或久或暫復吐原物雖屬胃病實由命門火衰腎經虛寒之病而水不能灌溉而然也斯時方欲健脾理痰恐燥劑有妨於津液方欲養血生津恐潤劑有礙於中州若泥於舒郁快膈則辛香助火散氣耗血胃中之汁速干去死不遠矣夫噎塞由於津液乾槁故莫如養血養血又莫如滋陰六味丸是也反胃由於胃脘虛寒故莫如辛溫辛溫則不如補火八味丸是也但此方惟於病初起時丸藥可下急為救本可也若丸不能下或下而復反此時改用湯劑有所不可蓋欲入下補腎不如先滯中州濕脾又不如用後桂附散或可挽回大凡人得此病者治之宜早以真火有根培之則活若熱湯入而水與痰即刻逆上吐出冰冷者是火絕矣雖用桂附亦何益哉王太璞云食不得入是有火也予謂是無水也以津液干竭故耳至於所言食入反出是無火也此說中綮但脈大有力當作熱治脈小無力當作寒醫以脈合症審其陰陽火盛者當以養血為急勿用涼藥脾傷陰盛者宜以溫補為重勿用燥劑變動因心不可偏執也黃帝針經云胃病者膈咽不通飲食不下咽者咽物之門戶膈者心肺之分野不通者腎肝吸入之陰氣不得下而反在上病在胃也夫胃病者平日氣血虧損復因悲思憂慮則脾胃受傷血液漸耗胃脘乾澀飲食難進噎寒所由成也脾胃虛傷運行失職不能熟腐五穀變化精微食入復出反胃所由成也二者在膈間受病故通名為膈經曰人迎四倍以上為格陽寸口四倍以上為關陰關格者內經以脈論非言病也究之陰陽偏盛之極為孤陽之逆候實真陰之敗竭也論脈論病議雖不同而為害則一諸家以關格為病名可顧名而思義矣凡人入房太甚只有孤陽大宜養陰為主絕嗜欲戒惱怒薄滋味卻思慮外治以藥餌庶可挽回而壽終矣論脈脈弦者為中虛浮大者為陰虛屬腎水大虧有陽無陰也數而無力或澀小為血虛沉緩無力或大而弱為氣虛緊而滑者吐逆弱小而澀者反胃弦滑為痰寸緊尺澀胸滿而吐革則吐逆死症年五旬難治能調治保養亦有生者糞如羊屎者不治食少滓盡腸已干矣吐白沫者不治飲水上騰脾敗不化也胸腹嘈痛者死營虛血枯也潤燥湯新治噎塞而食不下者火燥而津液枯也宜養血以潤之當歸二錢熟地再用薑汁入瓷器內炒乾二錢麥冬去心炒一錢陳皮去白八分威參四錢白豆蔻去殼炒研八分肉蓯蓉錢半水煎加牛乳白蜜竹瀝薑汁各四五匙合服每用半杯頻頻服之不得間斷或食稀粥或豬肉湯羊肉湯至於飯食雞鴨炙爆之類忌之如是者調養幾月待津液一足方可無虞服藥而有氣不足者加人參最妙否則或加沙參黃耆之類但由輕而重不得頓加桂附散新治飲食一下痰水同吐多而且冷藥下亦吐火將熄矣上肉桂去粗三錢製附子或用生者焙乾三錢乾薑炒黃一錢白豆蔻肉炒一錢共研極細末時常挑於口中以火酒運下潤腸化瘀湯治死血在膈大便燥脈吼症實當歸三錢生地錢半乾漆炒煙盡二錢大黃酒煨錢半陳皮一錢枳殼炒一錢威參四錢紅花酒炒七分桃仁去皮尖一錢水煎入酒韭汁服香砂寬中湯治氣滯胸痞胃寒嘔吐木香生磨三分白朮錢半茯苓厚朴姜炒各一錢陳皮去白檳榔白豆蔻肉炒研半夏各八分青皮六分甘草三分香附砂仁各七分生薑一錢水煎入蜜五六匙合服四逆湯治裡寒外熱面赤煩躁口渴乾嘔脈微欲絕附子一枚生用乾薑炒一兩甘草炙二錢水煎冰冷服代赭旋覆湯治胃氣弱而上逆心下痞硬並反胃噎食俱妙代赭石煅醋淬二錢半旋覆花即金沸草七錢半甘草炙四錢半夏一兩生薑一兩紅棗三枚水煎溫服加人參更妙生薑汁煎治噎食不下咽喉閉塞胸膈煩悶生薑自然汁六兩牛乳五兩百合二兩加人參更妙共入銅銚內慢火熬成膏常用二匙嚥下香砂六君子湯治脾胃虛寒飲食一下即帶冷痰水退出人參少者以沙參或條參三五錢代之白朮錢半茯苓二錢甘草炙一錢陳皮去白藿香各一錢法半夏薑汁炒錢半砂仁去殼微炒搗碎八分煨姜一錢水煎服如下喉即吐者加桔梗一錢胃寒者加乾薑一錢氣滯者加香附童便炒六分兼血燥者加當歸錢半白蜜三錢若中焦胃不納者加石菖蒲微炒白豆蔻仁微炒搗碎八分但要順取流水煎服凡上焦之噎膈其責在脾下焦之閉結其責在腎治脾者宜從溫養治腎者宜從滋潤二法盡之矣大營煎治噎膈便結陰虛無火者此血燥也當歸二三錢熟地三錢枸杞二錢炙草一錢杜仲錢半牛膝酒蒸錢半肉桂一二錢肉蓯蓉三錢酒洗水煎服如氣虛者加人參若中氣虛寒嘔惡者加炒乾姜一錢如干燥之甚者加蜜糖三四錢生威參七八錢得大便潤而下之早服八味午服六君子湯如氣血未至大虛而下焦脹閉之甚者則不得不暫為通之千金潤下丸治大便燥結脹悶之甚而脈未至大虛者大麻仁微炒一兩郁李仁泡去皮菟絲子酒蒸枳殼麩炒牛膝酒浸山藥車前子各七分肉蓯蓉酒洗兩半威參蜜蒸二兩大黃酒蒸二兩陳皮去白五錢桃仁去皮五錢先將威參大黃杵成膏後加藥末煉蜜為丸白湯送下四十丸早晚各一服若腸潤而肛門緊用豬膽汁少加皂角末和以導之便下宜止即服滋陰養胃之劑以扶其本備揀古來治膈至簡至穩神方於後以便取用柿餅燒灰存性酒調服一錢日三服或以柿餅於飯上蒸熟同乾飯食之旬日愈有三世死於反胃者得此方救噎食不納用蓽澄茄白豆蔻肉為末干舐之噎塞膈滯用威靈仙四錢醋蜜煎服痰吐即愈喘咳嘔逆全不入食用威靈仙焙乾半夏薑汁炒等分為末皂角熬膏糊丸綠豆大每服七丸日三服一月愈丸即止噎塞吐食以胃脘停有痰血之類故胸中刺痛用韭汁入鹽滷少許細呷得入漸加定吐稠痰而愈若反胃加薑汁牛乳反胃吐食七八日不大便者死用水牛喉一條去兩頭並筋膜節節取下米醋一碗浸之微火炙乾再浸再炙以醋盡為度研末密收或潮濕以微火烘之再收遇有此病每用錢余陳米湯調下輕者一服立效反胃用石灰熱薑汁泡之淬炒附子三次合丁香粟米煎服或為末舐服脾寒反胃用白豆蔻肉丁香砂仁陳米等分為末薑汁糊丸服胃虛食少用蓽澄茄一兩神麯三錢炒黃薑汁糊丸薑湯送下膈噎揀蒲公英高尺許者掘下數尺根大如拳搗汁酒服如神噎膈是胃槁也服香燥藥必破氣燥血是速其死也惟飲牛乳加薑汁陳酒或加韭汁熟蜜兼服四物湯為上策不可服人乳以有五味之毒七情之火也反胃吐食不拘男女遠年近月用五靈脂有溏心者真為末黃狗膽汁和丸三錢重一粒每用一粒好酒半盞磨化服三服即效十七論痞滿痞者痞塞不開而內則不見脹也滿者脹滿不消而內則常苦脹也二者有虛實之辨實痞者有邪有滯實滿者有脹有痛治者散之消之虛痞者無邪無滯虛滿者無脹無痛治者溫之補之此而誤認多致誤人治中湯治脾胃虛寒雖無脹悶但不知飢亦不欲食脈弱氣怯不得妄用消耗再損胃氣人參少者以山藥三錢炒黃代之白朮錢半甘草炙乾薑炒陳皮去白各一錢青皮六七分溫服如嘔逆加半夏錢半如脾胃虛弱似滿不食宜異功散人參白朮茯苓炙草陳皮如心脾氣虛或氣不順者宜歸脾湯方載脾胃門如中焦不暖或噯腐或吞酸宜溫胃湯方見脾胃門厚朴溫中湯治脾胃寒滯或傷生命心腹痞滿疼痛厚朴姜炒陳皮去白乾薑炒茯苓各一錢草豆蔻八分木香甘草各五分溫服河間厚朴湯治大便氣秘上下不通胸腹痞滿厚朴錢半白朮二錢半夏枳殼陳皮甘草各一錢薑棗引如大便不通加大黃一二錢大和中飲治飲食留滯痞滿或疼痛者陳皮錢半枳實一錢砂仁五分山楂麥芽炒各二錢厚朴姜炒澤瀉各錢半溫服如脹甚者加白芥子如胃寒噁心者加炮乾薑痛者加木香烏藥香附之屬平胃散治濕滯痞滿厚朴姜炒陳皮去白各錢半蒼朮二錢甘草一錢薑棗引如小便不利加茯苓澤瀉如氣脹而痛加木香枳實弱者更枳殼凡寒邪外感淺而在經飲食如常稍深犯胃即不能食是亦痞之類也治此者宜照傷寒門但解外邪而症自愈又傷寒陽症在表而妄下之以攻其里及陰症而下之早者以致邪氣乘虛而入實者硬滿而痛是為結胸虛者滿而不痛是為痞氣宜審別治之治法詳傷寒結胸條備揀古來論痞滿治法於後以便取用丹溪曰痞滿與脹滿不同脹滿內脹而外亦有形痞則內覺痞悶而外無形也蓋由脾氣之虛不能運化精微而為痞者宜以溫補為主至於誤下食滯濕邪已詳於上玉機云痞滿之病人皆知氣之不運也獨東垣以血病言之謂下多亡陰其血損也凡於下後當察及之劉厚宗曰古方治痞用芩連枳實之苦以瀉之厚朴生薑半夏之辛以散之人參白朮之甘溫以補之茯苓澤瀉之鹹淡以滲之隨其病之所在以調之也痞而有濕惟宜上下分消其氣果有內實之症庶可略與疏導世人苦於痞塞喜行利藥以求速效暫時通快痞若再作益以滋甚是不知夫下多亡陰之意也蓋治痞宜補脾健胃有塞因塞用之妙法在焉外治痞方用大黃朴硝各一兩為末以大蒜同搗膏貼之又方先用蕎麥麵和成條量痞大小圍住以麝二三分摻肉上次以阿魏一二錢鋪上再用芒硝一二兩蓋之隨以青布隔藥上燒熱磚四五塊輪流布上熨之覺腹中氣行寬快即是痞消之效內須服調養氣血之藥十八論噁心噁心者胃口作逆兀兀欲吐欲嘔之狀或又不能嘔吐覺難刻過此曰噁心而實胃口之病也其症之因則有寒有食有痰有宿水有火邪有穢氣所觸有陰濕傷胃或傷寒瘧痢諸邪之在胃口者皆能致之能察其虛實二者則得其源矣實邪惡心者其來速其去亦速邪去則止虛邪惡心者必得胃氣復者方愈且此症之虛者十居八九即有挾食挾痰之實邪亦必由脾氣不健不能運化而然治者當知實中有虛勿得妄行攻擊以傷胃氣也六君子湯治胃虛生痰或兼吞酸噯腐噁心者人參少者山藥炒黃三四錢代之白朮二錢茯苓錢半甘草炙一錢陳皮去白半夏各錢半生薑一錢紅棗三枚溫服如上焦脹悶或宿水痰滯者宜用此藥探而嘔之如愛熱熨滾湯者加炮乾薑一二錢如自利咽吐者加炮乾薑一錢附子一錢如噁心或兼腹痛脹滿者加藿香砂仁白豆蔻木香之屬如兼外感寒邪者加桂枝姜砂二陳湯新治胃寒脹滿或傷生冷或寒痰滯塞噁心等症乾薑炒一二錢砂仁炒七八分陳皮去白半夏茯苓各錢半炙甘草七分溫服如氣滯不快者加厚朴如傷濕者加蒼朮如食滯者加神麯麥芽山楂之屬如宿食宿水在上焦者宜用此湯探而吐之或用鹽炒紅淬水服探吐最妙調氣平胃散治穢氣感觸或冒寒邪脹滿腹痛噁心等症厚朴姜炒陳皮蒼朮各錢半甘草白豆蔻去殼微炒砂仁檀香藿香各八分生薑引溫服竹葉石膏湯治感冒暑熱火盛煩躁噁心石膏煅四五錢淡竹葉桔梗薄荷木通甘草各一錢十九論脾胃兼飲食人之始生本乎精血以立形體之基其司在命門人之既生養以水穀以成形體之旺其司在脾胃胃主納脾主運經曰脾胃者倉廩之官五味出焉又曰人受氣於谷谷入於胃以傳於肺五臟六腑皆以受氣所謂陽明者十二經脈之長也人或先天有不足者但得後天培養之力則補先天之功亦可居其強半此脾胃之所關於人者為甚重也而人之傷其脾胃者有二其傷於外也惟勞苦最能傷脾脾傷則表裡相通而胃亦受其困矣其傷於內者惟憂思忿怒最為傷心心傷則母子相關而化源隔絕者為甚此勞倦情志之傷較之飲食寒暑為更多也脾胃屬土惡寒喜暖使非真有火邪則寒涼之物最宜慎用昔柳公度善攝生以致壽嘗曰我不以氣海熟生物暖冷物亦不以元氣佐喜怒也此真善養脾胃者也然則人之元氣充盈由於脾胃健旺而諸病悉除惟覺之早者得之耳論東垣補中益氣湯以治勞傷感寒發熱及脾氣下陷或陽虛痎瘧可也若全無表邪寒熱而但有中氣虧甚者大忌升柴蓋以味苦寒而性疏散當此大虛之時止宜純補而再兼疏散安望成功至於表疏自汗者陰虛發熱者脾肺虛甚氣促似喘者命門火衰而虛寒泄瀉者水虧火亢而吐血衄血者四肢厥逆而陽虛欲脫者皆不可用若無人參則更有不可用者矣凡欲補土者當先補火亦有二焉如不思飲食此屬陽明胃土受病須補少陰君火歸脾湯是也如人能食而不能化此屬太陰脾土受病須補少陽相火八味丸是也蓋補腎中之火以生土也補腎中之水以滋土也使徒以辛香燥熱之物以為助脾開胃豈知太陰濕土全仗以濕為用乎如土得春夏時雨而生化之妙以成凡飲食積滯必用消導客垢不除則真元不復如戡亂後方可以致太平積在上者吐之在中下者下之若積因於脾虛不能健運藥力者或消補並行或補多消少或先補後消潔古所謂養正而積自除故前人必假參朮贊助以成功也不得專行攻積以傷元氣而積愈滯速其危矣內有積聚門所當參閱凡五臟之邪皆通脾胃治者當知權宜如肝邪之犯脾者肝脾俱實單宜平肝肝弱脾強舍肝而治脾也心邪之犯脾者心火熾盛清火為急心火不足補火以生脾也肺邪之犯脾者肺氣壅塞當瀉肺以疏脾之滯肺氣不足當補肺以防脾之虛腎邪之犯脾者脾虛則水能反克救脾為主腎虛則啟閉無權壯水為先至若胃不能納脾不能運大虛之症即速用十全大補六味回陽尤恐不及而尚欲以楂枳曲芽為永賴乎是以脾胃受傷但使能去其傷者即是脾胃之藥此中理與機圓姑舉此以見其概也凡吐瀉之後惡聞食氣或外脹而內不脹此脾氣虛極宜用溫胃湯或理中湯加附子之類凡虛在下焦陰中無陽不能生土宜附子理陰煎凡善食而瘦者多因有火火微者清之如生地白芍麥冬竹葉黃芩知母之類若火甚者或隨食隨飢或膚熱便結宜石膏梔子黃柏苦參之屬然陽盛者陰必虛滋陰之藥須宜兼用又有不能食而瘦者必脾胃虛弱宜四君子歸脾湯之類兼寒者宜理中命門火衰者宜右歸丸八味地黃之類主之凡有喜食茶葉生米者胃有伏火也自脈症有火象當用滋陰清火之藥又有喜食炭者胃寒而濕也詳察脈症宜以健脾溫胃為主補脾化食湯新治一切飲食停滯胸腹脹痛氣口脈獨沉大者蒼朮錢半厚朴姜炒陳皮甘草麥芽炒山楂神麯炒枳殼各一錢砂仁藿香桂枝各八分廣香三分茯苓錢半溫服如宿食在胸者用此湯服一碗以指探喉取吐再服再吐以盡為度若在中下焦脹痛拒按者加生大黃三四錢下之不應加芒硝二錢下後即須補脾藥一二劑未盡仍復下之余有化食新方在積聚門可用歸脾湯治思慮傷脾不思飲食或少食即脹或火不生土而時食時吐是虛症也不得用開胃消導之劑以再傷脾胃人參無者以山藥炒黃三錢代之黃耆蜜炙白朮茯神當歸各二錢棗仁炒八分遠志八分甘草炙五分廣木香三分龍眼肉七枚食遠服如氣虛血動而無鬱結疼痛者去木香以避燥散加陳皮代之如脾虛屢補而仍不愛飲食者必脾虛有火右關脈沉滑加土炒黃連六七分如大便不實常吐冷痰加炒乾姜一錢如食滯作脹加炒神麯七八分如脾虛泄瀉加吳茱萸六分肉豆蔻麵包煨熟一錢或再加烏梅二個如胃口不開而食不下者加草豆蔻仁炒研六七分芍藥枳朮丸治胃氣不清不思飲食或食滯脹痛大人小兒俱治白朮二兩赤芍酒炒二兩枳實麵炒一兩陳皮一兩荷葉煎湯煮老米粥為丸米飲下或開水下如臟寒加炒乾姜五錢苓朮散新治欲食過傷腹脹有積或起青筋身體消瘦人參隨便白朮二兩茯苓兩半苡仁炒芡實炒白扁豆炒各一兩淮藥炒一兩陳皮五錢砂仁炒七錢桔梗六錢神麯炒七錢甘草炙谷蟲各四錢白蓮肉去心炒一兩陳米微火炒黃用水淬去水再炒一兩三錢共研細末加白糖少許不次用開水調服如有蟲加使君子肉八錢川椒皮微炒三四錢溫胃湯新治飲食傷脾或吐或瀉或困倦多汗六脈豁大無神此大虛之候速宜溫補即病去後不思食者以陽氣未舒陰翳作滯亦宜用此人參白朮二錢扁豆炒二錢茯苓一錢甘草炙八分砂仁炒五分淮藥炒二錢當歸錢半泄者不用藿香六分陳皮七分乾薑炒一二錢生薑八分蓮肉炒二錢紅棗三枚食遠服如泄甚者加肉豆蔻麵煨一二錢陽虛下脫不固者加附子二錢烏梅二個腹痛者加白芍酒炒錢半如氣滯服痛者加木香白芥子之屬順氣化滯湯新治過食飲食暴傷生命以致腹痛脹滿或嘔或瀉者此脾虛而氣滯也欲化食者須當理氣厚朴姜炒一錢陳皮藿香香附烏藥砂仁炒各一錢二分廣香五分白芥子炒研八分山楂麥芽炒神麯炒各一錢蒼朮一錢熱服如感外寒者加桂枝一錢如內寒滯痛者加炮乾薑吳茱萸各七八分如嘔而兼痛者加半夏錢半丁香四分附子理陰煎治虛在下焦陰中無陽此滋陰補火脾土乃旺熟地五七錢當歸二三錢甘草炙一二錢乾薑炒一二錢肉桂錢半附子一二錢溫服如水泛為痰或嘔或脹加茯苓錢半或加白芥子五分以行之凡脾腎中虛等症宜剛燥者用理中欲溫潤者用理陰須調補者當先察此備揀古來治脾胃諸病至簡至穩神方於後以便取用胃脘痛當心垂死藥入即吐或大便不通用元胡索三錢為末酒調下即止心脾脹痛服醒脾藥反脹者用莪朮麵包煨研末水酒與醋煎服立愈以能破氣中之血也婦人多有是病胃脘蟲痛良薑酒浸香附醋浸各焙各研以蟲因怒因寒而起也困怒者香附二錢良薑一錢因寒者香附一錢良薑二錢米飲調加生薑汁一匙鹽少許服之飯飽心悶用開水吞川椒皮二十粒食即作痛胃中有蟲用蕪荑和麵炒黃為末米飲下食後又飢用綠豆糯米小麥各一升炒熟為末滾水調服凡脾胃痛此與腹痛門霍亂門單方俱可參閱用之二十論痰飲有濕痰燥痰風痰熱痰寒痰老痰頑痰有痰飲懸飲溢飲支飲伏飲人稟陰陽二氣以生有清有濁陽之清者為元氣陽之濁者即為火陰之清者為津液陰之濁者即為痰故痰者乃津液不清熏蒸結聚而成者也夫飲入於胃遊溢清氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行何痰之有惟脾虛不能致精於肺下輸水道則清者難升濁者難降留滯中膈瘀而成痰是脾為生痰之源故治痰先治脾脾復健運之常而痰自化矣雖然人但知痰之標在脾而不知痰之本在腎腎有陰陽陰虛則水泛為痰痰清而稀陰虛則火動火結為痰痰稠而濁稠者為痰稀者為飲痰有五飲亦有五症各不同治法迥殊條列分治於後至於脾肺二家之痰尤不可混脾為濕土喜溫燥而惡寒故二朮星夏為要藥肺為燥金喜涼潤而惡燥故二冬地黃桔梗為要藥又毋過於寒涼以傷脾土中帶脾藥以生肺金方為善治故曰治痰不理脾胃非其治也然脾有虛實之分如濕滯太過者脾之實也土衰不能制水者脾之虛也至於腎不是火衰不能生土即是水虧而虛火上炎以爍肺只有虛焉而已可不知乎脈候肝脈軟而散色澤者病溢飲偏弦者為飲浮滑者為飲沉而滑者懸飲飲脈皆弦微沉滑左右關脈實而滑者膈上有痰可吐眼胞及眼下如煙煤者痰也痰得澀脈難愈加味二陳湯新治脾經濕滯痰甚而脈弦滑者半夏二錢半茯苓三錢陳皮二錢甘草一錢蒼本一錢三分桔梗一錢姜六分棗一枚水煎服若嘔吐吞酸胃脘痛呃逆加丁香九粒若胸膈不快加香附八分枳殼一錢食滯加神麯一錢麻桂二陳湯新治外冒風寒痰嗽寒熱頭痛身疼鼻塞聲重陳皮錢半半夏二錢茯苓二錢甘草一錢桔梗錢半枳殼一錢蒼朮錢半厚朴姜炒一錢麻黃五七分桂枝一錢白芷一錢川芎一錢黃芩一錢防風一錢姜五分水煎熱服頭痛加北細辛三分如體虛者加當歸一錢三分白芍七分有汗者去麻黃即久咳不止者去桂枝加杏仁去皮尖十三粒亦效歸脾湯治脾虛生痰其痰易來或滿口痰水或夜間更甚人參一錢無者以山藥炒黃三錢代之黃耆蜜炙白朮茯苓各二錢棗仁炒錢半遠志當歸各一錢甘草炙一錢木香三分加圓眼七枚蓮肉九粒煎服傷肉食者加山楂肉錢半即六君子湯亦妙如胃虛兼有寒者上二方加乾薑炒焦一錢如脾經有濕者加半夏姜炒二錢元芩二陳湯新治痰多夜甚脾濕及肺有微火者陳皮錢半半夏二錢茯苓二錢甘草一錢元參一錢三分黃芩二錢連翹一錢馬兜鈴五分水煎服加枳殼桔梗各一錢更佳補陰益脾湯新治勞極傷脾則食少噁心疲極又傷肝腎則水液妄行此命門火衰不能以生土也白朮二錢陳皮一錢山藥錢半茯苓一錢二分熟地三錢當歸二錢甘草炙一錢附子錢半乾薑炒八分水煎服若虛陽上燥者冰冷服即八味地黃丸亦為正治清燥湯治肺被火爍咳痰不來喉癢便燥脈不虛者天冬二錢麥冬二錢白芍一錢貝母錢半炒研款冬花一錢三分甘草一錢百合二錢當歸錢半生地二錢梔仁一錢丹皮一錢桔梗錢半水煎服如干燥喘嗽者加熟地三錢小胃丹上可去胸膈之痰下可去腸胃之痰芫花大戟甘遂麵裹煨各五錢黃柏炒焦一兩大黃酒蒸兩半上為細末粥糊丸麻子大每服二三十丸用白湯一口送下即睡以動膈上之濕痰熱積欲利下則空心服之病久體虛者以人參或白朮煎湯下之滾痰丸治一切濕熱食積等痰窠囊老痰礞石煅黃一兩大黃酒蒸四兩黃芩四兩沉香三錢上為細末水丸每服三五十丸即仰臥令藥徐徐而下服後須半日勿飲食起坐必使上焦痰積過膈入腹然後動作方能中病或病甚者多服無妨化痰丸潤燥開鬱降火消痰治老痰鬱痰結成黏塊凝滯喉間肺氣不清吐咯不出因火邪上炎而結也惟緩治乃效天冬去心黃芩酒炒海石另研栝蔞仁去油橘紅各一兩連翹香附淡鹽水浸炒桔梗各五錢青黛飛去泥沙另研芒硝另研各三錢上為細末蜜丸綠豆大淡薑湯送下五六十丸此等老痰好酒人多有之肺與胃脘皆火邪所熬而成此方天冬黃芩瀉肺火海石芒硝咸以軟堅栝蔞潤肺消痰香附連翹開鬱降火青黛去鬱火故不用辛燥等藥千緡湯治痰喘不得臥人扶而坐一服即安半夏炮七個甘草炙皂角炙各一寸生薑一大指水煎服加味補中益氣湯治氣虛痰甚若不固中氣以運痰而再攻之則胃氣虛痰愈甚矣人參黃耆蜜炙白朮甘草炙各錢半當歸一錢陳皮五分升麻蜜炒柴胡酒炒各三分茯苓錢半半夏二錢姜五分棗二枚水煎服有無力服參者或以山藥三錢炒黃代之或以目今所出北條參三錢代之權宜用之而已五痰五飲分析症治但宜酌虛實用之不得泥執而不化也脾經曰濕痰脈緩體重腹脹食滯其痰滑而易出二陳湯虛者六君子湯肺經曰燥痰脈澀氣上喘促惡寒其痰澀而難出利金湯潤肺飲肝經曰風痰脈弦燥怒二便秘澀其痰青而多泡防風丸川芎丸心經曰熱痰脈洪煩熱心痛口燥其痰堅而成塊小黃丸大黃丸腎經曰寒痰脈沉心怖足寒而厥其痰稀有黑點胡椒理中丸八味地黃丸痰飲水走腸間轆轆有聲心下極冷其體忽瘦桂苓甘術湯主之懸飲飲後水流在脅下咳唾引痛十棗湯下之溢飲欽水流於四肢當汗不汗身體疼重大青龍湯汗之支飲咳逆喘促不得臥其形如腫五苓散澤瀉湯利之伏飲膈滿嘔吐喘咳惡寒背痛多淚倍術丸更有一種非痰非飲時吐白沫不甚稠黏此脾虛不能約束津液宜六君子湯加益智仁以攝之二陳湯治脾經濕痰除肺經燥痰腎經虛痰不用之外凡一切痰病俱用為主治陳皮二錢半夏三錢茯苓二錢甘草錢半姜一錢水煎熱服六君子湯治脾胃虛弱痰飲甚者人參白朮茯苓各一錢半夏陳皮去白各錢半甘草炙五分姜五片水煎服若痰滯氣逆加木香利金湯治肺經氣壅咳痰枯梗貝母炒陳皮去白各二錢枳殼麩炒八分茯苓錢半甘草五分姜三片水煎服潤肺飲治肺經火邪燥咳氣喘喉癢痰澀貝母糯米拌炒天花粉各三錢桔梗一錢甘草五分麥冬橘紅茯苓各錢半生地二錢半知母酒炒七分姜三片水煎服防風丸治肝經一切風痰防風川芎天麻酒浸一夜甘草各二兩硃砂三錢細研水飛為衣上為細末蜜丸重錢半每服一丸荊芥湯化下川芎丸治肝經風痰清上利膈川芎蘇薄荷葉各三兩半防風一兩二錢細辛二錢半蜜丸每丸五分重臨臥茶嚼下小黃丸治心經熱痰煩躁心痛南星半夏黃芩等分上為末薑湯為丸白湯下七八十丸大黃丸治症同上而重者天花粉黃連各三兩為末竹葉煎湯糊丸每服三錢薑湯下胡椒理中丸治腎經寒痰心怖寒厥不思飲食款冬花去梗胡椒蓽茇甘草良薑各二兩細辛八錢陳皮乾薑炒各一兩白朮三兩為末蜜丸米飲下三十丸按此方純陽寒重可服此脾病則宜若腎經虛寒當用八味地黃丸桂苓甘術湯治腸有水聲心下極冷茯苓四錢桂枝錢半白朮三錢甘草一錢水煎服十棗湯治脅下有水咳唾引痛芫花甘遂大戟等分水煎大棗十枚取八分入藥七分平旦溫服若不效再服五分大青龍湯治水流四肢身體疼重麻黃二錢去節桂枝一錢甘草一錢石膏三錢姜一錢棗一枚水煎服澤瀉湯治咳逆難睡其形如腫白朮一兩澤瀉八錢水煎服倍術丸治咳喘嘔吐惡寒背痛白朮二兩肉桂乾薑炒各一兩蜜丸每服三十丸米飲下並治五飲俱效備揀古來治痰至筒至穩神方於後以便取用痰因表者汗之因里者下之挾濕者分利之痰在膈上必用吐法膠固稠濁之痰吐之可開痰在經絡中非吐不可吐中有發散之義吐法用鹽四五錢於鍋中炒紅色乃入以水煮至將滾之際試味稍淡每用半碗飲之漸次增飲自然發吐以去病而止痰在腸胃間可下痰在四肢惟竹瀝能達痰在脅下惟白芥子能除痰在皮裡膜外非薑汁竹瀝不能達熱痰火痰宜青黛黃芩花粉連翹石膏之屬火炎上者用流霞膏方載於後老痰宜海石栝蔞貝母兼火盛膠固者化痰丸方載於前實痰火痰宜滾痰丸方載於前最效但不宜多用風痰用南星白附子濕痰用蒼朮白朮半夏茯苓澤瀉食積痰用神麯麥芽山楂酒痰用花粉黃連白朮砂仁或五苓散四苓散分利之痰核在咽喉咯唾不出者於化痰藥中加栝蔞海石朴硝海藻佐以薑汁荊瀝治痰速效能食者用之竹瀝非薑汁不能行經絡二瀝佐以薑汁治經絡之痰最效痰中帶血者宜加韭汁海石熱痰能清濕痰能燥堅痰能軟頑痰能消可入丸藥可入煎藥南星半夏治風痰濕痰石膏墮痰火極效黃芩治熱痰假其下行也枳實治痰有沖牆倒壁之功五倍子治老痰佐以他藥治頑痰人鮮知也天花粉治膈上熱痰元明粉治熱痰老痰硝石礞石消結痰降痰火研末和白糖置手心中以舌舐服蒼朮治痰飲成窠囊小胃丹方載於前治食積飲不可多服虛者勿用中氣不足之痰須用參耆內傷挾痰必用參耆白朮佐以薑汁傳送或加半夏茯苓流金膏治一切火痰咳逆石膏微煅研細大黃酒蒸曬九次各二兩黃芩酒洗橘紅各兩半連翹桔梗貝母各一兩膽星蘇薄荷葉香附各五錢為細末蜜丸彈子大日夜細嚼一丸白湯一二口送下忌一切濕熱酒炙等物吳仙丹治胃寒痰飲頭痛背寒嘔酸不食茯苓五兩吳茱萸湯泡七次焙乾四兩共研末蜜丸前後痰方無及此者二十一論積聚經曰積者陰氣也五臟所生上下左右痛有定處本有形也聚者陽氣也六腑所成上下左右痛無常處此無形也有形者或飲食膿血之類漸積成塊屬在血分血有形而靜也無形者或脹或痛隨觸隨發屬在氣分氣無形而動也夫飲食成積因風寒而凝虛邪中人留於腸胃之外募原之間治者遇無形之聚散之為易有形之積破之若難惟攻補得宜庶可收效凡積聚未久元氣未損者速速攻之緩則養成其勢反為難制若積聚久而元氣虛先補脾胃後用攻伐且不論其積去多少又補又攻若積去半純用甘溫調養使脾土健運則余積自消矣至於正氣虧弱惟有補之一法或稍加破積之味以漸收功經曰壯者氣行則愈怯者著而為病故知養正則邪自除若愈攻則愈虛是不死於積而死於攻非善治者也又有五臟之積並癥瘕痃痞癖等症分列於後亦須博考廣識凡飲食留滯多成痞積在左脅膈膜之外蓋以胃之大絡名曰虛里出於左乳下其動應衣此陽明宗氣所出之道也然食因外寒或因內寒而凝滯久則鬱而為熱更有因風以致積積成則症已非風治者當治所留不可發散以傷真氣又不得純用辛熱使陰血乾涸以鬱火得助而愈熱矣脈候堅強者生虛弱者死沉細附骨者積也沉而有力為積沉緊者為寒積浮而牢者為積聚浮大而長脾有大積化滯丸治一切積聚久涸者磨之自消暴滯者導之自去南木香丁香青皮橘紅黃連各一錢二分莪朮煨二稜各二錢半半夏錢半八味共研細末後用巴豆去殼滾水泡去心膜以醋浸少頃慢火熬至醋乾用二錢次用烏梅肉三錢以慢火熬成膏再用白麵四錢滾水調發合前藥末搗為丸蘿蔔子大每服五七丸五更空心用陳皮湯下不欲通者以津下若知積系何物取本物汁冷下停食飽悶枳殼湯下吐食以津嚥下即止婦人血氣積痛當歸湯下赤痢甘草湯下白痢冷乾薑湯下心痛石菖蒲湯下諸氣痛生薑陳皮湯下腸氣痛茴香湯下若欲推蕩積滯加三五丸熱薑湯下利多不止飲冷水一二口即止此藥得熱則行得冷則止小兒疳積量兒大小白湯下妊婦勿服加沉香檀香砂仁香附更效勝紅丸治脾積氣滯胸滿嘔吐大人酒積婦人血積小兒食積上方治體旺而積重攻之峻劑此方治體弱而積輕攻之次劑三稜蓬朮各醋炒青皮陳皮各一兩乾薑泡良薑各五錢香附炒二兩木香三錢檳榔五錢枳殼三錢上為末醋糊丸米飲下和中丸治胃虛停滯久病不食不堪攻擊用此消導漸磨白朮麵炒二兩四錢厚朴姜炒二兩陳皮兩半半夏一兩檳榔五錢枳實五錢甘草炙四錢木香二錢共研末生薑汁調蒸為丸開水下排氣飲治無形氣聚脹滿刺痛散之自愈陳皮去白錢半木香七分藿香錢半香附二錢枳殼錢半澤瀉錢半烏藥二錢厚朴一錢水煎服如食滯加山楂麥芽各二錢如寒滯者加炒乾薑吳茱萸肉桂之屬如氣逆之甚者加白芥子沉香青皮檳榔之屬如嘔而兼痛者加半夏丁香如痛在小腹加小茴如兼疝者加荔枝核煨熟搗碎用二三錢芍藥枳朮丸治有積痞而攻補俱未便當以調理脾胃為主白朮麵炒二兩赤芍酒炒二兩枳實麵炒一兩陳皮一兩用荷葉煎湯煮陳米粥為丸滾水送下如臟寒加炒乾姜五錢凡脾腎不足多有積聚蓋脾虛則中焦不運腎虛則下焦不化無論有形無形但以正氣為主則邪自除如虛在脾胃者宜歸脾湯方載痰飲之類腎虛者宜八味地黃丸若肝腎虛寒用暖肝煎治肝腎虛寒氣滯疼痛當歸二三錢枸杞三錢茯苓二錢小茴一錢肉桂錢半烏藥二錢沉香一錢或木香亦可姜三片煎服如寒甚者加吳茱萸或加附子三聖膏治積聚在募原之間非藥所能至用膏貼之石灰十兩肉桂五錢大黃一兩將石灰篩過炒紅用醋熬膏入大黃肉桂末攪勻瓦器封貯紙攤炙熱貼患處常熨之蘆薈丸治積久成疳乃經絡壅滯致動肝脾陽明之火故有口糜牙齦臭爛及體瘦潮熱不食等症蘆薈胡黃連黃連炒木香減半白蕪荑炒青皮各五錢當歸茯苓陳皮各兩半甘草炙七錢為末米糊丸米湯下備錄分類治積諸方於後以便取用酒積輕者葛根神麯黃連白豆蔻甚者甘遂牽牛氣積輕者木香枳殼厚朴橘紅甚者枳實牽牛血積輕者乾漆桃仁歸尾赤芍紅花甚者大黃虻蟲水蛭穿山甲花蕊石痰積輕者半夏栝蔞甚者滾痰丸老痰用海石痰在脾里膜外用白芥子水積輕者五苓散甚者用商陸甘遂芫花茶積輕者薑黃芝麻甚者吳茱萸椒姜瘧積鱉甲草果癖積輕者三稜蓬朮甚者巴霜大黃果積丁香肉桂麝香穀食積輕者麥芽穀芽神麯砂仁甚者雞內金即雞肫皮肉積輕者山楂阿魏甚者硇砂硝石面積蘿蔔子姜酒煎魚鱉積紫蘇橘皮木香薑汁白馬尿專治鱉瘕積以鮮蝦食之不痛乃鱉瘕狗肉積杏仁山楂蛋積白豆蔻橘槓豆豉薑汁蟲積雄黃錫灰檳榔雷丸蕪荑榧子使君子川楝子凡治積者審之何經受病何物成積見之既確髮直入之兵以討之不用群隊之藥以分其勢何患不愈至於補後攻攻後補因時制宜可也五臟所生之積其症其方備錄於後用者須知因人變化肥氣丸治肝之積名曰肥氣在左脅下如覆杯令人嘔逆或痛引小腹足寒轉筋柴胡二兩黃連七錢厚朴五錢川椒炒三兩甘草三錢廣朮炮昆布皂角去皮筋子煨人參各錢半茯苓川烏炮各錢半乾薑巴霜五分為細末蜜丸初服二丸以後漸加利多飲兩口冷水即止息賁丸治肺之積名曰息賁在右脅下如覆杯氣逆背痛久則喘咳厚朴姜炒四錢黃連六錢乾薑炮人參茯苓川椒紫芫各七分桂枝桔梗三稜炮天冬陳皮川烏炮白豆蔻各五分青皮巴霜各三分丸法服法同上積去大半勿服丸當服補藥伏粱丸治心之積名曰伏梁起臍上大如臂上至心下久則令人煩心黃連七錢人參厚朴姜炒各二錢黃芩錢半肉桂茯神丹參各一錢川烏炮紅豆菖蒲乾薑炒巴霜各三分丸法服法同上奔豚丸治腎之積名曰奔豚發於少腹上至心若奔豚狀上下無定久則喘逆骨萎少氣厚朴姜炒七錢黃連五錢苦楝子酒炒二錢茯苓澤瀉菖蒲各二錢元胡錢半附子全蠍獨活各一錢烏頭炮丁香各五分巴霜四分肉桂三分丸法服法同上秋冬另加厚朴五錢痞氣丸治脾之積名曰痞氣在胃脘大如覆杯痞蹇吐泄久則飲食不扶肌肉厚朴姜炒五錢黃連八錢吳茱萸泡三錢黃芩白朮各二錢茵陳酒炒砂仁乾薑炒各錢半茯苓人參澤瀉各一錢川烏炮川椒各五分巴霜肉桂各四分丸法服法同上二十二論癥瘕痃痞癖等症癥者得之傷食脅痛吐逆飲食不下其治以補脾為主佐以消磨瘕者得之傷血脅間有塊如石按之痛引少腹去來無常肚硬而脹食減餐泥假物成形如血鱉之類成為疳積總因氣血俱虛風寒襲於外飲食滯於中久而不化邪並於陰而為癥邪並於陽而為瘕治宜調養脾胃磨積消疳奏效遲緩痃者因氣滯為積其皮厚在肌肉之間有可見者也治宜理氣補氣待正氣旺用艾炷之凡灸法用艾揉熟其軟如綿為黃豆大一炷安上灸之灸至將痛難忍去之又用一炷灸之總以二三十炷為定如是者連灸幾日不必傷肉起泡最妙痞者得之傷氣胸腹膨脹刺痛往來是熱氣蘊於胸膈之間停飲聚於腹脅之內於是榮衛不得流行臟腑不得宣通而乃成結也惟宜安胃養脾佐以順氣化滯之品蓋胸為受氣之所非有物也不可作有形攻治癖者是因積得之其症如腸癖之疾似痢非痢肚腹干痛心胸滿悶久則頑結不散有類痞狀多在隱僻之處又有食癖乳癖痰癖虛癖驚癖之分其傷氣血一也治宜調氣養血血氣一旺然後因其症而治之庶得全愈
