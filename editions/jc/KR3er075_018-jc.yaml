body:
  text: 卷十八本草下金石水土部三四八金箔味辛平入心經能制木平肝鎮心辟邪治癲狂驚悸安魂魄定風癇風屬肝而畏金與心為子母故病同源一治墜痰涎降邪火凡邪盛於上宜清宜降者皆所當用若陽虛氣陷滑泄清寒者俱當避之生金有毒磨屑服二三錢即斃即箔亦不可多服畏錫水銀遇鉛則碎銀箔功用略同三四九銅綠味辛酸入肝膽二經色青入肝專主東方之病治風眼爛眩疳瘡金傷吐風痰理血氣婦人心痛止血殺蟲皆肝膽之病亦金勝木之義去膚赤瘜肉喉痹口瘡走馬牙疳方在牙門腳指縫中流水癢痛敷之即愈用醋製銅刮用三五自然銅味辛平辛能散瘀滯之血破積聚之氣治跌打折傷接骨續筋稱為神藥同當歸沒藥酒調服宜細研水飛用或以酒磨服然性燥烈火煅醋淬七次或用甘草水研不可多用專任三五一鉛味甘寒入腎經體重性陰為金丹之母丹灶家必用墜痰解毒鎮心安神殺蟲明目若脾胃虛寒陽火不足者忌之三五二黃丹以黑鉛加硝黃鹽礬煉成味鹹寒鎮心安神墜痰降火內用治驚癇癲狂消積殺蟲止痢除瘧外用解熱拔毒去瘀長肉熬膏必用之藥收陰汗消狐臭三五三鉛粉一名官粉黑鉛煅煉變為白者也味辛氣寒性善殺蟲故去伏屍三蟲鱉瘕疥癬諸蟲療惡瘡毒螫更治小兒久痢成疳如雞子白服以糞黑為度皆寒勝熱之功也三五四雄黃味苦辛溫有毒入肝經稟純陽之氣能殺鬼邪而除濕熱之毒陽明虛則邪易侵治惡瘡疽痔疥蟲諸症濕熱生蟲此藥燥濕殺蟲瘡家要藥驚癇暑傷瘧痢雄黃為末蒸餅為丸甘草湯下七丸日三服鼻中瘜肉吹末化瘀血闢蛇傷散百節大風然石藥與氣血無情凡榮衛虧損而成疳勞者勿服赤似雞冠明徹不臭重三兩者良生山陰者名雌黃功用不及劣者名熏黃燒之則臭只可熏瘡疥殺蟲蝨三五五硃砂味甘寒入心經生者無毒火煅者有大毒殺人畏鹹水忌一切血水飛用色赤應離為心經主藥治癲狂既補心血又瀉心經邪熱鎮心治怔忡定驚心血足辟邪明目點眼藥用之解毒痘毒胎毒安胎解熱獨用多用令人呆悶辰產明如箭鏃者良三五六水銀辛寒有大毒陰毒之性專殺諸蟲治疥癬癩瘡同大楓子用頭瘡不用恐入經絡除蝨墮胎死胎可下永絕胎孕佐黃芩丸服止可外用不可內服棗肉人唾麻油同研則碎三五七輕粉辛燥有毒惟入外科去風殺蟲追毒生肌敷疳痹瘰癧治瘡癬疥癩又消涎積鼓脹梅瘡直達病所可以劫毒然邪郁暫解但恐毒氣透於筋骨迨後毒發關竅重者喪生輕者廢敗可不慎諸輕粉乃水銀加鹽礬升煉而成其性燥烈勿輕用三五八銀硃辛溫有毒能療瘡癬惡毒殺諸蟲蚤蝨惟燒煙燻之或以棗肉拌煙擦之其效尤捷用銀硃鋪於草紙上轉筒燃之上以濕碗覆之空二分煙垂於碗可掃而收之三五九鐵味辛平入心肝二經鎮心平肝定驚療狂諸藥多忌之補腎藥尤忌之治打傷血凝骨節酒煎服開耳聾外塞瓷石內以酒煎服煅時砧上打落者名鐵落治癲療胸膈以及皮膚濕熱諸瘡為患器物生衣者名鐵鏽散疔瘡神效疔由肝經風熱此能平肝疥癬能痊油調塗之針砂散癭瘤醋調敷烏鬚髮畏瓷石皂莢皂莢木作薪則釜易裂其能治諸症大抵借金氣以平肝墜下解毒而已三六古錢味辛氣涼金毒火毒悉去辛涼能散風熱走下焦陰分破凝滯之氣血開壅塞之道路治目赤翳障鹽水浸用婦人橫生逆產道路不開火煅醋淬月經不來胞脈閉也五淋作痛衝任熱壅跌撲損傷氣血凝滯心腹滯痛氣血結聚最古者良多用則效三六一生赤銅味苦平微毒平肝散風治賊風反折用赤銅五斤燒紅淬酒數十遍服之善接折骨凡六畜損骨細研末酒調灌直入損處六畜死後取骨視之猶有銅痕昔崔務墜馬折足以銅末和酒服之遂瘥及亡後十年改葬視其脛骨折處猶有銅束也但打熟銅不堪用三六二蜜陀僧味鹹辛氣平有小毒以辛散咸軟之性為去濕熱積滯之需鎮驚消痰治痢療痔除汗瘢同硫黃水粉花椒海螵蛸共研末用生薑蘸擦先以連翹四錢煎酒服斷根愈腫毒殺諸蟲鼻齄面䵟收陰汗神治多骨瘡疽此疽時出細骨桐油調塗即愈出銀坑中真者難得今用者乃傾銀爐底多有硝銅之氣能爛諸物不可服餌只可外敷三六三硫黃味酸大熱有毒入心腎二經純陽之精大補命門真火能救陽氣暴絕陰毒惟甚久患寒瀉脾胃虛冷命欲垂盡者用之可以起死回生治寒痹冷癖小兒慢驚暖精壯陽殺蟲療瘡腳膝冷疼鬼魅作祟老人虛秘婦人陰蝕傷寒厥逆煩躁腹痛脈伏者陰證似陽以硫黃為末艾湯調服二三錢即可得睡汗出而愈按硫黃性雖熱而疏利大腸與燥澀者不同熱藥多秘惟硫黃暖而能通寒藥多瀉惟黃連肥腸而止瀉番舶者良難得取色黃而堅者以萊菔剜空入硫合定糠火煨熟去其臭氣以紫背浮萍同煮皂莢湯淘淨用又法燒溶入冷水內如是者三次又法入豬大腸煮三時用畏細辛朴硝血與鐵與醋適病而止不可過服三六四白礬味酸澀性寒入肺脾二經酸能收寒勝熱善用有大功效於人其用有四能吐風熱痰涎治癲癇痰迷心竅黃疸其味酸苦可以通泄療崩帶脫肛腸風陰挺陰肉挺出肝經之火牙縫出血止狐腋臭氣腳汗陰汗四者燒枯用其性收澀可固滑脫除瀉痢斂浮腫爛弦風眼其性燥可治濕邪散癰疽疔腫鼻瘜喉痹瘰癧惡瘡疥癬及蛇蟲蠱毒其性能解毒定痛或丸或散或生或枯皆效多服損心傷骨甘草為使惡牡蠣麻黃生用解毒煅用生肌三六五朴硝味辛鹹酸寒有毒入胃大腸二經辛能潤燥咸能軟堅苦能下泄大寒能除熱盪滌三焦腸胃積聚卻天行瘟疫熱痢傷寒陽狂下燥糞留血停痰消瘡腫宿食悉實熱之藥推陳致新能除邪以復正也善能下胎孕婦忌之然妊娠傷寒有當下者兼用大黃而母子相安經曰有故無殞自無殞也藥自病當又何患焉朴硝即皮硝生於鹵地刮取煎煉攻逐最烈若無實熱者勿服芒硝因再煎煉傾於盆內在上結芒其質稍輕功用與朴硝同但稍輕耳能消五金八石何慮積熱諸堅不為推蕩消散也化痰癖通月經下死胎洗赤目滌腸胃止疼若虛寒者誤服傷生如反掌三六六元明粉味辛微甘性冷入胃經降心火祛胃熱平傷寒實邪狂燥去胸膈臟腑宿滯通大便秘結消癰腫去目障止瀉痢血熱去則腫消而目明瀉痢用大黃元明粉蓋宿垢不淨疾終不除經所謂通因通用是也老弱人用之以代芒硝誠微驅虛熱之妙劑也朴硝煎化同萊菔煮再以甘草煎後入罐火煅以去其鹹寒之性陰中有陽性稍和緩可去熱而不傷胃若胃虛而無實熱者禁用俱忌苦參芒硝之有牙者為馬牙硝置風日中消盡水氣輕白如粉為風化硝大黃為使三六七石膏味辛甘寒入肺胃二經兼入三焦辛能發汗甘能緩脾益氣寒能清熱為去胃經實熱之主藥治傷寒寒熱無汗頭痛牙疼大渴舌焦便赤日晡潮熱肌肉壯熱陽明主肌肉目痛脈交額中鼻乾脈起於鼻不得臥胃不和也病傳胃宜用白虎湯療發斑色赤如錦發疹隱見紅點皆胃熱也逐溫暑熱證痰喘太陰火盛陽狂結熱大嘔吐血胃火大便秘結肺胃熱燥不思食邪火多食胃火二者皆治然能寒胃若胃弱血虛及病邪未入陽明者禁用熱重生用熱輕煅用味淡難出若入煎劑分量宜重生煎數十沸雞子為使忌巴豆與鐵三六八滑石味甘淡氣寒入肺胃大腸膀胱四經利六腑之積滯宣九竅之秘結為蕩熱除濕之要劑上開腠理而發表肺主皮毛能除上中濕熱下走膀胱而利水能除中下濕熱熱去則三焦寧而表裡和濕去則小腸之下口名闌門者自清濁分而流通矣治煩渴滲去濕熱則脾胃和而津液生中暑嘔吐泄瀉水腫黃疸腳氣皆濕熱也淋閉普通石淋熱痢六一散加紅曲治赤痢加乾薑治白痢通乳墜胎性滑一切濕爛瘡痛無故多服滑精敗脾戒之三六九赤石脂味酸辛甘溫入心腎大腸三經煅醋淬味澀能去脫色赤能入血甘溫能補中治崩漏脫肛泄痢遺精收瘡長肉無故虛脫者可服收濕收小兒臍中汁出赤腫止血吐衄者血不歸經固下凡下後虛脫赤石脂體重直入下焦陰分故為泄痢虛滑要藥催生下胞取體質之重兼辛溫而使惡血化也下胎衣而不傷母石脂固澀初痢者忌用白入氣分畏大黃三七紫石英味辛甘溫入心肝二經畏扁豆附子惡黃連火煅醋淬水飛用重以去怯濕以潤枯補心以定驚悸達下以安魂魄女子血海虛寒不孕者宜之沖為血海任主胞胎虛則風寒乘之故不孕紫石英辛溫走二經散風寒鎮下焦為暖子宮要藥色淡紫瑩徹五稜者真但系石類只可暫用白石英入肺與大腸氣分治咳逆上氣大腸泄瀉肺癰肺痿吐膿吐血製法同紫石英三七一爐甘石味甘辛溫入胃經辛溫能散風熱消腫止血生肌除目翳翳障赤腫爛弦一切目疾要藥產金銀坑中金銀之苗也輕鬆者良能點赤銅為黃今之黃銅皆是煅紅童便淬七次用三七二浮石一名海石味鹹氣寒入肺經咸潤下寒降火色白體輕入肺清水之上源肺金生水止渴止嗽通淋肺火清也化積塊老痰消癭瘤結核咸能軟堅水沫日久結成海中者味鹹更良三七三硼砂味甘微咸微辛入肺經色白入肺除上焦熱痰治喉痹口齒諸病切覺喉中腫痛含化咽津則不成痹退目翳胬肉研末加片點之療噎膈結核骨硬皆辛散咸軟之效出西番色白似礬此味甘礬味酸性能柔五金則削克可知雖生津止嗽虛勞證勿用三七四硇砂音鐃味鹹苦辛熱有大毒化堅性烈消金石腐腸胃本草稱其能化心為血亦甚言不可多服耳凡煮硬肉投少許即易爛用之適宜可消宿冷癥瘕逐頑痰爛死胎去腐肉生新肌散目翳胬肉除痣黶疣贅故外科用為要藥腫毒可破口去血潰癰可排膿收功但宜外治不宜服食若中毒多飲生綠豆汁二升可解出西戎乃滷液結成狀如鹽塊置冷濕處即化白淨者良水飛過醋煮畏酸忌羊血三七五瓷石味辛鹹入腎經柴胡為使惡丹皮畏石脂火煅醋淬水飛性稟中和諸石藥皆有毒無猛悍之氣補腎益精色黑味鹹鎮心除驚癇重鎮怯明耳目耳為腎竅腎足則瞳人不散大骨節勁腰膝健俱主腎誤吞鐵物服末生於有鐵之處得金水之氣色黑能吸鐵者真其體重若漬酒優於丸散三七六青礞石味辛鹹入肝經火煅細研色青入肝體重降下為平肝鎮驚消散熱痰之神藥治食癥腹痛痰壅喘急痰見礞石即化為水然實痰堅積用礞石滾痰丸乃其所宜若久病痰多必因脾虛而亦服此百無一生矣堅黑中有白星點用硝石與礞石等分打碎拌勻入砂鍋煅至硝盡石色如金為度如無金星者不入藥研末水飛用三七七花蕊石味酸澀氣平入肝經其功專於止血化血為水酸以收之治金傷出血刮末敷之立止療婦人惡血血暈下死胎落胞衣惡血去胞胎自落並療五內崩損噴血出升斗者男以童便加酒女以童便加醋調末三五錢服體堅色黃中有淡白點外敷生用內服煅研三七八代赭石味苦甘氣寒入肝心包二經下氣降火專治二經血分之病療吐衄崩帶腸風痔漏悉血有邪熱月經不止胎動產難涼血活血小兒慢驚用末五分東冬仁湯調服煅紅醋淬水飛用乾薑為使惡雄附以上諸症俱可為散或水或酒或童便酌量調服三七九陽起石味鹹氣溫入右腎命門以鹹溫之性補相火而壯元陽治陰痿精乏子宮虛冷腰膝無力血積癥瘕崩中漏下多屬火虧出齊州陽起山冬不積雪其氣之溫暖可知以雲頭雨腳鷺鷀毛色白滋潤者良真者難得火煅醋淬七次研末水飛用桑螵蛸為使惡澤瀉桂雷丸畏菟絲子忌羊血命火旺者忌用三八禹餘糧甘味平性澀入胃在腸二經二經血分重劑治血閉癥瘕崩中帶漏澀能固下又能催生石中黃粉生於池澤無砂者良三八一皂礬一名青礬味酸性澀酸湧澀收燥濕化痰解毒收涎殺蟲之功亦與白礬相似而力差緩散喉痹醋調咽汁酸湧化痰治瘡癬燥濕解毒腸風濕熱既散後宜收澀消腫脹方載腫門食積同健脾消食藥為丸煅赤用名絳礬入血分伐肝燥濕消腫脹須醋淬胃弱者不宜多用忌蕎麥三八二膽礬味酸澀辛寒入膽經性斂上行湧吐風熱痰涎發散風木相火治喉痹醋調噙咽吐痰立效牙蟲瘡毒陰蝕蟲生風濕產銅坑中乃銅之精液磨鐵作銅色者真人以醋揉青礬偽之三八三砒霜系砒黃所煉而成者大毒殺人能毒鼠犬止可外用蝕敗肉枯痔殺蟲切毋內服出信州故名信石錫之苗也故錫器亦有毒生者名砒黃醋磨塗一切腫毒煉者名砒霜煉時所近草木皆死中毒者服綠豆汁冷水或者可解十救一二三八四石灰味辛氣溫有毒性能堅物乾摻又能軟物同水用散血止血臘月納黃牛膽中陰乾用止瀉痢虛滑白帶白淫石灰二兩茯苓四兩為丸收陰挺陰肉挺出或產後玉門不閉熬黃水泡溫洗脫肛治惡瘡癩瘡死肌殺痔蟲去瘜肉消結核癭瘤或為末摻或醋調敷解酒酸投少許墮胎孕落眉毛點疣痣黑子同糯米煮透挑破點之風化者良古墓中石灰名地龍骨得土氣既深解諸毒更捷治頑瘡膿水淋漓瘡口易斂艌船油灰名水龍骨得油性之潤復得水氣之陰治金瘡跌傷及諸瘡瘻血風臁瘡三八五食鹽味鹹性寒入腎經及脾肺諸經通大小便咸潤下除目赤茶調洗涼血治心腹卒痛炒熟熨之吐上焦痰飲開小便秘塞二症用鹽三錢炒紅水淬服則嘔童便淬服則上嘔下泄自痰飲吐而小便通法詳小便秘門療多笑經曰神有餘則笑不休神心火也用鹽煅紅煎服自瘳水制火也堅筋骨骨消筋緩皆因濕熱鹽滲濕除熱除齒痛清火固齒解霍亂亦用吐法方載本門少用引藥入腎過多黑膚多渴滲胃中津液也水腫咳嗽最忌西北人不耐咸少病多壽東南人嗜咸少壽多病修養家故少用耳三八六青鹽味鹹微甘寒入腎經甘鹹而寒助水臟平血熱消痰降火除目痛吐血尿血齒血舌血鹹寒堅骨固齒補腎固齒方在齒門明目烏須腎足此鹽出於西羌涯泆之陰不假煎煉而成功用略同食鹽而滋益勝之方稜色青者良三八七石蟹點目中生翳腫痛天行熱疾解一切金石藥毒散癰腫醋磨敷細研水飛用石燕水煮汁服之治淋有功婦人產難兩手各握一枚立驗石蠶破石淋血結主金瘡生肌三八八礬石味辛性溫有大毒不煉服殺人性辛熱善治積冷痼疾寒濕風痹有蒼白數種火煅但解散而質仍堅基性與砒石相近不必內服此石生於山無雪今置水而不凍者真三八九諸水長流水取來遠流長之意手足之疾非此莫攻順流水取性速趨下之意通二便催生產下胞衣但要順取逆流水即回瀾倒流也堪吐上焦痰飲但要逆取井華水將旦時汲補陰虛且清頭目蓋緣天一真氣浮結水面也新汲水系新汲未經缸甕者養心神解熱悶煩渴熱病用浸青布互熨胸口心悶汗出用之和蜜飲妙甘瀾水用流水以瓢揚萬遍亦曰勞水水性咸而重勞之則甘而輕用之煎藥治霍亂傷寒勞傷及中州之病能益脾胃且不直下春雨水立春雨水日或下雨以器空中迎接年壯未嗣入夫妻煎服入房主孕臘雪水甕貯埋地性寒治時行熱疫冰大寒傷寒陽毒熱甚昏迷者置膻中兩乳中間良解燒酒毒盛夏飲冰暫時爽快但與氣候相反冷熱相激卻致諸疾飲涼水食西瓜者亦如之宋徽宗食冰致病用冰煎大理中丸服之果愈是治受病之源也凡病因某物而致者仍取原物為引陰陽水沸湯井水等分合服取陰陽相合無有偏勝治乾霍亂不吐不泄此際脈證難審難於用藥有用姜立斃者惟服陰陽水一二杯自吐自泄而愈最為穩協地漿水掘出老土以水沃之攪令濁澄清服之以諸毒遇土則化也治中暑卒死者有法載暑病門泄痢冷熱赤白腹內熱毒絞痛或不嘔不泄解一切魚肉菜果藥物諸菌毒菌音郡生朽木濕地上亦名蕈及蟲蜞入腹如誤食馬蟥蜞入腹生子為患地漿下之梅雨水四月雨洗癬疥滅瘢痕沾衣易腐浣垢易潔洗碗水治惡瘡久不瘥者煎沸以鹽投中洗之立效露水宜煎潤肺藥治勞蟲傳屍止消渴截瘧瘧必由暑故治瘧藥露一宿服花上露令人好顏色三九諸土凡用去上惡物取下老土黃土入藥取其助脾胃也其功用與上地漿同東壁陳土年久者得太陽真火之氣生土更有力治虛寒滑瀉中暑霍亂斂下部濕瘡鞋底土鼠壤土治中風筋骨攣疼日曝乾研服燕窩土味甘寒降火解毒治一切痛癢瘡瘍水調濕敷朝北燕窩土名回燕膏貼瘰癧最效井底泥至陰大寒解湯火傷治孕婦熱病取敷心下肚臍丹田二三次可護胎無失蚯蚓土味甘氣寒治赤白久熱下痢用一升炒煙至盡沃水半升濾淨飲之即愈外塗小兒陰囊腫痛及敷熱毒瘡腫蛇犬咬傷土能化毒韭地上者更佳糞坑底泥純陰大寒治發背諸惡瘡為末水調敷若疔腫加蟬蛻全蠍搗末麻油調敷四圍煙膠即熏焇牛皮灶上黑土治頭瘡白禿疥癬爛瘡流水取為末加輕粉少許麻油調塗即瘥三九一伏龍肝味甘辛兼咸氣溫調中止血去濕消腫治咳逆辛以散肺反胃甘以補土止吐衄崩帶遺精腸風以虧損既多中氣必虛甘能補中溫能和氣血也散癰腫毒氣辛散咸軟醋調或搗蒜和塗臍瘡研敷丹毒雞子白調催生下胎子死腹中水調三錢服之辟邪時疫止兒夜啼能鎮重也系灶中對釜底心之土取年久褐色者良研細水飛用三九二百草霜味辛氣溫能治一切血病吐血衄血血暈血痢便血崩漏金傷出血以黑勝紅水剋火也細研內服或藥調童便調面瘡勿摻入肉如印凡皮破出血者摻之即止系鐺底黑垢刀削下細研用燒雜草者更良三九三墨味辛氣溫止一切血熱妄行鼻衄和茶服產後血暈崩中暴來淡醋磨服或加韭汁飛絲入目濃磨點之少頃絲黑成團以燈芯取出下死胎逐胞衣酒磨多服散癰腫醋磨或豬膽汁磨厚塗之天行熱毒吐血韭汁磨吞不涼不熱用之穩協禽獸部三九四雞味鹹平入肺腎二經補陽起陰兼有風火之義屬巽木木動風其肉甘溫補虛溫中固胎利產妊婦用牡雞湯汁煮米粥常食胎前能固產時快利雞血療痿痹中惡腹痛解毒下乳小兒驚風便結皆宜熱服雞冠血治白瘢風中惡客忤及風中血脈口角喎斜塗頰即止縊死欲絕雞血及冠血熱灌即活和酒服發痘最佳老雄雞冠血塗蜈蚣蜘蛛馬咬等毒百蟲入耳熱血滴之對口毒瘡冠血頻塗取毒以攻毒也雄雞頭大能發痘或頭面陷伏食之最妙當灌漿時不拘雞頭即雞肉亦佳雞肫皮一名雞內金消宿食化積聚止便數遺溺雞子正心止驚益氣補血清咽開音止久嗽滑痢醋煮安胎利產衣不下吞黃二三枚解發刺喉令吐即下療火瘡卵黃和發煎出油塗之免痘疹用新雞卵童便浸透每日煮食一枚有驗多食令人滯悶哺雛蛋殼細研麻油調搽痘毒神效磨障翳或點或同藥煎服敷下疳用末卵中白皮入肺破結氣治久咳立止同紫菀麻黃和服雞窩草文略雞性熱凡初病者忌之惟烏骨雞別是一種雞屬木黑屬水得水木之精氣主陰虛發熱蓐勞崩中凡肝腎不足之病俱能補益惟舌黑者骨肉俱黑男用雌女用雄更妙三九五鴨味甘鹹冷入肺腎二經滋陰除蒸止嗽化痰消水腫利水治熱痢虛而熱者可用鴨血善解諸毒凡中金銀丹石砒霜野葛毒者熱飲溺水死者灌之即活卵甘鹹能滋陰鹽藏者亦能滯膈食多軟腳小兒尤忌野鴨補虛益力退水腫去虛熱消食積療瘡癤忌與胡桃豆豉木耳同食三九六雁肪小曰雁大曰鴻補虛勞逐風攣多服長鬚發久食壯筋骨三九七鴿味鹹氣平入腎肺二經調精益氣治白癜瘡疥解諸般藥毒其卵能預解痘毒從二便而出其尿名左盤龍醋調敷白禿效三九八燕尿治久瘧最靈臨發日攪酒熏鼻即止窠作湯浴小兒逐驚癇除瘡疥三九九雀卵吐酸氣溫入腎命門二經溫主通行性善走下補陽滋陰主廣嗣續同天雄菟絲子為丸空心酒下五丸治男子陰痿婦人帶下溫補命門之功也肉大溫熱益氣補陽暖腰膝而功用不及於卵孕婦忌食雄雀屎一頭尖者是雄兩頭團者是雌名白丁香能破軟癤以雄雀屎塗頂去弩肉以婦人首生男子之乳研雀屎成泥點目中弩肉赤脈貫瞳子者立消四蒼鵝肉有毒因多食蟲發諸瘡疥白鵝不食蟲性寒解五臟熱止消渴其卵性同但多食發痼疾四一雉益少損多九十兩月宜食補五臟止消渴治氣逆喘息小便頻數並腸胃氣虛下痢口噤余月食之發瘡毒四二豬味甘鹹寒水畜其肉氣味最佳能引人多食飯食長氣力倍精神前人多言損人可不必信心血作補心丸散嚮導養心安神鎮驚悸禁邪夢豬殺時驚氣入心絕氣歸肝皆不可多食血能敗血損陽多食寒胃發泄尾血少加冰片治痘瘡倒黶取其活動能發亦有用心血者肝入肝明目將膽汁漬肝濕紙包煨熟食最清目熱同夜明砂作丸治夜不能睹名雀目者肺補肺治肺虛咳嗽肺癰吐膿血蘸苡仁末食肚入胃健脾脾胃旺則精血生而虛勞自愈此乃豬身中有益無害之物也腎入腎治腰痛耳聾豬腎一對酒一分童便二分瓦罐煮熟五更食之勞病一月愈古今補腰腎藥多用之而方書謂人久食腎虛無子不可信也腸入大腸治腸風血痢同黃連丸服肝汁苦寒瀉肝膽之火明目殺疳能通大便陽明症內無熱者便雖秘勿攻用膽汁和醋少加豬牙皂末灌穀道為不傷胃浴初生小兒永無瘡疥尿胞治遺溺疝氣用作引經豬脂甘寒涼血潤燥殺蟲瘡藥用之利腸能通大便滑產治瘡用之熬膏豬蹄煮湯通乳汁加通草佳洗敗瘡涼血止痛懸蹄甲治痘瘡入目煎水頻洗五痔腸癰左甲後甲不拘𦚟俗名胰子治肺痿咳嗽氣脹喘急潤五臟和棗肉浸酒服主痃癖瘦羸多食損陽去垢膩能浣垢衣腦髓治腦鳴頭眩多食滑精乳使人潤澤治天吊豬癇臍風撮口脊骨髓入補陰丸中助真陰退骨蒸除脊痛豬窩草文略豬卵即劫出雙睪丸治小兒驚悸癲癇大人鬼疰蠱毒五癃攣縮寒熱獖㹠頭肉鼻唇多食動風舌多食損心凡病初起忌之者以其補肌固表難於發散也又按豬肉生痰惟風痰濕痰寒痰忌之如老人燥痰乾咳更須肥濃以潤之不可執泥生痰之說也四三犬肉味鹹入脾腎二經反商陸畏杏仁惡蒜酸而咸溫暖脾胃而腰腎亦受其蔭矣補虛寒長陽氣內外兩腎尤勝陽旺者勿食妊婦食之令子無聲熱病後食之殺人道家以為地厭不食狗寶結成胸腹中者專治翻胃善理疔疽噎由痰及虛寒者相宜若血枯胃弱者切忌四四羊肉味甘性溫入脾腎二經反半夏菖蒲忌蒜補中益氣安心止驚十劑曰補可去弱人參羊肉之屬是也人參補氣羊肉補形肝補肝而清目膽汁點目去赤腫翳障目者肝之外侯膽之精華也膽汁減則目暗故諸膽皆治目病方載眼目門肺補肺虛咳嗽小便頻數肚健脾斂虛汗須燒灰麻油調敷小兒疳瘡羊鬚瘡骨髓煮酒滋陰虛利血脈腎補腎精枯陽敗者同入乳粉五錢空心食之極效心補心治憂恚氣痛有孔者勿食血主女人血虛中風產後血暈悶絕者生飲一升即活並解丹石藥毒如神脛骨入腎而補骨燒灰擦牙良脛骨灰一兩升麻黃連各三錢青鹽八分和勻日用誤吞銅鐵者用羊脛骨灰三錢米湯下次早從大便出蓋羊脛骨灰可以磨鏡羊頭骨灰可以消鐵乳甘溫潤胃脘大腸之燥治噎塞蜘蛛咬傷渾身生絲者是飲之即瘥發痘瘡必用之羊食毒草凡瘡家及痼疾者忌之反半夏菖蒲忌銅器牡羊曰羖曰羝去腎曰羯子曰羔羔五月曰羜純黑者良入肝腎四五羖羊角味甘鹹性寒苦寒能去諸熱治目清盲肝熱平驚悸心熱殺疥蟲濕熱除頭風火熱上升療百節中結氣婦人產後余痛血熱氣壅取之時勿中濕濕即有毒四六牛肉味甘氣溫入脾經安中補脾養胃益氣角尖治一切血瘀血崩帶漏乳養血潤燥治反胃噎膈日飲牛乳加薑汁詳載本門酥酪醍醐皆牛羊乳所作滋潤滑澤宜於血熱枯燥之人但病死者獨肝者黑身白頭者勿食中其毒者用甘草或綠豆湯代茶服若口渴飲茶及水者死四七黃明膠即牛皮膠味甘平入肝經血分治吐血下血血淋妊婦胎動下血血虛有熱此能涼血生血風濕走注疼痛跌撲傷湯火瘡癰疽腫痛活血其功用與阿膠略同但非阿井水及騾皮同造故不能疏利下行耳一名水膠為外科活血止痛要藥明亮六月不軟無牛皮氣者良蛤粉炒成珠或酒蒸化用四八牛黃味苦甘平入心肝二經人參為使惡龍骨膽草地黃常山畏牛膝乾膝牛食百草其精華凝結而成清心退熱化痰平驚急驚當用通竅辟邪治中風入臟口噤癲癇心熱則火生焰肝熱則木生風風火相搏膠痰上壅遂致中風不語中臟者多滯九竅宜用中臟者多著四肢中經絡者外無六經形症內無便溺阻膈若誤用之反引風入骨不能出也初宜順氣開痰繼宜養血活血不宜專用風藥以燥其血也治詳中風門療小兒百病如急驚熱痰壅塞麻疹餘毒丹毒牙疳喉腫一切實症垂危者可使之奪命平痘瘡火盛色紫發狂發斑墮胎孕妊婦勿用牛有黃夜視其身有光毛潤發紅而澤欲吐時必多吼喚以盆水承之如雞子黃大名生黃難得殺死有得於角者心者肝膽上者成塊成粒總不及生黃黃透甲者真駱駝黃易得人以此偽之四九阿膠味甘辛平微溫入肺肝腎三經蛤粉炒成珠或酒蒸化用山藥為使惡大黃養肝補腎清肺益氣肺主氣腎納氣治吐衄崩帶血淋血痔腸風尿血經脈不調血枯血燥傷暑熱痢和血補血療虛勞肺痿止嗽定喘潤燥化痰胎前產後養血及除一切風病血足養肝則木平風息久服輕身益氣溫和之品也阿井乃濟水之眼內經以濟水為天地之肝騾皮又合北方水色氣味俱陰功力自大故入血治血症及風證如神取其益陰滋水補血清熱之功也光明微綠體堅而脆折之易斷夏天不軟者真四一虎脛骨味辛性熱酥炙研末虎者西方之獸本金氣而能制木故嘯則風生搜風健骨定痛辟邪治腳膝軟弱痠痛用前脛骨虎雖死而不僕其氣力皆在前足療歷節拘攣風痹頭風用頭骨足風用脛骨腰脊風用脊骨各從其類也除鬼祟惡夢傷寒瘟瘧用頭骨或佩或作枕或置戶下虎肚治反胃取生者存滓穢勿洗新瓦固煅存性入平胃散一兩每服三錢效但宜於食膈若氣膈血膈痰膈恐難見功虎睛為散竹瀝下治小兒驚癇夜啼虎爪中藥箭死者必有微黑色毒能損人不可不辨四一一犀角味苦酸鹹入心肝胃三經升麻為便忌鹽涼心瀉肝善清胃中大熱治瘟疫狂妄發黃濕熱鬱也發斑傷寒下早熱乘虛入胃則發斑下遲熱留胃中亦發斑療傷寒熱毒閉表煩熱昏悶而汗不得出者磨尖入藥汗如響應仲景云如無犀角以升麻代之則知升麻之升散亦能如犀角之升散陽明也吐血衄血下血及蓄血發狂磨汁服痘瘡稠密內熱黑陷涼血解毒痘症初起原借熱以升發若大寒則伏而不出矣不得早服消癰化膿定驚止悸去心煩熱犀角能涼血清熱散邪解毒但非大熱不敢輕服妊婦忌之犀神獸也故角之精者通天夜視有光能開水辟邪禽獸見之皆辟易烏而光潤者勝角尖更勝入湯劑磨汁用入丸散銼細紙包納懷中待熱搗之立碎以陰寒之質得陽和而冰解也四一二羚羊角味鹹寒入心肝肺三經羊屬火而羚羊屬木直入肝經凡肝經之病皆能治之明目去障目為肝竅祛風舒筋散驚癇拘攣肝木生風療狂越邪夢肝藏魂能瀉心肝邪熱化瘀滯惡血血痢腫毒肝主血此能散血羚之性靈而精在角故又辟邪而解諸毒痘症血熱乾燥能清較之犀角涼血鎮心者更無冰伏之患故功力尤穩耳出西地似羊而大角有節最堅勁能碎金石夜宿防患以角掛樹而棲角有掛紋者真一邊有節而疏乃山驢山羊非羚也銼研或磨用四一三熊膽味苦性寒入心肝二經涼心平肝明目去障肝平治驚癇心涼殺蟲味苦療痔瘻疳積止痢去疸苦瀉濕熱及小兒熱痰驚癇煩熱瘛瘲等實症以竹瀝化兩豆粒許服之甚良亦治鼻瘡熱瘡腫痛以水化加冰片塗之效膽不附於肝春在頭夏在腹秋在左足冬在右足依時搜取懸風處陰乾惡地黃防己欲辨其真取灰塵先封水面將膽投塵上塵即兩開再以墨磨碗中膽入墨中墨即飛碗邊者真四一四望月砂即兔屎也入肝經明目去痘後翳障兔得太陰之精望月而生復食明目之穀精草故功能明目砂糖湯調服兔血兔血丸稀痘瘡臘月八日取兔血和蕎麥麵少加丹砂雄黃各五分候乾丸綠豆大小兒以乳汁化服二三丸遍血發出紅點是其驗也最效兔腦髓性溫而滑潤催生利胎之聖藥也有方在生產門兔肝瀉肝熱能明目肝開竅於目兔目不瞬以肝氣之有餘補人肝氣之不足兔頭骨治頭眩痛兔屬金而頭骨在上尤得金氣之全故能平木邪療頭風並癲疾也兔肉補中益氣性寒損陽八月至十月可食余月不宜食皮毛燒灰細研酒服理產後胞衣不下血暈將危飲下即安四一五鹿茸味鹹性溫入肝腎命門三經酒炙用稟純陽之質含生髮之氣填精血補真陽治虛勞健腰膝腎水可以制火腰膝腎之府四肢痠痛頭眩眼黑崩帶精泄皆肝腎不足堅齒牙治耳聾腎足又有糜耳皆能補腎鹿陽獸喜居山故鹿角夏至解陰生陽退之象補右腎陽氣不足麋陰獸喜澤居故麋角冬至解陽生陰退之象補左腎血液不足物異而性亦殊也鹿角鹹溫生用則散熱行血消腫解毒醋磨塗腫毒為末酒服治折傷辟邪治夢與鬼交酒服二錢能逐陰中邪氣惡血鹿肉甘溫通血脈補中氣益脾胃強五臟服之有益無損四一六鹿角膠味甘鹹入肺肝腎三經善助陰中之陽為補陰要藥益氣血填精髓壯筋骨延年壽療吐血下血尿精尿血婦人崩淋赤白帶濁血虛無子皆肝腎不足之病此能養肝補腎諸症自痊更能安胎斂汗治折傷舒氣喘凡勞傷羸瘦之人最宜久服多服用蛤粉炒成珠即研末入藥末拌勻否則潮潤成膠或酒蒸用造膠法取新角寸截水浸七日洗淨焙燥酒淬七次搗碎桑火煮三日候滓浮起濾干為霜入丸以為佐使其汁入醋少許再加酒熬成膏或合酒服或配藥俱妙畏大黃四一七麝香味辛溫忌大蒜其香芬烈為通關利竅之上品辟惡氣精鬼蠱毒瘟瘧中惡心腹暴痛驚癇一切膏藥摻藥用之皆取其開經絡透肌骨之功用療鼻塞耳聾積聚癥瘕眼目翳障皆氣滯病香能散之然以走竄為功消陰耗陽壞果敗酒勞怯人及孕婦切忌佩帶下胎用當門子良欲辨真假置些須於火炭上有油滾出而成焦燼炭者真若火燃而化白灰者假市人或攙荔枝核偽之四一八獺肝味甘辛有毒入肝腎二經益陰補虛治傳屍勞蟲有聖神之功屍疰鬼疰在身沉沉默默積月累年殗殜至死死時復傳親人乃至滅門惟用獺肝陰乾為末每日三服水下二錢以瘥為度諸肝皆有葉數惟獺肝一月一葉須於獺身取下為真此為難辦另有方在諸蟲門四一九象皮味鹹溫善合金瘡立長肌肉凡瘡無毒而不斂口者可用熬膏為散俱效四二白馬溺味辛氣寒殺蟲化症積鱉瘕腹痛屬鱉病飲馬溺化為水落齒馬溺浸茄樹根三日炒為末點之即落四二一驢溺味辛氣寒治反胃熱飲二三次便愈殺諸蟲四二二鼠矢味甘微寒治傷寒勞復發熱男子陰易腹痛婦人傷寒初愈即與交合毒中男子名陰易若女人與傷寒男子交者名陽易活人有鼠矢湯兩頭尖者為雄鼠矢鼠膽汁滴耳中治三十年老聾鼠膽隨死隨消不易得也鼠肉治兒疳瘡瘻鼠性善穿而治瘡瘻因其性也四二三夜明砂一名天鼠矢味辛寒入肝經肝經血分藥活血消積專治目盲障翳雖有他用明目之外余皆可略按此即蝙蝠矢也食蚊砂皆蚊眼故治目疾淘淨焙用惡白薇白蘞鱗介魚蟲部四二四龍骨味甘澀微寒入心肝腎大腸四經忌魚與鐵畏石膏火煉水飛酒煮性主收斂凡滑脫之病俱為可治如吐衄崩帶遺精脫肛大小腸利虛汗氣喘氣不歸元則喘潰瘡滑痢惟久病虛脫無夾雜者可用白地錦紋舐之黏舌者真人或以古壙灰偽之四二五龍齒味澀性涼鎮心安魂龍屬木主肝肝藏魂虎屬金主肺肺藏魄治大人痙癲狂熱小兒一切驚癇其餘斂澀固脫與龍骨同四二六龜版味鹹寒入肝經惡礬酒浸炙黃性至陰治血虛勞傷骨蒸腰背痠痛破癥瘕咸軟堅止崩漏咸潤下久咳虛火痰瘧老瘧也中有痞塊名瘧母至陰能除虛熱無慮陰火之亢烈也熬膏用大者洗淨捶碎水浸三日以桑柴火熬膏性味濃厚尤屬純陰能退孤陽凡陰虛勞熱陰火上炎為吐血衄血肺熱咳喘消渴煩擾蒸汗狂妄之要藥滋陰以除邪火然性寒善消陽氣若陽虛假熱及脾胃命門虛寒者忌之四二七鱉甲味鹹平入肝經色綠屬陰治勞瘦骨蒸往來寒熱瘟瘧瘧母元氣虛邪陷中焦則結為瘧母鱉甲能益陰除熱而散結故為治瘧要藥凡癥痔經阻產難厥陰血分之病皆治鱉色青應木故走肝益腎而除熱龜色黑應水故通心入腎以滋陰陰性雖同所用略別色青而綠九肋者良醋炙若治勞童便炙亦可熬膏鱉肉涼血補陰亦治瘧痢惡礬石忌莧菜雞子鱉膽味辣可代椒解腥四二八穿山甲又名鯪鯉甲味鹹平微寒入肝腎二經土炒或人乳炒性善竄喜穿山可走周身通經絡頃刻直達病所某處病的取某處之甲為引最效行經滯下乳汁用甲炮研末酒服外以熱梳疏乳或同王不留行煎服消癰腫未成即消已成即潰潰後少用治痛痹在上則升在下則降截瘧能破暑氣所結發痘陷伏者可佐補藥以起發之並療蟻螻飯食中誤食蟻中毒或塊破則出水用甲炒研敷之但性猛烈不可過用虛弱者更當審慎四二九牡蠣辛鹹寒性澀入腎經貝母為使惡麻黃辛夷吳茱萸火煅童便淬研粉用專入腎經亦隨藥以走諸經化老痰結血瘰癧有方在瘰癧門結核頸核用茶調服上焦癭瘤同天花粉茶葉用凡屬結積同貝母用去脅下積塊同柴胡用消癰腫同大黃用皆咸能軟堅也治遺精崩帶性澀止嗽肺虛可用斂汗用麻黃根黃耆等分末服止虛汗禁遺尿同熟地用皆澀以收脫也療虛勞煩熱利濕同白朮用水病囊腫牡蠣粉二兩乾薑炮五錢為末水調或蔥汁白麵調敷干則頻上囊大熱小便消即愈截瘧化瘧痞止渴皆微寒清熱以補水也按虛而熱者宜用有寒者忌之海氣化成純雄無雌四三石決明味鹹平入肝腎二經鹽水煮細研鹹寒入血除肝經風熱內服治目青盲內障細研水飛點目消外障目者肝之竅肝火清則目病悉平痘後目翳同穀精草等分研細豬肝蘸食即退亦療勞熱並泄精同龍骨服解酒酸為末投熱酒中即解得水中之陰氣以生如蚌而扁惟一片無對七孔九孔者佳四三一蛤粉蛤蜊殼煅為灰味鹹冷止咳嗽凡咳者諸藥不效用蛤粉少加青黛麻油數滴水調服若勞咳未必大效肉止渴解酒牡蠣蛤蜊海蛤文蛤並出海中功用略同出江湖者但能清熱利濕無鹹水浸漬不能軟堅凡一切炒阿膠鹿膠等俱用之四三二田螺味甘大寒清熱利濕止渴利二便前後不通腹脹如鼓以鹽和殼搗碎帛系臍下即通引熱下行凡一切邪熱俱可外用治腳氣搗數螺系兩股自冷氣趨下而安療噤口毒痢用螺加麝少許搗餅烘熱貼臍下自熱下思食目熱赤腫入鹽花取汁點之解黃疸搽痔瘡濕熱為病四三三真珠味鹹寒入肝經乳浸三日或用絹包入豆腐中煮用感月而胎若中秋無月則蚌無胎水精所孕安魂定悸寶物多能鎮心如琥珀金銀之類墮痰鎮驚止渴除蒸拔毒生肌鹹寒之效點目退翳按珠體最堅研如飛面方用否則傷人病不由熱者忌之四三四海螵蛸味鹹溫入肝腎二經惡白芨白蘞附子炙黃用咸走血善治婦人經枯血閉並吐衄崩淋能生血和血補腎固精令人有子小兒下痢膿血性澀能收去目翳和蜜點之療下疳痘瘡臭爛膿濕湯火諸瘡為末敷之小兒重舌鵝口同雞了黃調塗舌腫出血同蒲黃末敷停耳同麝吹之男子莖中腫痛婦人陰痛燒灰存性酒服一名烏賊骨一名墨魚腹中有墨書字逾年乃滅防奸人作弊常吐黑水自罩其身四三五蜂蜜味甘平入脾經忌生蔥鮓蜜一斤入水四兩瓷器中煉滴水不散用採百花之精英朝夕噓以陽氣釀成華液氣清味甘凡寒熱虛實之證無不相宜調榮衛甘緩和中解諸毒甘為土化毒遇土則解安五臟和百藥甘溫而補止咳潤肺止痢薑汁和服通大便秘煉熟納穀道中除湯火傷同薤白搗塗止心腹肌肉瘡瘍諸痛甘緩可以去急調脾胃甘能補中潤腸燥柔滑然能滑腸泄瀉者中滿者甜能滿中忌用性重下墜入水下沉欲上升藥勿用調炒黃蠟味淡無味者謂之嚼蠟止瀉痢性澀續絕傷生肌定痛及金瘡也甘能調血溫能行絡凡盪滌下焦之藥以此裹之免傷上部四三六露蜂房味苦鹹辛有毒惡乾薑丹參黃芩芍藥牡蠣炙用苦泄熱辛散結咸軟堅得火氣之甚有毒而能攻毒拔疔瘡附骨疽之根毒在臟腑骨疽附骨成膿痛處發熱而無汁四體乍寒乍熱大便秘小便赤瀉熱發散治之早則消用蜂房蛇蛻亂髮燒灰酒調服妙塗瘰癧成漏炙研豬脂調服止風蟲牙痛煎水含漱起陰痿煎水洗解乳癰用末醋調服取懸於樹受風露者佳四三七蟬蛻味鹹寒入肺肝脾三經洗淨去足翅曬乾用此物吸風飲露氣極清虛故能療風熱之證治小兒驚癇夜啼用三個去前半截不用留後研細末敷乳頭上令兒咀之是夜不哭目昏翳障疔腫瘡毒皮膚風疹癢痛水煎服以鹹寒可祛風熱善發痘疹其體輕而善脫凡痘不起在頭用頭在身用身在足用足黑陷者酒洗研末湯調服兼參耆則虛癢自愈但多服恐泄元氣致表虛也催生下胞取蛻脫也發聲音治喑啞因鳴清響按虛寒證禁服四三八殭蠶味辛鹹微溫入肺肝胃三經僵而不腐得清化之氣故能治風化痰散結行經蠶病風則僵故因以治風能散相火逆結之痰治中風失音頭風喉痹炒為末薑湯調下一錢當吐出頑痰崩中帶下風熱乘肝丹毒瘙癢風熱風痰結滯驚癇夜啼肝虛療疔毒瘰癧滅瘢痕除陰癢風濕之病及小兒驚疳膚如鱗甲由氣血不足亦名胎垢煎湯浴之若諸症由於血虛而無風寒客邪者勿服以頭蠶色白條直者良糯米泔浸一日焙乾去嘴甲搗用亦可解毒發痘貫漿定癢極效惡茯苓桔梗萆薢蠶繭使癰疽透孔燒灰酒調服一繭一孔功同茅針繰絲湯甕埋土中解消渴引清氣上升使相火下降蠶蛻紙燒灰水調服甚益婦人止帶漏崩中腸風吐衄諸血症治走馬牙疳用灰加麝與白礬擦齦上邪祟癲狂酒調灰下立愈雄蠶蛾補腎益精每於生息用二蠶未交之雄者微火炒黃任合丸散陰痿者服之甚效四三九晚蠶砂味辛甘氣溫蠶食而不飲屬火性燥燥則去風勝濕治支節不隨皮膚頑痹腰腳冷痛冷血瘀血炒黃浸酒史國公用之手足筋骨患處炒熱鋪席上以患處就臥厚覆取汗忌風療腸鳴水火相激也甘以和之止消渴中氣燥熱也辛以潤之除爛弦風眼目上下胞屬脾脾有濕則蟲生麻油調敷解食蛇肉毒中毒者身黑生鱗日服蠶砂五錢盡一二斗愈四四玳瑁得水中至陰之氣性寒解一切熱毒治心風驚癇利大小腸又解痘毒神效凡遇時行痘症用生玳瑁生犀角各磨濃汁一合和勻服半合日三服未發內消已發稀少若痘黑陷者乃心熱血凝也照此加入豬心血少許紫草汁五匙溫服可以起死回生四四一斑蝥味辛寒有毒入肺脾二經畏巴豆丹參甘草豆花惟黃連黑豆蔥茶能解其毒辛寒能走散下泄以毒攻毒勢不少停善用之有再造之功外用之蝕死肌敷惡瘡內用之破口淋拔瘰癧疔腫墮胎元下猘犬癲犬毒有方在諸毒門豆葉上蟲黃黑斑文去翅足同糯米炒用亦有用米取氣不取質者或以醋煮用皆可斑蝥豆葉上蟲蚖責食芫花者青綠色尤毒亭長春生食葛花者黑身赤頭地膽秋生冬入地黑頭赤尾四蟲不同功略相近皆有極毒須當慎用按斑蝥內服下敗物痛甚以木通導之四四二蠍味辛甘有毒入肝經全用者去足焙或用尾尾力尤緊形緊小者良色青屬木以辛溫走散之性故專入肝祛筋骨風邪諸風掉眩皆屬肝木大人真中風小兒急驚風身體搐掣口眼喎斜白附殭蠶全蠍等分為末酒服二錢甚效療帶下疝痛二症屬風俱宜加用破傷風宜以防風全蠍為末酒下小兒臍風初生斷臍後傷風肚青口攝吐白沫此時垂危用蠍可救方在小兒門按似中風小兒慢脾驚風屬虛者忌用四四三蜈蚣味辛溫有毒入肝經辛散結溫能行治小兒驚癇風搐臍風瘰癧便毒痔漏等症以毒攻毒療諸蛇蟲魚惡毒見蛇便緣上啖其腦殺鬼物蠱疰邪精去瘀血墮胎元取赤足黑頭者火炙或酒炙或荷葉包煨用去頭足尾甲畏蜘蛛蜒蚰不敢過所行之路雞屎桑皮鹽中其毒者用桑汁鹽蒜塗之被咬者以蜘蛛置咬處吸之四四四白頸蚯蚓老者頸白味鹹性寒得土中陰水之氣治傷寒狂熱同荊芥穗搗汁飲之得臭汗而解寒能清熱也小水不通腹腫黃疸咸主下走救跌打損傷垂危者用酒煎服真神方也療痘瘡紫黑搗汁服耳卒聾秘蚯蚓安蔥管內入鹽化水點之立效搗汁井水調下入藥或曬乾為末或鹽化為水或炙或燒灰各隨所宜中其毒者似遊遍身鹽水頻浴解之糞名六一泥可塗湯火瘡痄腮熱毒止消渴解瘟疫煩熱狂躁利小水通淋閉疼痛敷小兒陰囊熱腫四四五五穀蟲味寒善化積聚小兒食積肚硬脹痛漂淨曬乾為末用四四六白蠟味甘寒入肝經屬金生肌止血血涼則止故入油為燭定痛補虛續筋接骨為外科要藥四四七五靈脂味甘氣溫入肝經血中之氣藥也大能行血行氣逐瘀止痛凡男女血中氣逆如腸風血痢行腸胃瘀滯心腹脅肋冷氣惡氣諸痛悉治行血順氣婦人經閉不通經行滯痛不利及產後心腹小腹血氣刺痛同蒲黃等分研末以酒調末熬成膏入水再煎並服其滓或加童便卒暴心痛五靈脂炒錢半乾薑炒三分為末熱酒調服立愈療血潰怪病或眼中白珠渾黑毛髮堅直如鐵能飲食而不語名曰血潰以五靈脂為末湯服二錢即愈五靈脂乃北方寒號禽之糞也黑色氣臊有糖心者真酒飛去砂石用生用行血炒熟和血炒黑止血惡人參此即曷旦鳥夏月毛採五色鳴曰鳳凰不如我冬月毛落忍寒而號得過且過四四八白花蛇味甘鹹性溫有毒透骨搜風內達臟腑外逐皮膚無處不到能引祛風之藥至於病所治手足癱瘓肢節軟疼口眼歪斜筋脈攣急厲風疥癩急驚慢驚諸症皆屬於風必須佐以補血養肝之藥為主及白癜風鶴膝風髭眉脫落鼻柱塌壞凡諸藥力莫及但服蛇藥酒切忌見風宜於密室靜坐凡似中風虛弱人禁用出蘄州龍頭虎口脅有二十四方勝紋腹有念珠斑口有四長牙尾有爪甲其長二三分腸如連珠眼光如生他產則否頭尾有毒各去三寸亦有單用頭尾者春秋酒浸三夜夏一宿冬五火炙去盡皮骨取肉焙乾久藏不壞宜煮酒服烏梢蛇色黑尾細有劍脊者是功用略同炮製不異但性善無毒頭尾有毒而力亦小耳四四九蚺蛇膽味苦帶甘入肝脾二經稟己土之氣膽屬甲乙風木氣寒有小毒療疳殺蟲濕熱生蟲苦寒能燥濕殺蟲故內外用之皆效除目腫痛護心止痛苦能清熱人若受杖用此噙化可得不死取膽粟許置水上旋行極速者真膽上旬近頭中旬近心下旬近尾按時取之四五蛇蛻味甘鹹有毒治驚癇風瘧重舌燒末敷喉風性竄能去風療疥癬惡瘡疔腫痔漏性毒能殺蟲除目翳產難皮膚瘡瘍皮性善脫用雪白者皂莢水洗淨或酒或醋或蜜浸炙黃或燒灰在人裁妥四五一螃蟹味鹹氣寒入胃肝二經胸中熱結疼痛性寒散血通經咸走腎善續筋骨筋絕者取黃搗爛微炒納傷中筋即連也骨斷者生搗熱酒調服渣敷外用紮好半日骨內谷谷有聲即好塗漆瘡漆得蟹化為水下死胎多用蟹爪甘草煎就入阿膠服合小兒之囟用殼白芨末搗塗去面腫胃熱正喎僻肝經風熱風疾人食其病復發蟹性冷若血因寒凝胃寒滑瀉而能忌食蟹有獨螯獨目六足四足腹下有毛腹中有骨頭背有星點足斑目赤者有毒勿食中毒者冬瓜紫蘇可解四五二蝦味甘溫托痘瘡下乳汁多食發瘡動氣小兒勿食四五三蝸牛味鹹性寒有小毒清火解熱治脫肛大腸熱也用蝸牛燒灰豬脂和敷立縮痔瘡腫痛用蝸牛入麝香化為水塗之或浸油塗之或燒灰敷之疔腫發背火毒結熱也用蝸牛搗加片敷之解蜈蚣毒不敢過蝸牛所過之路觸其身即死負殼而行者名蝸牛無殼者名蜒蚰又名蛞蝓古分為二而其氣味主療無異今併為一四五四水蛭俗名馬蟥味鹹苦平有毒入肝經畏石灰鹽炒枯用咸走血苦勝血為攻血要藥去積瘀堅癥治婦人因血癥經閉而無子者血蓄膀胱發狂躁暴蓄血症小便必利仲景有抵當湯用須細切炒枯黃為末不然入腹則活生子害人若受其害者以黃泥水飲數碗自下然破血之藥甚多何必用此凶險之物也四五五虻蟲味苦寒有毒入肝經去足翅惡麻黃色青入肝專啖牛馬之血仲景用以逐血因性而取用也破血積癥瘕遍行經絡療虛勞羸瘦內有死血乾結以肌膚甲錯兩目黯黑也虻蟲䗪蟲皆入於補血活血藥中散宿血結積大有神效但墮胎甚速收取陰乾炒用非氣壯之人實有蓄血者水蛭虻蟲不敢輕投四五六蟾蜍俗名癩蝦蟆味辛溫有毒入胃經酒浸一宿去皮腸炙用屬土之精上應月魄治瘡疽發背勢重者剖蟾蜍合瘡上不久必臭如此二三易其毒自解小兒勞瘦疳蟲殺蟲療破傷風同花椒酒煮服即愈瘟疫發斑危劇者燒灰存性酒送一切有蟲諸惡頑瘡油調灰敷蟾酥即蟾蜍眉間白汗辛溫有大毒助陽解毒治疔腫惡毒合他藥服一二釐解毒如神療陰蝕厲風猘犬惡傷外用無慮不得內服外科有奪命之功然輕用爛人肌肉若瘡已潰當生肌長肉之際用之作痛異常不可不知一種蝦蟆腹大身小舉動極急吞接百蟲剖貼癰腫熱結蝌蚪子系蝦蟆子合桑椹染須永不皓白搗爛為火瘡敷藥絕無瘢痕蟾蜍肪即脂塗玉刻之如蠟四五七蜣螂一名推車客味鹹氣寒有毒入肺肝脾胃四經以鹹寒軟堅潤下之性治小兒驚癇大人癲狂內服非虛人所宜外用易臻厥功腸漏出水加冰片少許為末納入孔內即愈拔疔毒用蜣螂心在腹下度取之其肉稍白是也貼半日再易立痊凡鐵入骨同巴豆微炒搗塗極癢時拔之除痔蟲搗為丸納之蟲盡出炙黃用畏羊肉四五八桑螵蛸味鹹平入腎經畏旋覆花蒸透再焙人以腎為本味鹹能補故能起陰痿止夢遺益精填髓治腰痛崩漏肝腎不足通五淋縮小便腎與膀胱相表裡腎足則氣化故能通腎氣既固則水道安常故又能止即螳螂卵也桑樹生者良如他樹生者以桑皮佐之桑皮行水能達腎經一月二月採蒸熟炙用否則令人瀉四五九蜘蛛有毒治狐疝偏痛睪丸或上或下炙黃為末同茴香丸服蛇虺咬搗汁塗蜈蚣咬用活吸取身圓無花者用四六䗪蟲味鹹寒有毒畏皂莢菖蒲肝經藥也血為真陰凝滯則經絡不通諸病生焉治瘀血停留經閉癥瘕令婦人生子病由血枯而無瘀者不宜療跌撲傷損如神方載跌傷即土鱉蟲也生於下濕之地以刀斷之中有白汁接之即活故續筋接骨有奇效陰乾或焙乾研末酒調服四六一螻蛄一名土狗味鹹無毒去翅足炒通二便消水腫自腰以前消上腫自腰以後消下腫左右亦如之全用消通身腫貼瘰癧化骨硬但性急虛人戒之四六二瓦楞子即蚶子味甘鹹氣溫無毒消血塊散痰癖咸能軟堅故消血積溫能補中故散痰積用殼煅紅醋淬三次為末醋膏糊丸治一切氣血癥瘕肉益中氣健脾胃有益無損四六三鯉魚味甘平稟陰極之氣故鱗三十有六然陰極陽生能利小便治腳氣黃疸水腫同赤小豆煮服當下利而瘥療妊娠內外水脹水腫如神有千金鯉魚湯載婦科胎前門除咳逆上氣止消渴甘可以緩鱗燒灰治產後血迷血暈敗血不止淋瀝崩中能入血散滯或調酒或調童便或調藥服凡風熱病下痢有宿癥者俱忌食忌犬肉葵菜同食炙鯉魚煙入目損失目光四六四鯽魚味甘性溫諸魚屬火鯽魚屬土土能制水治膈氣吐食用鯽魚去腸留鱗以大蒜填滿腹紙包煨熟取肉合平胃散末為丸米湯下二十丸療腸風下血用五倍子末填滿魚腹煅存性為末酒服一錢實腸補脾利水土能去濕忌芥菜豬肝砂糖同食四六五鰻鱺甘平微寒去風殺蟲治骨蒸勞瘵濕痹風瘙陰戶蝕癢皆有蟲也其骨燒煙蚊化為水置衣箱闢諸蠹脾胃虛寒者有孕者勿食四六六鱔魚味甘溫補中益氣除風濕尾血療口眼喎歪和麝左喎塗右右喎塗左正即洗去治耳聾滴耳痘後目翳點目鱔善穿穴故能走經絡諸竅之病風中血脈用血主之從其類也但性熱凡病虛熱及病後勿食若過食動風生霍亂四六七蠡魚又名七星魚味甘寒入脾腎二經色黑象水吐甘屬土為益脾除水之妙品治水腫神效有二方載腫脹門解喉痹用膽汁點之稀痘瘡有法在痘疹門此魚首有七星夜朝北斗食之無損四六八青魚膽味苦寒入肝經色青入肝肝竅通於目治目赤腫障翳點之若系實熱加黃連熬膏冰片少許療乳蛾喉痹用膽礬入青魚膽冬月陰乾研末吹喉吐痰而愈塗湯火瘡化魚骨硬臘月收以備用四六九石首魚味甘氣平入胃經開胃增食治暴痢腹脹寬中消食且無油膩干則為鯗其性疏利能理腸胃首中有石可治石淋磨服或燒為末得海中水土之氣故甘能補胃而五臟皆得所養則中氣自益矣人部四七發灰名血餘味微苦微寒入肝腎二經補陰和血自陰而生自下而長得陰陽之生氣凡補藥中自人參熟地而外當以此為亞壯腎色黑補肺氣雄治吐衄崩漏舌血茅根湯調服血暈血痢血淋腸風轉胞不通利二便去瘀長肉以上諸症屬血寒者酒調服屬血熱者童便調服在陰可以培形體壯筋骨托癰疽在陽可以益神志闢寒邪溫氣海以陰中有陽靜中有動也合藥熬膏能治潰瘡涼血皂莢水洗淨入罐固煅存性用胎髮老景得之大補衰涸頭垢名百齒霜即篦發之垢膩為丸服治淋閉不通傷寒勞復出竹木刺入肉津和塗之亂髮灰煅制同前血症亦用若誤吞發燒喉入腹成癥取自己發燒灰水調下即外人發灰亦可用治破傷風入腦加何首烏末酒調灌蘇療火灼腫毒同雞子黃熬油塗之止金瘡血以灰敷之鼻衄以灰吹之解小兒驚癇同雞子黃煎服雞子能去風痰發灰能去心竅之血四七一人牙味鹹溫有毒火煅研調酒服齒牙腎之標骨之餘也治勞腎虧除瘧托痘瘡倒黶欲其入腎攻毒蓋劫劑也若氣虛色白毒伏在心癢塌無膿及紫泡熱痱之症只宜補虛解毒不得誤用凡痘瘡黑陷咬牙止用一二釐或少加麝蓋性烈恐發表太過不得已而投之可也人津沫精氣所化於五更時塗腫即消拭目去障咽于丹田制火固精輕身延年仙家以千口水成活字誠不死之方四七二人乳味甘氣平入心腎脾肺四經乃氣血之液也大補榮衛培益元陽安神魂潤腸胃退虛熱滋干膈一切虧損勞症此以人補人卻病延年之聖藥也但功專補陰若陽虛胃寒作瀉者禁之取年少無病人之乳曬乾用茯苓粉收或用錫瓢盛乳浮滾水上一刻再浮冷水上立干刮取粉用尤良四七三紫河車即人胞衣也味鹹性溫入肝腎二經本人之氣血所生補一切虛損勞傷凡骨蒸盜汗腰痛膝軟體瘦精枯俱能補益又益婦人俾育胎孕長流水洗淨酒蒸焙乾以銀器插入焙煮器不黑則無胎毒庶可用或煮爛搗化入藥四七四臍帶小兒脫下臍帶為真氣聚會之物燒灰存性與小兒服可解胎毒稀痘瘡培元氣免驚風返本還元之義也四七五童便味鹹寒入肺胃膀胱三經降火滋陰善清一切血熱妄行咸走血分治吐衄損傷凡跌打損傷血悶欲死者以熱童便灌之療熱狂煩躁肺痿失音退陰火定喘促引肺火下行從膀胱出利大小便肺與大腸相表裡又系水之高源肺清故二便自利除勞瘵骨蒸火不上炎療難產下胞衣散瘀之功及產後敗血攻心凡產後用童便合酒服最妙法當乘熱飲之熱則真氣尚存降火甚速降血甚神取八九歲之便去頭尾用中間一節須清徹者為妙入薑汁行痰韭汁散瘀冬月用湯溫之輪迴酒自己之溺治火上炎陰熱勞嗽晉氏云飲溲溺百無一死服涼藥百無一生療目赤腫痛用己尿乘熱抹洗大退邪熱按小便性寒若陽虛無火食不消腸不實者忌之四七六秋石味鹹氣溫滋腎水潤三焦退骨蒸水足軟堅塊味鹹治虛勞咳嗽白濁遺精補腎之功若煎煉失道多服反生燥渴之患咸能走血且經煅煉中寓暖氣使虛陽妄作真水愈虧不如童便未失真元之氣矣四七七人中白即溺器中之白垢入肝腎三焦膀胱四經味鹹性涼能瀉四經有餘之火內服可除骨蒸勞熱肺痿吐血外治湯火灼瘡口舌疳爛除熱降火之功痘瘡倒陷煅研為散為丸用四七八人中黃味甘性寒入胃經解五臟實熱治天行瘟疫熱狂如神痘瘡血熱黑陷不起用竹去青皮通空一頭入甘草末將竹一頭實者立冬插廁立春取來置於有風無日處陰乾半月取甘草用人糞極苦大寒解諸毒治疔腫用新糞敷一日根爛干糞燒煙盡研細服治痘瘡黑陷並時行大熱狂走糞蛆撈起漂淨治小兒疳脹神方糞清一名黃龍湯一名金汁截竹去青入糞坑中積年得汁甚黑而苦埋地年深如泉清而無穢氣者治天行熱狂痘瘡熱陷解惡瘡瘟病疔腫百毒垂死皆療又法取汁用棕上加棉紙再鋪黃土淋糞濾汁入甕以碗覆之埋土中一年用按傷寒非陽明實熱痘瘡非紫黑乾枯者均禁四七九褲襠灰治陰陽易人於時病後交合陰陽便即相著甚於本病其候小赤澀寒熱頭痛耳鳴眼花女患陽易須男子褲若男患陰易須婦人褲取對陰處燒末服之以陰陽既易之病即以陰陽之物治之月經布解極毒之藥箭味鹹為水化毒得水則解治安勞復病熱病後交合其症熱躁或卵縮腹痛蓋前病餘熱未除陰精復損故有是症月布乃陰中有陽之物能補陰以除熱也療男子陰瘡因不忌月事用月布燒存性麻油調敷紅鉛童女首行經血用法得之即楞嚴經所載精仙是也回垂絕之陽有奪命之權服之而熱極者惟童便可解
