body:
  text: 卷之七雜證七論齒牙病屬手足陽明二經風熱虛火實火腎虛蟲咀等症出血者曰齒衄齒者骨之餘腎之標寄養於齦上齦屬足陽明胃下齦屬手陽明大腸而其為病則有三焉一曰火病在齦即牙床肉也或腫痛糜爛或牙縫出血是濕熱蓄於腸胃而上壅於經治宜清涼二曰蟲病止在牙亦由濕熱生蟲蝕損蛀空治宜殺蟲兼清胃火三曰腎虛病在臟或齒脆不堅或疏豁動搖或中年而即脫者必腎氣之不足治宜補養凡此三者其中各有不同辨真而治自易清胃散治胃有濕熱上下牙痛或潰腫出血等證生地丹皮黃連當歸各一錢升麻六分或加石膏甘露飲治腎虛火炎胃虛鬱熱此方瀉而兼補齒病悉除生地熟地天冬麥冬石斛茵陳枇杷葉黃芩枳殼甘草等分煎服加犀角磨水合服更妙玉女煎治腎陰本虧胃火復盛煩渴牙痛糜爛齒衄等症熟地三五錢麥冬二錢知母牛膝各一錢半生石膏研三五錢如火之極盛者加梔子地骨皮如小便不利加茯苓或澤瀉細辛煎治牙齒腫痛及口氣臭北細辛一味煎濃汁乘熱噙漱良久吐之極妙或加石膏丁香散治齒痛丁香蓽茇蠍梢大椒等分為末擦之赴筵散治蟲牙用良薑草烏細辛荊芥穗等分為末擦牙涎則吐之又方用韭子煎汁漱之又方用川椒炒蜂房炙等分為末每用二錢水煎熱漱加味地黃丸治真陰不足以致齒疏動搖壯年脫落者熟地八兩山藥四兩棗皮酒蒸茯苓各四兩澤瀉一兩丹皮兩半枸杞三兩酒蒸菟絲子淘去泥沙酒蒸四兩補骨脂鹽炒二兩骨碎補三兩煉蜜為丸空心鹽湯下七八錢如命門火衰真陽不足者加肉桂三兩附子四兩或安腎丸方見咳嗽亦妙鎮陰煎治陰虛於下格陽於上脈微厥冷而牙縫之血大出此非實火不得誤用寒涼熟地一二兩牛膝二錢甘草炙一錢澤瀉八分肉桂一二三錢附子一二三錢速服如治格陽假熱者冷服凡血大吐大下者俱宜用此凡走馬牙疳牙床潰敗齒牙脫落大為凶候此蓋熱毒蘊蓄而然速瀉陽明之火宜清胃散連速進之如玉女煎方見上亦可或體實口渴二便團結加大黃下之不應加芒硝外用銅緑滑石杏仁等分為末頻擦立愈三仙散治走馬牙疳一時腐爛即死用銅祿三分麝香半分溺垢用婦人溺桶中白者火煅存性一錢共為極細末敷齒上不可太過又方用干北棗燒存性同枯白礬為末敷之神效又方用麝香半分膽礬一錢銅緑三錢生白礬五分為末敷牙患處青白散治一切牙痛固齒青鹽二三兩研食鹽二兩川椒皮去目五六錢濃煎汁去椒用汁煮鹽至干為末早夜擦牙床肉內外良久方吐稍留藥味以睡即咽之更妙豫用至七旬最驗取牙方草烏蓽茇各分半川椒細辛各三分上為細末用少許點在患牙內外一時其牙自落備揀古來治齒諸病至簡至穩神方於後以便取用牙縫出血苦參一兩枯白礬一錢為末日三揩之又方醋浸竹茹含之走馬牙疳先以淡鹽湯漱淨次用五倍子青黛枯礬黃柏為末摻之牙痛口臭用大黃燒存性為末早晚揩齒良久漱之牙齦疳臭五倍子炒焦一錢枯白礬銅青各一分共為末先以米泔漱淨摻之牙痛用荔枝連殼燒存性為末摻之又方用絲瓜藤一握川椒一撮燈心一把煎濃汁漱吐蟲牙痛用松脂滾水泡溶漱之又方用韭菜子燒煙燻之牙蟲即出其法以筆管用紙糊喇叭樣可以收煙又方茄根搗汁塗之或燒灰存性點之又方燒酒浸花椒漱之齒不生用雄鼠脊骨研末揩之取牙用茄樹根以馬尿浸三日曬乾炒焦為末點牙內外即脫保齒堅固用羊脛骨火煅存性為末加青鹽研勻早夜揩牙又方用香附炒黑二兩青鹽兩半為末如常揩牙凡牙齒痛屬寒者宜乾薑蓽茇細辛屬熱者宜石膏牙硝屬風者宜皂角薑蠶蜂房屬蟲者宜石灰雄黃保齒用旱蓮草根一斤酒洗淨青鹽四兩醃三宿同汁炒乾研末日用擦牙連汁咽之能烏須固齒取牙用鳳仙花子研末入砒少許點牙即落八論咽喉咽痛是君火有寒包熱喉痹是相火有嗌疽俗名走馬喉痹殺人最急惟針破之最為速效次則用火經曰一陰一陽相結謂之喉痹少陰君火也少陽相火也夫火何以動以有內外之因故火引痰上而痰熱燔灼壅塞咽喉之間其症不一腫於兩旁者為雙蛾腫於一邊者為單蛾圓突如珠乃癰癤之類宜刺出其血而愈若纏喉風則滿片紅腫多不成膿亦不必出血但使火降其腫自消然火有虛實之分其因情志鬱怒而起者多屬少陽厥陰為風木之臟固易生火以口腹辛熱而起者多屬陽明以胃氣直透咽喉故又惟陽明之火為最盛脈實症實宜以火治至於少陰其脈絡於橫骨終於會厭會厭者掩其氣喉令水穀能進食喉而不錯繫於舌本凡陰火衝上多為喉痹痹即纏喉風也然亦有虛實之異若是實火症與脈皆實亦易知也設色欲過度以致真陰虧損者此腎中之虛火也非壯水不可六味地黃湯主之又有火虛於下而格陽於上此無根之火即腎中之真寒症也非溫補命門不可八味地黃湯主之必須遵內經從治之法切不可用寒涼以促其危耳通天達地散治諸喉痹腫痛連翹防風貝母荊芥元參白芥子天花粉枳殼甘草赤芍桔梗黃芩牛蒡子射干等分加燈心水煎服外用木鱉子磨醋噙喉中引去其痰不可咽下太酸少摻清水亦可隨服煎藥後用吹藥七寶散吹一切喉痹薑蠶直者十個硼砂雄黃明礬各一錢全蠍十個頭角全者去毒牙皂一挺去皮弦膽礬五分為細末用竹管吹之金鑰匙治風熱喉痹月石五錢牙硝兩半薑蠶一錢五分冰片三分雄黃二錢共研細末吹之立愈雄黃解毒丸治急喉風雙蛾腫痛湯藥難下垂危時方用雄黃鬱金各一兩巴霜十四粒研末醋糊丸緑豆大凡口噤者用三粒淡醋磨化以物開其口灌之下咽即活普濟消毒飲治疫喉傳染並治大頭瘟黃芩酒炒黃連酒炒各五錢人參三錢橘紅元參甘草桔梗柴胡各二錢薄荷葉鼠黏子板籃根連翹馬屁勃各一錢白薑蠶炒升麻各七分共研細末半用薑湯調時時服之半用蜜丸噙化服盡良愈此東坦之天方也加味甘桔湯新治喉腫痛寒熱虛實照後加減平穩有效甘草錢半桔梗錢半元參一錢赤芍生地防風各一錢荊芥七分薄荷七分山豆根連翹黃芩各一錢北細辛三分羌活六分獨活七分白芷八分水煎服肝膽火加白芍梔子膽草胃火加石膏三錢若大便祕結者加大黃芒硝毒甚而爛者加牛蒡子金銀花六味地黃湯加麥冬二錢五味子四分冰片破毒散治急慢喉痹腫塞切痛朴硝四錢薑蠶微炒去咀八錢甘草八錢青黛六錢馬屁勃三錢蒲黃五錢麝香一錢冰片二錢共研細末瓷壇密收每用一錢清水調咽於是喉痹即破出血即愈若非喉痹自然消散備採古來治喉諸病至簡至穩神方於後以便取用急喉痹風元參牛蒡子半炒半生各八錢煎服喉中懸癰舌腫塞痛五倍子薑蠶甘草等分白梅肉搗和丸噙咽其癰自破急喉痹風薑蠶南星為末薑汁調灌涎出即愈急喉風塞腫皂角挪水灌之外以皂角末醋調厚封項下又可用皂角去皮醋浸炙七次浸七次勿太焦研末吹之喉痹將死不可針藥乾漆燒煙以筒吸之腫喉瘡吳茱萸末醋調塗足心喉痹欲死紫菀搗汁浸喉涎出即瘥更以馬牙硝津咽之斷根喉腫莫言山豆根磨醋噙之涎出能言喉中腫痛硼砂含化咽津初起便治即免喉痹喉癰乳蛾明礬三錢巴豆劈開三粒同入銚內煎乾去豆研礬點之甚者以醋調灌喉痹將死者以烏魚膽點入即瘥病深者水調灌之以下治骨哽方雞煎骨哽苧麻根搗汁服之又方白鳳仙子研末水調以筒灌入即軟而下或研末吹之即根葉醋煎服亦可雞骨哽喉五倍子研末吹之發入喉舊梳燒灰酒調服銅鐵哽鳳仙子及根擂汁服即木賊燒灰水調服亦下竹木哽服半夏取吐又稱錘燒紅淬酒服治哽用苧麻根搗如龍眼大雞骨用雞湯下魚骨用魚湯下九論聲喑聲喑之症雖兼五臟而於心肝腎三經為重又須知其虛實治之乃為上工蓋舌為心之苗心病則舌不能轉此心為聲音之主也聲由氣而發肺病則氣奪此氣為聲音之戶也腎藏精精化氣陰虛則無氣此腎為聲音之根也然三者之中又以腎為主腎陰一足則水能制火而肺以安庶金清而聲亮矣譬之鐘焉實則不鳴破亦不鳴肺被火爍是邪實其中即形破於外聲何由而出乎是知宜補水以降火也至於實邪之閉其竅者或肺冒風寒或肺被客熱散之清之而病自愈此暫而近者也彼虛邪之為害者內奪而喑也有房勞之奪傷其腎也憂思之奪傷其心也驚恐之奪傷其膽也飢餒疲勞之奪傷其脾也暴怒氣逆之奪傷其肝也此非各求其屬而大補元氣安望傷殘者之復完乎此外復有叫號歌哭冷飲吸風而致喑者能知養息自不藥而愈不足虞也加味枳桔二陳湯新治感冒風寒頭痛聲喑無汗惡寒痰凝氣滯脈息浮緊等症陳皮去白一錢半夏錢半茯苓一錢三分麻黃去節五分桂枝八分北細辛八分杏仁去皮尖十五粒甘草一錢桔梗一錢枳殼一錢薑蔥引鎮陰煎治陰虛於下陽躁於上是命門火不歸源右尺脈虛弱漸漸喉腫而痛色淡便清久而不愈或頭項腫煩躁口渴熟地一二兩牛膝二錢炙甘草一錢澤瀉八分肉桂一二錢附子制一錢或二三錢水煎冰冷服又方用大附子切作五片加蜜搽之火上炎黃含咽味盡易之八味地黃湯亦妙宜冷服滋陰八味湯治陰虛火盛喉頸腫痛左尺脈弱並治喉痹山藥棗皮各二錢黃柏鹽水炒知母鹽水炒各錢半熟地四錢茯苓丹皮澤瀉各錢半麥冬去心錢半水煎服即喉生瘡而爛久不愈者亦屬陰虛可服而愈萆薢湯治喉齶潰蝕與鼻相通面蝕癰潰久不愈者此方本治淫瘡味甘而利去濕熱和血脈瘡毒皆宜效難盡述土萆薢即土茯苓二三兩濃煎徐徐服之若患久或服攻擊之劑致傷脾胃氣血等症以此味為主外加對症之藥又方土茯苓五錢或一二兩當歸白芷皂刺薏仁各錢半白鮮皮一錢甘草五分木通銀花木瓜忌鐵各一錢水煎服甚者萆薢加三四兩治症同上仙遺糧湯治梅瘡結毒喉爛不愈萆薢二兩即土茯苓也忌鐵器濃煎去渣滓入後藥當歸生地防風各一錢木通薏仁金銀花黃連連翹各一錢白鮮皮七分白朮皂刺各七分甘草四分加燈心二十根用萆薢湯煎服麥門冬湯治火邪侵肺或咳嗽喘急上焦熱甚而聲喑者天冬麥冬桑白皮各一錢紫菀茸川貝母各八分桔梗一錢甘草五分淡竹葉生地各一錢三分或加五味九粒煎服如胃火口渴加生石膏二錢或竹葉石膏湯方見於傷寒清裡條內小降氣湯治肝邪暴逆濁氣在上痰涎壅盛而聲喑者家紫蘇臺烏藥白芍陳皮各二錢甘草炙五分薑棗引煎服竹衣麥門冬湯治一切勞瘵痰嗽聲啞難治者服之神效竹衣取竹內衣膜鮮者一錢竹茹即竹青皮括取彈子大一丸淡竹葉十四片麥冬一錢甘草橘紅各五分茯苓桔梗各一錢杏仁七粒去皮尖煎出加竹瀝一杯和勻服如陰虛火旺者間服左歸飲如命門火衰不歸原者服右歸飲二方見咳嗽條內或六味丸八味丸亦妙不得徒治其末也凡病久咳聲啞者必由肺腎俱敗但宜補肺滋腎養金潤燥或略加訶子百藥煎收斂以治其標務宜先本後末或可保全若見其假熱而用寒涼或見其痰盛而用消散則未有一治者矣備揀古來治喑至筒至穩諸方於後以便取用失聲不出用蘿蔔自然汁稍加薑汁時時細飲又方用皂角一條去皮子同蘿蔔三個煎服數次又方用橘皮三兩水煮頓服又方用杏仁去皮三錢煎熬別研肉桂末一錢和搗為丸杏核大每用一丸綿裹含口中細細咽之日三夜五又方用蜜陀僧為細末每用一錢點茶飲之又方訶子四個半生半煨桔梗一兩五錢半生半炒甘草三錢半生半炙上分二服半水半童便煎服喉風失音用靛花蘇薄荷葉等分為細末蜜丸彈子大每用一丸臨睡噙化以上皆治標之法凡猝喑輕淺者亦可取效若系根本之病不得概用十論脅痛有肝膽火肺氣鬱結死血食積左為肝氣上為痰癖脅痛之病本屬少陽膽經厥陰肝經以二經之脈皆循脅肋故也然經言心肺胃腎與膀胱皆有脅痛之病以邪在諸經氣逆不解必以此相傳延及本經則無非肝膽之病矣至於忿怒傷血傷氣傷筋或寒邪在半表半裡之間此是本經之病當直取本經傳自他經者拔其所病之本自無不愈然脅痛即隔痛其與心痛別者心痛在岐骨陷處胸痛則橫滿於胸中兩脅間也其與胃脘痛別者胃脘痛在心之下胸痛在心之上也其痛有內傷外感之辨凡寒邪在少陽經乃病為脅痛耳聾而嘔必有往來寒熱方是外感如無表症悉屬內傷但內傷多而外感亦間有之耳諸家有謂肝左而藏血肺右而藏氣考之諸經卻無明證實後世之謬淡也欲辨氣血惟察其有形無形而可知矣血積有形而不移或堅硬而拒按氣痛流行而無迹或倏聚而倏散若食積痰飲皆屬有形之症第詳察所因自可辨識且凡屬有形之症亦無非由氣之滯而然凡治此者無論是血是痰須兼行氣之藥而後隨症佐使自中肯綮三柴胡飲治外感風寒邪在少陽身發寒熱脅痛耳聾柴胡二錢白芍錢半甘草炙陳皮各一錢當歸二錢生薑五分溫服如氣不流通加青皮香附廣木香白芥子之類即小柴胡湯亦可方見傷寒表症加川芎青皮白芍溫中散寒湯新治寒邪外閉畏寒脅痛脈虛體弱表裡兼顧者當歸三四錢山藥二三錢茯苓錢半甘草一錢青皮六七分柴胡錢半陳皮一錢香附七分肉桂一二錢或改桂枝錢半生薑一錢煨用或改乾薑炒用溫服如外寒甚而無汗者加麻黃一錢如內寒甚而喜按者加附子一二錢如嘔逆者加半夏二錢木香順氣散治氣滯脅痛腹痛木香五分香附七分檳榔青皮陳皮枳殼砂仁厚朴薑炒蒼朮各八分薑引如氣寒滯痛如丁香五分或加白豆蔻藿香之屬化肝煎治怒氣傷肝因而氣逆動火動血脅痛脹滿煩熱青皮陳皮白芍丹皮梔子各錢半土貝母二三錢澤瀉錢半如血見下部者甘草代之溫服如火盛加黃芩膽草如脹滯脅痛加白芥子一錢勿用白芍如兼寒熱加柴胡一錢推氣散治右脅脹痛片薑黃枳殼麵炒桂心各五錢甘草炙五錢共研末薑湯調服又謂宜消食行痰木通散治男婦肝腎氣滯自下而上痛連兩脅木通青皮蘿蔔子炒茴香各五錢滑石二錢半莪朮二錢五分木香二錢半川楝子取肉用巴豆三錢同炒黑去巴豆五錢共研末蔥白湯調服三錢消導湯新治飲食留滯胸膈上有一條槓起痛者是也厚朴薑炒茯苓砂仁山楂麥芽神麯各錢半陳皮一錢五分枳實八分白芥子七分生薑引如胃寒嘔逆加炮乾薑一錢如氣滯而痛加木香香附如食積堅硬難化加檳榔莪朮補肝散治肝腎精虛不能化氣氣虛不能生血氣血少不能流暢以致胸脅作痛但宜培補不得再用香燥以自伐也熟地白朮各一兩棗仁炒獨活各二兩當歸川芎山藥黃耆蜜炒棗皮各七錢五味炒木瓜各四錢上咀片每服七八錢棗二枚水煎服逍遙散治肝脾血虛或鬱怒傷肝而脅痛者當歸白芍白朮茯苓各一錢半甘草一錢柴胡酒炒一錢生薑七分煨煎服或加薄荷葉三分更效柴胡疏肝散治外邪未解而兼氣逆脅痛或寒熱往來陳皮醋炒柴胡各二錢川芎枳殼白芍各一錢五分甘草五分香附一錢食前服備採古來治脅痛至簡至穩神方於後以便取用驚傷脅痛用枳殼一兩桂枝五錢為末薑棗湯調下脅痛用白芥子研末水調敷之又方吳茱萸研末醋調敷之又方韭菜炒尉之又方柑子葉搗爛炒燒酒淬尉之又方青皮研末炒酒淬揉之寒痛用艾葉搗爛燒酒和炒尉之肝膽火痛如柴胡膽草青黛青皮木香香附之類皆可揀用脅痛用鳳仙花曬研酒調服三錢活血消積痛屬痰而走易者用真白芥子紫大戟去皮甘遂麵裹煨等分為末米湯糊丸淡薑湯下七八丸名控涎丹十一論腰痛有腎中之陰虛腎中之陽虛有風寒濕熱有挫折瘀血附膝痛兼治腰者腎之外候一身所恃以屈伸者也蓋諸脈皆貫於腎而絡於腰脊腎中或陰不足或陽不足或先天稟賦不厚或後天培養不周以致顏色刮白脈息細微疲倦無力勞動而腰痛益甚者雖因積漸而致然實真陰之虛症也至於外感風寒濕熱其痛必暴症屬有餘為易治也但須知邪必乘虛而犯驅邪之中宜顧元氣庶本末朗然而日後無虞矣脈息脈大無力為虛弦細而數為陰虛尺弱無神為命門火衰澀為死血沉滑為痰沉細而遲為氣虛沉弦為氣滯弱緩為濕緊數為寒浮緩為風洪數為熱滋陰大補丸治腎中之陰不足腰膝無力而痛久服輕身延壽熟地八兩山藥炒棗皮酒蒸茯苓肉蓯蓉酒洗去甲杜仲鹽炒各四兩淮牛膝酒蒸巴戟枸杞酒蒸各三兩小茴淡鹽水炒二兩遠志去心二兩石菖蒲炒五味子炒各一兩五錢先將熟地棗皮蓯蓉牛膝枸杞搗化後入藥末加煉蜜為丸空心用淡鹽水送七八錢即六味地黃丸左歸丸各加杜仲鹽炒四兩亦佳前方加肉桂三兩附子三四五兩治右尺無力命門火衰水火兩虧腰膝冷痛即八味地黃丸加杜仲四兩右歸丸亦佳煨腎丸治肝腎虛損腰冷腰痛川萆薢杜仲薑水炒淮牛膝酒蒸補骨脂炒胡蘆巴炒菟絲子酒蒸曬乾肉蓯蓉酒洗去甲搗化為丸沙苑蒺藜炒去刺各四兩肉桂二兩酒煮豬腰子四個搗和為丸干則加煉蜜鹽水送下加減五積散方見傷寒表症治風寒在經其症必寒熱腰痛連背如寒甚無汗加麻黃七分即夏季亦用以內有白芍斂陰也如熱甚口渴加黃芩花粉石膏之屬如大便結燥加酒炒大黃如汗甚者去羌活如春夏秋加蒼朮當知杜仲宜用以引入腰也桂附杜仲湯新治真寒腰痛六脈弦緊口舌青陰囊縮身戰栗肉桂三錢附子三四錢急則用生附子杜仲二錢熱服如上焦假熱拒格冷服如膝冷而痛加川牛膝二三錢如兼濕者加蒼朮二錢六味清涼湯新治體旺脈洪而滑二便閉澀口渴喜冷熱甚腰痛者黃芩黃柏大黃酒炒梔子炒膽草澤瀉各等分水煎熱服當歸拈痛湯治濕熱為病身重腰痛及肢節紅腫羌活黃芩甘草茵陳各錢半苦參防風當歸白朮蒼朮豬苓各一錢人參隨便升麻三四分乾葛知母澤瀉各八分空心服臨睡再服三妙散治腰膝濕痛仙方或汗後過水或汗衣冰身或坐臥濕地或宅地陰濕春夏濕熱之氣上蒸受病者立愈蒼朮三四錢黃柏炒焦二錢川牛膝二三錢水煎夜服並參閲濕症門活血四物湯新治跌僕筋骨血氣凝滯腰痛凡傷各處者俱效當歸身尾四五錢川芎二錢白芍生地桃仁去上牛膝元胡酒炒各錢二分紅花酒炒肉桂各一錢二分空心服如痛甚加乳香沒藥俱去油一錢外用酒糟蔥薑搗爛炒熱罨之如血逆之甚加大黃酒炒三四錢以大便閉結也腰痛不已者屬腎虛痛有定處屬死證往來走動屬痰屬風腰冷身重遇寒即發屬寒濕或痛或止屬濕熱而其原多本於腎虛以腰者腎之府也惟虛故外邪得以干之凡人之腎何以虛也由斫喪之甚若酒醉入房者快一時之心更不知養身以致腰膝疼痛骨枯而痿豈直腰痛已哉此時悔之無及養生重命之人能慎於斯優於補劑多矣餘年七旬見之亦多書之為後生告焉備揀古來治腰膝諸痛至簡至穩神方於後以便取用風寒腰膝疼痛用川烏三個生搗爛加鹽水少許攤帛上貼患處又方用杜仲薑水炒或鹽水炒三兩濃煎水煮羊腰子四枚至熟加鹽椒作羹空腹食之腰膝骨痿不能起床用川萆薢杜仲鹽水炒各四兩研末以豬腰子四個酒煮搗爛加煮腰子余酒和為丸鹽水送下腰痛用威靈仙此治痛要藥為末每用溫水調服二錢或用豬腰子劈開摻藥末濕紙包煨五更細嚼酒送下男婦腰痛用元胡當歸肉桂杜仲等分為末酒下三錢治腎虛腰痛用固脂炒四兩杜仲鹽水炒八兩胡桃肉十兩為末煉蜜為丸名青蛾丸或加巴載四兩肉蓯蓉大茴香各三兩尤妙腰不痛者亦宜服腰痛用絲瓜藤根燒存性研末酒送二錢濕痛用桃花酒服一錢跌傷腰痛用續斷煎酒服以能化惡血也腎虛腰痛不能屈伸單用杜仲去粗皮咀片淡薑水拌炒乾每日煎水代茶服二三十日永不再痛十二論眩暈眩者目黑也暈者頭旋也河間以風治丹溪以痰治何內經但曰上氣不足頭為之傾目為之眩曰上虛則眩曰督脈虛則頭重高搖之曰髓海不足則腦轉耳鳴而眩目何無一言及風與痰也原其所由多在年老精衰體弱病後或勞倦日久心思過度之候而然宜以補虛為主而兼治其標可也但眩暈雖屬上虛然不能無涉於下蓋上虛者陽中之陽虛也宜補其氣如四君子湯歸脾湯補中益氣湯之類是也下虛者陰中之陽虛也宜補其精如八味地黃湯右歸飲之類是或有兼痰兼火等症者必有形色脈息可驗方可兼用不得先執偏見而妄用消散以鏟削元氣也凡眩暈有大小之異如氣稟薄弱用心用力之後或頭眩眼黑倏傾而止者有之至於中年之外多見眩僕卒倒等症人多以為中風中痰而妄用剪風化痰之藥不大誤乎蓋忽暈而忽轉者以氣血之未敗也卒倒而久不轉者以根本之已虧也此際急用氣血兩補之劑方可如十全大補湯之類凡邪氣在上多為頭痛故經曰上實也至於眩暈之病經曰上虛或為頭重或轉旋不可以動而人亦為實者以頭重也不知頭本不重而惟陽虛乃覺重耳可不知所以補乎凡眩暈一症虛者十居八九而兼痰兼火者不過一二耳治者宜知益氣補腎湯治氣虛眩暈人參一錢黃耆蜜炒錢半無參者宜加倍茯苓一錢白朮二錢淮山藥二錢棗皮錢半甘草炙五分紅棗二枚食遠服苓桂朮甘湯治虛痰眩暈茯苓四錢桂枝錢半白朮三錢甘草錢半溫服或加南星半夏天麻朮附湯治中氣虛寒厥冷口噤痰盛脈弱頭眩頭重等症白朮三錢炙草錢半附子二錢薑棗引補中益氣湯右歸飲見寒熱門歸脾湯見脾胃門八味地黃湯見燥症十全大補湯見傷寒論補條十三論不寐靈樞曰陽氣盡陰氣盛則目瞑是寐本乎陰神為主也神安則寐而神之所以不安者有實有虛實者邪氣之擾亂也如外有風寒暑濕之邪內有痰火水氣忿怒之邪去其邪而神自安此屬有餘之症治之恆易彼無邪而不寐者由於心腎二經之虧虛也蓋人之神寤則棲心寐則歸腎心虛則無血以養心自神不守舍而不能歸藏於腎故不寐腎虛則不能藏納心神於中故寐不能沉並不能久是以少年腎足則易睡而長老年陰衰則難睡而短且腎水既虧相火自熾以致神魂散越睡眠不寧似乎痰火有餘之症不得用寒涼以激之當補真水以配之則火息而寐自安矣凡有外邪內邪必有脈與症可驗邪屬風寒散之如麻桂蘇葛之類邪屬火熱涼之如竹葉石膏芩蓮之類邪屬痰飲化之如溫膽湯導痰湯之類邪屬飲食消之氣滯行之水濕利之此大概也仍當於各門求法治之至於心腎虧虛須知調補導痰湯治一切痰涎壅塞胸膈痞滿不通日夜不寐等症陳皮半夏茯苓甘草南星枳殼各二錢薑引溫膽湯治氣鬱生涎夢寐不寧心虛膽怯諸症陳皮錢半半夏茯苓甘草枳實竹茹各一錢薑棗引或加南星棗仁各錢半或加志肉一錢棗仁地黃湯治心虛少血煩躁不寐棗仁一兩熟地五錢米二合煮粥食之橘紅石斛湯治胃不和則臥不安橘紅二錢甘草錢半石斛二三錢茯苓錢半神麯炒山楂各一錢半夏一錢八分如胃熱口渴加石膏花粉秫米半夏湯治胃不和久不寐者神效秫米一升半夏半升用千里長流水八升揚之以筒入水高揚而下萬遍取清者五升煮二味至升半去渣飲汁日三服其新病者覆杯即臥久病者三日自已遠志湯治心虛煩熱夜臥不寧及病後虛煩遠志去心黃耆蜜炙當歸麥冬石斛棗仁炒各一錢二分茯神一錢二分甘草炙五分水煎服如煩甚者加淡竹葉或再加知母歸脾湯治過思傷脾怔忡不寐或倦臥少食大便不調人參少者以山藥三錢炒黃代之白朮元肉棗仁蜜耆各錢半志肉八分當歸一錢三分廣木香三分甘草炙七分薑水煎服生棗仁湯治膽熱多睡棗仁生為末茶清調服日三錢熟棗仁湯治膽虛不眠棗仁炒為末竹葉湯調服日三錢心腎交補丸新治心腎兩虛神思恍惚夢遺膝軟夜臥不寧熟地八兩棗皮四兩淮藥四兩茯苓三兩棗仁炒三兩杜仲鹽炒三兩北五味兩半當歸三兩遠志二兩煉蜜為丸淡鹽水送下如右尺脈弱陰中無陽加肉桂二三兩如精血乾涸加枸杞四兩凡心虛有火燈心草煎服心肺熱用麥冬膽虛心煩用棗仁炒研末竹葉湯下如茯神知母丹皮俱可擇用凡病後及婦人産後不得眠者此皆血氣虛而心脾不足以補養為主或有痰火少佐清痰降火之藥治之不得過為克伐十四論腹痛內經之論腹痛獨引寒淫者居多以寒邪之閉塞陽氣獨甚也但六淫七情損傷榮衛致病多端豈僅一寒也哉痛在上焦者屬胃脘在胃脘下者屬太陰脾經在中焦當臍者屬少陰腎經在下焦小腹者屬厥陰肝經及大小腸膀胱也其痛也有因食滯寒滯氣滯之異有因蟲因火因痰因血之殊諸如此類須辨虛實庶無差誤其痛之可按者為虛拒按者為實久痛而緩及得食稍可與牽連腰背無脹無滯二便清潤者皆虛也暴痛而急及腸滿畏食與腸臟中有物有滯或痛處堅定不移二便燥赤者皆實也微實者調之大實者攻之虛者或氣或血宜微補峻補自有權衡不得以痛無補法及痛皆屬火而聽無稽之謬論也腹痛脈理寒脈沉緊而遲熱脈浮洪而數虛脈散大無力實脈弦洪有力痰脈滑數飲脈沉弦積脈沉弦而伏聚脈或伏或弦蟲脈多沉滑或乍大乍小死血脈沉而澀或結或促此脈之常道也而腹痛之脈又不可拘蓋暴痛之極者每多沉伏細澀實亦似虛不知氣為邪逆則脈道不行而沉伏異常此正邪實之候也能於沉伏中細察之而有弦緊之意此寒邪阻遏陽氣多有是脈此際因其微細認為虛脫妄用補劑誤矣辨此之法但當察其形氣見平素之強弱問其病因及時日之久暫大都暴病痛急而脈忽細伏者多實邪久病痛緩而脈本微弱者為虛邪再以前論虛實之法參而診之則萬無一失矣神香散治上焦胃脘逆氣疼痛嘔噦脹滿痰飲膈噎等症丁香白豆蔻或砂仁亦可二味等分為末溫水調下五七分日數服如寒氣作痛者薑湯送下吐法治上焦胃脘實邪或痰飲食積氣逆作痛等症蘿蔔子搗碎以溫水和攪澄清服之即吐或用鹽一撮於鍋內炒紅乃入以水試其味稍淡飲之以指探喉取吐簡易二方凡胃脘當心而痛或氣或寒觸而屢發者用荔枝核打碎燒微焦三錢加木香二錢共為末以溫湯調服一錢數服斷根屢試神效又方用牙皂角以微火燒煙甫盡取起為末用燒酒調送七八分其效如神屢試不爽理氣散寒湯新治中下二焦寒滯氣逆腹痛或嘔瀉或不嘔不瀉而為乾霍亂危劇等症蒼朮厚朴薑炒陳皮去白甘草各一錢三分藿香砂仁枳殼各八分木香五分香附烏藥各一錢五分熱服如食滯加山楂麥芽神麯各錢半如痛而嘔加半夏錢半如寒甚喜熱者加吳茱萸肉桂之類如氣滯而不流通加白芥子青皮檳榔之類如小腹痛甚加小茴如兼疝者加荔枝核煨熟二三錢養榮湯治氣血虛寒不能榮養心脾而痛者連綿不止或按之尉之而痛稍緩此非甘溫養血補胃和中不可也當歸二三錢熟地三五錢枸杞二錢白芍煨錢半甘草炙一錢肉桂一二錢溫服如寒甚者加附子一二錢如氣虛者加人參如脾虛痛而瀉者加白朮二三錢如中氣虛寒嘔惡者加半夏二錢焦乾薑錢半如氣滯者加香附一二錢丹溪曰諸痛不如補氣為邪實氣滯者言之而曰諸痛皆然則謬矣三聖湯新治一切虛寒老弱虧損偶有寒觸氣痛連日不止凡香燥之藥用之而反劇者宜滋陰暖胃為主熟地七錢用薑汁炒當歸五錢附子二錢溫服如氣滯加陳皮化食方新治夾食胸腹痛日輕夜重得食更甚喜重按者吳茱萸開水炮一次焙乾二錢神麯炒谷蟲陳皮各六分雞內金四五張共研細末白砂糖少許溫水調服一錢即睡一刻此余屢用神驗凡家中多辦大人小兒夾食感寒者服之即愈局方四七湯治痰涎停滯中脘痞滿腹痛嘔吐等症半夏一錢五分茯苓一錢二分蘇葉六分厚朴薑炒九分生薑六分紅棗二枚煎服或加草豆蔻煨研七八分上下清涼散新治發熱舌乾便燥火焰腹痛脈洪數而有力者黃芩二三錢麥冬白芍甘草梔子各一錢五分熱服如口渴喜冷加生石膏二三錢如大便閉結加大黃一二錢不效再加芒硝二三錢所謂通則不痛也如氣逆而痛加木香五分烏藥一錢如小便赤澀加澤瀉一錢如咽乾燥加元參錢半如血熱妄行加生地青蒿知母黃柏之類葵根湯治腸癰腹痛脈大而尺獨數肌膚甲錯不滑澤也葵根一兩銀花三錢甘草節一錢皂角刺二錢陳皮二錢水煎空心服未成者退已成者潰木香順氣散治氣滯腹腸而痛少壯體旺者宜之香附檳榔陳皮枳殼厚朴薑炒各一錢甘草炙五分木香青皮砂仁各七分蒼朮一錢薑三片食遠服凡腹痛必宜溫散此是鬱結不行阻氣不運故痛所以白芍雖治腹痛惟血虛者宜之以酸收耳余宜辛散皆不可用凡腹中水響以水欲下火欲上相觸而然二陳湯加芩連梔子亦有中寒而水鳴者宜分中脘屬太陰當臍屬少陰小腹屬厥陰各從其宜溫之經曰脾胃虛則腸鳴腹滿宜參術之類補之凡腹中畏寒者由陽氣虛亦由命門真火虧也宜桂附溫之凡腹中窄狹須用蒼朮在肥人乃濕痰凝滯氣不升降燥痰用蒼朮行氣用香附在瘦人乃熱氣熏蒸臟腑宜黃連蒼朮凡小腹痛有氣鬱者宜青皮寒者宜桂枝吳茱萸有陰虛者尺脈洪大宜六味湯有陽虛者尺脈沉微宜八味湯凡胸膈痛連及脅背藥到口即吐者宜就其勢探而吐之最易最捷若邪猶未盡痛猶未止再以前藥與之或積或痰吐盡為妙凡蟲痛症治詳見諸蟲門備採古來治腹痛至效至穩簡易諸方於後以便取用心脾諸痛用元胡索五靈脂有溏心者為真草豆蔻仁飯包煨沒藥去油等分為細末每用二三錢熱酒調下最效奇方名遊仙方心脾久痛用蒜以醋煮熟頓服斷根心脾痛用良薑檳榔等分俱炒為末米湯調服上焦痛日久不食不死待痛止二三日後方可漸漸吃物否則復痛痛甚者脈必伏用溫藥附子之類不可用參術脈弦者是食積得溫熱藥加行氣消導之味則化而愈若食得寒藥而愈滯也心脾痛服藥已止而復痛用前藥不效者可用元明粉一服立止凡飲食下行之道由小腹下右角間而後出於廣腸若小腹停食為積切痛堅突有形以火酒磨木香後嚼生蒜此面積進蒜能化凡化各積之藥載於積聚門以香酒送之自瘥十五論霍亂霍亂之病肚腹切痛起於頃刻或頭痛眩暈憎寒壯熱等症其由或外感濕熱寒暑內傷飲食生冷陽不升陰不降邪正相逆揮霍撩亂令人莫當邪在上焦胸痛先吐邪在下焦腹痛先瀉邪在中焦吐瀉交作以脾虛則瀉胃虛則吐治法宜以定吐安胃為失次以隨症止瀉為要此濕霍亂也死者恆少至於不吐不瀉心腹劇痛手足厥冷一刻悶絶此乾霍亂也俗名絞腸痧死者恆多此際治以鹽湯探吐之法方法見後則上吐下瀉庶中通而可救也然陽明一經屬胃與大腸為五臟六腑之海主潤宗筋今既吐既下血氣大損津液頓亡不筋失養必致攣縮甚則陰縮舌卷為難治經曰經筋之病寒則反折筋急熱則筋弛縱不收此轉筋霍亂正反折筋急之病而河間丹溪屬熱之言其可信乎又有謂此症為火者以多見於夏秋之問不知盛暑將殺新涼初起天人易氣寒之由也或嗜生命或貪清涼喜好失宜寒之動也再用寒涼必大誤矣夫邪之易受必脾本虛弱而復吐瀉則脾更虛治宜補脾和胃為主而其為補為和又宜因症以為權宜庶緩急輕重乃無遺憾凡吐利不止或口渴喜冷發熱煩躁欲去衣被此陰盛格陽也不可以其喜冷惡熱為熱症當以理中湯甚者加附子不效改用四逆湯方俱見傷寒厥陰症門並宜冷服當知吐瀉後實熱症甚少凡霍亂初起有寒滯者有火鬱者不得吐瀉發越此時概用生薑誤者不少宜細著神恐痛甚認症不的凡霍亂吐瀉方停此時胃氣未清邪氣未淨凡一切飲食寧使稍遲若急與粥湯則邪復聚為害不小和胃湯新治霍亂初起脹痛嘔吐邪壅於上者宜用此探吐陳皮一錢半夏錢半茯苓二錢甘草一錢蒼朮二錢烏藥香附各八分厚朴薑炒一錢蘇梗七分熱服以指探喉取吐再服再吐鹽湯吐法治霍亂絞痛不嘔不瀉邪結中焦不得發越者危用鹽一撮鍋內炒紅用童便一碗淬入熱服自嘔自瀉若不嘔以指探喉取嘔再服再嘔以邪盡為度中通無慮待胃氣稍定然後方可察其邪正虛突或有無泄瀉脹滯等症因病調理切不可妄用寒涼溫中散滯湯新治陰陽不和吐瀉腹痛須照後加減用陳皮一錢半夏錢半甘草一錢茯苓一錢白芍一錢二分厚朴薑炒一錢二分紫蘇一錢木香五分蒼朮一錢二分砂仁炒研碎六分溫服如冬天寒甚無汗加麻黃七分有汗加桂枝八分如腹中有熱或口渴拒按大便赤熱等症加黃芩二錢或加山梔炒黑一錢如夏月仿暑加扁豆二錢香薷八分木瓜滑石各一錢如泄甚而小便短赤者加白朮錢半川萆薢三四錢澤瀉木通各一錢木香煨用三分如氣滯之甚者加白芥子青皮檳榔之類諸症既平宜調補脾胃或四君子湯六君子湯之類若大吐瀉後氣血兩虛宜八珠湯十全大補湯之類此際克伐藥勿用養榮舒筋湯新治乾霍亂先用鹽湯吐法自清升濁降病已愈矣然後當養血溫經庶免血燥經攣陰縮之患當歸二錢陳皮一錢熟地三錢肉桂一錢五分木瓜二錢白芍酒炒一錢五分厚朴薑炒八分白朮一錢二分甘草炙茯苓各一錢溫服如血虛寒甚加炒乾薑一錢如小腹寒痛加吳茱萸六分如氣滯作痛加木香砂仁烏藥之屬六和湯治暑溫傷脾或食生冷客寒犯胃致霍亂吐瀉半夏甘草炙砂仁各一錢扁豆木瓜各二錢赤茯苓二錢杏仁十二粒藿香八分木香五分厚朴薑水炒一錢若寒滯甚者加吳茱萸炮乾薑肉桂之類竹葉石膏湯治霍亂吐瀉後火盛脈洪者以陰亡用甘涼以濟之也石膏三五錢竹葉二十片麥冬半夏各二錢甘草一錢五分人參少者或以沙參山藥重用代之粳米一撮生薑五分引溫服脈症吉凶霍亂遍身轉筋肢冷腹痛欲絶脈洪者易治舌卷囊縮脈微者死霍亂後陽氣已脫或遺尿不知或氣少不語或膏汗如珠或大燥欲入水或四肢不收或脈見澀數等症皆死至於見結促代伏皆不可以凶斷以吐瀉痛極後所常有也備揀古來治霍亂至簡至穩神方於後以便取用霍亂吐利脈浮自汗宜四君子湯加桂枝太陰症理中加橘紅吐利後轉筋者理中加石膏火煅一兩吐利亡津自必口渴宜溫暖補脾脾旺吐利止而渴亦止不必另治凡初痛用桑葉煎服霍亂未得吐下用蒜搗敷足心又方用鍋底墨研末泡開水服又方用開水冷水各半碗合服又方用門斗眼中灰滾水泡澄清服危急時用鹽斤許炒熱包二包更替尉肚一時即愈絞腸痧用童便服之立止絞腸痧吐瀉將死用藿香梗圓葉香者真陳皮各四錢水煎服絞腸痧用生明礬末一半涼水一半開水調服二錢立愈凡人出門多帶濟人
