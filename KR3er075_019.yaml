body:
  text: 卷十九兒科瘡科兒科小兒生下不啼或因産難或因冒寒急以綿絮裹抱懷中頻以熱水浸胞衣要用油紙作條點燃於臍帶往來燎之熱氣由臍入腹便啼然後洗浴方可斷帶小兒生下先斷臍後洗浴濕從濟入或變濟風且多死不治即啼者亦宜洗後斷臍留四五寸於濟帶近肚處緊緊扎住勿引風進肚為妙斷後用艾葉揉軟如棉綢包護臍永不肚痛小兒生下以益母草煎湯洗之一世無瘡疥又方用桃李梅葉煎湯浴之亦妙無葉時用根浴訖以輕粉少許摩身不畏風又解諸毒小兒洗三周用豬膽汁三個入水七八碗煎至五六碗待水溫和勿下生水洗之時切莫濕臍恐濕邪入肚變生濟風不如洗九周待濟帶落洗之更穩小兒臍濕用發灰綿灰氈帽灰皆可敷之但防外風襲入不可久露小兒夜啼有向光而止者有起坐而止者可知抱兒者平常宜背光或初啼勿輕起坐否則慣而難止治法不一録之以備取用黑牽牛末一錢水調敷臍上五倍子末二錢津涎也調敷臍上又又蟬蛻用後半截三個研末敷乳上令吮之或用鉤藤湯調服或用薄荷湯調服又又又燈花三四顆塗乳頭上令兒吮之即燈草燒灰加辰砂少許亦妙又又木香磨水調乳香浚藥末少許煎數沸服又凡初生小兒不乳而哭速看兒口中上齶牙藏等處必有白泡或黃泡俗名薑牙急用銀挖耳刮破之隨用絮抹乾勿使咽之一刻即愈或於刮破處以好墨塗之或以桑樹白汁塗之更妙凡小兒臍風可以預免於斷臍時勿使入風入水詳上斷臍法內至於有病撮口不乳治法不一録之以便取用白薑蠶二枚炒研蜜調服又鉤藤鉤甘草煎服又將死危症搗蒜安臍以熟艾灸蒜上要至口中有蒜氣方止仍以蒜汁滴鼻中又用全蠍酒炙為末少加麝以金銀煎水調半字服之又艾燒灰厚敷臍上以綢絹裹之又附子肉桂等分為末以生薑自然汁調作餅二分厚安臍上紙蓋之用尉斗以微火久尉母服五苓散加當歸吳茱萸木香乳香沒藥鉤藤各一錢或兒同服更妙若臍旁青腫手拳口噤啼不吮乳者凶或用全蠍一二枚酒灸為末加麝少詳以金銀煎湯調服之小兒臍帶或有所犯而落故根未斂潰腫而成瘡者宜白龍骨黃柏枯礬為末敷之又蝦蟆燒末敷之臍腫荊芥煎湯洗後煨蔥貼之但須常看抱裙勿有尿濕也臍突其狀如吹起者以臍下為氣海兒多哭則氣動於中自臍突於外須設法使之不哭方可養也方用赤小豆淡豆豉天南星白蘞各一錢為末搗芭蕉自然汁調敷臍四傍小便下即愈凡口噤不開用天南星為末加冰片少許以薑汁和之擦開齦立開又豬乳汁與兒吞之善開口噤又不乳或喉中有痰如豆葛藤燒灰和乳汁服不乳屬臍風者必唇青口撮若無此症或不乳或吐乳有屬胎寒腹痛者用木香木瓜乳香沒藥各少詳為細末以當歸蘇葉煎湯調喂如無上症必母之乳汁多而傷也宜少節之自愈急驚者陽症也蓋小兒之真陰未足故肝邪易動木生火火生風風熱相合則血虛而筋急而為眩掉反脹由是木邪侮土則脾病而為痰壅吐瀉木盛金衰則肺病而為喘促短氣木火上炎則心病而為煩熱驚叫木火傷陰則腎病而為血燥乾渴汗閉搐痓等症此非外來之風可以散也惟以清熱豁痰為急但當分微甚而治之清熱平肝湯新治急驚一切實症龍膽草膽南墾用牛膽套九次者佳海石法半夏鉤藤鉤揀盡鉤用此味後入過煎無力各一錢白芥子炒研淮木通各八分水煎就用殭蠶五分全蠍去足微炒五枚片麝各二釐共研末調藥服如火之甚者加黃連黃柏大黃之屬如火之微者加元參知母黃芩梔子之屬痰之甚者倍膽南星加天竺黃牛黃之屬痰之微者加前胡陳皮去白貝母花粉之屬此外加硃砂能入心鎮驚雄黃能破結開滯琥珀青黛亦清利之佐助冰片麝香乃開竅之要藥至於殭蠶佐痰藥善能開痰去肝脾之邪則肝平而風自息也全蠍色青入肝善走厥陰味鹹降痰故能治風較之殭蠶此其次矣蟬脫不過取其輕脫之義不足恃也凡驚風之實邪以痰火為重而風則次之不得徒用剪風之藥也或驚風有兼外感者必脈息浮緊寒熱頭痛無汗等症如防風羌活荊芥乾葛紫蘇獨活細辛之類可以暫用無外邪者皆所切忌又不可過用片麝恐陽虧陰盛而成慢驚彼防風辛熱誤用殺人更宜慎用如月內驚風用丹砂末塗五心以色赤人心安神除熱也若客忤卒死用蜜調服如驚忤無聲血入心竅豬心血調服如發搐之甚同南星全蠍調服備揀古來治急驚諸方以便取用導赤散治心火上炎舌黃尿赤口渴身熱急驚實症生地木通甘草麥冬各二錢淡竹葉十皮水煎熱服瀉青丸治小兒肝膽火急驚發搐眼赤上視等症羌活防風當歸川芎山梔仁膽草大黃酒浸紙包煨透等分共研細末蜜丸每用竹葉煎湯少加沙糖化下急驚風者肝風甚而心火從之為實邪也實則瀉之宜用瀉青丸以瀉肝之風導赤散以瀉心之火如大便祕用蜜導法蜂蜜三兩入鐵器內以火熬干捻成挺子寸半長從穀道插入若用下藥恐脾胃受傷吐痰方治兒壯實痰在喉間壅塞藥食不得入者則宜吐殭蠶牙皂炙焦等分研末以土牛膝根少加水搗汁調少許灌之即吐吐後服下痰藥辰砂膏治小兒痰壅氣滯服之痰自化下辰砂飛過三錢硼砂馬牙硝各錢半元明粉二錢全蠍去毒珍珠各一錢麝一分共研末每用一二分治諸驚薄荷湯下治胎驚乳汁合棗湯下或用礞石滾痰丸亦妙至聖保命丹治一切小兒急驚胎驚勢迫時用之風平須照證調治此應忙之劫方也不得過服膽星牛膽九套者佳殭蠶糯米泔浸焙乾去嘴甲白附子各一錢全蠍去足焙十四枚天麻防風各一錢辰砂水飛錢半珍珠五分另細研麝一分琥珀三分金箔二十片共研末粟米煮糊為丸分為二十五粒金箔為衣每一粒用薄荷煎湯磨服或只用白附子薑蠶全蠍等分為末酒調一錢服甚效又方白牽牛半生半炒黑牽牛半生半炒大黃煨熟檳榔各一錢共研末用五分蜜湯調下痰甚加輕粉一分得微利一二次痰熱自退不必過下痰熱退則驚風自除切不可用辛燥驅風等藥反動心火而為害也當其搐搦大作時但可扶持不可把捉恐風痰流入經絡或至手足拘攣也又不可輒用艾火燈火此陽證不宜火攻又不可峻用攻擊如巴豆之類以取速效只服清涼之劑自可平安諺云急驚風慢慢治此邇言之切當者也慢驚者虛症也有因吐瀉後脾胃虛弱而致者有因急驚過服寒涼及傷寒過下而致者有因脾胃素弱或受風寒而致者其症昏睡露睛痰鳴氣促驚跳搐搦或乍發乍靜或身熱身冷或肢厥唇青面白口鼻氣冷昏迷不食自汗泄瀉其脈遲緩細數等症為脾虛生風無陽症也此際宜速培元氣大補脾土即有風痰之類皆非實邪不得妄用剪風化痰之藥再為消散以傷陽氣乃為善治六君子湯治脾胃虛寒以致痰凝氣滯自汗泄瀉慢驚等症人參少者以山藥四錢炒黃代之白朮三錢茯苓錢半炙草一錢陳皮去白一錢半夏錢半薑棗水煎頻服如中寒泄瀉身冷痰滯加附子二錢附子溫中回陽為慢驚之聖藥也如元氣將脫急炮用之若肝邪旺侮脾土者加肉桂一二錢平肝以息風也瀉甚者加肉豆蔻一二錢麵包煨去油用或補骨脂亦可滑脫不禁者加烏梅二個或北五味子二十粒如氣虛下陷昏倦無神加黃耆蜜炙三錢即身熱亦服所謂甘溫能退大熱也若膈熱拒之冰冷與服或血虛不能養肝加當歸白芍以血足風自滅也理陰煎治脾腎陰陽俱虛慢脾等症熟地五七錢當歸二三錢乾薑炒二錢甘草炙錢半水煎服如腎虧水泛為痰或嘔或脹者加茯苓錢半或加白芥子五分如陰寒厥逆加附子二錢或泄瀉不止去當歸加山藥扁豆補骨脂肉豆蔻附子之屬如腹脹滯疼痛加木香陳皮砂仁之屬或肝邪旺木動風搖加肉桂二錢如兼外感頭痛寒熱咳嗽脈浮緊者加麻黃五七分加味異功散治脾胃虛弱肝木所勝外虛熱而內真寒慢驚風證人參白朮二錢茯苓錢半甘草炙一錢當歸二錢陳皮去白一錢鉤藤鉤錢半此味後入過煎無力如不應加半夏錢半炮薑一錢白蔻八分木香四分或再加附子錢半要知木虛則搐而無力火虛則身寒口中氣冶土虛則吐瀉睡而露睛此際宜補脾胃為急祕旨安神丸治小兒乍受驚嚇神氣失散以致潰亂不堪睡中驚悸宜以收復神氣為主若作驚風治誤矣人參棗仁茯神半夏各一錢當歸白芍酒炒橘紅各七分五味子五粒甘草炙三分共研末薑汁糊丸每用生薑湯磨服二丸如硃砂琥珀之類不過取其鎮重之意惟此方乃為救本之法此證必驚哭多淚忽啼忽止者是也若啼叫無淚聲長不揚者是腹痛當細辨之搐抽搐也是即驚風之屬但暴而甚者謂之驚風微而緩者謂之發搐發搐不治則漸成驚矣宜察形證之寒熱臟腑之虛實治之其治法詳具急驚慢驚二證可參閲用之有所謂慢脾風者即慢驚失治而甚者耳其實難大分別亦不必別立治法急驚屬實熱宜用清涼慢驚屬虛寒宜用溫補二病不同治法亦異而諸書多用一藥以治二病何其謬也錢氏戒之而諸家著書立方又明犯之其被夭枉者多矣小兒之虛症觀外可知如心虛則驚惕不安若啼聲不出者心絶也肺虛則氣促多汗若喘滿痰響者肺絶也脾虛則吐瀉不食痞滿倦臥牙緊流涎手足牽動若昏迷不乳者脾絶也肝虛則筋急斜視抽搐徑強若目不開者肝絶也腎虛為肢厥津枯火不歸元若二便不禁者腎絶也凡言實者乃邪氣之實非元氣之實也治者亦不可傷元氣若病久已虛尤當專顧脾腎則根本固而無虞矣小兒熱證不一有表裡虛實之異而人動謂小兒純陽概用寒涼其説亦誤蓋男子二八女子二七而天癸至天癸者陰氣也陰氣未至故曰純陽原非謂陽氣之有餘也牡稚陽耳稚陽之陽其陽幾何陽本非實而誤用寒涼則陰既不足又伐其陽多致陰陽兩敗脾腎俱傷又將何所依賴而望其生長耶故貴審稟賦陰陽偏盛及外感風寒內傷飲食等症因人調治斯無弊矣敗毒散治四時感冒風寒身熱無汗喜人懷抱口不渴便自調者此熱在表也人參茯苓枳殼甘草川芎羌活獨活前胡柴胡桔梗生薑各五分水煎熱服溫取微汗而熱自退黃芩湯治臟腑積熱喜露頭面揭去衣被口熱舌黃小便赤大便祕日晡更熱此裡熱也黃芩梔仁麥冬生地澤瀉木通甘草等分或加黃連入生薑三分水煎溫服竹葉湯治病後溫熱或兼潮熱或渴不多飲大小便如常此虛熱也竹葉十皮石膏燒研二錢半夏人參麥冬炙草各一錢粳米即硬米也下一撮先煎藥後入米再煎服或體弱泄瀉不食昏倦其熱不止須用下方甘溫以補脾胃而熱自除寒涼藥最為忌用加味四君子湯人參白朮二錢茯苓錢半炙草一錢乾薑炮白芍酒炒各錢半當歸二錢泄者不用薑棗水煎如氣倦加蜜耆錢半如氣脹加木香三分如中寒腹痛滑瀉加吳茱萸肉豆蔻白豆蔻補骨脂之屬如胃寒嘔逆加半夏生薑或加附子如虛熱甚生風者加肉桂鉤藤鉤揀盡鉤錢半宜後入過煎無力或少人參用山藥四錢炒黃代之清涼湯治小兒面赤舌燥鼻乾飲冷大小便祕一切熱症黃芩二錢黃連一錢滑石二錢薄荷葉八分大黃酒浸煨熟錢半薑引熱服如口渴加花粉乾葛如大便祕結用豬膽汁少加皂角末從穀道灌入不得用芒硝枳實以傷脾胃也小兒疳病因病後脾胃虧損或用藥過傷不能傳化乳食內亡津液虛火妄動或乳母六淫七情飲食起居失宜致兒為患其證目腫腹脹瀉痢清白肢體瘦弱鼻爛身瘡虛熱往來又有走馬疳者牙齒蝕爛口臭齒黑甚則齦敗牙宣前人治法多用清涼不知此症真熱者固多而元氣既敗假熱者尤多也當陰虛脾虧之際非溫補不可宜臨證酌宜仍以虛損治勞之法參用庶得盡善蘆薈丸治小兒肝脾疳積發熱口渴體瘦大便不調或瘰癧耳瘡腮爛目翳等症胡黃連黃連蘆薈白蕪荑白雷丸破開赤者不用木香膽草鶴蝨草微炒各一兩上為末蒸餅糊丸每白湯下一錢或腹脹加枳實青皮山楂肉麥芽如有蟲加使君子肉如血虛加當歸如脾虧有痰加茯苓此方再加干蝦蟆一二隻酒浸一宿去腸炙用更效服此丸者但須間服異功散以扶脾胃為妙如有蟲用黃連一兩豬肚三兩蒸熟搗為丸服食土用黃連豬肚煮汁拌土曬乾食之如骨蒸瀉痢用胡黃連潮熱同柴胡煎服肚脹同五靈脂丸服壯熱同黃連硃砂細研水飛以豬膽汁拌濕蒸熱入蘆薈麝香丸服如吃泥肚大沙糖輕粉丸服凡肚大有積將成疳者用參苓白朮散一料加谷蟲五錢為末米湯調服即愈最穩最效蘭香散治小兒鼻疳赤爛蘭香葉燒灰一錢銅青輕粉各三分上為末乾摻白粉散治小兒諸般疳瘡海螵蛸三分白芨輕粉各一分上為末先用溫水洗拭干敷雄黃散治牙齦生疳蝕爛雄黃一錢銅緑二錢研末乾摻之蟾蜍丸治牙齦生疳臭爛並治小兒頸項結核面色痿黃飲食不甘腹大發熱名曰無辜疳症一服虛熱退二服煩渴止三服瀉痢愈真妙方也用蟾蜍一二個夏月溝渠中取腹大不跳不鳴者是身多儡者佳跌死投於桶中浸之以尿下糞蛆二杓食之二晝夜用布袋盛蛆置流水中一宿取出瓦上焙於為末入麝香二釐米飯搗糊為丸麻子大每服二三十丸米湯下其效如神馬鳴散治走馬疳牙床潰爛甚而齒脫凶症人中白即尿缸底白垢也以物刮取新瓦盛之火煅如白鹽乃佳五錢五倍子生者一錢另用一錢同白礬煅之馬鳴退即蠶蛻紙也火燒過二錢半枯白礬二錢即用五倍子同煅者在內上為極細末先以濃米泔浸洗後以此敷之真良方也其吐瀉腹痛咳嗽等症大小可以同治參閲本門用之不必復贅備採古來治小兒雜症簡易單方於後以便取用小兒口瘡細辛研末醋調敷臍上初生時以甘草煎汁滴口中日後無毒且稀麻痘發黃用花粉搗汁蜜引溫服骨蒸減食因睡濕床傷也用秦艽甘草炙等分煎服蛔多腹痛使君子肉為末每月初旬五更時米湯調服一錢丹瘤木鱉子仁研末醋調敷之遺尿補骨脂鹽炒研末每夜開水調服四分狂燥身熱昏迷梔仁豆豉各四錢煎服或吐或下立效行遲五加皮五錢川牛膝木瓜各二錢五分為末每服五分酒引頭面癢瘡常流血水蛇床子一錢輕粉三分為末麻油調搽寸白蟲雷丸肉白者可水浸去皮每月初旬五更時食炙肉少許以稀粥調服一錢疳積腹大黃瘦用立秋後大蝦蟆若身有儡腹大不跳不鳴者佳去首足腸肚以麻油塗之陰陽瓦焙熟食之蟲積自下連服五六枚一月全愈初生數日大小便血乃心肺胎熱不可服涼藥只用生地加水搗汁五六匙加酒蜜各一匙服之自愈不下尿不吃乳大蔥白切碎以乳半盞蒸片時服癇症用雞子黃和乳汁服三枚愈癲癇蘆薈煎服風癇善驚用天麻煎服或用青黛水調服胃寒吐乳白豆蔻仁砂仁甘草煎服月內目不開或腫澀或出血名慢肝風用甘草豬膽汁炙研末水調服陰縮吳茱萸大蒜硫黃搗塗腹仍用蛇床子燒煙燻之病後天柱骨倒萆麻子木鱉子仁搗貼足心口瘡陀僧研末醋調塗足心瘡愈即去之疳瀉赤石脂末米湯調服五錢立瘥睡中自汗故蒲扇燒灰為末酒下二錢諸風口噤不語南星略炮五分紫蘇生薑引煎就入雄豬膽汁少許服撮口甘草水煎服令出痰涎以豬乳滴入口中自瘥凡兒生初睡時最難安置欲安枕上枕高不便安於枕下恐寒時被厚掩傷世亦有掩死者只得安於手肘上不知鼻風多射兒頭異日或有頭風腦痛之患亦有枕偏兒頸者況母手常在被外多受風寒日後多有手臂痛者其法將母平日之枕一概不用母用衣服制一枕約四五寸長周圍以線扎之恰便母睡其兒用緑豆一二碗略搗碎裝入布袋內睡時仰松打平止要寸詳高兒吃乳後推於豆枕上與母一樣齊睡母子俱安豈不妙哉緑豆能明目去風稀痘並解一切瘡癤凡浴時探水冷熱得所庶無水驚冬久浴則傷風夏久浴則傷熱其浴時當護兒背以風寒自此而入易成病患且忌數數洗浴凡小兒平常無病忌服藥餌否則遇病無效凡抱持忌生客恐客忤發熱等症忌入廟恐心驚怖起風凡浣衣不可露於星月之下易惹邪祟即至十歲亦忌凡在春天勿護頂裹足使陽氣舒長即稍長下體勿令過暖得寒涼則陰易長過溫暖則陰暗消下體主陰以童子陰常不足也凡初生十日內宜煎淡豆豉汁喂之下胎毒助脾氣化乳食以豬乳哺兒解痘毒除驚癇且無撮口濟風之患凡養兒要出見風日耍著地氣若常懷抱則筋骨緩弱數歲難行凡兒勿摸刀劍勿見猿猴勿令久坐勿令久行勿過飲食勿衣重裘勿哺美味肉食酸冷薑蒜夜莫停燈日莫説鬼睡莫當風坐莫近水近火勿使過笑勿使過哭笑哭之後莫即與乳乳後勿即與食食後勿即與乳食乳交進便成積聚雷鳴擊鼓不必掩耳乳兒不得過飽飽則溢溢則導虛胃氣凡宿乳須令捏去當沃壁上勿令蟲蟻食之乳兒之時先以手指按任勿使乳來太急急則難咽噎成哮病兒肚宜暖以熟艾鋪一抱肚冷天圍之熱天用夾布圍之日夜勿解以寒脾胃以上護法須當留神凡兒剃頭宜避風處凡小兒諸病肝脾二經居多肝只有余有餘者病氣也似重而易治脾只不足不足者元氣也似輕而難治故薛氏以補脾立論誠格言也凡小兒虛實寒熱似乎難辨觀外症可知如足脛冷腹虛脹糞色青吐乳食眼珠青面青白脈沉微者此內必虛寒忌投涼藥若足脛熱兩腮紅大便閉小便赤舌粗黃眼珠赤渴不止上氣急脈洪滑者此內必實熱忌投熱藥瘡科瘡瘍一症有出於腑而為癰此為陽症屬內病之稍次者治之猶易有出於臟而為疽此為陰症屬內病之最重者治之為難外有在皮膚者有在筋骨者其深澆有辨蓋寒滯之毒其來徐其入深多犯在筋骨之間風熱之毒其來暴其入澆多犯在皮肉之間能知陰陽淺深則治療不瘥然其最重者以元氣為主元氣強則正勝邪自易發而易收若元氣弱則邪勝正必難發而難收又有元氣本虧而邪盛不能容補者此為敗症其有邪盛而脈症俱實者但當直攻其毒則不得誤補助邪所宜詳辨也凡脈浮數而反惡寒者瘡疽之症也如腫起堅硬膿稠痛甚二便祕赤腹脹胸痞口苦咽乾煩躁身熱目赤脈洪心神慌惚者實也此其毒在臟腑非用硝黃峻猛之劑蕩而逐之則毒不解故不得不下然非有真實者不可輕用下也如腫下軟慢膿稀身冶瀉利嘔吐食少自汗肢腫音嘶或腫而不潰或潰而不斂脈微昏沉者虛也此宜全用溫補固無疑也然不獨此也即凡脈無洪數又無煩熱壅滯而毒有可慮者此雖非大虛之症然察其但無實邪便當托裡養榮預顧元氣何也蓋恐困久膜潰不待損而自虛矣及其危敗臨期即多方挽回安有益哉故丹溪云癰疽因積毒在臟腑宜先助胃壯氣以固其本夫然則易於成功而平復不難矣若獨攻其瘡則脾胃一虛七惡蜂起安有能生者乎齊氏曰邪氣勝則實真氣奪則虛又曰諸痛為實諸癢為虛又曰診其脈洪大而數者實也細微而軟者虛也虛者補之和其氣以托裡也實則瀉之疏利而導其滯也凡瘡瘍有毒之甚者如背疽腦疽脫疽疔瘡天蛇頭在手指尖地蛇頭在腳指尖一切無名腫毒或腫處無頭用濕紅貼於患處但一點先干處乃是瘡頭或周圍高而中一點青黑而陷者或數腫處不知痛癢或發如粟米之類此皆大毒非藥所能有功惟用大顆獨蒜切片三分厚貼瘡頂以艾於手掌中久揉自軟如綿以豆大一壯安於蒜片灸之每三壯易蒜萬一灸得痛不可忍將蒜略揭起易艾再灸或數十壯或來日又灸總以多灸為妙約一二百壯則毒自散未成者即消已潰者即效誠治癰疽惡毒之仙方也蓋用大蒜取其辛而能散用艾灸取其火力能透深遠所以勝於藥力百倍者矣若略灸幾壯而即止反為有傷經曰陷者灸之灸而不痛痛而後止其灸灸而不痛者先及其潰所以不痛而後及良肉所以痛也灸而痛不痛而後止其灸灸而痛者先及其未潰所以痛而次及將潰所以不痛也人之頭為諸陽所聚艾壯宜小而少又有用附子炮去皮臍研末以唾津和為餅安瘡口上將艾壯於餅上灸之每日灸十壯但令熱勿令過痛治潰瘍氣血俱虛或風寒襲之不能收斂用之神效景嶽曰凡癰疽陰盛陽衰體弱脈虛苦寒之劑非惟潰後不可用即腫瘍亦不可用也若陰邪凝結之毒非用溫熱何以運行陳氏謂腫瘍不可用熱藥恐不可以概言也又曰瘡腫之屬外邪者惟時毒丹毒斑疹及頭面頸項上焦之症多有之察其果有外邪而脈見緊數症有寒熱者方宜表散然散之之法又必辨其陰陽盛衰故或宜溫散涼散平散兼補散解毒而散此中自有權宜也又如里症用下之法毒盛勢劇者大下之滯毒稍輕者微下之榮虛便結而毒不解者養血滋陰而下之中氣不足而便結壅滯者潤導而出之凡此皆通下之法但宜酌緩急輕重而用之若不得法後來將有難結之患不但目前之害已也是以表症不真者不可汗汗之則亡陽里症不實者不可下下之則亡陰亡陰亦死亡陽亦死醫固可孟浪乎凡腫軟而不痛者血瘤也腫而漸長不大熱而時時牽痛者氣瘤也微腫不消後亦成膿此是寒熱所為也留積日久寒化為熱以此潰者必成漏也凡察癰疽以手掩其上大熱而軟者膿成也宜急針破之若皮薄者膿澆也不甚熱者膿未成也結核不消寒熱發渴面色黃者已成膿也至於臟腑內疽深藏不見惟診脈可知胃脈人迎也沉數熱聚胃口胃脘癰也若洪數者膿已成也脈沉緊雖膿未就已有瘀血也宜急治之不爾則邪內攻而危矣瘡毒已結者宜補氣血使膿速成膿成當驗其生熟針而去之不可用內消之法以寒涼而成壞症小按便痛者膿澆也大按方痛者膿深也按之不易起者膿未成也按之而即起者膿已成也膿生而用針氣血既泄膿反不成膿熱而不針則腐潰益深瘡口難斂若瘡深而針淺內膿不出外血反泄若瘡淺而針深內膿雖出良肉受傷若元氣虛弱必先補而後針若膿出而反痛或煩躁嘔逆由胃氣虧損也宜急補之仙方活命飲治瘡腫色赤壯熱焮痛此陽毒也服此未成膿者即消已成膿者即潰此止痛消毒之聖藥也穿山甲蛤粉炒黃白芷防風花粉赤芍歸尾乳香沒藥貝母皂刺甘草各錢半金銀花三錢陳皮二錢酒煎服服數劑未成者自消若已成而膿潰者必體虛難得收效當速服下方托裡消毒散治瘡潰體弱易於收斂此標本同治也人參隨症增減黃耆鹽水炒當歸川芎白芍炒白朮茯苓各一錢金銀花白芷甘草連翹各六分水煎服若潰後而新肉不生屬氣虛者四君子湯為主屬血虛者四物湯為主氣血俱虛者十全大補湯為主並忌寒涼消毒之劑益氣養榮湯治氣血虧損身發腫毒不論軟硬赤白或不時發熱或潰而不斂內服數劑外用隔蒜艾灸二三十壯潰者貼神異膏人參黃耆鹽水炒當歸川芎熟地白芍炒貝母香附茯苓陳皮各一錢白朮二錢柴胡六分甘草桔梗各五分薑水煎服如口乾加五味子麥冬往來寒熱柴胡用一錢加地骨皮膿清倍用人參黃耆膿多不止倍用黃耆當歸肌肉遲生加白蘞肉桂祕方托裡散治一切瘡毒始終常服不致內陷栝蔞大者一個搗當歸黃耆白芍甘草各兩半熟地花粉金銀花皂刺炒各一兩上每味用一半以酒五茶盅入瓷器內以紙密封置鍋內久煮取出待冷陸續溫服立齋曰此方藥品平易消毒之功甚大且不動臟腑不傷血氣不問陰陽腫潰屢用屢效真仙方也凡有腫毒先用隔蒜艾灸若脈沉實大小便祕者失用疏通而後用此其功甚捷若大毒已退不作膿或不潰者更宜此方托裡潰而不斂及膿清者方用峻補托裡養榮湯治瘰癧流注及一切癰疽不足之症不作膿或不潰或潰後發熱或口渴或惡寒飢瘦盜汗倦臥不思飲食等症人參黃耆蜜炙當歸白芍酒炒川芎各一錢白朮錢半熟地二錢五味炒研麥冬甘草各五分薑五分棗二枚水煎服參耆托裡散治瘡毒平塌色暗神倦其痛不甚或不知痛癢此陰毒也能急補托可免其毒內攻而危或腐潰不能收斂惡寒發熱一切不足之症人參黃耆蜜炒白朮當歸熟地白芍酒炒茯苓陳皮各錢半金銀花三錢水煎多服如不效加乾薑炒一錢肉桂錢半若膿出而反痛者氣血虛也八珍湯如不作膿不腐潰者陽氣虛也四君加歸耆肉桂如不生肌不收斂脾氣虛也四君加地黃木香如惡寒憎寒陽氣虛也十全大補加薑附如晡熱內熱陰血虛也四物加參朮如欲嘔作嘔胃氣虛也六君加炮薑如自汗盜汗五臟虛也六味丸料加五味子如食少體倦脾氣虛也補中益氣加茯苓半夏如喘促咳嗽脾肺虛也前湯加麥冬五味如欲嘔少食脾胃虛也人參理中湯如腹痛泄瀉脾胃虛寒也附子理中湯如小腹痞足膝冷脾腎虛也十全大補湯加棗皮山藥肉桂如泄瀉足冷脾腎虛寒也前藥加桂附如熱渴淋祕腎虛陰火也加減八味丸即六味丸加肉桂五味觀此即知百病用藥之法濟陰湯治瘡毒初起腫毒熱渴脈滑數有力症屬純陽者連翹二錢山梔炒黃芩炒黃連炒甘草各一錢白芍錢半丹皮二錢金銀花三錢水煎服如大便祕加大黃抑陽散外治前症屬純陽者花粉三兩薑黃白芷赤芍各一兩共為末茶調厚敷患處內外調治則熱毒自解瘀滯自散沖和湯治瘡毒似腫非腫似痛非痛似潰非潰脈洪數而無力屬半陰陽者此因元氣虛弱失於補托所致人參少者用蜜炙黃耆三錢代之陳皮生黃耆白朮當歸白芷各錢半茯苓川芎皂角刺乳香沒藥金銀花甘草節各一錢半水半酒煎服陰陽散外治前症屬半陰半陽者紫荊皮炒五兩獨活炒一兩赤芍炒白芷石菖蒲各二兩共為末蔥汁好酒調敷內外夾治則氣血自和瘀滯自消回陽湯治瘡毒微腫微痛或色暗不痛或堅硬不潰脈雖洪大按之微細軟弱屬純陰者此屬脾腎虛寒或因藥虧損元氣所致人參白朮黃耆各三錢乾薑炮附子制甘草炙陳皮當歸各二錢柴胡升麻各五分半酒半水煎服如不應倍加薑附抑陰散外治前症屬純陰者草烏二兩南星煨赤芍炒白芷各一兩肉桂五錢共為末蔥湯調敷熱酒亦可內外共扶則脾胃自健陽氣自回也丹溪曰敷貼之劑應酬輕小熱症耳若不辨其陰症陽症而妄敷寒涼之藥則迷塞腠理凝滯氣血毒反內攻而肉反死矣況元氣得寒則不健瘀血得寒則不散敗肉得寒則不潰新肉得寒則不生治者審焉凡瘡疽之痛不一止之亦異有因熱邪痛者以涼藥止之有因寒邪痛者以熱劑止之因風者除其風因濕者導其濕燥者潤之塞者通之虛者補之實者瀉之之類臨機應變方為上醫有謂乳沒可以止痛究何益哉降癰散治陽毒癰疽焮腫切痛之甚者煎劑功緩用此外敷散毒止痛立效薄荷葉野菊花連根葉各一握土貝母半之茅根一握乾者為末鮮者同貝母搗爛外將茅根煎濃湯乘熱調敷患處仍留前湯頓熱不時潤於藥上但不用冷約半日即換之又方治疽毒堅頑深固及結核痰滯等症腦荷倍用生南星土貝母朴硝等分石灰風化者倍用共為末用鹽水調敷患處膿成留頭經宿干即易之或炒熱攤絹上隔絹貼之或用麻油調或用茅根湯調亦可若欲止痛速效加麝香或冰片少許更妙槐花酒治腫毒屬濕熱者退之神速惟胃寒之人不可過用槐花四五兩炒微黃乘熱入酒二三盅煎十餘滾去渣熱服未成者二三服已成者一二服即消大抵腫毒先用蒜灸次服槐花酒以去其毒勝於托裡諸藥多多矣忍冬酒治一切癰疽腫毒發背疔瘡喉痹等症忍冬藤一名金銀藤鮮者四五兩乾者止用二兩搗碎甘草節一兩水煎就入酒一盅再煎數沸每日二服外用藤搗爛入酒少許敷患處或用花用葉生者搗汁半盅和熱酒半盅溫服更佳甚者三五服即愈凡癰疽之毒有淺深故斂之有遲速不可早用龍骨血竭收口之藥恐毒氣未盡後必復發為患非輕若久不合口其肉白而膿少者此氣血俱虛不能潮運而瘡口冷澀也每日用艾葉煎湯避風熱洗及燒松香煙燻之或用豬蹄湯洗之更以神異膏貼之必須守禁忌服補藥乃愈神異膏治一切痛疽瘡毒及收口甚效此瘡瘍中第一方也麻油一斤黃丹三兩黃耆杏仁元參各五錢蛇脫三錢男發用半雞子大一團蜂房子多者佳五錢先以黃耆杏仁元參入油煎至將黑乃入蛇脫蜂房亂髮煎至焦黑去渣徐下黃丹慢火再煎滴水成珠為度凡氣血聞香則行聞臭則逆況瘡本腥臭又聞臭觸則愈甚宜間用香散之藥為妙萬金散治瘡疽已潰未潰者有消毒破瘀之功栝蔞一個打碎甘草節二錢沒藥一錢另研用酒煎前二味後入沒藥服丹溪曰腫瘍內外皆壅宜以托裡表散為主如欲用大黃寧無孟浪之非潰瘍內外皆虛宜以補接為主如欲用香散未免虛虛之失凡癰疽膿潰之後脈微澀遲緩者邪氣去而真氣將復也為易愈若沉細而直者裡虛而欲變症也若膿血既去則當脈靜身涼腫消痛息如傷寒表症之得汗也若反發熱作渴脈洪數者此真氣虛而邪氣實也死無疑矣立齋曰瘡瘍食肉乃自棄也瘡瘍之毒發於榮氣今反助之與自棄何異雖用藥施治亦不能愈景嶽曰惟熱症及疔毒陽癰則不可犯至若榮衛大虛而毒不能化肉不能長凡宜滋宜補等症可少食之若牛肉雞鵝醇酒及傷脾助濕等物所宜忌也太乙膏一切瘡瘍並宜貼之先用隔蒜艾灸更服活命飲方載前以收全功當歸生地白芍元參大黃各二兩甘草四兩用麻油二斤入砂鍋煎藥至枯黑去渣加黃丹三兩再煎至滴水成珠為度忌鐵神效當歸膏治一切瘡瘍潰爛及湯火疼痛等症當歸生地各二兩白蠟一兩麻油六兩先將當歸地黃各一兩入油煎黑去渣又將二味入油煎黑去渣乃入蠟溶化候冷攪勻即成膏矣用塗患處以紙蓋之如有死肉須用利刀修去去腐生新其效如神凡洗拭換膏須預備即貼之以新肉畏風故也此藥生肌止痛補血續筋故與新肉相宜煎膏忌鐵宜用砂鍋之類烏金膏治一切癰疽潰爛中央肉死塗之即腐未死塗之即生若初起腫痛用點數處則解毒腫消若瘀肉腐黑塗之即潰若毒氣散漫中黯外赤不腐不潰內服大補之劑中塗三四寸詳至五六日間中央漸潰漸脫內用純陽之藥以接元氣自能收斂若塗涼藥則毒氣不解無益而有害也巴豆不拘多少去殼炒黑研為膏點腫處或塗瘀肉上則自消化或加乳香少許更妙惡瘡頑瘡中有毒根久不收斂以少許紝其內即化而愈或加香油少許調稀可用此方簡而效為功不小加味羌活湯治瘡瘍腫痛寒熱頭痛身痛脊強脈浮緊者初宜疏通表散羌活防風蒼朮各一錢白芷川芎生地黃芩甘草各錢半北細辛三分連翹錢二金銀花二錢薑棗引熱服取汗如有汗去蒼朮加白朮渴者加葛根石膏栝蔞托裡散治瘡瘍毒盛者未成者消已成者潰即潰者斂栝蔞一個杵碎忍冬藤乳香各一兩蘇木五錢沒藥三錢甘草二錢酒煎日三服蠟礬丸治一切癰疽托裡止痛護臟腑勿使毒氣內攻老少皆宜黃蠟一兩溶開離火入生白礬末一兩為丸用熟水日進三服各四五十丸至三四兩之上其效自見或止用白礬末為丸以蔥湯送三錢三五服後再服仙方活命飲二劑諸惡毒自愈若服金石毒藥發疽者尤效奪命丹治疔瘡發背等大毒或麻木昏憒或嘔吐寒熱等症服此者不起者起不痛者痛痛者止昏者蘇未成者消已成者潰乃惡症中之至寶也蟾酥酒化輕粉麝香各五分枯礬寒水石銅緑乳香沒藥各一錢硃砂三錢蝸牛無亦可上為細末酒糊丸緑豆大每服二三丸溫酒蔥湯下或用蔥白三四寸病者自嚼爛吐於手心包藥在內熱酒送下如人行五里汗出為效重者再服一二丸或外用一丸入瘡孔內以膏藥貼之宣毒散治癰毒在臟脈實便祕若脈虛便調者不可用大黃煨白芷各五錢水煎服此乃宣通攻毒之劑其功最大雄黃解毒湯治一切瘡毒潰爛先用此洗三次以後用豬蹄湯雄黃一兩白礬三兩寒水石煅兩半共為末用滾水二碗乘熱入藥末一兩洗患處冷則溫熱再洗以神異膏貼之洗時避風豬蹄湯亦治前症白芷白礬當歸赤芍獨活甘草露蜂房連子者佳各五錢用豬蹄一隻水四碗煮之去油渣取清湯入前藥一分作四分分開煎十數沸去渣溫洗惡肉隨洗而下即用前膏貼之集香散亦治前症白芷藿香茅香香附防風甘草各三錢木香一錢用水三碗煎就去渣洗患處凡血氣聞香則行聞臭則逆彼瘡將盡未盡宜用之洗後速用膏藥貼之直至收斂為度忌用生肌之藥乳香定痛散治瘡瘍潰爛切痛諸藥不效者乳香沒藥各二錢寒水石煅滑石各四錢冰片一分為細末敷患處痛即止此方乳沒性溫佐以寒劑制之故寒熱之痛皆宜替針丸治膿成不潰者白丁香即麻雀屎硇砂沒藥乳香各一錢糯米四十粒先以礦灰拳大一塊置碗內量入水熱氣出以米排入灰中良久候米如水晶狀取出用之如未就再用灰制各研末後和勻收貯用時以飯丸麥粒大用一粒水濕安瘡頭上其膿自出若附骨疽及緊耍之地當時針砭出之為善下有單方生肌散治瘡口不合木香輕粉各二錢黃丹四錢枯礬三錢共為細末用豬膽汁拌勻曬乾再研細摻患處立齋曰此方乃解毒去腐搜膿之劑非竟是生肌藥也蓋毒盡則肉自生嘗見患者每用龍骨血竭之類以求生肌殊不知餘毒未盡反生腐爛耳若此方誠有見也又方治膿止若生肌時用鯽魚去腸實以羯羊糞烘焙為末摻之瘡口自斂桔梗杏仁煎治肺癰吐膿腥臭或痰中帶血或胸膈隱痛等證桔梗杏仁甘草各一錢阿膠金銀花麥冬百合夏枯草連翹各二錢貝母三錢枳殼錢半紅藤三錢水煎服如火盛兼渴者加花粉二錢此症因汗後傷風入於肺變成瘡疽其脈右寸數而虛者肺痿也數而實者肺癰也微緊而數者未有膿也緊甚而數者已有膿也脈短而澀者易治浮洪而大者難治面色當白而反赤者火剋金皆不可治小青龍湯治肺輕受寒咳嗽喘急將成肺癰先服二劑麻黃去節五分桂枝白芍甘草各八分乾薑炮五分半夏一錢五味十一粒水煎熱服葶藶大棗瀉肺湯治咳嗽胸脹氣喘面浮已成肺癰繼用此方甜葶藶炒研三錢大棗十枚去核水煎先入大棗煎就去棗後入葶藶煎十餘沸食後服八味排膿湯治腸癰小腹脹痛時下膿血脈滑而數身膚甲錯等證黃耆炒當歸酒拌金銀花穿山甲蛤粉炒白芷防風連翹栝蔞各二錢水煎服或為末每服三錢蜜湯調下如膿將盡去穿山甲連翹倍當歸加川芎神效栝蔞散治乳癰及一切大毒初起腫痛即消膿成即潰膿出即愈治癰之方甚多獨此方神效治瘰癧尤效凡屬癰毒皆宜用之栝蔞一個爛研當歸酒洗甘草各五錢乳香沒藥各一錢酒煎服如不能飲酒加水煎數劑後宜服補氣血之藥槐花散治腸風臟毒下血槐花炒熟地青皮白朮荊芥穗當歸身升麻各一錢川芎四分水煎服或為末每用三錢米湯調下又方棕同柏葉燒灰存性搗飯糊為丸服痔漏腸紅方其效無比黃連一兩酒浸陰乾百草霜一兩用茅柴燒者佳烏梅肉一兩酒蒸共搗為丸如干加前浸連之酒每以酒下四五十丸三日見效十日全愈隔紙膏治臁瘡神效黃耆研末五錢輕粉乳香沒藥銀硃各一錢血竭五分銅緑二分共為細末真麻油調成膏攤油紙上再用油紙一層以針密刺孔掩膏藥上貼之一日一易其膏豬臟丸治大便痔漏下血豬大臟一條洗淨槐花炒為末二兩或用黃連二兩為末入臟內兩頭扎定瓦器內米醋煮爛共搗加糕糊為丸每服五十丸米飲下或當歸酒下治法詳本門又方用鯽魚去腸以五倍子末填滿煅研末酒服一錢用牡蠣粉茶調服或用貝母為末服備揀古來治諸瘡毒至簡至穩神方於後以便取用雄黃錢半杏仁三十粒去皮輕粉一錢冰片少許共為末以雄豬膽汁調塗仙方也又方凡大毒十日內宜服護心散使毒氣出外若內攻則嘔逆不食而危矣真緑豆粉二兩乳香一兩燈心末三錢先漿之焙乾研末後以水洗去漿布濾用以甘草煎濃汁調一錢服至一兩則香徹瘡口而愈又方毒初起及收斂時用遠志肉米泔浸為末酒調三錢服以滓敷患處又時行斑瘡一身忽如火傷決之復起此惡毒也以多蜜炒升麻水煎多服並以升麻煎水洗之瘡腫焮熱大痛大黃末醋調敷之燥即易數次即退癰腫無頭蠶繭燒灰酒服一枚即出一頭而自破大毒濕瘡痛而不癢黏不得衣被以菖蒲研末一斗布席上臥之覆以被三五日自愈惡瘡初起搗蒜加麻油厚敷干即易之救人危急諸瘡久不瘥者用鯽魚燒研和醬汁塗之癰疽不起發頭陷黑黯不熱不痛服補藥不效用人牙煅穿山甲炙各二錢為末以當歸麻黃煎酒作二次調服外以薑汁調面敷之大毒用雄雞冠血塗之療腫垂死菊花一握搗汁入口即活冬月採根用其效如神又方以艾燒灰淋汁加石灰少許為糊先將針挑破至血出乃點藥三遍其根自拔又方蜜與蔥搗爛先刺破瘡頭塗之一時毒出以熱醋洗之又方刺破瘡上以人糞熱封之干即易一日除根又方內服十全大補湯加生黃耆五錢外用蒜切片安瘡上以熟艾灸之三壯易蒜或毒重肉木灸至肉痛方住少頃再灸明日又灸總以數十壯幾百壯為妙若頭上生毒艾壯宜小此法最效百不誤一凡一切惡毒具宜用此法即瘡潰時亦當用此條已詳前灸法門用初生絲茅針酒煮服之一針一孔大奇又方白雞翅下兩邊第一毛燒灰酒服即破又方以麻雀屎揀兩頭尖者是雄屎加芝麻數粒搗敷即穿陀僧為末桐油調貼即愈貝母南星等分研末生薑擦之又方以生薑擦動醋磨貝母搽塗之若白癜風用白蒺藜六兩研為末每湯水調服二錢半月白處變紅一月斷根神效又方用附子硫黃為末薑汁調勻茄蒂擦之又方水銀輕粉用薑汁擦之用土茯苓一兩苡仁銀花防風木瓜木通白鮮皮各二錢皂莢子四分一日二服忌茶牛羊一切發物即前誤服劫藥變成痼疾多服自愈氣虛加沙參淮藥血虛加當歸有熱加芩連此外不得再加此方最穩而效或止用土茯苓四兩皂莢子七個水煎代茶飲外用輕粉大楓子肉等分為末塗之又方用輕粉一錢雄黃硃砂各二錢半槐花炒龜板炙各一兩為末糊丸每服一錢日二服冷茶下七日愈又方用輕粉胡桃肉槐花炒紅棗肉各二錢搗為丸分作三服一日雞湯下二日酒下三日茶下五日瘡干七日落痂又方大楓子燒和麻油輕粉研塗以楓子殼煎湯洗之效用醋或豬膽汁磨墨厚塗之又方用灶心土搗蒜和敷之又方鹿角醋磨塗之又方搗大蒜加麻油厚敷之干則頻易神效又方用芥菜子柏葉搗敷又方用木鱉子醋磨塗之又方大黃為末醋調塗之干即易又方五倍子醋煮敷之又方馬齒莧搗敷又方葛藤燒灰水調塗之又方芙蓉花或葉或皮搗敷又方肥皂搗爛加醋敷之又方用藤黃醋磨頻塗但毒人用當小心又方用水調牡蠣粉敷之拔毒而消用羖羊角燒存性研末以雞子清調塗之用松香末一兩白礬三錢為末麻油調搽有治法詳本門用母豬糞黃泥包煅存性為末先以米泔洗淨搽之立效爐甘石煅醋淬七次五錢兒茶錢半研末麻油調敷又方輕粉摻之即痂落而愈陰頭生瘡以蜜煎甘草塗之又方五倍子花椒皮炒各一錢細辛三分為末先以蔥湯洗淨摻之下疳亦用內服槐花蕊一二升毒從小便出愈時身發紅斑一二日無害永不再發未成膜五倍子炒百草霜等分共為末以醋調塗之立消用艾灸七八壯灸時一痛甚即易之再灸又方於瘤贅未甚大時取蜘蛛絲拈成粗線纏扎其根數日其絲漸緊諸絲日松蛛絲日緊瘤根漸細屢易之自落誠奇法也用爐甘石三錢研細末以麻油半杯煉熟下之再煉將黃色再下黃丹研細末二錢再煉滴水成珠便止傾於碗內收貯用時以油單紙攤鐵器上下以火燒熱挑膏藥於紙上乘熱易開貼患處先須以鹽茶洗淨中安燈心一根引膿水下流然後以膏藥貼之年久頑瘡立愈豫用悉效用大黃一兩煨皂角刺一兩共為末酒下即下毒物如魚腦再服再下如亂髮之蟲後服雄黃花蛇丸名通天再造散用松脂少入輕粉細研先以麻油塗之次摻藥一日即愈五倍末醋調塗之又方用絲瓜藤根煎水塗之又方用鯽魚燒灰和醬塗之又方用石膏燒研二兩黃丹五錢摻之生肉而愈此瘡生面上耳邊浸淫流水用羖羊須荊芥棗肉各二錢燒灰入輕粉四分再研麻油調塗二三衣愈口吻瘡同治又方用鱉甲燒灰摻之妙用螃蟹搗爛塗之又方用杉木煎湯洗之俱效用穿山甲五錢豬苓二錢並以醋炒研末酒服二錢愈用硫黃三錢花椒錢半水粉大楓子肉木鱉子肉各錢二分共研末新豬脂搗擦三四次痊內服下消風湯二劑消風湯用治乾疥極癢及一切瘡腫熱癤赤芍錢半生地二錢荊芥白芷銀花羌活獨活連翹甘草防風各一錢水煎服如熱燥加黃柏苦參如面上頭瘡加川芎白附各一錢北細辛三分立效湯新凡遍身瘡痛悉濃汁盈滿服之即膿干立效生黃耆三錢白朮錢半當歸身二錢小川芎五分白芷蒼朮各錢二分淨銀花錢半茯苓甘草各一錢車前子去殼八分痛甚加生地二錢稱足分量水煎服大瘡悉愈或小者復出多服斷根凡小兒至熱天遍身砂核癢燥不安甚則三粒五粒變成熱癤用赤芍大黃黃柏苦參各二錢連翹荊芥銀花甘草各一錢蒼朮錢半羌活獨活黃芩各錢二分共研末每用二錢蒸濃水半杯乘熱遍塗三四次即愈甚則加黃連錢半更效此豫屢試之方也用之最妙亦慈幼之一端也用青礬為末摻之即化為水用酸石榴皮蘸明礬末擦之若用醋蟲即沉下凡癰疽大毒速用真緑豆粉一兩乳香五錢燈心用漿焙乾研末水法去漿二錢以生甘草煎濃汁調一錢服至一兩香徹瘡口而愈否則毒內攻或不食而嘔則危矣用陳石灰研末搽之即愈用蠶豆殼燒灰水調塗之用硼砂爐甘石銀殊白蠟各四分為末忌鐵以麻油半小杯入藥熬化待冷塗之即愈然後於囊下逢中燒桐油燈火一路三壯斷根又方用柴胡當歸車前子木通膽草黃芩甘草澤瀉梔仁各錢半水煎服後以本滓加黃連黃柏各一錢牡蠣粉二錢煎水洗隨用鳳凰殼即抱雞出雛蛋殼一錢冰片一分大古勇青黛各二分輕粉八釐共研末擦三次立愈屢試屢驗又方蛇床子五錢生白礬三錢煎水洗後用黃丹枯礬生牡蠣共為末擦之又方胡椒煎湯洗之陰濕諸瘡用蛇床子二兩朴硝一兩煎水洗陀僧三錢水粉花椒各錢半海螵蛸一錢硫黃三錢共為末以生薑蘸藥擦患處三次愈但先用連翹去間四錢酒煎服斷根梔子仁研末蜜調塗之又方大黃研末蜜調塗之又方杉樹皮燒灰雞子白調塗之又方絲瓜葉搗敷無生葉用干葉研末蜜調塗之又方緑豆擂濃漿塗之又方井底泥敷之又方石膏末敷之又方生桐油調人中白敷之用劉寄奴草搗敷止血立愈又方不拘柴燒枯炭研末乘熱深擦之血止不痛忌水浸洗但面上勿用恐有黑印又方嚼三七敷之再嚼一錢米湯下有瘀血即化跌打瘀血積痛大黃一兩酒蒸杏仁七粒去皮雞鳴時服之血下即痊外紅紫腫痛大黃末薑汁調塗妙打撲瘀痕水調半夏末敷之跌閃出骨蠶砂四兩緑豆粉四兩俱炒枯礬二錢為末醋調敷之包定日換一次忌孕婦見之三次愈又方骨碎生蟹搗沖酒服外以滓敷之扎定少傾細聽骨接有聲神妙止血合口用五月五日取金櫻子桑葉苧葉搗餅陰乾用時研末敷之名軍中一捻箭凡跌打痛腫用蔥和蜜搗敷立效飲童便妙跌打損傷垂危者用蚯蚓煎酒服神效遍身瘙癢或生癮疹此血熱或血虛以生風也用上消風湯或加黃連如老人婦人加當歸白芍如身熱加青蒿又方用苦參為末皂莢煎濃汁丸服又方以石灰醋和塗之隨手即消人乳桐油等分和勻以鵝翎掃塗神效用生薑陳酒糟各一斤同搗爛罨傷處小兒頭面患瘡膿汁作癢痂厚不落用松香枯礬官粉黃丹等分為末麻油調敷若作癢出水水到即潰者用緑豆松香為末麻油調敷又方以益元散加枯礬少半以庇油調敷大妙內服荊黃敗毒散二服用銅緑末敷又方用枯礬黃丹摻之人有久苦床簀者身上骨高處或磨去皮或磨去肉實在有不安於睡者只得厚鋪絮褥亦覺無益余有一法床上之草要四五寸厚將於睡患之處排開二寸闊上面仍舊安席安褥將患處恰安空闊席草坑上自覺相宜即無病瘦人有骨高處亦如此睡法最妙
