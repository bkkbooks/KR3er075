body:
  text: 卷十七本草中竹木部一九七淡竹葉味甘淡微寒無毒入心脾二經氣味輕清除上焦煩熱葉生竹上故治上焦療咳逆喘促消痰止渴涼心經清肺胃解熱狂喉痹虛煩不眠止吐血利小水寒涼之效心熱退故小水亦清中風失音小兒驚癇痰熱竹能損人中病即止多服壞胃一九八竹茹味甘微寒入胃經雖與竹葉同本然得土氣居多治噎膈嘔逆胎前惡阻因胃熱者宜用療吐衄崩中血熱肺痿唾膿小兒癲癇清火胎動不安涼胎氣按皮入肺主治上焦刮去青皮用第二層一九九竹瀝味甘性寒而滑養血補陰消風降火竹之有瀝猶人之有血也故補陰清火治中風口噤小兒驚癇由陰虛火旺煎熬津液成痰壅塞氣道經絡以致拘攣仗此流利清涼則熱痰去而諸證自痊為中風要藥胸中煩悶口渴孕婦不安妊娠苦煩名子煩服竹瀝或加茯苓若胃虛腸滑寒痰濕痰不可用即用加薑汁佐之二天竹黃味甘微寒入心肝經涼心經去風熱治中風不語客忤驚癇化風痰熱痰養心明目寒除虛火功與用竹瀝相仿但性稍緩無寒滑之患出海南大竹之津氣結成即竹內黃粉片片如竹節者真二一雷丸味苦寒有小毒入胃大腸經惟治男子不治女人消積殺蟲小兒宿食生蟲作膏與食並療胃中實熱痰火癲狂百邪惡氣稟竹之餘氣得霹靂而成故名雷丸擇肉之白者可用赤者殺人甘草水浸一夜去皮酒拌蒸二二荊藶味甘平入胃經除風熱化實痰虛痰用竹瀝開經絡行氣血治中風失音痰迷寒痰驚癇眩運煩悶為去風化痰妙藥熱多用竹瀝寒多用荊瀝並宜薑汁助送則不凝滯牡荊俗名黃荊截取一尺用火炙取汁用二三肉桂味辛甘性大熱有小毒入肝腎命門三經益陽消陰補相火兩腎中間乃真火也人有此火則糟粕化而脾腎旺矣治沉寒痼冷臍腹腰足冷痛通血脈導百藥辛能散熱能行抑肝扶脾木盛剋土辛散肝風甘益脾土脾虛惡食命火不足不能生土濕盛泄瀉土為木克不能防水降虛火補下焦元陽同參附地黃用化産後瘀血腹痛及痘疹虛寒不起同當歸川芎用利關節托癰疽能引血成膿截瘧疾將發時用錢余噙口中通經墮胎辛熱能動血也出交趾者為上次出嶺南桂州以肉厚氣香色紫甘多辛少者佳去粗皮用其毒在皮忌生蔥臨用方銼見火無功二四桂心入心脾二經用桂重去外皮取肉用苦入心辛走血治腹內冷痛辛熱九種心疼邪正相激故令心疼托癰疽痘瘡灰塌凶證同丁香用補旁傷健腰膝胃肝兩足療風痹養肝化噎膈補火功用與桂相同惟入心脾為多二五桂枝味辛甘氣溫入膀胱肺二經味薄體輕升浮樹巔故上行頭目橫行手臂治傷寒寒熱無汗調和榮衛邪無所容遂自汗而解亦惟有汗者宜之若無汗當以發汗為主故曰無汗不得服桂枝有汗不得服麻黃也中風自汗此屬陽虛用之為君佐以白芍甘草加薑棗為桂枝湯能和榮實表非桂枝能閉汗孔也療手足痛風痛風有風痰風濕濕痰濕熱瘀血氣虛血虛之異隨證立方加桂枝作引經胸脅疼痛脅屬肝桂能平肝按桂性偏陽不可誤投如陰虛及一切血證無表寒者均當忌之二六茯苓味甘淡平無毒入心腎脾胃小腸五經假松脂之餘氣得坤厚之精英為脾家要藥益脾甘溫除濕淡滲入肺瀉熱氣白入肺而下通膀胱以利水上行入肺以清化源而後下降利水使熱從小便出也調榮血理衛氣定魄清肺以藏魄安魂養肝以藏魂除咳嗽保肺驚悸心肝不足心下結痛膈中痰水脾虛嘔吐胃經濕熱口燥胃火療水腫淋瀝泄瀉滲濕遺精益心腎之功若腎水虧寒者又所忌用小便結者能通多者能止濕除自止生津止渴濕熱去則津生補陽安胎胎繫於脾脾健則胎安按茯苓補少利多多服損目陰虛者久弱者不宜服若多用人乳拌曬以減痰滲之勢亦能補陰茯苓皮功專行水治腰以下水腫膚脹五皮散用之赤茯苓專利濕熱全無補益痘瘡灌漿時赤白二種俱忌服二七茯神主治略同茯苓惟入心之用多開心益智安魂養神治心虛驚悸怔忡健忘即茯苓抱根生者以其抱心故能補心去木用茯神心木名黃松節療偏風喎斜諸筋攣縮心木一兩乳香二錢石器炒研每服二錢木瓜湯下治一切筋攣疼痛乳香伸筋木瓜舒筋也二八琥珀味甘平入心肺脾小腸四經松脂入土千年而成寶也寧心定魄成於坤象消瘀血破癥瘕色赤入血同辛溫藥用生肌肉斂澀利小水味淡清肺治五淋淡滲也燥脾土甘能補土明目磨翳以摩熱拾芥者真市人以青魚枕偽之亦能拾芥宜辨用柏子仁末入瓦鍋同煮搗末用二九松節味苦性溫主治骨節間風濕作痛以節入節浸酒更良松脂苦甘性燥祛風去濕生肌止痛熬膏多用之塞牙孔殺蟲松毛煮汁釀酒亦治風痹腳痛能生毛髮懸挂闢瘟疫氣子味甘氣溫性和無毒補少氣虛弱兼驅風痹補精味甘補形氣溫久服輕身延年惟此足以當之二一柏子仁味甘性平無毒入心肝腎三經畏菊花炒去油芬芳則脾胃所喜潤澤則肝腎俱宜養心滋腎助脾舒肝香能舒脾又入肝經氣分益智寧神平驚辟邪養心聰耳明目腎足益血止汗養心生血汗為心液悅顏色澤皮膚心腎交灌潤大腸利虛祕潤滑按柏子仁雖能滋陰養血若欲培補根本乃非所長若痰多與瀉者勿服二一一側柏葉味苦性寒入肝經血分滋陰涼血凡血熱妄行吐衄崩淋服之立止柏屬金可以制木須炒黑用可以止紅療歷節疼痛日輕夜重名白虎歷節風亦風寒濕所致取側者宜酒木皆向陽柏向西堅徑不凋多壽之木故元旦飲椒柏酒以增壽辟邪二一二枸杞子味甘微溫入肝腎二經味重而純故能補陰陰中有陽故能補氣添精髓補之以味強筋骨肝主筋腎主骨補勞傷同地黃用去風養肝明目目為肝竅瞳人屬腎利大小腸陰潤治嗌乾消渴滋腎水足但性滑潤脾弱泄瀉者必以苓朮相佐以甘州所産紅潤少核者良酒浸搗用葉名天精草苦甘而涼清上焦心肺客熱代茶止消渴二一三地骨皮味甘寒入肝腎三焦膽四經補正氣涼血及骨使精氣充足而邪火自退與芩連知柏苦寒傷胃者不同治五內邪熱有汗骨蒸丹皮退無汗骨蒸除在表風邪肝熱生風非外感之風也頭風熱退風息肝腎同治脅痛清肝療咳嗽清肺退肌熱凡風寒散而未盡作潮往來非柴葛能治用地骨皮走表又走里而浮遊之邪自散一切血虛勞熱佐以青蒿甘草水浸用中寒者忌之二一四山梔子味苦寒入心肺胃三焦四經輕飄象肺圓赤似心瀉心肺之邪熱使之屈曲下行從小便出非利小便也乃肺清而氣化行矣治實熱同三黃之類暫宜生用肺熱鼻衄同生地丹皮之類宜炒黑用劫心胃火痛宜薑汁拌炒用胸中鬱熱懊憹不眠去皮用肌表邪熱留皮用療吐血血淋血痢凡血證不可單用寒涼治實火之血能順氣則血自歸經治虛火之血能養正則氣自攝血解消渴熱鬱風熱目疾肺熱熱厥厥有寒熱二證黃疸加茵陳去濕熱嘔噦屬胃熱者薑汁炒瘀血腹痛同元胡索用亦外治面赤湯火瘡瘍腫痛皮腠屬肺按苦寒損胃無火邪者勿用二一五黃柏味苦大寒入腎經沉陰下降瀉膀胱有餘之相火尺脈洪大有力可炒黑暫用除濕清熱治諸痿癱瘓遍體疼痛合蒼朮名二妙散為治痿妙藥若病在腰膝以下加川牛膝名三妙散水腫黃疸濕熱便閉用利水藥不效者所謂無陰則陽無以化也東垣制滋腎丸黃柏知母各一兩酒洗焙研加肉桂一錢二分為丸妙方療熱痢痔血腸風皆屬濕熱宜炒黑用諸瘡痛癢頭瘡研末敷之口瘡蜜炒研含不效宜用反治之法參朮甘草加乾薑甚者加附子或噙桂附引火歸元殺蟲安蛔苦也按黃柏苦寒昔人稱其補陰者以熱去則陰不受傷耳乃不問火之虛實見龍雷之相火一發以知柏為滋陰而不知天陰則雷火愈發得太陽一照火皆潛藏當從其性而伏之正所謂甘溫能除大熱也或上焦有熱證以拒之宜用桂附冷服下咽之後熱性發可引火以自歸也若元陽既虛而又用此苦寒則脾胃壞飲食減泄瀉作生機遏絶可悲也乎二一六山茱萸即棗皮味酸微溫入肝腎二經酒潤微火焙研味厚固精味酸滋肝性溫而潤故於水木多功強陰助陽肝腎足也定五臟通九竅精氣足則九竅通利暖腰膝縮小便肝腎足也止遺泄味酸澀聰耳耳通腎明目瞳人屬腎精氣充滿澀帶濁調經收血酸以斂之惟便澀陽旺者忌之二一七杜仲味辛甘入肝腎二經惡元參製法詳下甘溫能補微辛能潤色紫入肝經氣分潤肝燥補肝虛子能令母實故兼補腎健筋肝充壯骨胃足治腰膝痠痛腰者腎之府膝者筋之府二者軟痛屬腎虛每日用杜仲一兩半酒半水煎服待痊方止永不復發暖子宮止夢遺療小便餘瀝胎漏胎墮方載保胎門皆氣溫性固之效欲補腎鹽水炒欲補筋骨酒炒欲祛濕痹薑汁炒按杜仲性溫而不助火可以久服功專補腎腫直走二經氣分牛膝直走二經血分熟地補二經精髓之內續斷補二經曲節之間故數味相須為筋骨氣血佐使以成功也若腎經火熾者勿用二一八女貞實味苦性平入胃腎二經稟天地至陰之氣凌冬不凋益肝腎能養陰氣解煩熱骨蒸虛汗消渴能平陰火安五臟強腰膝烏髭發明耳目腎足之效冬至採酒蒸用按脾胃虛寒久服作泄二一九桑白皮味甘微辛氣寒入肺經蜜炙用瀉肺經有餘之火邪火去則肺安故云益氣止咳嗽喘滿唾血熱渴皆肺火也利二便肺與大腸相表裡又系水之高源肺清則二經自安寬腫脹水利行水清痰肺中有水則生痰而作嗽除水氣正所以瀉其子也但氣虛及風寒作嗽者慎用分之為線可縫皮破二二酸棗仁味酸平入肝膽兼入心脾四經甘酸而潤凡仁皆潤補肝膽而醒脾土炒熟酸溫香則醒脾治膽虛不眠心虛自汗肝虛則膽亦虛肝不藏魂故不寐汗為心液心虛則驚悸而易汗解渴除煩斂陰生津安神養血補心補脾嗜食補心火生脾土並療多眠多眠膽實有熱宜生研末調服不眠膽虛有寒宜炒用按肝膽二經實而有熱勿用以其能收斂也炒研用若經日久走氣不效二二一豬苓味甘淡平入腎膀胱二經去皮用甘助陽淡利竅通淋消水腫除濕理腳氣解傷寒濕熱胎腫子淋皆利濕之功然耗津液多服昏目二二二厚朴味辛苦氣大溫入脾胃二經薑汁炒辛散結苦瀉熱溫散寒瀉實滿同積實大黃用消痰下氣苦以降也散濕滿同蒼朮橘紅用平濕土之太過辛而溫也治反胃嘔逆瀉痢冷痛霍亂俱胃經寒濕之患溫胃暖脾化宿食去結水破瘀血辛溫散滯之功然但可施於元氣未虛邪氣方熾之時若虛人孕婦並所忌耳二二三檳榔味苦辛氣溫入胃大腸二經忌見火辛破滯苦伏蟲溫散邪墜氣至於極下攻堅去脹消食殺蟲下水截瘧治痰癖癥結瘴癘痢疾水腫大小便氣祕裡急後重悉辛溫之功形如雞心破之作錦紋者良嶺南多瘴氣以檳榔代茶可解若地無瘴氣及氣虛下陷者所當避之二二四川椒味辛性熱有毒入肺脾胃三經閉口者殺人稟純陽之氣下達命門益下而不衝上蓋導火歸元溫脾暖胃治三焦沉寒冷痼消食除脹療心腹冷痛泄瀉嘔吐水腫痰飲暖腰膝縮小便皆補火之效陰汗泄精下焦虛寒堅齒明目能去翳膜通血安蛔腎氣上逆性能下行溫補下焦每日吞二十粒最妙最殺傳尸勞蟲研為末每日米飲下三錢服至斤許蟲自吐出去目微炒用若陰虛火旺肺胃熱者忌服二二五椒目即川椒子味苦辛專行水道不行穀道治水蠱除脹定喘行水斂汗可塞耳療聾二二六胡椒味辛大熱有毒入胃大腸二經辛熱純陽暖胃快膈善走氣分溫中下氣治寒痰食積腸滑冷痢陰毒腹痛吐酸水嘔逆脹滿胃寒之患殺一切魚肉毒食料宜之多食動火發痔瘡臟毒齒痛目昏畢澄茄一類二種主治略同又一種花椒肉薄色黑專於殺蟲治乾疥蟲癬外科用之不作湯服二二七吳茱萸味辛苦大熱有小毒入脾胃肝三經鹽湯泡數次用辛散燥熱潤肝暖脾治腸胃久瀉心腹寒痛及小腹陰毒切痛厥陰頭痛嘔逆吞酸亦有宜降火清痰俱用此作嚮導以上諸症悉屬寒療痞滿食積噎膈胃冷腳氣水腫苦澡濕口舌生瘡為末醋調貼足心引熱下行陳者良止嘔黃連水炒治疝鹽水炒治血醋炒二二八皂角味辛鹹溫有小毒入肺肝胃三經去粗皮及弦與子酥炙用辛溫能散咸能軟堅通上下關竅用末吹鼻搜風金勝木燥勝風善吐風痰皂角末五錢白礬二錢半每用一錢溫水調灌即昏迷者吐痰而醒可下結糞以末入蜂蜜煉緊捏成導箭插入穀道即下治咽喉痹塞為末吹之辟邪逐疫合蒼朮焚之散腫消毒塗之敷之殺蟲下胎療脫肛腫痛燒煙燻之可入丸散不入湯藥若似中風由於陰虛者禁之皂角刺治潰瘍能引諸藥直達瘡處成功其性鈍利為癰疽妒乳疔腫未潰之神藥凡瘡已潰及孕婦俱忌之嫩刺米醋熬塗癬有效皂角子功用與皂角同通大便燥結煅存性用取辛以潤之之義又有一種皂小如豬牙者功用與大皂角同但遜猛烈耳治齒取積作散熬膏可療腫痛皂角樹性能消鐵不可燒爨若不結皂角者鑿孔入鐵封之結而不落者以草繩縛之二二九肥皂味辛氣溫除風濕去垢膩澡身妙療一切無名腫毒有奇功凡腫毒用生肥皂去子弦搗爛以釅醋和敷不愈再敷奇驗若倉卒無藥者取用甚便二三棕櫚即棕也味苦性澀苦能瀉熱澀可收脫燒黑存性善止血凡紅見一切黑者即止治吐衄下血同側柏卷柏燒黑或飯丸或煎服能止遠年下血血痢崩帶一切失血久而多者初起未可遽用年久敗棕尤良宜與發灰同用棕子九月採陰乾入劑其功用與棕同亦宜炒黑用二三一枳實味苦酸微寒入肝脾二經麩炒性實暴猛功能破氣除心腹痞滿停痰消宿食堅積逐瘀血祛滯氣解傷寒結胸去胃中濕熱悉氣行之效佐白朮治虛脹助大黃下實邪但損真元無宿滯而氣虛者勿用二三二枳殼氣味功用與枳實同但性稍緩耳枳實性重多主下行破堅枳殼氣輕多主上行破氣利關節止嘔逆痰結咳嗽開胸脅脹痛水腫濕瀉痢疾後重療腸風食積氣行俱痊但苦泄辛散惟利肺氣之有餘寬大腸之壅滯而已若虛怯者最忌之二三三槐角味苦酸寒入肝大腸二經微炒用苦寒純陰兼清心肺脾肝大腸之火治心腹熱痛目赤熱淚清肺止淚止吐衄舌出血為舌衄炒研摻之腸風崩漏痔瘡下血赤痢涼血之效療疳蟲陰瘡濕癢一切楊梅癰疽惡毒血熱生風之患墮胎而善催生酒吞七粒花味更苦功用與槐角同而清熱尤效枝主洗瘡皮主浴爛瘡根主噙喉痹葉煎湯治小兒驚癇壯熱疥癬疔腫按槐性陰寒脾胃虛寒作瀉陰虛內熱者忌服二三四苦楝子味苦寒有毒入脾肺二經性苦寒能入肝舒筋引心包相火從小腸而下為疝氣要藥去濕熱也殺三蟲疥癩亦治瘟疫犯躁苦寒脾胃虛寒者大忌根味更苦殺諸蟲尤善逐蛔若酒和塗疥癬甚良川産者良酒蒸寒因熱用二三五蔓荊子味苦辛入肝膀胱二經氣清體輕所主者在風木之藏治頭痛腦鳴太陽脈絡於腦目赤肝熱齒痛上下齦屬陽明風熱故痛筋絡拘攣筋屬肝能去寒熱濕痹按上諸證因於血虛有火者宜慎用之二三六五加皮味辛苦溫入腎肝二經除風濕溫也壯筋骨苦也順氣化痰辛也治四肢拘攣兩腳痹痛養肝陰痿囊濕小便遺瀝女人陰癢濕生蟲明目腎足療疝溫去濕釀酒良久服可以長生按下部無風寒濕及肝腎虛而有火者皆忌之二三七乾漆味辛溫有毒入肝經炒至煙盡為度功專行血殺蟲削堅結積滯化腸胃一切有形之物辛溫散結破凝結瘀血味兼咸可入血分瘀血化為水殺傳尸勞蟲毒以攻毒續筋骨絶傷損傷必有瘀血停滯外中其毒而生漆瘡者惟杉木湯紫蘇湯蟹湯浴之可解或用香油調鐵鏽塗之二三八蜜蒙花味甘平微寒入肝經甘能補血寒能除熱專入肝經養榮和血治一切目病凡青盲赤腫赤脈多淚膚翳畏日小兒痘疳風熱糜爛雲翳遮精等證俱療此為肝家正藥肝開竅於目目得血而能視故諸證皆愈産蜀中葉冬不凋楝花酒浸候乾蜜拌蒸三次日乾用二三九丁香味辛溫入肺胃腎三經溫中快氣辟惡除邪治胃冷壅脹厄逆霍亂嘔吐泄瀉心腹冷痛腰膝寒疼諸證皆屬陰寒療齒疳𧈟痘瘡灰白按丁香暖胃辛熱而燥非虛寒者勿用有二種小者力小大者知母丁香力最大也忌見火二四訶子味苦酸溫入肺大腸二經酒蒸去核焙用泄氣消痰肺氣上逆苦以泄之斂肺降火酸以斂之治冷氣腹脹同陳皮砂仁用虛寒滑泄佐白朮蓮子用因濕熱者忌之腸風脫肛崩帶同烏梅倍子用皆取其酸澀開音肺斂止渴火降除痰嗽喘急肺挾痰水或被火傷宜用苦酸腸澼痢也便血同樗皮用然苦多酸少雖澀腸而泄氣若氣虛及嗽痢初起喘因火沖者皆忌從番舶來番名訶黎勒嶺南亦有六稜黑色肉厚者良生用清金行氣煨熟溫胃固腸二四一烏藥味辛溫入胃膀胱二經辛溫香竄善行諸氣能疏胸腹邪逆脹痛喘急霍亂反胃宿食氣逆之患治中風中氣氣順則風散膀胱冷氣攻衝女人血氣凝結辛溫凡七情鬱結氣不流暢悉效亦止小便頻數能溫膀胱並療貓犬百病磨汗灌之按氣血虛而內熱者勿用二四二乳香味辛溫入心經箬上烘油用去惡氣調氣血辛溫通十二經絡能去風舒筋筋不伸者敷藥加用解諸瘡之毒活血調氣托裡護心香徹瘡孔能使毒氣外出不致內攻惡痢腹痛活血亦治癲狂方載本門諸瘡痛癢皆屬心火乳香生血主心托毒外宣大有奇功但辛香走竄氣血瘡已潰者勿服膿血多者勿敷出諸番明亮者良市人多以楓香偽之性黏難研用鉢坐熱水中研之或用燈芯同研二四三沒藥味辛苦微寒入肝經製法同乳香苦能泄辛能散寒除熱散血平肝破結氣通滯血消腫解毒定痛生肌治一切惡瘡金傷跌折血滯則氣壅發為腫痛金跌亦有瘀血沒藥能行血則氣暢而痛自止目赤暈翳肝經血熱破癥墮胎按乳香活血沒藥散血故二者相需為用凡身痛不由血瘀而因血虛産後惡露去多腹內虛痛瘡毒已潰皆禁用之出南番色赤類琥珀者良治同乳香二四四楓脂香即白膠香味辛苦入肝經活血解毒外科敷貼要藥治一切癰疽惡瘡癮疹風瘙齒痛金瘡或煎洗或末摻俱效色白微黃能亂乳香功頗相近二四五大楓子味辛苦性熱有毒辛能散風苦能燥濕殺蟲熱能通行經絡世人用以治大風厲疾及疥癬癩毒諸瘡悉此意耳但不宜多服常餌性熱而燥傷血損陰用之外治其解毒殺蟲之功最驗出南番子中仁白色久則油黃無用或入丸藥壓去油用二四六沒石子味苦溫入肺腎二經稟春生之氣兼秋收之性生精安神治夢遺精滑陽虛之嗣腹冷虛痢擦牙固齒補腎固氣外收陰汗可染髭鬚合他藥用出諸番顆小紋細者佳炒研用蟲食者去之忌銅鐵二四七蕪荑味辛苦溫入肺胃經辛散滿苦殺蟲溫燥濕化食蟲因濕而生食因寒而滯治心腹冷積癥痛鱉瘕嗜酒人血入酒為酒鱉多氣人血入氣為氣鱉虛勞人敗血雜痰為血鱉如蟲之行或上侵人咽下蝕人肛或隱脅背胸腹惟用蕪荑炒兼暖胃理氣益血之藥乃可殺之殺三蟲去寸白除疳積幼科取為要藥寒痢收為上品同訶子肉蔻用療胃有蟲食即作痛和麵炒黃為末米飲下然多服損胃陳久氣膻者良經火煅過用二四八木鱉子味苦甘大寒有大毒散血熱除瘡毒治癰疽乳腫痔漏一切無名腫痛用醋磨頻敷及喉痹毒腫磨醋噙漱引痰吐出不可咽下但宜外用不可內服試看毒狗者能使斃於頃刻人之腸胃安能受此毒乎番木鱉大寒大毒功用與木鱉同形較小而毒性更甚二四九巴豆味辛熱有大毒入肺脾胃大小腸五經畏大黃黃連冷水去心膜火焙研細去油用性剛氣烈無處不到能攻臟腑一切沉寒有形積聚與大黃同為攻下但大黃性寒走血分腑病多熱者宜之巴豆性熱走氣分臟病多寒者宜之破痰癖血癥通祕結消宿食下活胎爛死胎誠有蕩滌殆盡之能然滯塞雖開真陰隨損以少許著肌膚須臾起泡況腸胃柔薄之質能不潰爛乎萬不得已亦須炒熟或醋煮或燒用研去油名巴豆霜入少許不得多用有二種緊小者為雌有三稜及兩頭尖者又名剛子為雄性更峻耳用之得宜皆有功力若中毒而瀉不已者服涼水即止二五五倍子味酸澀微寒入肺胃二經酸能斂肺寒能降火止上下之血收陰陽之汗療肺虛久嗽腸滑久瀉酸澀生津化痰火降痔漏脫肛膿水濕瘡子腸墜下眼目赤腫俱煎水洗治齒宣疳𧈟面鼻疳瘡苦以殺蟲斂瘡口解消渴寒以散熱按性主收斂嗽由外感瀉非虛脫者禁用二五一百藥煎即五倍子釀造者味酸澀微甘其功與五倍子同但經釀造而成其味稍純能清痰解渴止嗽凡耗散諸病俱能收斂作丸噙化尤佳及治下焦滑泄亦更優也二五二沉香味辛溫入脾胃肝腎四經諸木皆浮而沉香獨沉故能下氣亦能上升而諸氣悉調辛也抑陰助陽補益相火溫火治轉筋霍亂喘急脹滿氣淋癥癖調氣之力療嘔逆翻胃噤口瀉痢冷痰寒涎芳香氣溫能補脾胃諸症自痊消水腫除麻痹脾旺燥濕驅惡氣香以隔之則脾胃安平怒氣怒則氣上辛溫下降按沉香行氣而不傷氣溫中而不助火但非命門火衰不宜多用氣虛下陷者一概禁止色黑沉水者佳香甜者性純辛辣者性熱入湯劑磨汁用入丸散咀片紙包置懷中待燥碾之忌火鷓舌斑者名黃沉牛角黑者名角沉咀之軟削之卷者名黃蠟沉難得浮者名棧香半沉者名煎香雞骨香雖沉心空俱不堪用二五三檀香味辛溫入肺胃二經調上焦滯氣在胸膈咽嗌之間大有奇功引胃氣上升進飲食止腹痛療噎膈除毒腫醋磨汁塗以上皆辛溫之效闢穢氣逐鬼魅諸香多助淫火檀香不然故釋氏焚之又治面生黑子每晚以熱水洗拭磨汁塗之甚良但香能調氣亦能散氣若氣虛及陰虛火盛者瘡毒潰後膿多者俱忌之二五四降真香味辛溫入血分色紅者良和榮氣闢一切惡氣不祥焚之闢天行時氣宅舍怪異小兒佩之可避諸邪療肝傷吐血折傷金瘡止血定痛生肌滅瘢凡血出不止為末掩之即愈自番舶來者色紅甜而不辣為良若色深紫者不佳沉香色黑故走北方而理腎檀香色黃故走中央而理脾降真香色紅故走南方而理血用宜分別妄用無益且有害也二五五冰片又名龍腦香味辛苦微溫先入肺傳於心脾二經氣雄力鋭善走能散通諸竅散鬱火治風在骨髓若風在血脈肌肉妄用之反引入骨不得出也肢節疼痛驚癇痰迷消風化濕驅逐鬼邪芳香目赤膚翳乳調頻點取其拔出火邪火鬱發之從治法也世人不知大辛大熱誤以為涼而常用之遂致積熱害目故云眼不點不瞎者此也喉痹舌出為末治之善於散火小兒風熱急驚痘瘡黑陷用一二釐以豬心血或豬尾血作引紫草湯調服化鼻瘜點之除惡瘡下疳痔漏疼痛末藥中用之婦人氣逆産難研末新汲水調服立下至於脾虛慢驚肝腎兩虛之目疾俱屬忌用出南番云是老杉脂白而作梅花片者良以杉木炭收之則不耗今人以樟腦升打亂之二五六樟腦味辛微苦善通關竅破滯氣性熱除濕闢中惡邪氣芳香治疥癬殺蟲除蠹書蟲燒煙燻衣筐席簟斷蛀蟲蚤蝨療腋臭同枯礬研勻擦之妙以樟木切片浸水煎成升打得法可亂冰片二五七蘇合香油味甘性溫捷於走竄通竅開鬱闢一切邪惡不正之氣殺鬼魅亦通神明可除夢魔出天竺國合衆香之汁煎成以箸挑絲不斷者真二五八大腹皮即茯毛味苦微溫入脾胃二經開心腹氣脹逐皮膚水腫通大小便理腳氣胎氣氣虛者忌用佐調補藥用之亦可成功子似檳榔腹大形扁故與檳榔同功但破氣之力為少緩耳鳩鳥多集樹上恐遺涎有毒宜以大豆汁多洗火焙用去外黑皮及內粗硬者為妙二五九楮實味甘寒入脾經主治水腫土旺剋水益氣力充肌膚土堅之驗強陰痿助腰膝脾實則能生精而灌注於腎之功也補虛勞明眼目悅顏色脾健則五臟皆實也久服輕身延年平補之品也脾胃虛寒泄瀉者勿用李時珍曰別録大明皆云補益而修真祕書又云久服令人骨痿濟生祕覽治骨硬用之煎湯豈非軟骨之徵乎大約同補藥用或者有功取子浸去浮者酒蒸用皮善行水治水腫氣滿二六茶茗細者名茶粗者曰茗味甘苦微寒入心脾肺胃四經稟天地清肅之氣除垢滌穢降熱消食去痰止渴清利頭目熱下降則上自清醒昏睡精神解燒炙熱毒苦寒利大小便火下止赤白痢同薑連煎敷湯火傷香油調末消脂瘠體最能去油壞胃減食雖能釋滯消壅卻損多益少若空心多飲直伐腎經且敗脾胃虛寒者慎之二六一血竭一名麒麟竭味甘鹹平有小毒入心肝二經血分甘主補咸主消去瘀生新為和血之妙品治內傷血積跌撲金傷皆有瘀血止痛生肌善結瘡口婦人血氣凝滯作痛俱可為末酒服然性急能引膿不可多用凡血病無瘀積者不必用血竭單入血分乳香沒藥兼入氣分皆木脂也出南番磨之透指甲燒灰不變色者佳用之須另研若同他藥研化為飛塵二六二金櫻子味酸澀入脾腎二經固精祕氣善於收斂治夢泄遺精澀可治脫和芡實為丸及崩淋帶濁小水不禁澀腎生津液益骨髓筋骨壯魂魄安固腎之效止泄瀉滑痢吐血衄血澀脾補五臟養血氣脾腎兩足平咳嗽定喘急土旺保金此固陰養陰之佳品脾腎皆屬陰而人宜珍之也取半生者有酸澀之性若熟則純甘去刺核與內毛用熬膏全失澀味二六三郁李仁味酸平入脾大腸二經湯浸去皮研入脾經氣分性降下氣行水破血潤燥治水腫癃急大腸氣滯不通凡有燥結屬實熱者可用然下後恐津液虧損燥結愈堅故為治標救急之藥若津液不足而大便燥結者慎勿輕用二六四蘇木味甘辛鹹微溫入心肝脾三經忌鐵三陰血分藥也少用則和血清血多用則行血破血性同紅花治婦人月經不調將行而止或腹脹而痛産後瘀血脹悶勢危者宜多用煮汁服之或加乳香末酒引療癰腫血瘕撲傷排膿止痛活血之功若治破傷風宜為末酒服立效散表裡風邪同防風用血足風自滅也解口噤風迷同乳香用按此去瘀生新之藥若無瘀血及血虛體弱者勿用二六五辛夷味辛溫入肺胃二經去外皮毛微炒用肺竅在鼻胃脈環鼻上行凡中氣不足清陽不升則頭痛鼻塞九竅不利辛夷能助胃中清氣上達高巔故諸證悉愈除頭風腦痛眩冒面腫鼻塞鼻淵目昏齒痛皆風熱之患療鼻瘡及痘後鼻爛為末加麝少許以蔥白蘸藥頻點良按辛香走竄體虛者鼻塞屬外感者頭痛屬血虛火熾者悉忌之二六六蕤仁味甘溫微寒入肝經湯浸去皮尖水煮過研膏治目疾有專功消風散熱益水生光凡目赤腫痛眥爛淚出化胬肉退翳膜俱效肝為風木之臟開竅於目風熱乘肝則血虛而目病此藥溫能散風寒能除熱甘能補血肝氣和則目疾瘳矣並破心下結痰腹中痞氣痰痞皆屬熱邪可以並治按目不因風熱而因於虛者勿用叢生有刺實如五味圓扁有紋紫赤可食二六七桑寄生味苦甘入肝經忌火苦堅腎助筋骨固齒長髮齒者骨之餘發者血之餘甘益血主崩漏下乳安胎三者皆由血虛利關節療痹痛苦以燥濕及産後血熱諸疾他樹寄生不堪用惟桑上者良桑椹入腎補水益血除熱曬乾蜜丸安魂鎮神聰耳明目取熟者絞汁熬膏入蜜煉稠點湯和酒並妙入燒酒經年愈佳桑葉採經霜者煎湯洗目去風淚每年九月二十三日洗之到老目明如幼洗手足去風痹為末服止盜汗二六八杉木味辛氣溫去惡氣散風毒治腳氣腫滿心腹脹痛洗漆瘡二六九芙蓉花味辛平入肺肝二經性滑涎黏清肺涼血散熱止痛消腫排膿治一切癰疽腫毒有功用花或葉或或根生搗敷或乾研末蜜調塗四圍中間留頭干則頻換凡毒初起即消成者即膿出潰者即易斂或加赤小豆末或蒼耳燒存性為末加入尤妙二七海桐皮味苦平入脾胃二經祛風去濕能行經絡治風蹶頑痹腰膝疼痛風濕者可用疥癬牙蟲苦雖殺蟲須與他藥同用亦治目赤煎洗出廣南皮白堅韌作索不爛者真按上諸證不由風濕者不用二七一樗根白皮即臭椿樹根皮去粗皮味苦澀微寒入血分治濕熱為病久痢滯氣未盡者勿得固澀帶漏崩中腸風精滑便數虛泄有斷下之功椿白皮即香椿樹根皮去粗取白者為佳治疳止血與樗皮功同只堪丸散不入湯煎但泄瀉由脾虛崩帶由陰虧及滯下積氣未盡者兩種皆不可用二七二榆白皮味甘氣平入大小腸膀胱三經性滑而下降行經脈利諸竅除五淋通二便滑胎産或胎死腹中服汁能下下有形留滯之物敷赤腫療不眠有赤白二種去粗皮取白用二七三秦皮味苦入肝膽腎三經色青性澀補肝臟而益腎治目赤腫翳膜煎汁頻洗平肝除熱療崩帶下痢性寒而澀痢初起者忌用能益精有子澀而補腎若只知治目幾失其良也出西土皮有白點漬水碧色者真二七四阿魏味辛溫入脾胃二經殺諸蟲除邪氣臭味殊常破癥積化蠱毒辛則能散溫則能行按人之血氣聞香則順臭則逆人有痞積不可輕用當養胃氣胃氣強則積自消矣阿魏之真以臭能止臭置於銅器其銅白如銀二七五山茶花味甘辛微寒色赤入血治吐衄腸風並以為末入童便及酒調服二七六木槿味苦氣寒入心肺脾胃四經活血潤燥清熱滑利之品治腸風瀉血濕熱痢後作渴餘熱在經津液不足夜臥少睡心經虛熱用根皮炒焦川産者治癬妙浸汁磨雄黃塗即今之栽作籬者二七七水楊柳味苦平生於涯涘之旁得水土之氣治痘瘡頂陷因氣凝血滯或風寒外束用葉或用枝煎湯多浴虛者只洗頭面手足浴時忌風內服助氣血之藥此方有燮理之妙不得忽過二七八柞木枝味苦平能催生善開交骨治黃疸苦以除濕其木直一葉一刺者是二七九石南葉又名石南藤味苦辛入肝腎二經辛散風苦堅腎補內傷陰衰利筋骨澤皮毛健腳軟補腎之功治風淫濕痹辛苦按石南補陰祛風不助相火男婦可服出關中者佳炙用二八紫荊木皮味苦氣寒入肝經血分寒勝熱苦泄結紫入榮能活血破血消腫毒用為末酒調箍住自然撮小而散並五淋皆當服之谷部二八一粳米粳硬也味甘涼入胃經得天地中和之氣和胃補脾除煩清熱仲景白虎等湯用之以清熱而補不足滋五臟生氣血外而肌肉內而精髓無不賴是充足者也經曰安穀則昌絶谷則亡職是之謂歟陳年米味更沖淡尤易消化善調脾胃止瀉痢煩渴健脾進食更除胃熱穀芽化食與麥芽同而溫中更良二八二糯米糯者懦也味甘氣溫入脾肝二經稟土中之陽氣補脾肺之虛寒堅大便縮小便脾肺足也發痘瘡解毒化膿或便泄五六日不起發灌漿用以煮粥最宜但性黏滯病人及小兒忌之糯米熬餳即飴糖潤肺和脾化痰止嗽仲景建中湯用之取其補脾緩中多食糯米昏五臟令人貪睡二八三麥芽味甘鹹溫入胃經炒黃用善於化食除脹散結消痰破癥咸能軟堅補脾寬腸和中行氣通乳下胎同蜜服下胎神驗婦人喪子乳脹用二兩炒服之即消其破氣散血如此虛人慎用按人若無積即消腎氣不得單用久用二八四神麯味甘辛溫入胃經研細炒黃陳者良健脾暖胃消宿食心腹脹痛逐痰積破癥瘕性專消導除霍亂調中瀉痢性澀化小兒腹堅因積婦人産後欲回乳者炒研酒服二錢日二次即止制神麯法五月五日或六月六日用白麵百斤以象百虎蒼耳汁三斤以象勾陳野蓼汁四斤以象膝蛇青蒿汁三斤以象青龍杏仁去皮尖搗爛四斤及北方河水以象元武赤小豆煮爛三斤以象朱雀六味合勻再加蕤蘞汁尤妙作餅如造醬法待生黃衣曬乾收之古用酒麴如此更加消痰利水暖胃下氣之藥得效較神按脾陰虛胃火盛者勿用能墜胎孕二八五紅曲味甘氣溫入肝脾胃三經性溫色赤入榮而化血燥胃消食活血和傷治赤白下痢跌打損傷産後惡露作痛以赤色治血同氣相求消食健脾與神麯同功而活血治痢有獨長也二八六酒味苦甘辛熱有毒入肺胃二經酒者水穀之精其性烈其氣悍無所不至暢和諸經善助藥力以之製藥取其行捷病在四肢筋骨使能橫行少飲和血益氣壯神禦寒辟邪逐穢遣興消愁過飲則傷神耗血損胃爍金發怒縱欲生濕熱痰嗽且成痰膈助火亂興諸病萌焉脾因火而困倦胃因火而嘔吐心因火而昏狂肝因火而善怒膽因火而忘懼腎因火而精枯以致吐血消渴勞傷癰疽失明甚則減壽夭喪為亂無窮可不戒哉醇而陳者良畏葛花赤豆花緑豆粉鹹鹵得咸則解水制火也燒酒雖能燥濕散寒而耗精燥血損人尤甚二八七醋一名苦酒味酸入肝經酸能斂又能散下氣消食治産後血暈以火粹醋使多聞其氣腸滑瀉痢散堅積癰腫外科敷藥多用之取其斂壅熱散瘀解毒胃脘血氣作痛磨木香服口舌生瘡含漱傷損積血和麵塗能散瘀開胃氣令人嗜食殺魚肉菜菌諸蟲毒多食傷筋收縮太過軟齒齒屬腎酸屬肝木氣強水氣弱故也按醋酸斂多散少助肝賊脾倘風寒外感及脾病者俱忌之米造陳久者良二八八小麥味甘微寒入心經養心除煩止唾血利小便面甘溫助五臟厚腸胃然性熱動風浮小麥即水淘浮起者味鹹氣涼止虛汗盜汗勞熱骨蒸汗為心液麥為心谷麥之涼在皮故面去皮即熱浮麥無肉故能涼心麥麩同功麥麩功涼外治能散血止痛凡折傷濕痹腳氣醋拌蒸尉之療瘡瘍痘瘡潰爛用麩裝褥臥之性涼而軟誠妙法也二八九蕎麥味甘寒入胃經補精力實腸胃治腹內歷久沉積不宜久食二九粟味甘鹹微寒入腎經養腎益氣治胃熱消渴反胃吐食用粟米粉水丸梧子大煮七枚納醋中細吞之澀腸斂肺固腎二九一罌粟殼味酸澀入肺腎大腸三經水洗去蒂醋炒透性澀斂肺固腸治虛嗽久瀉遺精脫肛筋骨諸痛澀精固氣能入腎故治骨病尤宜按風寒作嗽瀉痢初起者勿用二九二黑豆味甘平入腎經色黑屬水腎之谷也補腎以鎮心活血炒熟酒淋服下産後余血散風沃豆酒亦治産後中風危篤明目散熱腎水足而目明火退解毒搗塗消腫古治水腫每單用或加他藥可稀痘瘡煮食緊小者良每晨用鹽水吞或鹽水煮食補腎凡小兒未滿十歲者炒豆與豬肉同食壅氣致死十有八九忌厚朴犯之動氣白豆補臟暖胃益氣和中磨作豆腐和脾胃去胃火清熱散血但性寒脾胃虛者忌食若痘瘡不起用此極攻膿解毒如無藥者煮食極妙黃豆殼燒為末善摻豆爛二九三赤小豆味甘酸平入心小腸二經色赤屬火心之藥也其性下行入陰分通小腸治有形之病消瘕散腫凡一切癰疽瘡瘍雖潰爛幾絶為末敷之立效性極黏入苧根末則易揭治瀉痢腳氣用袋盛朝夕踏之行水消腫同鯉魚煮汁服通乳下胎性下降止渴清熱小便清也按滲津液久服令人枯瘦以其行降太過也二九四緑豆味甘寒入肝胃二經通行十二經性屬水通肝經為重而解毒之功過於赤豆一切草木金石牛馬砒霜毒皆治之清火清痰煩熱消渴吐逆屬胃火者上下血熱妄行濕熱泄痢腫脹利水其涼在皮宜連皮用以上皆甘寒清熱之功療癰腫痘爛用粉撲之湯火傷撲跌傷緑豆粉炒紫色井水調厚敷紙貼杉木扎定其效如神用囊作枕明耳目治頭痛頭風按胃寒者不宜食二九五白扁豆味甘氣溫入脾胃二經生用清暑養胃炒用健脾止瀉通利三焦升清除濁專治中宮之病調胃暖脾消暑除濕土強濕去正氣自旺治霍亂吐瀉痢疾濕熱帶下脾濕血崩脾不統血同紫花焙乾為末米飲調服三錢其血頓止子圓白者入藥去皮用多食壅氣二九六淡豆豉味甘苦寒入肺脾二經苦瀉肺寒勝熱豆性平既經蒸罯音庵入聲故能升能散治傷寒寒熱頭痛發汗解肌蔥引嘔逆煩悶宜吐同梔子能吐虛煩祛風酒煎療痢同薤服止血佐蒜又能收汗炒熟煎服去瘴氣安胎孕但傷寒直中三陰與傳於陰經者勿用熱結胸煩悶宜下不宜汗者忌之造法於六月間用黑豆水浸一宿蒸熟攤勻蒿覆候上黃衣取曬水拌乾溼得中安甕中築緊桑葉厚蓋泥固七日取曬又水拌入翁如此者七次再蒸曬乾壇取用二九七刀豆味甘氣平溫中止厄煅存性服勝於柿蒂二九八芝麻一名巨勝子味甘氣平入肝脾腎三經不寒不熱益脾胃補肝腎之佳品也潤五臟益氣力填骨髓堅筋骨明耳目肝腎足也利二便性潤逐風濕入肝益血血活風散澤肌膚血足治頭瘡小兒頭瘡生嚼敷之久服輕身延年但令人腸滑須以白朮佐之麻油滑胎血枯難下者用麻油五錢蜂蜜一兩煎數十沸服之磨瘡腫生禿髮熬膏用之涼血解毒皮肉俱黑者良栗色者名鱉蝨胡麻更佳九蒸九曬用二九九火麻仁味甘平入脾胃二經益血補陰補脾潤燥治大腸風熱結澀便難催生逆橫易順下乳利水破積血皆性滑下行之效並療汗多便燥汗多則津枯多食損血滑精痿陽婦人髮帶疾以其走而不守也即作布之麻之子也極難去殼帛包置沸湯內待冷懸井中一夜曬乾新瓦上挪去殼搗用畏茯苓白薇牡蠣果部三陳皮味苦辛溫入肺脾二經辛散苦泄溫能通行統治百部由於理氣燥濕之功氣順濕除百病不生調中快膈導滯消痰同枳殼用利其氣而痰自下利水破癥氣行止嗽利肺除嘔霍亂泄瀉脾濕氣逆凡補瀉升降等藥俱能佐助成功多服損元氣留白補中去白消痰白反生痰核治疝氣酒調末五錢服葉散乳癰二者皆行肝氣消腫散毒腰背冷痛橘核炒酒服良廣産陳久者良去白名橘紅除寒發表皮能及皮治痰咳童便浸炒治痰積薑汁炒治下焦鹽水炒核炒去皮用三一青皮味苦辛微酸入肝膽二經苦泄辛散性復克削破堅癖結積治左脅肝經積氣脹痛柴胡疏上焦肝氣青皮平下焦肝氣同枳殼肉桂川芎用瀉肺瀉肺即瀉氣破滯除痰消痞辛散下飲食截瘧疾入肝散邪入脾除痰瘧家必用然性峻削大損元氣即肝為東方生氣豈可輕伐用者慎之三二桃仁味苦微甘入心包肝二經血者陰也周流一身一有凝滯為病不少桃仁苦以去滯甘以生新治諸經之瘀血經閉血膈血癥熱入血室衝脈而譫語血燥大腸而閉結及蓄血發熱如狂血痞血痢味苦能散療撲傷有瘀血殺鬼苦辛血熱膚癢潤也辟邪殺鬼桃為五木之精若血不足及經枯血閉者禁用行血連皮尖生用潤燥去皮尖炒用雙仁有毒勿用桃花帶露採取陰乾殺鬼疰療風狂下大腸糞干脹痛用桃花濕者一兩和麵二兩作餅蒸熟空心食之自腹鳴而下惡物也葉能發汗凡傷寒風痹發汗不出以火煅地用水灑之鋪桃葉三寸厚席臥溫覆自大汗出而瘥枝煎湯浴不染時疫三三杏仁味苦甘溫入肺大腸二經性潤利而下行味苦溫而散滯溫能解肌苦能泄熱除風散寒同麻黃用發表解邪治頭痛咳嗽上氣喘急溫病腳氣味辛入肺療胸腹氣滿脹痛消痰下氣除驚癇煩熱大腸氣祕乾結味苦性降去皮尖消痰潤肺連皮尖發散表邪元氣虛陷者勿用恐沉降太泄三四木瓜味酸溫入脾胃肝三經忌鐵去穰稟東方之酸故多入肝治筋筋急能舒溫能通行筋緩能利酸能收斂並行而不悖也理霍亂暑濕傷脾陽不升陰不降則揮霍撩亂上吐下瀉甚則肝木乘脾而筋為之轉也暑泄去濕和胃消渴酸能生津腳氣濕痹故曰理筋骨之濕者莫如木瓜合筋骨之離者莫如杜仲按木瓜氣脫能固氣滯能和平胃滋脾益肺去濕有功之品但多食損齒傷骨病癃閉酸收太甚世用治水腫腹脹誤矣三五山楂味酸平入脾胃二經健脾行氣消肉積聚與神麯消穀食者不同凡煮老雞硬肉投數枚則易爛其化肉積可知治兒枕作痛産後惡露未淨留腹作痛名兒枕痛煎就少加砂糖服效行結氣散宿血以酸入肝去其肝臟之血滯也理痘疹毒由血熱氣滯借酸味入肝熔化其血毒為膿水也治疝佐茴香化痰補脾核可催生汁洗漆瘡按胃中無積及脾虛惡食者忌服去核用肉三六烏梅味酸澀氣溫平入肺脾二經脾肺血分之果也治肺虛久嗽初嗽忌用生津止渴酸也止瀉痢初起勿塞便血崩淋遺精夢泄酸澀截瘧方載瘧門安蛔厥蛔畏酸蝕惡肉疽愈後有肉突起烏梅燒敷二日愈神方也白梅功用略同烏梅治痰厥牙緊取肉擦牙齦即開搗敷乳癰青梅熏為烏梅鹽漬為白梅經云筋病無多食酸及病當發散者咸忌之三七芡實味甘平入脾腎二經性澀氣溫菱花背日而寒芡花向日而暖補腎固精健脾去濕治夢遺精滑同金櫻膏為丸名水陸二仙丹帶濁便數腰膝痠痛令耳目聰明強志益神腎足之驗祛泄瀉嗜飲食濕去脾健多服耐老或丸散或煮食入煎劑無力但性緩難收捷效三八大棗味甘溫入脾胃二經甘能補中溫能益氣後天生氣藉此充溢久服可輕身也調榮衛氣血生津液止瀉泄補脾和胃助血脈安神志潤養心脾和百藥甘也悅顏色脾經血足同生薑發脾胃升騰之氣傷寒表藥凡補陽分藥俱用之經曰脾病宜食又曰脾病無多食毋乃相反邪不知宜食者以脾虛泄瀉而言也毋多食者以脾實中滿腫脹之類也凡用藥者當因其虛實而變通之乃獲神功按棗雖補脾然味過甘中滿者小兒疳病者痰熱者齒痛者齒腎余土剋水也俱忌之北産肥潤者良紅棗差不及耳三九蓮子味甘平入心脾腎三經泡去皮心炒研用稟清芳之氣沖和之味補中養神益氣血滋五臟果中之仙品也交水火而媾心腎君相之火自靖治心虛夢遺白濁崩帶澀精氣止泄瀉久痢厚腸胃多服輕身延年但大便燥者勿食三一石蓮子九月經霜後堅黑如石墜水入泥多年者佳清心虛邪熱遺於小腸致病夢泄心與小腸相表裡也除煩開胃治噤口痢淋濁諸證今市中石蓮子味大苦産廣中樹上不宜入藥三一一蓮花須味甘澀溫入心腎二經清心益腎治吐衄諸血精心火止夢泄遺精固澀黑鬚發腎足除瀉痢性澀與蓮子同功而澀精獨長三一二藕味甘寒入血分涼血散瘀治一切血熱九竅妄行血淋痛脹用藕汁同發灰服二錢止渴除煩下産後血積産後忌生冷惟藕不忌為能去瘀也煮熟益胃補心多孔象心止瀉能實大腸久食令人心快而不怒益心之效生藕汁和蜜服肥腹臟不生諸蟲澄粉更佳安神益胃藕節治吐衄諸血同地黃搗汁入酒童便效更速蓮房即蓮蓬燒灰止血甚捷生用煎酒催生下衣荷鼻即蒂安胎甚良逐瘀血留好血並治血瘀三一三荷葉味苦平入肝膽二經色青形仰助脾胃而升發陽氣能散瘀血留好血治吐衄崩淋損傷産瘀一切血症固精安胎止瀉止渴發痘瘡倒黶薑蠶等分為末胡荽湯下勝於人牙龍腦雷頭毒風方載頭病有清震湯凡補脾藥或煎湯或燒飯為丸三一四龍眼味甘溫平入心脾二經養心葆血甘能益血君主強矣治怔忡健忘安神長智且甘能補脾治思慮勞傷心脾脾得補則中氣足而化源裕五臟悉安矣並療腸風下血血不歸脾按龍眼不寒不熱養肌肉美容顏久服輕身不老人能用肉細嚼待滿口津生和津汩汩咽下此即服龍泉法也勞症者於五更時辰巳時未甲時臨臥時每日四次每次用九枚作九口服服時則氣和心靜且漱津納咽是取坎制離之法勤行一月無有不愈可勝服藥千千矣勿輕視之三一五荔枝味甘酸氣溫入肝腎二經益血助榮甘溫止煩渴酸生津液長智慧美容顏血足過食助火生熱生於南方熟於夏月核甘澀而溫長治㿗疝卵腫煅研酒服或加茴香青皮各炒為末婦人血氣痛煅研醋湯下或加香附末或鹽湯米湯下殼發痘瘡三一六胡桃味甘平入肺腎二經性潤而熱上利三焦之氣下補命門之火命門者三焦之本源也在兩腎中間脊骨第七節中一點小心下通兩腎上通心肺為生命之源相火之主治虛寒喘嗽溫肺化痰腰腳虛痛補腎心腹諸痛諸瘡腫毒調中和榮服之令人肥健過食脫眉熱極則生風也潤肌膚烏鬚髮固精氣強陰起陽佐補骨脂大補下焦而廣嗣育胡桃屬木骨脂屬火有木火相生之妙加以杜仲蜜丸名青蛾丸大補腎虛無嗣去皮養血潤燥連皮斂肺澀精男女交媾皆稟此命火而結火衰者精滑易泄所以不結夜間用酒連皮細嚼三枚能補陽固腎按肺家有痰相火易熾者勿服三一七棐子味苦平寒入肺胃二經苦寒能瀉濕熱為肺家之果除五痔去根殺諸蟲化水悉肺臟腑濕熱之病亦壯筋骨除咳嗽瀉肺熱棐子反緑豆能殺人炒食甘美但經火則熱多食引火入肺大腸受損三一八石榴皮味酸澀溫入肝脾腎三經性酸而澀有斷下之功止瀉痢下血煅末服崩帶脫肛漏精虛滑可用若兼他證及服之太早反有害也洗眼止淚煎服下蛔子味甘酸生津止渴過食傷肺損齒三一九柿味甘寒入肺脾二經甘能益血寒能除熱雖種類不一總之能清上焦火邪兼有益脾之功止渴療嗽潤肺消痰開胃有人三世死於反胃後得一方用柿餅同乾飯食之不用水而愈治腸風痔漏肺清則大腸亦清柿霜乃其精液生津化痰善清上焦心肺之熱故治勞嗽甚效並解咽喉口舌瘡痛忌蟹同食柿蒂止厄逆或單用或加丁香生薑亦從治之法但中寒者禁之三二枇杷葉味苦平入肺胃二經去毛宜淨治胃病薑汁塗炙治肺病蜜水塗炙性涼而善下氣氣下則火降痰消氣有餘便是火火則生痰治熱嗽嘔逆口渴火降痰順則咳嘔渴皆痊矣按性降火則肺清胃和而諸症自愈若胃寒嘔逆及風寒咳嗽者忌之三二一橄欖味酸澀甘入胃經味先酸而後甘肺胃之果也清咽喉止消渴厚腸胃除泄瀉清肺補脾消酒傷解鯸鮐毒即河豚魚也人誤食肝與子必迷悶惟橄欖煮汁服或用核研末急流水調服能解凡魚骨鯁喉亦如此治蓋其木作楫撥著其魚魚皆浮出物之相畏如此三二二梨味甘酸寒入心肝脾三經潤肺消痰降火除熱外可散風人知清熱不知散風之妙內可滌煩生用清六腑之熱熟食滋五臟之陰解渴止嗽潤咽喉乾燥卻心肺煩熱利二便療痰喘中風失音搗汁頻服以上皆客熱之患切片貼湯火傷但産婦及脾虛泄瀉者禁之以其過於冷利也與萊蔔收藏相間則不爛或削梨蒂插萊蔔上搗汁熬膏亦良加薑汁蜂蜜佳清痰止嗽三二三甘蔗味甘平入肺胃二經甘寒瀉火搗汁入藥能和中助脾止渴消痰除心胸煩熱大便燥結嘔噦反胃蔗汁薑汁和服天行時熱皆除熱生津潤燥之功按胃寒中滿者勿用忌用酒食三二四白砂糖一名石蜜煎甘蔗汁為之味甘氣寒入脾經補脾和中消痰治嗽緩肝潤肺多食損齒生蟲黑砂糖乃蘸汁之清者煉至紫黑色功與白砂糖同而潤燥和血消瘀化滯之功過之産婦用此沖湯和酒服之取其消瘀也多食損齒消肌三二五白果味甘苦入肺經熟食溫肺益氣色白屬金定痰哮斂喘嗽縮小便止帶濁生食降痰解酒消毒殺蟲花夜開人不得見陰毒之果食千枚者死用者勿得過多小兒更忌發驚動疳三二六荸薺一名烏芋味甘微寒入肝胃二經益氣安中開胃消食補脾肺除熱生津止消渴治黃疸脾濕療下血甘以益氣解噎膈能毀銅或單食或同胡桃食使銅即化可見為消堅之物故能開噎膈消宿食也然寒涼克削孕婦忌之三二七海松子味甘氣溫入肺胃二經溫能助陽而通經甘能補血而潤燥治骨節中風因風頭眩血足風滅肺燥咳嗽松子一兩胡桃二兩煉蜜丸服或研膏食後沸湯點服大便虛祕同柏子麻子仁等分溶白蠟和丸黃耆湯下散水氣潤五臟養肺溫胃烏須黑髮仙方餌食以能輕身而延年也菜部三二八生薑味辛熱入肺胃二經要熱去皮要冷留皮辛溫行陽分而祛寒治傷寒頭痛身疼畏寒無汗生能發表傷風鼻塞咳嗽辛散肺邪開胃下食祛痰止嘔腹脹瘧症悉除熱可溫中療痢疾熱痢留皮冷痢去皮以茶等分煎服救暴卒凡中風中暑中氣中惡中毒等症用薑汁和童便服以薑汗開痰童便降火也闢霧露山嵐瘴氣早行含之按陰虛火盛汗症血症心氣耗散火熱腹痛並切忌之薑皮辛涼和脾行水治浮腫脹滿以皮行皮五皮散用之三二九乾薑味辛熱入脾胃二經生用辛溫逐寒邪而發表炮則辛苦大熱乾薑水浸炙焦黃色除胃冷而守中辛則散炮之稍苦故止而不移非若附子走而不守去臟腑沉寒痼冷逐風濕冷痹陰寒諸毒使陽生陰長若陰盛隔陽火不歸元及陽虛不能攝血而為大吐大衄下血宜炒黃留性用之最為止血之要藥引以熟附甚者宜生用入腎而祛寒濕能回脈絶無陽仲景四逆白通薑附湯皆用之療寒嗽同五味寒痞反胃滑痢多用損陰孕婦忌之辛熱動血服乾薑必僭上用大棗輔之甘草緩之三三黑乾薑乾薑切片炒紅以器悶息為炭辛辣變為苦鹹專入血分辛熱之性雖無辛涼之性尚在凡血虛發熱産後大熱者宜之此非有餘之熱乃陰虛生內熱也忌用表藥涼藥黑薑引血藥補血去惡生新有陽生陰長之意且黑為水色血不妄行凡吐血痢血悉治之血寒者可多用血熱者不過三四分為嚮導而已煨薑生薑去皮濕紙包煨治胃寒泄瀉吞酸三三一蔥味辛平入肺胃二經忌刺蜜犬雞肉辛能發散出汗解肌疏通骨節以通上下陽氣用白不用青白冷而青熱治傷寒頭痛身疼時疾狂熱鼻塞聲重散肺寒邪除陰毒腹痛陰症厥逆用蔥白安臍上尉之通大小便療下血下痢蔥煮粥食以氣通則血活折傷出血火煨研封止痛無瘢乳癰風痹通乳安胎孕婦傷寒蔥白一物發汗而安胎加生薑亦佳合豆豉阿膠治胎動霍亂轉筋奔豚腳氣搗罨傷寒結胸專攻喉痹亦解諸毒按蔥味辛肺之藥也故解散之用居多但多食神昏發落虛氣上衝散走利之故歟三三二大蒜味辛溫有毒入脾腎二經忌蜜開胃健脾消穀化食闢瘟疫消癰腫搗爛麻油調敷化肉食用蒜醋則不悶治中暑不醒搗和地漿溫服鼻衄不止搗貼足心引熱下行關格不通搗納肛中能通幽門搗貼臍能達下焦消水腫利二便切片爍艾解一切癰疽惡瘡腫核凡癰疽大毒覓獨頭蒜切片貼毒上以陳艾揉軟安蒜上炙之痛則易之不須燒至泡起傷肉三壯易蒜以百壯為率來日又如是炙之初炙壞肉不痛到好肉方痛則毒外出初起即散已成者易愈否則內逼五臟而危矣驅寒氣寒痰療腸風同黃連丸噎氣同平胃散除蠱毒敷蛇蟲沙蝨溪毒甚良按性熱氣臭凡虛熱之人勿用即宜用者亦勿過用若久食動火傷肺損目耗血謹之三三三韭菜味辛氣溫微酸入肝經辛能散結溫能通行兼有微酸故入肝而主血凡血之凝滯者皆能行之是血中行氣藥也固精氣暖腰膝止遺濁除瀉痢進飲食皆溫中兼補之力也散一切瘀血治吐衄血病搗汁童便和服噎膈反胃凡瘀血停痰在胃脘致反胃刺痛宜韭汁桔梗入藥開提氣血有腎氣上攻致心痛者宜韭汁和五苓散為丸茴香湯下和臟腑除胃熱助腎補陽但多食昏神昏目慎之三三四韭子味辛甘而溫入肝腎命門三經補精血助相火暖腰膝治筋痿遺尿泄精溺血白帶白淫經曰足厥陰病則遺尿思想無窮入房太甚發為筋痿及為白淫韭子同龍骨桑螵蛸能治諸病以其入厥陰補肝腎命門命門者藏精之府也蒸暴炒研用三三五薤味辛氣溫入肺大腸二經調中助陽散血生肌泄大腸氣滯治泄痢後重此氣滯氣四逆散加薤以泄之但後重亦有氣虛血虛火熱風燥之不同肺氣喘急安胎利産葉似韭而中空根如蒜取白用忌牛肉其葉光滑露亦難佇故云薤露三三六萊蔔即蘿蔔味辛甘入脾肺經辛甘屬土生者升氣止消渴制面毒化豆腐積治肺熱咳嗽下痢止偏頭風痛搗萊蔔汁仰臥注鼻冬月以菜葉攤屋瓦上任霜雪打壓春收煎湯治痢最效熟者降氣寬中化痰散瘀消食利大小便肥健人溫中補不足但性下氣耗血多食則鬚髮早白服地黃何首烏者忌之生薑能制是其毒三三七萊蔔子味辛甘入肺脾二經辛入肺甘走脾長於利氣生能升研末調服善吐風痰散風寒寬胸膈炒熟能降定痰喘咳嗽調下痢後重止內痛皆利氣之功消宿食解腫毒研醋調服其性辛甚治痰猛烈虛弱人勿多用三三八白芥子味辛溫入肺經溫中開胃利氣疏痰痰在脅下及皮裡膜外者非此不能行治胸脅冷滯脹痛喘急咳嗽肺病反胃酒調服發汗解肌辛溫利肺治癰腫痛痰行則腫消氣行則痛止醋調末散癰腫按久嗽肺虛陰虛火亢者禁用煎湯不可過熟熟則力減莖葉動風有瘡瘍便血者忌用芥菜子豁痰利氣主治略同而功不及耳三三九甜瓜蒂味苦寒有小毒入胃經陽明經藥能吐上焦實邪如膈上之風熱痰涎宿食停飲頭目眩暈濕氣水腫頭痛懊憹癲癇喉痹黃疸痞硬脹滿以上諸症如系濕熱實邪一吐自愈按瓜蒂苦寒損胃傷血上部無實邪者勿投三四蕓薹即油菜味辛溫散血消腫搗敷乳癰丹毒其效如神多食發瘡子與葉同功治産難三四一馬齒莧味酸寒散血解毒瘡科尤善拔疔治痢搗汁合雞子白服丹毒惡瘡多年惡毒頻敷即瘥利腸滑胎忌與鱉同食三四二冬瓜味甘寒入脾經寒瀉熱甘益脾利二便消水腫任吃最效散熱毒癰腫切片敷之子補肝明目三四三西瓜味甘性寒入脾胃經熟者性溫瓜性寒曝之更寒油性熱煎之則冷物性之異也解夏中暑熱毒號天生白虎湯療喉痹利水除煩醋酒但多食傷脾助濕秋成瘧痢桃亦如是三四四絲瓜味甘冷入諸經涼血解毒除風化痰治腸風崩漏涼血諸瘡腦漏用近根藤三尺焙開酒調服妙解痘毒出不快者燒存性少入硃砂蜜水調服滑腸下乳但胃寒者不相宜三四五茄根散血消腫治凍瘡煮汁漬之取牙齒以馬尿浸三日曬炒為末點之即落茄子甘寒散血寬腸多食動風發病三四六胡荽味辛氣溫入肺胃二經內通心脾外行腠理闢一切不正之氣芳香散風寒發熱頭痛消穀食停滯辛走表溫行脾順二便去目翳用以塞鼻善發痘疹凡痘疹出之不快用胡荽一二兩切碎酒煎除頭面從項以下遍身噴之立出卻當避風又可噴衣服床帳懸挂房中辟邪去穢但辛香發散多食損神發痼疾氣虛人忌之反白朮丹皮子亦同功三四七苦菜味苦氣寒入心脾腎三經苦寒能退諸熱則陰自生故腸澼熱渴惡瘡五臟邪熱悉痊久服安心益氣輕身不老
