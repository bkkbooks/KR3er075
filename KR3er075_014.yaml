body:
  text: 卷十四婦科上經脈門一月經婦人之證與男子無異惟經孕胎産崩淋帶漏乳陰之不同耳故別著方論不得渾同經曰沖任督為奇經八脈之三者亦一源而三岐也衝脈自少腹夾臍兩旁而上諸脈朝會為血之海任脈當臍中而上行於腹前為陰脈之總任督脈起自少腹循背以行於後為陽脈之都綱夫經本陰血流行臟腑歸於衝脈是衝脈為月經之本也故經云太衝脈盛則月事以時下然衝脈之所以盛者又在胃經經曰飲食入胃遊移精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四部五經並行是可知血氣之盛衰本於水谷之盛衰而陽明胃經又為衝脈之本也故凡血病當用甘溫之藥以助陽氣而生陰血勿用苦寒以傷胃氣並不使六淫七情飲食起居以虧損心脾生化之源則得矣經血者陰也女體屬陰其氣應月故三旬而一至不失其常自無病而有子一有不調或前或後或枯或閉或數或痛或帶或崩等證生焉此際調治治法詳後必求其源庶為有益婦人經血與乳俱由脾胃所生穀氣入胃其清純津液之氣歸於心入於脈變赤而為血血有餘則注於衝任而為經水經水者陰水也陰必從陽故其色赤稟火之用也沖為血海任主胞胎陰陽合而成孕則其血皆移蔭於胎矣既産則胃中清純津液之氣歸於肺朝於脈流入乳房變白為乳是稟肺經之色也若無男哺則陽明之竅不通胃中津液仍歸入脈變赤而為月水矣二論經先期先期而至者多屬血熱有火此固一説然亦有血虛夾火而預動者則所重在虛有中氣脫陷及門戶不固而妄行者則所重在脾在腎不得盡言為火過用寒涼當察脈之虛實人之強弱證之過與不及則得矣清熱安榮湯新治血熱先期而行因於火也脈證俱實當歸七八分血熱者宜少用為引川芎八分麥冬一錢二分赤芍一錢二分生地二錢青蒿八分丹皮七分甘草六分地骨皮一錢水煎熱服若三四劑後不應服黃連黃柏黃芩俱炒等分為末蜜丸名三補丸適病而止不得過服若性躁多郁者加香附童便炒一錢陳皮去白八分若血虛加熟地五七錢丹參二錢奇效四物湯治肝經虛熱血沸騰而先期至者當歸一錢二分熟地二錢白芍錢半川芎一錢阿膠炒一錢五分黃芩一二錢艾葉八分若血來而熱加生地青蒿知柏歸地湯新治曾誤服辛熱暖宮之藥而血熱者其衝任有伏火也當歸生地黃柏炒知母酒浸木通各一錢川芎七分甘草五分赤芍一錢二分或兼服三補丸此涼劑不得過服適病而止丸方在前人多有之不可不知六味地黃丸治血虛生熱以至經不及期而先行者熟地八兩棗皮山藥各四兩茯苓丹皮各三兩澤瀉二兩蜜為丸空心白湯下以滋水可兼補血補血兼不得滋水也平補心脾湯新治心脾氣虛不能固攝經血以致先期者當歸三五錢若血熱者用錢半熟地五七錢白朮二三錢杜仲鹽炒二錢枸杞二錢白芍酒炒二錢甘草炙一錢五味子蜜炒八分續斷酒浸二三錢丹參二錢水煎服凡脈證無火而經先期者乃心脾之不足也此輩極多若作火治誤矣又有中氣下陷而然者宜四物合補中為妙保陰煎治脈滑多熱經來先期及一切陰虛內熱動血等證生地熟地各二錢山藥續斷黃芩黃柏各一錢五分甘草一錢水煎服血熱甚者加黃連如血滯作痛加當歸如氣滯作痛去熟地加陳皮香附之類如少年血氣盛者去山藥熟地要知此僅可以暫用但不可以假火作真火以虛火作實火也所謂經先者當以每月大概論所謂血熱者當以通身臟象論勿以素多不調而偶見早期者為先勿以脈證無火而單以經早者為熱三論經後期凡血寒血虛者俱後期然血何以寒非陰寒由外而入生冷由內而傷原由陽氣不足非春和之時以致津液不能充盈故不能如期而至也彼血虛者稟賦素弱飲食減少其脈必沉細弦澀其形必惡寒喜暖其血自沉黑澀少此際宜溫之養之以培根本而破血行血之藥毫不可用理陰煎治真陰不足由於陽虛故經遲也熟地五七錢或一二兩當歸五六錢甘草炙一二錢乾薑炒黃二三錢或加肉桂一二錢水煎溫服如命門火衰陰中無陽內外寒證昭然加附子一二錢大約寒則多滯如薑桂吳茱萸蓽撥之類可擇加用甚則加附子十全大補湯治氣血俱不足脾胃虛寒脈弱無神人參白朮茯苓甘草炙當歸川芎白芍酒炒熟地黃耆蜜炙肉桂或等分或隨證以為輕重薑棗引如火衰加附子如形瘦食少屬脾胃虛弱用四君子湯加陳皮當歸川芎如肥人痰滯用六君子湯加歸芎香附或用參苓白朮散加歸芎石菖蒲為末搗飯以荷葉煎水糊為丸中時米飲下四君子湯人參白朮茯苓甘草六君子湯即四君子湯加陳皮半夏加味參苓白朮散人參隨用白朮二兩茯苓兩半山藥一兩五錢陳皮一兩蓮肉二兩當歸二兩炙草一兩砂仁八錢石菖蒲五錢川芎七錢香附八物湯治性急躁怒氣逆血少而後期者人參或用山藥四五錢代之白朮二錢茯苓一錢五分香附童便炒一錢當歸二錢若血熱者用一錢甘草炙一錢白芍酒炒一錢熟地二三錢川芎一錢或加青皮五六分水煎服溫經湯治一切血寒後期者當歸二三錢川芎一錢炮薑五分白芍酒炒錢半水煎服凡陽氣不足血寒經遲者色不鮮紅或沉黑或澀少其脈其臟其形必見虛弱無火之證宜用溫養血氣之藥四論經亂常凡經行原有常期一或前或後悉從虛治若妄用克削及寒涼等劑再傷脾腎以伐生氣則惟有日甚矣加味四物湯新治肝脾血虛微滯微痛一切經亂之證當歸二錢白芍酒炒一錢三分川芎一錢熟地二三錢陳皮八分香附童便炒七八分丹參二錢丹皮八分水煎服如食少有痰加白朮錢半茯苓一錢如血寒加肉桂錢半如血熱加生地黃芩青蒿之類如肝不藏血加阿膠珠錢半即八珍湯十全大補湯之類皆可擇用祕元煎治脾土虛陷不能統攝榮血而為漏為數等證遠志八分山藥炒二錢芡實炒棗仁炒各二錢白朮一錢五分金櫻子去核二錢茯苓一錢五分炙甘草一錢人參更妙五味子十四粒水煎服如血熱加苦參氣虛加黃耆或用四君子湯加川芎或用歸脾湯亦可若陰虧火盛或夜熱盜汗煩渴咳痰等證是即勞損之漸宜速補腎水以濟火若徒知用四物以補血亦屬無益之後著也道遙飲治所念不遂沉思積鬱心脾氣結漸成枯閉者當歸二錢白芍一錢五分熟地三五錢棗仁炒錢半茯苓錢半陳皮八分志肉五七分甘草炙一錢水煎服補陰益腎湯新治房勞傷腎衝任不固以致經亂者熟地三五錢山藥二錢菟絲子炒研三錢棗皮一錢五分五味子十五粒杜仲鹽炒一錢五分金櫻子去核二錢續斷當歸各二錢枸杞錢半水煎溫服如血不時來加百草霜發灰調服此方若作丸服更妙但須節欲乃得全愈經血無故不止用蓮蓬殼燒灰存性為末水調二錢服五論經期腹痛經行腹痛證有虛實實者有因寒滯熱滯有因血滯氣滯虛者有因氣虛有因血虛然實者痛於未行之前經通而痛自減虛者痛於既行之後血去而痛益甚大都可按者為虛拒按者為實或實中有虛虛中有實此非言所能悉當於形氣脈息兼而辨之可也調經飲治經血阻滯氣逆不調多痛而實者當歸三錢淮牛膝二錢香附酒炒一錢元胡炒一錢山楂錢半茯苓錢半陳皮去白一錢水煎加酒服如傷生冷而寒滯者加肉桂吳茱萸之類如兼脹悶者加厚朴或砂仁亦可如氣滯加烏藥如痛在小腹者加小茴導滯湯新治血因氣滯而停瘀積作痛拒按屬實者香附酒炒二錢元胡炒錢五分歸尾二三錢木香四分澤瀉錢半紅花炒黃一錢淮牛膝酒炒桃仁去皮各錢五分蘇木一二錢水煎加酒服如血通瘀下停藥勿得過服如火盛內熱血燥切痛者加炒梔子二錢如微熱者加白芍錢半如瘀極而大便燥結者加大黃二三錢不應加芒硝蓬朮如寒凝作痛加肉桂一二錢或吳茱萸一錢以上諸證必實見其有滯無虛方可用之若或兼虛勿行克伐以傷脾腎決津煎治虛弱經滯作痛此用補為瀉若江河一決積垢皆去之妙劑也當歸三五錢牛膝二錢肉桂二三錢烏藥一錢澤瀉一錢五分香附一錢五分水煎服如血滯加酒炒紅花一錢如小腹寒而痛極者加吳茱萸如大便澀結加肉蓯蓉威參潤之大榮煎治痛在經後多由血虛宜察其寒熱以為佐使當歸三五錢熟地三五七錢枸杞二錢杜仲二錢甘草炙錢半牛膝肉桂各錢半水煎溫服如氣滯加香附氣虛加白朮如中氣虛寒而嘔惡者加炒乾薑如寒滯在經氣血不能流通而痛加附子如兼帶濁腹痛者加骨脂即四物八珍加減因人因證善用之自無不效又須知有瘀積用上決津煎間服乃妙不得泥於偏補一途也六論經水多少經有定期而其多少亦素有定規平日少而忽然多者不問肥瘦皆以熱論平日多而忽然少者非病後體虛即外因阻滯也亦有痰礙經隧者必其體肥而脾土或者虧敗不能燥痰也凡此之類宜察形氣脈息以調養之庶多者不致沸騰少者不致枯閉也清熱四物湯新治經水忽然多者定屬血熱脈洪大而實宜清熱也當歸生地白芍各錢半熟地二錢黃芩知母各一錢川芎黃柏各七分水煎熱服不應加黃連一錢適病即止補虛四物湯新治瘦人經水漸少屬血虛也脈弱無神宜大補氣血當歸三五錢川芎八分熟地五七錢白芍酒炒一錢五分山藥二錢枸杞二三錢黃耆蜜炒二錢杜仲鹽炒錢半肉桂一錢水煎溫服或用十全大補湯人參養榮湯大宜多服以體旺血足為期芎歸二陳湯治肥人經水少者痰礙經隧也脈息遲滑當歸茯苓半夏各錢半陳皮川芎香附童便炒各一錢甘草炙八分枳殼一錢滑石五分薑引煎服七論血色凡血之色濃而多者血之盛也淡而少者血之衰也此固易知者也至於紫與黑辨之不真有如冰炭紫而紅者或成片成條是皆新血妄行多由內熱而然若紫而黑者或散或薄或沉暗色敗等象多以真氣內損必屬虛寒由此而甚或如屋漏水或如腐敗之宿血是皆紫黑之變象也此肝脾大損陽氣大陷之證如理陰煎理中湯補中湯之類可用若作熱治無不斃矣凡腸澼便血皆然學者最不可忽理陰煎方載上經後期治脾腎虛寒血色紫黑脈或大而無力及大吐大下或外假熱等證理中湯人參白朮乾薑炒甘草炙補中益氣湯人參隨用黃耆蜜炒二錢白朮當歸各一錢五分陳皮甘草炙各一錢升麻鹽水炒三分柴胡酒炒三分薑棗引香蓮四物湯新治血熱色紫而濃脈洪實者香附童便炒黃連當歸川芎白芍生地甘草丹皮赤芍等分水煎熱服加味八珍湯治血虛色淡而少脈微細者人參無者用山藥炒黃三錢代之白朮茯苓當歸熟地黃耆蜜炙各一錢五分川芎七分甘草炙八分白芍酒炒肉桂各一錢薑棗引須常服七味八味地黃丸八論經不行凡婦女經血不行其證不一有血枯者其人脾胃傷損飲食減少無以生血源竭而流絶也法當補脾胃養氣血氣充血生經自行矣若妄用紅花桃仁通經毒藥豈知滯者可通枯者亦可通乎有氣鬱者其人心思未遂憂愁怨恨以致氣結而血滯法當調氣則血自行苟用補劑則氣益結血益凝致成癥瘕脹滿之疾須宜知之有軀肥脾虧痰涎壅滯而經滯者法當行氣導痰斯謂良工有寒傷者風雨霜雪傷於外飲食生冷傷於內致血不行經曰血得熱則行得寒則凝醫者不知外寒者散之內寒者溫之反有謂室女血熱用青蒿之類涼之卒不得而行矣溫胃散新治脾胃虛寒不愛飲食縱食少許亦不消化且作脹滿以致不能生血而經閉者凡男婦大小皆可服能健脾也白朮一兩五錢茯苓一兩二錢陳皮四錢吳茱萸開水泡一次焙乾用五錢砂仁微炒五錢扁豆炒一兩粳米五錢微火炒黃冷水淬再炒草豆蔻仁五錢飯包煨共研細末荷葉煎水每日中時調服二三錢即睡一刻如肚硬有積加谷蟲三錢如嘔逆加炒乾薑四錢如有宿食加神麯炒四錢加味參苓白朮散方載上經後期此平補脾胃多服以經行為度或用十全大補湯須兼服烏雞丸澤蘭湯治經淡漸少卒至不通潮熱身痛其脈微數此陰虛少水不能制火宜養血益陰不得以毒藥通之澤蘭葉二錢當歸錢半白芍酒炒一錢甘草炙五分水煎服柏子仁丸柏子仁炒去油牛膝酒炒卷柏各一兩澤蘭葉續斷各三兩熟地五兩先以熟地搗化加藥末煉蜜為丸烏雞丸統治婦人脾胃虛弱衝任傷損氣血不足以致經候不調少有子息服之屢驗白毛烏骨雄雞雞舌黑則骨黑一隻要未鐓者以粳米餵養七日勿餘食蟲蟻野物吊死去毛並雜細以一斤為率用生地熟地天冬麥冬各二兩於雞肚中甜美米酒十碗入砂鍋煮爛取出去骨炭火焙乾更以余酒淹盡待焦枯研羅為末再加社仲鹽水炒二兩人參少者以山藥或以時出條參二兩代之肉蓯蓉酒炒補骨脂炒炙甘草小茴炒各一兩白朮丹參當歸去尾茯苓各三兩川芎八錢砂仁炒一兩香附酒浸三日焙乾一兩二錢和雞肉共研末酒調麵糊為丸空心酒下七八十丸或米飲下開鬱二陳湯治心思不遂氣鬱血滯而經不行陳皮茯苓蒼朮川芎香附童便炒各一錢半夏一錢青皮甘草木香各五分薑引如體厚脈實服此不應或服香附丸四制香附丸治氣結經閉脈實體旺者可用否則禁之以性辛燥也淨香附片一斤用酒醋童便鹽水各浸四兩三日後焙研山藥八兩研末開水泡糊為丸白湯下增減八物柴胡湯治經閉脈虛骨蒸潮熱者人參茯苓白芍麥冬各一錢當歸生地各一錢五分炙草知母柴胡各六分水煎服有汗加地骨皮錢半無汗加丹皮錢半淡竹葉十五片凡婦人血虛有熱者皆可服如服此而熱反甚者加黑乾薑一錢神效四物涼膈散治經閉脈實發熱咽燥者歸身赤芍川芎生地黃芩酒炒黃連酒炒桔梗連翹山梔炒黑各一錢生草薄荷葉各五分淡竹葉十片凡血實形盛脈有力者皆可服之但須適病而止不可過服脈候尺脈滑血氣實經脈不利尺脈來而斷續者月水不利寸關如故尺脈絶而不至者月水不利當患小腹痛肝脈沉月水不利主腰腹痛經曰二陽之病發心脾有不得隱曲故女子不月其傳為風消為息賁者死不治二陽者足陽明胃也女子有不得隱曲之事郁之於心故心不能生血血不能養脾始焉胃有所受脾不能運化繼則不能納受故胃病發於心脾也由是水穀衰少不能化精微之氣而血脈遂枯月事不能時下矣陽明主肌肉血不足則肌肉不榮有不風熱而消瘦乎息賁者風熱傳於肺喘息而上賁也此脾胃虛而經脈不行也有因勞心過度心火上行不得下通胞脈而不行者有因中消胃熱善飢漸瘦津液不上血海枯竭而不來者有因冷客胞門血寒凝泣而不下者有因軀肥脂滿痰多占住血海地位閉塞而不行者有因或挾寒或挾熱汙血凝滯而不行者有因食與濕痰填塞太陰經閉作痛者寒熱虛實之不同者總不能遁乎脈之遲數有力無力間也經行腹痛寒熱交作下如黑豆汁兩尺沉澀余皆弦急此由下焦寒熱之邪搏於衝任痛極則熱熱則流通因寒濕生濁故下如豆汁也宜以辛散苦溫之藥治之氣行則血行氣止則血止故治血病以行氣為先如香附此味亦須善用以性燥也之類是也熱則流通寒則凝結故治血病以熱藥為佐如肉桂之類是也至於病後産後經血不行者純屬氣血兩虛惟宜補脾養血元氣充復自然流通此不治之治也女子十四歲時經已下矣或四季一行或一二年一行此為避年因稟受衰弱耳但宜順氣養血切勿攻之有年長未配之女孀居之婦庵脘之尼思結而不得伸多有經閉之病致成勞瘵或用四制香附丸參朮大補丸間服六味以枚水滋水可兼補血補血兼不得滋水本末交治庶幾可瘳此七情之變輕者可治重者恐難治也且芎歸辛竄難到腎家又須恃一點命門之火為之主宰以陽和庶能生物也備揀古來治無病而經陰者多由氣血之凝滯而然亦有方法治之用當歸沒藥去油紅花等分為末酒調服又方用絲瓜焙研為末酒調服又方用蠶砂炒煮酒服一盞即通又方用茜草亦名過山龍一兩酒煎服之一日即通凡婦人經停二三月不行者或結胎或經閉不可孟浪必用試法方有的見探胎飲用川芎不見火為末空心煎艾湯調下二三錢覺腹中動則有胎也臍下動者乃血瘕也不動者血凝也病也九論崩經曰陰虛陽搏謂之崩以血虛則熱迫而妄行故令暴下而為崩崩久血少遂成漏不時而下卻無止期屬腎水枯也治此者有三法初止血次清熱須知止血兼之清熱後補其虛重在補氣補氣乃能生血庶能收效所以古用獨參湯補氣後用四君子湯收功補土以保肺氣職是故耳安榮湯新治血有熱崩漏日久六脈虛弱體虧無神等證當歸去尾三五錢熟地五三錢丹參二錢淮藥三錢白芍酒炒一錢五分丹皮一錢二分阿膠蛤粉炒二錢川續斷二錢甘草炙一錢煎就加發灰百草霜敗棕灰蒲黃炒黑俱存性等分再研用一錢調服如實火盛迫血妄行口渴舌黃便燥血熱六脈洪滑加黃柏黃芩梔仁之類或加生地赤芍青蒿各二三錢不應加黃連但要見真方用恐實熱者少假熱者多若誤用寒涼必傷脾胃生氣自日殆矣挽回莫及可不慎哉增捐四物湯治脾虛不能攝血以致崩漏不止者人參少者以山藥炒黃四錢六錢代之或用時下生條參三五錢當歸三錢川芎一錢白芍炒一錢五分乾薑炒一錢甘草炙一錢水煎服加茜草三錢更妙當歸補血湯治凡血大吐大下等證用此補氣以生血黃耆蜜炙一兩當歸去尾三錢水煎溫服稍可以代獨參湯奇效四物湯治肝經虛熱崩血不止熟地五七錢當歸去尾三五錢白芍酒炒二錢川芎一錢阿膠蛤粉炒二錢艾葉炒一錢二分黃芩二三錢炒黑水煎服如血熱當歸止用錢半或加生地二錢及上安榮湯四灰之引備揀古來治血崩神方以便取用風熱血崩用荊芥穗炒微黑為末每服一二錢童便調服又方以陳槐花一兩百草霜五錢為末每服二錢燒紅稱錘淬酒調服又方敗棕燒灰存性為末水調服血熱用童便又方條黃芩為末酒調服三四錢或加乾薑白芷又方用黃芩木耳為丸服治熱血下虛血崩白芷一兩海螵蛸二枚略燒亂髮煅灰三錢酒調二錢服血崩赤帶用赤芍香附等分為末每服二錢加鹽少許日三服十日愈名如神散又方香附炒黑煎服又方用艾葉乾薑炒黑阿膠等分煎服又方蓮房荊芥炒黑研末服又方棉花子炒黑研末酒調三錢服又方木賊五錢水煎服立齋曰前證治法因脾胃虧損不能攝血歸源者用六君子加芎歸柴胡若因肝經之火血熱下行用四物加柴梔苓術若肝經風熱而血妄行及怒動肝火者用加味道遙散方見下若脾經鬱結而血不歸經用歸脾加柴梔丹皮若悲傷胞絡而血下崩用四君子加柴梔升麻逍遙散當歸二錢甘草一錢白芍白朮茯神各一錢五分柴胡酒炒八分薑引加丹皮梔子各七分十論崩血心痛凡婦人大崩及生産後去血過多心無所養宜用甘溫以補榮氣如十全大補湯之類又有氣滯血逆而痛者宜行之散之亦有陰血耗散而痛者宜收斂之須當憑氣象脈息以治之溫補榮氣湯新治心脾血虛脈息細數體虧氣弱心痛潮熱等證當歸三五錢若血虛有熱者宜少用熟地五七錢甘草炙錢五分白芍酒炒一錢五分枸杞二錢山藥二錢棗仁炒一錢溫服如心虛有火不可按者加丹皮錢半或加生地一二錢如血寒凝滯加肉桂錢半如氣脹而滯者加陳皮香附之類如氣虛而不能生血者加蜜炒黃耆錢半或加人參更妙如血散而不收斂者加五味二三分或用十全大補湯亦妙方見上經後期有謂痛無補法不知虛實也失笑散治氣滯血逆心氣刺痛用此行之散之非治血虛也五靈脂有溏心者真蒲黃等分俱炒先用醋熬成膏再入水煎熱服或為末用酒煎服按此方用以止痛蒲黃宜減半若用以止血則宜等分蒲黃炒黑或五靈脂減半亦可十一論漏或崩久成漏者或未崩而亦漏者連年不休此中氣下陷元氣不固也宜補衛氣兼固下元若作血熱妄行治是大誤也加味補中益氣湯新治元氣虛損不時漏血歷年不止者人參淮山藥炒黃三五錢代之亦可黃耆蜜炒二錢白朮當歸熟地各一錢五分白芍酒炒陳皮各一錢甘草炙八分升麻蜜炒柴胡酒炒各三分薑棗引中時夜間服早服下丸固下丸新治血道虛滑不時下漏須兼服此丸當歸二兩鹿角霜四兩茯神龍骨煅阿膠蛤粉炒各一兩五錢川芎七錢杜仲鹽水炒二兩香附醋炒八錢甘草炙一兩補骨脂鹽水炒六錢共研末山藥五兩研末開水泡糊為丸每早酒下七八錢脈訣曰崩漏下血脈遲小虛滑者生疾急實大緊數者死尺寸虛者漏血脈浮者死不治十二論熱入血室凡婦人傷寒或勞郁或暴怒適遇經行以致邪熱入於血室或血不行或血不止令人晝則明淨夜則譫語狂妄者何也蓋沖為血海即是血室血屬陰主夜故晝則平安暮入陰分邪與血搏挾陰氣而如見鬼狀此為熱入血室治法亦惟和表邪兼清血室之熱足矣若誤以為客邪入內攻之則伐及無辜導邪入內矣故經曰治之無犯胃氣及上二焦必自愈矣靜鎮湯新治經行時因冒風寒以致熱入血室而夜不寧者白芍黃芩生地陳皮柴胡各一錢甘草防風桂枝紫蘇各八分當歸錢半熱服三四劑如內熱加連翹如口渴加葛根如熱甚加石膏知母如寒甚加生薑清化飲治或勞或怒火由內生夜躁多汗而無表證者白芍麥冬石斛各二錢丹皮茯苓黃芩生地各三錢水煎溫服如骨蒸加地骨皮如熱甚而渴加石膏如下熱尿赤加木通黃柏梔子之屬補陰益氣煎治病愈而元氣素弱熱不退血不止者人參少者或以黃耆蜜炒三錢代之當歸二錢山藥二三錢熟地五七錢甘草炙陳皮各一錢升麻四分火浮於上者不用柴胡一錢五分如無外邪者不用生薑引即用補中益氣湯亦妙如脾氣素弱宜歸脾湯如氣血俱虛宜十全大補湯如血熱多滯者宜小柴胡湯加丹皮紅花當歸棗麥甘草湯治婦人臟燥悲哭如祟大棗十二枚去核小麥炒二合甘草三錢水煎多服此方最妙十三論赤帶白帶白濁白淫四病不同治亦有異當分寒熱以脈息形氣辨之庶認證真而取效捷矣赤帶者屬熱兼虛兼火治之以婦人多憂思鬱怒肝火甚而血不歸經所以病此法宜補血涼血以養肝舒肝也白帶者出於胞宮精之餘也多由脾腎虛寒而滑亦以所思不遂肝氣鬱則木侮土而脾受傷故濕土之氣下陷不能輸為榮血而下白滑之物清冷稠黏法當開提肝氣補助脾元若有穢氣者須兼濕而有熱治之白濁者隨小便而出渾濁如泔此胃中濁氣滲於膀胱水之濁也法當補脾躁濕加以升提為主白淫者在小便之後而來亦不多此男精不攝滑而自出不須治也芩連四物湯治赤帶脈洪數而實者當歸白芍生地各錢半川芎八分黃芩二錢黃連一錢升麻五七分丹皮錢半水煎加童便服三補丸治赤帶服上方不應服此以治血熱之甚者黃連黃芩黃柏俱炒等分共為末空心白湯下適病即止清白散治白帶之兼有濕熱多火者當歸川芎白芍生地黃柏鹽水炒樗根皮各錢半乾薑炒黑甘草各七分生薑引如肥白人多濕痰加白朮半夏如赤帶加酒炒黃芩荊芥如久下加熟地牡蠣如氣虛加蜜炒黃耆如腰腿痠痛加鹿角膠如氣下陷而多濕者加升麻柴胡蒼朮白朮樗皮丸治赤白帶有濕熱者白芍一兩良薑六錢黃柏一兩二味燒灰存性樗根皮二兩五錢共為末粥糊丸空心米飲下加味六君子湯治白帶屬濕痰而兼虛者人參少者以山藥炒黃三錢代之白朮二錢茯苓一錢五分炙草陳皮各一錢半夏錢半蒼朮錢二分升麻鹽水炒柴胡酒炒各四五分薑引兼服下方丸藥蒼沙導痰丸治濕痰白帶蒼朮米泔浸二兩香附童便炒一兩陳皮茯苓各兩半枳殼半夏南星炙草各一兩生薑自然汁糊為丸淡薑湯下加減十全大補湯治虛弱之人帶久不止人參少者以山藥炒黃四錢代之白朮二錢茯苓一錢五分當歸一錢八分炙草一錢川芎一錢白芍酒炒一錢二分陳皮一錢半夏一錢五分乾薑炒八分薑棗引或服參苓白朮散加砂仁石菖蒲方見上經後期以補脾胃之虛兼服補宮丸以固下元之脫補宮丸治虛弱者下元滑脫鹿角霜茯苓白朮白芷山藥白芍酒炒龍骨煅赤石脂牡蠣煅童便炒各等分乾薑炒減半醋糊丸米飲下白芍藥散治赤白帶下腹痛如神白芍炒二兩乾薑炒五錢共為細末每服三錢米湯調下晚又進一服十日見效固陰煎治肝腎陰虛滑泄帶濁淋遺及陰水因虛不固等證人參隨宜熟地三五錢山藥炒二錢棗皮一錢五分遠志七分炙草錢半五味十四粒菟絲子炒研二三錢溫服如滑遺甚者加金櫻子肉二三錢或醋炒文蛤一錢或烏梅二個如血熱不固者加續斷二錢如肝腎血虛不歸經者加當歸二三錢如氣陷不固者加炒升麻一錢如心虛不眠或多汗者加棗仁二錢炒研治帶單方白帶神方用青色無沙眼之牡蠣火煅紅冷定又煅七次研細用腐漿調下二錢一二服立愈又方用艾葉煮雞子食又方沙參研末酒調服又方白朮四兩補骨脂二兩共炒研末入麥面炒一斤空心加白糖開水調服赤白帶下石菖蒲補骨脂俱炒等分研末開水調服白帶下部痛苦楝炒大茴香當歸等分酒和丸酒下又方石灰一兩白茯苓二兩為末水丸白水下三十丸神效虛寒白濁鹿角霜炒為末每服二錢酒調下十四論五色帶下凡婦人此證當壯脾胃升陽氣為主佐以各經見證之藥色青者屬肝用小柴胡加山梔或濕熱壅滯小便赤澀用龍膽瀉肝湯色赤者屬心用小柴胡加山梔黃連當歸思慮過傷用妙香散等藥色白者屬肺補中益氣湯加山梔色黃者屬膽用六君子加山梔柴胡不應用歸脾湯色黑者屬腎用六味地黃丸氣血俱虛八珍湯陽氣下陷補中益氣若有濕痰加半夏蒼朮茯苓黃柏不可拘肥人多痰瘦人多火而以燥濕瀉火之藥輕治之也小柴胡湯柴胡一二錢半夏二錢黃芩二錢人參一錢甘草七分生薑一錢大棗三枚辰砂妙香散黃耆蜜炒山藥薑汁炒茯苓各一兩木香二錢茯神遠志各一兩人參炙草桔梗各五錢砂仁三錢另研共為末每服二錢酒調下或用麥麵湯下龍膽瀉肝湯膽草酒炒一錢柴胡木通當歸各錢五分山梔一錢二分車前澤瀉黃芩生地各錢五分甘草八分補中益氣湯方見上第七內八珍湯人參白朮茯苓當歸熟地各錢五分川芎白芍酒炒甘草炙各一錢十五論癥瘕癥者成形而堅硬不移者也因血動之時或內傷生命或外受風寒或暴怒傷肝氣逆而血留或憂思傷脾氣虛而血滯或積勞積弱氣虛而不行余血未淨則留滯而漸成癥然血必由氣氣行則血行故治血病則或攻或補皆當以調氣為先蓋養正則邪自除若調養久而血足再不消散方可議下但須除之以漸不可峻攻方無顛覆之患瘕者無形而可聚可散者也氣滯則聚氣行則散治宜或調或補當分虛實詳脈察證庶無遺誤然又有痛與不痛之異痛者聯於血氣有所凝滯氣血行則愈故痛者易治不痛者不通氣血另結窠囊藥餌難及故不痛者難治總之非在氣分則在血分知斯二者則癥瘕二字已盡之矣若內經止有積聚疝瘕之名癥字為後世增設又有痃癖痞塊之屬亦不過以形見之處不同故名亦因之而異耳但血癥氣瘕各有虛實宜細辨之諸經義另詳積聚門所當參閲以下治血癥化瘀湯新治血瘀成形在臍腹之下作痛喜按而虛者當歸三五錢熟地二三錢白芍酒炒二錢川芎一錢肉桂二錢桃仁一錢去皮紅花酒炒八分水煎加酒服如氣滯加香附木香砂仁烏藥之屬血化而痛自愈或決津煎方見上第五內亦可加漆滓炒令煙盡二錢血化為水神效元胡索散治血積小腹疼痛或因氣逆月經不行肚腹作痛者當歸赤芍劉寄奴沒藥枳殼麩炒元胡索炒各等分共為末酒調服即失笑散亦可方見上第十內良方加味四物湯治血積堅硬而痛或不痛者當歸川芎白芍熟地蓬朮三稜乾漆炒令煙盡肉桂各錢半水煎服或加淮牛膝二錢更效良方桃仁承氣湯治形氣強壯而瘀血不行或大便閉結或腹脹痛甚有非下不可者然須詳慎非實證勿用桃仁去皮尖五錢大黃一兩炒或酒炒甘草二錢肉桂一錢薑引凡養正之法宜診脈察證知何經之虛專固根本或虛中帶滯者可少加行氣導滯之品可也如再攻之禍如反掌逍遙飲治婦人思郁過度致傷心脾經脈不調留成血積當歸二三錢白芍一錢五分熟地三五錢棗仁炒研二錢茯神一錢五分遠志五分陳皮八分甘草炙一錢如經行而滯痛者加酒炒香附錢半如氣虛者加人參其肝腎脾胃有一經之虛寒者有兼二經之虛寒者宜因人調補待元氣足自漸磨漸愈乃為良策以下治瘕證附氣痛在內瘕屬氣流行無定左右大小忽聚忽散或近脅肋而如臂如指則謂之痃癖或下臍腹而為脹為急則謂之疝瘕難經曰病有積聚積者陰氣也陰沉而伏聚者陽氣也陽浮而動癥由於積積在陰分而有淵藪故攻之非易瘕由於聚聚在陽分而猶烏合故散之非難若氣因形滯者去其積則氣亦順止在氣分無形者總不可下即下亦不去適足以敗正氣也宜切識之散氣之法止在行氣而行氣之法大有權宜如氣實則壅滯宜破而行之氣閉則留蓄宜利而行之氣熱則乾涸宜涼而行之氣寒則凝結宜溫而行之然病此者必正氣虛而後邪氣得以乘之而不散使果氣強力健則流行不息又何瘕聚之有故治此者又宜知所以補也但實者有據顯而易見虛每似實隱而難知此際須當辨真排壅湯新治邪氣壅滯刺痛之甚者此破以行之烏藥二錢藿香香附枳殼陳皮去白各一錢五分檳榔木香各七分厚朴一錢熱服如氣逆之甚者加白芥子沉香青皮之類如痛在小腹加小茴如兼疝者加荔枝核煨熟搗碎二三錢廓清飲治三焦氣閉胸膈脹痛或肚腹單脹小水不利等證此利以行之枳殼二錢厚朴錢半大腹皮洗淨一二錢蘿蔔子生搗一錢茯苓連皮二三錢澤瀉一二錢陳皮去白一錢白芥子五七分或多用水煎溫服如大便閉結加生大黃三四錢如肝滯脅痛加青皮如氣滯脹痛加烏藥香附清涼散新治一切氣逆暴痛口渴便燥喜涼惡熱不可按者此涼以行之黃芩梔子黃連陳皮牛膝澤瀉各錢五分溫服如口渴加生石膏如大便燥結加生大黃三錢如煩躁加淡竹葉麥冬如熱在腸胃不得下者加芒硝以通之以上諸方惟氣實瘕聚者可以暫用若元氣不足者總之溫中湯新治氣寒凝結脹痛喜按脈息弦緊者此溫以行之陳皮砂仁藿香草豆蔻煨各一錢香附肉桂乾薑各錢五分水煎如假熱拒膈者冰冷服如小腹寒痛加吳茱萸五七分如寒甚而栗者加附子一二錢如嘔逆者加生薑半夏或理中湯加附子亦妙凡常人之於氣滯者惟知破之散之而云補以行之必不然也經曰邪之所湊其氣必虛虛而不補治與病違而欲以藥濟人蓋亦罕矣如心脾氣虛不行宜五味異功散如脾胃氣虛而滯宜六君子湯歸脾湯如脾胃虛寒而滯者宜溫胃飲理中湯如脾腎虛寒而氣不行脹滿腹痛者宜理陰煎如元氣下陷滯而不升者宜補中益氣湯如元氣大虛氣化不行而痛者宜十全大補湯以上皆補以行氣之法亦不過為之筌蹄耳而此中之用惟在人之圓活耳五味異功散人參白朮茯苓甘草陳皮六君子湯即前方加半夏歸脾湯人參一錢蜜耆白朮當歸各一錢五分甘草一錢棗仁一錢遠志五七分茯神一錢三分廣木香三分元肉三枚白蓮五粒去心微炒研溫服溫胃飲人參白朮二三錢扁豆二錢陳皮一錢甘草炙一錢乾薑炒焦一二錢當歸二錢如下寒帶濁者加補骨脂一錢如氣滯者加藿香丁香木香白豆蔻砂仁白芥子之類如痰甚加茯苓二三錢如脾胃虛極大嘔大吐者加生薑或胡椒二分徐徐服之理中湯方見上第七內補中益氣湯方見上第七內理陰煎方見上第七內十全大補湯方見上第二內脈經曰婦人疝瘕積聚脈弦急者生虛弱者死少陰脈浮而緊緊則疝瘕腹中痛半産而墮傷浮則亡血惡寒絶産尺脈澀而浮牢為血實氣虛其發腹痛逆氣上行此為胞中有惡血久則結成血瘕也子和云遺溺陰痿精滑白淫皆男子之疝也若血涸月事不行行後小腹有塊或時動移前陰突出後陰痔核皆女子之疝也但女子不謂之疝而謂之瘕備揀古來治癥瘕至簡至穩神方於後以便取用胸脅刺痛用五靈脂有溏心者真元胡索草蔻仁飯包加濕紙裹之煨沒藥去油各三錢共研細末酒調二錢服立止治諸逆氣痛用沉香烏藥枳實檳榔木香共磨酒服治一切冷氣痛喜熱喜按者是發即昏死用莪朮一兩醋煮廣木香五錢煨為末淡醋湯下一錢此可斷根心氣痛甚用胡桃肉一個大棗一枚去核夾桃內煨熟以淡薑湯細嚼送下永不再發男女氣痛用威靈仙能去心腹冷滯韭菜或用根雞子煮酒服冷氣胸痛用艾搗汁服又方用附子煮汁入沉香末服又方用火酒磨廣木香服以下治血癥血癥痛用蒲黃五錢五靈脂一兩俱炒酒煎服或為末酒調服治癥瘕不散三稜白朮各二兩蓬朮當歸各五錢木香檳榔各三錢共為末每服三錢沸湯調下治血癥如干漆研炒令煙盡牛膝桃仁紅花酒炒元胡肉桂當歸尾生蒲黃三七之類可以擇用癥之堅者如三稜莪朮枳實檳榔薑黃劉寄奴之屬可以擇用如胃腕痛劇諸藥不效者用牙皂燒存性以煙將盡為度研末以燒酒調服錢許即效嗣育門十六子嗣以下七條俱求子良法天地之大德曰生生育之氣流行遍滿何世之人亦有之嗣者其所繫非小豫切念之故以心之所得歷試有驗者詳細言之願少嗣者閲之留神於中自有螽斯之慶也其一曰調經凡婦人之無子者由經之不調也或先或後或閉或枯其病不一詳上月經條內須按證用藥俾得應期而來如期而止者有子之道也易曰坤道其順乎承天而生物承天而不能生物者由地道之有偏頗也能用人功可以挽回造化只在調經而已其二曰蓄種種之不蓄而不得歸罪於婦人之無子也何以言之腎中之陰虛則精不足腎中之陽虛則陽易痿幾見谷內無米可以生苗瓜子無殼可以發芽乎而究之種之所以不蓄者動人情欲耗人真元雖欲種之久蓄其可得乎嗣後少嗣者當遠房室以獨眠以待種之蓄而老也則得矣若夫婦人之經脈既調男子之真精亦足而猶無子嗣者何故皆由於自誤之也秦問曰寡欲者多子此言有精義焉宜體認之蓋人已經及時交合猶葉上一滴露水未曾融結無何少頃搖之連日又搖之其有不墮落者幾何矣又譬之下種子於土未曾生根今日也挖明日又挖共有不掘出者未之有也耍知人之所以無子者或在即日墮焉或在半月一月之內墮焉試觀百物一合之後皆便成孕而人多不知也且不能也其愚也實甚是知人於一合之後以待來月經不行胎已結矣由是之後切勿縱欲不惟胎固而子亦強壯而無疾矣萬一經再行焉則種已老又可為下次之期望也至於生男生女之辨古人言之不一有以精血先後為拘者有以經盡幾日為拘者有以夜半前後交感為拘者有以男女強弱為拘者以豫觀之俱非確論只以交感之時百脈齊到者分勝負耳凡男之百脈齊到勝乎女則成男是乾道得矣女之百脈齊到勝乎男則成女是坤道得矣所謂百脈齊到者暢遂之極初無一毫勉強者是也彼夫邪淫苟合者無心種子偶意為之易成胎孕原以彼此快樂而絪縕之氣濃密也安居妙合者專心種玉而兢兢業業每見無功蓋心耗神馳而絪縕之氣反薄矣此所謂天地之道陰陽和而後萬物育夫婦之道陰陽和而後男女生和之一字生生之精義也欲得子者須於上文四條體認此外似無遺議十七論男女用藥天地收藏之後至陽春靡不發育此自然之理也所以少年生子多虛弱者欲甚而精薄也老年生子多強壯者欲少而精厚也富貴亦有乏嗣者以富多縱欲貴每勞心亦猶是也然腎經虛耗由心火妄動而相火翕然從之虛火上炎陰虛內熱勞瘵叢集燥熱甚焉而世之多欲而無子者不知腎虛只謂女之血冷男之精寒遂用一切燥熱之藥豈知水虧不能制火而真精益耗嗣育之音杳然矣是知欲種子者須清心收斂復補真陰則得矣但腎中有陰陽補得其宜則有益無損辨論治法已詳一卷培補條中所當參閲續補男女調補方藥於後以便擇用或問雙胎者何也人鏡經曰精氣盛則成二男血氣盛則成二女精血皆盛則成一男一女亦有三胎四胎猶是而已至於非男非女乃精血混雜得陽道陰道之虧則成異類非純氣也凡肥盛婦人稟受甚厚不能成胎謂之軀脂滿溢閉塞子宮宜燥濕痰如星半蒼朮臺芎香附陳皮或導痰湯之類所忌者熟地所愛者補脾土旺可以剋水也若是瘦怯性急之人經不調不能成胎謂之子宮乾澀無血不能攝精宜涼血降火如四物加黃芩養陰補血如六味地黃丸之類凡人氣血各有虛實寒熱之異惟察脈可知脈不宜太過而數數則為熱不宜不及而遲遲則為寒不宜太有力而實實者正氣虛而火邪乘之以實也宜散郁以伐其邪不宜太無力而虛虛則氣血虛宜調補氣血務使夫婦之脈和平有神不妄用藥乃能生子若微弱而澀皆無子也以下治男人方贊育丹治虛寒年邁陽痿精衰無子神方熟地八兩白朮六兩製法俱載本草當歸枸杞各五兩杜仲酒炒仙茅酒蒸一日巴戟肉甘草湯炒棗皮淫羊藿羊脂拌炒肉蓯蓉酒洗各四兩韭子炒黃三兩蛇床子微炒二兩肉桂附子或各二兩或各三兩上煉蜜丸或加鹿茸更妙還少丹無比山藥丸方俱載一卷培補門治臟氣平和而惟精血不足者培補保元丸方載二卷培補門治一切腎虧神倦夢遺精衰等證右歸丸治右腎火虧陽痿精冷右尺脈虛者熟地八兩山藥炒枸杞微炒鹿角膠蛤粉炒珠杜仲薑湯炒各四兩棗皮微炒三兩當歸三兩大便溏勿用肉桂二兩可漸加至四兩附子二兩可漸加至五六兩蜜丸淡鹽湯下百丸如精滑便溏加補骨脂酒炒三兩如飧泄腎泄加北五味三兩肉豆蔻二兩麵炒去油用如腹冷痛加吳茱萸二兩湯泡半日炒用如腰膝痠痛加胡桃肉連皮四兩如陽痿加巴戟肉四兩肉蓯蓉酒洗三兩或加黃狗外腎一二付酒煮爛搗入更妙左歸丸治陽盛陰虛精氣不足左尺脈遲弱者熟地八兩山藥枸杞棗皮菟絲子制鹿角膠炒珠各四兩牛膝酒蒸三兩精滑者不用龜膠炒珠三兩無火者不用煉蜜為丸淡鹽湯下百丸如真陰失守虛火上炎者宜用純陰之品本方去枸杞鹿膠加女貞子三兩麥冬三兩如火爍肺金乾枯多嗽者加百合三兩如夜熱骨蒸加地骨皮三兩如小水不清加茯苓三兩如腰膝痠痛加杜仲鹽水炒三兩如臟平無火而腎氣不充者加補骨脂三兩胡桃肉四兩龜膠不用陰陽兼培丸新治先天不足精虧陽痿後天不足食少體倦一切不足之證熟地八兩製法載本草棗皮淮藥茯苓各四兩鹿角膠六兩蛤粉炒成珠或酒蒸溶合煉蜜為丸附子三兩製法載本草杜仲淡鹽水炒三兩枸杞四兩酒蒸淮牛膝三兩酒蒸下焦虛滑者不用北五味兩半微炒當歸三兩酒蒸白芍二兩煨酒炒菟絲子淘淨泥沙酒蒸曬乾四兩或加肉桂三兩先將地黃棗皮枸杞當歸搗如膏後入藥末鹿膠量加煉蜜為丸早用淡鹽水送七八錢如陽痿加補骨脂鹽炒三兩巴戟三兩胡桃肉四兩以下治婦人方育麟珠治婦人氣血俱虛經脈不調或斷續帶濁或腹痛腰痠或虛弱不孕服一二斤即可受胎凡種子諸方無以如此人參無者以山藥四兩炒黃代之白朮茯苓白芍酒炒各四兩川芎甘草炙各二兩當歸四兩熟地八兩菟絲子制六兩杜仲酒炒鹿角霜各四兩川椒二兩煉蜜為丸淡鹽湯遂下百丸如經遲腹痛加酒炒補骨脂肉桂各二三兩甚者再加吳茱萸一兩湯泡一宿炒用如帶多加補骨脂二兩北五味一兩或加龍骨煅研醋炒二三兩如子宮寒甚或泄或痛加附子炮乾薑隨宜如氣不順或脹或滯加酒炒香附二兩或甚者再加沉香一兩如血熱經早者加白薇川續斷地骨皮各三兩或另以湯劑暫清其火而後服此如男子制服宜加枸杞胡桃肉鹿角膠棗皮巴戟肉各三四兩啓宮丸治婦人肥盛子宮脂滿壅塞不能胎孕多濕痰也陳皮去白二錢半夏一兩茯苓八錢甘草二錢川芎七錢白朮一兩香附四錢神麯五錢粥丸白湯送下宜多制服當歸建中湯治婦人一切氣血不足羸瘦無孕當歸四錢肉桂甘草炙各二錢白芍五錢酒炒薑棗引調經種玉湯治婦人經行之日服之成孕當歸身四錢酒洗川芎二錢熟地六錢白芍酒炒二錢茯苓二錢陳皮錢半吳茱萸炒七分丹皮錢半元胡炒熟一錢香附酒炒七分薑引稱足分量作四劑空心服經至之日服起藥盡經止即當入房必成孕矣縱未成孕經當對期俟經來再服四劑必孕無疑若過期而經水色淡者血虛有寒也加肉桂炮薑熟艾各一錢若先期而色紫者血虛有熱也加條黃芩二錢或如白薇二錢此方穩洽人人可服最效十八論藥各有所宜凡種子之方各有所宜寒者宜溫熱者宜涼滑者宜澀虛者宜補不知因人而用而但知傳方見一人偶中而不論宜否競相制服其遺害不小至於香附王好古曰乃婦人之要藥多服亦能走氣而人不言走氣但治婦人不論虛實無不用之不知香附氣香味辛性燥惟開鬱散氣行血導滯乃其所長若氣血虛者用之大能泄氣耗血凡今婦人十有九虛用之不當則胎元之氣日耗無望後嗣矣十九天時地利文略二十飲食飲食各有所宜似不必過為拘執惟酒多者為不可酒後入房雙斧以伐枯樹為性命憂矣若欲種子者雖調養有日而一時酣醉則精為酒亂不惟不能成孕縱或成孕而他日痘疹驚風之禍已胎於此故與其多飲不如少飲更不如不飲欲為子嗣計者其毋以此為後著備揀求子單方可以取用文略胎孕門二十一胎脈婦人胎脈陰搏陽別少陰動甚其胎已結滑數不散胎必三月但數不散五月可別左數為男右數為女女胎如箕男胎如釜陰搏陽別寸為陽尺為陰搏者謂尺搏觸而動與寸陽之脈迥然各別此有子也或兩寸脈獨動而甚胎必結矣此説為的動者往來流利不與衆脈同也自一月以至四月始分男女左疾為男右疾為女左右俱疾定生二子男脈多沉實中滿之象陽在內也女脈多浮虛中虛之象陰在內也男女孕於胞胎女面肖母而懷足膝抵腹下大上小故胎如箕男面向母而懷則背脊抵腹其形正圓故如釜也且胎有男女而成有遲數男動在三月陽性早也女動在四月陰性遲也此皆正理毫忽不爽三月胎脈滑疾不散五月俱疾而不散不甚滑耳至六月以後不甚疾連及八九十月血氣流通其脈平和而如無妊但兩寸活動稍不同耳非醫者深明脈理病者直明其故難以診而知也然亦有始終洪數不變者其氣血甚盛不可以一例拘也凡胎孕之脈數勞損之脈亦數大有相似然損脈之數多兼弦澀胎脈之數必兼和滑為不同耳經曰身有病而無邪脈者妊也身有病經閉也經閉之脈尺中來而斷絶無邪脈者尺中之脈和勻而無病故為胎也啓蒙曰欲産之婦脈離經離經之脈認分明其來大小不調勻且復歇至或如雀啄屋漏應腰疼腹痛眼生花産在須臾卻非病二十二胎前調養免至墮胎婦人受胎之後最宜調飲食淡滋味避寒暑則胎元完固生子無疾若喜啖酸辛煎炒肥甘生冷之物脾胃受傷胎則易墮寒熱交雜子亦多疾皆有明驗所宜禁者不可忽也古者婦人有孕即居側室不與夫接若不知禁忌縱情恣欲有觸動胎氣而墮者有敗精凝滯而礙産者有生子多疾痘瘡稠密者種種有害所宜深戒試觀百物有胎之後並不交合幾有墮胎者何人之不如物也孕婦七情宜知自慎喜怒憂思悲恐懼一有所過母氣必傷子氣應之母傷則胎易墮子傷則臟氣不完病斯多矣盲聾喑啞之類皆胎養之故也明哲之婦庶能慎焉古有胎教言動必端心思必慎凡淫聲豔色不留耳目異端邪教勿入庭室並不使之好逸惡勞貪眠養驕庶得清純中正和平長厚之道以養胎孕血氣流通百脈暢適以便産育臨盆亦易其有賴於胎教也大矣凡婦人受種之後不惟勿復交接以擾子宮而且勿勞苦勿食冷勿疾行勿數浴勿飲酒勿令之怒勿令之驚勿登高臨深勿伸身舉重少有觸犯其胎必墮二十三女轉男胎文略二十四論墮胎婦人受胎七日一變今之墮胎者多不知在一月之內一月屬肝怒則多墮喜洗下體竅開亦墮此人不知須宜留神一次既墮肝脈受傷下次亦墮今之無子者大半如是非盡不受胎也又有在三月五月七月墮胎者多在二月四月六月者少蓋諸經養胎臟陰而腑陽三月屬心五月屬脾七月屬肺皆在五臟之陰陰常易虧故多墮耳如在三月曾墮後孕至期必乘其所虛而亦墮以心脈受傷故也須預於二月調補心經方法載後五月七月亦然必多服健脾益氣養榮之藥一有胎日不可間值前墮胎之月更宜著神凡上文所載一切損胎之事毫不可犯則胎元固而麟趾呈祥矣墮胎者由氣血不足以固胎元也然不足之中尚有性稟偏陰偏陽或寒或熱之異如概謂黃芩白朮為安胎之聖藥其貽害不小惟憑脈調治乃為當耳如陰虛內熱者而用艾葉白朮砂仁溫暖之劑則陰道愈消如草木之無雨露自然枯萎也如陽虛內寒者而用黃芩白芍生地涼血之藥則脾胃虛寒氣血益弱猶果品春夏易生秋冬少結也故辨症合宜雖寒熱俱可益人經所謂應犯無法似乎無犯也平補固胎湯新治種玉之後即平補氣血以固胎元免其下墮淮山藥炒當歸去尾酒洗杜仲糯米泔炒白芍酒炒各二錢白朮錢半熟地三錢益母子一錢炒甘草炙一錢川續斷節節斷皮黃皺如雞腳折之有煙塵者真二錢升麻鹽水炒三分黃耆蜜炒錢半棗三枚白蓮子去心微炒捶碎七粒引如虛寒作嘔逆者加生薑一錢如體虛兼熱口渴便燥等證加黃芩一錢五分或加生地二錢如氣逆多滯者加去白陳皮八分或加童便炒香附七分即砂仁亦可如有所觸而動血者加阿膠二錢此方和平有孕者宜常服養血舒肝湯新治受胎一月系屬肝經前此或墮後孕至期亦墮宜於交合之後即生血養肝肝安則木不侮土脾亦安而胎元之根本固矣當歸身二三錢熟地三五錢白芍酒炒錢半甘草炙一錢阿膠蛤粉炒白朮杜仲鹽水炒各錢半枸杞二錢淮山藥炒二錢棗引如怒後傷肝氣逆脅痛加青皮六分柴胡酒炒七分加減歸脾湯新胎至三月心經養之前此或墮心經受傷後孕宜預於二月調補之必須大劑不宜間斷保過三月可無虞矣人參或以山藥炒黃四錢代之白朮三錢黃耆蜜炒二錢茯神二錢當歸二三錢棗仁炒研錢半遠志三五分甘草炙一錢陳皮八分杜仲鹽水炒錢半川續斷酒浸一錢升麻三分蓮肉七粒去心紅棗三枚如津液短少咽乾便燥加熟地三錢如腹冷便溏不愛飲食加乾薑炒黃錢半或加砂仁加味四君子湯新胎至五月脾經養之前此或墮脾經受傷後孕宜預於四月調補之必須大劑不可間斷保過五月則無虞矣人參隨便白朮二錢半茯苓錢半甘草炙一錢山藥炒當歸扁豆炒各二錢芡實炒研末三錢調藥服薑棗引或加杜仲續斷各錢半或以此方加倍研細末加白糖每日中夜用米飲調服三錢即睡一刻更妙加味補中益氣湯新胎至七月肺經養之前此或墮肺經受傷後孕宜預於六月調補之必須大劑不可間斷保過七月則無虞矣人參隨便黃耆蜜炒二錢白朮當歸各錢半炙草陳皮各八分柴胡酒炒升麻蜜炒各三分杜仲續斷淮山藥炒各錢半百合二錢五味子十五粒薑棗引如肺虛有熱或口渴溺赤或咳嗽喉燥加麥冬一二錢如脾寒泄瀉加炮乾薑一錢如氣滯而脹加腹皮八分或加枳殼七分千金保孕丸治妊婦腰背痛善於小産服此可免墮胎杜仲八兩用糯米煎湯炒去絲薑水炒亦可川續斷黃皺如雞腳折之有煙塵者真四兩酒洗上為末用山藥十兩研末開水泡糊為丸緑豆大每服百餘丸空心米飲下忌酒醋惱怒此丸宜與上按月水藥同服或用紅棗一斤水浸蒸爛取肉糊丸亦妙泰山盤石散治婦人氣血兩虛肝脾素弱倦怠少食屢有墮胎之患此方平和可以多服保固無虞人參隨便黃耆蜜炒當歸川續斷各錢半川芎白芍酒炒黃芩細而實者佳熟地各一錢白朮二三錢甘草炙砂仁各五分糯米一撮水煎服但覺有孕三日一服如值曾經墮胎之月預半月調治一日一服不得少間若臨期則不及也如氣血覺有熱者倍黃芩如胃弱者多用砂仁少用黃芩更宜切戒欲事及酒醋辛熱之物可保無墮每日得與上千金保孕丸並進更妙二十五安胎凡妊娠胎不安者其證非一治亦不同但當隨證隨經因其病而調治之乃為至善治法詳列於後若執古方未必適合溫胃飲治胎氣因寒而不安者其證或吐酸嘔惡或下寒泄瀉脈見沉細全無火證皆屬陽虛溫中而胎安矣人參隨便白朮二三錢扁豆二錢陳皮八分乾薑炒一二錢甘草炙一錢當歸一二錢滑泄者不用溫服如氣脹痛加藿香丁香白蔻砂仁白芥子木香之屬如脾虛嘔吐加胡椒二三分或用理陰煎方載上第三內溫胃散方載上第八內加減主之亦妙清熱安胎湯新治胎因熱而不安者其證或煩熱口渴便燥或漏血尿赤或暴動上衝或六脈滑數等證當歸一錢白芍生地各二錢黃芩錢半黃柏續斷甘草各一錢水煎熱服如小水赤澀加炒梔子一錢如氣滯脹痛者加陳皮青皮香附木香之屬如血虛有熱者加熟地山藥如熱甚加知母青蒿之屬胎元飲治氣血兩虛而胎不安者六脈微弱神昏氣倦一切不足之證當加減用之或間日一服或常服之人參隨便當歸杜仲薑炒白芍酒炒白朮各二錢熟地二三錢甘草炙七分食遠服如氣分虛甚者倍白朮加黃耆但耆朮氣浮能滯胃口倘胸膈有飽悶不快者須慎用之如下元不固而兼遺濁者加山藥補骨脂五味之類如虛而兼寒多嘔者加炮薑七八分如虛而兼熱者加黃芩錢半或加生地二錢去杜仲如陰虛小腹作痛加枸杞二錢如多怒氣逆者加去白陳皮香附柴胡或加砂仁如有所觸而血動者加川續斷阿膠珠各錢半如嘔吐不止去熟地加半夏薑汁炒錢半生薑一錢如十全大補湯方載上第三內八珍湯四物合四君俱可擇用安胎和氣飲治跌撲觸動胎氣不安歸身白芍黃芩各一錢白朮錢半蘇葉炙草砂仁各五分薑棗引如動血者加阿膠珠川續斷艾葉不應用八珍湯送知母丸其丸用知母二兩炒研末棗肉蒸爛糊丸又方用川芎末二錢酒下二三服胎生即安若胎死立下又方竹茹五兩酒煎服歸地阿膠湯治入房觸動胎氣不安者歸身熟地阿膠蛤粉炒各錢半炙草砂仁各七分竹茹三錢水煎更宜切禁房事不致再墮加味四物湯治七情過傷胎動不安者以四物湯為主當歸熟地各二三錢川芎一錢白芍錢半如因怒傷肝者加柴胡黃芩炙草各一錢如因悲傷肺者加阿膠黃芩蘇葉各一錢五味子十二粒炙草五分如因驚傷腎者加川續斷黃柏炒杜仲炒各一錢五味子十五粒如因思傷脾者加白朮錢半陳皮香附各一錢炙草五分如因喜傷心者加條芩黃連白朮麥冬各一錢炙草五分又有安胎用六味加杜仲續斷五味阿膠安胎之聖藥也又方用白朮熟地各一兩水煎服凡胎之不安而有墮者大抵不外乎屬虛屬火二者之間能知清熱養血無不安矣此外又有因母病動胎者但療母病則胎自穩有因觸傷動胎而病及母者當知安胎而母病亦愈二十六妊娠傷寒凡妊娠傷寒專以清熱和胎為主各隨六經所見表裡之證治之務宜謹慎不可與常病傷寒同治以致損胎遺害不小凡得傷寒勿拘日數但見惡寒發熱頭痛病在表也宜用紫蘇和胎飲為主後照各經之證加味治之紫蘇條芩白朮各錢半甘草一錢如惡寒頭痛項強腰脊痛此病在足太陽膀胱經也本方加羌活藁本川芎防風各一錢連須蔥三根薑引熱服得汗而解如惡寒卻不發熱只頭痛鼻乾或項強此病在陽明胃經也本方加葛根白芷防風各一錢蔥白三根淡豆豉錢半熱服如寒熱往來頭眩或嘔或心煩脅滿此病在足少陽膽經也本方加柴胡人參嘔加半夏胸脅滿加枳殼桔梗各一錢頭眩加川芎八分薑棗引如發熱惡寒咳嗽甚者此病在手太陰肺經也本方加麻黃去節杏仁去皮各一錢蔥白三根薑引以汗而解如惡寒無熱腹中痛吐瀉不渴手足厥冷者此病在足太陰脾經也本方加乾薑炒錢半白芍酒炒一錢薑棗引熱服如惡寒倦臥發熱手足冷者此病在足少陰腎經也本方加獨活熟地各錢半北細辛八分薑棗引如惡寒手足厥冷唇口青遍身頭項痛此病在足厥陰肝經也本方加歸身吳茱萸炒羌活各一錢北細辛五七分連須蔥白三根薑引熱服凡得傷寒勿拘日數但無惡寒無頭痛只發熱口燥咽乾而渴者此病入里用黃龍湯為主各隨所見之證加減用之柴胡人參甘草黃芩各一錢如發熱口渴小便不利者此小腸膀胱病也本方加白朮錢半豬苓赤苓澤瀉木通各一錢如發熱大渴者此胃與大腸病也本方加知母石膏各錢半淡竹葉十五個粳米一撮如大熱大渴煩躁大便不通者此病在胃也本方去人參加枳殼大黃煨各錢半薑引若不應加芒硝一二錢以利為度如發熱口乾而渴心煩不得眠者或乾嘔者此病在膽也本方加麥冬花粉山梔棗仁各一錢竹茹二錢如發熱而渴腹痛自利者此病在脾也本方加白朮白芍阿膠炒茯苓各錢半薑棗引如發熱而渴利下濃血手足冷者此病在肝也本方加歸身白芍酒炒白朮茯苓各錢半烏梅二個引凡傷寒愈後調理失宜復發熱者此勞復也用黃龍湯加知母麥冬各一錢石膏二錢淡竹葉十五個粳米一撮如飲食失節復發熱者此食復也用上紫蘇和胎欲加枳實陳皮神麯各一錢如有熱證加黃連炒薑棗引和胎敗毒散治天行時氣傳染初起服此解之亦是妙方人參羌活前胡柴胡白苓甘草川芎枳殼桔梗黃芩白朮蘇葉葛根蔥白各一錢薑引熱服得汗而解加味化斑湯治傷寒熱不解遍身發斑赤如紅錦者人參知母一錢石膏三錢甘草黃芩梔仁生地各錢半淡竹葉七皮豆豉一合水煎服二十七胎漏胎漏者謂既有孕而復下血也屬氣虛血虛胞中有熱而下元不固也法宜四君子以補其氣四物以補其血黃芩黃柏以清其熱膠艾以止其血杜仲續斷以補下元之虛病自愈矣安榮養胎湯新治孕婦氣血兩虛六脈微弱不時下血者人參少者以山藥四錢炒黃代之白朮歸身熟地杜仲薑炒阿膠蛤粉炒各錢半艾葉八分條芩酒炒黃柏炒白芍各一錢炙草七分薑棗引或加三七根二錢如血熱甚者加生地青蒿丹皮之屬如骨蒸多汗者加地骨皮錢半如熱甚而渴者加石膏二三錢如五心熱加元參錢半如下熱便澀者加梔子一錢如脾虛不能統血用加減歸脾湯方見上墮胎如氣虛不能攝血用補中益氣湯方見上血色加阿膠艾葉五味子祕元煎治衝任氣虛不能約制血滑易動而無火者山藥炒芡實炒棗仁炒搗碎各二錢白朮茯苓各錢半遠志七分炙草一錢金櫻子去核二三錢如氣虛加黃耆二錢或加阿膠艾葉安胎散治妊娠偶然傷觸下血或腰痛難忍者熟地當歸白芍炒黃耆蜜炒阿膠炒各錢半甘草炙艾葉川芎地榆炒黑各一錢薑棗引有一種婦人受妊二三個月經脈如常但較前略少脈息滑數並無病證是血氣旺而蔭胎有餘生子仍不弱此不必治也待三月後經脈方止至七八個月而生子者人但以血止為度謂不足月不知妊婦壯實間有是耳安胎聖方治氣血不足以致胎漏胎動宜峻補之人參白朮三錢杜仲薑炒二錢枸杞茯苓甘草炙各一錢山藥炒歸身棗皮各二錢熟地三四錢麥冬錢半五味五分又方治胎漏如神名止漏神丹白朮五錢熟地一兩三七根末七錢此方用三七根乃止血神品補而兼止故奏效如響又方五倍子研末酒服錢半神效二十八妊婦中風此證有三或外中風邪寒熱身痛或肌肉頑痹或拘攣強直口噤不語六脈必浮大有力皆由表虛所以虛風得以襲之也宜以安胎為本少加搜風之味又有血虛不能養肝木動風搖陰火上炎鼓動其痰或僵仆或昏迷或發搐脈必浮滑而數此由血虛生熱熱生風皆內起之風火涼血養血而風火自息也仍以安胎為主勿過用中風之藥又有左脈微數右脈滑大忽然暈倒口噤莫言狀如中風須臾復醒醒而復發此名子癇乃氣虛挾痰挾火而然也治宜補虛清熱以化痰為主加味八珍湯治體虛冒風寒熱昏迷等證六脈浮數人參少者以山藥四錢炒黃代之白朮熟地當歸秦艽各二錢茯苓黃耆蜜炙各錢半白芍酒炒撫芎甘草炙羌活防風黃芩各一錢薑棗引水煎速服以平為度養血祛風湯新治血虛生熱熱生風以致拘攣昏迷等證當歸山藥生地沙參鉤藤鉤麥冬各二錢熟地三五錢枸杞錢半元參青蒿阿膠蛤粉炒各一錢水煎加竹瀝半杯薑汁四五匙合服如痰盛加膽星二錢海石二錢陳皮去白錢半如火盛而痰不降加童便二十九子癇清神湯治孕婦忽然眩暈卒倒狀如中風脈與證詳上中風條人參隨便白朮茯苓黃耆炙甘草炙麥冬歸身各二錢薑棗引如痰盛加南星二錢養血清熱湯新治風木為熱痰涎壅盛等證當歸二錢川芎一錢白芍酒炒錢半熟地二三錢陳皮去白半夏薑炒茯苓各錢半炙草一錢黃芩酒炒錢半加竹瀝薑汁三十子煩孕婦煩悶不安者多由陰血養胎孤陽獨旺心肺虛熱是以撩亂不寧或心驚膽怯謂之子煩人參麥冬散主之人參茯苓生地麥冬各錢半黃芩酒炒甘草炙各一錢竹茹二錢食前服此外又有嘔吐痰沫而煩者又有血積停飲寒熱相搏而煩者又有時當盛夏君火乘肺而煩躁胎動者宜診脈察證不得一概視之子煩竹瀝茯苓服之即效三十一子懸孕婦五六個月以後胎氣不和上湊心腹脹滿疼痛謂之子懸此證挾氣者居多能疏氣養血而胎自降而安然邪之所湊其氣必虛當知補正而邪自除又有由腹內氣寒致令停飲與氣相爭故令腹脹須以脈之遲數辨之紫蘇飲治胎氣上脹似子懸立而不安者紫蘇錢半陳皮去白大腹皮洗淨川芎白芍酒炒歸身人參各一錢少參者或以山藥炒黃四錢代之或用時下條參沙參四錢亦可炙草五分薑一錢蔥白七寸水煎服三十二子腫孕婦腹大胸腹脹滿或手足頭面浮腫或小水不利此由胸中蓄水名曰胎水一時發脹頃刻難安千金鯉魚湯治胎中水脹如神或胎死腹中皆效當歸白芍白朮各錢半茯苓二錢陳皮去白八分用鯉煎一尾不拘大小去鱗臟白水煮熟去魚用汁煎藥加生薑五片空心服二三服水盡脹消神效若脾虛不運佐以四君三十三子氣孕婦有六七個月兩足腫大行步艱難或腳指間有黃水出此名子氣與子腫在上半身者不同輕者待子生後即消不治亦可重者須為調治天仙藤散治孕婦下身腫脹或足指間出水似有水氣天仙藤洗略炒香附炒陳皮甘草烏藥各二錢加生薑木瓜蘇葉各七分日三服若因脾胃虛弱惡食便泄宜兼六君子湯如中氣下陷用補中加茯苓茯苓湯白苓白朮烏藥各錢半香附陳皮各一錢炙草蘇葉各五分木瓜八分薑引空心服如妊婦至八九個月脛腿俱腫非水氣比小便短屬蓄水小便清長不屬水不可以水病治宜用上方凡有此者必易産因胞臟中水血多不能燥胎故也初妊即腫是水多兒未成恐胎壞也三十四子滿孕婦至八九個月胎大滿腹坐臥不安謂之子滿束胎飲白朮二錢子黃芩蘇葉枳殼大腹皮洗淨各一錢砂仁和殼略炒研五分炙草四分薑引空心服要知此證系富貴之家奉養過厚而胎大難産者可早服十餘劑若體虛弱及淡薄家決不可用三十五子淋孕婦小便少點滴澀痛為子淋膀胱小腸虛熱也虛則不能化氣熱則不能通利由氣血聚養胎元不及敷榮滲道遂膀胱鬱熱所致宜滋腎以清熱也安榮散當歸白芍人參麥冬石斛通草各一錢山梔七分空心服此方內原有滑石恐下墜故更之或改用木通生地條苓甘草梢麥冬沙參赤芍各錢半淡竹葉十五皮燈心四分水煎服亦可三十六孕婦尿閉附遺尿古來謂此證為轉胞多用滑利藥鮮效因思胞不自轉為胎墮所壓胎若舉起胞系自疏水道自通矣宜補中益氣湯服後探吐以提其氣氣通而小便自下矣但貧家不能辦參即三五七分不能有力探吐法載小便閉門余有一法試之即愈有胎墮而小便閉者此屬急證一刻難過用板一塊將孕婦仰臥板上頭上用枕於腳頭漸漸貼高七八寸不等以胎系圓物自必旋轉而上離開一二寸則膀胱不壓小便即通矣用藥者恐不能如此之捷而妙通後即當大補元氣恐胎又墮也大補元氣湯新治胎下墜宜急服多服乃妙黃耆酒多炒一兩人參或以山藥五六錢炒黃代之白朮二錢甘草炙一錢升麻淡鹽水炒一錢二分杜仲薑水炒二錢薑棗引若氣滯加陳皮或兼血虛者加當歸二錢酒炒白芍錢半凡妊婦遺尿不知用白礬五錢牡蠣煅一兩共研末酒調服二錢又方雞毛燒灰米酒服一匙又方桑螵蛸蒸焙二錢益智仁五錢共為末米飲下此證若脬中有熱用加味逍遙散方載上第九內若脾肺氣虛用補中益氣湯方載上第七內加益智仁若肝腎陰虛用六味地黃丸方載上第二內加五味牡蠣益智仁三十七子鳴九個月十個月胎氣已定子在腹中鳴者治法或令母拜狀一刻或以豆撒地令母逐一拾之則止矣三十八子喑喑者謂有言無聲非絶然之不語也腎脈入肺循喉嚨系舌本而為聲之所由出也因胎氣肥大阻腎上行之經故間有之十月分娩後而自能言也不必加治人亦勿慮三十九尿血妊婦勞傷經絡熱乘於血血得熱則滲入脬故尿時痛而下血宜四物加山梔發灰或加阿膠熟地麥冬五味之類四十妊婦惡阻惡阻者心有所惡而食嘔阻也其證脈息平和心悶頭眩惡食嗜酸因氣血積聚以養胎元而五味不化中氣壅滯穢腐之氣上攻於胃以致嘔逆法當散郁清熱不可過用辛藥若愈止愈吐仲景法停藥月餘自安以為妊婦常病加味茯苓半夏湯新治妊婦惡阻陳皮去白一錢半夏二錢薑炒則不動胎為健脾化痰主藥茯苓三錢甘草炙一錢砂仁炒研八分白朮錢半薑棗引或只用茯苓半夏白朮各二錢亦可薑一錢棗三枚若瘦人兼熱加麥冬竹茹或脈滑數之甚加黃芩參橘飲治嘔逆不能食者六脈虛滑須補氣清熱以保胎也人參一錢白朮二錢炙草一錢橘紅紫蘇麥冬黃芩竹茹生薑各一錢廣香五分茯苓錢半棗引或加半夏二錢薑炒經云有故無殞又謂胎前須順氣者是也和中理脾湯新治惡阻兼腰痛者防胎下墮宜以和中理脾為主不可升舉蓋嘔逆氣已上升藥再上升則犯有升無降上更實而下更虛益促其墮矣當歸熟地薑汁炒各二錢白芍酒炒錢半川芎一錢陳皮甘草黃芩各一錢半夏薑炒錢半白朮杜仲鹽炒各二錢茯苓錢半薑三分棗三枚水煎空心服四十一妊娠腹痛此病或素有冷疼或新觸風寒邪正相擊而並於氣氣上則衝心氣下則攻腹若脈證俱有寒邪須照上傷寒治法否則為胎痛或小腹重墜潔古丹溪俱以血虛治之用熟地六錢當歸一錢水煎服若不應加參朮陳皮或中氣下墜作痛者用補中益氣湯如偶有所傷胎動切痛喜熱喜按者用帶殼砂仁和皮炒淡黑色為末酒下二錢不飲酒者米湯下腹中覺熱胎安痛止極效若小腹寒甚如扇風之涼加附子二三錢以溫下焦勿疑動胎以有病當也四十二妊婦霍亂此病因寒熱之感邪正交爭故心腹絞痛如邪在上胃脘則心痛而吐邪在下胃脘則當臍痛而利若在中則腹痛而吐利俱致吐多傷氣利多傷血氣血俱傷子母不安此危證也加味紫蘇和胎飲紫蘇葉紅者真條芩甘草各一錢白朮錢半陳皮藿香須梗連葉者真各八分砂仁五分熱服若痛而不吐不泄者名乾霍亂殺人須參閲霍亂門救法在十五卷四十三妊婦泄瀉此證雖不無風寒暑濕之外感飲食生命之內傷然屬於脾虧者乃其本也蓋血統於脾血擁胎元則脾陰虛而食不運化故作泄也總以補脾安胎為主加味四君子湯人參少者用山藥四錢炒黃代之白朮二錢茯苓錢半炙草一錢白芍一錢如脈實而熱者必煩躁舌黃加黃芩一錢如脈虛尿清或腹痛喜按穀食不甚化者加乾薑炒五七分烏梅一個或加肉豆蔻一錢如小便短少口渴屬濕熱者加蓽薢四錢廣香煨三分至於扁豆藿香訶子之類俱可加用四十四妊婦痢疾此證或傷生冷或傷濕熱致令腹痛傷血則赤傷氣則白血氣俱傷則赤白相雜至若胎墜而不能升舉者中氣下陷大用補中湯而自安切勿用順氣行氣之藥以耗氣也況有似痢非痢者由脾氣虛不能滲濕腎氣虛不能閉藏勿以有形之假滯而傷無形之元氣則得矣歸芍湯新治妊婦腹痛下痢裡急後重脈洪有力證屬熱者當歸二錢白芍錢半黃芩黃連陳皮各一錢廣香三分如痛甚則下加大黃錢半空心服黃連阿膠湯治妊婦久痢以清熱和胎為主黃連炒阿膠炒白朮茯苓各一錢木香乾薑炒各五分炙草七分烏梅二枚薑棗引如脈實有熱者減乾薑或加當歸白芍各錢半單方治妊婦絞痛下痢用雞子一枚烏雞子更妙開孔去白留黃入黃丹一錢紙封煨乾為末米湯下四十五妊婦咳嗽此證有因外冒風寒者發熱惡寒鼻塞流涕宜用發散加減參蘇飲人參紫蘇陳皮茯苓甘草枳殼桔梗前胡黃芩各一錢生薑六分薄荷葉三分水煎熱服得微汗而解人參阿膠散治久咳不已謂之子咳引動其氣恐防墜胎人參白朮茯苓炙草蘇葉阿膠蛤粉炒桔梗各一錢水煎服百合散治妊婦咳嗽心胸不利煩滿不食胎動不安百合紫苑麥冬桔梗各錢半桑白皮一錢甘草八分竹茹一錢水煎去滓入蜜二匙再煎一二沸食後溫服四十六妊婦瘧疾此因氣血虛損風寒得以乘之風為陽邪化氣而為熱寒為陰邪化氣而為寒陰陽並挾寒熱互見治宜輕解表邪以大補氣血為主清理湯新治瘧疾寒熱柴胡錢半桂枝知母黃芩歸身甘草白豆蔻肉微炒研各一錢白朮二錢生薑錢半水煎瘧前二時服若寒重桂枝生薑各加一錢若熱重黃芩知母各加一錢頭到輕煎服後煎二到加常山酒重炒錢半草果仁飯包煨研八分烏梅二個半水半酒重煎瘧前一時服若早服藥性已過若遲服瘧疾已發俱不得效此際須當酌量為妙凡病瘧者於此留神四十七妊婦中暑凡盛暑時中其暑熱之毒六脈遲弱發熱自汗口渴氣短精神昏憒四肢倦怠宜作虛治勿用涼藥清暑安胎湯新人參白朮錢半炙草一錢黃耆蜜炒二錢當歸山藥炒各錢半麥冬一錢五味子十三粒薑棗引或用清暑益氣湯亦妙方載暑證門四十八妊婦腰痛此證多屬勞力所致蓋胞系於腎傷則腰痛或至小産故宜以安胎為主胎安而痛自愈痛愈而胎能安加減六味丸新治腎虛腰痛或入房不節致傷胞系而痛者必脈大而空兩尺更甚熟地三五錢山藥二錢茯苓一錢棗皮錢半杜仲鹽水炒二錢枸杞二錢五味三分空心服如脈緩遇天陰而痛者濕熱也腰重如帶物而冷者寒濕也脈澀而日輕夜重者氣血凝滯也脈浮者風邪所乘也脈實者閃挫也臨月腰痛如脫者將産也詳言所因宜照脈照證治之四十九妊婦失血血以壅養胎元或七情六淫一有所感則氣逆而火上乘血隨而溢也然有虛實之分實火當清熱以養血虛火當滋陰以補水則血可安而胎可固若泛用行血消血之劑禍不旋踵清熱養榮湯新治血熱妄行或吐或衄或下皆可頻用急服生地二錢熟地五錢白芍酒炒錢半麥冬阿膠蛤粉炒青蒿當歸血虛有熱者宜少用各一錢水煎調發灰棕灰百草霜蒲黃炒黑等分研勻共二錢或再加童便半杯更佳歸地滋陰湯新血虛妄行胎動不安可以多服以平為度熟地五七錢當歸去尾三五錢白芍酒炒錢半蜜耆二三錢杜仲白朮各錢半山藥二錢枸杞阿膠炒各一錢煎就照上方發灰等四味調服五十妊婦氣喘此證有外感風寒而客邪勝者宜發散自愈若脾虛四肢無力腎虛腰痛膝軟猝然氣喘此脾肺素虧母虛子亦虛腎氣不歸元而上乘於肺也宜以補肺為主而一切辛辣破氣者決不可用參蘇飲治妊婦一切風寒外感至穩神效人參蘇葉乾葛前胡陳皮枳殼半夏薑汁炒茯苓各一錢桔梗甘草各八分木香五分薑棗引熱服補中湯治脾肺虛而腎氣不歸元以致氣喘者人參少者重用沙參四錢當歸蜜耆白朮各錢半炙草八分陳皮八分五味十五粒薑棗引如氣滯作脹加砂仁香附之屬或沉香亦妙五十一妊婦悲傷妊婦臟燥無故悲傷像如神鬼所憑此屬肺病臟燥者肺之臟燥也胎前氣血壅養胎元則津液不能充周而肺為之燥當補母以脾為肺之母也若作實證治一刻危亡棗麥甘草湯治臟燥悲泣大棗十枚小麥一碗甘草三錢水煎溫服或用八珍湯加竹茹麥冬小麥薑棗引亦妙前方仲景用大棗甘草以補脾後方立齋用八珍以補氣血加竹茹麥冬以清熱更發前人之所未盡也五十二鬼胎鬼屬虛無豈能襲人胞宮而得成形者乎此由本婦邪思蓄注血隨氣結而不散或衝任滯逆脈道壅瘀而不行是即血癥氣瘕之類耳宜以癥瘕之法治之詳見本條凡婦人經候不調即為調補必無是病若其既病亦宜以調補元氣為主而繼以去積之藥乃可也決津煎方載經期腹痛此補中兼行可瀉假胎而不傷元氣也通瘀煎治血凝滯致成脹滿欲去而不峻猛可無慮也歸尾三錢山楂香附紅花新者炒黃各錢半烏藥一二錢青皮澤瀉各一錢木香五分酒引如寒滯者加肉桂如火盛者加炒梔子微熱者加白芍血滯者加牛膝血瘀滯者加桃仁或加蘇木元胡之類如大便燥結者加大黃或加芒硝蓬朮亦可奪命丹治血癥既已調補而欲直除其病者用此立下附子炮五錢乾漆碎之炒令煙盡牡丹皮各一兩共為細末另用大黃末一兩以醋一碗熬成膏和前藥為丸溫酒吞五七丸一方治婦人血虛者加當歸一兩此方亦能下死胎胞衣五十三治邪祟法除邪方治婦人言笑畏人心神昏迷用雄黃研末二兩松脂四錢溶化為丸於火籠燒煙令病者坐於上去衣以被蒙之露頭在外不過三劑自斷仍以雄黃防風五味等分為末或加人參更妙每旦用井水調服又方用繩扎縛兩手一把以艾揉熟於兩大指甲與肉連處在指甲內角上共燒一炷至三五炷此名鬼俞穴最靈最妙又方用鹿角磨汁酒調服
