body:
  text: 卷之一脈法一脈法論凡古今之論脈者不一有深遠而不明者有繁多而無用者有簡略而不該者有臆撰而背謬者令人閲之不惟不能朗然且有用之而貽害者余於此道已閲歷五十年矣稍有所會故自生平診脈以來或勢危斷生或身旺斷死或斷三年死或五月或百日或即日死無一之不驗者此余之心得初非可以言傳也余於後尺脈條勉強言之亦不過明其概耳但規矩準繩須當明析庶不致有誤今余備揀內經及歷代名賢最顯最約決不可少之脈訣録之於後以便人取用是由淺入深之道也人能細意會之亦可以無遺蘊矣二四字脈訣四字脈訣從來久矣茲於缺者補之訛者正之復加注釋文簡義該實學者之醫鏡也脈為血脈百骸貫通大會之地寸口朝宗脈者血脈也血脈之中氣道行焉而經曰肺朝百脈為脈之大會蓋肺如華差各經皆處其下也上部為寸中關下尺三部九分因人下指上屬陽下屬陰三部九分人長下指稍疏人短下指稍密心與胞絡左寸之中膻中與肺右寸所應膻即胸也二寸居上所謂上以候上也故凡頭面咽喉口齒頸項肩背之病皆候於此惟膽與肝左關脈定胃與脾脈屬在右關二關居中所謂中以候中也故凡脅肋腹背之疾皆候於此膀胱及腎左尺所認小腸相火屬在右腎二尺居下所謂下以候下也故凡腰膝小腹陰道脛中之病皆候於此按本經曰脈之上者應上下者應下自叔和云心與小腸合於左寸肺與大腸合於右寸其謬甚矣二腸皆下部之腑小腸屬火火居火位故當配於下之右以右腎乃元陽之本也大腸屬金金水相從故當配於下之左以左臂乃真陰之舍也欲察下部之水火者端在二尺但二腸連胃氣故內經亦不言其定處但曰大腸小腸皆屬於胃是又可於胃察二腸之氣也關前一分內外所重左為人迎以候外因右為氣口可辨食症上中下一部三分今曰關前一分仍在關上但前一分耳左謂人迎仍在肝膽脈內緊甚則傷風風中有寒宜發表右謂氣口仍在脾胃脈內緊甚則傷食宜消導傷食脈於此辨神門屬腎而在關後人無二脈有死不二經曰上中無脈下部有脈雖困無害以兩尺屬水火為人之根本所以稱神門也餘生平斷人之生死亦在於是上二部不論於兩尺脈按之至於將止未止之間能滑而過指復有和緩之意此人雖勢危亦可以生若兩頭雖動全無神力下不滑而過指者兩尺敗矣或即日死或即刻死所必然者若兩頭動而無神而指下猶有一線之滑而欲過者或三年或二年而止若兩頭動而無神而指下稍有一毫之滑而欲過又不能過者或半年或旬日而危此古今脈訣無有明言之者余能會之有欲言而不能言者姑言其概以俟人之神而明之也兩頭即尺之兩頭也五臟不同各有本脈左寸之心浮大而散右寸之肺浮澀而短肝在左中沉而弦長腎在左尺沉石而濡右關屬脾脈象和緩右尺相火與心同斷此言五臟平脈必知平脈而後知病脈也若夫四時亦有平脈春弦夏鉤即洪秋毛冬石脾在四季和緩不忒春屬肝木木性弦夏屬心火火性洪秋屬肺金金性輕故曰毛冬屬腎水水凝如石土旺於四季之末各十八日脾土居中其性和緩凡診病脈平旦為準虛靜凝神調息細審經曰診法常以平旦飲食未進氣血未亂乃可診有過過即病也之脈虛靜其心凝神於指稠勻自己氣息細審病者之源言不可忽也一呼氣出一吸氣入合為一息脈來四至平和無疑閏以太息五至亦宜三至為遲遲則為冷六至為數數則為熱醫者一呼脈再至一吸脈再至一息四至而五至亦曰宜者何也蓋以人之氣息三息中有一息之長名為太息如歷家三歲一閏也至於性急之人脈亦急常有五至不足異也若一息三至為遲主冷病一息六至為數主熱病倘再遲再數皆死脈也遲數既明浮沉須別浮沉遲數辨內外因外因於天內因於人太過不及脈中可分外因風寒暑濕燥火六氣之邪脈多洪大緊數弦長滑實而太過矣內因喜傷心怒傷肝憂思傷脾恐傷腎驚傷心七情之過脈必虛微細弱短澀濡芤而不及矣一脈一形各有主病脈有相兼須當細論三二十七種脈象浮脈輕手即見泛泛在上如水之漂木全在水面也洪脈如洪水之洪有波濤洶湧之象即大脈也即鉤脈也虛脈浮而無力且大且遲也散脈亦浮而無力按之如無比虛更甚芤脈狀如蔥管浮沉二候易見中取正在空處非絶無也但比之浮沉則無力耳濡脈浮而小且軟也微脈似濡則更甚矣欲絶非絶似有若無八字傳神革脈浮而且弦且芤外急內虛狀如鼓革以上七脈兼乎浮者宜於浮脈中察而辨之沉脈在下重按乃得與筋骨相應如石之墜於水底也伏脈沉之極也沉脈在筋骨之間伏脈則推筋著骨而後可見牢脈沉而有力且大且長也與革脈之浮取而得者不同實脈浮中沉三候皆有力更甚於牢脈也弱脈沉而極細軟也細脈沉細而直且軟也弱細二脈與上虛脈濡脈微脈相似但上三者見於浮部此二者見於沉部以上五脈兼乎沉者宜於沉脈中察而辨之遲脈一息三至往來遲漫為不及之象緩脈即平脈之有胃氣也一息四至往來和勻也澀脈遲滯不利如雨落沙上來有形去無蹤也結脈遲來而時有一止也代脈遲而中止且有定數如四時禪代不愆其期也以上四脈兼乎遲者宜於遲脈中察而辨之數脈一息六至往來急數為太過之象滑脈滑而溜利如珠走盤如泥鰍在手緊脈緊急有力切繩極似促脈數而時有一止如疾行而蹶也動脈形如豆粒厥厥動搖兩頭俱俯中間高起故短如豆仲景云陽動則汗出陰動則發熱由是則尺寸皆有動脈謂獨見於關者誤矣以上四脈兼乎數者宜於數脈中察而辨之短脈短縮之象不及本位長脈相引之象過於本位弦脈長而端直狀類弓弦戴同父曰關不診短若短脈見於關上是上不通於寸為陽絶下不通於尺為陰絶死亡之脈也以上三脈非浮沉遲數可括故別列於此四二十七種脈證浮脈主表腑病所居有力為風無力血虛浮遲表冷浮數風熱浮緊風寒浮緩風濕六腑屬陽其應在表浮而有力風邪盛也無力陰血虧也浮主表遲主冷浮而遲為表冷也浮主風數主熱浮而數為風熱也緊為寒浮而緊為風寒也緩主濕浮而緩為風濕也浮虛傷暑浮芤失血浮洪虛火浮微勞極浮濡陰虛浮散虛劇浮弦痰飲浮滑痰熱暑傷氣氣虛則脈虛芤屬失血如吐血下血之類洪主火洪而浮為虛火微為氣血俱虛故主勞極血屬陰浮而濡為陰虛虛極故如散亡弦為風木之象浮而弦乃風痰也滑主痰滑而浮為熱痰也雖曰浮為在表然亦有風寒外感者脈見緊數而略兼乎浮便是表邪上文中亦有非是表症若一概因浮而表之則大害矣其有浮大弦硬之極至四倍以上者內經謂之關格此非有神之謂乃真陰虛極而陽亢無根大凶之兆也不可不知沉脈主裡為寒為積有力痰食無力氣鬱沉遲虛寒沉數伏熱沉緊冷痛沉緩水蓄五臟屬陰其應在裡沉者陰象也積者臟病也故為寒積沉而有力有形之物凝滯於內沉而無力無形之氣鬱結干中沉遲皆屬陰所以虛寒凡身冷厥逆洞泄精寒等症見焉沉而數自熱伏也緊主諸癰亦主冷得之沉分非冷痛乎濕脈緩今沉而緩當水蓄矣沉牢痼冷沉實極熱沉弱陰虧沉細虛濕沉弦飲痛沉滑食滯沉伏吐利陰毒積聚寒脈牢固實脈三部皆強故為極熱沉弱無力陰虧也細為不足亦主濕浸弦主飲亦主諸痛滑雖主痰若在脾部沉分為食滯也寸伏則吐尺伏則利在陰症傷寒則為陰毒積聚沉脈屬裡然必察其有力無力以辨虛實沉而實者多氣停積滯宜消宜攻沉而虛者因陽不達因氣不舒陽虛氣陷者宜溫宜補其有寒邪外感陽為陰蔽脈見沉緊而數骯髒頭痛身熱等症者正屬外邪亦不可表以沉為里或用溫散可也遲脈兼症以下新補遲脈主臟陰盛陽虧沉遲裡虛浮遲表寒氣寒不行血寒凝滯遲兼滑大風痰頑痹遲而細小泄痛拘攣遲脈主臟有陰而少陽也遲見於表裡可見內外虛寒陽分遲則氣滯則痛陰分統論遲脈治法遲則血凝而閉滑大而遲風痰流於身體遲而細小虛寒見於泄瀉脈來遲慢者總由元氣不充只可補養不可妄旋攻擊數脈兼症數脈屬腑或吐或狂緊數外感細數內傷弦數瘧疾空數虛瘡滑數多熱澀數多寒動數胎孕浮數胃亡六腑屬陽數亦屬陽數而有力陽氣亢逆主吐熱邪傅里主狂緊屬寒數屬熱外感者憎寒壯熱陰虛內熱火不歸元脈自細數瘧脈多弦弦數多熱脈數無熱而反惡寒必發癰也脈數而滑屬實熱脈數而澀屬虛寒胎孕脈數而活動多在兩寸胃統論數脈原有虛實脈和緩若數而浮胃氣絶矣數脈有陰有陽何人皆以數為熱及詳考內經則曰諸急者多寒緩者多熱滑者陽氣盛微有熱曰粗大者陰不足陽有餘為熱中也曰緩而滑者曰熱並未有以數言熱者而遲冷數熱之説始自內經若遵此説不分虛實而概用寒涼其害多矣蓋人之內熱實火脈反不數而惟洪滑有力如經文所言者是也凡於數脈止在有力無力分寒熱也數而洪滑有力者當以熱治數而空虛細微者或補陰或兼補陽此際顧本之不暇何得復用苦寒以傷脾胃滑司痰飲右關主食尺為蓄血寸必吐逆滑數滑大上下皆熱婦人滑數經斷有孕平人滑緩氣血充足若滑而弦虛損瀉痢滑為痰飲右關沉滑知有停食兩尺見之必有蓄血兩寸見之吐逆難免若滑而大滑而數上熱見於心肺頭目咽喉之間下熱見於膀胱小腸大腸之間婦人脈滑數而經斷者為有孕若平人脈滑而和緩為氣血充實之佳兆至於滑而浮弦屬陰血虧損而瀉痢亦多弦滑之脈此脾胃受傷也不得通以火論澀為陰脈氣血兩虧左寸脈澀心虛而痛右寸復然自汗可商關澀脾敗反胃結腸兩尺見之精血大傷氣血兩虛故脈來艱澀左寸見澀心虛而痛必對胸口右寸復澀則為自汗蓋汗乃心之液而肺主皮毛也右關見澀脾虛濕勝而血液枯竭所以上為反胃下為結腸兩尺脈澀精血傷矣凡脈見澀滯多是七情所傷血無以養氣無以充上下內外皆隨所在而見不足之症男子為傷精女子為失血為不孕為經脈不調諸家言氣多血少豈以脈之不利猶有氣多者乎弦為木旺脾傷泄瀉肺弦而浮支飲外溢弦而沉下懸飲內痛弦數多熱弦遲虛寒弦大主弱弦細拘急寸弦頭病尺弦腹疼肝弦癥瘕瘧脈定弦木旺者脈必弦木旺傷土土虛不能制濕或痰欲或泄瀉之症生焉此際宜平肝以補土惟肉桂為妙支飲者咳逆外腫以土虛不能保肺也懸飲者水留脅下咳唾引痛以土虛不能燥濕也數熱遲寒內外皆然弦大者脾虧少食所以主虛弦細者陽虧無氣所以拘急寸主上焦故頭痛尺主下焦故腹痛肝氣鬱結而血癥食癥氣瘕難免至於瘧疾之脈本自弦也弦從木化氣通乎肝人有和緩之胃脈則五臟俱安肝邪所侵則五臟俱病何也蓋木之滋生在水培養在土若木氣過強則水因食耗土為克傷水耗則腎虧土傷則胃損腎為精血之本胃為水穀之本根本受傷生氣敗矣所以木不宜強也矧人無胃氣曰死若肝邪與胃氣不和宜緩者與弦強相反此脈總非佳兆洪脈似實重按則無陽盛陰虛相火燔灼浮洪表熱沉洪裡熱煩渴狂躁咽乾便結關洪胃虛尺洪腎竭心洪火炎肺洪燥咳升陽散火滋陰亦合若作實治病源未得洪脈來盛去衰主陽旺陰虛之病浮洪身熱自汗沉洪自有煩渴諸熱症右關洪脾胃虛躁左尺洪腎虧水竭心屬火洪則上炎脈屬金洪則燥咳治宜升陽散火兼之滋陰乃妙若作實火以硝黃下之則大謬矣洪而有力為實大而無力為洪此氣實血虛之候治以滋陰清火為主若洪大至極至四倍以上者是即陰陽離絶關格之脈也不可治實屬邪實舉按皆強表邪實者浮大有力風寒暑濕外感於經里邪實者沉按有力飲食七情內傷於臟洪滑有力火邪實熱沉弦有力寒邪諸痛凡實者邪氣實也如外因傷經內因傷臟之類表熱裡熱亦在於是火邪盛脈洪滑寒邪盛脈沉弦此處不明害在反掌此三焦壅滯之候表裡寒熱皆有實邪但實脈有真假真實者易知假實者易誤故必問其所因而兼察形症必得其神方可司命芤脈中空大虛之候失血血脫孤陽無根寸芤積血脾芤腸癰尺芤下血淋痢崩中芤脈屬陽浮大中空脫血之象而陽實無根也六脈中有一如是定是此經之血寸芤火犯陽經胸有積血或血上溢脾芤有腸癰或不能統血尺芤則熱侵陰絡故赤淋血痢崩中之病生焉榮行脈中脈以血為形今中空無血則氣無所歸陽無所附而一切陰虛發熱驚悸怔忡喘急盜汗等症形焉長病得之或可以生急病得之似為難治緊屬寒邪諸痛之根緊數在表外感風寒沉緊在裡逆冷吐泄關緊腹病尺緊疝疼婦人得之氣逆經滯小兒得之抽搐驚風緊脈來往有力熱為寒束寒主諸痛浮緊表寒宜於發散沉緊裡寒宜以溫散關緊心腹冷痛尺緊陰冷定有奔豚疝疼之症婦人小兒得之皆有陰寒病症不得誤用苦涼之劑緊脈有陰無陽為陰邪搏激之候主為寒為痛在表散之在裡溫之凡喘咳風癇吐逆痃癖瀉痢脅痛胸脹等症皆是至於人迎氣口緊甚之病詳見上文革屬血虛浮緊中空如按鼓皮其象為真男子得之亡血遺精婦人得之半産崩中仲景曰弦則為寒芤則為虛虛寒相搏其名曰革此即芤弦二脈相合故為失血之候有謂革即牢也不知革浮牢沉革虛牢實形症皆異不得混看牢脈堅固因寒凝形肝實乘脾心腹冷痛尺牢陰冷疝㿗多症失血陰虛見之必凶牢為寒痼之病木實則為痛臂冷則為疝失血者脈宜沉細反浮大而牢者死以虛病見實脈也沈氏曰似沉似伏牢之位也實大弦長牢之體也軟為虛牢為實實者寒邪實也虛脈所屬正氣不足無力無神陰陽各別浮而無力是為血虛沉而無力是為氣怯洪大無神陰虛之症細小無神陽虛之象陰虛救陰壯水為主陽虛救陽益火之源漸長則生漸消則亡虛者陰虧陽衰之候經曰按之不鼓即此之謂也凡微濡遲之脈皆為虛類然而脈亦不一不論浮沉大小但見指下無力總是虛症此醫之一大關鍵也血虛氣虛分於浮沉之無力洪大無神屬陰虛金水傷殘則龍雷之火自熾或咳喘勞熱或遺精失血等症生焉細小無神屬陽虛火土受傷則元陽之氣日損或頭目昏眩或膈寒脹滿或嘔惡亡陽或泄痢疼痛等症生焉壯水益火救虛之道此生死之大關也醫不識此尚何望其他焉緩脈四至疾徐調勻為有胃氣謂之平人緩滑有力多屬實熱遲緩脈小定是虛寒浮緩為風沉緩為濕緩大風虛緩細濕痹緩弱氣衰緩滑濕痰平人之脈從容和緩不浮不沉不疾不徐一息四至為有胃氣此無患也若緩而滑大者多實熱宜下宜清因其微甚而治之遲緩而小為虛寒多有不足之症內外昭然至於為風為濕為痹為虛脈與症自必相應細心詳察不可孟浪大凡病者脈得和緩皆為易愈不必虞也結脈忽止止而復來精力不繼氣血失培久病虛勞不足之害緩結陽虛數結陰衰元氣消長於此可剖若有滯郁形強氣倍舉按有力可以外揣結脈多由氣血漸衰精力不繼所以斷而復續續而復斷常見久病者虛勞者多有之緩結為陽虛數結為陰虛陰虛甚於陽虛於此察元氣之消長最顯最切者也至於留滯鬱結等病本亦此脈之症然必形強氣實而舉按有力方是此病若首尾不繼速宜培本不得妄認為留滯伏脈本有一時蔽塞寒閉氣閉不得發越推筋著骨其脈乃得寸伏食滯關伏老痰尺伏疝病大便或結伏脈為陰陽潛伏阻塞閉隔之候有火閉寒閉氣閉而伏者或為霍亂疝瘕或為氣逆食滯或為疝氣痰蓄因脈合症細揣自得此必暴病暴逆者或有之隨症調治而脈自復矣若有積困延綿脈本細微而漸至隱伏者此是殘燼將絶之兆而人謂之脈伏猶復破氣導痰其欲生也得乎微脈浮見按之欲絶氣血兩虛淋汗寒熱寸微心驚關微脹滿尺微精弱消疸常疼男為勞極女為帶崩濡脈似微病症相同不必過分微脈似濡其小而軟則更甚焉輕診可見重按若無氣血微故脈亦微主久虛血弱之病淋為腎虛汗為氣虛陽微惡寒陰微發熱寸關尺脈微各部自有各部之病男女脈微亦各有分散脈渙漫有表無里至數不齊去來不一氣血兩虛根本脫離心散怔忡肺散汗洗肝散溢飲脾散胻腫散見兩尺生息無幾散脈浮大而散氣血俱虛根本脫離之脈心肺肝脾雖各有病猶可調治至於兩尺見之恐難補益産婦得之當生之兆孕婦見之墮胎無疑至於久病脈散不必醫也弱脈沉細按之乃得氣虛之病陰血亦衰寸弱陽虛尺弱陰竭關弱脾虧少年莫得弱乃濡之沉者陰虛陰衰故惡寒發熱仲景曰弱主筋沉主骨陽浮陰弱血虛筋急寸關尺弱自有各部病症細脈沉小應指如線濕侵腰腎氣衰血虧寸細嘔吐胃細脹逆尺細陰脫遺精瀉痢細為血少氣衰之脈有此症則順否則逆故吐衄脈得沉細者生憂勞過度者脈亦細春夏少年俱不利秋冬老弱卻相宜浮細如綿曰濡沉細如綿曰弱浮而極細欲絶曰微沉而極細不斷曰細促屬鬱火數來一止止而復來不無留滯源有五因宜詳察之病為陽極陰將亡矣促為疾走一蹶之狀經言數而一止為促三焦鬱火也緩而一止為結氣血衰弱也此為陽極陰將消亡之候或因氣血飲食與痰五者一有留滯脈必見止其病或喘咳或發狂發斑或毒疽宜作火醫火退則生進則死動乃數脈見關上下無頭無尾形如豆搖陽動則汗陰動則熱司痛司驚拘攣痢泄男子亡精女人崩血兩寸滑動婦人胎結關前三分為陽關後三分為陰關位半陽半陰故動隨虛見陽虛則汗陰虛則熱凡痛驚拘攣痢泄皆屬虛症至於亡精尺虛也崩血陰虛陽搏也婦人兩寸脈獨活而滑動為有孕矣此言的確長如本位氣治最良見於心脈身壯神強見於尺部蒂固根藏若兼滑實反常多恙陽明深熱火毒癲狂長脈不大不小迢迢自若經曰長為氣治原屬平脈有一部之長有三部之長俱為有餘之脈若兼滑實弦緊反為有病所以有胃熱火毒等症短歉本位兩頭不長浮為血澀沉患痞傷寸見頭痛尺主腹疼左關忌見秋季不妨短脈不滿本位只見尺寸若關中見之上不通寸為陽絶下不通尺為陰絶為死脈也故關不診短長脈屬肝宜於春短脈屬肺宜於秋短則氣病屬不及也代脈中止不能復來良久方還元氣大哀中代吐瀉下代痢泄病者可療平人難回孕婦見之胎懷三月數脈一止為促緩脈一止為結止無定數或二動三動一止即來代脈之止有常數依數而上良久方來死脈也兩動一止三四日三四動止應六七五六一止七八朝次弟推之自無失此有可信再參之以余之前論兩尺脈更無疑矣五胃脈論玉機真藏説曰脈弱以滑是有胃氣命曰易治終始篇曰邪氣來也緊而急穀氣來也徐而和六尺脈論叔和曰寸關雖無尺猶不絶如此之流何憂殞滅蓋以人之有尺猶樹之有根也水為天元之一先天命之根也於尺脈按之至於將止之間指下猶有一線之滑而欲過者雖危無傷此余之心得也有論在脈法神門條下若尺脈兩頭雖動按之即伏指下又不見滑而欲過者必死之兆但日之遠近在人心會不可以言傳也七論脈陰陽真假至真要大論帝曰脈從而病反者其診若何岐伯曰脈至而從按之不鼓諸陽皆然帝曰諸陰之反其脈若何曰脈至而從按之鼓甚而盛也曰脈至而從者如陽症見陽脈陰症見陰脈是皆謂之從也若陽症見陽脈但按之不鼓而指下無力則脈雖浮大便非真陽之候不可誤認為陽症凡諸脈之似陽非陽者皆然也或陰症雖見陰脈但按之鼓甚而盛者亦不得認為陰症八論脈虛實景嶽曰脈者血氣之神邪正之鑑也有諸中必形諸外故血氣盛者脈必盛血氣衰者脈必衰無病者脈必正有病者脈必乖矧人之疾病無過表裡寒熱虛實只此六字業已盡之然六者之中又惟虛實二字為最要蓋以四症無不皆有虛實能以二字決之則千病可以一貫矣且治病之法無逾攻補用攻用補無逾虛實欲察虛實惟憑脈息雖脈有二十七種皆有虛實能辨虛實則陰陽標本萬無一失其或脈有疑似又必兼症兼理以察其孰客孰主孰緩孰急能知本末先後是即神之至也矣九胃脈關病吉凶欲察病之進退吉凶者當以胃氣為主察之之法如今日尚和緩明日更弦急知邪氣之愈進則病愈甚矣如今日甚弦急明日稍和緩知胃氣之漸至則病漸輕矣即如頃刻之間初急後緩者胃氣之來也初緩後急者胃氣之去也胃氣來或不藥而愈胃氣去大非佳兆十脈須辨真據脈法所言凡浮為在表沉為在裡數為熱遲為寒弦強為實微細為虛是固然矣然多疑似必須辨真如浮雖屬表而凡陰虛氣虧者必浮而無力是浮不可以概言表沉雖屬裡而凡感邪之深者寒束皮毛脈不能達其必沉緊是沉不可以概言里數為熱而真熱者脈只滑大而實凡陰陽虧損虛甚者數必甚是數不可以概言熱遲為寒凡傷寒初退餘熱未清脈多遲滑是遲不可以概言寒弦強類實而真陰胃氣大虧及陰陽關格等症脈必豁大而弦健是強不可以概言實微細類虛而凡痛極氣閉榮衛壅滯不通者脈必伏而微是細不可以概言虛由此推之則不止是也凡諸脈中皆有疑似診能辨真及此則為司命良工十一脈證真假辨脈有真假症亦有真假病而遇此最難明析症實脈虛者必其症為假實也脈實症虛者必其脈為假實也何以見之如外雖煩熱而脈見微弱者必火虛也火即陽也腹雖脹滿而脈見微弱者必胃虛也虛火虛脹其堪攻乎宜從脈之虛不從症之實也其有本無煩熱而脈見洪數者非火邪也本無脹滿而脈見弦強者非內實也無熱無脹其堪瀉乎此宜從症之虛不從脈之實也凡此之類但言假實不言假虛果何意也蓋實有假實虛無假虛假實者病多變幻此其所以有假也假虛者虧損即露此其所以無假也大凡脈症不合者中必有姦必先察共虛以求根本庶乎無誤此不易之要法也十二從證從脈辨古有從證從脈之説為病之輕重言也如病本輕淺別無危候者但因見在以治其標自無不可此從症也若病關臟氣稍有疑難則必詳辨虛實憑脈下藥方為切當所以輕者從症十惟一二重者從脈十當八九此脈之關係非淺也雖云脈有真假而實由人見之不真耳脈亦何從有假哉十三脈有所忌凡內出不足之症脈宜和緩柔軟忌見陽脈如洪大浮數之類是也外入有餘之病脈宜有力有神忌見陰脈如微澀細弱之類是也十四論脈順逆凡暴病脈以浮洪數實者為順久病脈以微緩虛弱者為順反此者為逆蓋脈症貴乎相合若症有餘而脈不足脈有餘而症不足輕者亦必延綿重者即至危亡十五論一歲之中脈象不得再見如春弦夏洪秋澀冬石脈隨時令此為平也如春宜弦而得洪脈者至夏必死得澀脈者至秋必死得石脈者至冬必死為真臟之氣先泄也其象先見於非時當其時不能再見也十六論脫陰脫陽六脈有表無里如濡脈之類此名脫陰六脈有里無表調之陷下如弱脈之類此名脫陽六脈暴絶此陰陽俱脫也經曰脫陰者目盲脫陽者見鬼陰陽俱脫者危十七脈有相似宜辨洪與虛皆浮也浮而有力為洪浮而無力為虛沉與伏皆沉也沉脈行於筋間重按即見伏脈行於骨間必推筋至骨乃可見也數與緊皆急也數脈以六至得名而緊則不必六至惟弦緊而左右彈然如切緊繩也遲與緩皆慢也遲則三至極其遲慢緩則四至徐而不迫實與牢皆兼弦大實長之四脈也實則浮中沉三按皆有力牢則但於沉候取也洪與實皆有力也洪則重按小衰實則按之亦強也革與牢皆大而弦也革則浮取而得牢則沉取而見也濡與弱皆細小也濡在浮分重按即不見也弱主沉分輕取不可見也細與微皆無力也細則指下分明微則似有若無模糊難見也促結澀代皆有止者也數時一止為促緩時一止為結往來遲滯似止非止為澀動而中止不能自還止有定數為代十八論脈陰陽生死寒熱凡脈浮大數動滑為陽沉澀弱弦微為陰陰病見陽脈者生陽病見陰脈者死寸口脈微為陽不足陰氣上入陽中則惡寒也尺脈弱為陰不足陽氣下陷陰中則發熱也十九論氣血衰微脈其脈沉者榮血之微也其脈浮而汗出如流珠者衛氣之衰也陽脈浮陰脈弱為血虛為病筋急二十癰疽脈諸脈浮數當發熱而反惡寒若有痛處飲食如常者當發其癰脈數不時則生惡瘡二十一論脈之有神無神有病之脈則當求其神之有無如六數七極熱也脈中有力即有神矣當泄其熱三遲二敗寒也脈中有力即有神矣當去其寒若數極遲敗中不復有力為無神也苟不知此而泄之去之神將何依為主故經曰脈者血氣之充血氣者人之神也善夫二十二總論脈證四條脾胃屬土脈本和緩土惟畏木脈則弦強凡脈見弦急者此為土敗木賊六脈皆然俱無胃氣不僅論脾脈也大非佳兆若弦急之微者尚可救療弦急之甚者胃氣其窮矣脈微弱而惡寒者此陰陽俱虛不可發汗更吐下也陰症無脈溫之用附子理中四逆回陽之類而脈微續者生暴出者死寸關尺三部浮沉大小遲數同等雖有寒熱不解者然陰陽和平雖劇必解又宜參診尺脈過指與否故經言獨小獨大獨疾獨遲獨熱獨寒獨陷下者病診在何經便知是此經之病二十三虛實憑脈辨治病須以虛實為主虛實者有餘不足也有表裡之虛實有氣血之虛實有臟腑之虛實有陰陽先天水火之虛實凡外入之病多有餘內出之病多不足實言邪氣實則當瀉虛言正氣虛則當補夫疾病之實固為可慮而元氣之虛慮尤甚焉故凡診疾者必先察其元氣而後察疾病若實而誤補隨可解救虛而誤攻不可生矣欲辨虛實莫逃乎脈如脈之真有力有神者方是真實症脈之似有力有神者便是假實症矧脈之無力無神者哉臨症者萬毋忽此二十四脈宜沉候凡症既難憑當參之脈理脈若難憑當取之沉候彼假症之發見皆在表也故浮取脈而脈亦假焉真症之隱伏皆在裡也故沉候脈而脈可辨耳脈辨已真猶未敢恃更察稟之厚薄症之新久醫之誤否夫然後濟以湯丸可以十全二十五脈以沉取為根經曰脈浮無根者死是謂有表無里陰即絶矣孤陽豈能獨存乎又須參診兩尺絶否尺脈論見第六條生死昭然二十六老少脈異老者脈宜衰弱若過旺者病也倘旺而不躁此稟之厚壽之徵也如其躁疾有表無里此名孤陽死期近矣少者脈宜充實若衰弱者病也倘細而和緩三部同等此稟之靜福之徵也若細而弦數木強乘土死期至矣二十七胎脈歌括在婦科第二十條
