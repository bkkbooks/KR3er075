body:
  text: 卷十六本草上凡列一古今本草不一多者太繁少者太簡求其藥性與病情指示適中而令閲者朗然無疑未之有也即如痰症有燥痰濕痰之異而諸書第以除痰概之熱症有內傷外感之殊而諸書第以退熱括之此皆病證相反未可混施舉此二端其餘可以類推縱其中間有論及而亦未必在在明析也且有一味藥言能治二三十種病者雖古人著書以是藥有一毫之長不忍遺漏而豈無輕重之用亦不明其何以能治某病之理使用者無所適從不惟無益而且有害余於是道閲歷已五十餘年矣合覽群書稍有所得詳明是藥所以能治某病以味之或酸或辛氣之或升或降性之或補或瀉之類各言其由庶令人明其主治之理取用之宜使用者無誤而病者易痊亦衛生之一助云耳一古人著本草原以濟人為心如參耆歸術之類即治世之賢臣用以輔理元氣者也如麻桂硝黃之類即亂世之良將用以剿除蔻賊者也至於有之不以為益用之反以為害者如天靈蓋紫河車如水蛭礬石用之不得其法反致遺害於無窮也如蛤蚧膃肭臍性之不正適以引人損精耗神者也如此類者難以盡舉余著是集或刪之而不録或録之而辨其不必用亦以應用藥物和平而神良者不少何必舍其萬全而用此傷心害身之物邪後之人倘謂古人已用之於前今人何妨用之於後又豈知因病用藥固有不能如古人之神聖者哉一醫之為道因病立方固貴精明而用藥亦須詳審如地道不真市肆多偽收取非時存貯過久頭尾誤用制治無法不能隨手奏效或歸咎於藥之無功譬之兵不精練思以藹蔻克敵適以覆衆輿尸也治療之家可不留心歟一凡藥製造貴在適中不及則我之所欲不遂太過則彼之氣味反失酒製上升去寒性薑製發散除寒滯入鹽走腎臟仍仗軟堅用醋注肝經且資收斂童便制除劣性降下米泔制去燥性和中乳制潤枯生血蜜制甘緩益元陳壁土炒借土氣以補中州麥麩皮炒抑酷性免傷上膈烏豆甘草湯漬解毒致令中和羊酥豬脂塗炙滲骨容易脆斷黃連香附製法不一各注本草去穰者免脹去心者除煩制治各有所宜不可不如其法也一每味藥先辨其氣味形色次於有毒者標之後著所入經絡乃為發明其功用而以主治之症具列於後其所以主治之理字箋句釋明體辨用俾閲者朗然一藥品産於異域遐僻者必詳其地道形色如習見習知之藥則不加詳注一生藥先增分量候製造成而後稱用之恐生多而熟少也若君臣輕重不合未必有效一藥有五味並各有所用也酸屬木入肝用之能澀能收苦屬火入心用之能瀉能燥能堅甘屬土入脾用之能補能和能緩辛屬金入肺用之能散能潤能橫行咸屬水入腎用之能下能耎堅淡者能利竅能滲泄又有藥之頭入頭於入身枝入肢皮行皮亦須知之以便取用草部一人參味甘溫微苦入脾肺二經茯苓為使畏五靈脂以藜蘆其色黃大而潤者佳大補虛勞氣弱止自汗陽虛喘咳屬肺虛者可用瀉火退熱虛勞者內虛寒而外假熱合黃耆甘草之甘溫而退大熱故亦謂之瀉健脾保肺添精神除煩渴瀉火故除煩生津故止渴定眩運元氣足也通血脈氣行則血行破積消痰以氣旺也瘧痢滑瀉初痢宜下久痢宜補治瘧亦然血脫凡大吐大衄須重補氣而血自止氣旺則能生血也脹滿正氣不足中暑中風痘瘡下陷皆元氣虛也按人參補氣性陽若真陰虧竭邪火熾於表裡內外枯燥以及肺脈洪實血熱妄行痧疹初發而斑點未形傷寒始作而邪熱方盛不得誤投二黃耆味甘微溫入脾肺二經茯苓為使惡龜甲皂莢反防風須知黃耆得防風其功益大蜜炙用補元陽實腠理治勞傷以陽氣虛也長肌肉氣生血故肉長無汗能發表虛邪閉生用發汗自汗能止補氣固表排膿內托膿成則毒化氣虛痘陷宜黃耆人參甘草糯米止血崩血淋氣固而血自止除瀉痢帶濁氣升而陷自除解渴瀉陰火也定喘補氣虛也按性味俱浮彼氣滯中滿表邪未散怒氣傷肝者俱禁用三當歸味甘辛微溫入心肝脾三經畏生薑菖蒲海藻酒洗用頭止血身養血尾去血全用活血能引諸血各歸其經血滯能通血枯能潤血亂能撫去瘀生新其氣辛溫能行氣分使氣調而血和也治虛勞寒熱頭痛腰痛血不足也舒筋活癱血足養肝潤腸性滑止痢活血心腹諸痛散寒和血風痙無汗辛散風溫和血産後痙者以血脫無以養筋也排膿止痛血和則痛止凡婦人崩漏調經胎前産後俱宜用之誠血中之聖藥也按當歸辛溫血虛有寒者宜多用血虛有熱者宜少用凡陰虛火動大便不固者忌之入吐血衄血劑中須用醋炒以其辛能動血也四甘草味甘氣平入脾經白朮為使反甘遂海藻大戟芫花惡遠志忌豬肉犯者陽痿生用涼炙用溫補脾胃瀉心火火急甚者以此緩之益三焦散表寒解諸毒解毒藥須冷飲熱則不效和百藥薑附加之恐其僭上硝黃加之恐其大下止瀉痢補土生肌止痛土主肌肉甘能緩痛除咳嗽咽痛肺痿益陰退熱梢止莖中作痛節消腫毒諸瘡助參耆補氣虛助熟地療陰虧隨氣藥補氣隨血藥補血無往不利故稱國老須宜重用而今人只用二三分何也但其性和緩若病勢急欲見速效可不必用按甘草味甘凡中滿者嘔逆者俱忌用五白朮味甘苦溫入脾胃二經糯米泔浸一日飯上蒸熟切片土炒蜜水拌勻防其燥也荷葉包蒸借其陽也補脾甘也燥濕苦也和中溫也消痰水腫脹黃疸濕痹泄瀉土能勝濕進飲食脾健祛勞倦脾主四肢虛則倦怠已嘔吐暖胃止汗濕從汗出濕去汗止且性澀也安胎胎氣繫於脾脾健則蒂固不脫且能化濕熱也消痞脾運則積化按白朮燥濕脾虛而寒濕者可用濕而兼熱者勿用古方君枳實以消痞佐黃芩以安胎枳實破氣黃芩寒胃亦宜辨其可否不得概用至於癰疽得之必多生膿奔豚遇之恐反增氣其陰虛燥渴便閉氣滯肝腎有動氣者俱當禁用六蒼朮味苦辛溫入脾胃二經畏惡同白朮生茅山堅白有硃砂點者良糯米泔浸同芝麻炒以制其燥燥濕消痰苦也發汗解鬱辛也調胃進食止嘔吐瀉痢濕去則脾健除水腫土能勝濕散風寒濕痹為治痿要藥合黃柏川牛膝逐下焦濕熱痿躄闢一切山嵐瘴疫邪惡鬼氣得天地之正氣也按蒼朮燥烈凡陰虛燥熱大便閉結表疏自汗者俱忌用七丹參味甘性澀微熱心脾肝腎四經血分之藥畏鹹水反藜蘆忌醋養陰活血去瘀生新瘀去則新生安生胎養血下死胎去瘀血崩赤帶可止經脈不勻能調治冷熱虛勞骨節疼痛手足不隨皆血不足化癥瘕癥者有塊可徵瘕者聚散無常皆血病也除煩躁血虛發熱甚則煩躁婦人産後更多古云丹參一味當四物又云丹參養神定志通利血脈實有神驗為女科之要藥也但能補血又長於行血妊娠無故勿服八沙參味甘苦性微寒入肺經惡防己反藜蘆補肺氣清肺熱涼肝養血兼益脾腎脾為肺母腎為肺子久嗽肺痿金被火克散皮膚風熱瘙癢頭面腫痛止驚除煩清肺熱也按沙參雖能補五臟之陰然氣輕力薄不堪重任非人參比也若臟腑無實熱及寒客肺中作嗽者勿服九元參味苦甘微咸氣寒入腎經尤走肺臟惡黃耆乾薑大棗山茱萸反藜蘆忌銅蒸過曬乾黑潤者佳苦能清火甘能滋陰咸能補腎益精明目退骨蒸除痰嗽壯水之效清手心足心之熱此屬無根浮遊之火惟元參清除甚捷解煩渴利咽喉腫痛治陽毒發斑皆肺受火傷補水可以制之化瘰癧寒散火咸軟堅婦人産後余疾亦屬陰虛按性寒滑脾虛嘔逆泄瀉者禁之十苦參味苦性寒入腎經元參為使惡貝母菟絲漏蘆反藜蘆泔浸蒸過曬乾用除熱寒也燥濕苦也生津止渴安五臟濕熱去則血氣和平津液生而五臟安治溫病血痢腸風溺赤皆涼血之效黃疸明目止淚殺蟲解瘡毒濕熱之愆按苦參大苦大寒損胃寒精非大熱者勿用十一川芎味辛微甘氣溫入肝經白芷為使畏黃連硝石滑石惡黃耆山茱萸反藜蘆蜀産為川芎里白者勝秦産為西芎江南産小者名撫芎其性善走為血中氣藥潤肝燥補肝虛肝以瀉為補所謂辛以散之辛以潤之治風濕頭痛血虛頭痛破瘀蓄通血脈祛脅痛調經候因辛散也目淚多涕肝熱理崩帶眩運以氣升也療癰疽瘡瘍癰生六腑疽生五臟皆陰陽相滯而成芎歸能和血行氣而通陰陽撫芎止利開鬱亦上升辛散之功也按川芎補不足而散有餘以辛多而甘少也若單服久服令人走散真氣能致暴亡至於陰虛火炎及三陽火壅於上而頭痛者得升反甚若不明升降而但知川芎治頭痛謬亦甚矣十二白芍藥味苦甘酸微寒入脾肝肺三經惡石斛芒硝畏鱉甲小薊反藜蘆生用寒煨熟酒炒以制寒性治血脫者醋炒瀉肝火味酸斂肝肝以斂為瀉以散為補安脾肺固腠理止虛汗木得斂而不剋土則脾安土旺能生金則肺安肺主皮毛肺安則腠理固而汗自止治熱瀉癰腫目疼脅痛鼻衄除煩安胎血虛發熱性沉陰能入血分補虛涼血除痢疾後重屬胃中濕熱若冷痢忌用止血虛腹痛能治血虛又能行氣安脾消中滿喘咳肺安凡一切肝血不足之證按白芍仍補藥之稍寒者古人戒産後勿用似乎太執若産後血虛而熱陰氣散失者正當用之赤芍尤瀉肝火治腸風瘡癤目赤通經破血能散瀉也産後忌之十三生地黃味甘苦大寒入心肝脾腎四經惡貝母忌銅鐵蔥蒜蘿蔔諸血滋陰退陽涼血生血治血虛發熱陰虛生熱滋陰退火通二便瀉大腸小腸火平諸血逆吐衄崩中傷寒陽狂痘證大熱熱甚者用生地搗汁服去煩躁骨蒸勞傷咳嗽婦人血熱經枯三消熱渴涼血之功按性寒涼或酒浸一夜用若胃虛食少脾虛泄瀉者禁用十四熟地黃性味畏忌同生地黃熟則甘溫懷慶所産大本支其色黃而不黑中系菊花心外有小直紋而無橫痕每兩用縮砂仁炒研四分同好米酒拌勻入砂鍋內蓋好莫出氣蒸半日卻不用煮取出曬乾如前加酒蒸曬九次為度令中心透熟純黑乃佳滋腎水填骨髓益真陰利血脈為補血補精之仙品治陰虛發熱頭疼口乾舌焦喉燥咳痰氣喘勞傷風痹或虛火炎於上焦而吐衄腎水泛於皮膚而浮腫或陽浮煩躁陰脫仆地入散劑能發汗以汗化於血無陰則汗無以作也入溫劑能回陽以陽生於下無陰則陽無以生也經曰精化為氣得非陰生於陽乎至於聰耳明目胎前産後皆深賴焉補血黑髮烏髭所必需也補髓按性微滯若痰多氣鬱胸膈窒凝當斟酌用之十五五味子皮甘肉酸核中苦辛有鹹味故名五味蓯蓉為使惡葳蕤嗽藥中生用補藥微妙或蜜浸蒸用俱宜捶碎遼東肥潤色紅者佳收肺氣生腎水肺以酸收金旺則水生澀精收汗固腸酸也肺與大腸相表裡肺斂則腸固除熱水足解渴肺斂生津益氣肺主氣斂故能益收瞳子散大收耗散之氣故能明目虛勞咳嗽肺氣咳嗽宜人參五味補元陽助命門溫辛壯筋骨腎足按五味子性主收斂若感寒初嗽肝旺吞酸肺脈滑實者禁之十六天門冬味甘苦大寒入肺腎二經地黃貝母為使忌鯉魚取明亮肥大者去心皮酒蒸用清金滋水肺為腎母熱退則水生治肺腎虛熱定喘止嗽解渴消痰退骨蒸勞熱吐血衄血以其甘寒養陰清金降火肺癰肺痿癰為邪實咳吐膿血治宜瀉火解毒痿為正虛咳嗽短氣治宜養血保肺療熱淋熱結苦寒骨痿苦能堅腎寒去腎家濕熱按天門冬性寒而滑脾寒泄瀉惡食者忌用十七麥門冬味甘微甘微寒入心肺二經地黃車前為使惡款冬畏苦參青葙木耳入補藥去心酒蒸或拌米炒清心火退肺熱止渴除煩火降則津生治血虛客熱乾咳吐衄燥金清也消浮腫肺清則水下行故腫消療痿蹶肺熱葉焦肺癰肺痿功同天冬生脈脈絶垂死同人參五味用明目經枯乳閉益水清火按麥門冬與天門冬功用相似寒性稍減若脾虛泄瀉惡食者仍宜忌之十八款冬花味甘性溫入肺經杏仁為使惡元參畏辛夷麻黃黃耆甘草黃芩貝母須知得貝母反良蜜水炒止咳嗽療肺癰痿解唾血清肺消痰除煩瀉熱治咳逆上氣喘渴肺虛夾火為治嗽要藥寒熱虛實皆可施用能使肺邪從腎順流而出也十一二月開花未大舒者良生河北關中世多以枇杷蕊偽之十九遠志味苦辛溫入心腎二經畏珍珠藜蘆殺附子毒冷甘草水浸透去心焙乾用功補心腎治驚悸健忘心血足也強志益智聰耳明目腎精足也止夢泄健筋骨腎足之效療癰毒苦泄辛散按遠志味辛宜少用為佐若火實上焦者避之二十羌活味辛苦性溫氣雄上升而散入小腸膀胱肝腎四經辛溫能散氣雄善走治風寒濕邪頭痛項強遍身百節骨疼剛痙柔痙眼目赤腫邪閉憎寒壯熱無汗小無不入大無不出為撥亂反正之主藥且奏效甚捷以辛溫而氣雄也按羌活性猛輕重量用若血虛體弱表松自汗者忌之二十一獨活味苦氣香性微涼入腎與膀胱二經川産潤而香者良有風不動無風反搖善行滯氣專得風濕拘攣濕痹通身濕癢腫毒風勝濕也本經頭痛同細辛用奔豚疝瘕腎積曰奔豚風寒濕客於腎家所致疝瘕亦然按獨活可理伏風羌活可理遊風皆主風疾若因血虛頭痛及遍身肢節痛不可誤服二十二防風味苦辛氣溫入肺小腸膀胱三經畏萆薢惡乾薑芫花色白而潤者良治風邪頭痛項強周身盡痛又能隨諸經之藥而至各經得蔥白能行周身行脾胃凡補脾胃非此引用不能行療風眼止冷淚除濕瘡為去風勝濕之要藥凡風藥皆能勝濕同黃耆白朮又能實表止自汗按防風瀉肺能散上焦元氣若病不因風濕而肺氣虛者禁用二十三細辛味大辛氣溫入心小腸二經惡黃耆山茱萸畏滑石反藜蘆産華陰者真辛散諸風治百節拘攣疼痛祛陰分寒邪性溫能發少陰之汗少陰頭痛獨活為使口瘡喉痹少陰火也以辛散浮熱口臭牙蟲煎水含漱通鼻開關為末吹之除頭面遊風風眼目淚風也按細辛燥烈不可過用過一錢悶絶而死死亦無傷可驗二十四白芷味辛氣溫入肺胃大腸三經當歸為使惡旋覆花辛散風溫除濕芳香通竅發表逐陽明經風寒邪熱止頭痛頭風目痛齒痛眉稜骨痛陽明之脈營於頭面除皮膚斑疹燥癢鼻淵大腸風閉腸風尿血皆肺經風熱味辛故入肺瘡科止痛排膿瘡潰宜少用女人赤白帶漏炒黑用按白芷辛散血熱有虛火者禁之二十五麻黃味苦辛溫入心肺膀胱大腸四經厚朴為使惡辛夷石葦去根節大表留節微表水煮去沫體輕揚味辛溫生麻黃之地冬不積雪善達肌表走經絡體輕除風邪寒屬寒祛寒毒辛溫治表實無汗脈浮緊者正用憎寒壯熱頭痛身疼太陽病通九竅開毛孔散肺邪咳嗽風寒入肺痰哮氣喘哮喘宜瀉肺氣服麻黃不出汗即寒邪深入少陰厥陰筋骨之間亦能同肉桂以遂之且兼氣藥以助力可得衛中之汗兼血藥以助液可得榮中之汗兼溫藥以助陽可遂陰凝之寒毒兼寒藥以助陰可解炎熱之疫邪能善佐使無往不利寒傷實家第一要藥也既受寒邪四季皆可用不得疑夏不用按麻黃走表雖可汗之證不宜多服若不當汗而汗與可汗而過汗或血溢或亡陰為害不小可不慎哉二十六麻黃根味甘平微澀蜜炒止一切汗證皆可加用蓋其性能行周身肌表引諸藥至衛分而固腠理也二十七葛根味甘寒入脾胃二經生葛汁大寒解溫病大熱吐衄諸血輕揚升發退熱止渴凡熱而兼渴者此為最良以能升胃氣入肺而生津耳開腠發汗麻黃太陽經藥兼入肺經肺主皮毛葛根陽明經藥兼入脾經脾主肌肉二藥皆發散寒邪而所入不同陽明頭痛陽明頭痛脈浮緩而洪長可用葛根為君若太陽初病頭痛而即用之反引邪入陽明也止腸風血痢清胃熱發痘疹凡痘疹已見紅點勿再服升葛恐表虛反增斑爛散鬱火火鬱則發之義解酒毒葛花更良為治脾胃虛泄之聖藥清氣在下故泄葛根能升陽明清氣按葛根性涼胃寒者禁用二十八升麻味微苦氣浮入脾胃肺與大腸四經忌火蜜炒善散陽明風寒肌表邪熱同蔥白散陽明風邪同葛根發陽明之汗能引甘溫之藥上行補氣而實表同參耆用治陽明頭痛齒疼喉痹同石膏用下痢後重大小便閉氣滯於中必上行而後下降凡久泄脫肛夢遺崩中帶下癰疽痘疹陽虛下陷之類用佐補劑皆所宜也按升麻性陽氣升凡諸火上炎吐衄咳嗽陰虛氣逆者並不可投二十九柴胡味苦微辛微寒入肝膽三焦心包四經前胡半夏為使惡皂莢反藜蘆生用走表酒炒能佐補劑能引肝經清氣上升治傷寒病傳肝經寒熱往來若病猶在太陽即用柴胡則引賊入門如病已入陰經復服柴胡是重虛其表胸痞脅痛屬肝木有餘宜小柴胡湯加川芎青皮白芍口苦耳聾肝膽之邪嘔吐心煩邪在半表半裡諸瘧寒熱邪伏半表半裡適在少陽所主之界頭眩目赤肝膽之火按柴胡味薄氣升善泄善散凡陰虛勞熱及初感風寒皆禁用外有銀州生者根長尺余色微白而軟另是一種可佐補藥能退勞熱疳熱北産者如前胡而軟可用南産者強硬不可用三十前胡味苦辛微甘氣寒入肺脾胃大腸四經半夏為使惡皂莢畏藜蘆皮白肉黑味甘氣香者食忌火性陰而降氣氣降則火降而肝膽風熱之痰自消氣有餘便是火火則生痰解肺經風寒辛也理胸腹痞滿甘也泄肺經之熱苦也散太陽之邪寒也除哮喘咳嗽肺邪嘔逆安胎霍亂安脾療風熱頭痛小兒疳熱按前胡治火熱風痰凡陰虛火動及不因外感而有痰者禁之三十一紫蘇味苦氣溫入肺經宜橘皮忌鯉魚色紫氣香者良味辛入氣分色紫入血分祛風去寒解肌發汗辛也開胃益脾下食消脹氣香而溫梗能順氣安胎子能消痰定喘紫蘇同陳皮砂仁行氣安胎同藿香烏藥溫中止痛同香附麻黃發汗解肌同川芎當歸和血散血同桔梗枳殼利膈寬腸同萊卜子杏仁消痰定喘同木瓜厚朴散濕解暑治霍亂腳氣按氣虛表虛者忌用葉腸滑氣弱者忌用子多服瀉人元氣慎之三十二桔梗味苦辛微涼入肺經兼入心胃二經畏白芨膽草開提氣血表散寒邪能退肺熱清利頭目引藥上行治痰壅喘促鼻塞肺氣滯也喉痹咽痛心火口瘡齒痛胃火肺癰乾咳肺火胸痛火鬱上焦下痢腹痛腸鳴腹滿肺火鬱於大腸排膿行血氣暢下氣消痰肺氣清濁氣自下行耳按桔梗為舟楫之劑引諸藥上於至高之分以成功若攻補下焦藥中不可入也三十三大黃味苦大寒入脾胃大腸肝四經黃芩為使無所畏忌欲速下者生用湯泡即服欲緩效者與藥同煎其性專入血分走而不守能除腸胃燥結宿食瘀血治傷寒溫疫大熱陽狂發黃譫語大腸有燥糞故譫語下之則止下痢赤白裡急後重癥瘕血積積聚或痰食瘀血不等消癰腫化痞滿通二便損傷積血及一切實熱伏火無不蕩淨峻下之功佐甘草桔梗其行則緩助芒硝厚朴其下更速上焦實病酒炒酒煨若腹內熱積便燥酒潤九蒸九曬丸服最效而不傷胃按大黃苦寒病在氣分胃虛血虛六脈不實者禁用三十四黃芩味苦性寒入肺大腸二經山茱萸龍骨為使畏丹皮中虛者名枯芩瀉肺火內實者名條芩瀉大腸火欲上行用酒炒欲瀉肝膽火用豬膽汁炒苦入心寒勝熱枯者清中上二焦之火消痰痰因火動當先降火止嗽定喘肺火退寒熱往來邪在肝經除頭痛屬風熱濕熱喉腥五臭肺為腥目赤咽腫肺癰斑疹瘡瘍退肺火實者解下焦之熱除澼痢便血曰澼痢熱者可用五淋澀痛熱蓄膀胱大腸閉結肺與大腸熱便血漏血下焦熱炒黑用胎因火盛不安酌佐砂仁白朮腹因火鬱為痛可加黃連厚朴按性苦寒胃虛滑泄虛胎不安者均忌之三十五黃連味大苦性大寒入心經龍骨連翹為使惡元參菊花畏款冬牛膝忌豬肉解巴豆附子毒出宣州者粗肥出四川者瘦小狀類鷹爪連珠者良治心火生用虛火醋炒肝膽火豬膽汁炒上焦火酒炒中焦火薑汁炒下焦火鹽水炒或童便炒食積火黃土炒治濕熱在氣分吳茱萸湯炒在血分乾漆水炒瀉心火涼血熱凡治血防風為上部之使黃芩為中部之使地榆為下部之使除痞滿同枳實用治痢疾熱鬱可用若本無火邪而寒濕傷脾者忌用熱瀉土炒驚癇鎮肝消心瘀去心竅惡血嘔吐薑汁炒煩渴同花粉用單服治消渴火鬱腹痛同吳茱萸用心痛伏梁心積目痛安蛔蟲得苦而伏止盜汗涼心退疳熱同豬肝蒸為丸吞酸名醋心同吳茱萸用療惡瘡癰腫諸瘡痛癢皆屬心火吐衄痔漏涼血解毒按黃連苦寒虛寒為病者忌之三十六胡黃連味苦性寒畏惡同黃連功用略似黃連但此入肝膽二經折之塵出如煙者真治虛家骨蒸五心燥熱三消五痔女人胎熱小兒疳熱驚癇明目療痢按胡黃連雖退虛熱必佐補藥可用否則雖見上證不可施用三十七龍膽草味苦澀大寒入肝膽二經惡地黃酒浸炒稟純陰之氣能滌肝膽實熱兼入膀胱腎經除下焦濕熱退骨蒸腎主骨治驚癇肝經風熱去目赤瀉肝膽火可佐柴胡但目疾初起宜發散忌用寒涼殺腸內諸蟲苦也除小兒疳熱涼也咽痛癰腫一切肝腎有餘之火按膽草性寒非氣壯實熱者禁用三十八香附味苦辛微甘入肺肝二經生用走表酒炒行經絡童便炒入血分補虛且能下行鹽水炒入血分潤燥醋炒消積聚薑汁炒化痰飲能行諸經氣分開鬱同川芎蒼朮解表同紫蘇蔥白散滯同木香理氣同檀香清熱同梔子黃連消脹同厚朴半夏消積同三稜莪朮治血氣暖子宮同艾葉止諸氣痛氣行散癰疽一味末服止失血炒黑用調月經氣順則血調按香附辛燥惟氣實血足者宜之若泥於女科仙藥之一語而概用之誤矣三十九砂仁味辛性溫入肺脾胃大小腸腎六經炒用開脾胃芳香而性溫潤腎燥辛也若腎虛氣不歸元宜用此嚮導和中氣辛溫治腹痛噎膈嘔吐霍亂祛痰逐冷消食消脹悉屬胃寒赤白瀉痢濕熱滯於大腸砂仁亦能入之安胎止痛因其氣滯氣順則胎安氣行則痛止但須連殼炒研不可過用多服耗氣必致難産散咽喉口齒浮熱醒酒凡一切虛寒凝結氣滯之證所必須也按砂仁性燥若肺熱咳嗽氣虛腫滿火熱腹痛血熱胎動皆所禁用四十附子辛甘有毒畏人參黃耆甘草緑豆製法刮淨黑皮及肚臍切作四片童便浸三日洗淨米泔浸二日俱每日更換後用甘草煎汁待冷浸一日濾干鋪於碗內蒸熟不得過熟薄咀片微火焙乾忌日曬若中寒陰甚宜濕紙包煨開拆即用氣味大熱純陽其性走而不守通行諸經能助補氣補血藥一時成功引發散藥以逐在表之風寒同乾薑桂枝用溫暖藥以祛在裡之寒濕同白朮乾薑用治傷寒傳變三陰及陰證似陽此論已詳傷寒陰證門凡中寒中風氣厥痰厥虛寒厥逆咳逆風寒嘔噦胃寒噎膈胃冷脾泄命火不足冷痢霍亂轉筋寒客中焦為霍亂寒客下焦肝腎為轉筋若霍亂屬熱者忌用拘攣癥瘕積聚小兒慢驚痘瘡灰白癰疽不斂寒疝脹滿蛔蟲麻木格陽喉痹陽虛二便不通暖腰膝堅筋骨一切沉寒冷痼之病無論在表在裡但脈細無神者所宜急用按附子退陰益陽祛寒濕之要藥也若誤用於陰虛內熱及婦人有孕者下胎甚速禍不旋踵烏頭即附子之母也性輕疏溫脾以去風寒證用附子風證用烏頭均補下焦治各稍異天雄細而長也治主寒濕冷痹歷節拘攣開關利竅辛熱善竄與烏頭同功烏附尖以漿水磨服大吐風痰治癲癇有效側子旁生而不圓者治手足風濕諸痹善於發散四十一半夏味辛溫有毒入心脾胃三經水浸七日逐日換水瀝去涎切片薑汁拌得薑而功愈彰反烏頭其質潤滑大便燥者宜用其性燥濕痰涎不生和胃健脾去濕止嘔脾健治咳逆除痰頭眩痰升則眩發表開鬱味辛痰厥頭痛眉稜骨痛風熱與痰痰瘧不眠胃不和也半夏能和胃氣而通陰陽咽痛喉痹辛以散之反胃吐食痰膈散痞除癭多屬痰者老人虛祕滑潤利二便辛走氣兼滑潤按半夏主治多宜脾濕之證俗以為燥不知濕去則土燥痰涎不生非其性燥也若血家渴家汗家及陰虛咳痰孕婦悉忌之若孕婦胃不和嘔吐不止者加薑汁微炒用之無妨四十二南星味苦辛溫有毒入肝脾肺三經冬月研末入牛膽中懸風處數次佳平肝療風木動風搖身強口噤麻痹驚癇頭眩皆風痰也破堅消癰利膈散血辛散小兒急驚須用膽制按南星專主風痰半夏專主濕痰其用不同若陰虛燥痰及孕婦皆忌之制用白礬湯或入皂角汁浸三日每日換水曬乾用四十三貝母味辛苦微寒入心肺二經去心糯米拌炒瀉心火苦也散肺郁辛也治虛勞痰咳心火降則肺寧肺痿肺癰吐血咯血喉痹消渴皆君相之火癭瘤乳閉産難乳癰散結除熱敷惡瘡人面瘡治之即愈斂瘡口火降邪散按貝母潤治肺經燥痰半夏燥治脾經濕痰誤用有害若胃寒脾虛噁心泄瀉及腎虛水泛為痰者均忌之大粒者名土貝母其解毒化痰散郁除熱之功居多小者名川貝母而潤肺化痰之力則優耳二者俱反烏頭四十四天麻味辛入肝經酒浸煨熟焙乾用但性緩力輕用須加倍入肝經氣分治眩運頭旋麻痹語塞小兒驚癇諸風掉眩皆屬於肝用此和肝諸疾自瘳利腰膝強筋骨此皆屬肝宜此補之按天麻是治風神藥但能燥血須兼養血藥用之四十五香薷味辛氣溫入肺胃二經治夏熱乘涼飲冷陽氣為陰寒所遏以致頭痛發熱煩躁口渴吐瀉霍亂六脈浮緊用此以發越陽氣如冬月之用麻黃也若中熱者忌之詳暑證門皆治之清小便治暑者必利濕消濕腫小便清則腫消治口臭煎湯含漱按香薷乃夏熱受寒解表之劑若勞役受熱大渴大寒而元氣傷者宜用清暑益氣湯之類誤用香薷是重虛其表而濟之熱其危也必矣味辛溫宜涼服四十六荊芥味辛苦而溫入肝經氣分兼入血分發汗散風逐瘀血破結氣辛也清頭目利咽喉解肌清熱性浮味苦助脾消食氣香而溫故入脾經治産後中風強直昏迷研末酒服並吐血衄血腸風崩中血痢用穗炒黑散瘰癧瘡腫破結清熱痘後癰腫餘熱療痘癢濕痹辛散而苦為瘡病風病血病聖藥但風在皮裡膜外者宜之非若防風之入人骨肉也四十七藁本味辛氣雄而溫入足太陽經治本經頭痛連腦者宜藁本防風酒炒升麻脊強而厥屬太陽經督脈婦人陰腫作痛皆太陽經陰寒胃經風濕泄瀉辛溫能除風濕解酒齄粉刺和白芷作面脂按藁本氣雄味辛若內熱頭痛及春夏溫暑之病不宜進也四十八懷牛膝味苦酸平入腎肝二經酒蒸用能補生用散血強筋骨利腰膝解拘攣肝為血海而主筋腎主骨肝腎得補諸疾咸安理下焦骨痛足痿血行痛止陰痿筋衰失溺腎虛生用破癥結血行則結散治淋痛尿血化膀胱蓄熱經閉難産下行之效誤用墜胎出竹木刺搗爛敷之縱口合自出療喉痹齒痛引火下行同麝搗納陰中下胎甚速按牛膝性下行上焦藥中勿入且性滑若夢遺失精氣虛下陷血崩因而腿膝腫痛者禁用川牛膝去腳膝風濕非補劑可用四十九車前子味甘寒入肝小腸二經酒拌蒸曝用利小便除淋瀝澀痛滲膀胱濕熱也散目赤障翳能除肝熱止暑濕泄痢濕去瀉止強陰益精有子明目腎有二竅車前子能利膀胱濕熱之水竅而不入命門真陽之精竅精足則目明人久服補腎固精藥服此交合即有子但性滑下行誤用下胎若陽氣下陷腎氣虛脫者勿用根葉甘寒涼血除熱治血衄尿血熱痢下血通淋搗汁飲之兼除小蟲五十澤瀉味甘鹹入腎膀胱二經利水宜生用入滋陰藥鹽水炒用建産者佳去腎經伏火瀉膀胱濕熱止消渴渴因小水短黃濕熱去則清長而渴止瀉痢腫脹尿血淋痛濕熱之害行痰飲除嘔吐濕也收陰汗腎濕按澤瀉性降善瀉多服昏目瀉腎若腎虛精滑目不明及無濕者禁用至於地黃丸中用之以瀉腎中濕熱則補藥得力庶無偏勝之害但分量宜輕不得如古方之用二三兩也五十一木通味辛甘而淡入心包心肺大小腸膀胱五經懷産者佳體輕而鬆兩頭皆通降心火清肺熱肺金為水源火降肺清則津液化而水道通矣通大小腸凡利小便者必燥大便本通能導諸濕熱從小便出故兼通大便治胸中煩熱大渴中焦火淋瀝不通下焦火也心與小腸相表裡心移熱於小腸並膀胱濕熱則淋祕口燥舌乾舌為心苗喉痹咽痛上焦火遍身拘痛身熱足冷伏熱傷血血屬心木通以通心竅則經絡流行除水腫利小便耳聾腎火瀉則竅通失音清金催生行經下乳下行之效若君火為邪宜用木通相火為邪宜用澤瀉利水雖同用各有別按木通性寒通利凡精滑氣虛內無濕熱汗多者及妊娠均忌五十二石菖蒲味苦辛氣溫入心脾二經石上生一寸九節者佳米泔浸飯上蒸用或炒用忌鐵芳香利竅辛溫達脾可聰耳明目開心長智治風寒濕痹止小便溫也咳逆上氣辛也開胃寬中療噤口毒痢同參苓白朮散研末米飲下胸次一開自然思食然後治痢避邪逐鬼端午挂門葉似劍根芳香療惡瘡散癰腫宜搗汁多服開耳聾作末炒熱絹包塞耳發聲音通竅去頭風止小便辛也安胎並止産後下血按菖蒲香燥陰血不足者忌之五十三山藥又名薯蕷味甘微咸性澀入肺腎脾三經生用滋陰炒黃補脾治諸虛百損五勞七傷清虛熱補陰固腸胃味甘止瀉痢遺精性澀帶濁同骨脂用補中益氣色白入肺補腎健骨味鹹入腎同菟絲用按山藥和平無往不宜但性緩非多用無益且難圖近功忌與面同食五十四延胡索味辛氣溫入肺脾肝心包四經酒炒行血醋炒止血生用破血炒用調血欲上行酒炒下行鹽水炒能行氣中血滯血中氣滯調月水氣血凝滯而痛氣血不和因不以時至治産後血逆上衝用酒煮或用酒磨通經療疝化癖舒筋心腹小腹諸痛除折傷積血皆活血化氣之效按延胡索走而不守惟有瘀滯者宜之若血虧氣虛妊婦者均忌之五十五白豆蔻味辛氣溫入脾肺二經去衣微炒行三焦暖脾胃辛溫利肺氣除嘔逆治翻胃宿食膨脹噎膈胃寒氣滯祛瘧疾脾虛生痰去白睛翳膜白睛屬肺能散肺滯解酒毒胃口冷痛除寒燥濕按白豆蔻辛溫火升作嘔因熱腹痛肺火痰嗽者忌之五十六草豆蔻味辛性溫入肺脾胃三經閩産者是容如砂仁辛香氣和或飯包煨或面拌炒熟研碎用破滯氣除寒氣止心腹冷痛溫也治脹滿吐酸積聚噎膈霍亂瀉痢辛熱香散按草豆蔻雖能暖胃健脾但性辛燥不得過服若陰虛而血不足者禁之殺魚肉毒嗽除口臭五十七草果味辛氣猛入胃經飯包煨熟用辛烈氣雄治瘟疫初起瘟疫毒在膜原宜治以達原飲同檳榔厚朴用可除伏邪盤踞祛嶺南瘴氣截瘧消痰佐常山能截瘧或與知母同用草果治太陰之寒知母治陽明之熱取其一陰一陽按草果辛烈若瘧疾者氣不實邪不盛須當酌用五十八肉豆蔻味辛性溫入胃大腸二經麵包煨透去油忌鐵理脾暖胃辛溫氣香下氣調中脾得補而善運氣自下也非若陳皮香附之泄耳逐冷祛痰治大腸虛冷滑泄性溫而澀初泄者忌用開胃進食除霍亂腹脹挾痰挾食者並宜之消食解酒並治小兒吐逆乳食不下胃寒行滯止痛氣香而辛按肉蔻性溫而澀若濕熱積滯火熱暴注泄瀉者禁用五十九補骨脂辛苦大溫入心包命門二經酒蒸或鹽水炒用忌蕓薹羊血惡甘草固下元暖水藏治下焦無火腎冷精流五更腎泄脾虛發泄補相火即所以補脾縮小便療遺尿陰冷囊濕皆屬命門火衰除腰膝冷痛腎足納氣定喘以其性降婦人血脫氣陷亦猶男子之腎冷精流按補骨脂能補相火以通君火脾土自旺但性燥凡血虛有熱非其所宜妊婦禁用六十益智仁味辛性溫入心脾腎三經去殼鹽水炒研碎用主君相二火如三焦命門陽氣衰弱者皆宜溫中進食土中益火攝涎唾治泄瀉嘔吐腹痛屬胃冷者宜之縮小便止遺精崩帶溫腎之功開鬱散結辛也按益智仁其性行多補少須兼補劑用之若獨用則散氣六十一使君子味甘性溫入脾胃二經忌熱茶犯之作泄健脾胃甘溫治疳積脾胃虛弱以致乳停食滯而然殺蛔蟲每月初一至初五蟲頭向上空心生食或煨食數枚蟲皆死而下餘日不效按使君子性滑多食傷脾出閩蜀內仁新鮮者良久而油黑者不效若無蟲積者不必服六十二刺蒺藜味苦微辛微溫入肺脾腎三經酒炒去刺治虛勞腰痛遺尿泄精苦溫補腎之功瀉肺氣而散肝風除目赤翳膜肝以散為補凡補肝藥皆能明目療白癜瘙癢破癥結積聚辛以散之療肺癰乳岩濕瘡能消風解毒妊婦忌用六十三沙苑蒺藜緑色似腎強陰益精止遺瀝尿血縮小便補腎但興陽澀精宜酌用之不得自誤市多偽者狀似腎子咬之作生豆氣者真六十四肉蓯蓉味甘酸微咸性溫入腎經血分重斤許而鮮紅者良酒浸一宿刷去浮甲劈破除內筋膜酒蒸半日用忌鐵大補命門能益水中之火甘溫潤五臟益精髓治男子絶陽不興遺瀝泄精女人絶陰不産血崩帶下補陰助陽理勞傷暖腰膝堅筋骨廣子嗣補腎之效除莖中澀痛大便乾燥性滑按蓯蓉溫而不熱補而不燥故有蓯蓉之名但性滑若泄瀉及陽易舉而精不固者忌之六十五鎖陽味甘鹹性溫入腎經補陰益精潤燥滑腸養筋壯骨補腎治痿弱不舉按鎖陽與蓯蓉相仿功用禁忌亦同六十六巴戟天味甘微溫入腎經兼入心經酒浸去心微炒用強陰益精禁夢遺精滑虛損勞傷健筋壯骨陰痿腰疼及夜夢鬼交小腹陰中相引疼痛補腎之功養心神安五臟精血足也若相火熾者勿用六十七胡蘆巴味苦性熱入腎膀胱二經出嶺南是番地萊蔔子酒浸或蒸或炒用苦溫純陽入右腎命門治腎經虛冷同附子硫黃用療膀胱疝氣同大茴巴戟川楝吳茱萸用寒濕成疝肝疾也元臟暖則筋自和而疝愈此肝腎同治乙癸同源之理也按胡蘆巴性陽若相火熾而陰血虧者禁之六十八菟絲子味甘辛微溫入脾腎肝三經氣分淘淨泥砂揀去雜子酒蒸曬乾磨末即用勿使出氣若用古法制餅則失性無功矣溫而不燥不助相火誠補腎中精髓之聖藥也治精冷淋瀝暖臂腰痛膝疼堅齒明目強陰莖止夢遺腎足之效健筋骨續絶傷能補肝腎益氣力肥肌膚補脾療口苦燥熱脾虛腎燥而生內熱菟絲益陰清熱按菟絲性溫強陽不痿者忌之六十九覆盆子味甘酸氣溫入肝腎二經去蒂酒蒸起陽固精補腎傷縮小便益腎而助封藏明目舒筋補肝女人多孕溫補肝腎按覆盆子強腎而不燥固精而不澀金玉之品也若小便不利者禁之七十蛇床子味辛苦而溫入脾腎二經微炒去毒以生地黃汁拌蒸半日曬乾用去脾經之濕補腎經之虛益陽滋陰治陽痿陰汗縮小便廣子嗣健腰膝溫補腎臟利關節除頑痹辛能散風祛寒止帶濁補脾燥濕療男子陰囊濕癢女人陰痛陰癢濕生蟲同礬煎湯洗子藏虛寒産門不閉炒熱尉之婦人無娠最宜久服凡濕癬疥癩殺蟲止癢大風身癢作湯熏洗按蛇床子溫燥腎家有火忌用七十一仙茅味辛氣溫入腎經有毒用糯米泔浸二日去赤汁則毒去矣忌鐵器禁牛乳牛肉助命門相火填骨髓強筋骨暖腰膝溫腎之功治心腹寒痛開胃口消宿食益火生土耳目聰明心神強記腎足上交於心按仙茅補火男子精寒婦人子宮虛冷不孕最宜多服若陰虛火盛者忌用加於各補藥中為丸服之無所不可七十二知母味苦性寒入肺腎二經氣分黃柏入二經血分二者相須而行上行酒浸下行鹽水浸忌鐵上清肺火下潤腎燥消痰火降則痰消定咳清肺火止渴兼清胃火退有汗之骨蒸瀉腎火治傷寒煩熱久瘧下痢安胎清熱之用利二便消水腫小便利則腫消按知母寒滑用以瀉腎家有餘之火則可如丹溪用以補陰則大傷胃氣發泄不食而死故陰虛火炎者切不可用七十三紫菀味苦辛溫入肺經血分款冬花為使洗淨蜜水蒸焙用白者名女菀入肺經氣分辛溫潤肺苦溫下氣補虛調中消痰止渴治痰喘上氣咳吐膿血辛溫入肺能開喉痹辛也小兒驚癇虛熱按紫菀其性辛溫惟肺實氣滯鬱火刑金而致咳唾膿血者乃可用之若勞傷肺腎水虧金燥而咳喘失血則非所宜當細辨之七十四葳蕤一名玉竹味甘平入肺脾肝腎四經滋益陰精增長陽氣不寒不燥和平之品也可止嗽痰潤肺能去濕熱補脾治眥傷淚出養肝除腰痛莖寒益腎大便乾燥日用二兩煎服性潤按萎蕤陰陽並資未有專功性緩力薄難圖急效倘證屬迫促雖用斤許不及參耆數分若大便溏者更為忌之或生用或蜜水拌蒸隨宜七十五廣木香味辛氣溫形如枯骨者佳入肺脾肝三經行積化滯宜另磨沖服若藉以調氣宜和劑同煎煨熟止泄辛溫入三焦氣分能升降諸氣泄肺氣辛以泄上焦肺氣之滯痛和脾氣香以運中焦脾氣之滯疼疏肝氣通以疏下焦肝氣之鬱結治一切心腹胸脅氣逆諸痛療熱痢同芩連用後重屬大腸氣滯同檳榔癃閉屬膀胱氣不化同小茴五苓之類止吐瀉霍亂和胃除脹痛厄逆散寒癥積惡逆順氣調經安胎氣逆則不安寬中消食健脾按木香香燥而偏於陽肺虛有熱血枯而燥者慎勿犯之七十六藿香味辛微溫入脾肺二經枝葉同用以葉多偽也稟清和芳香之氣為脾肺快氣要藥溫中開胃止嘔進食胃弱胃熱而嘔者大非所宜治霍亂吐瀉心腹絞痛冷也肺虛有寒上焦壅滯右寸脈緊用以運脾肺之氣健脾胃同烏藥用除口臭同四君用若陰虛火旺而嘔逆者禁用七十七大茴香味辛微苦性溫入心腎及胃小腸膀胱五經出寧夏自番舶來形八瓣炒黃得酒良得鹽則入腎暖丹田補命門治小腸冷氣疝痛陰腫腰痛性溫宜腎暖命門也調中止痛平霍亂吐逆辛香入胃並理乾溼腳氣按大茴辛溫若陽旺及得熱則吐者均戒小茴香如粟米而扁者功用與大茴略同亦治疝痛凡化膀胱之氣而使小便通暢為更優耳七十八黃精味甘平入脾經九蒸九曬補脾益氣味甘除風濕下三蟲土旺之用安五臟潤心肺填精髓耐寒暑得土之沖氣味甘氣平久服方效按黃精和緩之品值急迫之頃而欲恃為補益不能也七十九蒲黃味甘微寒入心包肝二經為厥陰血分涼血活血之藥生用性滑行瘀血通經脈祛腹痛同五靈脂治血氣痛療撲打去瘀生新治舌腫用蒲黃少加乾薑末頻摻即消舌為心苗心包相火乃共臣使得乾薑是陰陽相濟也炒黑性澀止吐血衄血崩血腸風胎漏一切血熱妄行然外因從標之血可建奇功若內傷不足之吐衄不能收效也八十何首烏味苦甘澀微溫入肝腎二經茯苓為使忌豬血元鱗魚蘿蔔蔥蒜鐵器選大者赤白二種合用泔浸竹刀刮皮切片用黑豆煎汁拌濕九蒸九曬填補真陰增長陽氣強筋骨溫補肝也廣嗣續苦堅腎澀斂精也療風淫甘益血血足則風散並治虛勞崩帶瘡痔癰腫胎前産後等證由溫澀收斂之功則真元復而邪自散也止瘧疾益陰補肝瘧疾要藥烏髭發精血足也按何首烏性效稍緩必久服之乃知為滋生益壽之食品也八十一牡丹皮味苦微辛心經正藥兼入肝腎陰分白者補赤者利生用瀉實熱胃虛者宜酒浸炒瀉血中伏火即相火也人知用黃柏不知丹皮之功更勝和血涼血而生血血熱則枯涼則生去瘀生新瘀不去則新不生治一切血熱吐衄妄行血屬陰本靜因相火逼而動之中風虛勞煩熱血虛則熱驚癇瘛瘲筋脈伸縮抽掣為瘛瘲手足亂動口眼喎斜卒然眩僕為癇病皆陰虛血熱風火相搏痰隨火湧也下胞胎退無汗之骨蒸與地骨皮退有汗之骨蒸不同若經行過期而不淨者勿服八十二艾葉味苦氣辛微溫入肺脾肝腎四經苦酒香附為使陳久者良生用微溫熟用掌中揉如綿者謂熟艾微熱其性純陽能通十二經脈善理女人氣血寒滯溫中開鬱調月經暖子宮使孕早結辛溫之用安胎止漏胎動腰痛下血四物湯加阿膠艾葉治崩帶要藥療腹痛冷痢霍亂轉筋皆理氣血逐寒濕之功殺蛔治癬醋煎搽下部𧈟瘡苦溫燥濕及一切冷氣為患或搗汁或煎湯或揉熟灸火用灸艾火痛則易之勿至傷皮起泡總以多灸數十壯連日灸為妙能透諸經而治諸毒百病或炒熱敷尉可通經絡臍腹冷痛寒濕腳氣以熟艾裝袋裝襪溫之甚效若血熱生燥者忌之婦人欲為丸散去筋醋煮搗餅焙乾入茯苓數片再研為末易細八十三紅花味甘微苦微辛入心肝二經血分潤燥行血酒炒行血之要藥也少用可活血同當歸則生血多用能破血佐肉桂則散瘀瘀行則血活紫黑血吐盡為好吐未盡加桃仁紅花以行之大抵鮮血宜止瘀血宜行下死胎療産後血暈止用三四分達痘瘡及血熱難出治經閉行血消腫痛凡血熱血瘀則作腫作痛按紅花性多行血若過用能使血行不止而斃八十四菊花味甘微辛入肺腎二經去蒂用備受四氣冬苗春葉夏蕊秋花飽經霜露能益金水二臟肺腎金以平木肝也水以制火心也木平則風息火降則熱除故能養目收淚去翳膜與枸杞蜜丸服永無目病治頭風頭痛眩暈風熱性輕故能上巔疔毒危急者以葉搗爛入酒絞汁服之其滓敷於毒上神效多收花作枕除頭風保目黃者入陰分白者入陽分紫者入血分可藥可餌可釀八十五萆薢味甘苦性平淡須重用乃效入脾肝二經祛風去濕濕入脾虛主肉風屬肝虛主筋治筋骨攣痛腰膝冷疼此風寒濕痹也惟此治之既可去膀胱宿水又能止痢止瀉膀胱有出水之路無入水之路由紅絲引入因濕熱祕塞水不從小便出而從大便出所以泄痢豫每用萆薢四五錢於和脾利水藥內一刻立愈療小便頻數莖中切痛此與淋證小便澀而痛者不同有治法載於淋癃門按萆薢利濕如陰虛火熾及無濕而腎虛腰膝痛者勿用有黃白二種白而虛軟者佳八十六土茯苓一名仙遺糧味甘淡性平和入脾肝二經分清去濁淡能滲也扶脾健胃甘能補也治周身寒濕諸痹利關節強筋骨去風濕之功分水道止泄瀉療瘡腫濕鬱為熱榮衛不和則生瘡腫此能去濕尤解楊梅惡毒土茯苓一兩同苡仁銀花防風木通木瓜白鮮皮各五分皂角子四分氣虛加參耆血虛加當歸多服久服縱先用過輕粉劫劑而齒爛毒伏經絡而拘攣罔不全愈按土茯苓主治與萆薢同服此者忌茶及酒牛羊雞鵝等物亦有黃白二種白者良可煮食亦可生啖八十七旱蓮草俗名墨斗菜味甘鹹而平入腎肝二經汁出即黑純陰之品性涼滋陰以汁黑也止血涼也烏鬚髮堅牙齒汁黑補腎但陰寒壞胃宜薑汁椒紅同用否則必腹痛作瀉八十八秦艽味辛苦微溫入肝胃二經酒浸用苦能泄辛能散微溫能通利祛風去濕養血舒筋治周身攣急骨節疼痛風也黃疸便澀腸風下血濕熱也骨蒸勞熱養血止牙痛齒下齦屬陽明大腸能入胃清熱按下部虛寒及小便不禁大便溏泄者忌用八十九青蒿味苦微寒入肝膽腎三焦四經童便浸一夜曝乾用稟天地少陽之氣以生二月生苗故入少陽膽肝血分除陰分伏熱故治骨蒸勞熱童便浸葉搗汁熬膏更良蓐勞産後勞虛熱芬香入脾涼血而不傷胃殺鬼疰傳尸伏內庚日採蒿懸門庭可避邪鬼冬至元旦各服二錢良按青蒿苦寒善治血虛發熱若寒而泄瀉者仍當避之九十金銀花味苦平入脾經甘寒清熱解毒清熱即是解毒治癰疽腫痛楊梅一切風濕諸毒花葉同功花香尤佳治惡毒初起用花五兩甘草一兩煎就再入酒略煎日二劑服至大小腸通利則藥力到矣瘰癧用一兩許時常煎服血痢清熱之用療毒安後發渴同黃耆六一湯服補虛味甘能補疽未成能拔毒而散已成能托毒而穿或搗汁和酒頓飲或研爛和酒厚敷生藤力更大一名忍冬花又名鷺鷥藤九十一石斛味甘平入胃腎二經酒浸蒸用退火養陰除脾胃之熱頗有苦味除煩止渴清胃理腳膝痹弱補腎安神定驚腎足上交於心長肌止泄入胃利濕按石斛如金叉股短而中實生石上味甘者良但體瘦味淡煎難見功熬膏乃效若長虛味苦名木斛誤用損人九十二薏苡仁味甘微寒入脾肺二經生用走肺門足門炒用入脾門虛門性緩宜重用甘能補脾淡能滲濕治水腫瀉痢補脾滲濕肺痿肺癰咳吐膿血土益則金生性涼則熱清一切肺病以豬肺蘸苡仁末多服自愈除腳氣疝氣利小便療熱淋性降而去濕祛風熱痿弱拘攣扶土所以抑木筋寒則急熱則弛濕則縱苡仁去濕要藥因寒因熱者皆宜用按大便燥結因寒轉筋及妊娠均忌九十三百合味甘微寒入心肺二經潤肺寧心治虛勞久嗽勞嗽肺必虛百合之甘斂勝於五味之酸收定驚悸心寧止涕淚涕為肺熱淚為肝熱療肺痿清熱保肺利二便微寒解熱除百合病行住不寧如有神靈謂百合病仲景以百合湯治之亦清心安神之效也按百合氣平功緩難圖速效若中寒者勿用九十四天花粉味酸甘微苦寒入心脾二經酸能生津苦能降火潤肺滑痰治膈上熱痰時疾熱狂性苦寒止消渴疸黃口燥胃經實熱療腫毒乳痛排膿生肉苦能退熱按天花粉氣味清寒可以治渴但宜於有餘之陽證若汗下後亡陽作渴陰虛火動津液不升作渴病證在表作渴及脾胃虛寒泄瀉者並宜深戒九十五栝蔞仁味甘性寒入肺經微炒去油用性降而潤能清上焦實火治痰嗽肺受火逼失下降之令故生痰作嗽生津止渴開鬱通乳療結胸胸痹仲景小陷胸湯用之又云少陽症口渴者小柴胡湯以此易半夏通大便潤下小便焙研調米湯下炒香酒服止一切血熱妄行寒降火按栝蔞仁氣味悍劣善動噁心嘔吐及中氣虛寒泄瀉者勿用九十六續斷味苦辛微溫而澀用川産節節斷皮黃皺如雞腳折之有煙塵者真入肝腎脾三經酒浸用滋陰益氣養肝辛溫補腎苦溫兼入脾經養血活血補勞傷甘也理筋骨折傷以功命名消癰痔腫毒味苦止上下一切血溢縮小便腸風血痢遺精帶濁胎漏味澀暖子宮性溫女科外科要藥補而不滯行而不瀉佐之以甘草地黃之類其效尤捷九十七萹蓄味苦性涼入膀胱經殺蛔蟲利小便治癃淋理蟲蝕下部皆去濕熱之功按萹蓄直遂不能益人不宜恆用九十八燈芯味甘淡性寒入心小腸二經其質輕通清肺熱降心火心能入心利小便使心經蘊熱從小便而出心與小腸相表裡心火清則肺清小腸亦清為上焦伏熱治五淋之聖藥消濕腫利水除喉痹燒燈草灰吹之止小兒夜啼燈芯燒灰塗乳頭令咀之療金瘡燒灰敷之血止肌生除消渴敗席煮服更勝治下疳瘡亦用燒灰加輕粉麝香為末摻之良若虛脫證小便不禁者忌之九十九白鮮皮味苦寒性燥入脾胃小腸膀胱四經解熱苦寒除濕利小水也治諸黃熱黃酒黃急黃谷黃皆屬濕熱療筋攣死肌受地濕氣之害善理一切瘡瘍眉發忽落女人陰中腫痛濕熱乘虛客腎與膀胱所致小兒風熱驚癇時行大熱飲水狂燥苦寒之效按下部虛寒者雖有濕證勿用一益母草味辛甘微寒微溫入心包肝二經補而能行辛而能潤總調胎産諸病去死胎安生胎活血行血治血風血運血淋胎漏崩中帶下白帶屬氣虛用補中益氣而兼補脾燥濕赤帶屬血虛用滋陰養血而兼調氣調經瘀血去則經調化乳癰散瘀解毒退浮腫下水氣通二便取其滑利按性辛散惟血熱血滯及胎産艱澀者當用若氣血素虛寒而下陷者不宜不得謂婦人所必用也瞳子散大者亦忌服子名茺蔚主治略同但子味甘稍溫故能涼血補血根莖花葉專於行子則行中有補令人有子有補陰之功明目血滯病目者宜之忌鐵微炒用一一薄荷味辛微苦微涼入肺經辛能散涼能清消散風熱治傷寒頭痛寒熱升浮能發汗解表舌苔語澀含漱或和蜜擦之療頭風腦痛中風失音皮膚癮疹咽喉眼目口齒諸病辛能通竅涼能散風清熱除脹滿霍亂宿食辛香開氣療血痢血痢屬凝滯辛能散涼能清小兒風涎驚癇凡治驚藥宜用薄荷湯調按薄荷辛香伐氣虛弱者勿服一二鬱金味辛苦性寒入心肺肝胃四經純陰之品涼心熱散肝逆解肺金之郁故名善降逆氣破血中之滯治吐血衄血血上行皆屬火炎此能降氣氣降即火降而性又入血故能導血歸經産後敗血攻心癲狂迷心痘毒入心鬱金一兩甘草二錢煮乾焙研末入冰片四分每用一錢加豬血七滴新汲水調下治斑痘始有白泡忽搐入腹紫黑無膿下蠱毒同升麻用不吐則下療婦人經血逆行用鬱金末加韭汁薑汁童便其血自下痰中帶血者加竹瀝如陰虛火亢吐血非氣逆者勿用一三薑黃味苦辛溫入肝脾二經色黃入脾兼入肝經破血下氣治心腹氣結氣脹冷氣食積疼痛辛溫下氣療癥瘕血塊通月經及撲損瘀血散腫消癰皆破血之用別有一種片薑黃止臂痛有效若血虛腹痛臂痛而非瘀血凝滯者忌用一四三稜味苦辛甘入肝脾二經血分醋炒用苦能瀉辛能散能行血中之氣治一切有形之血積如癥瘕之類善破氣滯從氣藥則破氣消宿食脹滿腫痛辛能散通乳墮胎按三稜瀉真氣東垣五積諸方皆有人參贊助如專用克削脾胃愈虛不能運行積安得去乎一五莪朮味苦辛氣溫火炮入氣分醋炒入血分肝經血分藥善破氣中之血能通肝經聚血消瘀血通月經療撲傷滯血作痛婦人癥瘕男子痃避小腹積也治氣滯膨脹氣腫水腫香烈行氣同三稜用治積聚諸氣但其性剛氣烈非有堅頑之積不宜用兼以參朮乃得無損亦須適可而止一六白茅根味甘寒入心肺脾胃四經除內熱甘寒性入血分下達州都引熱下行治吐衄諸血心肝火旺逼血上行則吐血肺火盛則衄血茅根甘和血寒涼血故效撲損瘀血搗汁服亦治鼻衄血閉寒熱血瘀則閉閉則自作寒熱淋瀝崩中血熱則妄行傷寒厄逆解喘急肺熱煩渴胃熱黃疸水腫清火行水療疽毒癤毒用根搗敷或酒煮服俱效按茅有數種白者為勝春生芽布地如針潰癰酒煮服一針即潰一孔大奇按血有因於虛者非所宜也一七白前味甘辛微溫入肺經甘草湯泡去須焙用形似白薇特脆而易折不若白薇之軟而難折也甘能緩辛能散溫能下氣治氣逆咳嗽不能睡臥氣壅膈也療喘呼欲絶氣衝喉也喉中作水雞聲氣塞咽嗌總之能清肺家濕痰停飲體腫脹滿大有神功按白前無補益肺實邪壅者宜之否則忌用一八白薇味鹹百寒入胃經衝任之藥利陰氣下水氣治中風身熱昏迷陰虛火旺則內熱生風故身熱痰隨火湧故昏迷血厥汗多後少陽旺氣塞不行而厥婦人尤多此症溫瘧寒熱痠痛寒熱作榮虧故一身痠痛婦人淋露胎前産後遺尿不知白薇白芍等分為末酒調服調經多子婦人不孕因血虛而熱陰不足而陽勝也白薇益陰清熱而有子矣須佐以歸地白芍杜仲蓯蓉等藥按性寒脾虛作瀉者忌用似牛膝短小而柔軟去須酒洗用惡大黃山茱薑棗一九白芨味苦辛平微寒入肺經反烏頭辛為金味收為金氣得秋金之令治肺損吐血肺癰肺痿白芨末米湯調服療惡瘡敗爛鼻衄火傷去腐生新排膿止痛俱可為末敷之跌打骨折酒調末服二錢按白芨性寒癰疽潰後不宜用苦寒藥服一一連翹味苦辛性寒入心肺胃膽大腸五經去心與間用瀉心經客熱除脾胃濕熱為治十二經瘡毒聖藥血凝氣滯兼有心火乃生瘡毒連翹俱能治之凡腫而痛者為實邪腫而不痛者為虛邪腫而赤者為熱結腫而不赤者為留氣停痰並能利水苦也通經辛也按連翹苦寒多餌壞胃減食慎之瘡潰後及虛熱者忌投一一一夏枯草味苦辛性微寒入肝經稟純陽之氣冬至生夏至枯補肝血緩肝火治瘰癧癭瘤鼠瘻辛散結也療目珠夜痛如神目眥白珠屬陽故晝痛點涼藥則效黑珠屬陰點涼藥則劇用夏枯草純陽之品而勝濁陰且散厥陰鬱火同香附各二兩甘草四錢為末茶調服下咽即愈及鬱怒所成乳岩乳癰一切腫痛俱效解內熱散結氣按夏枯草辛寒久用亦損胃家一一二大薊小薊味甘溫入心肝二經涼血行血補血治吐血衄血唾咯諸血沃漏崩中安胎涼血之效及婦人痘疹經血妄行但小薊力微能破瘀生新退熱補虛不能及大薊之消癰腫也按二薊理血之外無他長不能益人大薊莖高葉皺小薊莖低葉不皺皆用根一一三旋覆花一名金沸草味鹹甘微溫入肺大腸二經咸能潤下軟堅辛溫能通行破結化痰結堅痞能飲辛溫噫氣俗作噯胸中氣不暢故噯以通之屬不足亦有挾痰挾火者屬有餘須憑脈證辨之利濕痹潤大腸消水腫辛能下氣行水然走散之藥冷利大腸虛寒人禁之一一四三七味甘氣溫微苦入胃肝二經血分散血定痛治刀傷箭傷軍中寶之跌撲杖瘡杖時先服二錢則血不衝心凡一切血出不止嚼爛塗之或為末摻之亦治吐血衄血血痢崩漏經水不止産後惡血不下俱宜自嚼或為末米湯調下療癰腫痛醋磨塗之即散已破者為末摻之按三七近時始出有似竹節者有似人參者俱可用但以末摻豬血中血化為水者真一一五地榆味苦寒入肝經味苦厚性沉降治下焦血證兼去濕熱止吐衄崩中血虛忌用除腸風詳載便血血痢血熱斂盜汗性澀止赤腫瘡毒疼痛苦寒按地榆寒而下行凡虛寒下血及崩帶者並宜禁之似柳根取上截炒黑用梢反行血一一六瞿麥味苦寒性滑利入膀胱經降心火利小腸心與小腸相表裡故心火從小腸下除五淋淋多屬濕熱利水故濕除消目腫痛同涼藥用通經破血下胎性滑心下焦濕熱疼痛者皆可用之療産後淋同蒲黃用按瞿麥雖遂膀胱邪熱但小腸虛者忌服一一七茵陳味苦性寒入膀胱經燥濕苦也除熱寒也瀉脾胃濕熱佐五苓為治疸黃之主藥黃者脾之色由濕熱而成須分陰陽陽黃多熱佐以梔子大黃陰黃多寒佐以附子乾薑療天行時疾熱狂苦寒之功利水散結化痰燥濕若過用損傷元氣一一八海金沙味甘寒入小腸膀胱二經入二經血分治小便癃閉熱淋膏濁血淋石淋莖中痛療腫滿淡滲解去濕熱及傷寒熱狂同梔子牙硝用利小便則熱自去或丸或散用一一九木賊草味苦微苦微溫入肝膽二經中空而輕去節能發汗有升散之力治目疾退翳障翳屬肝邪郁遏木賊能平肝止腸風下血赤痢崩帶脫肛風濕疝痛俱屬肝經病但多服損肝不宜久用一二穀精草味辛微溫入肝胃二經治目翳膜星障隱澀多淚雀盲至晚不見諸疳傷眼痘後星障補益肝氣療風火齒痛喉痹辛能散也小兒雀盲者羯羊肝一具不洗竹刀割開入穀精煮熟食之或作丸茶下按穀精去星障木賊去翳障兼補肝腎藥乃效其功在菊藥之上星即目中之白點也一二一決明子味苦鹹平入肝經治一切目疾凡風熱眼赤多淚及肝虛有火昏暗可為佐使惟多服乃效作枕善治頭風此馬蹄決明另有草決明石決明與之同功而各為一種一二二青葙子一名草決明野雞冠子也味苦寒入肝經治目青盲障翳赤腫昏花去肝風熱去風熱鎮肝明目但瞳子散大者忌服能助陽火一二三牛蒡子味辛苦入肺胃二經酒炒研辛能散結苦能泄熱潤肺金而退風熱解咽痛瘡腫治斑疹諸瘻風熱疔痘紅紫熱盛便結若出不快而泄瀉者癰疽已潰者均忌用按牛蒡子性寒而滑虛寒者勿服一二四葶藶子味辛苦大寒入肺經酒炒善逐水氣不減大黃大黃能泄血閉葶藶能泄氣閉治肺氣喘急難臥同大棗用補土所以制水除痰嗽腫脹水濕泛溢之害通經利水性能下行凡氣虛者不可輕用第此有甜苦二種甜者性稍緩耳一二五射干味苦性寒有毒入肺經泔浸煮乾用散血消腫解痰結治喉痹咽痛皆瀉實火之功消瘀血除瘧母散結泄熱之效但有瀉無補不可久服一二六山豆根味苦寒入心肺二經解毒清熱治咽喉腫痛消瘡疽化痘毒凡毒必熱得涼即化退內熱喘滿研末服齦腫齒痛含之咽汁療人馬急黃血熱極所致及諸蟲熱毒所傷若虛火上炎食少泄瀉而咽喉腫痛者忌服一二七冬葵子味甘寒入膀胱經氣味俱淡薄利水通淋催生落胎下乳汁潤大腸寒潤滑利之功消水腫利水之效同榆皮等分煎服蜀葵花赤者治赤帶赤痢亦治血燥白者治白帶白痢亦治氣燥黃者並治惡瘡膿水水瘥為末敷之為瘡家要藥浸油可塗湯火瘡按性寒野無故服之必有損真之害一二八貫衆又名管仲味苦寒有小毒入肝腎二經去毛焙寒泄熱苦殺蟲治邪熱腹痛寒也濕熱所生諸毒以毒攻毒諸蟲苦也解時行疫氣以此置水缸中令人飲之則不傳染破癥化硬能軟堅産後血氣脹痛去痰生新根似狗脊而大者一二九狗脊味苦甘性溫入肝腎二經去毛酒蒸苦堅骨甘益血能補肝溫養氣強筋壯骨治腰腳軟痛失溺不節腎虛強機關利俯仰滋腎益肝療寒濕周痹經曰內不在臟腑而外未發於皮獨居分肉之間真氣不能周命曰周痹是補而能走之藥也若腎有虛熱小便不利口苦舌乾者忌之一三蓽茇味辛性烈入脾肺二經去挺酒浸一宿焙刮淨皮粟溫中下氣除嘔逆吐酸消宿食祛冷痰治水瀉氣痢用牛乳煎服虛寒腸鳴霍亂皆脾胃寒冷之害又散陽明之浮熱辛也療頭痛齒痛方載頭齒門按蓽茇大辛須同參朮歸地諸甘溫補藥用之大效多用能動脾肺之火損目宜加酌量一三一良薑味辛性溫入脾胃肝三經土炒暖胃散寒治心脾疼痛寒者用至二錢熱者亦用四五分於清火劑中取其從治清火止痛最神治冷逆翻胃陰寒霍亂嘔吐宿食胃脘冷痛療噎膈瘴瘧皆胃寒病虛者宜於參朮同用庶不犯沖和之氣子名紅豆蔻醒脾消食散寒燥濕又解酒毒余治同前然動火傷目不可常用一三二紫草味苦鹹氣寒入心胞絡肝三經去根取茸血熱生用脾虛酒焙性寒而利能涼血活血滑血通二便鹹寒能滑托痘疹凡痘疹血熱毒盛或黑或紫大便燥結者用之否則忌用恐脾氣虛者反能作泄同黏米用能制寒性並解黃疸消腫療脹一切惡瘡取其利水去濕涼血而然也瀉者忌之一三三防己味苦辛性寒入膀胱經有木漢二種木者有黑點色黃而腥專治風漢者通心有花紋根大而虛專治水酒洗焙用能行諸經通腠理利九竅瀉下焦血分濕熱實證之聖藥治腳氣腫痛濕熱利大小便退膀胱肝腎濕熱漢防己之功療肺氣喘嗽中風攣急膈間支滿風寒濕瘧木防己之效及熱毒諸瘡蟲蛆等證皆濕熱之病按防己苦寒若虛證及熱在上焦氣分胎前産後俱忌用一三四骨碎補味苦溫入腎肝二經銅刀刮去毛蜜拌蒸曬用此物好生陰處入腎而主骨折傷粥和敷之治骨中毒氣風熱疼痛五勞六極手足不收上熱下冷或痢後下虛或遠行或房勞或外感風濕以致兩足痿弱俱宜補陰之藥佐之成功並治腎虛耳鳴久瀉腎主二陰而司禁固久泄乃屬腎虛用此為末入豬腎中煨熟空心食之二證俱宜牙痛炒黑為末擦牙咽下為良又能活血止血去瘀生新按經疏云勿與風燥藥同用一三五鉤藤味苦微寒入心肝二經心主火肝主風風火相搏則為煩熱瘛瘲音熾縱筋急而縮為瘛筋緩而弛為瘲伸縮不已為瘛瘲俗謂之搐搦是也此藥甘寒直走二經所以能治大小頭旋目眩驚癇夜啼口眼抽掣胎風客忤以風靜火息而諸症自平因性微寒小兒科珍之大人無熱者不宜多服按此藥久煎無力俟別藥煎好後投入沸一二即止自有功也去梗純用鉤其功十倍一三六淫羊藿味辛溫入腎心包肝三經每一斤以羊脂四兩同炒油淨為度或單用浸酒或佐丸散俱可辛香甘溫大補命門主陽虛陽痿益精氣堅筋骨暖下部補腰膝凡男子陽衰女子陰虧難於嗣者皆宜服之水火同補但虛久服相火易動耗散陰精反致無子又宜深知一三七大戟味苦辛大寒有毒入脾經惟採正根水煮軟去骨用傍根發瀉反甘草苦能下走辛能橫行能瀉臟腑水濕控痰涎痰之本水也濕也得氣與火則結而為痰消腫脹腹痛積聚癥瘕頸腋癰腫通二便下惡血通經墮胎然大能瀉肺損真氣非體之堅實者勿用若中其毒惟菖蒲可以解之杭産紫者為上北産白者傷人漿水煮去心得大棗則不損脾一三八甘遂味苦氣寒有毒皮赤肉白作連珠實重者良反甘草麵包煨熟用苦善泄寒勝熱水屬陰故從其類直達水氣所結之處以攻決為用為下水之聖藥仲景大陷胸湯用之治水結胸也治濕熱積飲水腫水蠱腹腫疝瘕消陰囊腫脹去面目浮腫主去十二種水從穀道而出按甘遂攻逐極效損真元亦速非大實大水不得輕投一三九商陸味辛性平有大毒入脾經銅刀刮去皮水浸一夜黑豆拌蒸入脾行水有排山倒嶽之勢治水腫脹滿瀉濕熱蠱毒敷惡瘡墮胎孕利小便破痃癖白根可用赤者殺人白專利水赤惟貼腫並臻奇功虛弱者禁用一四芫花味苦溫有毒入肺脾腎三經反甘草陳久者良好醋煮過曬乾則毒減散皮膚水腫同大戟甘遂能直達水飲窠囊隱僻之處消胸膈痰沫驅疝瘕癰疽除鬼瘧蠱毒按毒性至緊取效極捷虛人誤用多致傷折一四一青黛味鹹寒入肝經色青入肝性寒散熱治時疫頭痛療傷寒赤斑除小兒一切疳病驚癇煩熱消瘦鼻赤唇焦口舌生瘡等證皆屬肝經鬱火並治諸熱瘡毒同馬齒莧搗敷雖涼而不傷脾若中寒泄瀉者勿用一四二王不留行味苦辛甘平氣溫入大腸經水浸焙王不能留喻其走而不守也通血脈療産難下乳汁同穿山甲用利小便行經滯行血之力消乳癰外腫辛散治金瘡鼻衄又能止血但失血崩漏孕婦忌之一四三蕤蘞草味苦寒入肝腎二經能宣能補善理風濕治肢節不利肌體麻痹口眼歪斜腰腳痿痛並散惡毒瘡腫悉除風濕之功生者酒煎療破傷風如神生寒熟溫以五月五日六月六日採者尤佳去粗莖留枝葉花實酒拌蒸曬九次蜜丸若痹痛屬腎虛血虧不由風濕者忌服一四四蒼耳子味甘苦性溫入肝腎二經去刺酒拌蒸苦以燥濕甘以和血溫以通行為驅風除濕之聖藥治頭痛風寒周痹濕也明目養血瘰癧瘡疥遍血瘙癢風濕亦治鼻淵炒熟為末白湯服二錢久之乃效忌豬肉暖腰膝療諸痔煎湯熏洗按蒼耳性輕善發汗表虛者勿用一四五馬兜鈴味苦性寒入肺經體性輕揚其形類肺能清肺熱治痰嗽喘促清熱降氣療痔瘻腫痛肺與太陽相表裡肺移熱於大腸故腸風痔瘻清臟熱則腑熱亦清矣即燒煙燻之亦妙或蠱毒蛇毒於飲食中得之咽不下吐不出者以一兩煎服則吐多用於湯劑則吐按嗽痰屬寒者勿用一四六青木香即馬兜鈴之根也味苦性寒微辛有毒能吐能利不可多服煮汁服可吐蠱毒鬼疰搗末水調塗疔腫熱毒蛇毒日三次立瘥亦可敷瘙癢禿瘡又能散氣故疝家必需一四七白蘞味苦辛甘性寒形如卵而長反烏頭一種赤者性同苦能泄辛能散甘能緩寒能除熱敷一切癰疽惡毒及面上瘡泡刀箭傷凡金傷入肉者同丹皮或半夏為末酒服殺火毒搽凍耳同黃柏末油調生肌止痛斂瘡方多用之每與白芨相須亦治婦人陰腫系外科要藥若癰疽已潰不宜服以其性寒也一四八白頭翁味苦辛寒入胃與大腸血分能外治溫瘧寒熱瘰癧諸瘡內治熱毒血痢牙疼鼻衄諸血皆辛散除熱之功也並療陽狂癥瘕積聚腹痛陰疝偏腫百節骨痛寒涼血苦堅腎而然有風反靜無風則搖近根處有白茸得酒良一四九常山味辛苦大寒有毒入肝脾二經多酒炒透用一二錢亦不吐其性暴悍能逐老痰積飲善散山嵐瘴癘之氣所以療痰飲有靈截瘧疾必效瘧成於痰其苗莖葉名蜀漆功用略同古方有蜀漆散取其苗性輕揚發散上焦邪結同甘草水拌蒸按二物能損真氣弱者慎用一五牽牛子又名黑醜味辛有毒入肺大小腸三經酒蒸研細屬火善走入肺經瀉氣分之濕熱肺主氣火能平金而泄肺治水氣在肺喘滿腫脹及大腸風祕氣祕利大小便殺蟲有毒墮胎辛熱若濕熱在血分胃弱氣虛者禁用諸證應用藥物和平而神良者不少何必用此毒物哉東垣戒人勿用宜信有黑白二種黑者力速取子舂去皮用得木香乾薑良一五一威靈仙味苦辛鹹氣溫入膀胱經忌茶茗面辛泄氣咸泄水此風藥之善走者也能宣五臟通行經絡治痛風頑痹一味可治中風頭風辛能散邪去腹內冷滯心膈痰水一切黃疸浮腫濕證咸能泄水化癥瘕積聚咸能軟堅凡病風濕痰飲採得根陰乾搗末空腹酒調服二錢可加至六錢微利兩行則病除停藥其性峻利氣壯者服之有捷效久服損真氣虛弱者宜以調補藥兼之否則走氣耗血一五二百部味苦微溫取肥實者竹刀劈去心皮酒浸焙用潤肺散熱清痰下氣誠久嗽寒嗽之要藥天冬治肺熱嗽此性溫治肺寒嗽為不同也治傳尸骨蒸疳積疥癬皆有蟲味苦能殺發蝨同秦艽為末燒煙燻之脾胃虛者須同補藥用一五三茜草亦名過山龍味苦酸微寒入心包肝二經忌鐵色赤入榮血中要藥其性涼故止動血治勞傷吐衄時來虛熱崩漏不止其味苦故行滯血療乳癰跌撲血凝消瘀通經酒煎一兩通經甚效若氣虛脾寒及血少者勿用氣虛不能攝血脾虛不能統血以苦寒傷胃也一五四海藻味苦鹹寒入腎經反甘草咸潤下而軟堅寒行水以泄熱消瘰癧癭瘤陰㿉結核腹病曰疝凡病曰㿉音頽一切堅聚咸以軟堅通癃閉除水腫行十二經之濕邪略洗鹹水用其用在咸不得過洗一五五海帶下水消癭功同海藻而多用可以催生一五六昆布破頑痰結氣消水腫瘰癧陰㿉噎膈含之咽汁按昆布之性雄於海藻若多服令人瘦削一五七萆麻子味甘辛性熱有毒其力長於收吸故拔病氣出外追膿取毒能出有形之滯物塗口眼歪斜牽正即去久則反損下胞孕胞衣搗塗足主下速洗去不爾則子腸出即以此膏塗頭頂只可搗膏外貼決不可服食用此奏效者甚多方載本門單方一五八鳳仙花俗名指甲花其色不一有小毒味微苦性微溫有毒子名急性子治産難下胞胎開噎膈化骨硬俱研末水調服一五九白附子味辛溫有毒入胃經皺紋有節長寸許炮去皮尖用性熱純陽能引藥上行去頭面遊風陽明之脈縈於面消面斑疵作面脂用治中風失音風痹痰厥去濕逐寒小兒急驚之要藥也但性溫燥凡陰虛似中風證小兒脾虛慢驚並宜切忌一六天名精味甘辛寒入肺經根名杜牛膝同功辛能破血寒能止血治吐衄痰熱乳蛾喉痹小兒牙緊急慢驚風痰熱血熱之患解毒殺蟲砂淋血淋方載本門下瘀血血癥破血而血虧體弱者忌用一六一鶴風味苦辛有小毒大能殺五臟蟲凡蛔蟯蟲齧腹痛面白唇紅時發時止為蟲痛肥肉汁調末服是天名精子炒熟則香研末任合丸散用一六二藜蘆味苦微寒入脾胃二經反細辛芍藥諸參諸酒若同酒即殺人畏蔥白有宣壅導滯之力邪氣熱痰閉塞膈上昏迷不省用此以吐之苦為湧劑入口即吐吐不止者服蔥湯即止即一時獲效療蠱毒喉痹亦須用吐按藜蘆有毒善吐凡上焦有老痰或中蠱毒止可借其宣吐不然切勿沾口以致大損津液也一六三續隨子一名千金子味辛溫有毒入腎經研細紙包捶出油性主攻擊刻不容緩能行水破血消積聚脹滿利二便通經滯辛溫之用治蠱毒鬼疰疥癬惡瘡以毒攻毒以上諸證各有成病之由當求其本不可概施按脾虛便滑者服之必死此大戟甘遂之屬長於利水用之得法乃為要藥一六四澤蘭味苦甘辛入肝脾二經苦泄熱甘和血辛散郁能入血分行而帶補為婦科要藥治胎前産後諸血不調破瘀血理月經化癥瘕除腹痛及産後血瀝腰痛去瘀生新之效散水腫防己為使療撲損頭風目痛血虛有熱追癰腫瘡膿長肉生肌行血和血氣味和平諸病悉效服之無偏勝之患一六五蒲公英一名黃花地丁味甘平入脾胃二經化熱毒解食毒散滯氣消腫核專治乳癰乳頭屬厥陰乳房屬陽明同忍冬煎少入酒服外用搗敷亦為通淋妙品一六六萱草花葉氣味甘而涼入心經詩作諼草樹此玩此者可解憂思孕婦佩其花可以生男能利水快膈除煩渴酒疸根治沙淋帶濁搗汁服療吹乳乳癰腫痛擂酒服以渣封之一六七山茨菰味甘辛寒有小毒入胃經散熱解毒治癰疽疔瘡瘰癧結核醋磨頻塗內用酒煎服解諸毒蛇蟲狂犬傷用酒調服根與茨菰小蒜相類去殼用出處州遂昌縣洪山無毛有毛者偽也一六八漏蘆味鹹苦性寒入肺胃大腸小腸四經咸軟堅苦下泄寒勝熱治一切風熱惡瘡癰疽痔瘻等毒排膿生肌苦寒通經下乳療折傷續筋骨止遺溺泄精及預解時行痘疹毒以寒勝熱又能入陽明也若孕婦與陰證瘡瘍平塌下陷者禁用出閩中莖如油麻枯黑如漆者真一六九劉寄奴草味苦辛溫入血分苦能降辛溫能行主破血下脹通經除癥治産後余血小便血淋損傷瘀血行瘀迅速用為散或茶或酒調服搗敷金瘡出血不止療湯火傷凡湯火傷先以鹽末厚鋪則護肉不壞次以糯米漿調寄奴末雞翎掃上不痛且無痕大效按氣血兩虛脾胃虛泄者勿服一七馬勃味辛氣平體性輕虛清肺解熱東垣普濟消毒飲用之治喉痹久嗽肺熱外用敷一切毒瘡生濕地朽木上狀如肺肝紫色虛軟彈之粉出取粉用一七一蕺俗名魚腥草味辛氣溫入肺經生下濕之地得陰中之陽治痰熱壅肺發為肺癰吐膿吐血之要藥清肺療大腸濕熱盛則為痔瘡用此煎湯熏洗滓敷患處以肺與大腸相表裡也但辛溫散氣多服令人氣喘一七二孩兒茶味苦澀氣寒無毒清膈上煩熱化痰生津味苦治金瘡流血及一切諸瘡生肌定痛茶苦本涼又得土中之陰氣能涼血清熱又主滲濕收斂苦能燥澀能斂用細茶末入竹筒中埋烏泥溝中日久取出搗汁熬成潤者良雲南暮雲陽造之一七三敗草牆上朝東或茅屋上陳草久受寒暑雨露日月精華之氣解毒滲濕最效善解痘毒或痘爛膿水不幹癢痛不止用草或曬或焙研細敷瘡或襯席間睡於上毒解而瘡即愈一七四蚤休味苦寒有毒入肝經其根似肥薑治驚癇搖頭弄舌一切濕熱瘡毒或磨酒飲或磨醋服歌云七葉一枝花深山是我家癰疽如遇此一似手拈拿觀此善治癰疽之功見矣一七五衛矛一名鬼箭羽乃天麻之苗遺邪祟隔瘟疫故名思箭通月經破癥結下胎妊消風腫去白蟲但無補益不可多服一七六馬鞭草味苦寒無毒入肝腎經破血通經消脹化癥治一切楊梅癰疽惡毒殺諸蟲除陰腫煎湯熏洗搗敷患處按此草以驅逐為長瘡證久潰而虛及脾胃弱者斟酌用之苗葉似菊穗抽似鞭花紫一七七水萍味辛無毒入肺經輕浮入肺能發揚邪汗發汗甚於麻黃治一切風濕癱瘓浮萍一味蜜丸酒服利小便消水腫氣化及於州都止膚癢瘡癩煎汁浴背面俱青而小者名藻面青背紫者名萍入藥用萍七月半採曬乾研末用體虛者禁用一七八茵芋味辛苦微溫有小毒治風濕拘攣痹痛辛散風苦燥濕古方治風癇風痹多用之莖赤葉如石榴短厚莖葉炙用按血虛似中風者宜與溫補藥同用一七九大青味苦鹹大寒入心胃二經治天行時疾熱狂陽毒發斑熱甚傷血裡實表虛則發斑同犀角用療黃疸熱痢癰腫丹毒喉痹煩渴寒勝熱也脾胃虛弱泄瀉者勿用處處有之高二三尺莖圓葉長葉對節生八月開小花成簇實大如椒色赤用莖葉一八黃藥根色黃味苦無毒入肺肝二經外科多用治咽喉痹塞經曰一陰一陽結為喉痹一陰者少陰君火也一陽者少陽相火也解君火則相火自不妄動而愈療諸惡瘡疽蛇犬咬傷生搗取汁可含可塗子肉味酸消癭甚捷浸酒飲見效即止否則項縮一八一薺苨味甘性寒入肺胃二經和中止嗽寒利肺解百藥毒甘也治消渴強中溫症下消莖長興盛不交精出名強中消渴之後發為癰疽癰腫疔毒一八二山奈味辛氣溫入胃經溫中辟惡治心腹冷痛寒濕霍亂風蟲牙痛生廣中根葉皆如生薑入合諸香一八三紫花地丁味辛苦而寒治癰疽發背疔腫瘰癧無名腫毒一八四甘松香味甘氣溫入脾經芳香理氣能開脾郁治腹滿痛齒𧈟腳膝氣腫煎湯淋洗但芳香散氣多用暈人一八五地膚子味苦寒無毒入脾經益精強陰入膀胱除虛熱利小便療淋疝散惡瘡去皮膚風熱煎湯洗苦燥濕寒勝熱治目雀盲澀痛頻頻煎洗滋陰之效葉如蒿莖赤子類蠶砂一八六石韋味苦甘微寒入肺經清肺金以滋化源故通膀胱而利水道治五勞清熱崩淋發背炒末冷酒調服生石陰柔韌如皮背有黃毛去毛炙用一八七天仙藤味苦氣溫青木香藤也疏氣活血治妊娠水腫天仙藤散治妊娠子腫葉似葛而小有白毛根有須四時小凋一八八煙草味辛氣溫有小毒治風寒濕痹行滯氣停痰闢山嵐瘴霧其氣入口即周一身令人通體俱快似乎通氣血而暢榮衛者矣人以代茶代酒終身不厭厭則病來嗜則病去然火氣熏灼陰虧者更損神耗血人身不覺耳一八九苧麻根味甘氣寒而無毒補陰解熱破瘀涼血治時疫熱渴狂叫胎動下血諸淋血淋寒能勝熱涼血之功赤遊丹毒癰疽發背金瘡折傷內煎服外搗貼汁能化血為水皮與産婦作枕止血暈安腹上止血氣痛散瘀之功服金石藥燥熱飲下立除一九凌霄花味酸氣寒入心包肝經一名紫葳入厥陰血分能去血中伏火治崩帶癥瘕産後余疾血閉血淋風癢破血去瘀涼血活血之功女科多用孕婦忌之藤生花開五瓣黃赤有點不可近鼻聞能傷腦一九一景天一名慎火草味苦酸無毒入心經大寒純陰之品入離宮而清熱毒療火瘡治遊風煎湯浴金瘡蛇傷俱效熱邪蠱毒併除按中寒者服之大害惟外塗不妨耳一九二蘆薈味苦寒無毒入心肝脾三經稟陰寒之氣能除一切邪熱明目除驚瀉火療五疳殺三蟲濕熱所致寒除熱苦燥濕按性寒脾虛者禁用一九三蘆茅根味甘寒無毒入脾經甘益胃寒除火治噎膈反胃消渴嘔逆皆胃熱之患傷寒內熱止小便頻數亦有屬熱者按性寒以上諸證屬寒者切勿誤用根取土之中者若露出水面者損人筍性更佳花白名蓬茸主霍亂危急煮汁吞飲即安一九四卷柏俗名萬年松味辛甘溫平微寒通經脈治癥瘕淋結宜生用以破血療脫肛腸風及一切血熱妄行宜炙用以止血生石上拳攣如雞足一九五蘭葉味辛平無毒入肺經開胃清肺散瘀消痰肺氣結辛平散之胃痰癖芳香除之利水止渴肺氣清也生津潤膚火不剋金之效按蘭清芳能清辛金建産為上江浙次之但今不恆用耳一九六王瓜即土瓜根味苦寒無毒入心肺膀胱三經瀉熱除毒燥濕治天行熱疾發狂遺尿黃疸搗汁飲化血結堅癥瘀血月閉破血去濕脾散癰疽下痢赤白雜來濕熱利二便利水下乳汁單服以上俱宜根煎服療傷寒發斑調伏龍肝末服根似栝蔞味如山藥根子通用惟少為奇多則吐下
