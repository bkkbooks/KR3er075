body:
  text: 卷十一雜證三十三論黃疸有實有虛有表邪是證皆謂之濕熱而有黃汗黃疸谷疸酒疸女勞疸之分總不出乎虛實二證即韓祗和所云陰疸陽疸也經曰已食如飢者即實證也多因脾濕不流鬱熱所致其脈洪滑有力或身熱口渴消穀善飢二便燥赤等證但須清火利濕火退則溺清而黃自退矣又曰安臥脈小不嗜食者即虛證也此非濕熱為病而全由氣血之敗或則七情傷臟或勞倦傷形或因中氣大傷不能生血所以血無華色而色敗矣其為病也有困倦眩暈畏寒少食大便不實小便如膏等證治者宜補心脾腎之虛氣血復而黃自愈若但見色黃不察脈證視為濕熱而治以茵陳梔子瀉火利水等劑是速其斃又有表邪未清而發黃者傷寒汗不能透而風濕在表者或自表入里而濕熱鬱於陽明者皆變黃疸表邪未解者必脈浮少汗發熱身痛宜從汗散濕熱內郁者脈息緩滑煩熱多汗治宜分消清利若陽明實邪內郁而痞結脹滿者宜先下之然後清其餘熱則自無不愈凡黃疸難治證寸口無脈鼻出冷汗腹脹形如煙燻搖頭直視環口黎黑油汗發黃久之變黑者皆難治梔子茵陳湯新治身熱發黃小水不利脈實口渴梔子七枚茵陳澤瀉黃柏赤苓各三錢甘草一錢如大便燥結加大黃四錢口渴加生石膏五錢水煎空心服茵陳四苓散治濕熱黃疸小水不利白朮豬苓茯苓澤瀉各錢半茵陳二錢或加梔子壽脾煎治心脾虛損六脈微弱身發黃疸白朮二三錢當歸二錢山藥二錢甘草炙一錢乾薑炮一二錢棗仁錢半遠志五七分蓮肉去心炒二十粒人參隨便水煎服如腎經之陰虛者用六味丸腎中之陽虛者用八味丸四君子湯吞八味丸治疸證服解利藥不止或口淡腳軟寒熱尿濁皆為虛甚若再服涼藥通利自必脾虛腎涸而危茵陳附子湯治身熱發黃汗不止者此陰黃虛寒證也附子制急則生用三四錢乾薑炮一二錢茵陳二錢水煎服或去乾薑加炙甘草治脈細身冷黃疸陰證桂枝加黃耆湯治表邪外閉脈浮發黃當以汗解之桂枝白芍生薑各三錢甘草二錢黃耆蜜炙二錢大棗四枚熱服覆取微汗柴芩兩解湯新治表邪未解里證又熱尿赤口渴煩躁脈滑數者柴胡二錢黃芩三錢梔子一錢黃疸加茵陳二錢溫服柴陳五苓散治濕熱發黃小水赤黑煩渴發熱白朮茯苓豬苓各錢半澤瀉二錢二分肉桂錢半此五苓散加茵陳三錢車前子一錢木通柴胡各錢半燈草引酒疸加乾葛凡一身盡痛而黃者濕熱在表也不痛病在裡也乾燥者熱盛也在表者汗之半表半裡者和之在裡者下之若小便自利當與虛勞小建中湯若黃色不變欲自利腹滿而喘不可除熱除熱必噦宜小半夏湯皆不可拘於茵陳也小建中湯治虛勞腹痛肢疼煩熱咽乾並遍身黃疸甘草炙桂枝生薑各三錢大棗二枚白芍四錢膠飴二合以前六味煎成去渣入膠飴火烘微解溫服嘔則不用飴以其甜也小半夏湯治嘔吐及噦氣身黃半夏五錢生薑二錢半煎服養勞湯治五疸虛弱心悸耳鳴寒熱氣急溺濁宜作虛勞治人參隨便黃耆蜜炙當歸白朮各錢半桂心甘草炙各一錢白芍酒炒二錢半生地茯苓各一錢二分遠志八分五味子炒搗五分陳皮七分生薑五分棗二枚水煎食前服火府丹治心經積熱小便淋澀黃疸渴甚生地杵膏二兩木通一兩黃芩炒一兩蜜丸木通湯下茵陳四逆湯治發黃脈沉細而遲肢體逆冷腰以上自汗茵陳四錢甘草炙二錢乾薑炮三錢附子生炮三錢溫服小便色白為無熱小便色黃赤為濕熱小便不利無汗為實小便清利自汗為虛年壯氣實脈大易愈脈小溺利不渴者生脈洪泄利而渴者死寸口近掌處無脈口鼻冷有黑色起者死疸病渴者難治不渴者易治疸毒入腹喘滿者死老人氣虛脈微難瘥黃疸日久變為黑疸喘滿者死急以土瓜根搗汁六合頓服黃水從小便出即愈備揀古來治黃疸至簡至穩神方於後以便取用黃疸脈實大便祕小便赤總以茵陳大黃山梔為主身黃脈沉細不渴者無火也茵陳橘皮生薑白朮各三錢半夏茯苓各二錢溫服切忌涼藥秦艽一味諸黃宜用能逐陽明濕熱從外而出效大而性和平不可用涼藥傷脾有腎虛不能行水水浮於外郁久變熱而為黃用金匱腎氣加麥冬作湯飲之以脈弱便清故也黃者脾之色也脾色外見則內虛矣虛則運化不及濕熱拂鬱而然故書曰疸不用分其五同是濕熱是脾為本而濕熱為標也治宜補脾用四君歸脾之類而導水次之黃疸溺赤用茵陳梔子各三錢秦艽升麻各四錢為末每用三錢煎服五種黃疸用秦艽酒浸絞汁每日空心多服白鮮皮治諸黃及風痹要藥黑疸危疾也用栝蔞根搗汁服小兒加蜜谷疸因食得勞疸因勞得脈實尿赤用膽草一兩苦參二兩牛膽汁丸服凡黃用雞子連殼燒研淡醋調服鼻中出蟲為效甚者不過用三次時行黃病以酒醋浸雞子一夜吞白數枚酒疸用茵陳乾葛梔子等分研末取田螺一二個擂爛酒服三十四論痹證經曰風寒濕三氣雜至而為痹痹者閉也以血氣為邪所陰不得通行而為痛風氣勝者為行痹以風行無定走注歷節為痛此陽邪也治宜補血以散風蓋血足而風自滅也然散風藥中而祛寒利濕之味仍不可缺寒氣勝者為痛痹以血氣受寒則凝留聚為痛此陰邪也治宜補火以散寒蓋辛溫可以散寒也然散寒藥中而疏風燥濕之品仍不可缺濕氣勝者為著痹以血氣受濕則滯而肢體沉重麻木不仁或痛在一起此亦陰邪也治宜補脾以燥濕蓋土強可以勝濕也而祛風解寒之味仍不可缺觀經雜至二字言風寒濕三邪交受也觀三勝字言邪有偏重也而互受其邪者即輕亦宜兼治之若欲辨其陰陽陽證多熱或見發熱頭痛等證或得汗而解者此即傷寒中風之屬也宜於傷寒門真中風門參閲治之如即受寒邢而無發熱頭痛又無變證或有汗無汗而筋骨之痛如故外無表證此陰邪直入陰分經曰邪入於陰則痹是也然痹屬陰邪故寒者多而熱者少縱有熱者亦不過於三因之內郁久而變熱非另有熱痹一證也大抵由真陰真陽虧損故三氣得以乘之而為痹宜補真陰扶元陽使寒邪自去不得概用治標之劑再傷元氣又宜知痛者可治以正氣尚與邪氣爭也彼不痛者止有邪而無正也治亦無益醫者其知之乎此外如五臟六腑之痹在七情飲食固能致之然必重感於邪而內速臟氣始合而為痹此亦兼證耳宜細察以兼治之可也五積散治一切痹病初起凡風寒濕中之身痛骨節痛等證當歸白芍各一錢蒼朮一錢三分陳皮厚朴姜炒半夏白芷茯苓枳殼各一錢乾薑炮桔梗麻黃肉桂甘草炙人參山藥可代川芎各八分生薑五分蔥白三莖溫服小續命湯通治八風五痹痿厥疼痛等證麻黃去節人參無者山藥炒五錢代之黃芩白芍甘草炙川芎防己杏仁去皮尖炒肉桂各錢半防風二錢附子七分生薑四分棗一枚溫服如骨節間有熱痛者去附子倍白芍如骨節冷痛加桂枝如燥悶小便澀去附子倍白芍入竹瀝一合如臟寒下痢去黃芩防己倍附子加白朮熱痢去附子腳弱加牛膝身痛加秦艽腰痛加杜仲自汗去麻黃杏仁加白朮養血祛風湯新治風邪外中歷節腫痛脈浮澀者當歸二錢白芍酒炒錢半熟地錢半若血虛有熱者改用生地秦艽錢半防風獨活各一錢二分羌活一錢桂枝八分陳皮七分松節四錢溫服益火散寒湯新治寒邪外中身體切痛脈弦緊者肉桂錢半乾薑炮一錢桂枝八分羌活七分蒼朮一錢秦艽二錢防風一錢甘草八分陳皮八分姜引如寒甚者加附子如手臂痛甚加片子薑黃海桐皮如寒邪滯者加麻黃白芍補土燥濕湯新治濕邪外中身痛沉重脈沉細澀者山藥炒三錢白朮茯苓各錢半甘草炙羌活八分防風秦艽防己蒼朮各一錢薑棗引如寒濕者加肉桂或加附子如濕熱者加黃柏如腳膝痛者加川牛膝如小便短澀加澤瀉豬苓加味五痹湯治五臟痹證人參或以山藥三錢代之白芍煨茯苓川芎白朮當歸各錢半五味子十五粒細辛甘草各五分姜一片食遠服如心痹加遠志茯神麥冬犀角如肝痹加棗仁柴胡如腎痹加獨活肉桂杜仲牛膝黃耆蓽薢如肺痹加紫苑半夏杏仁麻黃如脾痹加厚朴枳實砂仁神麯以上加法在人變通而已加味二妙散治濕熱痹病骨節疼痛如火之燎或麻木痿軟當歸川牛膝川蓽薢防己龜版酥炙各二錢蒼朮三錢黃柏二錢溫服或加分量醋煮麵糊為丸湯下百丸大防風湯治足三陰虧損風寒濕乘虛侵入發為痹證人參白朮防風黃耆蜜炙熟地杜仲各二錢白芍牛膝羌活附子各一錢肉桂甘草炙各七分川芎錢半當歸錢半生薑一錢水煎服此方標本悉治可謂穩協備揀古來治痹至效至穩簡易諸方於後以便取用風寒濕痹通身麻木或疼痛用生川烏末四錢苡仁末二錢入米粥內再熬下薑汁一匙蜜三匙日三服凡一切痛風及男女多年難治者用威靈仙研末酒調服得下利二次即停藥忌茶以甘草湯代之凡牛羊鵝雞俱忌此味治痛風要藥也中濕骨節痛用白朮一兩酒煎服凡一切痹痛宜用麻黃烏藥防風羌活秦艽威靈仙防己獨活松節之屬因血虛氣虛及寒濕等證隨便加固本之藥為主薄桂味薄能橫行手臂領南星蒼朮至痛處成功威靈仙治上體痛風漢防己治下體痛風然虛弱人當以氣血藥兼之方能運行濕痰濁血流注為病在下焦惟烏附氣壯可為引經不可為主治下焦濕痛惟三妙散最效蒼朮三錢黃柏二錢炒川牛膝二錢夜服十指麻木胃中有濕痰死血也宜二陳湯陳皮半夏茯苓甘草加蒼朮白朮紅花桃仁附子上身骨節盡痛用防風乃治風勝濕仙品三十五論便血新者為腸風下血不痛有虛有實久者為臟毒下血腹痛有熱有寒經曰陰格傷則血內溢而便血傷者言風寒暑濕熱之外邪也又云陰結者便血一升再結者二升此言陰氣內結不得外行滲入腸間乃寒濕生災而陰邪之勝也大凡陽邪陰邪俱能傷胃而使血下故也雖血之妄行多由於火然火證之外又有脾胃陽虛而不能統血者有元氣下陷而血亦陷者有病久滑泄而血因以動者大都有火者則血熱無火者因虛滑故治血者當以辨虛實為要或熱或濕或風或冷或虛及新久之異以治之不可純用寒涼即用涼藥必加辛味為佐久不愈者當用溫劑以補脾土使能統血而血有所歸也又要兼酸澀之味者是欲少斂之也藥多用酒炒者是欲升舉之也收斂之後仍和氣血厚腸胃使陰絡無復傷之患耳腸風者其腹不痛血清而色鮮邪由外入隨感而見者也臟毒者大腸濕熱久積遂生窠穴為積血之所從便之前後而來其腹則痛血濁而色黯雖有毒名卻無毒也若血射如線者蟲痔也自肛門蝕孔處出也然毒有濕熱之辨濕毒下血者腹中不痛以分利為主熱毒下血者腹中多痛以清涼為要約榮煎治便血因火者清熱止血並治酒毒濕熱下血當歸白朮白芍酒炒生地茯苓地榆白石脂煅醋淬黃芩五味丹參川續斷各錢半水煎服若熱甚而血多與色鮮者加黃連防風各一錢黃芩倍用臟連丸治平素因陽臟多火遠年近日腸風臟毒下血不止黃連三兩槐米一兩炒枳殼五錢防風甘草槐角香附牙皂木香各二錢用陳米一合同香附為末將豬臟洗淨入米與末縛定於砂鍋加水煮爛杵如泥將各藥研末搗勻為丸米飲下七八十丸忌一切辛熱之物壽脾湯治脾胃虛弱便血紫黑色陽虧而無熱證速宜溫補白朮二三錢當歸二錢山藥二錢甘草炙一錢棗仁錢半志肉五分乾薑炮一二錢蓮肉去心二十粒人參一二錢烏梅二個水煎服若血脫不禁者加醋炒五倍子一錢如虛滑不禁者加鹿角霜二錢為末調於藥中合服氣虛者加炙黃耆二三錢氣下陷者加炒升麻五分兼溏泄者加補骨脂炒用一錢如陽虛畏寒者加附子一二錢如血去過多陰虛心跳身熱而脈細數者加熟地八錢或加倍即歸脾湯十全大補湯亦妙此際作血熱下行稍用涼藥則危矣香梅丸治氣血俱虛全無火證而血滑不能上者宜固澀之烏梅肉白芷百藥煎燒存性等分此五倍子釀成者為末米飲糊丸空心米欲下如無百藥煎即五倍子醋炒亦可腸風下血服之即上烏梅丸治大便下血如神姜蠶炒一兩烏梅肉兩半為末蜜丸空心醋湯下或以補中益氣湯歸脾湯加烏梅五倍子五味子亦可平胃地榆湯治風寒之邪結於五臟蓄而便血是謂陰結陳皮厚朴蒼朮甘草地榆白朮當歸白芍乾葛茯苓神麯乾薑炒香附等分升麻減半人參無者以蜜炒黃耆加倍代之薑棗引空心服以風寒之邪內結不得外行宜溫散之回陽湯治陰陽將脫便血大下當歸三錢泄瀉者去之白朮三四錢附子制二三錢乾薑炮二三錢熟地五錢黃耆蜜炙四五錢或加倍烏梅二三個水煎服加人參二錢更效若血再不止者加醋炒五倍子錢半凡內傷七情及勞倦以動血者此中氣不足故有嘔惡痞滿腹痛泄瀉寒熱不食等證陽敗於陰血色灰黑此胃氣大損脾元脫竭危劇證也即速速回陽猶恐不及而若輩猶云痰火不用補劑必致於斃殊為可憫大凡便血以脾胃藥收功備揀古來治便血至簡至穩神方於後以便取用便血不論新久用白礬七八分大人一錢五分研細末調入雞子內煎熟切作細塊空心白湯吞下又方用白芷為末每米飲下二錢又方用發灰五錢雞冠花柏葉各一兩為末臥時酒服三錢又方用白炭三錢枳殼燒黑五錢為末五更時米飲下二錢天明再服立愈忌油膩熱物又方石燕磨水常服又方用姜蠶炒一兩烏梅肉五錢搗醋糊丸淡醋湯下臟毒下血用豬臟洗淨入槐花末令滿縛定以醋煮爛搗為丸酒下若下血而泄體倦食減者是臟寒也用豬臟洗淨以吳茱萸末填滿縛定蒸爛搗為丸米飲下大便後血用五倍子末艾湯下一錢又方皂角炙槐實糠炒為末粟米湯下一錢又方用槐花荊芥穗為末酒服一錢又方用旱蓮草焙研末米飲下二錢臟毒下血乾柿餅燒灰米飲服三錢腸風下血木賊煎服凡純下清血者風傷肝也宜散風涼血下如豆汁者濕傷脾也宜清熱滲濕大腸下血及婦人崩漏用敗棕燒灰存性酒調或米湯調服二錢三十六論小便不通有氣祕氣虛血虛痰壅熱結五種口渴而小便閉者屬實熱宜清利口不渴而小便閉者屬虛寒宜調補經曰膀胱者州都之官氣化則能出夫氣何以不化也肺主上焦氣分肺熱則清化之源絶金不生水必口渴而溺竭矣須用清金之藥如生脈散之類為當或外感風寒肺受外邪宜用辛散之劑如麻黃湯之類為宜又有脾虛不能生金者則清氣不能上升濁氣何由下降經謂脾胃一虛令人丸竅不通用補中益氣湯以參耆溫脾以升柴提氣滋後天之化原虛則補母之妙用也如不渴而小便不利此屬下焦血分腎與膀胱為陰中之陰陰有熱閉塞其下流經曰無陰則陽無以化若用淡滲利水之藥乃陽中之陰非純陰之品陽何以化須用滋腎丸以純陰濟陽則化之速矣至於真陰虛者膀胱乾涸無水可利惟用六味地黃以補腎水若滋腎丸又所當禁恐知柏苦寒以傷腎元又忌淡味滲泄之藥以益涸其津液如真陽虛而不得小便者是即經曰無陽則陰無以生也急用八味地黃或用金匱腎氣湯如水寒冰凍得太陽一照而陰凝自流通矣更有痰壅則用二陳湯熱結則用八正散氣祕則用陳皮香附之屬又必探喉而吐之譬如注水之器上竅開則下竅通是探吐一法為切要之妙方也吐法載霍亂孕婦小便不通因胞被胎壓也內服補中益氣湯甚則探吐外令婦睡於榻上將榻漸次倒豎則胎上而溺通隨服升補之藥凡膀胱無水除陰虛之外尤有所因者當細辨之有因泄瀉水歸大腸而小水不通但治泄瀉泄止而水自利或用分利不過十之三耳有因大汗多汗氣從汗泄而小水不利者此當調治榮衛表氣收而小水自利有虛勞失血傷精水隨液去五內枯燥而小水不利者此當調補真陰血氣漸充而小水漸利凡此數者水泉既涸不可再加分利凡小水閉塞危急之甚諸藥不效者速尋家種菊花根白者為高即雜色者亦可將根搗爛用生白酒沖和取酒汁溫而欲之神效又法凡有氣陰小永不通危困之極者用皂角蔥頭王不留行各六七兩煎湯一盆令病者坐浸其中熏洗小腹熱氣內達便即通矣若婦人搗蔥數莖納陰戶外加熏洗其通尤速凡大小便俱不通必先通其大便而後小便自通八正散之類主之黃芩清肺飲治肺熱小便不利梔子三錢黃芩錢半水煎服五苓散治膀胱濕熱口渴小便不利並治淋澀作痛白朮豬苓茯苓各錢半肉桂一錢澤瀉二錢水煎服大分清飲治熱閉不通莖中澀痛必有火脈火證茯苓澤瀉木通各二錢豬苓梔子或倍之枳殼車前各一錢水煎服如內熱加黃芩黃柏之屬益元散即六一散治證同上滑石六兩甘草一兩研細末水調服八正散治臟腑蘊熱大便結祕若二便俱祕先用此以通大便則小便自通車前木通滑石山梔甘草大黃煨瞿麥扁蓄各二錢燈心五分水煎服滋腎丸治腎虛熱結小便不通黃柏知母各二兩酒拌陰乾肉桂二錢為末水和丸空心開水送二百丸若病急亦可煎服此治腎中屬虛陽而無陰以化也若腎中無火而陰無以生者惟滋陰藥中用桂附庶可直達命門設作火治則說矣凡病此者最難刻緩隨證服藥後必用探吐一法急則治標與病喉痹之用針刺等也病在實者清之利之似易見效若氣虛而陰者必其體弱年衰方有此證然病此必有其漸方其小便短少便時費力便宜速治若待其劇恐無及也又有濕熱之邢不在大腸膀胱而在精道壅塞隧路故二便祕宜用芡實茴香穿山甲倍用牽牛為末水調服備揀古來治小便不通至簡至穩神方於後以便取用小便不通用大蒜一枚梔子十二枚鹽二錢共搗貼濟並塗陰囊又方用蔥三斤切細炒熱尉臍下又方用苧麻根搗攤小腹及陰囊小便虛祕兩尺脈微弱用利水藥不效者乃腎中無陽虛寒證也用附子炮去皮一兩鹽水浸一刻澤瀉三錢煎服神效或加燈心三分更妙又方用桃枝柳枝木通川椒各一兩枯白礬三錢蔥白七個燈心一握水三十碗煎至十五碗用瓷罐盛之乘熱熏外腎小腹以被圍之不令風入若冷即易之再燒再熏良久便通如赤豆汁下其效大奇即垂危者亦救老人氣虛小便不通者用黃耆蜜炒二錢陳皮去白一錢甘草八分煎服小便閉小腹痛用木通滑石各五錢牽牛取頭末二錢燈心十莖蔥一莖煎服又方用甘遂大蒜搗貼臍以艾於藥上灸七壯大效又方用田螺少加鹽生搗敷臍下一寸三分即通此異人所授仙方又方用發灰二錢淡米醋湯調服附論小便不禁婦病載婦科小便不禁內經論肝腎膀胱之病不指為何邪所幹故後之議論不一令人莫得其旨而究之病在膀胱源在肺金也金生水肺乃水之高源肺虛則氣不上升下自不固母虛而子亦虛也宜補中益氣湯以補其母加山藥山茱萸牡蠣之類以固澀之或以補中益氣湯送腎氣丸庶得治本之道若肝腎陽氣不旺則膀胱不藏此其咎又在命門所以少壯者陰陽兩足夜少小便及至老年夜多小便者水火俱不足也治以八味地黃丸去澤瀉加骨脂即右歸飲亦妙有睡中遺溺者屬下元虛冷用五子丸縮泉丸悉效小兒之多小便由陽氣尚微不能約束宜於溫補不治亦不足慮至於氣脫而遣無所知覺大非古兆以參耆熟地歸朮桂附大劑為主加以固澀之味為佐則猶有可愈者但凡治小便頻數者切勿以熱擬熱必小便赤澀而痛縱有短少而艱澀者是腎水將竭及氣虛不傳送故也此際用涼用利則速其危矣右歸飲治下元虛寒小便頻數熟地四錢山藥炒二錢棗皮一錢二分枸杞錢半甘草炙一錢杜仲薑製二錢肉桂一錢五分附子制二錢空心服五子丸治小便頻數菟絲子酒蒸家韭子炒益智仁蛇床子去皮炒等分茴香減半上研末酒糊丸鹽湯下縮泉丸亦治小便頻數烏藥益智仁鹽炒等分為末山藥研碎酒煮糊丸空心鹽湯下備揀古來治便數至簡至穩神方於後以便取用小便過多用牡蠣煅赤石脂煅等分酒糊丸鹽湯下小便虛熱而數者用白薇白蘞白芍等分為末米飲調下虛將脫者澀之用菟絲子二兩茴香鹽炒一兩附子制桑螵蛸炙各五錢為末酒糊丸米飲下下元虛寒小便不固用韭子一合白龍骨煅一兩為細末空心酒調服夜多小便用益智仁二十一枚去殼研碎入鹽少許同煎服有奇驗便數莫禁用雄雞腸二具切破洗炙令熟黃益智仁二兩牡蠣煅三兩共為末以獖豬尿脬二個洗淨蒸爛搗為丸空心鹽湯下六脈沉遲無力小便莫固是無火也朝服八味丸料桂附須重澤瀉少許午服六君子湯加益智仁肉桂最妙小便急而數用蘆根去須節煎服三十七論淋癃淋證有氣石血膏勞也熱在上焦者口渴熱在下焦者口不渴有濕在中焦不能生肺者有下焦氣門者小便不通謂之閉小便淋滴謂之癃氣淋小便澀常有餘瀝欲盡不盡石淋莖中痛溺如砂石最難得出膏淋日夜流膏勞淋勞倦即發痛引氣衝血淋溺如血也蓋氣淋由中氣下陷當補而升提之石淋由欲火煎熬七情鬱結及飲食燥熱而然血淋由小腸與膀胱積熱而且心熱移於小腸兼心火而治之得其源也膏淋不澀不痛乃命門之不固也而兼乎濕者有之至於勞淋或稟質素弱或勞心勞力或房勞之後發則氣由小腹上衝痛引外腎所急者在自知攝養治之者必以脈盛大而實者生虛小而澀者死以證而察其寒熱虛實庶不致誤且淋證當分在氣在血而治之以渴與不渴為辨如渴而小便不利熱在上焦氣分肺金主之宜用淡滲之藥如茯苓澤瀉燈心通草車前瞿麥扁蓄之類清其肺以滋水之上源也不渴而小便不利者熱在下焦血分腎與膀胱主之宜用氣味俱陰之藥如滋腎丸黃柏知母各二兩酒浸陰乾肉桂二錢為末蜜丸空心服方中用肉桂者以欲降腎火桂與火邪同體此寒因熱引也姑舉此以為例觸類而長之可也凡一切淋病小便赤澀而痛者必有熱證方以清熱為急若膏淋自流不得以熱論有勞於脾者如思慮過用負重遠行之類宜補中益氣湯與五淋散分進專因思慮者止用歸脾湯若嗜欲甚而施泄太過勞於腎者宜用黃耆湯腎虛而寒者須金匱腎氣丸至於血淋如小腹硬莖中痛者是瘀血也用淮牛膝三兩煎膏合酒服大效但虛人能損胃耳宜四物湯加桃仁紅花酒炒通草牛膝車前丹皮血虛者用六味地黃丸加側柏葉車前子白芍血鮮而脈數有力者乃心與小腸實熱宜山梔丹皮黃連黃柏生地木通車前澤瀉赤茯苓血黑而右尺沉遲者下元虛冶也服金匱腎氣丸然亦有內熱過極反兼水化而血黑者未可便為虛命也又有膏淋阻塞溺孔者須各以脈證辨之黃耆湯治房勞過甚致陰陽兩虛而遺精者黃耆蜜炒熟地各錢半茯苓天冬肉桂各一錢小麥炒當歸甘草炙各八分五味子三分生薑五分水煎出用龍骨細研末一錢合服如有汗者加淨麻黃根蜜炒一錢如汗冷者加附子七八分如發熱自汗或口渴者加石斛二錢沉香散治膏淋阻塞溺孔而出不快臍下妨悶沉香陳皮黃耆蜜炙各三錢半瞿麥一兩桑白皮韭子炒各三錢滑石八錢黃芩甘草各二錢半為末每服二錢米飲調下又方沉香五錢滑石一兩黃耆蜜炙四錢瓷石煅醋淬七次五錢荊芥穗三錢半為末用肉蓯蓉酒洗去甲蒸搗和藥末加煉蜜為丸酒下車前子散治諸淋痛甚車前子四錢淡竹葉荊芥穗赤茯苓燈草水煎空心服又方治血淋並諸淋而熱痛者茵陳淡竹葉木通山梔豬苓瞿麥各一錢甘草五分燈心三分滑石三錢空心服如大便閉者加大黃萆薢分清飲治膏淋兼治白濁萆薢三錢石菖蒲烏藥益智仁各錢半甘草梢八分煎服淋瀝不已以水性就下也惟燥可去濕故用菖蒲烏藥以平濕土之敦阜益智入腎可納氣歸源腎經得令則自閉藏而小便有節至於使水道入於膀胱分清滲濁者萆薢之力也故名萆薢分清飲八正散治心經邪熱臟腑閉結小便赤澀癃閉不通五淋並治但出小便不痛者忌服車前子瞿麥扁蓄滑石大黃煨山梔甘草木通等分為末燈心湯下神效琥珀散治石淋砂淋琥珀肉桂滑石大黃炒葵子膩粉木通木香瓷石煅酒淬七次等分研末每服二錢燈心蔥白湯調服加減八味丸新治命門火衰腎無關鍵其淋如膏不痛不澀日夜頻流卻不自知兩尺脈虛而澀宜補腎陰陽而少加澀品使下遺之路而不虛滑也熟地八兩棗皮淮山藥各四兩茯苓三兩或不用附子四兩肉桂三兩補骨脂鹽炒三兩杜仲鹽炒三兩蓮蕊三兩少則用蓮鬚牡蠣煅醋淬如是者三次淨粉三兩巴戟去心酒浸四兩金櫻子去刺半生者佳三兩蜜丸服或加菟絲子酒蒸四兩六一散治石淋滑石六兩甘草一兩共研細末或加辰砂三錢細研水飛空心水調服又方黃蜀葵花子俱炒二兩為細末每服一錢食前米飲下備揀古來治淋諸證至簡至穩神方於後以便取用莖中痛甚用淮牛膝濃煎入麝香少許服之立效此味乃治淋之聖藥也但虛體當兼補劑用之膏淋如油用甘草三錢滑石一兩海金沙八錢為末每服二錢麥冬湯調下日三服若熱淋切痛甘草湯調海金沙服石淋用瞿麥多多煎服石淋以滑石為主利小便也以山梔為臣降心火從小便出也凡淋病便陰苧麻根煎服砂淋石淋以胡椒三錢朴硝一兩為末每服二錢開水調下石淋用桃樹肢如棗大夏以涼水吞之冬以熱水吞之日三服取膠法於春桃盛時以刀割樹皮久則其膠溢出採之以桑灰湯浸過曬乾用凡淋痛陰塞者以浮水石為末甘草煎湯調服沙石淋痛用九肋鱉甲醋炙研末酒調日三服石自出神效痛為血淋不痛為尿血尿血者由心腎氣結或憂思房勞所致多屬虛寒不可專作熱治有小便頻數莖中切痛與淋證小便澀而痛者不同此因貪色或過食辛熱積有熱毒腐物乘虛入於小腸故便時作痛用蓽薢二兩鹽水炒為末每服二三錢外以蔥湯頻洗穀道則便數及痛自愈三十八論陽痿是證多由腎經虧損命門火衰精氣虛冷者十居七八此外又有憂思太過抑損心脾則病及陽明水穀氣血之海有所虧傷而致者經曰二陽之病發於心脾即此之謂又有大驚卒恐能令人遺尿即傷腎之驗經曰恐懼傷精骨酸痿厥精時自下也又有肝腎濕熱以致宗筋弛縱者亦為陽痿治宜清火以堅骨然必有火證火脈內外相等者方是其證而此僅有之耳須當細辨八味地黃丸方見二卷培補條治腎經虛損而陽痿者人能久服多服能令肥健多子若陰虛甚多加熟地陽虛甚多加桂附胃虛甚多加山藥胃虛寒去丹皮先天不足加鹿茸氣虛甚參湯送服脾虛甚米湯送服虛火甚淡鹽湯送服冬天溫酒送服夏天參麥飲送服氣虛下陷補中湯送服心脾不足歸脾湯送服如是則五臟平和精血日長輸歸於腎而陽自旺矣若人厭常喜新皆未得生精之至理而參透藥性之精微者也仙傳班龍丸治火不甚衰止因氣血薄弱而陽痿者鹿角膠鹿角霜菟絲子酒蒸曬乾熟地各八兩柏子仁去油六兩白茯苓補骨脂炒各四兩上將膠加酒溶化糊丸淡鹽湯空心下七八錢歸脾湯治思慮驚恐而陽痿者必須培補心脾使胃氣漸充則衝任始振而元陽可復也人參黃耆蜜炙白朮當歸茯神各錢半棗仁炒研一錢遠志七分甘草炙陳皮各八分元肉三枚蓮肉七粒引如無氣滯不用木香加味七福飲治憂思恐懼太過者損抑陽氣必須益火乃有生意人參隨便熟地當歸各二三錢白朮枸杞各錢半甘草炙肉桂附子棗皮各一錢棗仁二錢遠志六分空心溫服如夢遺虛滑加牡蠣蓮鬚龍骨之屬滋陰八味丸治陰虛火盛下焦濕熱以致宗筋弛縱者山藥四兩丹皮三兩白茯苓三兩棗皮四兩澤瀉二兩黃柏知母各鹽水炒二三兩熟地八兩搗膏加煉蜜為丸鹽湯下簡易方治腎虛陽痿蛇床子五味子菟絲子等分為末蜜丸每日三服酒下五十丸薛立齊曰按陰莖屬肝之經絡蓋肝者木也得湛露則森立遇酷暑則萎悴若肝因濕熱為患者用龍膽瀉肝湯清肝火導濕熱若因燥熱為思者用六味丸滋腎水養肝血而自安至於固本丸坎離丸俱屬沉寒非腸胃有大熱者不宜用三十九論脫肛附産婦脫肛大腸與肺為表裡肺熱則大腸燥結肺虛則大腸滑脫此固然也但肺之虛非因脾虛不能生金即因腎虛子盜母氣治之者宜以肺為主而脾腎為之源也然其致此之由不僅中氣虛寒不能收攝之一端也有因久痢裡急後重而致者有因酒濕傷脾色欲傷腎而致者有因腎氣本虛關門不固而致者有因濕熱下墜而致者然熱者必有熱證如無熱證便是虛證且氣虛即陽虛必用溫補內經曰下者舉之徐之才曰澀可去脫皆良法也故古人之治此者用參耆朮草升麻之類以升之補之五味烏梅之類以固之澀之外用熏洗收澀之藥無有不愈肛門癢痛多因濕熱生蟲欲成痔瘻看唇便知上唇有瘡蟲觸其臟下唇有瘡蟲蝕其肛宜以雄黃和艾燒煙燻之或用桃葉一斛蒸之極熱納小瓶中坐熏立死補中益氣湯治一切肛門下脫照後加用人參隨便或以時下生北條參三錢代之黃耆蜜炙二三錢白朮錢半當歸土炒甘草炙各一錢陳皮八分升麻酒炒八分柴胡酒炒四分加烏梅三個五味子五分薑棗引如虛中挾火或熱赤腫痛加黃連黃芩槐花之類然非真有火證火脈切忌加入以防苦寒敗脾如久痢虛弱而復裡急後重者加白芍錢半大腹皮毛檳榔各一錢如泄瀉不止者加蓽薢三錢澤瀉一錢木瓜一錢三分煨木香三分濕瀉者加蒼朮錢半水土交濟湯新治脾虛發泄腎虛發熱不食尿赤脫肛等證人參隨便當歸土炒白芍酒炒陳皮甘草炙各一錢白朮炒黃耆蜜炙各二錢熟地砂仁煎水再炒乾三五錢或一兩山藥炒錢半升麻七八分氣虛火浮者蜜炒或鹽水炒三五分柴胡酒炒三分薑棗引如脫肛虛滑加五倍子五味子之類外用熏洗末藥方載後産後脫肛方新治婦人當生用力太過脫肛莫收當歸土炒二錢黃耆蜜炙三錢白朮錢半川芎七分白芍酒炒一錢丹參二錢半益母草二錢甘草炙一錢升麻八分酒引如血氣切痛加山楂二錢外用萆麻子肉錢半搗爛貼頭頂心收即去之下用熏洗法方載後約營煎治濕熱下墜疼痛肛脫蒼朮白芍甘草續斷地榆黃芩槐花荊介各一錢升麻八分烏梅二個如血熱而燥者去蒼朮加生地備揀古來治脫肛至簡至穩神方於後以便取用脫肛用枳殼防風各一兩枯礬二錢煎水乘熱熏洗又方用赤皮蔥韭菜各帶根煎湯入大楓子防風末數錢乘熱熏洗又方用五倍子煎湯洗隨以赤石脂末摻上托入久痢脫肛用訶子赤石脂龍骨各二錢研細末以茶少許和藥摻肛上絹帛揉入又方用鱉頭煅存性入枯礬少詳摻上托入又方用伏龍肝鱉頭骨五錢五倍子二錢共研末先以紫蘇煎湯溫洗後用麻油調藥敷上又方用五倍子三錢明礬二錢煎洗又方用桑葉桃葉煎湯入礬末熏洗肛門腫痛苧麻根搗爛坐之又方用苧麻根煎洗外以木賊研末敷又方用石灰炒熱帛包坐上冷則易之血熱者四物加條芩槐花血虛者四物加白朮茯苓兼痔而痛者四物加槐花黃連升麻久痢者補中加酒炒白芍腎虛者六味丸虛寒者八味丸瀉痢至於脫肛者用石榴皮陳壁土少加明礬煎洗再用五倍子炒研末敷托而上脫肛用大田螺將井水養三四日去泥以雞爪黃連研細末入甲內待化成水以茶洗淨將雞翎蘸掃之以軟帛托上自不再脫也四十論瘰癧瘰癧多生於耳後纏繞項下其初起如豆粒漸如李核或一粒或三五粒按之則動而微痛久之則日甚或頸項強痛或午後微熱夜間口乾食少體倦或堅而不潰或潰而不愈皆由氣血不足故為癆瘵而終經云肝腎虛熱則生癧病機云因虛勞氣鬱所致屬肝膽二經之病二經多氣少血或思慮恚怒以傷肝則木火動搖而血燥然肝火之有餘實由於腎水之不足也陰虛火盛衝擊關津管束之處結成頑核久則潰腐治宜養陰和肝理脾舒郁其瘡自消若不詳脈證虛實而概用追觸攻下以損真元則氣血愈虛必為壞證矣至於結在胸旁及兩脅者此名焉刀病同而治法不異凡脈洪大以元氣虛敗不治面色慘白為金剋木不治眼內赤脈貫瞳人一條一年死二條二年死凡有身體頭項及心胸腹背皆有堅核不痛但作寒熱者此名為結風氣腫也審其是風是火或虛或實治之此外又有癭瘤者癭則著於肩項瘤則隨氣凝結戒食厚味忌用破決凡長大堅硬不移者名曰石癭皮色不變名曰肉癭筋脈露結名曰筋癭赤脈交結者名曰血癭隨憂愁消長者名曰氣癭皆不可妄破照證立方治之惟胎癭破而出其脂粉則愈夏枯草方治瘰癧前後多用夏枯草煎湯代茶或熬膏服並貼更妙以入厥陰血分生血潤燥此病之聖藥也又連翹能入少陽敗毒亦此病之神藥也治瘰癧痰核方治瘰癧初起多宜服此外用下灸法即愈每日用忍冬花蒲公英各五錢夏枯草六錢煎湯服之勿同瘰癧灸法治瘰癧初起取肩顒穴在肩尖骨縫交接處即是灸穴又取曲池穴在肘尖骨縫交接處即是灸穴再以指甲掐兩肩兩肘四所覺患處微有痠麻其穴乃真各灸燈火七壯在左灸左在右灸右左右俱病者俱灸之隨用大蒜切片約三錢厚安患處以蘄艾或三五年之艾於手中擦熟其軟如綿如大豆大一粒安蒜上灸之痛則易艾再挑起蒜勿令大痛傷肉起泡三壯換蒜再灸每日灸蒜十餘片一連四五日或六七日不間以拔郁毒愈多愈妙節上二穴燈火亦以連日灸之為貴如破久不合更用江西豆豉為末以唾津和作餅如前法灸之以助陽氣內服補藥外貼大乙膏即三四年者亦愈又或瘡口已破內核不腐先服益氣養榮湯三五劑次用針頭散敷之以去腐肉或再用艾灸內服前湯益氣養榮湯治氣血損傷四肢頸項等處腫痛或軟或硬或日晡發熱或潰而不斂瘡科補養聖藥人參無者或以沙參或以時下生條參或以山藥代之黃耆鹽水炒當歸川芎熟地白芍酒炒貝母香附茯苓陳皮各一錢柴胡甘草桔梗各六分白朮二錢姜引如口渴加五味子麥冬如往來寒熱重加柴胡地骨皮膿清加人參蜜炒黃耆膜多重加當歸川芎膿不止重加人參黃耆當歸肌肉遲生加白蘞肉桂必效散治瘰癧頑核內服此藥外以針頭散腐之若氣血虛者先服益氣養榮湯數劑後服此方癧毒盡下再服前湯硼砂二錢半輕粉一錢麝香五分巴豆五粒去膜白檳榔一個斑蝥四十個去頭翅同糯米炒共為細末取雞子二個去黃用清調藥仍入殼內以濕紙數層糊口入飯甑蒸熟取出曬乾研末虛者每服五分實者一錢用炒生薑煎酒或滾湯於五更調服如覺小腹痛用益元散六錢溫水調服其毒俱從小便出胎婦勿服此方斑蝥巴豆似為峻利然巴豆能解斑蠻之毒用者勿畏況癧毒之深非此莫解虛者宜補先而攻後或間服之無虞又方用雞子每個入斑蝥一枚飯上蒸熟去斑蝥每日空心食一枚一七便愈若氣虛者佐以益氣養榮湯如神散治瘰癧已潰瘀肉不去瘡口不斂松香一兩白礬三錢共為末麻油調搽濕則干滲針頭散治一切頑瘡內有膿管瘀肉或瘰癧結核不化及潰後不斂宜此藥追觸赤石脂二錢半輕粉麝香各二分半白丁香錢半生砒黃丹各五分蜈蚣一條炙乾研末用一半共為末搽瘀肉上其肉自化若瘡口小或痔瘡用糯米粥和作細條陰乾紝入內外以膏藥貼之內服托裡補藥不久合口替針丸治膿成不得潰者白丁香硇砂真沒藥乳香各一匙糯米四十粒先以石灰一塊置碗內量入水待熱將米排於灰中良久候米如水晶狀取出用之如米未就再用灰制後將各藥末與米再研收貯用時以飯丸麥粒大每用一粒黏瘡頭上其膿自出若附骨等疽及緊要之地宜及時針砭出之為善昆布丸治項下結囊欲成癭者昆布海藻俱酒洗等分焙上為末蜜丸含化咽之或水化服之如肝經病瘰癧癭瘤服調治藥未應者宜此方加膽草酒炒小麥醋炒照上加半生肌散治瘡不合木香輕粉各二錢黃丹五錢枯礬三錢共為細末用豬膽汁拌勻曬乾再研細摻患處此方乃解毒去腐搜膿之劑以毒盡則肉自生大異用龍骨血竭之類以求生肌反增腐爛也凡患瘰癧者或補或攻藥已配就用全穿山甲於項上或左或右取患處之甲二三十片削淨切碎土拌微火炒成珠每劑藥用五六片為引凡手足有病藥力一時難到者亦用此法手病取前腳之甲足病取後腳之甲必要取真在患處者方效此豫屢試屢驗者也備揀古來治瘰癧至簡至穩神方於後以便取用牡蠣煅研粉項下結核以茶引之胸脅堅結以小柴胡湯引之瘰癧初起用萆麻子搗敷又方用海藻昆布洗淨浸酒服滓敷又方以野菊花根擂酒服滓敷又方用姜蠶為末每日水調五分服一月愈立齊治瘰癧諸法焮腫脈沉數者泄之腫痛寒熱脈浮者邪在表也宜發散因怒者疏肝行氣腫痛脈浮洪而數者祛風清熱脈澀者補血為主脈弱者補氣為主腫硬不潰者補氣血為主抑鬱所致者解鬱結調氣血潰後不斂者屬氣血俱虛宜大補虛勞所致者補之因有核而不斂者腐而補之脈實而不斂或不消者下之凡瘰癧用牡蠣粉四兩元參末三兩甘草一兩麵糊丸每用三十丸酒下日三服不拘已潰未潰皆效併除根或用牡蠣四兩甘草一兩為末茶調服一錢神效凡瘰癧治法先用燈火次用隔蒜灸法以連日多灸為貴內服夏枯草方不消脈證實者用必效散毒下即止服補養藥不消再下隨服益氣養榮湯數十劑自消至於潰者亦看虛實虛者內服補藥外用豆豉餅灸法接引陽氣或有瘀肉用如神散搽之或有膿管用針頭散敷之進益氣養榮湯即年久不愈者無不收功若潰後屬實者照前脈證俱實者治法可也
