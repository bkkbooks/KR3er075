body:
  text: 凡例一是書之作因古來醫書最多且有用詩詞歌賦體者在初學固難遍閲而淺學亦難會悟綱本內經兼集名言著為是書名之曰會約醫鏡差去群籍之精蘊約千百言為一二言云一是書各症敘論之內必明是病屬風屬寒屬表屬裡屬虛屬實屬何經何臟之類以後照前論各方治之不敢貽漏一是書本生平之心得者以立言不敢捃托以競繁多隱晦以彰深遠務令一見能解以便取用一是書所載某湯某丸必詳明其症之與脈若何未敢孟浪湯散下有書一新字者是綱照脈照症制之屢試屢驗者一是書所載古方新方之後詳明加減不得謂病必無兼症緒方之上標題數字以便披閲令人見是方治是病不致誤月一是書立論方略必取其中正平穩切於病症之治法者為要詭僻之方怪險之法毫不敢登一是書於淺易之症必慮及深遠不得仿本以貽後患即有難措處者亦必多方設法以救之不忍輕置之也一是書於每症之後備揀古來調治單方詳細廣集恐地分南北有無各異又恐荒村僻野難以辦藥勢急事迫即揀是症單方用之取效最捷一是書所載單方細為揣摩必於脈之虛突病之表裡俱無妨焉方敢摘録閲者詳之一是書於症之宜參者或有未便酌以他藥代之亦不得已而變化之耳至於牛黃天竹黃珊瑚琥珀之類雖或有之而不甚真用之無益故方內不輕載焉一是書詞句篇章不能工雅綱學淺故也然亦只求明達不尚虛文閲者期我諒焉一是書於脈法治法傷寒瘟疫雜症婦科本草似為詳盡至於兒科痘科外科備揀古來切要方論無一不驗者録之以備取用
