front:
  text: 自序昔範文正有云不為良相願為良醫誠以良相輔翼聖君燮變理陰陽俾群生咸安化宇良醫挽回造化拯救困危俾個疾悉登壽域其權異其濟世安民之心則一也自軒岐而下靈樞素問之書傳於奕世後醫如仲景河間東垣丹溪輩皆能深究其理出所心得成一家言凡外感內傷業醫者循而用之每著功效然其得力處固多而各持己見偏誤者亦間有之越人張景嶽起而辨論有以見此道中純粹以精者之難其人也綱何人斯敢著書立説以誤人哉然有不容已於心者憶自少治舉子業即好讀醫書朝夕研求意欲於世稍效一得於病患者又思古人座右語綿世澤莫如為善振家聲還是讀書余家世處湘邑不失敦篤而吾父孤立昆季多人佐家政以司課讀者綱居長厥任尤重因督率群弟奮志藝窗不數年而皆入庠序己卯科四弟國俊得膺多薦已醜科幸捷南宮叨館選荷蒙皇上特恩敕封三代父母均享壽八旬余生逢覃恩邀錫封者十餘年乙巳歲復晉贈為承德郎而綱亦與焉一門之內恩榮四代愧元以報惟午夜抱慚而已綱今者七旬有餘優遊杖履披覽醫書隨境施方其治痼疾以登壽域者難以數記恐後失傳將平日所考脈法治法得諸心而皮之手者會約為一集質諸高明僉云明析簡確在深於醫者不得視為陳言即初學者開卷亦可朗然其於醫道不無小補綱是以付之梓不數月而告成縉紳先生俯賜辨言褒榮華衰倘摘其瑕而明教之是尤綱之所厚望也夫時乾隆五十四年己酉歲孟冬月敕封承德郎翰林院檢討加三級楚南上湘羅國綱振占氏自序
